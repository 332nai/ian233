咸味Pancake很奇怪。整体不错但没有传说中那么神。", "dt": "2026-03-06", "ne": "Paramount Coffee Project", "xy": [743.6, 608.0], "id": 345}, {"n": "Double Cross Dining Room", "a": "Crows Nest", "t": "Cafe/餐厅", "r": "3", "p": 45, "d": "炸鸡、红薯条、Kingfish、烤玉米、明太子意面、虾三明治", "i": "早午餐和午市都受欢迎的Cafe餐厅。Share小菜最出色，炸鸡、红薯条、Kingfish刺身和烤玉米都很好吃；主菜明太子意面、牛排和招牌虾三明治也不错。人均约45刀。", "dt": "2026-03-06", "ne": "Double Cross Dining Room", "xy": [732.0, 426.9], "id": 346}, {"n": "名成海鲜酒楼", "a": "Eastwood", "t": "粤菜酒楼", "r": "3", "p": 55, "d": "鱼香茄子陈村粉、咸蛋黄鸭舌、鲍鱼捞竹升面、雪山叉烧包", "i": "Eastwood的粤菜酒楼，网上差评不少，但实际挺好吃，还有几道特别的菜。鱼香茄子陈村粉很搭；咸蛋黄鸭舌非常好吃；鲍鱼捞竹升面的面最出彩。反沙芋头糖衣太厚。茶点雪山叉烧包也不错。", "dt": "2026-03-05", "ne": "Ming Sing Seafood Restaurant", "xy": [388.5, 307.4], "id": 342}, {"n": "Johnny Gio's Pizza", "a": "Chatswood", "t": "Pizza", "r": "3", "p": 27, "d": "意大利香肠Pizza", "i": "去年新开的薄底Pizza店，火炉现烤，特别香脆，还能看到厨师进出炉的过程。意大利香肠Pizza只有肉碎没有别的配料，味道纯粹。一个27刀，偏贵但确实好吃。", "dt": "2026-03-04", "ne": "Johnny Gio's Pizza", "xy": [666.0, 350.8], "id": 341}, {"n": "Auvers Dining", "a": "Darling Square", "t": "Brunch", "r": "3", "p": 32, "d": "和牛盖饭", "i": "老牌网红Brunch店，不知道吃什么时的稳妥选择。虾三明治一般，馅料松散，不好拿着吃。和牛盖饭很出色，和牛很嫩，拌上蛋黄和米饭非常搭。Cold Brew过得去。", "dt": "2026-03-02", "ne": "Auvers Dining", "xy": [712.8, 589.8], "id": 340}, {"n": "安娜手工水饺", "a": "Carlingford", "t": "手工水饺", "r": "3", "p": 23, "d": "馄饨、馅饼、生煎包、锅贴、速冻酸菜猪肉饺", "i": "住宅区里朴实的手工饺子小店，全手工制作，很多人一次买上百刀的速冻饺子。馄饨、馅饼、生煎包和锅贴都好吃，酸菜猪肉速冻饺子值得带回家。价格很便宜，人均约23刀。", "dt": "2026-03-01", "ne": "Anna's Handmade Dumplings", "xy": [302.4, 293.0], "id": 339}, {"n": "Amah by Ho Jiak", "a": "Chatswood Interchange", "t": "马来西亚融合", "r": "3", "p": 55, "d": "肉骨茶小笼包、新加坡辣椒蟹虾饺、烧鸭肠粉", "i": "Ho Jiak旗下的马来西亚融合菜，菜单很有创意，有肉骨茶小笼包、新加坡辣椒蟹虾饺、肉松小贝炸鸡和人气烧鸭肠粉。烧鸭肠粉的烧鸭约五成熟，肉还是粉色的，非常嫩。不必专程，但是很好的工作日午餐选择。", "dt": "2026-02-28", "ne": "Amah by Ho Jiak", "xy": [664.6, 326.0], "id": 336}, {"n": "The Annex Coffee House", "a": "Chatswood", "t": "咖啡", "r": "3", "p": 6, "d": "Cold Brew", "i": "上班路上的温暖小咖啡店，门口和旁边铺面有几个座位，厨房全开放。Cold Brew酸度足，很提神，小杯6刀。", "dt": "2026-02-28", "ne": "The Annex Coffee House", "xy": [648.2, 346.2], "id": 337}, {"n": "Italian Street Kitchen", "a": "Bella Vista", "t": "意大利菜", "r": "3", "p": 45, "d": "炸墨鱼圈、海鲜烩饭、窑烤Pizza、提拉米苏", "i": "Bella Vista人工湖边的意大利餐厅。炸墨鱼圈稳妥；海鲜烩饭略咸但很入味；窑烤Pizza拉丝十足；提拉米苏软绵。湖边还有不少餐厅可选。", "dt": "2026-02-28", "ne": "Italian Street Kitchen", "xy": [65.8, 148.9], "id": 338}, {"n": "Grandfather's", "a": "Angel Place, CBD", "t": "中餐", "r": "X", "p": 70, "d": "XO炒米粉底", "i": "环境灯光又红又暗的中餐厅，体验很差。菜品咸到发慌，虾多士外壳硬得磕上颚，辣子鸡像隔夜盐酥鸡回炒。只有XO酱炒Pipi配米粉底属于正常水平。人均约70刀，不推荐。", "dt": "2026-02-26", "ne": "Grandfather's", "xy": [717.1, 581.3], "id": 333}, {"n": "Lune Croissanterie", "a": "Martin Place Metro", "t": "可颂", "r": "3", "p": 10, "d": "每日口味可颂", "i": "墨尔本名店Lune在悉尼的分店，除了Rosebery，CBD也有一家。可颂每天有不同口味，每个约10刀，排队有理由，扁平车轮造型的可颂很好吃。", "dt": "2026-02-26", "ne": "Lune Croissanterie", "xy": [733.8, 558.1], "id": 334}, {"n": "Sneaker Laundry", "a": "Martin Place Metro", "t": "咖啡/洗鞋店", "r": "3", "p": 12, "d": "Mont Blanc Cold Brew", "i": "地铁站里的洗鞋店，同时卖饭团、牛角包和咖啡，组合很神奇。Cold Brew特调Mont Blanc清甜浓郁，很好喝。", "dt": "2026-02-26", "ne": "Sneaker Laundry", "xy": [737.4, 566.7], "id": 335}, {"n": "Dear Florence", "a": "Prefecture 48, Sussex St, CBD", "t": "法式甜品", "r": "3", "p": 14, "d": "巧克力蛋糕、新年限定蜜柑蛋糕", "i": "法式甜品店，蛋糕精致漂亮，有巧克力口味和农历新年限定蜜柑口味等。价格高，小小一块二十多刀，大约四口吃完，但确实好吃。", "dt": "2026-02-24", "ne": "Dear Florence", "xy": [712.9, 600.3], "id": 332}, {"n": "ibushi", "a": "Prefecture 48, Sussex St, CBD", "t": "日料（两帽）", "r": "2", "p": 130, "d": "烤虾滑、Tuna Tartare、Beef Tartare", "i": "Prefecture 48集团旗下刚拿到两帽的日本餐厅。每道菜都不错但不惊艳，烤虾滑、Tuna Tartare和Beef Tartare较出色。现场炭烤的猪五花很香，入口却一般。人均约130刀，对两帽来说不算贵。", "dt": "2026-02-23", "ne": "ibushi", "xy": [728.8, 603.8], "id": 331}, {"n": "Doughkyo", "a": "World Square", "t": "烘焙", "r": "3", "p": 12, "d": "吐司", "i": "从Parramatta开到市中心的烘焙店。面包偏有韧性，吐司最好，接近日式生吐司的口感，涂牛油果加一颗煎蛋就很好吃。", "dt": "2026-02-22", "ne": "Doughkyo", "xy": [718.4, 589.1], "id": 330}, {"n": "Golden Brown Pancake & Bakery Cafe", "a": "Pitt St, CBD", "t": "Cafe/烘焙", "r": "2", "p": 22, "d": "日式大虾意面、Pancake", "i": "市中心木质调小店，面包蛋糕陈列很漂亮。日式大虾意面很香；Pancake蓬松但偏油，奶味重。店里不卖咖啡。", "dt": "2026-02-21", "ne": "Golden Brown Pancake & Bakery Cafe", "xy": [747.7, 564.7], "id": 328}, {"n": "SweetDay Dessert", "a": "Silverwater", "t": "蛋糕店", "r": "4", "p": 14, "d": "花束蛋糕、梦龙卷、瑞士卷、马卡龙", "i": "藏在工业区里的蛋糕店，用动物奶油，裱花细致。可以定制花束蛋糕并送货上门。平时卖瑞士卷和马卡龙，梦龙卷脆皮香、蛋糕松软、巧克力酱绵密，非常好吃。不是网红店，没有花哨装饰，胜在扎实的好味道。", "dt": "2026-02-21", "ne": "SweetDay Dessert", "xy": [307.9, 456.3], "id": 329}, {"n": "Mogu Mogu Onigiri Community", "a": "Surry Hills", "t": "饭团", "r": "4", "p": 12, "d": "现制饭团", "i": "以喷枪炙烤出名的饭团店，现做现捏，制作过程很治愈，小朋友特别喜欢。老板夫妇很亲切，熟客很多。", "dt": "2026-02-16", "ne": "Mogu Mogu Onigiri Community", "xy": [727.1, 628.2], "id": 327}, {"n": "Slim's Quality Burger", "a": "Westfield Sydney", "t": "汉堡", "r": "3", "p": 20, "d": "安格斯牛肉汉堡、手切薯条、3刀冰淇淋", "i": "Westfield Sydney里的美式汉堡店，靠窗座位可以看街景。用100%澳洲安格斯牛肉，薯条新鲜手切，冰淇淋每天店内现做，一大球只要3刀，很良心。汉堡用锡纸包着保温，很用心。", "dt": "2026-02-15", "ne": "Slim's Quality Burger", "xy": [731.2, 567.6], "id": 325}, {"n": "Daily Spoon", "a": "Eastwood", "t": "韩国小菜外带", "r": "3", "p": 20, "d": "酱蟹、鹌鹑蛋、辣鱿鱼刺身、泡菜老豆腐", "i": "新开的韩国小菜专门店，店面宽敞明亮，小菜摆得整整齐齐。酱蟹新鲜不辣；鹌鹑蛋、辣鱿鱼刺身和泡菜老豆腐都很下饭，也很适合配酒。四样约50刀，适合在家聚餐时买。", "dt": "2026-02-15", "ne": "Daily Spoon", "xy": [395.3, 335.9], "id": 326}, {"n": "Wilson Cafe", "a": "Surry Hills", "t": "咖啡", "r": "X", "p": 10, "d": "椰子水冷萃", "i": "有一根烟囱的漂亮咖啡馆。椰子水冷萃不太好喝，不推荐。", "dt": "2026-02-14", "ne": "Wilson Cafe", "xy": [754.0, 624.2], "id": 322}, {"n": "Luigi Panini", "a": "Surry Hills", "t": "意式Panini", "r": "3", "p": 18, "d": "佛罗伦萨Panini（牛肉干配胡桃果酱）", "i": "近期很红的意式Panini店，各款以意大利城市命名，制作过程现削肉片、层层铺上面包再挤酱，很好看。佛罗伦萨款夹牛肉干和胡桃果酱，调味很香，面包略硬。份量大，一个人吃不完。", "dt": "2026-02-14", "ne": "Luigi Panini", "xy": [730.6, 608.5], "id": 323}, {"n": "Bondi Boulangerie", "a": "Surry Hills", "t": "可颂", "r": "3", "p": 9, "d": "Mardi Gras彩虹可颂", "i": "源自法国西南部、有50年家族历史的可颂店，会推出主题限定款，例如Mardi Gras彩虹可颂，里面夹巧克力酱。一个9刀。", "dt": "2026-02-14", "ne": "Bondi Boulangerie", "xy": [737.4, 636.9], "id": 324}, {"n": "Bills", "a": "Surry Hills", "t": "Brunch", "r": "3", "p": 35, "d": "Hotcake、滑蛋吐司", "i": "十几年的老牌顶流Brunch，至今仍要排长队。Hotcake是招牌，绵密松软，淋上枫糖浆非常经典；滑蛋吐司偏奶。", "dt": "2026-02-13", "ne": "Bills", "xy": [752.1, 610.4], "id": 320}, {"n": "小兔砂锅麻辣烫", "a": "Chatswood", "t": "东北黏糊麻辣烫", "r": "3", "p": 20, "d": "砂锅麻辣烫（麻酱配米线）、炸串", "i": "Chatswood的东北黏糊麻辣烫。砂锅麻辣烫都是素菜，可以加钱加肉，一锅很大，两人分刚好；麻酱配米线最搭。炸串蓬松好吃。人均不到20刀，适合当工作日食堂。", "dt": "2026-02-13", "ne": "Little Rabbit Claypot Malatang", "xy": [675.0, 342.2], "id": 321}, {"n": "OTTO Ristorante", "a": "Woolloomooloo", "t": "意大利菜", "r": "3", "p": 100, "d": "龙虾刺身小冰淇淋、Beef Tartare、牛排、泥蟹意面", "i": "Woolloomooloo码头边的老牌意大利餐厅，阳光好时坐在码头边看游艇很惬意。赶时间可以提前告诉服务员，上菜会很快。龙虾刺身小冰淇淋、Beef Tartare、牛排和泥蟹意面都好吃。人均约100刀。", "dt": "2026-02-12", "ne": "OTTO Ristorante", "xy": [765.4, 564.4], "id": 319}, {"n": "Fired Up Roast Chicken", "a": "Pennant Hills", "t": "烤鸡", "r": "2", "p": 22, "d": "水煎包", "i": "Pennant Hills的烤鸡店，换了老板后烤鸡偏干，炸鸡粉偏厚，但水煎包好吃。外带用保温冰袋，很用心。适合匆忙时解决一顿。", "dt": "2026-02-10", "ne": "Fired Up Roast Chicken", "xy": [373.7, 152.1], "id": 317}, {"n": "Luna Lu", "a": "The Rocks", "t": "中西融合", "r": "5", "p": 120, "d": "牡丹玫瑰饺、M4牛排、鸭肉、宫保菜花", "i": "The Rocks景观最好的中西融合餐厅之一，露天座位可以看到海港大桥和歌剧院全景。菜品把西式摆盘和中式味道结合得精致又顺口。新年限定牡丹玫瑰饺很喜庆；M4牛排火候极好；鸭肉份量足，皮脆肉嫩；宫保菜花保留川菜灵魂，香辣脆嫩又不油。人均约120刀能吃得非常饱，以景色、氛围和水准来说合理。", "dt": "2026-02-10", "ne": "Luna Lu", "xy": [739.4, 540.4], "id": 318}, {"n": "JOMARU Korean Hot Pot", "a": "Eastwood（亦有Strathfield店）", "t": "韩式猪骨锅", "r": "3", "p": 35, "d": "辣泡菜猪骨锅三重奏：猪骨、拉面、炒饭", "i": "起家于Strathfield的韩式猪骨锅，现在Eastwood也有。辣泡菜猪骨锅三步吃：先啃猪骨，肉嫩到脱骨；再下拉面吸饱汤汁；最后用剩汤炒紫菜饭。份量很大，吃不完可以打包回家煮辛拉面。", "dt": "2026-02-08", "ne": "JOMARU Korean Hot Pot", "xy": [410.0, 309.4], "id": 315}, {"n": "Yeodongsik", "a": "Eastwood（Lidcombe也有店）", "t": "韩国菜（一帽）", "r": "2", "p": 30, "d": "紫苏油荞麦面、虾韭菜煎饼", "i": "从Lidcombe开到Eastwood的一帽韩国餐厅，晚市开门前就会排队，建议提前到。招牌紫苏油荞麦面青草味很重，见仁见智。虾韭菜煎饼薄而脆，很好吃。菜单很简单，选择不多。", "dt": "2026-02-08", "ne": "Yeodongsik", "xy": [380.4, 319.3], "id": 316}, {"n": "Loin King Cafe", "a": "Homebush West", "t": "韩式三明治", "r": "3", "p": 20, "d": "炸虾碎蛋厚吐司Sando、拉丝芝士条", "i": "韩式三明治店，炸虾、碎鸡蛋和厚吐司的Sando搭配得刚好。拉丝芝士条可以拉很长，小朋友很爱。人均约20刀，很划算。", "dt": "2026-02-07", "ne": "Loin King Cafe", "xy": [363.2, 557.7], "id": 311}, {"n": "Kenangan Coffee", "a": "Druitt St, CBD", "t": "咖啡", "r": "2", "p": 10, "d": "Cranberry Cold Brew、海盐芝士小面包", "i": "印尼连锁咖啡品牌，Cranberry Cold Brew中规中矩。海盐芝士小面包可以当早餐。", "dt": "2026-02-07", "ne": "Kenangan Coffee", "xy": [713.1, 556.2], "id": 312}, {"n": "CHAR CHAR BANH MI", "a": "The Galeries（美食广场）", "t": "越南包", "r": "3", "p": 16, "d": "脆皮猪五花越南包", "i": "Galeries楼下美食广场的越南包店。脆皮猪五花口味很好吃，鹅肝酱给得足，可惜只涂下层面包，上层略干。一个16刀不便宜，在市中心可以接受。", "dt": "2026-02-07", "ne": "CHAR CHAR BANH MI", "xy": [725.9, 573.9], "id": 313}, {"n": "Gyukatsu Kyoto Katsugyu", "a": "Pitt St, CBD", "t": "日式炸牛排", "r": "3", "p": 58, "d": "55刀澳洲牛排炸牛排饭、温泉蛋蘸料", "i": "日本连锁的京都炸牛排饭，开业初期要排大队，现在基本不用。A5牛排偏腻，55刀的澳洲牛排已经够嫩够好吃。撒料和酱汁选择多，每口都能换不同味道，蘸温泉蛋最好吃。每人配一个小炉子，可以把牛排再煎熟一些。人均约58刀。", "dt": "2026-02-07", "ne": "Gyukatsu Kyoto Katsugyu", "xy": [733.3, 586.5], "id": 314}, {"n": "Nomad", "a": "Surry Hills", "t": "木火现代澳菜", "r": "4", "p": 100, "d": "带子、鱼糜、Flatbread、牛排、烤鸡、烤鱼", "i": "以木火烹饪出名的现代澳菜，水准一贯稳定，菜单变化不大。前菜带子和鱼糜、主菜牛排、烤鸡和烤鱼都很嫩很好吃。甜品有创意但偏甜。不喝酒人均约100刀。", "dt": "2025-11-29", "ne": "Nomad", "xy": [722.5, 620.4], "id": 309}, {"n": "Don Don", "a": "Strathfield", "t": "韩国猪手", "r": "3", "p": 40, "d": "韩国猪手、炸鸡、海苔饭团、海鲜饼、冷面、芝士年糕", "i": "老牌韩国餐厅，以韩国猪手出名。炸鸡、海苔饭团、海鲜饼、冷面和芝士年糕也都好吃，可以配榛果米酒，适合朋友聚餐。", "dt": "2025-11-29", "ne": "Don Don", "xy": [428.5, 577.1], "id": 310}, {"n": "Attenzione", "a": "Redfern", "t": "意大利菜", "r": "3", "p": 100, "d": "薯片夹熏鳟鱼糜、鲍鱼三明治、牛排、鸭胸", "i": "Redfern小有名气的意大利餐厅，氛围很好，整体好吃但偏咸。前菜薯片夹熏鳟鱼糜和鲍鱼三明治很有创意；意面很Creamy；主菜牛排和鸭胸肉质好但咸。人均约100刀。", "dt": "2025-11-28", "ne": "Attenzione", "xy": [718.0, 637.3], "id": 308}, {"n": "Huxtaburger", "a": "Redfern", "t": "汉堡", "r": "2", "p": 20, "d": "Sandra炸鸡汉堡", "i": "墨尔本起家的美式汉堡店，汉堡都用人名命名，例如Sandra、Kevin、Rachel和Ruby，很有趣。炸鸡汉堡Sandra很美式，但味道平平无奇。", "dt": "2025-11-24", "ne": "Huxtaburger", "xy": [721.6, 645.9], "id": 306}, {"n": "Crystal Jade 翡翠宫", "a": "Ryde Eastwood Leagues Club", "t": "粤菜酒楼", "r": "3", "p": 55, "d": "大颗Pipis、干炒牛河、咸蛋黄虾球、鱼香茄子煲", "i": "Eastwood附近Club里的粤菜小酒楼，比预期好吃。Pipi个头特别大；干炒牛河火候刚好，非常好吃；咸蛋黄虾球和鱼香茄子煲也不错。会员可享折扣。", "dt": "2025-11-24", "ne": "Crystal Jade", "xy": [418.4, 357.8], "id": 307}, {"n": "Doodee King", "a": "Westfield Chatswood（天桥下）", "t": "泰国菜", "r": "3", "p": 40, "d": "脆皮猪五花炒粿条、小油条蘸斑斓酱、泰奶、炸猪皮", "i": "Westfield天桥下小木屋里的泰国菜。脆皮猪五花炒粿条里猪五花比粿条还多；烤虾泡饭是酸甜辣口，可能吃不惯；小油条蘸斑斓酱必点；泰奶配炸猪皮很过瘾。人均约40刀。", "dt": "2025-11-23", "ne": "Doodee King", "xy": [651.7, 326.4], "id": 304}, {"n": "早点见面", "a": "Gordon Village", "t": "上海生煎/点心", "r": "4", "p": 25, "d": "生煎包（原味、墨汁虾仁）、鲜肉馄饨加荷包蛋、小笼包", "i": "Gordon的上海生煎点心店。生煎有原味、墨汁虾仁和泡菜三种口味，可点单拼、双拼或三拼，咬开大爆汁，汤汁满满。鲜肉馄饨加荷包蛋和小笼包也好吃。人均约25刀。", "dt": "2025-11-23", "ne": "Zao Dian Jian Mian", "xy": [588.6, 203.5], "id": 305}, {"n": "濠 Gou Sushi", "a": "Glebe", "t": "午市Omakase", "r": "3", "p": 60, "d": "20贯寿司加三文鱼味噌汤", "i": "午市Omakase每人60刀，包括20贯寿司和一碗三文鱼味噌汤，平均每贯不到3刀，和旋转寿司差不多价。午市人少，节奏舒服。食材普通，份量不算很饱，但以价格来说无可挑剔。", "dt": "2025-11-21", "ne": "Gou Sushi", "xy": [681.5, 603.8], "id": 303}, {"n": "Poetica Bar & Grill", "a": "North Sydney（Metro站对面）", "t": "西餐", "r": "4", "p": 70, "d": "Yumba Prawn、Beef Tartare、牛排、当日鱼、薯条", "i": "North Sydney Metro站出口对面的西餐厅，环境好，交通方便。Yamba Prawn鲜甜，酱汁有层次；生牛肉塔塔细腻，荧光绿调味汁很惊喜；牛排火候刚好；当日鱼Snapper皮脆肉嫩。薯条香脆到停不下来，值得点。适合聚餐和约会。", "dt": "2025-11-20", "ne": "Poetica Bar & Grill", "xy": [728.9, 475.3], "id": 302}, {"n": "Barrel One Coffee Roasters", "a": "Lane Cove", "t": "贝果/咖啡", "r": "3", "p": 14, "d": "芝士鸡蛋贝果", "i": "Lane Cove的贝果咖啡店，红色调很美式。芝士鸡蛋贝果现煎鸡蛋很香，隔天用空气炸锅烤五分钟依然外脆里嫩，芝士流心。", "dt": "2025-11-19", "ne": "Barrel One Coffee Roasters", "xy": [620.6, 393.3], "id": 301}, {"n": "Komo Katsu（白天为Lof Cafe）", "a": "Rhodes", "t": "日式炸猪排", "r": "3", "p": 28, "d": "干扁香脆型猪排", "i": "Rhodes河边的店铺，白天是Lof Cafe，傍晚五点后变成日式炸猪排店Komo Katsu。猪排是薄而香脆的类型，份量很大，吃几块就会腻，建议分享。傍晚河边夕阳很美。", "dt": "2025-11-15", "ne": "Komo Katsu (Lof Cafe by day)", "xy": [408.1, 453.3], "id": 300}, {"n": "Cam On Restaurant", "a": "Market City", "t": "越南菜", "r": "X", "p": 10, "d": "虾多士、油条泡牛肉汤", "i": "9.8刀的越南简餐，便宜但不好吃。虾多士淀粉太多，油条泡牛肉汤也一般，不推荐。", "dt": "2025-11-12", "ne": "Cam On Restaurant", "xy": [716.0, 608.6], "id": 296}, {"n": "Chubby Cubby Cafe", "a": "Haymarket（UTS附近）", "t": "Cafe", "r": "2", "p": 22, "d": "椰子水抹茶奶盖、提拉米苏", "i": "UTS附近的可爱咖啡店，常坐满写作业的大学生。有不少创意饮品，例如椰子水抹茶奶盖，新鲜感强但不算好喝。提拉米苏偏硬挺，一般。适合坐下来放空。", "dt": "2025-11-12", "ne": "Chubby Cubby Cafe", "xy": [732.0, 594.9], "id": 297}, {"n": "渔膳煌 Spice Palace", "a": "Chatswood", "t": "木桶鱼/中餐", "r": "3", "p": 45, "d": "木桶鱼汤、荔蓉香酥鸭", "i": "以木桶鱼为招牌的中餐馆。木桶内衬不锈钢，倒入滚烫鱼汤后再放生鱼片焖熟，汤鲜美，鱼肉嫩滑。荔蓉香酥鸭芋泥和鸭肉结合得好，外壳酥脆。其他菜式中规中矩。", "dt": "2025-11-12", "ne": "Spice Palace", "xy": [658.5, 354.9], "id": 298}, {"n": "胡家客栈 Hu's Inn", "a": "Chatswood", "t": "台湾菜", "r": "4", "p": 40, "d": "卤肉饭、盐酥鸡", "i": "小众但好吃的台湾菜小店，店面很小，服务员说话温柔，带台湾腔。卤肉饭和盐酥鸡非常好吃；阿萨姆奶茶偏奶。值得反复去。", "dt": "2025-11-12", "ne": "Hu's Inn", "xy": [673.1, 328.4], "id": 299}, {"n": "Marrickville Pork Roll", "a": "Chatswood Interchange", "t": "越南包", "r": "2", "p": 13, "d": "越南包", "i": "起家于Marrickville的人气越南包，现在Chatswood也有分店。好吃但没有传说中那么神，在众多越南包里略显普通。一个13刀，价格正常。", "dt": "2025-11-11", "ne": "Marrickville Pork Roll", "xy": [643.6, 338.3], "id": 294}, {"n": "一香自助火锅", "a": "Chatswood（原大东北位置）", "t": "自助火锅", "r": "2", "p": 25, "d": "肉、鱼、丸子、蔬菜、熟食", "i": "Chatswood原大东北位置的自助火锅，每人二十多刀，非常便宜。肉、鱼、丸子、蔬菜和熟食一应俱全，能吃饱，但味道一般。", "dt": "2025-11-11", "ne": "Yixiang Hotpot Buffet", "xy": [672.9, 351.4], "id": 295}, {"n": "二孃", "a": "Top Ryde Shopping Centre（Rhodes也有）", "t": "火锅", "r": "3", "p": 50, "d": "鲜鸭血、卤味", "i": "Top Ryde商场里的火锅店，Rhodes也有分店。装修有点奇怪，但味道不错，鲜鸭血好吃，卤味也好。人不多，没有一般火锅店的嘈杂。人均约50刀。", "dt": "2025-11-08", "ne": "Er Niang Hotpot", "xy": [460.1, 390.1], "id": 293}, {"n": "Le Foote", "a": "The Rocks", "t": "法餐", "r": "4", "p": 100, "d": "烤大虾、牛排", "i": "The Rocks的法餐厅，满墙法式艺术画，很有氛围。烤大虾好吃，牛排地道，酒也好喝。适合姐妹聚会和约会，人均约100刀。", "dt": "2025-11-01", "ne": "Le Foote", "xy": [729.0, 525.8], "id": 292}, {"n": "Ocean King Fish Market", "a": "Burwood", "t": "海鲜店（可代烹饪）", "r": "4", "p": 40, "d": "咸蛋黄皇帝虾（八只33刀）", "i": "Burwood主街上的海鲜店，可以挑选生海鲜请店家现场烹饪。例如八只皇帝虾做成咸蛋黄口味，广东师傅现场颠勺，五分钟出锅，香气扑鼻，约33刀。适合想吃新鲜海鲜又不想自己下厨的时候。", "dt": "2025-10-30", "ne": "Ocean King Fish Market", "xy": [445.5, 599.7], "id": 289}, {"n": "Yurica Japanese Kitchen", "a": "Macquarie Park", "t": "日料", "r": "2", "p": 60, "d": "炸Snapper、寿司、和牛", "i": "街边的日料店，味道不错但价格偏高，人均约60刀份量不多。炸Snapper好吃，寿司新鲜，和牛够嫩，其他一般。", "dt": "2025-10-30", "ne": "Yurica Japanese Kitchen", "xy": [495.0, 285.3], "id": 290}, {"n": "Mister Gee", "a": "North Strathfield", "t": "汉堡", "r": "2", "p": 16, "d": "汉堡、鸡柳", "i": "汉堡店，牛肉饼够厚够嫩，一个16刀，不便宜。鸡柳很一般。", "dt": "2025-10-30", "ne": "Mister Gee", "xy": [415.8, 529.2], "id": 291}, {"n": "乐乐炸串 Happy Skewers", "a": "Chinatown", "t": "炸串", "r": "2", "p": 15, "d": "脆皮鸡柳、苕皮、爆浆豆腐、淀粉肠", "i": "新开的炸串店，选择不多，有脆皮鸡柳、苕皮、爆浆豆腐、土豆片和淀粉肠。整体还行，但不如来一串和夸父炸串。价格很便宜，人均约15刀。", "dt": "2025-10-28", "ne": "Happy Skewers", "xy": [709.6, 594.2], "id": 288}, {"n": "Abb Air Thai", "a": "World Square", "t": "泰国菜", "r": "5", "p": 35, "d": "沙爹鸡肉串配吐司、虾饼、烤鸡腿", "i": "小小一家却坐满人的泰国菜，非常惊艳。沙爹鸡肉串配烤得焦香的吐司，可以做成开放三明治；虾饼蓬松，外皮酥脆、内里弹牙多汁；烤鸡腿嫩得不可思议。人均约35刀，强烈推荐。", "dt": "2025-10-27", "ne": "Abb Air Thai", "xy": [726.6, 610.7], "id": 286}, {"n": "Daniel's", "a": "World Square", "t": "甜甜圈", "r": "2", "p": 8, "d": "万圣节甜甜圈", "i": "普通的甜甜圈店，节日会推出主题款，例如万圣节甜甜圈，味道和一般甜甜圈没有区别。", "dt": "2025-10-27", "ne": "Daniel's", "xy": [725.1, 585.8], "id": 287}, {"n": "A3 Coffee", "a": "World Square（W Cosmetic旁）", "t": "咖啡", "r": "3", "p": 10, "d": "Peach Long Black", "i": "W Cosmetic旁边新开的Cafe，创意口味很多。Peach Long Black把桃子的清甜和黑咖啡的苦涩融合得刚好。Double Rose Latte也值得一试。", "dt": "2025-10-26", "ne": "A3 Coffee", "xy": [708.7, 606.0], "id": 284}, {"n": "海鲜大排档", "a": "West Ryde", "t": "港式海鲜大排档", "r": "3", "p": 40, "d": "蒸生蚝、XO Pipi、咸蛋黄虾仁、清汤牛腩煲、手撕走地鸡、干炒牛河", "i": "港式海鲜大排档，食客很多是香港人，网上分享可以拿到一瓶XO酱。蒸生蚝、XO酱炒Pipi、咸蛋黄虾仁、清汤牛腩煲、手撕走地鸡和干炒牛河都很好吃。可惜Pipi有沙，冻柠茶里没有柠檬片。份量大，人均约40刀，吃不完可以打包。", "dt": "2025-10-26", "ne": "Seafood Dai Pai Dong", "xy": [416.0, 377.2], "id": 285}, {"n": "S'Bread House", "a": "Lane Cove（Canopy外）", "t": "越南包", "r": "2", "p": 16.5, "d": "脆皮猪五花越南包", "i": "Canopy外一座独立小房子里的越南包店。脆皮猪五花越南包整体不错，但调味偏保守，少了越南包那种放肆的香气，算不上第一梯队。一个16.5刀，偏贵，附近可以一试，狂热爱好者不必专程。", "dt": "2025-10-23", "ne": "S'Bread House", "xy": [624.2, 401.9], "id": 283}, {"n": "The Hill Thai Restaurant", "a": "West Pennant Hills", "t": "泰国菜", "r": "3", "p": 35, "d": "沙爹虾串、芋头春卷、芒果糯米饭", "i": "被鲜花簇拥的泰国菜小店。沙爹虾串弹牙，芋头春卷的芋泥很好吃；蛋网泰式炒米粉造型新颖，但配的脆皮鸡太柴。芒果糯米饭好吃。人均约35刀。", "dt": "2025-10-22", "ne": "The Hill Thai Restaurant", "xy": [289.5, 202.8], "id": 282}, {"n": "The Ugly Bakery", "a": "West Ryde", "t": "肉桂卷", "r": "3", "p": 7.3, "d": "糖霜肉桂卷", "i": "专做肉桂卷的烘焙店，据说连不爱肉桂的人都会喜欢。糖霜肉桂卷很好吃，一个7.3刀，不便宜。傍晚去选择较少。", "dt": "2025-10-21", "ne": "The Ugly Bakery", "xy": [432.0, 363.6], "id": 280}, {"n": "Bonjour Vietnam", "a": "Lindfield（Pacific Hwy）", "t": "越南菜", "r": "2", "p": 30, "d": "椰子咖啡、和牛粉", "i": "Pacific Hwy上越南风情浓厚的越南餐厅。椰子咖啡很好喝，椰子沙冰和越南咖啡融合得好。和牛粉不是真和牛，但粿条本身不错。鸡肉沙拉又干又柴，不要点。菜单不大，已不卖越南包。人均约30刀。", "dt": "2025-10-21", "ne": "Bonjour Vietnam", "xy": [628.9, 272.5], "id": 281}, {"n": "Green Shiso Omakase", "a": "Circular Quay", "t": "Omakase", "r": "5", "p": 300, "d": "春季Omakase", "i": "藏在市中心小巷里的Omakase，氛围很好，每位约268刀，团队是中国人，可以用普通话讲解，主厨Simon谦逊可爱，气氛轻松。套餐融入怀石元素，食材丰富，搭配有新意，份量非常足。酒肴八寸里Toro配海胆酱最出色；金目鲷釜饭用高汤炊饭，配时令蔬菜和炭烤金目鲷，热乎治愈，可以续饭；北海道和牛油脂丰富，配山葵酱解腻。寿司十贯，喉黑、海胆、赤身和大腹最好。甜品是静冈蜜瓜和焦糖布丁。厨师很用心，柴鱼片都是现刨的。菜单随季节更换，含酒水人均约300刀。", "dt": "2025-10-20", "ne": "Green Shiso Omakase", "xy": [731.4, 543.3], "id": 279}, {"n": "ester", "a": "Chippendale", "t": "现代澳菜", "r": "4", "p": 105, "d": "烤虾配面包蘸虾油、砂锅鸭肉饺子、血肠吐司", "i": "开了十多年的现代澳菜名店，品质和氛围一如既往。烤虾特别好，面包蘸虾油很好吃；砂锅鸭肉饺子有东方特色；味噌鳕鱼一般；外表不起眼的血肠吐司是全场最佳。人均约105刀，能吃很饱。", "dt": "2025-10-19", "ne": "ester", "xy": [712.2, 615.4], "id": 278}, {"n": "福记潮汕肠粉铺", "a": "唐人街建德大厦", "t": "潮汕肠粉", "r": "5", "p": 26, "d": "猪肉鸡蛋肠粉、卤味粿汁、沙姜鸡、猪骨生蚝粥、南乳鸡翅、甘草水果", "i": "建德大厦里在潮汕人圈子很火的肠粉铺，是悉尼少有的潮汕肠粉。猪肉鸡蛋肠粉复刻度很高；卤味粿汁皮、沙姜鸡、南乳鸡翅都好吃；猪骨生蚝粥浓郁但份量小；还有悉尼少见的甘草水果。不是百分百正宗，但已经很难得。人均约26刀。", "dt": "2025-10-09", "ne": "Fook Kee Teochew Rice Rolls", "xy": [735.6, 602.1], "id": 275}, {"n": "Edomae Sushi 江户前寿司", "a": "Haymarket（唐人街到Market City转角）", "t": "旋转寿司", "r": "3", "p": 35, "d": "海胆鹅肝手卷", "i": "唐人街往Market City转角的旋转寿司，江户前把悉尼旋转寿司的水准带到了新高度。鱼种多，非常新鲜，海胆鹅肝手卷很好吃。人均约35刀。", "dt": "2025-10-09", "ne": "Edomae Sushi", "xy": [712.2, 586.3], "id": 276}, {"n": "Ohmami", "a": "Glebe（悉尼大学对面）", "t": "Cafe", "r": "2", "p": 22, "d": "肉松卷、草莓抹茶、甜甜圈", "i": "悉尼大学公园对面的Cafe，招牌肉松卷很抢手，一早就会卖完，想吃要早点去。草莓抹茶和甜甜圈都普通。", "dt": "2025-10-09", "ne": "Ohmami", "xy": [671.1, 589.1], "id": 277}, {"n": "燊记", "a": "Chatswood（Mandarin Centre美食广场）", "t": "港式云吞面/小吃", "r": "4", "p": 18, "d": "墨鱼饼、腐皮虾卷、细蓉竹昇面", "i": "Mandarin Centre美食广场里不起眼的港式小吃店，味道很正宗。墨鱼饼外皮煎得焦脆，内里是弹牙墨鱼肉；腐皮虾卷酥脆不油；细蓉汤底清甜，用的是传统竹升面。", "dt": "2025-10-08", "ne": "Sun Kee", "xy": [659.7, 321.1], "id": 273}, {"n": "Smelly Cheesecake", "a": "Chatswood火车站（Eastwood等地也有）", "t": "韩式Cafe/芝士蛋糕", "r": "3", "p": 12, "d": "卡通芝士蛋糕、紫薯芝士蛋糕、黑芝麻蛋糕、大虾意面", "i": "开了很多年的韩式芝士蛋糕Cafe，Eastwood等地都有分店，Chatswood火车站也开了。卡通芝士蛋糕完全复刻Emoji造型，像从猫和老鼠动画里跑出来一样，非常可爱；紫薯芝士蛋糕也受好评。", "dt": "2025-10-08", "ne": "Smelly Cheesecake", "xy": [648.7, 353.2], "id": 274}, {"n": "Jeon & Kalguksu Jip", "a": "Lidcombe", "t": "韩国刀切面/煎饼", "r": "4", "p": 45, "d": "手工刀切面（海鲜、牛骨汤）、牛肉煎饼、辣猪排骨火锅", "i": "地道的韩式刀切面和煎饼店。手工刀切面筋道，海鲜和牛骨汤底都有层次；牛肉煎饼蛋液外皮酥脆，牛肉薄嫩，配葱丝很好吃，值得加点。辣猪排骨火锅暖胃，但不如面和煎饼出色。店小，只有约六张桌子。人均约45刀。", "dt": "2025-10-06", "ne": "Jeon & Kalguksu Jip", "xy": [315.7, 556.3], "id": 270}, {"n": "11:11 Sweet", "a": "Lane Cove", "t": "甜品", "r": "3", "p": 14, "d": "草莓抹茶、提拉米苏", "i": "Lane Cove Plaza旁的小甜品店。草莓抹茶抹茶味浓不苦，草莓酸甜中和厚重感，很适合春夏。提拉米苏很软但酒味不足。适合一个人静静坐着发呆。", "dt": "2025-10-06", "ne": "11:11 Sweet", "xy": [628.0, 390.4], "id": 271}, {"n": "Sushi Train", "a": "Lane Cove", "t": "旋转寿司", "r": "3", "p": 37, "d": "寿司", "i": "几十年的老牌旋转寿司，近年焕新，环境更干净明亮现代。食材新鲜、鱼种丰富，寿司米煮得刚好，粒粒分明又有黏性。人均约37刀，不算便宜。", "dt": "2025-10-06", "ne": "Sushi Train", "xy": [615.6, 397.5], "id": 272}, {"n": "一顿小烧烤", "a": "Eastwood", "t": "烧烤", "r": "4", "p": 50, "d": "羊肉串、烤鸭肠、宫后夹肉、烤羊排", "i": "可以自己动手烤，也可以让后厨代烤的烧烤店，小朋友很爱参与。串类多又入味，烤鸭肠、羊肉串、青椒、宫后夹肉、鸡爪和年糕都好吃。必点烤羊排，外焦里嫩，一撕就脱骨，蘸辣椒面吃。人均约50刀。", "dt": "2025-10-05", "ne": "Yidun BBQ", "xy": [409.8, 332.4], "id": 269}, {"n": "Nour", "a": "Surry Hills", "t": "中东菜", "r": "5", "p": 80, "d": "泡菜鸡肉卷、蒜酱脆皮土豆、烤章鱼、烤菜花", "i": "Surry Hills的中东菜，开了多年依然好吃，网上三千多条评价仍保持4.8高分。前菜很惊艳，泡菜鸡肉卷、蒜酱脆皮土豆和烤章鱼都好，酱料好到值得加点Pita来蘸。烤菜花必点，牛排好吃但无特色。甜品非常甜，要慎点。", "dt": "2025-10-03", "ne": "Nour", "xy": [751.9, 633.4], "id": 265}, {"n": "Jun's Malaysian Kitchen", "a": "Eastwood", "t": "马来菜", "r": "3", "p": 25, "d": "滑蛋鸳鸯、虾酱鸡翅、咖喱炒Pipi", "i": "Eastwood新开的马来菜，开业优惠期饭点要排队，建议早到。主食选择多，适合小朋友。大人可以试马来风光、咖喱炒Pipi和虾酱鸡翅，风味很足，滑蛋鸳鸯和虾酱鸡翅最好吃。", "dt": "2025-10-03", "ne": "Jun's Malaysian Kitchen", "xy": [396.5, 302.1], "id": 266}, {"n": "Binchotan", "a": "West Ryde", "t": "日式烤肉", "r": "2", "p": 65, "d": "和牛、下酒菜", "i": "以备长炭为名的日式烤肉店。其中一盘和牛的雪花纹理过于规整，疑似注脂肉，点和牛时可以留意。其余菜式不错，老板热情，会送下酒小菜。人均约65刀。", "dt": "2025-10-03", "ne": "Binchotan", "xy": [409.6, 362.9], "id": 267}, {"n": "不二烫捞", "a": "Wentworth Point", "t": "麻辣烫/肠粉", "r": "3", "p": 22, "d": "加蛋加猪肉肠粉", "i": "Wentworth Point的麻辣烫店，新增广式肠粉。加蛋加猪肉肠粉皮薄透亮，现蒸现做，猪肉馅嫩滑，蛋香足。酱汁只是普通酱油，层次不够，是小遗憾。", "dt": "2025-10-03", "ne": "Bu Er Malatang", "xy": [378.5, 434.5], "id": 268}, {"n": "上海小馄饨", "a": "Ryde（Top Ryde对面）", "t": "上海点心", "r": "4", "p": 20, "d": "小馄饨、小笼包、锅贴", "i": "Top Ryde商场对面低调的上海点心店，现包现煎现煮，开放式厨房干净透明。小馄饨皮薄馅嫩，汤底只放紫菜和虾皮就很鲜；小笼包皮薄汤多，先吸汤再吃，小心烫；锅贴底部金黄酥脆，配店里的辣酱很好吃。值得一去。", "dt": "2025-10-02", "ne": "Shanghai Wontons", "xy": [463.7, 398.7], "id": 264}, {"n": "Winghaus", "a": "Entertainment Quarter", "t": "鸡翅/体育酒吧", "r": "3", "p": 30, "d": "Mango Habanero鸡翅", "i": "鸡翅体育酒吧，几十台电视同步直播各种球赛，看球氛围很好。Mango Habanero口味果香清甜，几乎不辣，鸡翅外皮焦香，肉质嫩。适合球迷和鸡翅爱好者。", "dt": "2025-10-01", "ne": "Winghaus", "xy": [778.9, 643.2], "id": 263}, {"n": "朝阳 Chaoyang Delicious", "a": "Wentworth Point（华超内）", "t": "北京菜", "r": "4", "p": 25, "d": "卤煮火烧、千层肉饼、豌豆黄、糖火烧", "i": "藏在华人超市里的北京菜，很低调，店里满是京腔。卤煮火烧的肥肠、猪肉和豆腐泡炖得入味不腻，火烧吸满汤汁；千层肉饼外皮酥脆、层次分明、肉香十足。甜品豌豆黄细腻不齁甜，糖火烧外焦里软。人均约25刀。", "dt": "2025-09-29", "ne": "Chaoyang Delicious", "xy": [382.1, 443.1], "id": 261}, {"n": "Mary's", "a": "Entertainment Quarter（Newtown也有）", "t": "炸鸡", "r": "5", "p": 20, "d": "炸鸡", "i": "起家于Newtown地下酒吧的炸鸡名店，换了地点依然出色。外皮酥到掉渣，里面鸡汁爆开，连鸡胸肉都不柴，堪称灌汤炸鸡，外皮香料咸香美式。比KFC贵一些，但值得。", "dt": "2025-09-29", "ne": "Mary's", "xy": [775.9, 640.5], "id": 262}, {"n": "Oh Boo Chocolates", "a": "Barangaroo", "t": "巧克力", "r": "3", "p": 15, "d": "自选巧克力礼盒（每颗3至4刀）", "i": "高级海滨街道上低调的巧克力店，全店深蓝色，很好看。可以自选礼盒，一颗约3到4刀，精致得像艺术品，适合送礼。", "dt": "2025-09-28", "ne": "Oh Boo Chocolates", "xy": [710.1, 542.2], "id": 256}, {"n": "Epicurean", "a": "Crown Sydney", "t": "自助餐", "r": "4", "p": 105, "d": "生蚝、鸭腿、三文鱼腩、甜品", "i": "Crown酒店的自助餐，景色很好。生蚝、鸭腿、三文鱼腩和甜品都不错，选择多，小朋友也会很开心。午市成人105刀，周末145刀，12岁以下半价，午市来最划算。", "dt": "2025-09-28", "ne": "Epicurean", "xy": [713.7, 550.8], "id": 257}, {"n": "Frankie Cadillac", "a": "Surry Hills", "t": "酒吧", "r": "3", "p": 45, "d": "鸡尾酒", "i": "路边的小酒吧，墙上挂满油画，氛围高雅又带点阴森，往里走是灯光四射的吧台。菜单注解很可爱。鸡尾酒还行，蛋糕不好吃，来喝酒就好。", "dt": "2025-09-28", "ne": "Frankie Cadillac", "xy": [738.6, 603.1], "id": 258}, {"n": "Bessie's & Alma's", "a": "Surry Hills", "t": "现代酒馆", "r": "4", "p": 105, "d": "葱油饼、烤大虾、吞拿鱼薯饼、煎无骨鸡、煎鱼", "i": "Bar Copains的姐妹店，现代酒馆风格，灯光昏暗，吧台热闹，开放式厨房很忙碌。葱油饼、烤大虾、吞拿鱼薯饼、煎无骨鸡和煎鱼都好吃，鸡肉嫩得惊人，吞拿鱼刺身配薯饼很有趣。整体偏咸，适合配酒。适合约会和姐妹小聚，人均约105刀。", "dt": "2025-09-28", "ne": "Bessie's & Alma's", "xy": [727.7, 635.2], "id": 259}, {"n": "Kumadon 熊吞", "a": "Westfield Chatswood美食广场", "t": "日式盖饭", "r": "3", "p": 15, "d": "安格斯牛肉粒Don加饮料", "i": "Chatswood Westfield美食广场的日式盖饭，安格斯牛肉粒盖饭加一杯饮料只要14.8刀，牛肉烧得嫩，份量足，性价比很高。", "dt": "2025-09-28", "ne": "Kumadon", "xy": [679.2, 336.5], "id": 260}, {"n": "Fiore Sandwich", "a": "Barrack Place, CBD", "t": "三明治", "r": "3", "p": 10, "d": "Mortadella三明治", "i": "简单的西式三明治店，Mortadella三明治是汉堡造型，带籽硬面包夹火腿片和芝士，健康又好吃。一个10刀，适合工作日午餐。", "dt": "2025-09-27", "ne": "Fiore Sandwich", "xy": [739.0, 549.7], "id": 252}, {"n": "Firegrill", "a": "Barrack Place, CBD", "t": "西餐", "r": "2", "p": 100, "d": "赠送南瓜汤和面包", "i": "市中心Barrack Place的西餐厅，两层楼高的水晶吊灯像宫殿一样，略显浮夸。食物在平均线以上，每桌送南瓜汤和面包。人均约100刀，适合商务午餐。", "dt": "2025-09-27", "ne": "Firegrill", "xy": [709.3, 573.5], "id": 253}, {"n": "Tessuto", "a": "York St, CBD", "t": "意式咖啡", "r": "2", "p": 10, "d": "开心果Espresso", "i": "市中心写字楼下的意式咖啡馆，墙上插画和吧台上的柠檬都很有南意风情。开心果Espresso杯口沾满果仁碎，但非常苦。", "dt": "2025-09-27", "ne": "Tessuto", "xy": [748.0, 576.0], "id": 254}, {"n": "福恩手作中式糕点", "a": "Eastwood（乐购门口）", "t": "中式糕点", "r": "4", "p": 10, "d": "蛋黄酥、芋泥酥、松仁豆沙、鲜肉月饼", "i": "超市门口的小糕点柜台，产品不多，常常快卖完。蛋黄酥、芋泥酥、松仁豆沙和鲜肉月饼都很好吃，用空气炸锅加热5分钟，酥皮一碰就掉，馅料厚实，一颗能顶一顿早饭。", "dt": "2025-09-27", "ne": "Fu En Handmade Chinese Pastries", "xy": [385.6, 334.2], "id": 255}, {"n": "Mansun Pocha", "a": "Eastwood", "t": "韩式鱼生", "r": "3", "p": 50, "d": "65刀刺身拼盘、芝士玉米、烤三文鱼寿司", "i": "Eastwood的韩式鱼生店，配泡菜、紫苏叶、紫菜、辣蒜酱和麻油，可以自由组合。65刀刺身拼盘很新鲜，芝士玉米和烤三文鱼寿司也不错。人均约50刀，能吃很饱。", "dt": "2025-09-26", "ne": "Mansun Pocha", "xy": [416.1, 317.5], "id": 250}, {"n": "257私房菜", "a": "Eastwood", "t": "上海菜", "r": "3", "p": 40, "d": "咸蛋黄狮子头、小笼包、红油抄手、砂锅活鱼、黑芝麻圆子", "i": "人气稳定的上海菜馆，订位很严格，迟到超过5分钟就不留位，周末晚上非常满。咸蛋黄狮子头、小笼包、红油抄手、咕噜肉和砂锅活鱼都好吃，活鱼汤尤其值得点。甜品黑芝麻流心汤圆很好吃。食材新鲜，价格合适。", "dt": "2025-09-26", "ne": "257 Private Kitchen", "xy": [381.5, 309.0], "id": 251}, {"n": "Hungry Paulie 愛呷囝仔", "a": "Eastwood", "t": "台湾菜", "r": "3", "p": 30, "d": "麻辣鸭血臭豆腐、金衣苦瓜、卤肉饭、蛋饼、饭团", "i": "适合点外卖的台湾菜。麻辣鸭血臭豆腐非常够味；金衣苦瓜很好吃；卤肉饭、蛋饼、炒米粉和饭团都稳定，卤肉饭不如禚家和福利社。人均约30刀。", "dt": "2025-09-25", "ne": "Hungry Paulie", "xy": [401.7, 339.3], "id": 249}, {"n": "Gacha Cafe", "a": "George St, CBD", "t": "日式甜品", "r": "3", "p": 14, "d": "芒果绵绵冰、冰淇淋大福", "i": "悉尼较早做冰淇淋大福的日式甜品店，后来增加了绵绵冰、饭团和樱花系列。芒果绵绵冰入口即化，芒果味浓，甜而不腻。店内外各有一整面扭蛋机墙，小朋友会很喜欢。", "dt": "2025-09-22", "ne": "Gacha Cafe", "xy": [720.7, 547.4], "id": 247}, {"n": "金唐海鲜酒家", "a": "Crown Sydney", "t": "粤菜酒楼", "r": "5", "p": 55, "d": "龙虾三吃、清蒸星斑、雪蟹、鲍鱼、XOPP、奶黄月饼", "i": "老牌高档粤菜酒楼，适合宴请。龙虾三吃鲜甜弹牙，雪蟹肉细嫩，清蒸星斑火候极好、酱油讲究，白灼鲍鱼Q弹。乳鸽、XO酱炒Pipi和和牛也都出色。现烤奶黄流心月饼是压轴甜品，外皮酥香，内馅流心。", "dt": "2025-09-22", "ne": "Golden Century Seafood Restaurant", "xy": [717.5, 539.3], "id": 248}, {"n": "南洋茶室", "a": "Liverpool St, CBD", "t": "南洋菜", "r": "3", "p": 17, "d": "海南鸡、炒粿、Kaya Toast配半熟蛋", "i": "南洋风味小馆。海南鸡够嫩；炒粿过关，换成萝卜糕会更好；Kaya Toast和半熟蛋非常成功。人均约17刀，非常划算。", "dt": "2025-09-21", "ne": "Nanyang Tea Room", "xy": [721.6, 587.7], "id": 245}, {"n": "Order Lemon", "a": "Eastwood", "t": "手打柠檬茶", "r": "3", "p": 9, "d": "茯砖茶柠檬茶、鸭屎香柠檬茶、雨林茉莉柠檬茶", "i": "Eastwood的手打柠檬茶店，鲜切、手锤、冰摇，现场制作，看店员锤柠檬很解压，店里满是柠檬香。新品用了小众的茯砖茶。推荐鸭屎香柠檬茶、雨林茉莉柠檬茶和小红袍爆柠茶。", "dt": "2025-09-21", "ne": "Order Lemon", "xy": [407.4, 302.5], "id": 246}, {"n": "Ramen Goku", "a": "Glebe Point Rd, Glebe", "t": "日式拉面", "r": "2", "p": 20, "d": "Hakata Tonkotsu、煎饺", "i": "Glebe Point Rd上日本人经营的拉面店，食客也多是日本人。博多豚骨拉面和煎饺好吃但平平无奇。价格很实惠，人均20刀以内，有集点卡，消费满9刀累计20次可换一碗免费拉面。", "dt": "2025-09-20", "ne": "Ramen Goku", "xy": [668.7, 608.6], "id": 242}, {"n": "Gleebooks 书店咖啡厅", "a": "Glebe", "t": "书店咖啡", "r": "3", "p": 15, "d": "冰摩卡", "i": "Glebe很有氛围的独立书店，适合慢慢逛上一两个小时。", "dt": "2025-09-20", "ne": "Gleebooks", "xy": [684.6, 594.9], "id": 243}, {"n": "El Camino Cantina", "a": "Moore Park", "t": "墨西哥菜", "r": "3", "p": 35, "d": "Nachos、Pink Lemonade", "i": "墨西哥风情浓厚的餐厅，霓虹灯、骷髅元素、复古海报和热辣音乐，很热闹。Nachos超大一盘，玉米片酥脆，铺满融化芝士、豆泥和牛油果。Pink Lemonade酸甜清爽。", "dt": "2025-09-20", "ne": "El Camino Cantina", "xy": [779.5, 649.0], "id": 244}, {"n": "Sappho Books, Cafe & Bar", "a": "Glebe", "t": "书店咖啡", "r": "3", "p": 15, "d": "咖啡", "i": "Glebe街角的二手书店兼咖啡酒吧，像时光机一样充满旧时光的氛围。", "dt": "2025-09-18", "ne": "Sappho Books, Cafe & Bar", "xy": [662.3, 594.2], "id": 240}, {"n": "来一串（Eastwood夜市）", "a": "Eastwood台湾夜市", "t": "炸串/夜市", "r": "3", "p": 20, "d": "炸串；同夜市Sip&Snack普洱奶茶、甜辣鸭热卤鸭肠", "i": "连锁炸串品牌来一串在Eastwood夜市的摊位，好吃但不算惊艳，市中心电影院那家更好，也不如Chatswood的夸父炸串。", "dt": "2025-09-18", "ne": "Lai Yi Chuan (Eastwood night market)", "xy": [377.7, 326.3], "id": 241}, {"n": "The Lobo", "a": "Clarence St, CBD", "t": "地下朗姆酒吧", "r": "4", "p": 50, "d": "Old Grogram火焰朗姆鸡尾酒", "i": "市中心很有戏剧感的地下朗姆酒吧，以古巴糖业大亨Julio Lobo命名。走下螺旋楼梯，深色木家具、藤椅、红色皮沙发和烛光营造出加勒比风情。有300多款朗姆酒，推荐火焰点燃的Old Grogram鸡尾酒，视觉效果十足。", "dt": "2025-09-17", "ne": "The Lobo", "xy": [748.6, 556.9], "id": 238}, {"n": "Letra House", "a": "Kent St, CBD（Palazzo Salato地下）", "t": "西班牙Tapas", "r": "3", "p": 60, "d": "红虾Tostadas、咸鱼奶酪甜甜圈、煎火腿、牛排", "i": "藏在Palazzo Salato地下一层的人气西班牙酒馆，灯光昏黄，音乐轻柔。Tapas选择多：红虾Tostadas是生腌红虾配脆玉米饼，鲜甜爆汁；咸奶酪甜甜圈甜咸交织；煎火腿和牛排份量大，配酸辣泡椒。整体偏咸。", "dt": "2025-09-17", "ne": "Letra House", "xy": [707.1, 561.4], "id": 239}, {"n": "Black Star Pastry", "a": "Rosebery", "t": "烘焙", "r": "3", "p": 12, "d": "与金唐联名XO Pipi Pie", "i": "知名烘焙店Black Star和金唐海鲜酒家合作的限定Pie，灵感来自XO酱炒Pipi，由粤菜师傅炒制带子和大虾内馅，包在金黄酥脆的千层酥皮里，配炸面条、青葱和XO酱，是很成功的中西融合。", "dt": "2025-09-16", "ne": "Black Star Pastry", "xy": [721.1, 722.5], "id": 236}, {"n": "Mentmore and Morley", "a": "Rosebery", "t": "菲律宾Cafe", "r": "4", "p": 22, "d": "Beef Short Ribs、炭烤鸡", "i": "近来小火的菲律宾Cafe，一早就有烤肉。Beef Short Ribs好吃，烤鸡炭香浓郁、皮脆肉嫩，蘸辣酱更好。还有菲律宾猪手和脆皮五花肉等菜式。", "dt": "2025-09-16", "ne": "Mentmore and Morley", "xy": [718.0, 719.7], "id": 237}, {"n": "Sydney Tuna", "a": "Lidcombe", "t": "韩式金枪鱼刺身", "r": "5", "p": 37, "d": "九宫格蓝鳍金枪鱼刺身（110刀）", "i": "Lidcombe韩式鱼生街上的金枪鱼专门店，招牌是九宫格蓝鳍金枪鱼刺身，从赤身到中腹、大腹，每格一个部位，切得厚实新鲜，大腹入口即化，有时还会送稀有的金枪鱼背。一套110刀，附带泡菜、芝士玉米、鱼饼乌冬和手握寿司，够三人吃饱。人均约37刀，性价比极高。", "dt": "2025-09-10", "ne": "Sydney Tuna", "xy": [305.3, 541.6], "id": 235}, {"n": "Cardea", "a": "Barangaroo", "t": "剧场式酒吧餐厅", "r": "3", "p": 100, "d": "龙虾卷、牛排、西班牙小土豆、生蚝", "i": "怀旧奢华的剧场式酒吧餐厅，红色天鹅绒沙发、璀璨吊灯和复古家具，像三十年代的夜上海。每晚有不同主题的现场演出，例如爵士乐。食物融合多国风味，龙虾卷、牛排、西班牙小土豆和生蚝都不错。人均约100刀，吃喝加看演出，也很出片。", "dt": "2025-09-09", "ne": "Cardea", "xy": [705.0, 546.4], "id": 234}, {"n": "Bottega Coco", "a": "Barangaroo", "t": "意大利甜品/Pizza", "r": "3", "p": 30, "d": "歌剧院造型巧克力蛋糕、芒果慕斯、天鹅蛋糕", "i": "意大利甜品和Pizza店，晚上九点还满座，Pizza炉一直火力全开。招牌是悉尼歌剧院造型的蛋糕，外壳是硬巧克力，敲开里面是巧克力慕斯和椰丝。芒果慕斯和天鹅蛋糕也不错。甜品加茶人均约30刀。", "dt": "2025-09-07", "ne": "Bottega Coco", "xy": [720.9, 550.0], "id": 233}, {"n": "Besuto", "a": "Circular Quay", "t": "Omakase", "r": "4", "p": 300, "d": "和牛、牙鱼、茶碗蒸、木盒刺身", "i": "隐藏在地下酒吧后面的Omakase，入口很隐蔽。共5道菜、6贯寿司、一份汤和一份甜品，能吃饱。前面的和牛、牙鱼、茶碗蒸和木盒刺身尤其出色，食材不算顶级，但技术和摆盘过关。主厨现在态度友善。每人250刀，含酒水人均约300刀。", "dt": "2025-09-05", "ne": "Besuto", "xy": [747.2, 546.8], "id": 232}, {"n": "Ramen Shogun", "a": "Ultimo", "t": "日式拉面", "r": "4", "p": 30, "d": "炸鸡排盖饭、豚骨拉面、饺子、烧鸟串", "i": "低调但很好吃的日式拉面店。炸鸡排盖饭超脆超嫩；豚骨拉面浓郁不腻，吃完不口渴；饺子爆汁；烧鸟串大串嫩滑，大葱清甜。蔬菜天妇罗偏油。人均约30刀，份量大。", "dt": "2025-09-04", "ne": "Ramen Shogun", "xy": [697.2, 603.5], "id": 231}, {"n": "Pho Co", "a": "Eastwood", "t": "越南粉", "r": "3", "p": 30, "d": "和牛牛肉粉、甘蔗虾、香茅猪排", "i": "Eastwood开了多年的越南粉店，在竞争激烈的街上屹立不倒。和牛牛肉粉不错，还有儿童份量。甘蔗虾和香茅猪排值得点。人均约30刀。", "dt": "2025-09-03", "ne": "Pho Co", "xy": [416.4, 328.8], "id": 229}, {"n": "Soban by Joseon", "a": "Olympic Park（火车站旁）", "t": "韩国釜饭", "r": "3", "p": 30, "d": "安格斯牛肉釜饭、炸虾、提拉米苏", "i": "火车站旁新开的韩国釜饭，只在周日营业，常要排一小时，鱼饭和章鱼饭容易售罄。安格斯牛肉釜饭非常嫩且入味，配小菜包进紫菜吃很好。一份很大，两个女生可以分。炸虾硕大弹牙，饺子一般，提拉米苏很软很好吃。", "dt": "2025-09-03", "ne": "Soban by Joseon", "xy": [365.8, 497.5], "id": 230}, {"n": "东街口鲜捞面馆", "a": "Hurstville", "t": "福建面馆", "r": "3", "p": 20, "d": "麻酱拌面、拌粉、炸鸡排、炸馄饨、炖汤", "i": "Hurstville的福建面馆，被不少人列为当地必吃，合南方人口味又便宜。麻酱拌面和拌粉很香；炸鸡排和炸馄饨酥脆；炖汤套餐养生。人均约20刀，份量足。", "dt": "2025-09-02", "ne": "Dongjiekou Noodle House", "xy": [452.6, 877.7], "id": 227}, {"n": "Kafe Washoku", "a": "Westfield Miranda", "t": "日料", "r": "4", "p": 40, "d": "Deluxe刺身、和牛刺身、三文鱼Don、照烧鸡腿饭", "i": "南区新开的日料店，刺身非常新鲜，能看到厨师现场开鱼，Deluxe刺身拼盘很值得点。寿司、和牛刺身、玉米、三文鱼丼和照烧鸡腿饭都好吃。人均约40刀，非常实惠。", "dt": "2025-09-02", "ne": "Kafe Washoku", "xy": [455.3, 1093.2], "id": 228}, {"n": "钓鱼郎私人厨房 Fishboy Private Kitchen", "a": "Telopea", "t": "粤菜", "r": "3", "p": 30, "d": "走地鸡、梅菜扣肉、椰汁栗子芋头煲、冻柠茶", "i": "粤菜小馆，走地鸡很嫩，梅菜扣肉香。最惊艳的是椰汁栗子芋头煲，芋头粉糯，椰汁香甜浓郁，很下饭。冻柠茶和苦瓜蜜瓜饮也好喝。每桌配核桃仁和XO酱小菜，店里也有独立包装出售。人均约30刀。", "dt": "2025-08-31", "ne": "Fishboy Private Kitchen", "xy": [294.7, 326.4], "id": 224}, {"n": "Johnny's Pizza & Pasta", "a": "West Pennant Hills", "t": "Pizza", "r": "3", "p": 28, "d": "Meat Pizza", "i": "号称有悉尼最大尺寸Pizza的Pizza店，生意很忙。Meat Pizza底部铺了一层咸牛肉末，每一口都很香。", "dt": "2025-08-31", "ne": "Johnny's Pizza & Pasta", "xy": [286.4, 200.0], "id": 225}, {"n": "富强面包店 King's Hot Bread", "a": "Hurstville", "t": "越南包", "r": "4", "p": 13.5, "d": "脆皮猪五花越南包", "i": "Hurstville的人气越南包，在悉尼排得上名次，常要排队。脆皮猪五花越南包13.5刀，略贵但好吃，现场吃很惊艳，隔天用空气炸锅复热依然好吃，可以算悉尼前三名。", "dt": "2025-08-31", "ne": "King's Hot Bread", "xy": [449.6, 874.9], "id": 226}, {"n": "乐乐酥 Lebakery", "a": "Chatswood Place（Eastwood也有）", "t": "中式烘焙", "r": "3", "p": 10, "d": "咸蛋黄贝果、黑芝麻碱水包、芋头酥", "i": "从Eastwood开到Chatswood Place的中式烘焙，店面更大。咸蛋黄贝果、黑芝麻碱水包和芋头酥都好吃，芋头酥最值得买。下午货架容易空。", "dt": "2025-08-30", "ne": "Lebakery", "xy": [644.7, 328.0], "id": 223}, {"n": "Yook Korean Restaurant", "a": "Chatswood Place", "t": "韩国菜", "r": "3", "p": 19, "d": "釜山猪肉汤饭、辣豆腐和牛汤饭、炸酱面", "i": "性价比很高的韩国餐厅，晚上有烤肉，午市套餐每份不超过19刀，有釜山猪肉汤饭、辣豆腐和牛汤饭、炸酱面等，味道不马虎，出餐快，适合上班族。", "dt": "2025-08-29", "ne": "Yook Korean Restaurant", "xy": [664.9, 358.3], "id": 222}, {"n": "大湘小串", "a": "Burwood", "t": "湘西小串/湘菜", "r": "4", "p": 35, "d": "塌豆腐、牛肉、鸡爪小串、锅巴小炒黄牛肉、生炒酸萝卜肥肠", "i": "好吃却不太出名的湘西小串店。塌豆腐、牛肉和鸡爪串特别好吃，撒料拌饭一绝。也能点湘菜，锅巴小炒黄牛肉、烟熏笋炒腊肉和生炒酸萝卜肥肠都很下饭。卤粉可以做不辣的给小朋友。服务热情。人均约35刀。", "dt": "2025-08-26", "ne": "Daxiang Skewers", "xy": [472.4, 595.7], "id": 218}, {"n": "Sergio's Cake Shop", "a": "Top Ryde（Coles层）", "t": "法式甜品", "r": "3", "p": 14, "d": "泡芙、千层酥", "i": "Coles同层的法式甜品店，便宜大碗，很多款按斤卖，像批发工厂。蛋糕3个13刀，6个25刀。泡芙和千层酥都好吃，偏甜，但酥皮薄如蝉翼，和奶油融合得刚好。", "dt": "2025-08-26", "ne": "Sergio's Cake Shop", "xy": [467.5, 387.3], "id": 219}, {"n": "大米潮味正宗潮汕肠粉", "a": "Top Ryde（通利超市旁）", "t": "潮汕肠粉", "r": "X", "p": 16, "d": "肠粉、鱼汤", "i": "Top Ryde通利超市旁海鲜店里的潮汕肠粉柜台。肠粉皮黏糊，鱼汤带土腥味，不好吃。员工很友善，满25刀送豆浆，豆浆倒是好喝。", "dt": "2025-08-26", "ne": "Dami Teochew Rice Rolls", "xy": [455.0, 394.4], "id": 220}, {"n": "Zushi", "a": "Surry Hills", "t": "现代日料", "r": "3", "p": 90, "d": "刺身、和牛、烟熏鸭、味噌三文鱼", "i": "现代日料，干净简洁，菜单不复杂。刺身新鲜、种类多；和牛软嫩；鸭肉烟熏味香；味噌三文鱼特别好吃。适合姐妹聚会和约会，人均约90刀。", "dt": "2025-08-26", "ne": "Zushi", "xy": [758.2, 618.5], "id": 221}, {"n": "Play Coffee", "a": "Eastwood（Lidcombe和Beecroft也有）", "t": "咖啡", "r": "3", "p": 10, "d": "焙茶", "i": "在Lidcombe、Beecroft和Eastwood都有分店的咖啡店，咖啡豆得过奖。焙茶浓郁好喝，是Eastwood韩式Cafe的有力竞争者。", "dt": "2025-08-21", "ne": "Play Coffee", "xy": [389.1, 300.3], "id": 215}, {"n": "Snack Town", "a": "Eastwood（火车站门口）", "t": "韩国街头小吃", "r": "3", "p": 20, "d": "滑蛋Hash Brown三明治、韩式热狗", "i": "Eastwood火车站门口的韩国街头小吃店，卖热狗、炸鸡、三明治和年糕。滑蛋薯饼三明治内容丰富，鸡蛋很嫩；韩式热狗小朋友喜欢。人均约20刀。", "dt": "2025-08-21", "ne": "Snack Town", "xy": [390.0, 340.5], "id": 216}, {"n": "Jean's Grill Chicken", "a": "Eastwood Hotel", "t": "韩式烤鸡", "r": "X", "p": 45, "d": "辣烤鸡、饭团", "i": "Eastwood的韩式辣烤鸡，烟熏香气足，辣度高，但鸡腿肉很柴；饭团米饭不黏，散成一粒粒。人均约45刀，不推荐。", "dt": "2025-08-21", "ne": "Jean's Grill Chicken", "xy": [417.0, 309.7], "id": 217}, {"n": "Auntie Anne's", "a": "Westfield Parramatta", "t": "蝴蝶饼", "r": "3", "p": 8, "d": "3-cheese蝴蝶饼", "i": "美国知名蝴蝶饼连锁店，开到悉尼后周末要排队约半小时。店内手工制作，有甜有咸，搭配多种蘸酱。3-cheese口味外脆内软，很好吃。", "dt": "2025-08-20", "ne": "Auntie Anne's", "xy": [192.1, 396.1], "id": 214}, {"n": "Eat at Robs", "a": "Rozelle（肉店内）", "t": "汉堡", "r": "2", "p": 20, "d": "Oklahoma洋葱汉堡", "i": "开在肉店里的汉堡店，做悉尼少见的Oklahoma汉堡：大量洋葱丝直接压在生牛肉饼上一起煎，洋葱焦香，牛肉饼薄而边缘微焦。喜欢厚肉饼的人可能不太习惯。", "dt": "2025-08-19", "ne": "Eat at Robs", "xy": [631.2, 542.2], "id": 213}, {"n": "Kumiho", "a": "Parramatta", "t": "日料", "r": "3", "p": 25, "d": "炸猪排刺身饭、和牛乌冬小火锅", "i": "Parramatta实用的日料店。炸猪排刺身饭同时有酥脆猪排和新鲜刺身；和牛乌冬小火锅很治愈。上菜快，多数主食25刀以内，适合日常吃饭。", "dt": "2025-08-18", "ne": "Kumiho", "xy": [189.1, 393.3], "id": 212}, {"n": "老碗面村", "a": "Waterloo", "t": "西北面食", "r": "4", "p": 25, "d": "油泼面", "i": "西北面馆，开放式厨房可以看到师傅现场擀面、拉面。油泼面必点，手扯面筋道，油泼辣子香气扑鼻，微辣刚好。有集章卡，吃五碗送一碗。人均约25刀。", "dt": "2025-08-17", "ne": "Lao Wan Noodle Village", "xy": [725.9, 662.6], "id": 211}, {"n": "杨大姐砂锅米线", "a": "Telopea", "t": "砂锅米线", "r": "4", "p": 33, "d": "砂锅米线、无骨鸡柳", "i": "砂锅米线店，一人份就很大。米线嫩滑，汤底不算浓，加辣肉末酱刚好。必点无骨鸡柳，很像国内校门口小推车卖的味道，蘸辣椒面好吃。人均约33刀，吃不完可打包。", "dt": "2025-08-16", "ne": "Big Sister Yang Claypot Rice Noodles", "xy": [291.7, 323.6], "id": 210}, {"n": "Ampersand", "a": "Rhodes", "t": "韩式Cafe", "r": "3", "p": 22, "d": "提拉米苏拿铁", "i": "韩式咖啡店，布置像法式农庄的后花园，鲜花绿植很多，瓷盘错落摆放，很舒服。特调咖啡很韩式，提拉米苏拿铁份量大。Brunch也值得一试。", "dt": "2025-08-15", "ne": "Ampersand", "xy": [424.1, 439.6], "id": 207}, {"n": "The End of King", "a": "Newtown", "t": "Cafe/Brunch", "r": "4", "p": 45, "d": "大虾意面、鸭肉盖饭", "i": "Newtown的Cafe，没有什么装修，出品却很有调性。Brunch很好吃，大虾意面和鸭肉盖饭都出色，现在也开晚市。人均约45刀。", "dt": "2025-08-15", "ne": "The End of King", "xy": [655.3, 655.9], "id": 208}, {"n": "Fabbrica Bread Shop", "a": "Rozelle", "t": "烘焙", "r": "3", "p": 12, "d": "太阳蛋牛角包", "i": "意面店Fabbrica开的烘焙店，设在一家社区超市里，临街有咖啡窗口，买面包要进超市选。太阳蛋牛角包的鸡蛋是溏心的，复烤5分钟后依然保持溏心。", "dt": "2025-08-15", "ne": "Fabbrica Bread Shop", "xy": [634.7, 550.8], "id": 209}, {"n": "Kumo Kumo", "a": "World Square", "t": "芝士蛋糕", "r": "3", "p": 12, "d": "巧克力芝士蛋糕", "i": "和Hokkaido、Uncle Tetsu同类的芝士蛋糕店，爱马仕橙包装很高级。巧克力芝士蛋糕湿润绵密扎实。", "dt": "2025-08-14", "ne": "Kumo Kumo", "xy": [719.0, 614.7], "id": 205}, {"n": "Pina", "a": "Potts Point", "t": "Brunch", "r": "2", "p": 35, "d": "虾卷", "i": "名气很大的Brunch店，是Room Ten的姐妹店，很多游客来吃。虾卷食材好，虾仁硕大弹牙，黄油面包也香，但加了鱼露，味道太杂。人均约35刀，在知名Brunch店里算合理，但实际表现不如名气。", "dt": "2025-08-14", "ne": "Pina", "xy": [776.3, 573.5], "id": 206}, {"n": "古城秦味", "a": "Dixon One, Haymarket", "t": "陕西菜", "r": "5", "p": 25, "d": "肉夹馍、腊汁肉揪面片、泡馍小炒、自选浇头宽面、凉拌羊肚", "i": "让人一来再来的陕西小馆，味道很对。肉夹馍必点，酥皮馍一咬掉渣；腊汁肉揪面片手工感足，短片好入口；泡馍小炒在悉尼少见，特别管饱。人均约25刀。", "dt": "2025-08-13", "ne": "Gucheng Qinwei", "xy": [733.7, 588.3], "id": 204}, {"n": "Ada's Affair", "a": "Glebe", "t": "印尼风Cafe", "r": "3", "p": 20, "d": "Flat White、Ayam佛卡夏", "i": "关帝庙附近的高分咖啡店，印尼人经营，餐食和饮品带浓浓印尼风味，例如Ayam佛卡夏早餐。Flat White浓郁不水。浅蓝色系的店面很清新。", "dt": "2025-08-12", "ne": "Ada's Affair", "xy": [679.2, 610.7], "id": 203}, {"n": "Four Seasons Hand Made Noodle", "a": "Lidcombe", "t": "韩国手工面", "r": "3", "p": 30, "d": "辣海鲜汤面、泡菜饺子、鲜虾饺子", "i": "不开晚市的韩国手工面店，菜单只有鸡汤面、海鲜面和饺子。辣海鲜汤面很鲜，刀切面厚实弹牙；鸡汤面稍逊，带辣才好吃。泡菜饺子和鲜虾饺子不错。人均30刀以内，吃完很暖。", "dt": "2025-08-11", "ne": "Four Seasons Hand Made Noodle", "xy": [302.9, 561.0], "id": 202}, {"n": "食肉神兽", "a": "外卖配送（无门店位置）", "t": "粤式外卖", "r": "4", "p": 20, "d": "盐焗手撕走地鸡、姜蓉鸡、玉米鲮鱼饼、暖冬煲、生椰提拉米苏", "i": "粤式外卖，秋冬季的超豪华全家福套餐份量很大，适合在家聚餐或配电影。", "dt": "2025-08-10", "ne": "Shi Rou Shen Shou", "xy": null, "id": 201}, {"n": "Tajima Yakiniku", "a": "Bathurst St, CBD", "t": "日式烤肉", "r": "4", "p": 110, "d": "周一至三Wagyu Feast（159刀，原价195刀）", "i": "Town Hall走路一分钟的日式烤肉，交通方便。周一到周三晚上有Wagyu Feast套餐，159刀（原价195刀），含五种和牛、一份刺身、两份配菜和两碗米饭，适合2到3人，性价比很高。和牛油花均匀，入口即化，Oyster Blade和Short Rib都有，配秘制酱汁很好吃。", "dt": "2025-08-08", "ne": "Tajima Yakiniku", "xy": [741.3, 586.5], "id": 199}, {"n": "On Point Café & Seafood", "a": "Chatswood Place", "t": "Cafe", "r": "3", "p": 22, "d": "Smoky Salmon Melody、黑松露奶油意面", "i": "Chatswood闹市里清新的新Cafe，阳光透过落地窗，很舒服，店员友善。Smoky Salmon Melody是酸种面包配熏三文鱼、牛油果和柠檬汁，清爽适合轻午餐；黑松露奶油意面浓郁不腻，加溏心蛋更好。", "dt": "2025-08-08", "ne": "On Point Café & Seafood", "xy": [670.6, 321.5], "id": 200}, {"n": "小火锅先生 Mr Hotpoter", "a": "Mandarin Centre Chatswood", "t": "旋转小火锅", "r": "4", "p": 25, "d": "午市25刀套餐（和牛或羊肩加7个配菜）", "i": "非常实惠的旋转小火锅，午市25刀包括自选汤底、一份和牛或羊肩肉、7个旋转带配菜、自助料碟和自助小食，能吃得很饱。配菜里有不少肉类。", "dt": "2025-08-07", "ne": "Mr Hotpoter", "xy": [640.9, 345.3], "id": 197}, {"n": "Buttered Bakery & Cafe", "a": "Chippendale", "t": "韩式烘焙", "r": "3", "p": 12, "d": "爆浆Tissue Bread（抹茶、开心果）", "i": "韩式烘焙店，牛角包、蛋糕和吐司品种多，还有少见的爆浆方形牛角包Tissue Bread，层层薄如纸巾，切开即爆浆。抹茶和开心果口味都好看好吃，但偏甜。", "dt": "2025-08-07", "ne": "Buttered Bakery & Cafe", "xy": [699.8, 622.5], "id": 198}, {"n": "Dizzybird", "a": "Chippendale（喜来登内）", "t": "烤鸡", "r": "2", "p": 22, "d": "烤鸡腿配蒜酱、薯条", "i": "UTS对面喜来登酒店里的东南亚风味烤鸡快餐。鸡腿嫩，鸡皮焦香，但偏甜，配蒜酱更好；薯条不错。路过可以吃，不必专程。", "dt": "2025-08-05", "ne": "Dizzybird", "xy": [715.7, 626.0], "id": 195}, {"n": "s'Treats Coffee and Dessert", "a": "Chippendale", "t": "甜品饮品", "r": "3", "p": 8, "d": "棉花糖热巧、香蕉牛奶", "i": "饮品很可爱的甜品店。热巧杯上画着Labubu，杯沿挤棉花糖再用火炙烤，倒入热巧后挤奶油加配料，也可以选香蕉牛奶。一杯8刀，适合小朋友。", "dt": "2025-08-05", "ne": "s'Treats Coffee and Dessert", "xy": [705.3, 611.3], "id": 196}, {"n": "Uobei", "a": "Central Park Mall, Chippendale", "t": "旋转寿司", "r": "2", "p": 30, "d": "刺身寿司、龙虾拉面", "i": "不起眼的旋转寿司，用小火车送餐，很可爱。刺身类寿司蛮好吃，但米饭是机器压的，太紧实。菜单上还有龙虾拉面。", "dt": "2025-08-04", "ne": "Uobei", "xy": [702.9, 630.7], "id": 191}, {"n": "cafe ACRO+", "a": "Central Park Mall, Chippendale", "t": "韩式咖啡", "r": "3", "p": 10, "d": "黑芝麻咖啡", "i": "韩式咖啡店，招牌黑芝麻咖啡是咖啡上盖一层浓醇黑芝麻奶油，慢慢渗进咖啡里，甜度适中。人气草莓抹茶奶油咖啡也值得一试。", "dt": "2025-08-04", "ne": "cafe ACRO+", "xy": [718.8, 617.1], "id": 192}, {"n": "Wingstop", "a": "Kings Cross", "t": "鸡翅", "r": "2", "p": 22, "d": "Lemon Pepper、Louisiana Rub、Cajun", "i": "美国连锁鸡翅店，开业后天天排队。从不辣到大辣有12种口味，Lemon Pepper、Louisiana Rub和Cajun都好吃，大辣其实不太辣。鸡翅外表干香，值得一试，但不值得排长队。", "dt": "2025-08-04", "ne": "Wingstop", "xy": [773.3, 570.7], "id": 193}, {"n": "Jazushi", "a": "Surry Hills", "t": "日料", "r": "4", "p": 40, "d": "海鲜珍宝饭、拉面、炸鸡", "i": "Surry Hills开了十几年的日料店。海鲜珍宝饭不输专做刺身饭的店，鲜美爽滑，接近Omakase的满足感。拉面和炸鸡也不错。黑芝麻冰拿铁偏甜。", "dt": "2025-08-04", "ne": "Jazushi", "xy": [723.6, 610.0], "id": 194}, {"n": "Brooklyn Boy Bagels", "a": "Surry Hills", "t": "贝果", "r": "3", "p": 14, "d": "Everything配花生酱、培根鸡蛋贝果", "i": "贝果选择很多的贝果店。Everything贝果配热花生酱，花生酱爱好者必点；Plain贝果夹培根和溏心蛋也很出色。一个很大，半个就饱。", "dt": "2025-08-03", "ne": "Brooklyn Boy Bagels", "xy": [743.8, 640.3], "id": 190}, {"n": "Ennui", "a": "Pitt St, Haymarket", "t": "法餐", "r": "3", "p": 100, "d": "鸭油黄油面包、松露鸭、牛排配薯条", "i": "开在近两百年老石头房子里的法餐厅，雨夜氛围特别好。面包配的黄油融合了鸭油，特别香。前菜Beef Tartare、Kingfish Collar和蜗牛中规中矩；主菜松露鸭子好吃，牛排不错，配牛排的薯条最惊艳。甜品有巧克力慕斯和椰子Sorbet。氛围好，食物还行。不喝酒人均约100刀。", "dt": "2025-08-02", "ne": "Ennui", "xy": [704.1, 598.2], "id": 186}, {"n": "Enjoy Mie", "a": "Sussex St, CBD（Westfield Sydney也有）", "t": "印尼菜", "r": "3", "p": 20, "d": "烤鸡腿、斑斓花生慢煎饼Martabak", "i": "印尼菜，Sussex St和Westfield Sydney各有一家。Sussex St店内还有外卖Martabak慢煎饼，在悉尼很少见。脆皮猪五花捞面一般，烤鸡腿不错。斑斓花生慢煎饼厚实蓬松，花生馅颗粒感十足，软绵香，但要等20多分钟。", "dt": "2025-08-02", "ne": "Enjoy Mie", "xy": [733.4, 611.2], "id": 187}, {"n": "Innit Cafe and Bar", "a": "Surry Hills", "t": "Cafe", "r": "3", "p": 22, "d": "咖啡", "i": "泰迪熊主题浓度很高的Cafe，曾推出说出暗号就送迷你泰迪熊的活动，小熊可以粘在杯子上，很可爱。", "dt": "2025-08-02", "ne": "Innit Cafe and Bar", "xy": [749.5, 603.6], "id": 188}, {"n": "Minus Seven Frozen Yoghurt", "a": "Westfield Chatswood（World Square也有）", "t": "酸奶冰淇淋", "r": "3", "p": 9, "d": "开心果酸奶", "i": "酸奶冰淇淋店，World Square和Chatswood都有，Chatswood店在海底捞对面、Timezone旁。开心果爱好者会喜欢，有开心果味酸奶，可加开心果酱和开心果碎。", "dt": "2025-08-02", "ne": "Minus Seven Frozen Yoghurt", "xy": [679.6, 347.9], "id": 189}, {"n": "香满堂融合菜馆", "a": "Burwood", "t": "东北家常菜", "r": "2", "p": 40, "d": "喷汁茄盒、酸菜粉丝、虾仁炒蛋、蒜香鸡翅", "i": "在Kingsford和Chatswood都很受欢迎的东北家常菜，开到Burwood换了这个名字，菜单还是熟悉的家常菜。招牌喷汁茄盒又脆又烫，肉末和茄子多汁；酸菜粉丝、虾仁炒蛋和蒜香鸡翅中规中矩。", "dt": "2025-08-01", "ne": "Xiang Man Tang", "xy": [449.0, 579.9], "id": 185}, {"n": "Envoy Cafe", "a": "Grosvenor St, CBD", "t": "日式咖啡", "r": "3", "p": 6, "d": "焙茶、宇治抹茶、意式三明治", "i": "靠近The Rocks的路边小Cafe，主打日式咖啡和意式三明治，有宇治抹茶和焙茶。焙茶醇厚温和，烘焙香浓郁，不苦不涩。小杯6刀。", "dt": "2025-07-30", "ne": "Envoy Cafe", "xy": [726.6, 545.2], "id": 184}, {"n": "Cafe Portico", "a": "Wynyard（教堂旁）", "t": "Brunch", "r": "4", "p": 25, "d": "意式焗蛋、大虾意面、柠檬Pancake", "i": "嵌在教堂入口旁的小Cafe，适合游览歌剧院时顺道吃Brunch。意式焗蛋是满满意大利风味的一锅料理，番茄酱解芝士的腻，溏心蛋和Chorizo铺在酥韧的面包上；柠檬Pancake份量很大，轻盈松软，配蜂蜜、香草冰淇淋和蓝莓酱。大虾意面也不错。人均约25刀，很实惠。", "dt": "2025-07-28", "ne": "Cafe Portico", "xy": [732.9, 544.2], "id": 183}, {"n": "长白山下", "a": "唐人街", "t": "东北菜", "r": "4", "p": 45, "d": "大拉皮、口水鸡、炝三样、锅包肉、手撕包菜", "i": "唐人街新晋热门东北菜，傍晚常要排队半小时，但物美价廉，五个菜约130刀。大拉皮、口水鸡、炝三样、锅包肉和手撕包菜都很好吃，锅包肉尤其出色。", "dt": "2025-07-26", "ne": "Changbai Mountain", "xy": [720.2, 580.9], "id": 180}, {"n": "The Apollo", "a": "Potts Point", "t": "希腊菜", "r": "2", "p": 80, "d": "炸虾、烤羊肉、烤鱼", "i": "希腊菜餐厅，氛围不错，灯光昏暗、烛光浪漫，适合约会和姐妹聚餐。但食物没有记忆点：炸虾带壳且很咸，烤羊肉边缘柴，鱼的调料偏酸。人均约80刀，不太划算。", "dt": "2025-07-26", "ne": "The Apollo", "xy": [776.8, 579.3], "id": 181}, {"n": "Sug Patisserie", "a": "Darling Square", "t": "巴斯克蛋糕", "r": "3", "p": 19, "d": "抹茶提拉米苏巴斯克", "i": "专卖巴斯克蛋糕和手工陶瓷的小店，巴斯克口味很多，抹茶提拉米苏口味很好吃。一块19刀，偏贵。手工陶瓷上还能看到指纹，很可爱。", "dt": "2025-07-26", "ne": "Sug Patisserie", "xy": [716.3, 598.3], "id": 182}, {"n": "Brookelyn Donuts", "a": "Westfield Chatswood", "t": "甜甜圈", "r": "2", "p": 8, "d": "Strawberry Matcha甜甜圈", "i": "在悉尼有9家分店的甜甜圈店，开到Chatswood了，口味很多。Strawberry Matcha里草莓酱很多，非常甜。", "dt": "2025-07-25", "ne": "Brookelyn Donuts", "xy": [652.3, 319.3], "id": 179}, {"n": "Zappi's Pizzeria Cafe", "a": "Epping", "t": "Pizza/烤肉", "r": "3", "p": 28, "d": "Pizza、烤肉", "i": "Pizza和烤肉店，Pizza好吃，烤肉烤得很焦很黑，但意外地也好吃。", "dt": "2025-07-22", "ne": "Zappi's Pizzeria Cafe", "xy": [400.5, 268.8], "id": 178}, {"n": "曹氏鸭脖", "a": "Waterloo", "t": "鸭货", "r": "3", "p": 20, "d": "鸭掌、鸭胗（广东宝宝辣）", "i": "国内连锁鸭货品牌，悉尼也能买到。辣度很高，宝宝辣都相当辣，但很香。鸭货傍晚容易卖光，鸭掌和鸭胗都好吃，适合配啤酒。", "dt": "2025-07-20", "ne": "Cao's Duck Neck", "xy": [729.5, 671.2], "id": 175}, {"n": "Merry Pops", "a": "Waterloo", "t": "Gelato", "r": "3", "p": 9, "d": "Soursop口味、Gelato千层酥", "i": "需要排队的Gelato店，也卖冰棒，口味很特别，例如味道接近释迦的刺果番荔枝Soursop。店里有Live Gelato房间，点Gelato千层酥会现场制作。", "dt": "2025-07-21", "ne": "Merry Pops", "xy": [733.3, 659.8], "id": 176}, {"n": "Surly's American Tavern", "a": "Surry Hills", "t": "美式熏肉", "r": "3", "p": 45, "d": "汉堡、熏肉拼盘（牛胸肉、熏鸡翅、玉米面包）", "i": "Surry Hills的美式熏肉酒馆，美国南部风格浓厚。汉堡很大；熏肉拼盘的牛胸肉嫩，熏鸡翅香，玉米面包颗粒感足。楼上有台球和游戏机，小朋友也能玩。", "dt": "2025-07-21", "ne": "Surly's American Tavern", "xy": [719.9, 627.3], "id": 177}, {"n": "Miss Yue", "a": "Epping Club", "t": "粤菜/早茶", "r": "3", "p": 40, "d": "海蜇手撕鸡、金衣虾球、桂花酒酿黑芝麻汤圆", "i": "Epping Club里环境很好的粤菜餐厅，Club会员有5%折扣。早茶点心和大菜都能点，海蜇手撕鸡、金衣虾球和桂花酒酿黑芝麻汤圆都好吃。人均约40刀，附近请客聚餐不必跑Eastwood或Carlingford。", "dt": "2025-07-19", "ne": "Miss Yue", "xy": [404.3, 257.3], "id": 174}, {"n": "食得好 Great Food", "a": "Carlingford Village", "t": "茶餐厅", "r": "3", "p": 18, "d": "茶餐厅套餐", "i": "平靓正的港式茶餐厅，有肉有菜有甜品，份量不大但可口。人均约18刀，物价飞涨下很难得。", "dt": "2025-07-17", "ne": "Great Food", "xy": [318.3, 296.5], "id": 172}, {"n": "海底捞", "a": "Chatswood", "t": "火锅", "r": "3", "p": 55, "d": "生日服务", "i": "连锁火锅品牌，在海底捞过生日很有仪式感，桌面有气球布置，寿星有小礼物。Chatswood店假期还有DIY玩偶和糖画等活动，适合带小朋友庆生。", "dt": "2025-07-17", "ne": "Haidilao", "xy": [653.1, 359.6], "id": 173}, {"n": "Kisuke 㐂介", "a": "Potts Point", "t": "Omakase", "r": "3", "p": 220, "d": "18道含10贯寿司", "i": "Potts Point价格较亲民的Omakase，每位220刀，共18道，其中10贯寿司，在悉尼入门价位里难得像样。网上直接预约，不玩花招。食材略普通，但厨师手艺弥补了不足，味道可口，菜式多样，份量刚好。", "dt": "2025-07-16", "ne": "Kisuke", "xy": [780.7, 567.9], "id": 169}, {"n": "SONGDO GUKBAP", "a": "Lidcombe", "t": "釜山汤饭", "r": "4", "p": 20, "d": "猪肉汤饭、炸鸡、饭团、芝士年糕", "i": "Lidcombe的釜山汤饭店，白汤猪肉汤饭配桌上的小虾米和辣椒酱，猪肉有肥有瘦，鲜甜香浓。炸鸡、饭团和芝士年糕也好吃。", "dt": "2025-07-16", "ne": "SONGDO GUKBAP", "xy": [318.8, 547.4], "id": 170}, {"n": "寒舍汤铺", "a": "Chatswood（原在Mascot）", "t": "广东汤", "r": "3", "p": 20, "d": "鲍鱼青橄榄排骨汤", "i": "起家于Mascot的广东汤铺，菜单直接标注不同身体状况适合喝什么汤。鲍鱼青橄榄排骨汤一盅27刀，适合伤风感冒时喝。蒸肉饼饭和黄皮蒸饺较普通。整颗椰子炖的汤看起来很值得一试。", "dt": "2025-07-16", "ne": "Hanshe Soup House", "xy": [680.2, 328.7], "id": 171}, {"n": "Nichi Getsu Do 日月堂", "a": "Kent St, CBD", "t": "日式拉面", "r": "3", "p": 22, "d": "Miso拉面、担担面", "i": "少见的以味噌拉面和担担面为主的日式拉面店。汤料先在热锅里大火炒过，厨房火光四起，汤底是干香型，不像一般拉面那样浓稠。整体中等偏上。抹茶啤酒很苦，口味特别。", "dt": "2025-07-14", "ne": "Nichi Getsu Do", "xy": [710.2, 581.7], "id": 168}, {"n": "福临门 Fortune Palace", "a": "Carlingford Village", "t": "早茶", "r": "3", "p": 21, "d": "虾肉馄饨、排骨陈村粉", "i": "一整周早茶时段都非常繁忙的平价早茶店，几乎没有服务，想吃什么要自己跟着点心车走。点心不错，虾肉馄饨只要5刀，排骨陈村粉12刀。人均约21刀，非常便宜。", "dt": "2025-07-13", "ne": "Fortune Palace", "xy": [307.9, 281.8], "id": 166}, {"n": "Omakase by Prefecture 48", "a": "Prefecture 48, Sussex St, CBD", "t": "Omakase", "r": "4", "p": 350, "d": "龙虾、鲍鱼、带子、金枪鱼腹、鱼子酱、9贯寿司", "i": "Prefecture 48集团的Omakase，虽然网红属性高，但出品确实很好，适合纪念日。", "dt": "2025-07-13", "ne": "Omakase by Prefecture 48", "xy": [709.2, 613.0], "id": 167}, {"n": "大碗鲜牛羊杂米线", "a": "Chatswood（与天仁茗茶同铺）", "t": "米线", "r": "2", "p": 18, "d": "牛杂米线", "i": "和天仁茗茶共用铺位的米线店。牛杂米线的牛杂只有牛肚，汤头鲜美，米线嫩滑，但不算特别出色，也不太管饱。可以顺便在天仁茗茶买一杯热蜂蜜菊花普洱。", "dt": "2025-07-12", "ne": "Big Bowl Beef and Lamb Offal Rice Noodles", "xy": [638.7, 333.3], "id": 162}, {"n": "Sutbul Chicken", "a": "Lidcombe", "t": "韩式烤鸡", "r": "3", "p": 30, "d": "原味和酱油味烤鸡、蒸蛋、饭团", "i": "Lidcombe的韩式烤鸡餐吧，下午四点就开门。菜单不大，主打各种口味烤鸡，原味和酱油味都很香但偏干。蒸蛋和饭朴素可口。适合配酒，人均约30刀。", "dt": "2025-07-12", "ne": "Sutbul Chicken", "xy": [296.5, 546.6], "id": 163}, {"n": "Bunker 64", "a": "Lidcombe", "t": "韩式Cafe", "r": "3", "p": 22, "d": "Butterscotch Cream Latte、蒜蓉芝士面包、姜汁蜂蜜茶", "i": "Lidcombe火车站对面外观平平的韩国Cafe，出品很惊喜。Butterscotch Cream Latte特调、蒜蓉芝士面包、可露丽和姜汁蜂蜜茶都好吃好喝。", "dt": "2025-07-12", "ne": "Bunker 64", "xy": [313.4, 563.1], "id": 164}, {"n": "Duo Duo", "a": "Strathfield", "t": "炸雪糕", "r": "3", "p": 15, "d": "炸雪糕", "i": "从南区路边餐车起家、现在Strathfield开店的炸雪糕店。镇店之宝炸雪糕外层是炸面包，里面是雪糕球，再加配料，小朋友会觉得很神奇。一颗15刀，偏贵。", "dt": "2025-07-12", "ne": "Duo Duo", "xy": [432.1, 585.7], "id": 165}, {"n": "悉尼小馄饨", "a": "Beverly Hills（King George Rd）", "t": "冷冻馄饨店", "r": "3", "p": 15, "d": "流沙咸蛋黄鲜肉馄饨", "i": "King George Rd上的冷冻薄皮馄饨门店，网上超市常见的品牌，门店口味最齐全。流沙咸蛋黄鲜肉馄饨最受欢迎，煮时戳破一颗，整碗汤都有咸蛋黄香。附带猪油、紫菜、蛋皮和盐的料包，按比例调好，非常方便。一盒十几刀。", "dt": "2025-07-03", "ne": "Sydney Little Wontons", "xy": [394.7, 817.5], "id": 160}, {"n": "Shabuway", "a": "Dixon One, CBD", "t": "自助火锅", "r": "3", "p": 46, "d": "7+和牛、大虾、芝麻小球、雪糕", "i": "实惠的自助火锅，提供7+和牛，虽是冷冻但煮后仍嫩，虾个头大。熟食区中西日韩都有，奶黄流心芝麻球特别好吃。雪糕任吃，可以自己加配料。成人46刀，小孩29刀。", "dt": "2025-07-03", "ne": "Shabuway", "xy": [739.8, 596.4], "id": 161}, {"n": "老北京烤鸭店 Beijing Duck Restaurant", "a": "Thornleigh", "t": "北京菜", "r": "X", "p": 40, "d": "烤鸭（88刀一套）、鱼香茄子", "i": "北京菜馆，烤鸭一套88刀，味道还可以但几乎没有摆盘。鱼香茄子、金沙粉丝虾球和姜汁黑芝麻汤圆普通可接受；宫廷酱香骨、葱爆羊肉、炸酱面和椒盐鸭架都是雷。人均约40刀，整体不好吃。", "dt": "2025-07-01", "ne": "Beijing Duck Restaurant", "xy": [389.5, 126.7], "id": 156}, {"n": "Mrs Jones The Baker", "a": "St Ives Village", "t": "烘焙Cafe", "r": "3", "p": 22, "d": "牛角包、摩卡", "i": "St Ives Village里客人络绎不绝的烘焙Cafe，面包甜品琳琅满目。牛角包一般，小蛋糕可能是更好的选择。有咖啡和红茶。", "dt": "2025-07-01", "ne": "Mrs Jones The Baker", "xy": [626.3, 123.6], "id": 157}, {"n": "AMAZONA Premium Acai & Dessert", "a": "Gordon", "t": "Acai", "r": "3", "p": 14, "d": "Acai加巧克力酱奥利奥", "i": "Acai碗和甜品店，可以自选配料，加巧克力酱和奥利奥饼干后会好吃很多，适合小朋友。", "dt": "2025-07-01", "ne": "AMAZONA Premium Acai & Dessert", "xy": [576.1, 210.6], "id": 158}, {"n": "Happi Ramen", "a": "Gordon", "t": "日式拉面", "r": "2", "p": 20, "d": "豚骨拉面、横滨拉面、蘸面", "i": "周末中午要稍微排队的拉面店，表现一般。豚骨拉面和横滨拉面不太咸、浓稠度刚好；蘸面的蘸汤不够浓，面条冰冷。人均约20刀。", "dt": "2025-07-01", "ne": "Happi Ramen", "xy": [592.0, 214.1], "id": 159}, {"n": "喜相逢海鲜酒家", "a": "Beverly Hills", "t": "粤菜酒楼", "r": "2", "p": 50, "d": "走地鸡、乳鸽、XO Pipi", "i": "Beverly Hills的粤菜酒楼，客流明显减少。走地鸡有鸡冻，乳鸽皮脆，XO酱炒Pipi的酱汁可以蘸油条，送的马蹄露清新，但三杯鸭舌烧糊了。整体不难吃也不出彩，人均50刀以上。", "dt": "2025-06-30", "ne": "Hei Seung Fung Seafood Restaurant", "xy": [391.7, 814.7], "id": 153}, {"n": "Elf Cake & Co", "a": "Epping（火车站出口）", "t": "蛋糕店", "r": "3", "p": 14, "d": "迪拜巧克力蛋糕、罗马奶油包", "i": "Epping火车站出口的蛋糕店，价格牌手写，很朴实。迪拜巧克力蛋糕除了开心果脆，还夹一层浆果解腻；罗马奶油包造型像柯基屁股，很可爱。好吃但很贵，一小片迪拜巧克力蛋糕要11刀。", "dt": "2025-06-30", "ne": "Elf Cake & Co", "xy": [391.9, 264.4], "id": 154}, {"n": "K Style Food", "a": "Epping", "t": "韩国菜", "r": "3", "p": 30, "d": "辣猪骨锅、海鲜煎饼", "i": "火车站步行一分钟的街边小韩国菜馆，店面简陋但很实惠。辣猪骨锅堆成一座小山，十几块猪脊骨炖到一碰就脱骨，配生韭菜很过瘾；海鲜煎饼也不错。份量很大，人均30刀以内。", "dt": "2025-06-30", "ne": "K Style Food", "xy": [407.8, 267.9], "id": 155}, {"n": "ICHIRAKU CANTEEN", "a": "唐人街", "t": "一人寿喜烧", "r": "3", "p": 30, "d": "寿喜烧乌冬", "i": "居酒屋推出的一人一锅寿喜烧午餐，肉质不算高级，但吃得满足。寿喜烧越煮越甜越咸，建议十分钟内吃完。乌冬特别好吃。一锅30刀。", "dt": "2025-06-28", "ne": "ICHIRAKU CANTEEN", "xy": [705.2, 587.8], "id": 149}, {"n": "Oh My Yo", "a": "唐人街德信大厦", "t": "酸奶冰淇淋", "r": "3", "p": 9, "d": "茅台口味、椰子口味", "i": "德信大厦翻新后地面层的酸奶冰淇淋店，有很新奇的茅台口味，可以搭配椰子口味和旺仔小馒头。份量小，一小碗7刀。", "dt": "2025-06-28", "ne": "Oh My Yo", "xy": [725.4, 618.2], "id": 150}, {"n": "别不同", "a": "Eastwood", "t": "盐焗鸡饭", "r": "3", "p": 18, "d": "盐焗鸡饭", "i": "Eastwood的盐焗鸡饭，口味很像国内的明海盐焗鸡饭。", "dt": "2025-06-28", "ne": "Bie Bu Tong", "xy": [375.6, 314.3], "id": 151}, {"n": "Whisky Thief", "a": "Prefecture 48, Sussex St, CBD", "t": "威士忌酒吧", "r": "3", "p": 50, "d": "鸡尾酒", "i": "Prefecture 48的威士忌酒吧，两层楼高的酒墙非常壮观，适合在楼上餐厅用餐前先来喝一杯。鸡尾酒好喝。", "dt": "2025-06-28", "ne": "Whisky Thief", "xy": [731.1, 581.4], "id": 152}, {"n": "Katsu Haki", "a": "Event Cinema, George St, CBD", "t": "日式炸猪排", "r": "3", "p": 38, "d": "鹿儿岛黑豚炸猪排饭", "i": "日式炸猪排饭店。限量黑豚炸猪排饭38刀，鹿儿岛黑豚厚切依然很嫩，外皮酥脆，咬到肥肉部分会爆油，撒芝麻更香。份量足。店里调料选择不多。和大阪名店比有差距，但在悉尼算不错。", "dt": "2025-06-26", "ne": "Katsu Haki", "xy": [752.9, 569.2], "id": 147}, {"n": "Warabi Mochi Kamakura", "a": "Regent Place", "t": "蕨饼", "r": "3", "p": 12, "d": "黑芝麻和抹茶蕨饼", "i": "蕨饼专门店，也卖饮品和雪糕。蕨饼非常软，几乎像史莱姆一样会流动，口感糯软。黑芝麻粉比抹茶粉更好吃。包装漂亮，标明赏味期限。5颗十几刀，偏贵。", "dt": "2025-06-26", "ne": "Warabi Mochi Kamakura", "xy": [712.4, 549.3], "id": 148}, {"n": "10K NOODLES", "a": "Eastwood（10000面包楼上）", "t": "韩国面", "r": "3", "p": 23, "d": "辣汤面、花蛤汤面、和牛煎饼", "i": "10000面包楼上的韩国面馆，风格延续纯白简约，菜单只有6道。辣汤面和花蛤汤面面条劲道、汤好喝，适合冬天。饺子皮薄馅厚，但4颗9刀偏贵。和牛煎饼是把和牛锤薄后裹蛋液煎，肉脂香和蛋香兼具，很值得加点。人均约23刀。", "dt": "2025-06-22", "ne": "10K NOODLES", "xy": [409.8, 339.3], "id": 144}, {"n": "辣妹厨房 Pretty Chef", "a": "Petersham", "t": "贵州菜", "r": "5", "p": 30, "d": "辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、宫爆猪板筋", "i": "悉尼少有的贵州菜，辣度温柔浓郁、越吃越想吃。辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、臭豆豉回锅肉、双椒肉末茄子和宫爆猪板筋都很下饭，米豆腐和猪板筋口感新奇。酸汤火锅也值得一试。人均约30刀，非常实惠。", "dt": "2025-06-22", "ne": "Pretty Chef", "xy": [592.1, 646.4], "id": 145}, {"n": "台南人", "a": "Eastwood台湾夜市", "t": "台湾小吃", "r": "4", "p": 18, "d": "鸡卤饭、地瓜球、麻油鸡汤、芋泥饼、盐水鸡", "i": "台湾小吃店，鸡卤饭同时有鸡肉和卤肉，上面是猪油煎的荷包蛋，特别好吃。地瓜球和西门町的一模一样；手工芋泥饼很赞；麻油鸡汤在悉尼难得喝到；盐水鸡普通。值得反复去。", "dt": "2025-06-22", "ne": "Tainan Ren", "xy": [401.3, 297.1], "id": 146}, {"n": "Diana", "a": "Potts Point", "t": "韩国菜", "r": "3", "p": 50, "d": "拌鱼生、熏鸭片皮鸭、蒸五花生菜包", "i": "开在潮区的韩国餐厅，环境幽暗，菜名看起来难以下手，但味道不错。刺身由服务员桌边拌制，像辣味版的捞起鱼生；片皮鸭用的是熏鸭肉，烟熏味浓；蒸五花肉生菜包的卤肉很香。甜品大麻花普通。人均约50刀，以这个区和环境来说不算贵。", "dt": "2025-06-21", "ne": "Diana", "xy": [768.2, 575.0], "id": 141}, {"n": "Pennant Hills Seafood", "a": "Pennant Hills Market Place", "t": "海鲜店/炸鱼薯条", "r": "4", "p": 25, "d": "Flathead炸鱼配海鲜沙拉、三文鱼腹、金枪鱼Toro", "i": "Pennant Hills的海产店，用每天新鲜到货的鱼做Fish & Chips，配的还是海鲜沙拉。也卖刺身级三文鱼和金枪鱼，可以帮忙切片，三文鱼腹和金枪鱼Toro都很新鲜。", "dt": "2025-06-21", "ne": "Pennant Hills Seafood", "xy": [370.6, 149.3], "id": 142}, {"n": "Myeongdong", "a": "Chatswood（North Strathfield本店）", "t": "韩国菜", "r": "3", "p": 40, "d": "梨子拌生牛肉、辣豆腐汤、韩式炸猪排", "i": "North Strathfield评分很高的韩国餐厅，Chatswood也有分店。梨子拌生牛肉必点；辣豆腐汤冬天暖身；韩式炸猪排薄而嫩脆，蘸酱或空口都好吃。三道菜约75刀，够2到3人。", "dt": "2025-06-21", "ne": "Myeongdong", "xy": [672.9, 358.3], "id": 143}, {"n": "Leible Coffee", "a": "North Sydney（Crows Nest也有）", "t": "咖啡", "r": "3", "p": 10, "d": "Absolute", "i": "在悉尼有四家店的咖啡品牌，北悉尼火车站Blue St出口和Crows Nest都有。招牌咖啡豆Absolute强度四星，很提神。", "dt": "2025-06-18", "ne": "Leible Coffee", "xy": [725.9, 472.5], "id": 140}, {"n": "彩云南 Colorful Yunnan", "a": "Chatswood（Eastwood也有）", "t": "云南菜", "r": "3", "p": 45, "d": "过桥米线、土司饵块鸡、瓦片高原肉、蟹黄豆腐、牛肝菌黄焖鸡", "i": "云南菜馆，适合聚餐。不辣的蟹黄豆腐和糖醋里脊都好吃，但最出色的还是过桥米线，汤非常浓郁。人均约45刀。", "dt": "2025-06-17", "ne": "Colorful Yunnan", "xy": [664.5, 316.1], "id": 139}, {"n": "邓婆婆川式面馆", "a": "Eastwood Plaza", "t": "川式面馆", "r": "2", "p": 20, "d": "三选便当、砂锅红烧牛肉肥肠米线、重庆小面", "i": "Eastwood牛百岁隔壁的川式面馆，适合买菜时快吃快走。三选便当最好，青椒回锅肉尤其不错；砂锅红烧牛肉肥肠米线次之；重庆小面一般。人均20刀以内。", "dt": "2025-06-16", "ne": "Granny Deng Sichuan Noodles", "xy": [378.7, 334.5], "id": 133}, {"n": "Sushi Maru", "a": "Gordon", "t": "寿司外卖", "r": "3", "p": 18, "d": "寿司盒", "i": "在悉尼有近10家分店的寿司外卖店，新鲜食材加浓厚酱汁，是典型的澳式寿司，很合本地人口味。周末下午也常满座。", "dt": "2025-06-16", "ne": "Sushi Maru", "xy": [581.6, 199.4], "id": 134}, {"n": "Chois Kitchen", "a": "Castle Hill", "t": "韩式中华料理", "r": "4", "p": 30, "d": "大盘炸酱面（配整只炸鱿鱼）、米酒", "i": "口碑很好的韩式中华料理，必点大盘炸酱面，上面放一整只炸鱿鱼，剪碎拌面吃；炸酱不甜不油，顺滑爽口。可以配米酒，小朋友可以喝甜米露。人均约30刀。", "dt": "2025-06-16", "ne": "Chois Kitchen", "xy": [189.4, 134.9], "id": 135}, {"n": "Cha-no-wa 茶中环", "a": "Rhodes", "t": "抹茶饮品", "r": "2", "p": 10, "d": "抹茶软雪糕、蕨饼", "i": "常要排小队的抹茶饮品店，走快速多样的奶茶店路线。抹茶星冰乐里是半杯冰粒，不推荐；抹茶软雪糕配红豆麻薯和抹茶蕨饼中规中矩。", "dt": "2025-06-16", "ne": "Cha-no-wa", "xy": [401.7, 438.9], "id": 136}, {"n": "I Gladiatori Osteria Romana", "a": "North Strathfield", "t": "意大利菜", "r": "3", "p": 45, "d": "茄汁大通心宽粉、提拉米苏", "i": "罗马风味意大利餐厅，在North Strathfield和Freshwater各有一家。有罗马古老的长方形Pinsa薄饼，口感接近佛卡夏。茄汁大通心宽粉好吃；咖啡杯装的提拉米苏非常湿软，只是酒味不足。路边座位很舒服。人均约45刀。", "dt": "2025-06-16", "ne": "I Gladiatori Osteria Romana", "xy": [412.8, 526.4], "id": 137}, {"n": "Noodlee", "a": "North Strathfield", "t": "韩越融合越南粉", "r": "5", "p": 28, "d": "辣牛小肠越南牛肉粉", "i": "韩国人开的越南Pho店，是很成功的融合菜。辣牛小肠越南牛肉粉把韩式牛小肠辣汤和越南米粉结合得极好，小肠爽口，米粉嫩滑，汤底浓郁辛辣，冬天非常适合。一碗28刀，不便宜。", "dt": "2025-06-16", "ne": "Noodlee", "xy": [416.3, 535.0], "id": 138}, {"n": "Pure Brew & Co.", "a": "Gordon", "t": "韩式咖啡", "r": "3", "p": 9, "d": "冰芒果抹茶拿铁", "i": "布置很韩式的咖啡店，每个角落都简单自然，错落有致，店员热情。冰芒果抹茶拿铁很好喝，一杯9刀，适合坐下消磨时间。", "dt": "2025-06-15", "ne": "Pure Brew & Co.", "xy": [579.2, 218.8], "id": 130}, {"n": "Teddy Bear Hightea Buffet", "a": "Sheraton Grand Sydney Hyde Park", "t": "下午茶自助", "r": "3", "p": 99, "d": "小熊甜品、巧克力瀑布", "i": "海德公园喜来登酒店的泰迪熊下午茶自助，甜品都有小熊元素，有巧克力瀑布和任挖的冰淇淋，每两人送一只穿喜来登T恤的Build-A-Bear小熊，小朋友会非常开心。成人99刀，小孩55刀。", "dt": "2025-06-15", "ne": "Teddy Bear Hightea Buffet", "xy": [740.0, 585.7], "id": 131}, {"n": "Sushi Hotaru", "a": "The Galeries", "t": "旋转寿司", "r": "4", "p": 50, "d": "烤白鳗、三文鱼腹、生虾、手卷、Miso Cod", "i": "开了很多年的人气旋转寿司，价格不贵、食材新鲜、翻桌快。烤白鳗、三文鱼腹和生虾都很新鲜；手卷扎实，一个5刀；西餐厅要卖四五十刀的Miso Cod这里只要7.8刀。人均约50刀，物美价廉。", "dt": "2025-06-15", "ne": "Sushi Hotaru", "xy": [729.5, 582.5], "id": 132}, {"n": "Teddy Tea Break", "a": "Newtown火车站", "t": "奶茶", "r": "2", "p": 9, "d": "茉香奶茶", "i": "Newtown火车站出口的泰迪熊奶茶店，英伦风装潢有年代感，也有生椰拿铁等流行口味。茉香奶茶普通。", "dt": "2025-06-14", "ne": "Teddy Tea Break", "xy": [652.2, 653.1], "id": 127}, {"n": "Bar Julius", "a": "Redfern", "t": "西餐", "r": "2", "p": 50, "d": "Beef Tartare、柠檬烤鸡、美式热狗", "i": "Surry Hills新Plaza里的西餐厅，早上六点开始营业，有全天菜单。Beef Tartare、柠檬烤鸡和美式热狗都一般，但环境和服务很好。人均约50刀，适合商务谈事，不适合专门来吃饭。", "dt": "2025-06-14", "ne": "Bar Julius", "xy": [725.4, 634.4], "id": 128}, {"n": "Westfield Chatswood 美食广场合集", "a": "Westfield Chatswood", "t": "美食广场", "r": "2", "p": 18, "d": "Sou Ramen Lab鸡汤拉面、美林便当（有儿童份）、霑记、Don't Tell Mama炸串", "i": "Chatswood Westfield美食广场整体缺少惊艳的选择。美林便当一般，但有儿童份量；霑记不如Macquarie Centre的分店；Don't Tell Mama串串比不过夸父；Sou Ramen Lab的鸡汤底还可以。", "dt": "2025-06-14", "ne": "Westfield Chatswood food court roundup", "xy": [641.8, 353.5], "id": 129}, {"n": "Olympic Meats", "a": "Marrickville（Dulwich Hill站对面）", "t": "希腊菜", "r": "5", "p": 30, "d": "猪鸡牛卷饼、胖薯条", "i": "Dulwich Hill火车站对面的希腊烤肉店，人气极高，常要排一小时以上，但值得。前菜一般可以跳过；卷饼一定要多点，猪肉、鸡肉和牛肉都鲜嫩焦香。胖薯条超脆超香，可能是悉尼最好吃的薯条之一。", "dt": "2025-06-12", "ne": "Olympic Meats", "xy": [592.1, 700.3], "id": 124}, {"n": "D'penyetz & D'cendol", "a": "Sussex St", "t": "印尼菜", "r": "3", "p": 20, "d": "炸鸡腿、烤鸡腿配辣酱", "i": "颜色亮眼的印尼菜，炸鸡腿和烤鸡腿都好吃，辣酱更出色，香且料足。辣度分五级以上，2级已经相当辣。", "dt": "2025-06-12", "ne": "D'penyetz & D'cendol", "xy": [701.4, 605.1], "id": 125}, {"n": "Bat + Bun", "a": "Darlinghurst", "t": "越南包", "r": "3", "p": 11, "d": "脆皮猪五花越南包（加青苹果丝）", "i": "街角的越南咖啡店，越南包、米粉、米卷和越南咖啡都有。脆皮猪五花越南包加了青苹果丝，清甜解腻；猪五花够脆，但沙拉酱放得偏多，略甜。一个11刀，不贵。", "dt": "2025-06-12", "ne": "Bat + Bun", "xy": [749.8, 597.1], "id": 126}, {"n": "Miss Sina", "a": "Marrickville", "t": "烘焙", "r": "3", "p": 12, "d": "斑斓叶子卷、Biscoff肉桂卷", "i": "Cabramatta一带很火的烘焙店，带东南亚风味。招牌斑斓卷是软糯面包涂斑斓奶油再撒椰片椰丝；Biscoff肉桂卷也好吃。很肥，适合偶尔吃。", "dt": "2025-06-10", "ne": "Miss Sina", "xy": [589.1, 697.5], "id": 123}, {"n": "Tita", "a": "Marrickville", "t": "菲律宾Cafe", "r": "3", "p": 22, "d": "紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁", "i": "Marrickville的菲律宾Cafe，甜品都用紫薯Ube制作，满桌紫色。紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁和紫薯冰面包都很有特色，紫薯味很像广东的五羊雪糕。", "dt": "2025-06-09", "ne": "Tita", "xy": [592.6, 706.1], "id": 121}, {"n": "Jagalchi", "a": "Lidcombe", "t": "韩式鱼生", "r": "3", "p": 35, "d": "无腌鱼生配蒜蓉麻油辣酱、鱼籽辣汤", "i": "Lidcombe韩式鱼生店，在Il Eok Jo隔壁。鱼生不腌制，配蒜蓉麻油辣酱另有风味；鱼籽辣汤冬天很舒服。人均约35刀。", "dt": "2025-06-09", "ne": "Jagalchi", "xy": [312.0, 538.3], "id": 122}, {"n": "Mochiric", "a": "The Galeries（流动摊位）", "t": "麻薯甜甜圈", "r": "4", "p": 8, "d": "斑斓椰子、柠檬奶油、香蕉牛奶甜甜圈", "i": "Cabramatta有名的麻薯甜甜圈，平时在几个地点流动摆摊，周末有时在The Galleries。口感又糯又韧，比普通甜甜圈好吃，口味有斑斓椰子、柠檬奶油、香蕉牛奶等少见款。", "dt": "2025-06-08", "ne": "Mochiric", "xy": [733.3, 571.0], "id": 119}, {"n": "Alice's Makan", "a": "Chatswood Chase", "t": "马来菜", "r": "3", "p": 25, "d": "炒萝卜糕、海南鸡、咸蛋黄虾球、Kaya Toast", "i": "Chatswood Chase新开的马来餐厅。招牌炒萝卜糕像炒年糕一样，萝卜糕软嫩入味，和鸡蛋豆芽很搭；海南鸡、咸蛋黄虾球和Kaya Toast水准可以。服务很不专业，常上错桌。", "dt": "2025-06-08", "ne": "Alice's Makan", "xy": [684.5, 341.0], "id": 120}, {"n": "Brother Katsu", "a": "Marina Square, Wentworth Point", "t": "韩国小吃", "r": "2", "p": 18, "d": "鱼饼汤、炸紫菜卷", "i": "购物中心里的韩国街头小吃店，卖炸物、鱼饼、方便面和饭团。炸紫菜卷太油，不推荐；鱼饼汤胡椒味浓，冷天喝很舒服。", "dt": "2025-06-07", "ne": "Brother Katsu", "xy": [385.9, 431.6], "id": 117}, {"n": "Bosphorus Turkish Street Food", "a": "Wentworth Point", "t": "土耳其菜", "r": "4", "p": 30, "d": "烤鸡翅薯条、鸡肉Snack Pack、鹰嘴豆泥", "i": "土耳其街头小吃，油香肉类配扎实碳水。烤鸡翅焦香，薯条撒鸡盐，底下铺土耳其面包，配酸蒜酱解腻；Snack Pack可选鸡肉、羊肉或牛肉，米饭用鸡油泡过，油润爽口。鹰嘴豆泥和土耳其汽水也值得点。", "dt": "2025-06-07", "ne": "Bosphorus Turkish Street Food", "xy": [373.5, 438.7], "id": 118}, {"n": "Pappa Flock", "a": "Macquarie Centre（Bondi也有）", "t": "炸鸡", "r": "4", "p": 20, "d": "原味和辣味Tender、炸鸡汉堡、Butter Toast", "i": "在Bondi和Macquarie Centre都有店的炸鸡品牌，以Tender出名。鸡胸肉Tender非常嫩且多汁，原味和辣味都好；Butter Toast烤得酥脆，和Tender很搭。炸鸡汉堡也不错。", "dt": "2025-06-06", "ne": "Pappa Flock", "xy": [510.9, 271.7], "id": 116}, {"n": "Ainoya", "a": "Kirribilli", "t": "居酒屋", "r": "2", "p": 50, "d": "刺身、寿司、天妇罗、清酒", "i": "有榻榻米座位的日式居酒屋，周六晚上满座。酒单详细，每款清酒都建议了饮用温度。刺身、寿司和天妇罗不错，不算正宗但可接受，适合喝几杯清酒。", "dt": "2025-06-01", "ne": "Ainoya", "xy": [747.4, 500.7], "id": 115}, {"n": "传记潮发潮汕牛肉火锅", "a": "唐人街", "t": "潮汕牛肉火锅", "r": "4", "p": 60, "d": "鲜打牛肉丸、湿炒牛肉粿条", "i": "潮汕牛肉火锅，牛肉丸现打，煮五分钟就熟，比冷冻丸子好吃很多。必点湿炒牛肉粿条，芥兰香脆甘甜，牛肉炒到半熟，勾沙茶芡汁，复原度很高。人均约60刀。", "dt": "2025-05-31", "ne": "Chuan Ji Teochew Beef Hotpot", "xy": [740.1, 607.7], "id": 112}, {"n": "Chill Restaurant", "a": "Crows Nest（Eastwood也有）", "t": "越南粉", "r": "3", "p": 25, "d": "咸蛋黄肉松炸虾、和牛Pho", "i": "Eastwood和Crows Nest都有的越南粉店，Google六百多条评价仍有4.7分。前菜咸蛋黄肉松炸虾，四只大虾非常弹牙。和牛Pho一碗28刀，牛肉嫩而肥，上桌时还红彤彤，很鲜。人均约25刀。", "dt": "2025-05-31", "ne": "Chill Restaurant", "xy": [709.6, 426.2], "id": 113}, {"n": "Eden Pasticceria", "a": "Neutral Bay", "t": "意大利甜品", "r": "3", "p": 14, "d": "Cream Coffee、提拉米苏、开心果泡芙、开心果Cannoli", "i": "意大利甜品店，也卖Gelato。招牌意式Cream Coffee苦甜冰凉，口感像更饱满流动的软雪糕。提拉米苏、开心果泡芙和开心果Cannoli都值得买。三样甜品加一杯Cream Coffee约28刀。", "dt": "2025-05-31", "ne": "Eden Pasticceria", "xy": [757.9, 446.8], "id": 114}, {"n": "SML Cafe", "a": "North Willoughby", "t": "Cafe", "r": "3", "p": 22, "d": "豆乳咖啡、拉丝芝士三明治、薯饼", "i": "店名意为小中大咖啡的人气Cafe，下午两点半还坐满人。豆乳咖啡、拉丝芝士三明治和薯饼都好吃。", "dt": "2025-05-30", "ne": "SML Cafe", "xy": [702.2, 342.6], "id": 110}, {"n": "Sydney Daifuku Store", "a": "Lane Cove North", "t": "日式大福", "r": "3", "p": 10, "d": "红豆草莓、抹茶、巧克力大福", "i": "开在居民区绿荫中的日式大福店，环境很美。大福现包，上桌后自己用细绳切开，很有趣。红豆草莓、抹茶和巧克力口味的奶油都很好，不太甜。一颗约10刀，不便宜。", "dt": "2025-05-30", "ne": "Sydney Daifuku Store", "xy": [631.5, 401.0], "id": 111}, {"n": "The Squire's Landing", "a": "Circular Quay", "t": "景观餐厅", "r": "3", "p": 120, "d": "Vivid套餐", "i": "环形码头The Quay楼下的景观餐厅，以约一半的价格享受和The Quay同样的歌剧院和海港大桥美景。Vivid期间有99刀和120刀两种套餐，有溢价但食物不难吃，一线景观无遮挡，比坐游船舒服。", "dt": "2025-05-26", "ne": "The Squire's Landing", "xy": [736.9, 532.1], "id": 107}, {"n": "Esteban", "a": "Temperance Lane, CBD", "t": "墨西哥菜", "r": "2", "p": 70, "d": "Steak Tartare Taco、玉米片蘸黑豆泥", "i": "暗黑风格的墨西哥餐厅，酒单比菜单丰富得多，对各种龙舌兰介绍详细生动。Steak Tartare Taco和玉米片蘸黑豆泥好吃，其他菜既不够墨西哥也不够正统。建议点几个Taco配酒就好。人均约70刀。", "dt": "2025-05-26", "ne": "Esteban", "xy": [729.1, 591.9], "id": 108}, {"n": "Olympus Dining", "a": "Redfern", "t": "希腊菜", "r": "2", "p": 60, "d": "烤面包、烤鱿鱼、烤鱼、炸羊脑、烤鸡", "i": "Redfern新Plaza里的希腊餐厅，和Surry Hills一街之隔，因玻璃天窗下的一棵大树走红，入座送瓜子。烤面包、烤鱿鱼、烤全鱼、炸羊脑和烤鸡都焦香不错；米布丁和西瓜冰沙也还行。值得打卡，但味道不上不下。好停车，人均约60刀。", "dt": "2025-05-26", "ne": "Olympus Dining", "xy": [712.9, 641.5], "id": 109}, {"n": "Malika Bakehouse", "a": "Surry Hills", "t": "土耳其烘焙", "r": "3", "p": 12, "d": "番茄牛肉卷、牛肉肠卷、千层芝士饼", "i": "Surry Hills主街上的土耳其烘焙店，白墙配绿橙横纹很醒目。牛肉肠卷、千层芝士饼和番茄牛肉卷都可以试，番茄牛肉卷最好吃。店里可以帮忙加热。", "dt": "2025-05-23", "ne": "Malika Bakehouse", "xy": [758.5, 629.9], "id": 105}, {"n": "Jan cafe", "a": "Woolloomooloo", "t": "拉花咖啡", "r": "3", "p": 10, "d": "龙猫和Labubu拉花", "i": "以可爱拉花出名的咖啡店，咖啡师来自槟城，龙猫和Labubu拉花十几秒就完成，墙上还有更多作品照片。Labubu和龙猫迷值得专程来。", "dt": "2025-05-23", "ne": "Jan cafe", "xy": [768.9, 573.0], "id": 106}, {"n": "东厨 New Dumpling House", "a": "唐人街", "t": "东北菜", "r": "3", "p": 30, "d": "锅包肉、排骨焖豆角、小鸡炖蘑菇", "i": "唐人街正中心的东北菜小馆，客人多是外国人，菜单却很地道。锅包肉外衣轻盈、肉片薄而不柴；排骨焖豆角的酱汁非常下饭；小鸡炖蘑菇和酸菜炒粉条也不错。人均约30刀。", "dt": "2025-05-21", "ne": "New Dumpling House", "xy": [712.8, 579.1], "id": 104}, {"n": "Hinataya", "a": "Mascot", "t": "日料", "r": "3", "p": 35, "d": "鳗鱼盖饭、乌冬、Toro刺身", "i": "实在的日料店，以鳗鱼盖饭出名，菜单很大，也有乌冬。Toro刺身、烤三文鱼腩寿司和炸紫菜三文鱼刺身都不错，甜品威化巧克力冰淇淋也好。人均约35刀。", "dt": "2025-05-19", "ne": "Hinataya", "xy": [678.9, 751.0], "id": 102}, {"n": "芳芳闽味", "a": "Eastwood Arcade", "t": "泉州小吃", "r": "3", "p": 18, "d": "肉羹汤、花生酱拌面、炸沙茶鸡肉串、五香卷", "i": "Eastwood Arcade里的泉州小吃，上午10点半开门。肉羹汤、花生酱拌面、炸沙茶鸡肉串和五香卷都不错。拌面建议堂食，外带容易坨。四样约36刀，够两人午餐。", "dt": "2025-05-19", "ne": "Fang Fang Fujian Snacks", "xy": [421.3, 322.0], "id": 103}, {"n": "Island Radio", "a": "Redfern", "t": "东南亚融合", "r": "3", "p": 65, "d": "米面包、虾多士、炸鸡串、炒通菜", "i": "Redfern新Plaza里的东南亚融合餐吧，充满新派Surry Hills的氛围。前菜米面包、虾多士、炸鸡串和Kingfish刺身串，东南亚酱汁让人很有新鲜感。主菜牛排一般，炒通菜很好吃。菠萝船甜品普通。人均约65刀，好停车。", "dt": "2025-05-18", "ne": "Island Radio", "xy": [728.8, 645.0], "id": 101}, {"n": "蒋氏云南米线（老式炸鸡）", "a": "Burwood Chinatown", "t": "炸鸡/小吃", "r": "3", "p": 20, "d": "香辣和原味炸鸡；同场金陵名吃汤包、禾木凉拌贡菜和无骨鸡爪", "i": "云南米线店，柜台摆满老式炸鸡，香气十足，可以外带。", "dt": "2025-05-15", "ne": "Jiang's Yunnan Rice Noodles (old-style fried chicken)", "xy": [455.8, 608.4], "id": 98}, {"n": "The Local", "a": "Enfield", "t": "Cafe", "r": "2", "p": 22, "d": "Cold Brew（招牌Cold Brew Soft Serve当天机器坏）", "i": "开在住宅区街角的Cafe，招牌Cold Brew Soft Serve，但机器偶尔会坏。", "dt": "2025-05-15", "ne": "The Local", "xy": [428.9, 624.2], "id": 99}, {"n": "柴氏风味斋", "a": "Chatswood", "t": "北京菜", "r": "2", "p": 40, "d": "素丸子、麻酱黄瓜、香菜牛肚、芝麻羊肉、糖火烧", "i": "号称来自北京的米其林推荐店，口味不算正宗。牛肉面几乎没味道，烧饼很干；素丸子、麻酱黄瓜、香菜牛肚、芝麻羊肉和糖火烧都还行。人均约40刀。", "dt": "2025-05-15", "ne": "Chai's Flavour House", "xy": [644.0, 321.2], "id": 100}, {"n": "Beehive Cafe Restaurant", "a": "Beecroft", "t": "南美Cafe", "r": "3", "p": 40, "d": "脆皮猪五花、海鲜意面、煎盲槽鱼、牛肉汉堡", "i": "学校旁的南美小Cafe，食客多是退休长者，氛围悠闲。脆皮猪五花、海鲜意面、煎盲槽鱼和牛肉汉堡都有模有样。每月有拉丁舞之夜和西班牙海鲜饭之夜等活动。人均约40刀。", "dt": "2025-05-13", "ne": "Beehive Cafe Restaurant", "xy": [355.3, 187.0], "id": 96}, {"n": "Scala Lane", "a": "Wynyard Lane, CBD", "t": "意大利菜", "r": "4", "p": 65, "d": "佛卡夏配烤大虾、三款意面、桌前现挖提拉米苏", "i": "意大利餐厅，节日也不强制套餐。佛卡夏配烤大虾，酱汁很好；三款意面各有特色；主菜鱼和牛排稍普通。提拉米苏在桌边现挖，非常好吃，很多人会加点第二份。", "dt": "2025-05-13", "ne": "Scala Lane", "xy": [745.8, 548.6], "id": 97}, {"n": "Hi Pocha", "a": "Lidcombe", "t": "韩国酒馆", "r": "3", "p": 40, "d": "无骨辣鸡爪套餐、辣花蛤", "i": "Lidcombe很红的韩国酒馆，晚上常要排队，下午四点多可以外带。无骨辣鸡爪、蒸蛋汤和紫菜饭团的套餐搭配得极好；辣花蛤很入味，剩下的汤还能做火锅底。四个菜约77刀，很实惠。", "dt": "2025-05-11", "ne": "Hi Pocha", "xy": [295.5, 558.5], "id": 94}, {"n": "Prince Bakery & Cafe", "a": "Lidcombe", "t": "韩式烘焙", "r": "3", "p": 12, "d": "番薯紫薯蛋糕（57刀）", "i": "韩国区的烘焙Cafe。番薯紫薯蛋糕外表朴素，里面两层紫薯泥夹心还有紫薯块，很有嚼劲，57刀含巧克力字牌。还有香蕉造型蛋糕和炸三明治等韩式面包。", "dt": "2025-05-11", "ne": "Prince Bakery & Cafe", "xy": [322.4, 554.5], "id": 95}, {"n": "1912 Dumpling Bar 小籠館", "a": "Burwood", "t": "小笼包", "r": "2", "p": 22, "d": "汤包、天王烤鸭包、钟水饺", "i": "新开的小笼包店，大圆窗能看到阿姨现场包小笼包。汤包、天王烤鸭包和钟水饺味道一般，汤汁不够多。价格很贵，四样约60刀。", "dt": "2025-05-10", "ne": "1912 Dumpling Bar", "xy": [470.5, 581.9], "id": 92}, {"n": "冒笑笑冒菜", "a": "Burwood", "t": "冒菜", "r": "2", "p": 22, "d": "香辣猪蹄、香辣鸡爪、冒烤鸭", "i": "网评较差的冒菜店，实际没那么难吃。香辣猪蹄和香辣鸡爪软烂入味；冒菜只有咸辣、少了香气；冒烤鸭用整根鸭腿配卤粉，很过瘾。店主是一位女生独力经营。", "dt": "2025-05-10", "ne": "Mao Xiaoxiao Maocai", "xy": [440.9, 591.8], "id": 93}, {"n": "Jiggle Cheesecake", "a": "Carlingford Court", "t": "芝士蛋糕", "r": "3", "p": 9, "d": "芝士蛋糕、蛋挞、嫩仙草豆浆", "i": "美食广场里开了很久的芝士蛋糕店，迷你尺寸9刀，有原味、草莓和抹茶。芝士蛋糕软嫩清淡，非常好吃；蛋挞口味多，斑斓和咖啡款不错，但不如芝士蛋糕出彩。嫩仙草豆浆可以调甜度。", "dt": "2025-05-07", "ne": "Jiggle Cheesecake", "xy": [305.5, 301.2], "id": 89}, {"n": "重庆小面面", "a": "Chatswood（夸父炸串旁）", "t": "重庆小面", "r": "2", "p": 18, "d": "重庆小面", "i": "Chatswood火车站出口小美食广场里的重庆小面，点套餐较划算，含面、凉菜和饮料。小面单点没有肉，偏寡淡，可以配隔壁夸父炸串一起拌着吃。", "dt": "2025-05-07", "ne": "Chongqing Xiaomian", "xy": [660.6, 363.8], "id": 90}, {"n": "夸父炸串", "a": "Chatswood（火车站旁小美食广场）", "t": "炸串", "r": "4", "p": 20, "d": "炸串", "i": "Chatswood火车站出口小美食广场里的炸串，是Chatswood最好吃的炸串之一，配重庆小面一起拌着吃很香。", "dt": "2025-05-07", "ne": "Kuafu Fried Skewers", "xy": [677.4, 320.5], "id": 91}, {"n": "LuYu 卤遇麻辣烫", "a": "Eastwood（火车站韩国边对面）", "t": "麻辣烫", "r": "3", "p": 22, "d": "麻辣烫、炸卤", "i": "Eastwood火车站韩国区出口对面的麻辣烫，炸卤很好吃。食材选择比开业时多，卤鸡爪还会剪好指甲。常有现金付款送饮品等优惠，份量大。", "dt": "2025-05-06", "ne": "LuYu Malatang", "xy": [380.8, 302.1], "id": 88}, {"n": "Lim's Hot Bread", "a": "Eastwood", "t": "越南包", "r": "3", "p": 11, "d": "脆皮猪五花越南包", "i": "Eastwood要排队的越南包店，傍晚常有十几人，但大约十分钟就能排到。脆皮猪五花越南包很香，但没有传说中那么神。一个11刀，够分两顿，很划算。", "dt": "2025-05-04", "ne": "Lim's Hot Bread", "xy": [397.5, 344.8], "id": 86}, {"n": "Uncle Wang", "a": "Zetland", "t": "江浙点心", "r": "2", "p": 40, "d": "小笼包、三色锅贴、凉拌牛杂", "i": "Zetland的江浙点心，比网评好，但价格略贵。盐水鸭非常咸；三色锅贴颜值高但皮偏厚；小笼包爆汁好吃，五个十几刀；凉拌牛杂辣中带甜。人均约40刀。", "dt": "2025-05-04", "ne": "Uncle Wang", "xy": [732.1, 690.2], "id": 87}, {"n": "Lune Croissanterie Rosebery", "a": "Rosebery", "t": "可颂", "r": "2", "p": 12, "d": "Four Cheese可颂", "i": "墨尔本名店Lune在Rosebery的店，宽敞透明，像面包工厂。Four Cheese可颂好吃但没有惊喜，可能要选招牌Jam & Cream款才对。", "dt": "2025-05-02", "ne": "Lune Croissanterie Rosebery", "xy": [721.6, 728.3], "id": 84}, {"n": "JIBBICOFFEE ROASTERS", "a": "Surry Hills", "t": "泰式咖啡", "r": "X", "p": 12, "d": "Coco Matcha Cloud", "i": "泰国老板开的人气咖啡店，主打各式抹茶加水果和特调。Coco Matcha Cloud的椰子水和抹茶奶盖没有融合在一起，不好喝；抹茶草莓或抹茶芒果可能更稳。小杯12刀，偏贵。", "dt": "2025-05-02", "ne": "JIBBICOFFEE ROASTERS", "xy": [731.2, 601.3], "id": 85}, {"n": "Avner's", "a": "Surry Hills", "t": "贝果烘焙", "r": "3", "p": 14, "d": "巧克力贝果", "i": "开放式厨房的贝果烘焙店，价格实惠，贝果占了大半货架。巧克力贝果配黄油好吃，店员很热情。", "dt": "2025-05-01", "ne": "Avner's", "xy": [732.1, 641.6], "id": 83}, {"n": "228 Hawker Malay Chinese Cuisine", "a": "Burwood", "t": "马来菜", "r": "4", "p": 25, "d": "海南鸡、炸鸡椰浆饭、滑蛋河粉", "i": "Burwood Rd新开的马来餐厅，开业期间排长队。价格实惠，味道好：海南鸡特别嫩；炸鸡椰浆饭的炸鸡一咬就出汁；滑蛋河粉芡汁浓郁，裹着河粉和海鲜，却不油腻。", "dt": "2025-04-17", "ne": "228 Hawker Malay Chinese Cuisine", "xy": [470.3, 604.9], "id": 82}, {"n": "888 GOGI KOREAN BBQ", "a": "Eastwood", "t": "韩烤", "r": "2", "p": 45, "d": "和牛、牛舌、蒸蛋", "i": "原Jonga Jip位置的韩式烤肉店。和牛和牛舌都不错但不算出众；蒸蛋小巧可爱；炸鸡普通。人均约45刀。", "dt": "2025-04-16", "ne": "888 GOGI KOREAN BBQ", "xy": [414.2, 301.5], "id": 81}, {"n": "金陵小吃 Nanjing Gourmet", "a": "Haymarket（唐人街牌坊下）", "t": "南京小吃", "r": "3", "p": 18, "d": "葱油鸡、汤包、牛肉锅贴", "i": "唐人街牌楼下的南京小吃店。葱油鸡很嫩，葱油可以拌饭拌面；牛肉锅贴普通；汤包非常好吃，咬一口汤汁像瀑布一样流出来。价格偏贵，三样约44刀。", "dt": "2025-04-15", "ne": "Nanjing Gourmet", "xy": [713.7, 619.4], "id": 77}, {"n": "禧街炸串", "a": "Haymarket", "t": "炸串", "r": "2", "p": 20, "d": "脆皮鸡柳、辣缸豆苕皮", "i": "路边香气四溢的炸串摊，选择不多，没有青椒。脆皮鸡柳和辣缸豆苕皮味道过得去但不出彩，苕皮偏软，带回家用空气炸锅复炸会更好吃。不如夸父和建德大厦门口那家。", "dt": "2025-04-15", "ne": "Xi Jie Fried Skewers", "xy": [740.7, 588.6], "id": 78}, {"n": "朱妈妈", "a": "唐人街", "t": "饺子馆", "r": "3", "p": 20, "d": "饺子外带", "i": "唐人街的老牌饺子馆，可以外带，味道和十几年前一样。", "dt": "2025-04-15", "ne": "Mother Chu's", "xy": [699.2, 593.1], "id": 79}, {"n": "Giuls", "a": "Surry Hills", "t": "意大利菜", "r": "3", "p": 50, "d": "佛卡夏、炸虾、烤鱿鱼、提拉米苏", "i": "还不太有名气的意大利小餐厅。佛卡夏配的橄榄油很香；炸虾嫩；蝴蝶面偏奶，里面的意大利香肠很好吃；烤鱿鱼又嫩又弹牙，最出色；Fish Crudo普通。提拉米苏蓬松甜蜜，非常好吃。人均约50刀。", "dt": "2025-04-15", "ne": "Giuls", "xy": [759.1, 610.7], "id": 80}, {"n": "Jenny's Bun 珍妮家的面食", "a": "Chatswood", "t": "包子", "r": "3", "p": 3, "d": "猪肉大葱包、猪肉酸豆角包、三鲜包", "i": "Chatswood的包子店，一个3刀，6个有优惠。肉包个头偏小但包子皮松软，猪肉大葱、猪肉酸豆角和三鲜都好吃，适合买回家当早餐。", "dt": "2025-04-14", "ne": "Jenny's Bun", "xy": [635.2, 341.4], "id": 75}, {"n": "Kajiken 歌志轩", "a": "Chatswood", "t": "拌面", "r": "4", "p": 20, "d": "和牛拌面加温泉蛋", "i": "日本拌面连锁店，城市和其他区都有分店。和牛半生熟很嫩，温泉蛋和酸奶酱拌面很好吃。一整碗吃到后面会腻，一大一小合吃一碗面加一份小食刚好。", "dt": "2025-04-14", "ne": "Kajiken", "xy": [681.0, 354.6], "id": 76}, {"n": "Chubby Bun", "a": "Gordon", "t": "汉堡", "r": "3", "p": 13, "d": "Kids Cheese Burger", "i": "Gordon迷你高尔夫旁的汉堡店，像餐车一样可爱。芝士汉堡烤肉香气浓郁，牛肉饼嫩香，用撒满芝麻的面包。儿童汉堡也要13刀，偏贵。", "dt": "2025-04-12", "ne": "Chubby Bun", "xy": [595.2, 205.1], "id": 71}, {"n": "Slowbreads", "a": "Roseville", "t": "烘焙", "r": "3", "p": 12, "d": "巧克力牛角包、巧克力蛋糕", "i": "橱窗挂着悉尼Royal Fine Food冠军旗帜的烘焙店，酸种面包和法棍很受欢迎。巧克力牛角包和巧克力蛋糕都很法式，香气十足。路过值得试，不必专程。", "dt": "2025-04-12", "ne": "Slowbreads", "xy": [652.6, 294.7], "id": 72}, {"n": "Hi Kitchen", "a": "Epping", "t": "韩国菜", "r": "4", "p": 25, "d": "猪杂血肠汤、炸鸡、芝士玉米", "i": "Epping少有人知的韩国餐厅，店里干净宽敞。桌上的迷你小虾米和紫苏粉可以自由加；猪杂血肠汤加虾米很好吃，血肠里的粉条有嚼劲。炸鸡嫩脆，可以配芝士玉米吃。人均约25刀。", "dt": "2025-04-12", "ne": "Hi Kitchen", "xy": [397.4, 253.3], "id": 73}, {"n": "Habibi Juice", "a": "Pennant Hills", "t": "果汁冰沙", "r": "2", "p": 10, "d": "Strawberry Mango冰沙", "i": "Pennant Hills火车站对面的果汁冰沙店，像是为放学学生开的。草莓芒果冰沙鲜榨，一小杯10刀偏贵。也有Acai。", "dt": "2025-04-12", "ne": "Habibi Juice", "xy": [374.2, 157.9], "id": 74}, {"n": "Butcherant", "a": "Epping（Homebush也有）", "t": "韩烤", "r": "4", "p": 30, "d": "和牛、牛舌", "i": "从Homebush开到Epping的韩式烤肉，进店先像在肉店一样选肉。鹿儿岛和牛选择多但很腻，普通和牛和牛舌就很好。小菜免费，可加点一盆生菜包肉。人均约30刀。", "dt": "2025-04-10", "ne": "Butcherant", "xy": [395.0, 272.7], "id": 69}, {"n": "Aster", "a": "InterContinental Sydney", "t": "景观酒吧", "r": "4", "p": 60, "d": "鸡尾酒", "i": "悉尼港景色最好的酒吧之一，海港大桥和歌剧院一览无遗。鸡尾酒造型漂亮，有吹泡泡和棉花糖装饰，很有仙气。", "dt": "2025-04-10", "ne": "Aster", "xy": [734.5, 551.5], "id": 70}, {"n": "Tonight", "a": "Lidcombe", "t": "韩国融合小酒馆", "r": "3", "p": 40, "d": "虾多士、Pipis汤、养乐多沙冰", "i": "Lidcombe很放松的韩国融合小酒馆，菜式不太传统。虾多士弹牙；Rose麻辣烫很辣很奶；Pipi汤看似平凡却让人停不下来。每桌配炸馄饨皮，很好吃。招牌养乐多沙冰收尾。人均约40刀。", "dt": "2025-04-09", "ne": "Tonight", "xy": [299.0, 538.7], "id": 66}, {"n": "Sailor Boy", "a": "Darling Harbour（Playground旁）", "t": "泰国小吃", "r": "3", "p": 25, "d": "九层塔煎盲槽鱼盖饭、咸蛋黄虾球面", "i": "Darling Harbour儿童游乐场旁的泰国小吃店，适合遛娃后解决晚饭。九层塔煎盲槽鱼盖饭的鱼很大片，煎得鲜嫩，九层塔香浓；咸蛋黄虾球面也香。人均约25刀。", "dt": "2025-04-09", "ne": "Sailor Boy", "xy": [707.9, 579.9], "id": 67}, {"n": "巴适小厨", "a": "Zetland", "t": "自贡菜", "r": "5", "p": 30, "d": "火爆腰丝、干煸肥肠、渣渣牛肉、鲜椒爽脆、尖椒兔肉、泡椒仔鸡", "i": "Zetland的自贡菜，悉尼自贡菜热潮的起点，现在周末中午排队不久。火爆腰丝、干煸肥肠、渣渣牛肉、肉末茄子、鲜椒爽脆、尖椒兔肉、泡椒仔鸡和冒菜都好吃，而且每道辣味都不同：泡椒咸酸、鲜椒清香、干煸带甜，冒菜有五香味。人均约30刀，便宜好吃。", "dt": "2025-04-09", "ne": "Bashi Kitchen", "xy": [735.9, 678.8], "id": 68}, {"n": "Ting Hao A 挺好啊", "a": "Chatswood", "t": "韩式中华料理", "r": "4", "p": 40, "d": "奶油虾、糖醋肉、炸酱面、肉沫茄子", "i": "绿底红字大招牌的韩式中华料理。奶油虾个大，面衣轻盈；糖醋肉用厚切里脊但很嫩，果酱汁里还有西柚；炸酱面韧性十足；肉末茄子到位。适合同事聚餐和家庭聚会，也有一人套餐。人均约40刀。", "dt": "2025-04-08", "ne": "Ting Hao A", "xy": [655.9, 313.4], "id": 65}, {"n": "Happi Burger", "a": "Lindfield", "t": "汉堡", "r": "2", "p": 20, "d": "炸鸡汉堡", "i": "黄色调的可爱小汉堡店，菜单丰富。炸鸡汉堡肉排脆嫩，不错。", "dt": "2025-04-07", "ne": "Happi Burger", "xy": [625.9, 269.7], "id": 63}, {"n": "Bakerie@", "a": "Gordon", "t": "烘焙", "r": "3", "p": 12, "d": "葡挞、开心果Cannoli、白糖面包", "i": "北区有名的烘焙店，下午仍有不少面包和肉派。开心果牛角包和杏仁牛角包最受欢迎，葡挞、开心果Cannoli和白糖大面包也不错。三件十几刀，价格不贵。", "dt": "2025-04-07", "ne": "Bakerie@", "xy": [572.8, 204.4], "id": 64}, {"n": "Gusta", "a": "Pennant Hills", "t": "Pizza/意面", "r": "3", "p": 20, "d": "Pizza、辣意面", "i": "Pizza和意面店，机烤但好吃，每道工序都有专人负责，很忙碌。可以要求少放芝士。意面很辣很过瘾。人均约20刀。", "dt": "2025-04-05", "ne": "Gusta", "xy": [378.0, 146.4], "id": 62}, {"n": "Afterglow Eatery", "a": "Epping Park", "t": "Cafe", "r": "4", "p": 30, "d": "Fish Tacos、虾汉堡、鸡蛋培根卷", "i": "Epping量大价优的Cafe，门口阳光很好。Fish Tacos份量大；虾汉堡的虾饼里有好几只完整的虾，只是略焦；鸡蛋培根卷里还有薯饼，适合外带当早餐。人均约30刀。", "dt": "2025-04-04", "ne": "Afterglow Eatery", "xy": [410.9, 259.0], "id": 61}, {"n": "Meet Bun", "a": "Cherrybrook Shopping Village（每周配送）", "t": "粤菜/每周配送", "r": "4", "p": 30, "d": "每周配送三菜套餐", "i": "粤菜大厨掌勺的家庭每周配送服务，每天有四道菜，可选两菜、三菜或四菜，菜式不重复，下午4到6点送到家，微波炉加热即可。2大2小一周三菜套餐约210刀，适合忙碌的双职工家庭，主要配送西北区。", "dt": "2025-04-02", "ne": "Meet Bun", "xy": [302.6, 101.4], "id": 60}, {"n": "Morena", "a": "Martin Place", "t": "南美菜", "r": "2", "p": 130, "d": "烤牛舌、牛排、秘鲁鱼生", "i": "热情洋溢又有格调的南美餐厅，服务员很会推销。餐包不推荐；两道秘鲁风Raw鱼生不错；烤牛舌和牛排很好吃；Beef Tartare加了大量洋葱和酱料，盖过牛肉香，可以不点。人均约130刀，偏贵，适合约会。", "dt": "2025-04-01", "ne": "Morena", "xy": [741.2, 555.2], "id": 57}, {"n": "一呷一嗦（已关）", "a": "Eastwood", "t": "长沙米粉", "r": "4", "p": 18, "d": "长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花、卤牛肉", "i": "已关门的Eastwood长沙米粉店，原址现为老细屋里。曾以长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花和卤牛肉闻名。", "dt": "2025-04-01", "ne": "Yi Jia Yi Suo (closed)", "xy": [372.1, 322.4], "id": 58}, {"n": "Khanom House", "a": "Chippendale", "t": "泰式烘焙", "r": "3", "p": 10, "d": "抹茶芝士蛋糕、Pandan炸面包", "i": "蓝色小房子里新开的泰式烘焙店，以前在各市集流动摆摊。很多甜品是斑斓口味，抹茶芝士蛋糕和斑斓炸面包都好吃。两件约20刀，略贵。", "dt": "2025-04-01", "ne": "Khanom House", "xy": [696.5, 616.3], "id": 59}, {"n": "小龙坎老火锅", "a": "Dixon One, Haymarket", "t": "火锅", "r": "4", "p": 70, "d": "霸王牛肉、椒麻大刀牛舌", "i": "连锁川味火锅，近年明显变好吃了。霸王牛肉辣到飙泪，非常刺激；椒麻大刀牛舌也是必点。人均约70刀。", "dt": "2025-03-29", "ne": "Xiaolongkan Hotpot", "xy": [733.5, 618.2], "id": 55}, {"n": "My Zakaya", "a": "Surry Hills", "t": "居酒屋", "r": "3", "p": 80, "d": "炖蛋、和牛排、三文鱼腩寿司、烤鳕鱼、生腌天堂虾、炸鸡", "i": "Surry Hills的日式居酒屋，菜式小份，可以多点几样。炖蛋、和牛排、三文鱼腩寿司、烤鳕鱼、生腌天堂虾和炸鸡都好吃。氛围轻松，适合下班后来。人均约80刀，略贵。", "dt": "2025-03-29", "ne": "My Zakaya", "xy": [717.7, 615.3], "id": 56}, {"n": "Mokomoko Patisserie", "a": "Quay St, Haymarket", "t": "甜品", "r": "3", "p": 14, "d": "现挤泡芙、小蛋糕", "i": "市中心粉嫩的甜品店，波浪纹装修像集装箱。泡芙现挤，比小蛋糕稍好吃；小蛋糕个个可爱，两人分一个刚好。隆重的草莓蛋糕和圆圆的提拉米苏也值得试。", "dt": "2025-03-28", "ne": "Mokomoko Patisserie", "xy": [725.0, 575.9], "id": 54}, {"n": "Pasticceria Tamborrino", "a": "Five Dock", "t": "意大利甜品", "r": "3", "p": 14, "d": "迷你提拉米苏、开心果挞、开心果泡芙", "i": "Five Dock意大利街上常排队的传统意式糕饼店，品类有几十种。悉尼独有的Tetta Della Monaca很抢手，容易售罄。迷你提拉米苏、巧克力炸面包、开心果挞和开心果泡芙都很好吃。", "dt": "2025-03-27", "ne": "Pasticceria Tamborrino", "xy": [523.7, 557.7], "id": 51}, {"n": "Dino's", "a": "Five Dock", "t": "意式三明治", "r": "4", "p": 18, "d": "Ultimate Deli佛卡夏三明治", "i": "Five Dock主街远近闻名的意式三明治和Pizza店。Ultimate Deli厚三明治用蓬松有韧劲的佛卡夏，夹奶酪、火腿、红椒和绿叶菜，搭配丰富，非常好吃。", "dt": "2025-03-27", "ne": "Dino's", "xy": [520.6, 554.9], "id": 52}, {"n": "Late Night Table", "a": "North Strathfield", "t": "韩国小酒馆", "r": "3", "p": 70, "d": "蜂巢米酒、刺身拼盘、海胆意面", "i": "人气韩国小酒馆，以前晚上要排长龙。招牌蜂巢米酒很好喝；刺身拼盘新鲜好吃；海胆意面很咸很油。人均约70刀，不算便宜。", "dt": "2025-03-27", "ne": "Late Night Table", "xy": [420.1, 523.5], "id": 53}, {"n": "Metatai", "a": "Macquarie Shopping Centre", "t": "铁板汉堡排", "r": "3", "p": 28, "d": "铁板汉堡排", "i": "新开的铁板汉堡排店，厨师把肉排煎到半熟后放在桌前小铁板上，由客人自己掌握熟度。可以加芝士片和大量芝士丝，很浓郁。桌上有七种调味料，一块肉能吃出七种味道。牛味略重，但很好玩，值得去一次。", "dt": "2025-03-22", "ne": "Metatai", "xy": [488.6, 271.0], "id": 49}, {"n": "Zilver 同乐轩", "a": "Westfield Chatswood", "t": "早茶", "r": "3", "p": 40, "d": "烧卖、虾饺", "i": "曾是悉尼饮茶界的龙头，墙上挂满来访香港明星的合影，现在Chatswood也有分店。出品依然稳定，烧卖和虾饺扎实，皮不会一夹就散。人均约40刀，价格偏高。", "dt": "2025-03-22", "ne": "Zilver", "xy": [646.5, 361.4], "id": 50}, {"n": "Cafe Elation", "a": "Gladesville", "t": "Cafe", "r": "3", "p": 22, "d": "抹茶拿铁", "i": "躲在路边树荫下的小Cafe，林荫道上摆着一排桌子，春天会飘落小黄花，环境很美。抹茶拿铁不错。", "dt": "2025-03-21", "ne": "Cafe Elation", "xy": [521.1, 453.1], "id": 48}, {"n": "Nikan Persian Restaurant", "a": "Ryde", "t": "波斯菜", "r": "2", "p": 35, "d": "鸡肉串、烤鸡腿配酸奶锅巴", "i": "网上有人称为悉尼第一的伊朗餐厅。长粒咸米饭用调味肉汤煮成，松软入味；鸡肉串稳妥；烤鸡腿配酸奶锅巴很有异域风情。整体和其他伊朗餐厅差别不大。", "dt": "2025-03-20", "ne": "Nikan Persian Restaurant", "xy": [470.9, 397.9], "id": 46}, {"n": "Du Plessy Pralin & Otello Chocolates", "a": "West Pymble", "t": "巧克力蛋糕", "r": "3", "p": 15, "d": "榛果巧克力蛋糕", "i": "因华人社交媒体意外走红的西人巧克力店，招牌榛果巧克力蛋糕每人限购一个，建议开门前就去排队。巧克力慕斯浓郁醇厚，味道像金沙巧克力，对亚洲人来说偏甜，配茶刚好。老板大叔很友善。", "dt": "2025-03-20", "ne": "Du Plessy Pralin & Otello Chocolates", "xy": [547.4, 234.5], "id": 47}, {"n": "Princess J 焦功煮", "a": "Burwood", "t": "麻辣烫/香锅", "r": "3", "p": 22, "d": "麻辣香锅配剁椒", "i": "Burwood宽敞整洁的麻辣烫和香锅店，食材选择多，腌制鲜肉有十来种。剁椒和XO酱免费添加，剁椒配麻辣香锅非常好吃。炸串也值得一试。", "dt": "2025-03-19", "ne": "Princess J", "xy": [457.1, 574.6], "id": 44}, {"n": "麵屋猪一 Inoichi Ramen", "a": "Burwood", "t": "日式拉面", "r": "2", "p": 22, "d": "自定义拉面", "i": "华人区新开的连锁日式拉面店，下单时可以调整辣度、面条软硬、配菜和油量。汤头浓郁，面条软硬适中，作为普通拉面可以，不必专程。", "dt": "2025-03-19", "ne": "Inoichi Ramen", "xy": [446.1, 606.7], "id": 45}, {"n": "BrewTopia", "a": "Burwood", "t": "咖啡/酸奶冰淇淋", "r": "3", "p": 9, "d": "咖啡、酸奶冰淇淋", "i": "Burwood的咖啡和酸奶冰淇淋店，粉色装潢像芭比玩具世界，少女心十足，分店有蓝色和绿色主题。", "dt": "2025-03-18", "ne": "BrewTopia", "xy": [476.6, 590.0], "id": 43}, {"n": "Sir Manong", "a": "Chatswood Chase", "t": "菲律宾菜", "r": "3", "p": 19, "d": "烤猪手", "i": "Chatswood Chase的菲律宾菜，烤猪手19刀，猪皮咬下去嘎嘣脆，嚼起来又是韧韧的胶质，猪肉也嫩。适合外带配啤酒。", "dt": "2025-03-17", "ne": "Sir Manong", "xy": [686.3, 332.0], "id": 41}, {"n": "Fabbrica Pasta Bar", "a": "Chatswood Chase", "t": "意大利面", "r": "4", "p": 37, "d": "蝴蝶面、自组三明治、提拉米苏", "i": "Chatswood Chase美食广场里的Fa
