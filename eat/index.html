bbrica意面，不用再跑市中心。蝴蝶面带辣，冲淡了腻感；可以用面包、Salami和酱料自己组三明治。提拉米苏撒少许盐，湿软绵密，非常好吃。人均约37刀。", "dt": "2025-03-17", "ne": "Fabbrica Pasta Bar", "xy": [636.5, 326.7], "id": 42}, {"n": "Getbawi", "a": "Eastwood", "t": "韩式鱼生", "r": "4", "p": 47, "d": "鱼生配海胆、炸大虾、辣蟹汤（38刀三只蟹）", "i": "Eastwood的韩式鱼生店，纯鱼生不腌制，有三种鱼和海胆，蘸辣蒜蓉豆瓣酱，有点潮州鱼生的风味。炸大虾比手掌还大，香脆必点。最推荐辣蟹汤，38刀有3只螃蟹，用料十足，汤拌饭非常好吃。人均约47刀。", "dt": "2025-03-16", "ne": "Getbawi", "xy": [417.9, 335.6], "id": 39}, {"n": "牛魔王潮汕牛肉火锅", "a": "Eastwood", "t": "潮汕牛肉火锅", "r": "2", "p": 50, "d": "吊龙伴、腐乳鸡翅、湿炒牛肉粿条", "i": "新开的潮汕牛肉火锅，玻璃窗前有师傅现场切牛肉。吊龙伴最香，五花趾和雪花一般。生腌三文鱼马马虎虎，湿炒牛肉粿条还行，腐乳鸡翅好吃。整体中等偏上，潮味不算浓。", "dt": "2025-03-16", "ne": "Niu Mo Wang Teochew Beef Hotpot", "xy": [392.7, 294.4], "id": 40}, {"n": "It's Recess", "a": "Surry Hills", "t": "三明治", "r": "3", "p": 13, "d": "牛油果鸡肉三明治", "i": "克莱因蓝的清新三明治店。牛油果鸡肉三明治吐司松软，酱料好吃，牛油果和鸡肉新鲜，营养均衡，适合当午餐便当。每个约12到15刀。", "dt": "2025-03-15", "ne": "It's Recess", "xy": [751.9, 640.4], "id": 36}, {"n": "La Pizza Bella", "a": "Darlinghurst", "t": "Pizza", "r": "3", "p": 8.9, "d": "Pepperoni大片Pizza", "i": "超大尺寸Pizza店，一个是普通Pizza的三倍大，一片比手掌还大。经典Pepperoni一片8.9刀，店员会帮忙加热，软乎乎油滋滋，一片就饱。", "dt": "2025-03-15", "ne": "La Pizza Bella", "xy": [765.7, 600.7], "id": 37}, {"n": "ellu cafe", "a": "Surry Hills", "t": "韩式Cafe", "r": "3", "p": 40, "d": "蟹肉Pasta、抹茶拿铁", "i": "评分4.8的韩式小Cafe，粉色砖砌小房子，内部是古朴的两层小民居，桌子不多但精致。二楼窗边座位最抢手，可以看街景。蟹肉Pasta不错。人均约40刀。", "dt": "2025-03-15", "ne": "ellu cafe", "xy": [743.4, 598.1], "id": 38}, {"n": "OMMI DON", "a": "Chatswood Lemon Grove", "t": "台式丼饭", "r": "3", "p": 18, "d": "极致三拼丼、冷冻盐酥鸡和卤肉燥", "i": "台式丼饭店，也是冷冻盐酥鸡和卤肉燥等台湾小吃的品牌，门店可以买冷冻品。极致三拼丼有排骨、虾卷和香肠，下面铺酸菜和卤肉燥，很满足。", "dt": "2025-03-13", "ne": "OMMI DON", "xy": [670.0, 364.7], "id": 33}, {"n": "Chew Babe Pet Grooming Cafe", "a": "Macquarie Park", "t": "宠物Cafe/佛卡夏", "r": "3", "p": 15, "d": "Pistachio Head、Not So Boring、Croques", "i": "宠物美容店兼Cafe，可以买猫狗零食，吃饭时还能看到狗狗洗澡。佛卡夏三明治份量很大，两个女生分一份就够。Pistachio Head的开心果碎配意大利香肠很搭；Not So Boring的辣鸡肉拌得香；裹满火烤芝士的Croques很香。", "dt": "2025-03-13", "ne": "Chew Babe Pet Grooming Cafe", "xy": [505.5, 287.5], "id": 34}, {"n": "Simply Sandwiches", "a": "Crows Nest", "t": "越南包", "r": "2", "p": 13, "d": "脆皮猪五花越南包", "i": "North Sydney上班族会专程来买的越南包店。猪五花依然香脆油润，但近来味道不太稳定，有的地方很甜，有的地方很咸。一个13刀，切半能吃两顿。", "dt": "2025-03-13", "ne": "Simply Sandwiches", "xy": [726.6, 442.7], "id": 35}, {"n": "Ken-Chan Curry", "a": "Neutral Bay", "t": "日式咖喱/二郎系拉面", "r": "4", "p": 20, "d": "炸鸡滑蛋咖喱饭、二郎系拉面、金奖炸鸡", "i": "很有特色的日式咖喱屋，还有澳洲少见的二郎系拉面。炸鸡滑蛋咖喱饭很受小朋友欢迎。二郎系拉面加了猪肥肉，汤底油脂香扑鼻，像日式版卤肉饭，怕腻可以把肥肉撇掉。店里的炸鸡得过金奖。人均约20刀。", "dt": "2025-03-10", "ne": "Ken-Chan Curry", "xy": [754.9, 444.0], "id": 30}, {"n": "Il Eok Jo", "a": "Lidcombe", "t": "韩式腌鱼生", "r": "3", "p": 40, "d": "芝麻油紫苏叶腌鱼生", "i": "Lidcombe知名度较高的韩式鱼生店，鱼生先用芝麻油和紫苏叶腌过，配多种重口小菜和酱料，用紫菜包着吃，每卷都能换口味。人均约40刀。", "dt": "2025-03-10", "ne": "Il Eok Jo", "xy": [305.8, 567.2], "id": 31}, {"n": "The Brook Eatery", "a": "Cherrybrook Village", "t": "Cafe", "r": "3", "p": 22, "d": "提拉米苏、奥利奥蛋糕", "i": "菜单很大的社区Cafe，从早餐、午餐、下午茶到晚餐都有。提拉米苏和奥利奥蛋糕份量大得惊人，质朴实惠。", "dt": "2025-03-10", "ne": "The Brook Eatery", "xy": [299.6, 98.6], "id": 32}, {"n": "Miji Bar & Grill", "a": "North Sydney", "t": "日式餐吧", "r": "2", "p": 45, "d": "刺身、烤虾、温泉蛋炸鸡、鳕鱼定食", "i": "霓虹灯闪烁的日式餐吧，营造涩谷银座的氛围。午市菜单选择很少；刺身和烤虾不错，温泉蛋炸鸡满足；鳕鱼定食的味噌裹得太厚，很甜，盖过鱼味。晚市口碑更好。", "dt": "2025-03-09", "ne": "Miji Bar & Grill", "xy": [729.5, 481.1], "id": 28}, {"n": "Bar Lume Deli", "a": "North Sydney", "t": "意式Deli", "r": "3", "p": 20, "d": "Salami配茄子红椒番茄沙拉", "i": "North Sydney Metro站附近的意式Deli，Salami配茄子、红椒和番茄沙拉，看似朴素，味道浓郁，肉质鲜美。", "dt": "2025-03-09", "ne": "Bar Lume Deli", "xy": [733.3, 469.6], "id": 29}, {"n": "Yume Sushi", "a": "North Strathfield", "t": "日料", "r": "3", "p": 35, "d": "刺身、炸鸡排饭、炙烤寿司", "i": "韩国厨师经营的小日料店，外表普通但味道不错。刺身新鲜，炸鸡排饭香脆，三款炙烤寿司有模有样。人均约35刀。", "dt": "2025-03-08", "ne": "Yume Sushi", "xy": [407.7, 530.6], "id": 25}, {"n": "禚家 Cho Express", "a": "Chatswood", "t": "台式便当", "r": "5", "p": 10, "d": "卤肉饭、便当", "i": "掀起悉尼台式便当风潮的禚家，众多模仿者都比不上。柜台里的饭菜色泽明亮、干净诱人，卤肉饭在悉尼无人能及。一盒近10刀，百吃不腻。", "dt": "2025-03-08", "ne": "Cho Express", "xy": [670.9, 313.5], "id": 26}, {"n": "Smoque Brasserie", "a": "Chatswood", "t": "法餐", "r": "3", "p": 35, "d": "青口锅、牛排、鸭腿", "i": "Chatswood价格亲民的法式小馆，适合工作日午餐。青口锅、牛排和鸭腿味道都不错，除了薯条都很健康。人均约35刀。", "dt": "2025-03-08", "ne": "Smoque Brasserie", "xy": [635.3, 351.0], "id": 27}, {"n": "Ooshman", "a": "North Strathfield", "t": "黎巴嫩卷饼", "r": "3", "p": 15, "d": "卷饼、Cheese球", "i": "在悉尼有二十多家分店的黎巴嫩卷饼，饼皮是中东烤饼，非常香，配料有肉有菜有酱。个头很大，切成两半，半份加几颗芝士球就是一顿饭。", "dt": "2025-03-07", "ne": "Ooshman", "xy": [423.6, 534.1], "id": 24}, {"n": "The Place Poke & Pasta", "a": "Eastwood", "t": "韩式波奇碗", "r": "3", "p": 25, "d": "三文鱼波奇碗配荞麦面加煎五花", "i": "Eastwood火车站韩国区出口的韩式波奇碗和意面店。三文鱼刺身波奇配荞麦面，加特制芝麻酱油蛋黄酱非常好吃，还可以加3刀煎五花肉。一碗约25刀，偏贵。", "dt": "2025-03-05", "ne": "The Place Poke & Pasta", "xy": [383.3, 342.4], "id": 21}, {"n": "Kyue Japanese Restaurant", "a": "Willoughby", "t": "日式炸猪排", "r": "3", "p": 43, "d": "炸安格斯牛排、滑蛋炸猪排", "i": "新开的日式炸猪排店，桌上调味料特别多，每一口都能换味道。炸安格斯牛排和滑蛋炸猪排都好吃，炸衣酥脆，肉质新鲜。人均约43刀，偏贵。", "dt": "2025-03-05", "ne": "Kyue Japanese Restaurant", "xy": [707.9, 354.9], "id": 22}, {"n": "Butter Boy", "a": "Chatswood Chase", "t": "饼干", "r": "3", "p": 8.2, "d": "Milk Choc饼干", "i": "Chatswood Chase的饼干店，现场烘焙很新鲜。Milk Choc饼干很好吃，很甜。一块8.2刀，偏贵。", "dt": "2025-03-05", "ne": "Butter Boy", "xy": [687.5, 347.4], "id": 23}, {"n": "Shahan Persian Restaurant", "a": "West Pennant Hills", "t": "波斯菜", "r": "3", "p": 35, "d": "薄脆蘸酸奶、鸡羊肉串、番茄焖鸡腿、石榴籽咸饭", "i": "网上评分4.8的本地波斯餐厅。薄脆蘸酸奶是很好的开胃菜；鸡肉和羊肉串稳妥；番茄焖鸡腿也不错。咸米饭撒满石榴籽，寓意多福。", "dt": "2025-03-01", "ne": "Shahan Persian Restaurant", "xy": [290.0, 208.6], "id": 20}, {"n": "潮汕真味美食", "a": "Eastwood夜市", "t": "潮汕卤味", "r": "4", "p": 20, "d": "猪脚尖、圆蹄、猪耳、肥肠", "i": "Eastwood夜市新开的潮汕卤味摊，汕头阿姨很热情，可以先试吃。猪脚尖、圆蹄、猪耳和肥肠配蒜泥白醋和辣椒油都很好吃，潮汕人值得一试。", "dt": "2025-02-24", "ne": "Chaoshan Zhenwei", "xy": [423.1, 313.0], "id": 19}, {"n": "Praus Frozen Yogurt", "a": "Gordon", "t": "酸奶冰淇淋", "r": "3", "p": 8, "d": "自选酸奶冰淇淋", "i": "Gordon的自助酸奶冰淇淋店，可以自己装酸奶、加配料，小朋友很喜欢。人均约8刀。", "dt": "2025-02-23", "ne": "Praus Frozen Yogurt", "xy": [589.7, 220.9], "id": 18}, {"n": "倔爷火锅", "a": "Burwood（原大龙火锅）", "t": "四川火锅", "r": "4", "p": 50, "d": "嫩牛肉、肥肠、毛肚、鸭肠、虾滑", "i": "原大龙火锅位置新开的四川火锅，80年代复古风，像悉尼版文和友，很有氛围。嫩牛肉、肥肠、毛肚、鸭肠和虾滑都很好吃。酱料台有店家秘制酱料。", "dt": "2025-02-22", "ne": "Jue Ye Hotpot", "xy": [442.0, 581.5], "id": 17}, {"n": "The Honest Chicken", "a": "Cherrybrook Village", "t": "葡式烤鸡", "r": "3", "p": 22, "d": "烤鸡腿、土豆沙拉", "i": "葡式烤鸡店，烤鸡好吃又不太油腻，一只鸡腿就能吃饱。土豆沙拉奶香浓郁。", "dt": "2025-02-21", "ne": "The Honest Chicken", "xy": [303.1, 107.2], "id": 15}, {"n": "Kamado Japanese Kitchen", "a": "Cherrybrook Village", "t": "日料", "r": "3", "p": 35, "d": "Salmon Taco、炙烤三文鱼寿司、Carpaccio、唐扬炸鸡", "i": "Cherrybrook Village购物中心的日料店，周五晚上不订位通常没座位。三文鱼菜式都好吃，Salmon Taco、炙烤三文鱼寿司和三文鱼薄切都值得点；唐扬炸鸡水嫩多汁。人均约35刀。", "dt": "2025-02-21", "ne": "Kamado Japanese Kitchen", "xy": [307.0, 95.7], "id": 16}, {"n": "Pantai Pan Asian Restaurant", "a": "Eastwood", "t": "泰国菜", "r": "3", "p": 25, "d": "生菜包猪颈肉", "i": "Eastwood韩国区新开的泰国菜，由韩国人经营，满眼绿色装潢，味道不错。生菜包猪颈肉最好吃，桌上的辣酱是老干妈，可以自己配青辣椒。人均约25刀。", "dt": "2025-02-18", "ne": "Pantai Pan Asian Restaurant", "xy": [373.3, 307.7], "id": 14}, {"n": "Thuan Thien Bakery", "a": "North Strathfield", "t": "越南包", "r": "3", "p": 7, "d": "脆皮猪五花越南卷", "i": "古朴的老式越南面包店，还卖七八十年代流行的奶油蛋糕。脆皮猪五花越南包只要7刀，个头小一些，配料和酱料稍逊，但能吃饱，非常实惠。", "dt": "2025-02-15", "ne": "Thuan Thien Bakery", "xy": [413.2, 519.4], "id": 13}, {"n": "Savoury Dining", "a": "North Strathfield", "t": "越南粉", "r": "3", "p": 40, "d": "40刀豪华牛肉粉（牛骨髓、牛排骨）", "i": "豪华版越南牛肉粉，一碗40刀，除了和牛片和牛肉丸，还有一根大牛骨髓和一大块牛排骨。牛骨髓化进汤里让汤更浓郁鲜美，牛排骨一抿就脱骨。贵但不算过分，服务员还会送小朋友气球。", "dt": "2025-02-14", "ne": "Savoury Dining", "xy": [410.8, 538.8], "id": 11}, {"n": "Shalom Indonesian Restaurant", "a": "Sussex St, CBD", "t": "印尼菜", "r": "4", "p": 12, "d": "印尼烤鸡腿配Balinese Sauce", "i": "Sussex St上默默经营多年的印尼餐厅。印尼烤鸡腿非常香，配秘制Balinese Sauce很好吃。一份12刀，不贵。", "dt": "2025-02-14", "ne": "Shalom Indonesian Restaurant", "xy": [702.3, 613.4], "id": 12}, {"n": "Banksia Bakehouse", "a": "Grosvenor Place, George St, CBD", "t": "蛋糕", "r": "3", "p": 14, "d": "心形蛋糕", "i": "小巧可爱的心形蛋糕，适合节日送礼，颜色偏鲜艳。", "dt": "2025-02-13", "ne": "Banksia Bakehouse", "xy": [742.5, 531.5], "id": 9}, {"n": "Thirty 7even Dining", "a": "Macquarie Park", "t": "台湾融合", "r": "3", "p": 40, "d": "紫菜Cracker、黑松露萝卜糕、盐酥鸡、虾多士", "i": "Macquarie Park新楼盘下的台湾融合菜。紫菜脆片、黑松露萝卜糕、盐酥鸡和虾多士都好吃，虾多士又脆又香，虾个头大。人均约40刀，不便宜，附近可以来尝鲜，不必专程。", "dt": "2025-02-13", "ne": "Thirty 7even Dining", "xy": [504.1, 262.6], "id": 10}, {"n": "ParkBongSook 朴奉淑餐馆", "a": "Eastwood", "t": "韩式烤排骨/脊骨", "r": "3", "p": 30, "d": "盐烤排骨（60刀）、辣酱烤脊骨配餐包", "i": "韩式烤排骨和脊骨店。辣酱烤脊骨配餐包，脊骨炖得很嫩，需要双手慢慢啃，骨缝的筋肉和外层瘦肉口感各不相同；餐包蘸辣酱很香。人均约30刀。", "dt": "2025-02-11", "ne": "ParkBongSook", "xy": [406.9, 345.7], "id": 8}, {"n": "Le Salle Dining by Bar Chaplin", "a": "Surry Hills", "t": "小型Fine Dining", "r": "4", "p": 118, "d": "每周更新五道菜", "i": "每晚只接待10位客人的小型Fine Dining，主厨夫妇在开放式厨房里忙碌，灯光昏暗，温馨浪漫。菜单每周更换，五道菜118刀，每位需点一杯酒配餐，越到后面越好吃。缺点是开放式厨房油烟重，吃完身上会有味道。很适合约会。", "dt": "2025-02-10", "ne": "Le Salle Dining by Bar Chaplin", "xy": [720.8, 635.5], "id": 7}, {"n": "Glass Brasserie", "a": "Hilton Sydney", "t": "西餐", "r": "3", "p": 90, "d": "Sashimi、蟹饼、鱿鱼、烤大虾", "i": "希尔顿酒店里的西餐厅，大片落地窗正对QVB和George St，景观典雅。前菜刺身和蟹饼，主菜鱿鱼和烤大虾，都以海鲜为主。不含酒和甜品人均约90刀，偏贵，但氛围很好，适合约会和姐妹聚会。", "dt": "2025-02-09", "ne": "Glass Brasserie", "xy": [720.8, 578.1], "id": 5}, {"n": "Mr Perfect Skewer BBQ 百铺乐烤串", "a": "Lidcombe", "t": "延边烤串", "r": "4", "p": 55, "d": "乳酸菌牛肉串、牛排大串", "i": "据说是国内延边有名的烤串店。牛羊鸡肉质都很好，嫩到油脂噼啪作响。乳酸菌牛肉串用养乐多和奇异果腌制，酸酸甜甜很出彩；大串牛排烤好直接上桌，裹满芝麻非常香。肉新鲜不肥腻，人均约55刀。", "dt": "2025-02-09", "ne": "Mr Perfect Skewer BBQ", "xy": [320.5, 540.7], "id": 6}, {"n": "Portico Chicken", "a": "Pennant Hills", "t": "葡式烤鸡", "r": "4", "p": 14, "d": "葡鸡、海鲜沙拉、鸡盐", "i": "Pennant Hills火车站新开的葡式烤鸡店，干香型葡鸡，一只可以配两种酱。海鲜沙拉新鲜，也卖鸡盐。老板非常友善。两人约28刀，很实惠。", "dt": "2025-02-07", "ne": "Portico Chicken", "xy": [365.6, 153.5], "id": 3}, {"n": "No.1 Skewers 福興炸串", "a": "Eastwood", "t": "炸串", "r": "3", "p": 25, "d": "青椒、掌中宝、小郡肝、乌骨鸡柳", "i": "Eastwood新开的炸串店，选择不算多。青椒、掌中宝和小郡肝都不错；乌骨鸡柳、香肠、玉米、薯塔和年糕适合小朋友。免费提供冰淇淋和苹果汁。人均约25刀。", "dt": "2025-02-07", "ne": "No.1 Skewers", "xy": [407.8, 294.4], "id": 4}, {"n": "Hello Auntie", "a": "Darling Square", "t": "越南融合", "r": "2", "p": 85, "d": "龙虾馄饨、牛排、烤虾配米粉", "i": "偏西式的越南融合餐厅。龙虾馄饨奶味很重；牛排很嫩，做得成功；烤虾配米粉微辣好吃。人均约85刀，不便宜。", "dt": "2025-02-06", "ne": "Hello Auntie", "xy": [720.1, 586.9], "id": 2}, {"n": "胖姨儿手工拉面馆 My Aunt's Handmade Noodles", "a": "Eastwood（Burwood也有）", "t": "西北拉面", "r": "5", "p": 10, "d": "肥肠米线、爆肚宽面、羊排", "i": "从Burwood开到Eastwood的西北手工拉面馆，好吃又实惠。一碗面约20刀出头，可以免费无限续面，付现金95折，还有集章卡，十碗送一碗。肥肠米线、爆肚宽面和羊排都好吃。人均约10刀。", "dt": "2025-02-02", "ne": "My Aunt's Handmade Noodles", "xy": [372.1, 332.0], "id": 1}, {"n": "档口仔", "a": "Hurstville", "t": "粤菜小炒", "r": "5", "p": 35, "d": "五柳炸蛋、芋头扣肉煲、菜心炒肥叉、干炒牛河、酸菜炒大肠、蒜香骨", "i": "Hurstville的粤菜小馆，开业初期厨房和外场应接不暇，出品不稳，两个多月后已经走上正轨，服务跟得上，菜品质量也回来了。五柳炸蛋最出色，五柳汁调得极好，蛋白边缘炸得酥脆，蛋黄溏心，如今在广东也少见。芋头扣肉煲调味出众；菜心炒肥叉猛火快炒，焦香可口。干炒牛河可能是目前悉尼数一数二，只差在本地河粉原料。酸菜炒大肠干净无异味，炒得干爽有锅气，非常下饭；蒜香骨用半肥瘦的肉，蒜香浓。", "dt": "2026-11-21", "ne": "Dang Kou Zai", "xy": [453.1, 883.5], "id": 545}, {"n": "金唐 Golden Century（Crown新店）", "a": "Barangaroo（Crown酒店）", "t": "粤菜酒楼", "r": "5", "p": 75, "d": "乳鸽、XO酱炒Pipi", "i": "老牌粤菜酒楼金唐在Crown酒店开的新店，出品中规中矩。乳鸽做得最好，XO酱炒Pipi也不错，金唐自家的XO酱水准很高；Pipi底下的煎米粉底偶尔发挥不稳，好的煎米粉要中间软、两面脆，带一点金黄焦边。", "dt": "2026-11-21", "ne": "Golden Century (Crown)", "xy": [710.5, 535.3], "id": 546}, {"n": "渝人码头", "a": "Burwood", "t": "川菜", "r": "5", "p": 40, "d": "酸菜鲈鱼、青椒肉丝", "i": "Burwood少数炒菜能吃的川菜馆。酸菜鲈鱼很好吃，小炒也不错，例如青椒肉丝；口水鸡不推荐。", "dt": "2026-11-21", "ne": "Yu Ren Ma Tou", "xy": [462.2, 611.8], "id": 547}, {"n": "Mr Wong", "a": "Bridge Lane, CBD", "t": "粤菜/点心", "r": "5", "p": 80, "d": "点心、紫菜炒饭", "i": "市中心Bridge Lane的知名粤菜餐厅，点心一直是悉尼最出色的之一。单点菜偏向西人口味，XO粉丝海鲜煲的XO酱偏甜、粉丝偏油；紫菜炒饭倒是很好吃。建议以点心为主。", "dt": "2026-11-21", "ne": "Mr Wong", "xy": [703.7, 569.5], "id": 548}, {"n": "Rockpool Bar & Grill", "a": "Hunter St, CBD", "t": "牛排馆", "r": "5", "p": 150, "d": "Rib Eye", "i": "市中心老牌牛排馆，Rib Eye一如既往地出色。意面这些年换过不少，其余菜式中规中矩，来这里就是为了吃牛排。", "dt": "2026-11-21", "ne": "Rockpool Bar & Grill", "xy": [749.4, 582.7], "id": 549}, {"n": "南国", "a": "Revesby", "t": "粤菜小馆", "r": "5", "p": 40, "d": "走地鸡、蒜香骨", "i": "Revesby的粤菜小馆，悉尼南区性价比最高的粤菜之一，价格便宜又好吃，晚晚满座。走地鸡上桌前淋上鸡汁，鸡味更浓，做法简单有效，只是姜葱碟给得少。招牌蒜香骨蒜味浓郁，是一盘合格的蒜香骨。", "dt": "2026-11-21", "ne": "Nan Guo", "xy": [225.8, 825.4], "id": 550}, {"n": "燉品皇·燕鲍翅", "a": "Thomas St, Haymarket", "t": "粤菜", "r": "5", "p": 80, "d": "酸菜炒牛肉、荷香当归红枣蒸走地鸡、鸳鸯炒米、金瓜海鲜炒饭", "i": "唐人街Thomas St的粤菜馆，地道广东味。酸菜炒牛肉是惊喜，牛肉嫩滑，广式甜口酸菜比牛肉还好吃。荷香当归红枣蒸走地鸡，当归红枣香气浓郁，底下垫着荷叶，很入味，可以按口味加酱油。鸳鸯炒米像干炒牛河，经典好吃，份量很大。金瓜海鲜炒饭是招牌。", "dt": "2026-11-21", "ne": "Dun Pin Wong", "xy": [745.0, 600.9], "id": 551}, {"n": "Tobikiri Japanese Kitchen", "a": "Neutral Bay", "t": "Omakase/日料", "r": "5", "p": 200, "d": "Omakase（27道）、豆乳茶碗蒸、昆布盐腌鰤鱼、Toro油脂海葡萄手卷、烟熏寿司、安康鱼肝小猫饭、番茄酿鹅肝、木鱼花玉米浓汤", "i": "Neutral Bay的家庭式日料小厨房，没有一般Omakase的商业感，多的是老板对料理的热爱和巧思，老板会和客人聊天介绍菜式，熟客很多。Omakase约200刀27道，以贵价食材为主，海胆出现三次，非常超值。豆乳茶碗蒸铺三文鱼籽；鰤鱼用昆布和盐腌过再脱水，鲜味更集中。寿司多达17贯，用紫菜裹着Toro刮下的油脂和海葡萄的手卷一秒入魂；有一贯在玻璃罩里烟熏5分钟，打开满是檀香；Mackerel配腌昆布毫无腥味；星鳗焦脆，墨鱼配海胆和紫苏。安康鱼肝捣碎后和寿司饭、芝士碎拌成小猫饭，完全不腥。番茄酿鹅肝配甜高汤，木鱼花玉米浓汤也很有巧思。也可以单点。", "dt": "2026-11-21", "ne": "Tobikiri Japanese Kitchen", "xy": [759.2, 454.7], "id": 552}].filter(x=>x.r!=='X');

<svg viewBox="0 0 100 100" class="kb-h"><defs><linearGradient id="gxH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfdfd"/><stop offset=".45" stop-color="#b9bdc2"/><stop offset=".55" stop-color="#7c8086"/><stop offset="1" stop-color="#d9dce0"/></linearGradient><radialGradient id="gxC" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff8a7e"/><stop offset=".6" stop-color="#d6342a"/><stop offset="1" stop-color="#7d140e"/></radialGradient></defs><rect x="8" y="39" width="84" height="22" rx="11" fill="url(#gxH)" stroke="#4d5156" stroke-width="1"/><rect x="14" y="42" width="72" height="3" rx="1.5" fill="#fff" opacity=".8"/><circle cx="50" cy="50" r="12" fill="url(#gxC)" stroke="#5a0d09" stroke-width="1"/><ellipse cx="46" cy="45" rx="4" ry="2.2" fill="#fff" opacity=".7"/></svg>`;

async function gacha(st,p,fin,live){
  const m=$$(`<div class="xr-g"><canvas class="gb"></canvas>${GACHA_SVG}<button class="kb idle" aria-label="turn">${KNOB_SVG}</button><canvas class="cp"></canvas></div>`);
  st.appendChild(m);const sc=Math.min(1.05,(st.clientHeight-6)/560,(st.clientWidth-16)/320);m.style.transform=`scale(${sc})`;
  const DPR=Math.min(2,window.devicePixelRatio||1)*Math.max(1,sc);
  const cv=m.querySelector('.gb'),x=cv.getContext('2d');cv.width=320*DPR;cv.height=310*DPR;
  const kb=m.querySelector('.kb'),kh=kb.querySelector('.kb-h'),flap=m.querySelector('.flap');
  const CX=160,CY=160,R=136,r=22,ds=sample(p,24,fin);
  const B=ds.map(d=>({x:CX+(Math.random()-.5)*170,y:CY-30+(Math.random()-.5)*150,vx:0,vy:0,a:Math.random()*6,va:0,ph:Math.random()*6,v:GX.vivid(cfg.col(d)[1]),toy:{h:Math.random()*360,x:(Math.random()-.5)*.25,y:(Math.random()-.5)*.12,a:(Math.random()-.5)*.8}}));
  head('扭<em>蛋</em>','转一下旋钮',1);
  let stir=0,awake=0,running=false;
  const step=()=>{const g=.42,fr=stir>0?.996:.965;
    for(const b of B){b.vy+=g;if(stir>0){const dx=b.x-CX,dy=b.y-CY;b.vx+=-dy*.012+(Math.random()-.5)*2.6;b.vy+=dx*.012+(Math.random()-.5)*2.6-.55}
      b.x+=b.vx;b.y+=b.vy;b.vx*=fr;b.vy*=fr;b.a+=b.va;b.va*=.95;b.ph+=Math.hypot(b.vx,b.vy)*.045}
    for(let it=0;it<3;it++){
      for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],b=B[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,o=2*r-d;
        if(o>0){const nx=dx/d,ny=dy/d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const k=-1.45*rv/2;a.vx-=k*nx;a.vy-=k*ny;b.vx+=k*nx;b.vy+=k*ny;const tv=(b.vx-a.vx)*-ny+(b.vy-a.vy)*nx;a.va+=tv*.004;b.va-=tv*.004}}}
      for(const b of B){const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy),lim=R-r-4;if(d>lim){const nx=dx/d,ny=dy/d;b.x=CX+nx*lim;b.y=CY+ny*lim;const vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=1.5*vn*nx;b.vy-=1.5*vn*ny}const tv=b.vx*-ny+b.vy*nx;b.va+=(tv/r-b.va)*.25}}}
    if(stir>0)stir--};
  const glass=()=>{x.save();x.beginPath();x.arc(CX,CY,R,0,Math.PI*2);x.clip();
    let g=x.createRadialGradient(CX+R*.2,CY+R*.25,R*.1,CX,CY,R);g.addColorStop(0,'rgba(40,52,62,.2)');g.addColorStop(1,'rgba(14,18,24,.6)');x.fillStyle=g;x.fillRect(CX-R,CY-R,2*R,2*R);
    g=x.createRadialGradient(CX+R*.35,CY+R*.45,0,CX+R*.35,CY+R*.45,R*.5);g.addColorStop(0,'rgba(255,255,255,.07)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(CX-R,CY-R,2*R,2*R);
    x.fillStyle='rgba(255,255,255,.05)';x.beginPath();x.ellipse(CX+R*.35,CY+R*.2,R*.2,R*.45,.3,0,Math.PI*2);x.fill();x.restore()};
  const front=()=>{x.save();x.beginPath();x.arc(CX,CY,R,0,Math.PI*2);x.clip();
    let g=x.createRadialGradient(CX,CY,R*.76,CX,CY,R);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.24)');x.fillStyle=g;x.fillRect(CX-R,CY-R,2*R,2*R);
    x.save();x.translate(CX-R*.42,CY-R*.5);x.rotate(-.65);g=x.createLinearGradient(0,-R*.28,0,R*.28);g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.beginPath();x.ellipse(0,0,R*.42,R*.2,0,Math.PI*1.02,Math.PI*1.98);x.ellipse(0,R*.02,R*.36,R*.08,0,Math.PI*1.98,Math.PI*1.02,true);x.fill();
    x.strokeStyle='rgba(20,20,20,.25)';x.lineWidth=2;x.beginPath();x.moveTo(0,-R*.2);x.lineTo(0,-R*.04);x.stroke();x.restore();
    x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.ellipse(CX-R*.18,CY-R*.78,R*.09,R*.035,-.25,0,Math.PI*2);x.fill();
    g=x.createLinearGradient(CX+R*.6,0,CX+R*.95,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.6,'rgba(255,255,255,.18)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.ellipse(CX+R*.78,CY,R*.14,R*.6,.1,0,Math.PI*2);x.fill();
    x.beginPath();x.arc(CX,CY,R*.86,Math.PI*.2,Math.PI*.8);x.lineWidth=3;x.strokeStyle='rgba(255,255,255,.12)';x.stroke();
    x.restore();
    g=x.createLinearGradient(CX-R,CY-R,CX+R,CY+R);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(.5,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(255,255,255,.55)');
    x.beginPath();x.arc(CX,CY,R-1.2,0,Math.PI*2);x.lineWidth=2.6;x.strokeStyle=g;x.stroke();
    x.beginPath();x.arc(CX,CY,R-4.5,0,Math.PI*2);x.lineWidth=1;x.strokeStyle='rgba(0,0,0,.28)';x.stroke();
    /* chrome lid on top of the globe */
    const ly=CY-R+8;g=x.createLinearGradient(CX-46,0,CX+46,0);g.addColorStop(0,'#6b6f74');g.addColorStop(.25,'#f3f4f5');g.addColorStop(.5,'#9a9ea3');g.addColorStop(.75,'#e9ebed');g.addColorStop(1,'#5e6267');
    x.fillStyle=g;x.beginPath();x.ellipse(CX,ly+5,46,11,0,0,Math.PI);x.lineTo(CX-46,ly);x.ellipse(CX,ly,46,11,0,Math.PI,0,true);x.closePath();x.fill();
    x.beginPath();x.ellipse(CX,ly,46,11,0,0,Math.PI*2);x.fillStyle=g;x.fill();x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=1;x.stroke();
    x.beginPath();x.ellipse(CX,ly-4,14,5,0,0,Math.PI*2);x.fillStyle='#d6342a';x.fill();x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(CX-4,ly-6,5,1.6,0,0,Math.PI*2);x.fill()};
  const draw=()=>{x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,320,310);glass();
    x.save();x.beginPath();x.arc(CX,CY,R-3,0,Math.PI*2);x.clip();
    for(const b of B)GX.shadow(x,b.x,b.y,r,.42);
    for(const b of B)GX.cap(x,b.x,b.y,r,b.a,Math.sin(b.ph)*1.05+.15,b.v,b.toy);
    x.restore();front()};
  /* settle before the first frame, then sleep: balls only move when the knob turns */
  for(let k=0;k<400;k++)step();B.forEach(b=>{b.vx=b.vy=b.va=0});draw();
  const loop=()=>{if(!live()){running=false;return}step();draw();if(stir>0||--awake>0)raf=requestAnimationFrame(loop);else{running=false;B.forEach(b=>{b.vx=b.vy=b.va=0});draw()}};
  const wake=n=>{awake=Math.max(awake,n);if(!running){running=true;raf=requestAnimationFrame(loop)}};
  let turned=false;
  const turn=async()=>{if(turned)return;turned=true;kb.classList.remove('idle');head('扭<em>蛋</em>中','',0);
    let rot=0;for(let q=0;q<4;q++){rot+=90;kh.style.transform=`rotate(${rot}deg)`;S.clk();buzz(25);stir=24;wake(90);m.classList.add('jolt');T(()=>m.classList.remove('jolt'),180);await wait(300);if(!live())return}
    await wait(700);if(!live())return;
    let lo=0;B.forEach((b,k)=>{if(b.y>B[lo].y)lo=k});B.splice(lo,1);wake(60);
    flap.classList.add('open');T(()=>flap.classList.remove('open'),650);S.tick(.1);
    T(capsule,120)};
  /* capsule rolls out toward you, glows by tier, waits for a tap */
  const cp=m.querySelector('.cp'),cx=cp.getContext('2d'),CW=240,CH=250;cp.width=CW*DPR;cp.height=CH*DPR;
  const v=GX.vivid(cfg.col(fin)[1]),toy={h:Math.random()*360,x:0,y:0,a:0},t=tier(fin);
  const OX=CW/2,FY=170;let craf=0;
  const paint=(py,s,ang,tilt,lift,glow,crack)=>{cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,CW,CH);const rr=34*s;
    if(glow>0){const g=cx.createRadialGradient(OX,py,rr*.6,OX,py,rr*2.4);g.addColorStop(0,t.c);g.addColorStop(1,'rgba(0,0,0,0)');cx.globalAlpha=glow*.7;cx.fillStyle=g;cx.fillRect(0,0,CW,CH);cx.globalAlpha=1}
    cx.fillStyle=`rgba(0,0,0,${.55-.35*Math.min(1,lift/60)})`;cx.filter='blur(4px)';cx.beginPath();cx.ellipse(OX,FY+rr*.95,rr*(1-.3*Math.min(1,lift/60)),rr*.2,0,0,Math.PI*2);cx.fill();cx.filter='none';
    GX.cap(cx,OX,py,rr,ang,tilt,v,toy);
    if(crack>0){cx.save();cx.translate(OX,py);cx.rotate(ang);cx.strokeStyle=t.c;cx.shadowColor=t.c;cx.shadowBlur=14*crack;cx.lineWidth=2.5*crack;cx.beginPath();cx.ellipse(0,0,rr,rr*.26,0,0,Math.PI);cx.stroke();cx.restore()}
    if(glow>0){for(let k=0;k<6;k++){const a=performance.now()/700+k*1.05,d=rr*1.5+Math.sin(a*2)*6,sx=OX+Math.cos(a)*d,sy=py+Math.sin(a)*d*.7,z=2+Math.sin(a*3)*1.5;cx.fillStyle=t.c;cx.globalAlpha=glow;cx.beginPath();cx.moveTo(sx,sy-z*2);cx.lineTo(sx+z*.6,sy);cx.lineTo(sx,sy+z*2);cx.lineTo(sx-z*.6,sy);cx.closePath();cx.fill();cx.beginPath();cx.moveTo(sx-z*2,sy);cx.lineTo(sx,sy+z*.6);cx.lineTo(sx+z*2,sy);cx.lineTo(sx,sy-z*.6);cx.closePath();cx.fill()}cx.globalAlpha=1}};
  function capsule(){if(!live())return;
    const t0=performance.now(),D=1200,y0=30,y1=FY;let ang=0;
    S.pop();T(()=>{S.tick(.2);buzz(15)},640);T(()=>S.tick(.1),940);
    const f=n=>{if(!live())return;let k=Math.min(1,(n-t0)/D);const s=.55+.65*Math.min(1,k/.55);
      let y;if(k<.55){const q=k/.55;y=y0+(y1-y0)*q*q}else if(k<.8){const q=(k-.55)/.25;y=y1-48*Math.sin(q*Math.PI)}else{const q=(k-.8)/.2;y=y1-13*Math.sin(q*Math.PI)}
      ang+=.12*(1-k);paint(y,s,ang,Math.sin(k*6)*.6+.3,y1-y,0,0);
      if(k<1)craf=requestAnimationFrame(f);else waitTap()};craf=requestAnimationFrame(f)}
  function waitTap(){head('出<em>来</em>了','点开扭蛋',1);cp.classList.add('tap');S.tick(.8);
    let w0=performance.now(),opened=false;
    const idle=n=>{if(opened||!live())return;const k=(n-w0)/1000;paint(FY-Math.abs(Math.sin(k*3.2))*4,1.2,Math.sin(k*6.5)*.2,.3,0,Math.min(1,k*1.5)*(.75+.25*Math.sin(k*5)),0);craf=requestAnimationFrame(idle)};craf=requestAnimationFrame(idle);
    cp.onclick=async()=>{if(opened)return;opened=true;cancelAnimationFrame(craf);cp.classList.remove('tap');cp.onclick=null;
      lights(st,t.c);head('要<em>开</em>了','',0);drum(1100);
      for(let c=1;c<=3;c++){S.crack();buzz(20+c*15);const t1=performance.now();
        await new Promise(res=>{const f=n=>{const k=Math.min(1,(n-t1)/360);const j=(1-k)*c*4;paint(FY+(Math.random()-.5)*j,1.2+c*.04,(Math.random()-.5)*.08*c,.3,0,1,c/3*(.6+.4*k));if(k<1)craf=requestAnimationFrame(f);else res()};craf=requestAnimationFrame(f)});
        if(!live())return}
      const t2=performance.now();const sp=n=>{let k=Math.min(1,(n-t2)/560);const e=1-Math.pow(1-k,3);cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,CW,CH);cx.globalAlpha=1-k*.85;
        GX.shell(cx,OX-14*e,FY-90*e,41,-.8*e,v,true);GX.shell(cx,OX+10*e,FY+46*e,41,.5*e,v,false);cx.globalAlpha=1;if(k<1)requestAnimationFrame(sp)};requestAnimationFrame(sp);
      const rv=$$('<div class="xr-rv"></div>'),c=card(fin);c.classList.add('up');rv.appendChild(c);st.appendChild(rv);
      m.style.transition='opacity .45s';m.style.opacity='.12';
      requestAnimationFrame(()=>requestAnimationFrame(()=>rv.classList.add('on')));
      reveal(st,fin);c.onclick=()=>{close();cfg.onOpen(fin)};actions(fin,'再扭一个')}}
  kb.onclick=turn;cv.onclick=turn;
  if(RM()){turned=true;const rv=$$('<div class="xr-rv on"></div>'),c=card(fin);c.classList.add('up');rv.appendChild(c);st.appendChild(rv);m.remove();reveal(st,fin);actions(fin,'再扭一个')}
}
return {play,close};
})();
