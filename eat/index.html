<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>悉尼吃喝</title>
<script>(function(){const g=()=>{if(/^#(party|map|list|spin|swipe|brawl)/.test(location.hash))location.replace('/eat/app/'+location.hash)};g();addEventListener('hashchange',g)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--sub:#7a7772;--g1:#f4f3f1;--g2:#eceae6;--line:#e4e2de;--red:#d6342a;--coral:#ef5b3f;--serif:"Instrument Serif","Noto Serif SC",serif;--zh:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* header */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font:900 19px var(--zh)}
.logo i{width:22px;height:22px;border-radius:50% 50% 50% 8px;background:var(--ink);display:block}
.logo b{color:var(--red);margin-left:-9px}
.nav{display:flex;gap:2px;margin-left:16px}
.nav a{padding:8px 13px;border-radius:999px;color:var(--sub);font-size:14px}.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--g1);color:var(--ink)}
.new{font:600 10px var(--sans);color:var(--coral);margin-left:5px;letter-spacing:.06em;vertical-align:top}
.split{margin:0 auto;display:flex;align-items:center;background:var(--g1);border-radius:999px;padding:4px 4px 4px 16px;gap:10px;color:var(--sub);font-size:14px}
.split button{background:var(--g2);color:var(--ink);border-radius:999px;padding:7px 14px}
.hr{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:11px 20px;font:500 15px var(--sans);transition:transform .2s,background .2s}
.btn.k{background:var(--ink);color:#fff}.btn.k:hover{transform:translateY(-1px)}
.btn.g{background:var(--g1);color:var(--ink)}.btn.g:hover{background:var(--g2)}
.btn.sm{padding:8px 15px;font-size:14px}
.btn.o{border:1px solid var(--line);background:#fff}
@media(max-width:860px){.nav,.split{display:none}.hr .btn.o{display:none}}
/* hero */
.hero{text-align:center;padding:88px 0 10px}
.tagp{display:inline-block;border:1px solid var(--coral);color:var(--coral);border-radius:999px;font:600 12px var(--sans);padding:3px 11px;letter-spacing:.04em}
.hero h1{margin:22px 0 22px;font:400 clamp(54px,9vw,104px)/1.08 var(--zh);font-weight:900;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p{margin:0 auto 28px;max-width:520px;color:var(--sub);font-size:17px}
.hero .cta{display:flex;gap:10px;justify-content:center}
/* arc */
.arc{position:relative;height:430px;margin:24px auto 0;max-width:1400px;overflow:hidden;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}.arc.drag{cursor:grabbing}.arc.drag .cd{transition:opacity .3s!important}.cd{-webkit-user-drag:none}
.cd{position:absolute;left:50%;top:70px;width:220px;height:296px;margin-left:-110px;border-radius:20px;background:#fff;box-shadow:0 22px 50px -26px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.04);transform-origin:50% 1500px;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .6s;overflow:hidden;display:flex;flex-direction:column}
.cd:hover{z-index:5}
.cd .top{height:150px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.cd .top .ty{align-self:flex-start;font:500 12px var(--sans);opacity:.8}
.cd .top .dish{font:900 22px/1.2 var(--zh);letter-spacing:.01em}
.cd .bt{padding:12px 16px 14px;display:flex;flex-direction:column;flex:1}
.cd .nm{font:700 17px/1.3 var(--zh);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cd .mt{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub)}
.st{color:var(--red);letter-spacing:1px;font-size:12px}
@media(max-width:600px){.arc{height:380px}.cd{width:180px;height:250px;margin-left:-90px;top:60px}.cd .top{height:124px}.cd .top .dish{font-size:19px}}
/* ask panel */
.sec{padding:110px 0 0}
.sec h2{text-align:center;margin:0 0 26px;font:900 clamp(34px,5vw,56px)/1.1 var(--zh)}
.sec h2 em{font-style:normal;color:var(--red)}
.panel{border:1px solid var(--line);border-radius:28px;padding:22px;min-height:520px;display:flex;flex-direction:column;background:#fff}
.chat{flex:1;display:flex;flex-direction:column;gap:14px}
.bub{align-self:flex-end;background:var(--g1);border-radius:18px 18px 4px 18px;padding:10px 16px;max-width:80%;font-size:15px}
.who{display:flex;align-items:center;gap:8px;font:600 13px var(--sans)}.who i{width:20px;height:20px;border-radius:50% 50% 50% 6px;background:var(--ink)}
.ans{font-size:15px;line-height:1.7}
.tool{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--sans);color:var(--sub)}
.tool b{color:var(--ink);font-weight:600}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:thin}
.rc{flex:none;width:210px;scroll-snap-align:start;cursor:pointer}
.rc .im{height:140px;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .25s}
.rc:hover .im{transform:translateY(-3px)}
.rc .im .dish{font:900 18px/1.25 var(--zh)}
.rc .cap{padding:8px 2px 0;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.rc .cap b{font:700 14px var(--zh);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rc .cap span{color:var(--sub);white-space:nowrap}
.inp{display:flex;align-items:center;gap:8px;background:var(--g1);border-radius:999px;padding:6px 6px 6px 18px;margin-top:16px}
.inp input{flex:1;border:0;background:none;font:16px var(--sans);outline:none;min-width:0}
.inp button{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;display:grid;place-items:center}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sug button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--sub)}.sug button:hover{color:var(--ink);border-color:var(--ink)}
.typing:after{content:"▍";animation:bl 1s steps(1) infinite;margin-left:1px}@keyframes bl{50%{opacity:0}}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:dt 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.alt{flex:1;display:grid;place-items:center;text-align:center;color:var(--sub)}
.alt h3{font:900 34px var(--zh);color:var(--ink);margin:10px 0 8px}
/* quote */
.quote{text-align:center;padding:130px 0 40px;max-width:900px;margin:0 auto}
.quote q{display:block;font:500 clamp(24px,3.4vw,40px)/1.45 var(--zh);letter-spacing:-.005em;quotes:"“" "”"}
.quote .by{display:inline-flex;align-items:center;gap:10px;margin-top:26px;font-size:14px}
.quote .by i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--zh);color:#fff;background:var(--red);font-style:normal}
.quote .by b{display:block;text-align:left}.quote .by span{display:block;color:var(--sub);font-size:12.5px;text-align:left}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:70px}.tile{grid-column:span 2}.tile.w{grid-column:span 3;min-height:300px}
.tile{background:var(--g1);border-radius:24px;padding:24px;min-height:330px;display:flex;flex-direction:column;transition:background .2s}
.tile:hover{background:var(--g2)}
.tile h4{margin:0 0 6px;font:700 17px var(--zh)}.tile p{margin:0;color:var(--sub);font-size:14px}
.tile .vis{flex:1;display:grid;place-items:center;margin-top:18px}
@media(max-width:860px){.tiles{grid-template-columns:1fr}.tile,.tile.w{grid-column:auto}}
/* footer */
footer{margin-top:120px;padding:40px 0 0;border-top:1px solid var(--line);overflow:hidden}
.ft{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--sub)}
.ft b{display:block;color:var(--ink);font:700 18px/1.4 var(--zh);max-width:300px}
.wm{font:900 clamp(90px,24vw,330px)/.8 var(--zh);color:transparent;-webkit-text-stroke:1.2px #dedbd5;text-align:center;margin:40px 0 -0.08em;white-space:nowrap;letter-spacing:-.02em}
.top-btn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:18px;z-index:40;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none}
.top-btn.on{opacity:1;transform:none;pointer-events:auto}
/* sheet */
#sh{position:fixed;inset:0;z-index:60;display:none}
#sh.on{display:block}
#sh .bg{position:absolute;inset:0;background:rgba(20,20,20,.35);backdrop-filter:blur(3px)}
#sh .pn{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:0 0 30px;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){#sh .pn{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:28px;animation:none}}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#sh .im{height:170px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}
#sh .im .dish{font:900 28px/1.2 var(--zh)}
#sh .bd{padding:20px 24px 0}
#sh h3{margin:0 0 8px;font:900 26px/1.3 var(--zh)}
#sh .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
#sh .chips{color:var(--sub);font-size:13.5px;gap:0}#sh .chips span:not(:last-child):after{content:'·';margin:0 8px}
#sh h6{margin:16px 0 6px;font:600 12px var(--sans);letter-spacing:.12em;color:var(--sub)}
#sh p{margin:0;font-size:15px;line-height:1.85}
#sh .x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.8);font-size:20px}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.proto{position:fixed;left:14px;bottom:14px;z-index:40;background:var(--coral);color:#fff;font:600 11px var(--sans);padding:5px 10px;border-radius:999px;letter-spacing:.06em}

/* no rounded or oval shapes anywhere */
*,*::before,*::after{border-radius:0!important}
.logo i{width:18px;height:18px;background:var(--red)}
header{border-bottom:1px solid var(--line)}
.hd{height:60px;padding-top:0;padding-bottom:0}
.nav{align-self:stretch}
.nav a{display:flex;align-items:center;padding:0 13px;box-shadow:inset 0 -2px 0 transparent}
.nav a.on{background:none;box-shadow:inset 0 -2px 0 var(--ink)}
.btn.k:hover{background:var(--red);transform:none}
.btn.sm{padding:9px 16px}
.inp{padding:6px 6px 6px 16px}
.sug button{background:var(--g1);border-color:transparent}.sug button:hover{background:var(--g2);border-color:transparent}
.bub{background:var(--g1)}
.panel{border-color:var(--line)}

/* ===== header menu button + drawer (shared) ===== */
.mb{width:40px;height:40px;margin-left:-8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:0;background:none;cursor:pointer;flex:none}
.mb i{display:block;width:20px;height:2px;background:var(--ink);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mb:hover i:first-child{transform:translateX(-3px)}.mb:hover i:last-child{transform:translateX(3px)}
#dr{position:fixed;inset:0;z-index:200;pointer-events:none}
#dr .dr-bg{position:absolute;inset:0;background:rgba(20,20,20,.32);opacity:0;transition:opacity .45s}
#dr .dr-p{position:absolute;left:0;top:0;bottom:0;width:min(460px,100%);background:#fff;transform:translateX(-102%);transition:transform .6s cubic-bezier(.2,.85,.15,1);display:flex;flex-direction:column;overflow-y:auto}
#dr.on{pointer-events:auto}#dr.on .dr-bg{opacity:1}#dr.on .dr-p{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 24px;border-bottom:1px solid var(--line);flex:none}
.dr-h .logo{color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:9px;font:900 19px var(--zh)}
.dr-h .logo i{width:18px;height:18px;background:var(--red);display:block}
.dr-h .logo b{color:var(--red);margin-left:-9px}
.dr-x{border:0;background:none;font:500 14px var(--sans);color:var(--sub);cursor:pointer;padding:8px 0}.dr-x:hover{color:var(--ink)}
.dr-n{flex:1;padding:14px 24px 24px;display:flex;flex-direction:column}
.dr-n a.g2{margin-top:30px}.dr-n a{position:relative;display:grid;grid-template-columns:1fr auto;align-items:baseline;padding:14px 0 12px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .6s cubic-bezier(.2,.85,.15,1)}
#dr.on .dr-n a{opacity:1;transform:none}
#dr.on .dr-n a:nth-child(1){transition-delay:.08s}#dr.on .dr-n a:nth-child(2){transition-delay:.12s}#dr.on .dr-n a:nth-child(3){transition-delay:.16s}#dr.on .dr-n a:nth-child(4){transition-delay:.2s}#dr.on .dr-n a:nth-child(5){transition-delay:.24s}#dr.on .dr-n a:nth-child(6){transition-delay:.28s}#dr.on .dr-n a:nth-child(7){transition-delay:.32s}#dr.on .dr-n a:nth-child(8){transition-delay:.36s}#dr.on .dr-n a:nth-child(9){transition-delay:.4s}
.dr-n em{font:500 12px var(--sans);color:var(--sub);font-style:normal;letter-spacing:.04em}
.dr-n b{font:900 clamp(26px,7vw,34px)/1.05 var(--zh);letter-spacing:-.01em;transition:color .25s,transform .4s cubic-bezier(.2,.85,.15,1);display:inline-block}
.dr-n span{grid-column:2/4;font:400 13px var(--sans);color:var(--sub);margin-top:6px}
.dr-n a::after{content:"→";grid-column:2;grid-row:1;align-self:center;font:400 20px var(--sans);color:var(--red);opacity:0;transform:translateX(-8px);transition:.3s}
.dr-n a:hover b{color:var(--red);transform:translateX(6px)}.dr-n a:hover::after{opacity:1;transform:none}
.dr-n a.on b{color:var(--red)}.dr-n a.on em{color:var(--red)}
.dr-f{display:flex;justify-content:space-between;align-items:center;padding:18px 24px 26px;font:400 13px var(--sans);color:var(--sub);border-top:1px solid var(--line);flex:none}
.dr-f .lk{border:1px solid var(--line);background:#fff;padding:7px 12px;font:500 13px var(--sans);color:var(--ink);cursor:pointer}.dr-f .lk:hover{border-color:var(--ink)}

.tv-spin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px}
.tv-spin div{background:#fff;padding:12px 12px 14px;display:flex;flex-direction:column;gap:18px}
.tv-spin span{font:500 11px var(--sans);color:var(--sub)}.tv-spin b{font:900 18px/1.2 var(--zh)}.tv-spin b.r{color:var(--red);font:400 14px var(--sans);letter-spacing:1px}
.tv-br{display:flex;align-items:center;gap:14px;width:100%;max-width:380px}
.tv-c{flex:1;background:#fff;min-width:0}.tv-c div{height:78px;padding:12px;display:flex;align-items:flex-end;font:900 17px/1.2 var(--zh)}.tv-c b{display:block;padding:10px 12px 12px;font:700 13px/1.3 var(--zh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-br i{font:900 22px var(--zh);color:var(--red);font-style:normal}
.tv-hand{display:grid;grid-template-columns:repeat(4,52px);gap:6px}.tv-hand i{height:52px;display:grid;place-items:center;background:#fff;font:900 18px var(--zh);color:var(--ink)}.tv-hand i.y{background:var(--red);color:#fff}
.tv-mix{display:grid;grid-template-columns:repeat(4,44px);gap:4px}.tv-mix i{height:22px;display:block}
.tv-cut{display:flex;gap:8px}.tv-cut i{position:relative;width:62px;height:80px;background:#fff;box-shadow:0 10px 20px -12px rgba(0,0,0,.35)}.tv-cut i::before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:#f7e6a3}.tv-cut i.x{opacity:.55;filter:grayscale(1)}.tv-cut i.x::after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:4px;background:var(--ink);transform:rotate(-30deg)}
</style>
</head>
<body>
<header><div class="hd">
 <button class="mb" id="mb" aria-label="菜单"><i></i><i></i></button><a class="logo" href="#"><i></i>悉尼<b>吃喝</b></a>
</div></header>
<div id="dr"><div class="dr-bg"></div><aside class="dr-p" aria-label="menu"><div class="dr-h"><a class="logo" href="/eat/"><i></i>悉尼<b>吃喝</b></a><button class="dr-x">关闭</button></div><nav class="dr-n"><a class="on" data-v="home" data-x="1" href="/eat/" data-zh="首页|" data-en="Home|"><b>首页</b></a><a data-v="map" href="/eat/app/#map" data-zh="地图|" data-en="Map|"><b>地图</b></a><a data-v="list" href="/eat/app/#list" data-zh="全部|" data-en="All|"><b>全部</b></a><a data-v="spin" href="/eat/app/#spin" data-zh="转一转|" data-en="Spin|"><b>转一转</b></a><a data-v="brawl" href="/eat/app/#brawl" data-zh="大乱斗|" data-en="Brawl|"><b>大乱斗</b></a><a class="g2" data-v="party" href="/eat/app/#party" data-zh="饭局|" data-en="Group|"><b>饭局</b></a><a data-v="vote" data-x="1" href="/eat/vote/" data-zh="举手|" data-en="Hands up|"><b>举手</b></a><a data-v="mix" data-x="1" href="/eat/mix/" data-zh="合口味|" data-en="Taste mix|"><b>合口味</b></a><a data-v="cut" data-x="1" href="/eat/cut/" data-zh="划掉|" data-en="Strike out|"><b>划掉</b></a></nav><div class="dr-f"><span></span><span>ian233.com</span></div></aside></div>

<main class="wrap">
 <section class="hero rv">
  <h1>今晚<br>吃<em>什么</em></h1>
  <p id="sub"></p>
  <div class="cta"><button class="btn k" data-rand>随便</button><a class="btn g" href="/eat/app/#map">地图</a></div>
 </section>
</main>
<div class="arc" id="arc"></div>

<main class="wrap">
 <section class="sec rv" id="ask">
  
  <div class="panel" id="panel"></div>
 </section>

 <section class="quote rv" id="quote"></section>

 <section class="tiles rv">
  <a class="tile" href="/eat/app/#map"><h4>地图</h4><div class="vis" id="tmap"></div></a>
  <a class="tile" href="/eat/app/#list"><h4>全部</h4><div class="vis" id="tlist"></div></a>
  <a class="tile" href="/eat/app/#party"><h4>饭局</h4><div class="vis" id="tparty"></div></a>
  <a class="tile w" href="/eat/app/#spin"><h4>转一转</h4><div class="vis" id="tspin"></div></a>
  <a class="tile w" href="/eat/app/#brawl"><h4>大乱斗</h4><div class="vis" id="tbrawl"></div></a>
  <a class="tile" href="/eat/vote/"><h4>举手</h4><div class="vis"><div class="tv-hand"><i class="y">想</i><i>不</i><i class="y">想</i><i class="y">想</i></div></div></a>
  <a class="tile" href="/eat/mix/"><h4>合口味</h4><div class="vis"><div class="tv-mix"><i style="background:#141414"></i><i style="background:#fff"></i><i style="background:#ef8a3f"></i><i style="background:#fff"></i><i style="background:#fff"></i><i style="background:#4f7fb0"></i><i style="background:#ef8a3f"></i><i style="background:#9a7ad1"></i><i style="background:#fff"></i><i style="background:#4f7fb0"></i><i style="background:#fff"></i><i style="background:#fff"></i></div></div></a>
  <a class="tile" href="/eat/cut/"><h4>划掉</h4><div class="vis"><div class="tv-cut"><i></i><i class="x"></i><i class="x"></i></div></div></a>

<script>
const D=[{"n": "行运烧腊", "a": "Castle Mall（Castle Hill）", "t": "烧腊", "r": "5", "p": 22, "d": "烧鸭濑粉、牛腩濑粉、脆皮烧肉、冻柠茶", "i": "Castle Mall里的烧腊店，好多人专门过来吃濑粉。烧鸭濑粉和牛腩濑粉最出名，汤底干净，牛腩给得大方，脆皮烧肉也好。在Eastwood以外很少有烧腊值得专门跑一趟，这家算一个。店很小，饭点排队，适合打包。", "dt": "2026-11-26", "ne": "Hang Wan BBQ", "xy": [184.3, 128.6], "id": 553}, {"n": "Ban Sang", "a": "Castle Hill", "t": "韩餐", "r": "4", "p": 35, "d": "甜辣炸鸡、海鲜葱饼、泡菜", "i": "Castle Hill很火的韩餐，饭点基本都要排队。招牌甜辣炸鸡外皮酥脆，酱汁浓，辣度温和，大部分人都能吃。海鲜葱饼也点得多。", "dt": "2026-11-26", "ne": "Ban Sang", "xy": [180.2, 131.8], "id": 554}, {"n": "Lumina Cafe", "a": "Castle Hill", "t": "咖啡/早午餐", "r": "4", "p": 30, "d": "天空蓝拿铁、Big Bird Benedict", "i": "山区的老牌咖啡店，本地人常去。招牌天空蓝拿铁颜色好看，喝起来是香草奶香。早午餐Big Bird Benedict分量很足，水波蛋流心，配厚切鸡胸肉。", "dt": "2026-11-26", "ne": "Lumina Cafe", "xy": [183.1, 126.9], "id": 555}, {"n": "Dolcettini", "a": "Castle Hill", "t": "烘焙/咖啡", "r": "4", "p": 12, "d": "杏仁可颂、香蕉面包、咖啡", "i": "山区一家正经的面包店，欧包、甜品和咖啡都卖得好。杏仁可颂和香蕉面包是热门款。", "dt": "2026-11-26", "ne": "Dolcettini", "xy": [178.9, 129.4], "id": 556}, {"n": "Kinn", "a": "Castle Hill", "t": "泰餐", "r": "4", "p": 40, "d": "软壳蟹、橘鸭、咖喱汤、炒粉、荔枝饮品", "i": "Event影院门口的泰餐，场地大，饮品多，还有儿童餐，聚会可以。软壳蟹、橘鸭、咖喱汤和炒粉都不错，荔枝饮品很好喝。", "dt": "2026-11-26", "ne": "Kinn", "xy": [182.7, 130.9], "id": 557}, {"n": "Remy Cafe", "a": "Castle Hill", "t": "咖啡/意面", "r": "3", "p": 30, "d": "Toowoomba Linguine", "i": "意面评价不错，尤其是Toowoomba Linguine，酱汁浓，虾给得多，适合喜欢重口味意面的人。", "dt": "2026-11-26", "ne": "Remy Cafe", "xy": [179.6, 127.8], "id": 558}, {"n": "The Sweet Lab 糖水小馆", "a": "Castle Hill", "t": "糖水", "r": "3", "p": 12, "d": "芝麻花生糊", "i": "想吃中式甜品可以来。广东朋友推荐芝麻花生糊，说是不甜，刚刚好。", "dt": "2026-11-26", "ne": "The Sweet Lab", "xy": [184.9, 131.2], "id": 559}, {"n": "An Viet", "a": "Castle Tower（Castle Hill）", "t": "越南粉", "r": "3", "p": 20, "d": "顺化牛肉粉", "i": "Castle Towers露天美食广场里比较新的越南粉店。推荐顺化牛肉粉，粉是圆的，汤底自带一点辣，很开胃。", "dt": "2026-11-26", "ne": "An Viet", "xy": [181.0, 128.3], "id": 560}, {"n": "XS Espresso", "a": "Castle Hill", "t": "咖啡/早午餐", "r": "3", "p": 30, "d": "Flat white、Steak sunrise、鸡肉三明治", "i": "连锁咖啡店，不能订座，要提前20分钟到门口等位。咖啡很好喝，大杯flat white才4.9刀。Steak sunrise 36刀，不配面包也没沙拉，味道还可以。鸡肉三明治分量大。卡座适合聚餐，但卫生差，桌上纸巾没人收，窗边有苍蝇。", "dt": "2026-11-26", "ne": "XS Espresso", "xy": [180.8, 133.0], "id": 561}, {"n": "Homeway", "a": "Burwood", "t": "山东菜", "r": "3", "p": 40, "d": "山东炒鸡（需提前一天预订）、老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子、山东大馒头", "i": "Burwood的山东菜馆，招牌山东炒鸡需要提前一天预订，辣度极高，在悉尼的川湘菜里也少见，但辣得很香很下饭。其余菜式基本不辣，老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子和个头饱满的山东大馒头都做得很好。人均约40刀。", "dt": "2026-11-17", "ne": "Homeway", "xy": [457.9, 592.5], "id": 544}, {"n": "YUNJOY 山喜云南小馆", "a": "Zetland", "t": "云南菜", "r": "2", "p": 37, "d": "傣味油呛双脆、红三剁、番茄酥皮牛腩", "i": "开在Zetland居民楼下的云南小馆，装修朴实。傣味油呛双脆味道在线，不过只有黄喉够脆，毛肚偏软烂。鹿茸菇山野走地鸡是雷，鸡肉没有嚼劲，汤汁多而不香。红三剁很下饭，番茄酥皮牛腩带一点辣味，是意外的惊喜。整体中规中矩，人均约37刀。", "dt": "2026-11-16", "ne": "YUNJOY Yunnan Kitchen", "xy": [731.6, 684.4], "id": 543}, {"n": "Molly Tea 茉莉奶白", "a": "Burwood", "t": "奶茶/蛋挞", "r": "3", "p": 9, "d": "蛋挞（原味、抹茶、巧克力、大溪地香草）", "i": "茉莉奶白新推出的蛋挞，有原味、大溪地香草、抹茶和巧克力四种口味，香草味常常早早售罄。酥皮很脆，蛋挞心软嫩，抹茶和巧克力的表层味道浓郁。个头大，一个就很饱，价格不便宜。队伍看着短，实际也要等半小时左右，排队时可以看到现场制作过程。", "dt": "2026-11-14", "ne": "Molly Tea", "xy": [454.9, 589.8], "id": 542}, {"n": "Yakiniku Yokocho 烧肉横丁", "a": "Burwood", "t": "日式烤肉", "r": "3", "p": 40, "d": "29.8刀 Express Lunch BBQ Set（两款和牛加牛舌）、刺身", "i": "日式炭火烤肉店，午市有29.8刀的Express Lunch BBQ Set，可选三种肉，和牛和牛舌都很值，每款大约五块，女生吃刚好。炭火烤得很香。豚骨拉面一般，刺身不是强项但够新鲜。只吃午餐套餐最省钱，加点刺身和饮料人均也不超过50刀。", "dt": "2026-11-13", "ne": "Yakiniku Yokocho 烧肉横丁", "xy": [458.4, 598.3], "id": 540}, {"n": "Maria's Bakery Inn 超羣饼屋", "a": "Burwood", "t": "港式西饼屋", "r": "3", "p": 8, "d": "菠萝包（原味、咖啡、椰丝、奶黄、菠萝粒）", "i": "开了很多年的老式港式西饼屋，产品和陈列都很有九十年代的味道，以菠萝包出名，有人称它是悉尼最好吃的菠萝包。口味很多，原味、咖啡、椰丝、奶黄，还有夹真菠萝粒的版本。买回家夹上煎蛋和午餐肉，就是酥脆满足的港式早餐。", "dt": "2026-11-13", "ne": "Maria's Bakery Inn", "xy": [462.2, 586.9], "id": 541}, {"n": "宗师麻辣烫", "a": "Melrose Park（Melrose Central）", "t": "麻辣干锅/麻辣烫/炸串", "r": "3", "p": 40, "d": "麻辣干锅、麻辣烫、特价炸串", "i": "Melrose Park的Melrose Central商场里的麻辣烫店，同时做麻辣干锅和炸串，食材选择丰富，炸串常有特价，可以把干锅、麻辣烫和炸串一次吃齐。商场环境舒服。人均约40刀。", "dt": "2026-11-11", "ne": "Zongshi Malatang", "xy": [376.3, 396.1], "id": 539}, {"n": "小妹弄堂 Show Mei Alley", "a": "Rhodes Central", "t": "台式锅贴", "r": "2", "p": 18, "d": "高丽菜铁板猪肉锅贴、三鲜冰花大虾、梅渍山药、红茶豆乳", "i": "据说源自台北西门町的锅贴店，开业初期每天排队，周末等餐约15到20分钟。招牌是高丽菜铁板猪肉锅贴和三鲜冰花大虾锅贴，煎得很香，只是略咸。梅渍山药酸甜开胃，红茶豆乳也好喝。一人吃快50刀，不算便宜，路过可以试，不必专程。", "dt": "2026-11-09", "ne": "Show Mei Alley", "xy": [413.2, 443.6], "id": 537}, {"n": "HoonSikDang", "a": "Rhodes", "t": "韩国汤面/饺子", "r": "3", "p": 40, "d": "辣汤面、韩式饺子（猪肉、泡菜）、冷面", "i": "Rhodes火车站附近的韩国面馆，专做汤面和饺子。辣汤面比不辣拉面和冷面更出色，面不是手工的，但汤头味道很足。韩式饺子个大扎实，有猪肉和泡菜两种馅，吃两个就半饱。人均约40刀就能吃得很饱。", "dt": "2026-11-09", "ne": "HoonSikDang", "xy": [410.1, 440.8], "id": 538}, {"n": "九爷火锅鸡", "a": "Central Park（Chippendale）", "t": "沧州火锅鸡", "r": "3", "p": 34, "d": "88刀排骨火锅鸡（够三人）", "i": "沧州火锅鸡，份量很大，88刀的排骨火锅鸡够三个人吃。先吃排骨和鸡肉，再加水涮火锅，店里有免费自助的蔬菜和蘸料台，豆腐、面条随便拿，非常实惠。鸡肉和排骨都很嫩很下饭，服务员态度特别好。人均约34刀，吃不完还可以打包。", "dt": "2026-11-04", "ne": "Jiuye Hotpot Chicken", "xy": [707.9, 621.1], "id": 536}, {"n": "Sumibi Yakiniku（原 Kashiwa 柏）", "a": "Crows Nest", "t": "日式炭火烤肉", "r": "5", "p": 50, "d": "辣味Rib、姜葱牛舌", "i": "原来的Kashiwa柏，搬到马路对面后改名Sumibi。炭火烤得香，和牛肉质出色。推荐专攻Rib和牛舌两个部位，各点不同口味，辣味Rib和姜葱牛舌最好吃，又香又嫩。人均约50刀，以亲民的价格吃到好肉。", "dt": "2026-11-03", "ne": "Sumibi Yakiniku (formerly Kashiwa)", "xy": [721.1, 430.9], "id": 535}, {"n": "老张好运现烤牛肉干", "a": "Ryde（Top Ryde图书馆对面）", "t": "牛肉干外带", "r": "3", "p": 20, "d": "胸口油、半肥半瘦（拌薯片、辣油、孜然）", "i": "Top Ryde图书馆对面的现烤牛肉干店，与其说是牛肉干，不如说是多汁的烤牛肉，一点都不干。推荐胸口油和半肥半瘦两个部位，拌上薯片、辣油和孜然，瘦肉有嚼劲，肥肉够香。老板试吃给得很大方。价格偏高，300克约67刀，可冷藏保存约5天。", "dt": "2026-10-31", "ne": "Lao Zhang Fresh Roasted Beef Jerky", "xy": [463.2, 392.9], "id": 534}, {"n": "KatsuiE", "a": "Eastwood", "t": "日式炸猪排", "r": "5", "p": 35, "d": "Tenderloin、Loin、芝士猪排", "i": "现点现炸的日式猪排饭，做法很接近大阪的猪排店。Tenderloin里肉微微粉嫩，咬下去肉汁四溢；Loin油脂香更浓；芝士猪排拉丝，非常罪恶。配粗盐、现磨山葵和芥末酱，一块猪排能吃出几种味道，从头到尾不腻。人均约35刀，值得反复回访。", "dt": "2026-10-27", "ne": "KatsuiE", "xy": [397.4, 320.0], "id": 533}, {"n": "老回民", "a": "Burwood", "t": "新疆菜", "r": "5", "p": 50, "d": "烤羊排、大盘土鸡加皮带面、韭菜拌面", "i": "Burwood的新疆菜老店，重新装修后水准依旧。烤羊排可以说是悉尼数一数二，不肥不腻，有嚼劲又嫩到冒汁，没有膻味，蘸辣椒面和孜然吃。大盘鸡也是硬菜，记得加一份皮带面泡在汤汁里。韭菜拌面油润有韧性。人均约50刀，份量大，很容易吃撑还要打包。", "dt": "2026-10-25", "ne": "Lao Hui Min Hand Made Ramen", "xy": [449.8, 594.0], "id": 532}, {"n": "Minimal Coffee", "a": "Crows Nest", "t": "咖啡", "r": "3", "p": 10, "d": "Cold Brew、巴斯克", "i": "街边的小咖啡店，适合天气好的时候坐在路边喝一杯。Cold Brew甘苦清爽，巴斯克蛋糕是惊喜，很香又不太奶，和Cold Brew搭配刚好。", "dt": "2026-10-24", "ne": "Minimal Coffee", "xy": [718.0, 428.2], "id": 530}, {"n": "Manpuku", "a": "Chatswood", "t": "日式拉面", "r": "5", "p": 33, "d": "Long Name Signature（细面）、蘸面（粗面）", "i": "悉尼人气很高的日式拉面店，多年来价格涨得不多，很有良心。汤底是鸡骨和猪骨混合的高汤，浓郁不腻。面条筋道爽滑，会按拉面款式搭配粗细：Long Name Signature配细面，蘸面配粗面。在悉尼的日式拉面里稳居前列，人均约33刀。", "dt": "2026-10-24", "ne": "Manpuku", "xy": [660.5, 339.0], "id": 531}, {"n": "Jin Guk", "a": "Macquarie Park（MQ Centre外）", "t": "韩国汤饭", "r": "3", "p": 33, "d": "猪肉汤饭、辣牛肉汤饭、牛肉饼烤菇、虾Pancake", "i": "Macquarie Centre外面的韩国汤饭店，最近小有名气，傍晚五点多到不用排，很快就坐满。菜单简单，四款汤饭、四款小菜和四款饮料。猪肉汤饭里还有面条，辣牛肉汤饭汤底也不错，米饭稍软。小菜里牛肉饼烤菇和虾饼好吃，饺子一般。饭后送肉桂冰淇淋。人均约33刀，以这个环境来说很合理。", "dt": "2026-10-22", "ne": "Jin Guk", "xy": [500.0, 275.7], "id": 528}, {"n": "Margot Osteria", "a": "Barrack St, CBD", "t": "意大利菜", "r": "X", "p": 80, "d": "提拉米苏", "i": "市中心的意大利餐厅，正餐表现一般：烤鸡偏干，牛排配的薯条炸过头，烤虾也柴。全场最佳是提拉米苏，绵软浓郁，可以专门来外带提拉米苏，正餐可以跳过。人均约80刀。", "dt": "2026-10-22", "ne": "Margot Osteria", "xy": [728.9, 567.2], "id": 529}, {"n": "PST Pizza Studio Tamaki", "a": "George St, CBD", "t": "日式Pizza", "r": "3", "p": 40, "d": "Five cheese pizza with honey、提拉米苏", "i": "东京六本木名厨玉置翼开的日式Pizza店。饼底用发酵30小时的面团和冲绳矿物盐，柴火炉高温烘烤，外皮微焦有香气，口感轻盈软糯。口味独特，有咸甜口的五种芝士配蜂蜜Pizza。甜品提拉米苏非常出色，一定要点。人均约40刀能吃得很饱，适合人多一起来，多点几款分着吃。", "dt": "2026-10-20", "ne": "PST Pizza Studio Tamaki", "xy": [725.9, 564.4], "id": 527}, {"n": "宗师炸串", "a": "Macquarie Centre", "t": "炸串", "r": "4", "p": 20, "d": "金丝鸡排、牛肉串、包浆豆腐、豆皮金针菇", "i": "Macquarie Centre美食区里最值得吃的炸串摊。金丝鸡排必点，金黄酥脆的外皮裹着鲜嫩鸡肉，撒满孜然和辣椒面。牛肉串、鸡肉串、青椒、豆皮金针菇、包浆豆腐、年糕都可以自选，连蔬菜都炸得好吃。", "dt": "2026-10-19", "ne": "Zongshi Fried Skewers", "xy": [497.0, 272.9], "id": 525}, {"n": "香港冰室", "a": "Eastwood", "t": "茶餐厅", "r": "3", "p": 22, "d": "茄汁炒通心粉配猪扒、滑蛋炸鸡排饭、咖央西多士", "i": "港式茶餐厅，现炒锅气足。茄汁炒通心粉配开心猪扒很受小朋友欢迎，滑蛋炸鸡排饭的鸡排鲜嫩多汁。甜品推荐咖央西多士，咖央酱和西多士结合得很好。如今悉尼做得好的茶餐厅不多，值得珍惜。", "dt": "2026-10-19", "ne": "Hong Kong Café", "xy": [394.3, 317.3], "id": 526}, {"n": "Sho Kaisendon", "a": "Crows Nest", "t": "海鲜丼/日料", "r": "5", "p": 70, "d": "炸生蚝、烤牛舌、Saiko Don、鹅肝和牛鳗鱼釜饭、Yuzu Sorbet", "i": "Lane Cove人气寿司店Sho Sushi在Crows Nest开的海鲜丼店。前菜炸生蚝和烤牛舌都很出色。Saiko Don有海胆、Tuna、大虾、Kingfish、三文鱼、Otoro、鱼籽、带子和鲷鱼，非常新鲜丰盛。更惊喜的是釜饭，鹅肝、和牛、鳗鱼和鱼籽一起焖，口感浓郁。饭后Yuzu Sorbet清新解腻。人均约70刀。", "dt": "2026-10-08", "ne": "Sho Kaisendon", "xy": [721.6, 436.7], "id": 520}, {"n": "Lanxi Kitchen 蓝曦食堂", "a": "Rhodes（原香蕉小馆位置）", "t": "砂锅米线", "r": "3", "p": 28, "d": "砂锅米线、卤肥肠、奥尔良烤鸡腿", "i": "Rhodes新开的砂锅米线店，原香蕉小馆的位置。砂锅上桌时还在冒泡，红油和白骨汤翻滚，米线吸饱汤汁，爽滑软糯，配料给得足，砂锅保温，从头吃到尾都是热的。卤肥肠和奥尔良烤鸡腿也很入味。人均约28刀，很划算。", "dt": "2026-10-08", "ne": "Lanxi Kitchen", "xy": [413.7, 449.4], "id": 521}, {"n": "Soho Korean Chinese Restaurant", "a": "Lidcombe", "t": "韩式中华料理", "r": "3", "p": 40, "d": "炸酱面、辣汤面、糖醋肉、糖渍小番茄", "i": "韩式中华料理，网上上千条评价、评分4.9。炸酱面和辣汤面都很入味，嗦起来很过瘾。糖醋肉炸得出色，里面的猪肉非常嫩。前菜的糖渍小番茄比蟹脚好吃。人均约40刀，吃得开心又饱。", "dt": "2026-10-08", "ne": "Soho Korean Chinese Restaurant", "xy": [307.9, 551.3], "id": 522}, {"n": "鼎氏牛大 Lanzhou Beef Hand Pulled Noodles", "a": "Rhodes（火车站对面）", "t": "兰州牛肉面/新疆菜", "r": "5", "p": 18, "d": "炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子", "i": "Rhodes火车站对面的兰州牛肉面馆，新疆老板加了一整套新疆菜单，常有新疆老乡来吃，味道可以信赖。炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子都很好吃。份量很大，按人数点菜就够了。", "dt": "2026-10-07", "ne": "Lanzhou Beef Hand Pulled Noodles", "xy": [417.5, 438.0], "id": 519}, {"n": "Bakery Cafe Cael", "a": "Lidcombe", "t": "甜品", "r": "2", "p": 14, "d": "地瓜蛋糕", "i": "Lidcombe的韩式烘焙甜品店，招牌地瓜蛋糕表现一般。", "dt": "2026-10-08", "ne": "Bakery Cafe Cael", "xy": [304.9, 548.6], "id": 523}, {"n": "Meg Meg", "a": "Glebe", "t": "甜品", "r": "3", "p": 14, "d": "提拉米苏", "i": "Glebe的甜品店，提拉米苏非常好吃，值得专程去买。", "dt": "2026-10-08", "ne": "Meg Meg", "xy": [673.7, 598.9], "id": 524}, {"n": "Smoked By Million Chicken", "a": "West Ryde", "t": "韩式熏鸡", "r": "3", "p": 35, "d": "Galbi口味熏鸡（每日限量）、紫菜饭团、芝士玉米", "i": "West Ryde新开的韩式熏鸡店。每天限量的Galbi口味熏鸡，鸡肉腌制24小时，辣椒粉由14种香料调成，肉质很嫩，带焦香和烟熏味，比炸鸡更耐吃。紫菜饭团和芝士玉米混在一起吃很香。吃腻了炸鸡可以来试试。人均约35刀。", "dt": "2026-10-05", "ne": "Smoked By Million Chicken", "xy": [421.1, 367.6], "id": 518}, {"n": "Cucina Porto", "a": "The Star（Pyrmont）", "t": "意大利菜", "r": "5", "p": 100, "d": "馕配辣酱和Salami、烤虾、海鲜Pasta、提拉米苏", "i": "The Star里出乎意料地出色的意大利餐厅。烤得圆鼓鼓的面包配辣酱和Salami很好吃；烤虾嫩到一碰就脱壳；海鲜Pasta用料很有诚意；提拉米苏浓郁湿润，大力推荐。人均约100刀，份量足，很适合看演出前后来吃。", "dt": "2026-10-03", "ne": "Cucina Porto", "xy": [697.4, 564.0], "id": 516}, {"n": "Ormeggio at the Spit", "a": "Mosman", "t": "意大利菜/海景", "r": "2", "p": 165, "d": "小kingfish挞、炖牛排、生蚝、烤章鱼taco", "i": "The Spit海边的意大利餐厅，正对海湾游艇和对岸豪宅，景色是最大卖点。冬季有四道菜半价的Winter Special。前菜小Kingfish挞和主菜炖牛排都不错，但不算惊艳。整体溢价明显，就算半价也不太值，分数主要来自环境。人均约165刀。", "dt": "2026-10-03", "ne": "Ormeggio at the Spit", "xy": [831.6, 361.2], "id": 517}, {"n": "The Gidley", "a": "King St, CBD", "t": "牛排馆", "r": "5", "p": 120, "d": "小面包、烤牛舌、招牌双层汉堡、牛排", "i": "出了名神秘的牛排馆，入口是隐蔽的木门，先经过昏暗的Bar区，用餐区会亮堂一些。店家礼貌地请客人上交手机，好好吃饭聊天，收手机前服务员会帮忙拍合照。小面包松软，两款蘸酱浓郁；烤牛舌毫无腥味；招牌汉堡是双层牛肉饼加太阳蛋；牛排更是极为出色。性价比很高，两人食物约160刀，含酒约240刀。姐妹店BISTECCA同样收手机。", "dt": "2026-09-25", "ne": "The Gidley", "xy": [729.5, 573.0], "id": 514}, {"n": "The Grill at The International", "a": "Martin Place（MLC大楼）", "t": "扒房/西餐", "r": "3", "p": 110, "d": "烤鸡翅、虾多士、巧克力舒芙蕾配伯爵冰淇淋", "i": "MLC大楼里的扒房，菜品摆盘精致，环境偏简洁，不是传统Fine Dining那种华丽。前菜烤鸡翅和虾多士好吃又漂亮，鸭肝酱偏奶偏腥。主菜牛排和意面略咸。甜品巧克力舒芙蕾值得点，流心巧克力和伯爵冰淇淋融在一起很好吃。人均约110刀。", "dt": "2026-09-25", "ne": "The Grill at The International", "xy": [736.8, 560.9], "id": 515}, {"n": "Yo-chi", "a": "Macquarie Centre", "t": "酸奶冰淇淋", "r": "3", "p": 9, "d": "自选酸奶冰淇淋", "i": "Macquarie Centre的酸奶冰淇淋店，自选配料，店里送贴纸，还有投乒乓球赢优惠券的小游戏，适合带小朋友。", "dt": "2026-09-24", "ne": "Yo-chi", "xy": [500.5, 281.5], "id": 513}, {"n": "海滋味海鲜茶楼 Oceanic Tastes", "a": "Rhodes", "t": "粤式海鲜酒楼", "r": "3", "p": 50, "d": "沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、咸鱼蒸肉饼", "i": "Rhodes的粤式海鲜酒楼，适合家庭聚会。沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、金衣豆腐、咸鱼蒸肉饼都不错，份量很大。服务员热情靠谱，带蛋糕来过生日还会送寿桃。门口有小区游乐场，小朋友可以去玩。人均不到50刀。", "dt": "2026-09-19", "ne": "Oceanic Tastes", "xy": [405.0, 445.0], "id": 510}, {"n": "Kura Ichi", "a": "Haymarket（Market City对面）", "t": "海鲜丼", "r": "3", "p": 50, "d": "Take档海鲜丼加温泉蛋", "i": "Market City对面街角开了几十年的日料店，近年转型专做海鲜丼，很成功。Take这一档基本涵盖各种鱼，一碗就很满足，额外的Otoro容易腻。建议加一颗温泉蛋，味道更好；茶泡饭的茶汤一般，可以不点。份量大，丰俭由人，人均约50刀。", "dt": "2026-09-19", "ne": "Kura Ichi", "xy": [721.1, 598.9], "id": 511}, {"n": "Kiddo Coffee", "a": "Surry Hills", "t": "咖啡/菠萝包", "r": "3", "p": 10, "d": "菠萝包、Yuzu Cold Brew", "i": "最近小火的港风菠萝包咖啡店，在悉尼满街卷牛角包的时候另辟蹊径。热门组合是菠萝包配一杯特调，Yuzu Cold Brew酸甜，能平衡菠萝包的甜腻，但咖啡味偏淡。菠萝包本身和西饼屋的差不多，胜在现场加热，面包松软，甜酥皮很脆。", "dt": "2026-09-19", "ne": "Kiddo Coffee", "xy": [739.5, 621.1], "id": 512}, {"n": "Carlingford Village 新开台湾菜（未具名）", "a": "Carlingford", "t": "台湾菜", "r": "2", "p": 40, "d": "", "i": "Carlingford Village新开的台湾菜，味道一般，有些失望。", "dt": "2026-09-17", "ne": "New Taiwanese restaurant, Carlingford Village (unnamed)", "xy": [310.5, 291.5], "id": 507}, {"n": "Catalina", "a": "Rose Bay", "t": "海景Fine Dining", "r": "4", "p": 160, "d": "三文鱼刺身、牛肉饺子、乳猪、Snapper、牙鱼蒸饺", "i": "Rose Bay海边的Fine Dining，景色无敌：对岸矮房、帆船游艇、水上飞机和往来的轮渡尽收眼底，菜品也比几年前进步很多。两道菜Set Menu里，三文鱼刺身、牛肉饺子、乳猪和Snapper都好吃，单点的牙鱼蒸饺和小包菜也出色。适合天气好的日子来庆祝。", "dt": "2026-09-17", "ne": "Catalina", "xy": [886.8, 570.4], "id": 508}, {"n": "潮公馆", "a": "Chatswood", "t": "潮州菜", "r": "3", "p": 72, "d": "卤味拼盘、果肉、芋泥、墨鱼丸、炒米粉", "i": "正宗度很高的潮州菜馆。卤味拼盘非常出色，味道很对，把鸭换成鹅就和潮州本地一样。少见的潮州小吃粿肉也有，地道。芋泥复刻度很高，只差一勺葱珠油。双丸汤里墨鱼丸远胜牛肉丸，墨鱼丸也可以买冷冻装回家煮面。炒米粉锅气十足。酸菜肚尖和沙茶牛肉较普通。人均约72刀，潮汕和广东人吃会很亲切，重口味的人可以再观望。", "dt": "2026-09-17", "ne": "Teochew House", "xy": [657.5, 336.3], "id": 509}, {"n": "重庆小面（Sho Sushi对面，未正式开业）", "a": "Lane Cove", "t": "重庆小面", "r": "3", "p": 18, "d": "干馏豌杂面", "i": "Lane Cove Sho Sushi对面一家尚未正式开业的重庆小面，试营业期间已经可以吃到。", "dt": "2026-09-14", "ne": "Chongqing Noodles (opposite Sho Sushi, soft opening)", "xy": [623.7, 396.1], "id": 506}, {"n": "Missing Spoon（已关门）", "a": "Gordon", "t": "韩国Cafe", "r": "X", "p": 22, "d": "抹茶草莓、抹茶咖啡", "i": "已于9月底关门的韩国Cafe。日式早餐的寿司明显是外面买来的现成寿司，水准不如Sushi Hub。饮品较出色，抹茶草莓和抹茶咖啡都好喝。和Wahroonga的Sofé烘焙店同一个老板，Sofé要好很多。", "dt": "2026-09-13", "ne": "Missing Spoon (closed)", "xy": [584.2, 209.1], "id": 505}, {"n": "张妈妈特色川味馆", "a": "Gordon", "t": "川菜", "r": "4", "p": 40, "d": "火锅鱼、烤鱼（每年约20条活鱼需预订）、毛血旺、泡椒黄喉、回锅肉、双椒牛舌", "i": "Gordon的川菜馆，以火锅鱼和烤鱼出名。活鱼每年数量有限，需要提前预订。烤鱼又辣又香，鱼肉紧实入味，配菜豆腐、土豆和腐竹都很吸汁。辣得受不了可以加一份不辣的宫保鸡丁。", "dt": "2026-08-11", "ne": "Mama Zhang Sichuan", "xy": [581.2, 206.3], "id": 478}, {"n": "FIVE TWO.", "a": "Artarmon", "t": "咖啡（自家烘豆）", "r": "3", "p": 10, "d": "Cold Brew", "i": "藏在一排修车行后面的仓库式咖啡店，自家烘豆，店里能看到大型烘豆机。老板一个人不慌不忙地做咖啡，很友善。Cold Brew好喝，门口晒太阳的位置很舒服。", "dt": "2026-09-12", "ne": "FIVE TWO.", "xy": [671.1, 377.1], "id": 504}, {"n": "Get Sushi Omakase", "a": "Sydney Fish Market", "t": "入门Omakase", "r": "5", "p": 160, "d": "Engawa、Storm Shell、海胆对比（塔州对北海道）", "i": "Fish Market里的入门级Omakase，在Sushi Oe旁边，鱼每天直接从鱼市拿，非常新鲜。每人160刀，包括一份生蚝、20贯寿司和一碗味噌汤。Engawa油脂甘甜丰腴，Storm Shell蚌肉爽滑Q弹，令人印象深刻。还有海胆盲品环节，对比塔州和北海道海胆，前者甘甜，后者Creamy。适合只想简单享受寿司、不追求漂亮饭的人，过生日还会插祝福牌。", "dt": "2026-09-10", "ne": "Get Sushi Omakase", "xy": [684.2, 579.9], "id": 501}, {"n": "Suddenly.", "a": "Surry Hills", "t": "咖啡", "r": "3", "p": 10, "d": "Cold Brew", "i": "充满童趣的咖啡店，店里摆满各式小玩意，像一家色彩缤纷的精品店，还收藏有1960年代华语歌后姚苏蓉的黑胶唱片。Cold Brew不错，适合坐在窗边看街景。", "dt": "2026-09-10", "ne": "Suddenly.", "xy": [736.4, 618.3], "id": 502}, {"n": "Manmaruya BBQ", "a": "Concord", "t": "日式烤肉", "r": "4", "p": 50, "d": "和牛拼盘（约150刀6种）、姜葱牛舌、和牛刺身、牛肉饼", "i": "Concord的日式烤肉店，是区里的宝藏。和牛相当新鲜，约150刀的拼盘有六种肉，每种都又嫩又香；牛舌配姜葱很好吃。小菜同样出色，牛肉饼、和牛刺身、炸鸡、饺子和芝士玉米都值得点，和牛刺身和牛肉饼尤其推荐加单。人均约50刀。", "dt": "2026-09-10", "ne": "Manmaruya BBQ", "xy": [457.9, 532.3], "id": 503}, {"n": "Braza Churrascaria", "a": "Darling Square", "t": "巴西烤肉", "r": "3", "p": 79, "d": "Beef Rib、脆皮猪五花、烤鱼、鸡心、烤菠萝", "i": "巴西烤肉自助，气氛热烈。明火炭烤的肉串由服务员拿到桌边现切，Beef Rib、脆皮猪五花、烤鱼、鸡心和烤菠萝最好吃。周六晚上有桑巴舞表演，把气氛推向高潮。成人79刀，小孩34刀，适合一家老小聚餐。", "dt": "2026-09-06", "ne": "Braza Churrascaria", "xy": [715.8, 592.5], "id": 500}, {"n": "阿叔潮汕纸皮蒸饺", "a": "Redfern", "t": "潮汕蒸饺外卖", "r": "5", "p": 20, "d": "海参黑松露蒸饺、虾滑时蔬、紫菜鲜肉、韭菜鲜肉、羊肉蒸饺", "i": "Redfern的潮汕薄皮蒸饺，没有招牌，有点难找，只做外卖，现包现蒸，需要稍等。和潮州本地一样皮薄如纸，鲜香多汁，灵魂是正宗的蒜头油。口味有整条海参黑松露、虾滑时蔬、紫菜鲜肉、韭菜鲜肉和特色羊肉。潮汕人会很感动，其他地方的人也值得一试。", "dt": "2026-09-05", "ne": "Uncle's Teochew Paper-Skin Dumplings", "xy": [721.1, 640.1], "id": 498}, {"n": "Kim's Bop Korean Eatery", "a": "Glebe", "t": "韩国面馆", "r": "3", "p": 30, "d": "牛肉辣拌乌冬、猪肉大酱拌乌冬、海苔凉拌北豆腐、Korean Tea", "i": "人气很旺的韩国面馆，建议开门前就到。牛肉辣拌乌冬和猪肉大酱拌乌冬入味浓郁，却有一丝清爽感；海苔凉拌豆腐也好吃。Korean Tea值得一试。人均约30刀，适合周末午餐。", "dt": "2026-09-05", "ne": "Kim's Bop Korean Eatery", "xy": [670.6, 596.1], "id": 499}, {"n": "Orii", "a": "Ryde（Meadowbank）", "t": "咖啡/蛋糕", "r": "3", "p": 10, "d": "Iced Long Black、巧克力蛋糕", "i": "Meadowbank路边的奶黄色咖啡店，外观可爱清新。Iced Long Black出色，巧克力蛋糕普通。适合天气好的午后来喝杯下午茶。", "dt": "2026-09-04", "ne": "Orii", "xy": [421.1, 399.3], "id": 496}, {"n": "Neptune's Grotto", "a": "Circular Quay", "t": "意大利地下小酒馆", "r": "3", "p": 100, "d": "番茄面包、火腿泡芙、烤虾、番茄意面、隐藏菜单牛排", "i": "环形码头附近小路上的地下意式小酒馆，入口是低调的木门，里面烛光昏暗，很有氛围。前菜番茄面包、火腿泡芙和烤虾都好吃。主菜番茄意面出色；牛排不在菜单上，需要主动问，偏肥，后段略腻。榛果巧克力慕斯像加大版费列罗，可点可不点。服务很好，人均约100刀。", "dt": "2026-09-04", "ne": "Neptune's Grotto", "xy": [739.5, 541.8], "id": 497}, {"n": "Bonjuk", "a": "Haymarket（太子中心）", "t": "韩国粥", "r": "3", "p": 20, "d": "人参鸡汤粥加红雪蟹肉", "i": "韩国知名连锁粥品牌，在UTS附近开店。人参鸡汤粥加红雪蟹肉要37刀，不便宜，但味道好，份量足，两个人吃也够。冬末初春来一碗暖胃养生很合适。", "dt": "2026-09-03", "ne": "Bonjuk", "xy": [718.0, 596.1], "id": 495}, {"n": "虎助拉面", "a": "Melrose Park（Melrose Central）", "t": "日式拉面", "r": "3", "p": 22, "d": "拉面", "i": "日式拉面店，避开饭点就不用排队，汤头很香。", "dt": "2026-08-31", "ne": "Torasuke Ramen", "xy": [373.3, 393.3], "id": 493}, {"n": "Surena Persian Restaurant", "a": "Carlingford", "t": "波斯菜", "r": "4", "p": 27, "d": "茄子酸奶酱配脆片、烤鸡翅、炖羊腿、波斯茶", "i": "网上两千多条评价、评分4.8的波斯餐厅，异域风情浓厚。茄子酸奶酱配脆饼很好吃；主菜烤鸡翅和炖羊腿香料浓郁，肉质好。餐后的波斯茶配一根糖棒，糖融化一半就拿出来，不然太甜。人均约27刀，很划算。", "dt": "2026-08-31", "ne": "Surena Persian Restaurant", "xy": [307.5, 288.7], "id": 494}, {"n": "Infinity", "a": "Sydney Tower", "t": "旋转景观餐厅", "r": "2", "p": 200, "d": "", "i": "悉尼塔上的旋转景观餐厅，可以俯瞰全城。菜品过得去但不惊艳，来这里主要为了景色和氛围。冬天建议傍晚五点左右到，能看到午后、日落和华灯初上三段景色。适合庆祝生日或带游客来，人均约200刀。", "dt": "2026-08-30", "ne": "Infinity", "xy": [734.2, 570.4], "id": 492}, {"n": "Four Seasons Hotel 蛋糕取货", "a": "The Rocks（四季酒店）", "t": "酒店蛋糕", "r": "3", "p": 20, "d": "圣多诺黑", "i": "四季酒店的蛋糕，到店取货时有香槟和小蛋糕品尝，仪式感很强。酥皮做得出色，焦糖泡芙的外壳偏硬。", "dt": "2026-08-29", "ne": "Four Seasons Hotel cake pickup", "xy": [731.6, 535.5], "id": 491}, {"n": "Park St. Diner", "a": "Pitt St, CBD", "t": "美式餐厅", "r": "3", "p": 50, "d": "汉堡、牛排", "i": "The Grounds集团开的美式复古餐厅，装潢饱和温暖，很有美式小馆的感觉。汉堡很好吃，炸鸡偏干但可以接受，牛排不是高档部位，但煎得很嫩。大人小孩都适合，人均约50刀。", "dt": "2026-08-23", "ne": "Park St. Diner", "xy": [733.3, 561.5], "id": 487}, {"n": "EEF Coffee", "a": "Darlinghurst", "t": "咖啡", "r": "3", "p": 10, "d": "咖啡、香肠卷", "i": "最近很火的咖啡店，层高很高，空间漂亮，不像一般的咖啡店。咖啡和香肠卷都不错，适合坐在窗边放空。附近的Theeca也可以顺便去吃Brunch。", "dt": "2026-08-23", "ne": "EEF Coffee", "xy": [757.9, 595.7], "id": 488}, {"n": "Mapo", "a": "Darlinghurst（亦有Newtown店）", "t": "意式冰淇淋", "r": "3", "p": 9, "d": "黑巧加开心果、香蕉柠檬", "i": "起家于Newtown的意式冰淇淋店，现在开了好几家分店，Darlinghurst也有。口味一直很有创意，黑巧和开心果混着吃是经典组合，香蕉柠檬口味酸甜有趣。", "dt": "2026-08-23", "ne": "Mapo", "xy": [754.9, 592.9], "id": 489}, {"n": "Bones", "a": "Darlinghurst", "t": "居酒屋", "r": "2", "p": 30, "d": "面包炸虾、炸鸡", "i": "小小的居酒屋，有午市营业。招牌面包炸虾偏油但非常香，炸鸡也炸得好。东京拉面偏咸不够浓，猪五花干拌面过甜，面类一般。胜在价格亲民，人均约30刀就能吃饱。", "dt": "2026-08-23", "ne": "Bones", "xy": [758.4, 601.5], "id": 490}, {"n": "Chilli Basil Thai Noodle Bar", "a": "Burwood", "t": "泰国菜", "r": "4", "p": 40, "d": "炸鸡翅、海鲜米粉沙拉、绿咖喱鸡、烤猪颈肉、海鲜炒粿条、腌三文鱼", "i": "Burwood主街上的高分泰国菜老店，装潢像曼谷的火车车厢。炸鸡翅、海鲜米粉沙拉拼盘、豆腐炒通菜、鸡肉绿咖喱、猪五花炒芥蓝、烤猪颈肉、海鲜炒粿条和腌三文鱼都好吃又下饭。人均约40刀，是Burwood中餐以外的好选择。", "dt": "2026-08-22", "ne": "Chilli Basil Thai Noodle Bar", "xy": [465.7, 597.5], "id": 485}, {"n": "Unlimited Korean BBQ", "a": "Castle Tower（Castle Hill）", "t": "韩式烤肉自助", "r": "4", "p": 29, "d": "肥牛、猪脸肉、7.99刀单点芝士玉米和辣花蛤汤", "i": "Castle Towers的韩式烤肉自助，成人29刀、小孩19刀，性价比极高。肉类选择多，肥牛和猪脸肉最好吃，用生菜包肉配泡菜和辣椒一起吃。熟食区有辣年糕、炸鸡翅、土豆饼和紫菜粉丝卷。另有7.99刀的单点菜，芝士玉米和辣花蛤汤都好吃。很适合一大家子聚餐。", "dt": "2026-08-22", "ne": "Unlimited Korean BBQ", "xy": [181.6, 129.9], "id": 486}, {"n": "MANSEOK", "a": "Lidcombe", "t": "韩式大排档", "r": "3", "p": 30, "d": "辣鸡锅（中间乌冬周围芝士玉米）、牛肠锅配泡菜炒饭", "i": "Lidcombe的韩式大排档，适合朋友聚餐。辣鸡锅中间是乌冬面，外圈一圈芝士玉米；牛肠锅可以加泡菜炒饭一起炒着吃。人均约30刀，非常划算。", "dt": "2026-08-17", "ne": "MANSEOK", "xy": [308.4, 557.2], "id": 484}, {"n": "Sluurp 樂樂鍋", "a": "Macquarie Centre", "t": "一人一锅小火锅", "r": "3", "p": 38, "d": "牛舌、和牛、鞭炮笋", "i": "Macquarie Centre电影院旁边的一人一锅小火锅，锅嵌在桌面里，小朋友吃也安全。配菜从旋转带上自选，和牛等食材下单后由小火车送到座位，很有趣。牛舌和和牛都很嫩，鞭炮笋值得点。人均约38刀，很划算。", "dt": "2026-08-16", "ne": "Sluurp", "xy": [504.3, 270.0], "id": 483}, {"n": "Basak & Jogumja", "a": "Lidcombe", "t": "韩式菜包肉", "r": "3", "p": 35, "d": "生菜包卤猪五花、冷面、牛骨汤", "i": "Lidcombe专做韩式菜包肉的店。卤猪五花不咸，用小火保温，肥而不腻，用生菜包上猪肉，配泡菜、酱料、蒜粒和辣椒，口感丰富。两人份套餐配一份酸甜辣口的冷面，和猪肉很搭。牛骨汤也暖胃。人均约35刀。", "dt": "2026-08-15", "ne": "Basak & Jogumja", "xy": [312.2, 545.7], "id": 481}, {"n": "Cafe Nemo", "a": "Lidcombe（火车站对面）", "t": "咖啡", "r": "3", "p": 10, "d": "冰美式", "i": "Lidcombe火车站对面的小咖啡店，简朴不起眼，周末人少。冰美式出色，是韩国人聚居区小咖啡店的稳妥之选。", "dt": "2026-08-15", "ne": "Cafe Nemo", "xy": [299.8, 552.8], "id": 482}, {"n": "Golden Tree Bistro 云深不知处·金小馆", "a": "Ultimo（UTS旁）", "t": "贵州羊肉粉", "r": "4", "p": 30, "d": "羊肉粉、牛肉包子、炸肥肠", "i": "UTS旁边的贵州羊肉粉店。汤底浓郁，米粉嫩滑，配菜用心。肉包子透着油，渣渣牛肉馅非常好吃。全场最佳是炸肥肠，松软酥脆，一口一个停不下来。人均约30刀就能吃饱。", "dt": "2026-08-13", "ne": "Golden Tree Bistro", "xy": [705.3, 602.0], "id": 480}, {"n": "幸福屯家常菜 Happy Village Dumplings", "a": "Chatswood", "t": "东北菜", "r": "3", "p": 35, "d": "排骨豆角铁锅炖（两人可点）、手工饺子、虎皮尖椒", "i": "火车站出来两分钟的东北菜馆，两个人也能点铁锅炖。排骨豆角铁锅炖里有土豆和粉条，炖十五分钟后服务员在锅边贴上玉米饼，再焖十分钟即可，软烂入味。饺子是阿姨现场手工包的，虎皮尖椒很下饭。人均约35刀，适合人少又想吃铁锅炖的时候。", "dt": "2026-08-11", "ne": "Happy Village Dumplings", "xy": [661.0, 344.9], "id": 479}, {"n": "子路私房菜", "a": "配送外卖（无门店位置）", "t": "家常菜外卖", "r": "4", "p": 20, "d": "葱烧大排、手撕鸡、猪肚鸡汤、虫草花鸡汤、麻辣香锅、红烧狮子头、咸肉菜饭", "i": "可外送的家常私房菜。", "dt": "2026-08-08", "ne": "Zilu Private Kitchen", "xy": null, "id": 473}, {"n": "Tre Viet", "a": "Chatswood", "t": "越南菜", "r": "3", "p": 22, "d": "会安鸡饭", "i": "Chatswood的越南餐厅，会安鸡饭很好吃，每块鸡肉都带着鸡冻，懂行的广东人会很欣赏。", "dt": "2026-08-08", "ne": "Tre Viet", "xy": [664.9, 333.4], "id": 474}, {"n": "福芋喜堂 Sweet Town", "a": "Eastwood", "t": "糖水铺", "r": "3", "p": 15, "d": "自选糖水：椰奶底、鸭母捻、芋圆、芋泥、米麻薯、仙草冻", "i": "可以全部自选的糖水铺，从底汤到小料都自己搭配。少见地有潮州甜品鸭母捻，虽然口感偏硬，和潮州本地的不太一样。米麻薯清甜，能吃到米粒口感，最推荐。椰奶底配包心菜芋圆、芋泥和仙草冻也不错。甜度很低，适合晚上吃，但嗜甜的人会觉得太淡。人均约15刀。", "dt": "2026-08-08", "ne": "Sweet Town", "xy": [397.9, 325.8], "id": 475}, {"n": "Gildas", "a": "Surry Hills", "t": "巴斯克Tapas", "r": "5", "p": 80, "d": "面包配伊比利亚火腿、焗蟹吐司、卷卷Chorizo", "i": "巴斯克风格的Tapas餐厅，每一道都很精彩，口味很合中国胃。面包配伊比利亚火腿开场就很好；焗蟹吐司是蟹肉拌浓稠奶油铺在酥脆吐司上，撒红椒粉，绵密浓郁；卷卷Chorizo弹牙多汁，造型可爱。八爪鱼和牛排等大份菜反而不如Tapas出色。人均约80刀，非常推荐。", "dt": "2026-08-08", "ne": "Gildas", "xy": [740.0, 626.9], "id": 476}, {"n": "Artificer Coffee", "a": "Surry Hills", "t": "咖啡", "r": "2", "p": 10, "d": "Cold Brew", "i": "几乎没有装修的街角咖啡店，简单几张板凳，冬天阳光透过树枝洒在街上，很有氛围。Cold Brew偏酸。", "dt": "2026-08-08", "ne": "Artificer Coffee", "xy": [743.8, 615.4], "id": 477}, {"n": "Maison de Butter", "a": "Gordon", "t": "甜品（预约自取）", "r": "3", "p": 14, "d": "蛋糕罐子、小饼干、爆脆巧", "i": "预约自取的甜品工作室，平时不对外营业，约好时间店主会在店里等候。店内布置像南法乡村，摆满厨具和小物件。招牌是蛋糕罐子，不甜，通常搭配一种酸味食材，清爽开胃；小饼干和爆脆巧也可以买来送人。也提供配送，但很推荐亲自去取。", "dt": "2026-08-06", "ne": "Maison de Butter", "xy": [584.7, 214.9], "id": 472}, {"n": "Lulu Dessert House 露记糖水铺", "a": "Eastwood", "t": "糖水铺", "r": "3", "p": 14, "d": "椰汁芋头西米露加麻薯", "i": "和面包店本宫的茶共用一个铺面的糖水铺。椰汁芋头西米露里有芋头块、芋圆和芋泥，芋头控会很满足。份量偏小，可以加一份麻薯。甜汤可选冷热，店员也愿意按要求做成温的，很贴心。", "dt": "2026-08-03", "ne": "Lulu Dessert House", "xy": [401.7, 314.4], "id": 469}, {"n": "Cafe Sydney", "a": "Circular Quay", "t": "景观西餐", "r": "3", "p": 120, "d": "章鱼、Beef Tartare、牛排、鸭胸、儿童炸鱼薯条", "i": "Customs House楼顶的景观西餐厅，正对Harbour Bridge，好天气来吃非常享受。两道菜120刀，三道菜145刀。前菜推荐章鱼和Beef Tartare，主菜推荐牛排和鸭胸；Raw Snapper调味过酸，不要点。儿童餐的Fish & Chips也很专业，外皮蓬松，鱼肉扎实。很适合招待来悉尼的亲友。", "dt": "2026-08-03", "ne": "Cafe Sydney", "xy": [736.4, 539.1], "id": 470}, {"n": "Pastry Club by Frenchs Fair", "a": "Waterloo", "t": "烘焙", "r": "3", "p": 12, "d": "牛角包", "i": "开在住宅小区水池边的烘焙店，棕榈树、仙人掌和碧绿的池水，很有地中海的感觉。牛角包在寒风里依然酥脆。巧克力巴斯克奶味较重。夏天来坐在水池边会更舒服。", "dt": "2026-08-03", "ne": "Pastry Club by Frenchs Fair", "xy": [728.9, 665.4], "id": 471}, {"n": "Sydney Common", "a": "Sheraton Grand Sydney Hyde Park", "t": "现代澳菜", "r": "5", "p": 120, "d": "烤鸭、烤虾", "i": "喜来登酒店里的现代澳菜餐厅，招牌烤鸭非常出色，皮酥肉嫩，香料和蜂蜜相得益彰，可能是目前悉尼最好吃的鸭子。前菜烤虾也很好，酱汁好到值得加点面包来蘸。人均约120刀，值得专程来。", "dt": "2026-08-02", "ne": "Sydney Common", "xy": [739.5, 579.9], "id": 468}, {"n": "Martha's", "a": "Wareemba", "t": "烘焙", "r": "3", "p": 12, "d": "牛角包、Prawn Roll、巴斯克", "i": "人气很旺的烘焙店，周末人很多。牛角包款式丰富，透过玻璃橱窗能看到制作过程。也有少量Brunch，Prawn Roll份量很大。巴斯克蛋糕也值得一试。", "dt": "2026-08-01", "ne": "Martha's", "xy": [528.9, 529.2], "id": 467}, {"n": "Matkim", "a": "George St, CBD", "t": "韩式Omakase", "r": "3", "p": 300, "d": "龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷、南瓜籽挞", "i": "韩式Omakase，Matkim在韩语里就是Omakase的意思。主厨把韩国传统食物与创新做法结合，菜单随季节更换，秋季菜单共16道，用了很多韩国秋季食材。主菜牛肉和猪肉肠失手，其余小菜大多不错，龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷和南瓜籽挞印象最深。人均约300刀。", "dt": "2026-07-31", "ne": "Matkim", "xy": [720.8, 568.6], "id": 466}, {"n": "Bar Bruno", "a": "York St, CBD", "t": "意大利菜", "r": "3", "p": 60, "d": "炸虾、烤鸡、提拉米苏", "i": "新开不久的意大利餐厅，菜单不大，氛围小而精致，服务员带着浓浓的意大利口音。前菜炸虾好吃，主菜烤鸡很嫩，提拉米苏酒味稍淡但整体不错。值得回访把菜单吃一遍。", "dt": "2026-07-28", "ne": "Bar Bruno", "xy": [736.7, 572.1], "id": 463}, {"n": "Social Butterfly Tea & Dessert", "a": "George St, CBD（Apple店隔壁二楼）", "t": "中式茶馆", "r": "2", "p": 22, "d": "抹茶、提拉米苏、抹茶卷", "i": "市中心Apple Store隔壁二楼的中式茶馆，有茶、小蛋糕和中式点心，还有舒服的地台座位。落地飘窗可以俯瞰George St的车水马龙，很适合发呆。抹茶、提拉米苏和抹茶卷等餐点一般，主要为了环境而来。", "dt": "2026-07-28", "ne": "Social Butterfly Tea & Dessert", "xy": [726.3, 557.4], "id": 464}, {"n": "Hayashi Teppanyaki", "a": "Castle Hill", "t": "铁板烧", "r": "2", "p": 60, "d": "带子、大虾、鱿鱼", "i": "铁板烧餐厅，带子、大虾和鱿鱼不错，牛肉、鸡肉和炒饭一般。表演互动很热闹，接鸡蛋、接炒饭能让全桌开怀大笑，适合带长辈和小朋友来玩。人均约60刀，更贵的套餐不建议点。", "dt": "2026-07-28", "ne": "Hayashi Teppanyaki", "xy": [178.5, 127.1], "id": 465}, {"n": "Wonder Sushi", "a": "Norwest", "t": "旋转寿司", "r": "2", "p": 45, "d": "Otoro、海胆、鹅肝、和牛寿司", "i": "Norwest湖边的旋转寿司，餐后可以在水边散步。食材相对高级，有Otoro、海胆、鹅肝和和牛，但味道普通，有点中看不中吃。人均约四五十刀。", "dt": "2026-07-27", "ne": "Wonder Sushi", "xy": [84.2, 133.1], "id": 462}, {"n": "蜀香坊", "a": "Chatswood Interchange", "t": "川菜老店", "r": "5", "p": 40, "d": "火爆双脆、二荆条炒猪脸肉、烧椒茄子、麻婆豆腐牛筋煲、炒笋干", "i": "Chatswood开了二十多年的川菜老店，出品稳定，还持续推出新菜。新菜火爆双脆和二荆条炒猪脸肉都很好吃，烧椒茄子、麻婆豆腐牛筋煲和炒笋干同样浓郁入味，是猛火爆炒的真功夫。", "dt": "2026-07-25", "ne": "Shu Xiang Fang", "xy": [652.4, 340.5], "id": 461}, {"n": "一鸣蒸汽石锅鱼", "a": "Eastwood", "t": "蒸汽石锅鱼", "r": "3", "p": 45, "d": "石锅鱼，配鱼糕、冻豆腐、虾滑、响铃", "i": "Eastwood的蒸汽石锅鱼，煮好后是一锅奶白鱼汤，看着清淡，喝起来非常鲜，暖胃。先喝汤再吃鱼，鱼肉很嫩，之后把鱼糕、冻豆腐、虾滑和响铃放进去煮，冻豆腐和响铃最吸汤。调味台的虾片炸得很好，小朋友很爱。午市套餐78刀，晚市88刀，很划算。", "dt": "2026-07-23", "ne": "Yiming Steam Stone Pot Fish", "xy": [389.3, 321.5], "id": 460}, {"n": "雄起", "a": "Concord", "t": "川菜现炒", "r": "3", "p": 50, "d": "豆花肥肠鱼、双椒牛肉、火爆腰花", "i": "现点现炒的川菜馆，不用预制菜，上菜较慢但值得等。豆花肥肠鱼一道菜四种食材，豆花嫩、肥肠香、鱼片弹、粉丝滑，各有滋味；双椒牛肉和火爆腰花也好吃。人均约50刀，份量大到能吃得很撑。", "dt": "2026-07-22", "ne": "Xiongqi", "xy": [454.9, 529.6], "id": 459}, {"n": "味道云南 Impression of Yunnan Table", "a": "Ultimo", "t": "云南菜", "r": "3", "p": 36, "d": "糟辣子炒脊肉筋、油淋干巴、百香果鱼片、薄荷炸排骨", "i": "开在蓝色小排屋里的云南菜，在悉尼比较少见。菜单选择多，百香果鱼片、橙皮辣子鸡、油淋干巴、菌菇焖饭、糟辣子炒脊肉筋、尖椒鹿茸菇和薄荷炸排骨都可以试，炒脊肉筋和油淋干巴最好吃。整体口味偏咸。人多建议早点到。人均约36刀。", "dt": "2026-07-20", "ne": "Impression of Yunnan Table", "xy": [702.2, 599.3], "id": 458}, {"n": "TRICO", "a": "Surry Hills", "t": "饭团", "r": "2", "p": 12, "d": "拉面溏心蛋饭团", "i": "小小的饭团店，口味不多，造型可爱，有三角形明太子饭团、长方形午餐肉鸡蛋饭团和圆形拉面溏心蛋饭团。拉面溏心蛋比明太子好吃，午餐肉鸡蛋饭团少了紫苏叶，层次欠一点。午市套餐价格实惠。", "dt": "2026-07-18", "ne": "TRICO", "xy": [731.4, 622.5], "id": 453}, {"n": "Single O", "a": "Surry Hills", "t": "Cafe/Brunch", "r": "5", "p": 25, "d": "Cold Brew、香蕉面包配Matcha Butter、牛油果太阳蛋吐司", "i": "人气极高的Cafe，周末不接受预订，常要排队近一小时，但值得等。门口标志性的水龙头供应Cold Brew。香蕉面包配抹茶黄油，抹茶的甘苦正好中和香蕉面包的甜腻；牛油果太阳蛋吐司的两颗蛋做得极好。人均约25刀，非常划算。", "dt": "2026-07-18", "ne": "Single O", "xy": [747.2, 626.0], "id": 454}, {"n": "Quoi Dining", "a": "Baulkham Hills（Norwest水边）", "t": "法国Fine Dining", "r": "3", "p": 130, "d": "Beef Tartare、鱼籽刺身挞、Pork Belly、安格斯牛排", "i": "Norwest湖边的法国Fine Dining，菜品有模有样。小食Beef Tartare和鱼籽刺身挞、前菜Pork Belly和意面、主菜安格斯牛排都不错，甜品一般可以不点。原价人均约130刀偏贵，用First Table优惠来吃非常划算。", "dt": "2026-07-18", "ne": "Quoi Dining", "xy": [81.2, 130.3], "id": 455}, {"n": "Hue coffee roasters", "a": "Crows Nest", "t": "咖啡", "r": "3", "p": 10, "d": "Cold Brew、巴斯克", "i": "下北区新开的咖啡店，连招牌都没有，很低调。咖啡和巴斯克蛋糕最近很火，Cold Brew好喝；巴斯克外圈焦香，中间流心，奶味较浓。", "dt": "2026-07-18", "ne": "Hue coffee roasters", "xy": [725.4, 425.3], "id": 456}, {"n": "Osteria di Russo & Russo", "a": "Enmore", "t": "意大利小酒馆", "r": "3", "p": 80, "d": "前菜、意面、鸭胸、提拉米苏", "i": "Enmore的小众意大利酒馆，菜单简单但每道都很细致。前菜小巧有风味，意面在线，主菜鸭胸很嫩，甜品选提拉米苏。整体奶油用得多，奶味重，不喜欢奶制品的人要仔细挑菜。", "dt": "2026-07-18", "ne": "Osteria di Russo & Russo", "xy": [639.5, 665.4], "id": 457}, {"n": "囍记大排档", "a": "Burwood", "t": "粤式大排档", "r": "3", "p": 60, "d": "蒜蓉粉丝蒸生蚝、黑松露虾多士、手撕鸡、啫啫鲍鱼鸡煲、猪油渣炒芥蓝", "i": "粤式大排档，锅气足，食材新鲜，适合人多点一桌。特别推荐蒜蓉粉丝蒸生蚝、黑松露虾多士、招牌手撕鸡、啫啫鲍鱼鸡煲和猪油渣炒芥蓝。XO酱炒菜、蒸青衣和咕噜肉中等偏上，烤乳鸽火候过了。人均约60刀。", "dt": "2026-07-04", "ne": "Hei Kee Dai Pai Dong", "xy": [455.3, 582.8], "id": 451}, {"n": "冒丫冒菜 Dackie Maolatang", "a": "Macquarie Park", "t": "麻辣烫/麻辣拌", "r": "3", "p": 25, "d": "番茄汤底麻辣烫、黏糊麻辣拌、炸肉丸子", "i": "麻辣烫和麻辣拌小店。番茄汤底的麻辣烫很受小朋友欢迎；黏糊麻辣拌名副其实，多加鞭炮笋，口感咯吱咯吱很解压。食材选择不多，但炸肉丸子很好吃，可以多拿几颗。人均约25刀。", "dt": "2026-07-04", "ne": "Dackie Maolatang", "xy": [491.9, 277.1], "id": 452}, {"n": "Gina Pasta Bar", "a": "Barangaroo", "t": "意大利菜", "r": "5", "p": 100, "d": "炸墨鱼、火腿配哈密瓜、提拉米苏（夹巧克力碎）", "i": "Barangaroo临水的意大利餐厅，格调很好。前菜炸墨鱼和火腿配哈密瓜都好吃。提拉米苏是一绝，绵软浓郁，中间还夹着巧克力碎，赶时间的话可以跳过主菜直接吃甜品。人均约100刀。", "dt": "2026-07-01", "ne": "Gina Pasta Bar", "xy": [713.2, 545.0], "id": 450}, {"n": "Itadakimasu Onigiri & Bar", "a": "Darlinghurst", "t": "饭团/居酒屋", "r": "2", "p": 40, "d": "Kimchi Salmon Tartare、带子刺身、牛排", "i": "Sandoichi隔壁的姐妹店，主打饭团，店很小，只有约10个座位，吧台位可以看到饭团制作过程。和牛、鳗鱼、炸虾和烤带子饭团都很普通，反而配菜出色，Kimchi Salmon Tartare、带子刺身和牛排比不少居酒屋还好吃。人均约40刀。", "dt": "2026-06-30", "ne": "Itadakimasu Onigiri & Bar", "xy": [762.2, 590.0], "id": 449}, {"n": "MLK Deli", "a": "Surry Hills", "t": "意式三明治", "r": "3", "p": 20, "d": "The MLK（开心果酱、火腿、橄榄）", "i": "蓝色小房子里的意式三明治店，外观可爱。同名招牌The MLK是开心果酱、火腿和橄榄，面包松软，非常香。一份二十多刀看着不便宜，但份量够分两顿吃。", "dt": "2026-06-29", "ne": "MLK Deli", "xy": [736.9, 611.3], "id": 446}, {"n": "明叔 Uncle Ming's", "a": "York St, CBD", "t": "地下酒吧", "r": "3", "p": 45, "d": "鸡尾酒", "i": "开了很多年的地下酒吧，红色灯光配中式摆件，风格诡异阴森，但人声鼎沸，气氛热闹。鸡尾酒好喝。胆小的人慎入，喜欢及时行乐的可以来。", "dt": "2026-06-29", "ne": "Uncle Ming's", "xy": [723.9, 576.9], "id": 447}, {"n": "Bar Conte", "a": "Clarence St, CBD", "t": "意大利菜", "r": "4", "p": 130, "d": "小章鱼配佛卡夏、牛排、鸭肉、可颂味鸡尾酒", "i": "起家于Surry Hills的意大利餐厅在市中心开的分店，像旧时代的歌舞厅，掀开红丝绒门帘，满屋暧昧灯光和戏剧感的墙画。前菜小章鱼的酱汁拿来蘸佛卡夏非常好吃；主菜牛排和鸭肉都出色；有一款喝起来带可颂味的鸡尾酒很特别。人均约130刀，周末有附加费。", "dt": "2026-06-29", "ne": "Bar Conte", "xy": [739.9, 563.2], "id": 448}, {"n": "Daruma Dumplings Beer House 不倒翁台式熱炒", "a": "Strathfield", "t": "台式热炒", "r": "5", "p": 40, "d": "沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉、盐酥鸡、老式芋泥蛋糕", "i": "很有台湾味的台式热炒店，锅气扑面，九层塔香气满屋，服务员用台湾腔喊单，非常适合下班放松。沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉和盐酥鸡都好吃，甜品老式芋泥蛋糕更是一绝。台湾大厨手法利落，服务员热情爱聊天，整家店很有温度。", "dt": "2026-06-27", "ne": "Daruma Dumplings Beer House", "xy": [431.6, 579.9], "id": 444}, {"n": "Eastwood Table", "a": "Eastwood", "t": "韩式猪排", "r": "3", "p": 30, "d": "猪排拼盘、芝士猪排、辣豆腐面条汤", "i": "Eastwood火车站出来、韩国街口不到20米的新开猪排店，近来人气很旺。入座先送一碗奶油汤。猪排拼盘份量很大，韩式猪排薄而嫩，芝士猪排可以拉丝，小朋友会喜欢；偏爱厚切日式猪排的人可能不太习惯。辣豆腐面条汤更出色，豆腐嫩滑入味，牛肉给得大方。店小常满座，人均约30刀。", "dt": "2026-06-27", "ne": "Eastwood Table", "xy": [405.1, 325.0], "id": 445}, {"n": "ESQ Bar + Dining", "a": "QVB（Tea Room正下方）", "t": "西餐", "r": "4", "p": 70, "d": "刺身、烤大虾、鸭胸、牛排、烤童子鸡", "i": "QVB Tea Room正下方的西餐厅，圆拱落地窗非常漂亮，冬日阳光洒进来很有氛围。前菜刺身和烤大虾不错，主菜鸭胸、牛排和烤童子鸡都很出色，肉质嫩，入味浓郁，做肉很拿手。商务、聚会和约会都合适，不喝酒人均约70刀。", "dt": "2026-06-26", "ne": "ESQ Bar + Dining", "xy": [728.9, 576.7], "id": 442}, {"n": "Sofé Bakery", "a": "Wahroonga", "t": "韩式烘焙", "r": "3", "p": 12, "d": "抹茶巧克力可颂、蛋挞、Cold Brew Latte", "i": "Wahroonga火车站出来一分钟的韩式烘焙店。人气抹茶巧克力可颂酥到掉渣，略甜，配Cold Brew Latte刚好；蛋挞也不错。据熟客说，店里的咸口面包更好吃。", "dt": "2026-06-26", "ne": "Sofé Bakery", "xy": [492.1, 88.7], "id": 443}, {"n": "小湖南 Little Hunan", "a": "Chatswood Interchange", "t": "湘菜", "r": "3", "p": 40, "d": "小炒黄牛肉、农家一碗香、腰肝合炒、长沙炒粉", "i": "开在Chatswood火车站楼上Interchange的湘菜馆，可以选小辣，辣度友好。菜式重口下饭、偏咸。小炒黄牛肉、农家一碗香、腰肝合炒和长沙炒粉都好吃；酸豆角炒鸡胗太咸，腌笋腊肉的腊肉一般。", "dt": "2026-06-24", "ne": "Little Hunan", "xy": [668.3, 344.0], "id": 441}, {"n": "Wooden Bowl Hamjibak", "a": "West Ryde", "t": "韩式中华料理", "r": "3", "p": 20, "d": "60刀套餐：糖醋肉、炸酱面、海鲜汤面", "i": "韩式中华料理，以糖醋肉加炸酱面的组合为特色。60刀套餐有糖醋猪肉、炸酱面和海鲜汤面，够三个人吃饱。糖醋肉用纯瘦肉，炸得酥嫩；两款面都很好吃。人均约20刀，非常划算。", "dt": "2026-06-21", "ne": "Wooden Bowl Hamjibak", "xy": [418.0, 364.8], "id": 440}, {"n": "山嘢贵州家菜 Ye Mama's Kitchen", "a": "Chatswood", "t": "贵州菜", "r": "3", "p": 50, "d": "凉拌米皮、辣子鸡、爆炒猪背筋、酸菜炒黑芝麻汤圆", "i": "贵州家常菜，辣度很高，凉拌米皮和辣子鸡尤其辣。炝锅鱼不太辣，外皮酥脆但内里不够入味。爆炒猪背筋又韧又弹牙，很精彩；鹿茸菇同样做法，两道都香但偏油。酸菜炒黑芝麻汤圆是一道奇特菜，又酸又辣又咸甜，意外地不违和。人均约50刀。", "dt": "2026-06-20", "ne": "Ye Mama's Kitchen", "xy": [657.9, 329.3], "id": 439}, {"n": "江西味道 Jiangxi Flavour", "a": "Burwood", "t": "江西菜", "r": "4", "p": 40, "d": "江西炒粉、辣炒鳝鱼、笋干炒肉、瓦罐汤", "i": "锅气很足的江西菜，全店只有老板一个人做饭、上菜、收银和清洁，出品却很稳定。江西炒粉Q弹微辣，酱香和蛋香融合得好；辣炒鳝鱼很嫩，但辣度很高，不太能吃辣的人慎点；笋干炒肉脆而有嚼劲，吸满油香；瓦罐汤清甜不油，是慢慢煨出来的味道。", "dt": "2026-06-19", "ne": "Jiangxi Flavour", "xy": [452.9, 602.2], "id": 438}, {"n": "潮运莱", "a": "Chinatown", "t": "潮州菜", "r": "2", "p": 40, "d": "普宁豆腐、砂锅粥（需等40分钟）", "i": "潮州菜馆，整体刚过及格线。普宁炸豆腐好吃；炒粿条味道不错但粿条本身一般；鱼饭清爽；砂锅粥要等约40分钟，味道可以。卤水略带苦味，蚝烙不够正宗，生腌三文鱼蒜味太重盖过鱼味。相比之下福记更稳。", "dt": "2026-06-18", "ne": "Chao Yun Lai", "xy": [721.6, 604.7], "id": 436}, {"n": "KIKI Dessert", "a": "Ultimo（Central去UTS路上小巷）", "t": "Cafe/蛋糕", "r": "3", "p": 22, "d": "巧克力蛋糕配Cold Brew", "i": "藏在Central去UTS路上麦当劳旁小巷里的小Cafe，很有情调。后厨开放，蛋糕应该是店里现做的。巧克力蛋糕配Cold Brew很搭，店里还有一些可爱的书可以翻看。位置难找，但值得来。", "dt": "2026-06-18", "ne": "KIKI Dessert", "xy": [705.8, 607.9], "id": 437}, {"n": "Modo Mio", "a": "Castle Hill", "t": "意大利菜", "r": "3", "p": 75, "d": "Puff Bread、炸海鲜、Beef Tartare、蛤蜊珍珠面、提拉米苏", "i": "山区有点小Fine Dining感觉的意大利餐厅。前菜Puff Bread、炸海鲜和Beef Tartare都很好吃。主菜稍普通，牛排不够香嫩，蛤蜊珍珠面浓郁好吃，蟹肉意面一般。提拉米苏非常出色，软绵湿润。人均约75刀。", "dt": "2026-06-15", "ne": "Modo Mio", "xy": [182.1, 135.7], "id": 435}, {"n": "Costi's Fresh Seafood", "a": "Castle Tower（Castle Hill）", "t": "海鲜零售", "r": "4", "p": 30, "d": "Premium Yamba Cooked Tiger虾（约45刀每公斤）、生蚝、Otoro、Salmon Belly", "i": "Castle Hill一带有名的海鲜店，极其新鲜。推荐Premium Yamba Cooked Tiger熟虾，约45刀一公斤，虾肉弹牙、海味浓郁。刺身同样出色，生蚝、Otoro和Salmon Belly都值得买回家配意面或下酒。", "dt": "2026-06-14", "ne": "Costi's Fresh Seafood", "xy": [185.9, 124.3], "id": 433}, {"n": "Freo", "a": "St Leonards", "t": "酸奶冰淇淋/烘焙", "r": "5", "p": 9, "d": "抹茶、奶茶、巧克力、海盐开心果四味mix；海盐面包、巧克力曲奇", "i": "悉尼二帽餐厅Lumi Dining主厨在St Leonards开的酸奶冰淇淋旗舰店，店面很大，除酸奶冰淇淋外还有每日现烤的Pastry。酸奶口味有十几种，包括门店限定款，抹茶、奶茶、巧克力和海盐开心果混在一起最好吃。配料台选择多得惊人，有新鲜水果、麻薯、饼干、花生酱、开心果酱，还有巧克力酱和抹茶酱的水龙头。海盐面包、巧克力曲奇、斑斓椰子水和草莓苏打也都不错，还有Brunch。", "dt": "2026-06-14", "ne": "Freo", "xy": [697.4, 421.4], "id": 434}, {"n": "喜凤台 East Phoenix", "a": "Zetland（East Village）", "t": "粤式早茶", "r": "3", "p": 35, "d": "推车点心、XO Pipi、避风塘炒蟹", "i": "出品稳定的粤式早茶酒楼，周末中午点心推车一圈圈来，选择很多。点心车上甚至有XO酱炒Pipi和避风塘炒蟹，XO Pipi很好吃，剩下的XO酱可以拌炒面。人均约35刀就能吃得很饱。", "dt": "2026-06-13", "ne": "East Phoenix", "xy": [728.5, 681.7], "id": 432}, {"n": "Oshu Japanese Restaurant", "a": "West Ryde", "t": "日料", "r": "2", "p": 60, "d": "寿司刺身拼盘、拉面", "i": "韩国人开的日料店，味道不错。寿司刺身拼盘用木制阶梯摆盘，很有特色。拉面汤底不是熬出来的，但吃完冷寿司后来一碗热汤面很舒服。价格偏高，人均约60刀。", "dt": "2026-06-09", "ne": "Oshu Japanese Restaurant", "xy": [421.6, 373.4], "id": 430}, {"n": "Fresh Delight Bakery & Cafe", "a": "West Ryde", "t": "越南包", "r": "2", "p": 11, "d": "烧肉越南包", "i": "开在Woolworths停车场旁的越南包店，11刀一个，烧肉和蔬菜给得满满的，一个就够一顿。缺点是烧肉的皮不脆。适合想快速解决一餐时买，越南包爱好者不必专程。", "dt": "2026-06-09", "ne": "Fresh Delight Bakery & Cafe", "xy": [425.4, 361.9], "id": 431}, {"n": "The Chairman 湖南人湘菜馆", "a": "Botany", "t": "湘菜", "r": "2", "p": 35, "d": "烟笋腊肉、粉蒸肉、青椒茄子、湖南牛肉粉", "i": "开了很多年的湘菜馆，锅气足，很下饭。可惜肉质一般，野山椒牛肉和湖南小炒肉都偏柴；烟笋腊肉、粉蒸肉和青椒茄子不错。湖南牛肉粉是宽条，和一甲一嗦的细粉不同。人均约35刀很划算，住得近可以来，远的话可去可不去。", "dt": "2026-06-08", "ne": "The Chairman", "xy": [700.0, 811.2], "id": 428}, {"n": "Norimono", "a": "Crows Nest", "t": "日式手卷", "r": "2", "p": 90, "d": "和牛鹅肝卷、XO带子卷、长腿蟹卷、茶碗蒸", "i": "板前现做手卷的日料店，形式像Omakase但不是Omakase。手卷有传统、创新和Premium几十种口味，和牛鹅肝卷、XO带子卷、长腿蟹卷和茶碗蒸都好吃。人均约90刀还吃不饱，想吃饱大概每人还要多花约50刀。", "dt": "2026-06-08", "ne": "Norimono", "xy": [712.9, 432.4], "id": 429}, {"n": "Manon The Room", "a": "Chatswood Chase", "t": "英式茶室", "r": "3", "p": 30, "d": "早餐", "i": "Chatswood Chase里的英式茶室，和QVB Tea Room是同一家族的姐妹店。低调的木质装潢配闪亮银器茶具，很有复古感。早餐菜单简单美味，是Chatswood少有的有档次的Cafe。人均约30刀。", "dt": "2026-06-04", "ne": "Manon The Room", "xy": [655.5, 348.7], "id": 424}, {"n": "Jamaican Patty Bakehouse", "a": "Glebe", "t": "牙买加肉饼", "r": "3", "p": 12, "d": "牙买加BBQ鸡肉馅肉饼", "i": "Glebe Point Rd上卖牙买加肉饼的小店。金黄外皮是一碰就掉渣的酥皮，内馅有鸡肉、牛肉和蔬菜等口味，牙买加特色BBQ鸡肉馅味道特别浓郁，小朋友也爱吃。", "dt": "2026-06-04", "ne": "Jamaican Patty Bakehouse", "xy": [674.2, 604.7], "id": 425}, {"n": "The Wedge", "a": "Glebe", "t": "咖啡", "r": "3", "p": 20, "d": "巧克力蛋糕配Long Black", "i": "简单的街角咖啡店，临窗位置可以看街景，适合一个人安静地喝下午茶。巧克力蛋糕是沙沙的口感，很甜，配很苦的Long Black反而出奇地好吃。约20刀。", "dt": "2026-06-04", "ne": "The Wedge", "xy": [678.0, 593.2], "id": 426}, {"n": "JEONG DAM 情谈", "a": "Eastwood", "t": "韩国菜", "r": "3", "p": 30, "d": "牛肉饼、海鲜煎饼、豆腐海鲜汤", "i": "新开的韩国菜，中文名叫情谈，可外带。薄牛肉饼好吃，海鲜饼香脆，豆腐海鲜汤暖身；炸鸡一般，面衣偏厚。人均约30刀。", "dt": "2026-06-04", "ne": "JEONG DAM", "xy": [394.7, 310.3], "id": 427}, {"n": "咕嘟砂锅", "a": "Eastwood", "t": "砂锅菜", "r": "4", "p": 45, "d": "鲜椒鳝鱼（底铺米线）、鲜椒双脆、豆花牛肉、肥肠鱼、手撕羊排", "i": "冬天很适合来的砂锅菜馆，砂锅上桌时咕嘟冒泡，热气腾腾。新推出的鲜椒系列很好吃，鲜椒鳝鱼底下铺着米线，吸足双椒香和鳝鱼的鲜，鲜椒双脆也出色。豆花牛肉、肥肠鱼和手撕羊排都很下饭。人均约45刀能吃撑。", "dt": "2026-06-01", "ne": "Gudu Claypot", "xy": [392.3, 329.7], "id": 422}, {"n": "Te Japanese Dining", "a": "Wentworth Point", "t": "日料", "r": "3", "p": 50, "d": "Salmon Tartare、牛排", "i": "Wentworth Point居民楼下的日料店，水准比位置给人的期待高。Salmon Tartare和牛排很出色；拉面汤底不是熬的，天妇罗略油，但都不影响整体。人均约50刀吃得饱。", "dt": "2026-06-01", "ne": "Te Japanese Dining", "xy": [381.6, 437.3], "id": 423}, {"n": "MANI Restaurant", "a": "Sydney Fish Market", "t": "海鲜/中式融合", "r": "3", "p": 70, "d": "三文鱼生腌、XO Pipi配苔条粢饭糕、香辣昆士兰小龙虾", "i": "新鱼市里的海鲜餐厅，口碑是又贵又好吃。菜式融合了上海菜的精致、广东菜的手法和一点川味。三文鱼生腌清爽开胃；XO Pipi底下铺着苔条粢饭糕，非常搭。重头戏是昆士兰小龙虾，下锅前先拿活虾给客人看，个头可能是悉尼最大，肉质紧实，香辣口味相当辣，拌饭吃很满足。很适合带长辈来鱼市时吃一顿好的。", "dt": "2026-05-31", "ne": "MANI Restaurant", "xy": [681.2, 577.1], "id": 421}, {"n": "iisho", "a": "CBD", "t": "抹茶软雪糕", "r": "3", "p": 9, "d": "抹茶软雪糕", "i": "市中心的抹茶软雪糕店，抹茶味浓郁，很好吃。", "dt": "2026-05-28", "ne": "iisho", "xy": [717.5, 562.5], "id": 420}, {"n": "诚 Makoto Sushi Bar", "a": "World Square", "t": "寿司", "r": "2", "p": 120, "d": "寿司、手卷", "i": "悉尼的老牌寿司店，食材新鲜但口味普通，已不如当年出众。曾在三文鱼手卷里吃到长鱼刺，店家诚恳道歉并免了该单。如今悉尼好吃的寿司店太多，不太值得专程来。", "dt": "2026-05-26", "ne": "Makoto Sushi Bar", "xy": [725.4, 593.2], "id": 418}, {"n": "Radio Taco", "a": "Chippendale", "t": "墨西哥菜", "r": "4", "p": 20, "d": "牛肉Burrito（含薯条）", "i": "Chippendale的墨西哥Taco店，原来是韩国炸鸡店，开业不到一年就拿到4.7高分。装修色彩明亮热情。牛肉Burrito塞满嫩牛肉碎和脆薯条，非常好吃，20刀一个，够分两顿。附近有白兔画廊，可以顺路。", "dt": "2026-05-26", "ne": "Radio Taco", "xy": [704.9, 618.3], "id": 419}, {"n": "Lana", "a": "Circular Quay（Grana楼上）", "t": "意大利菜", "r": "3", "p": 160, "d": "琵琶虾海鲜意面、牛排、烤鸡（当日最佳）", "i": "Grana楼上的意大利餐厅，装修和氛围与楼下很接近。前菜Kingfish刺身和虾多士中规中矩。主菜是精华，琵琶虾海鲜意面和牛排都好，烤鸡最出色，蘑菇香浓，连鸡胸都很嫩。提拉米苏做成巧克力慕斯的非传统版本，略怪但好吃。氛围好，适合约会和姐妹聚会，人均约160刀。", "dt": "2026-05-24", "ne": "Lana", "xy": [740.0, 547.6], "id": 417}, {"n": "Sydney Eels BBQ", "a": "Homebush", "t": "韩式烤鳗鱼/鸭肉", "r": "5", "p": 60, "d": "炭烤和辣酱澳洲野生鳗鱼、韭菜鸭肉、酱蟹、蒸蛋", "i": "少见的以鳗鱼和鸭肉为主角的韩式烤肉店。澳洲野生鳗鱼肉质紧实弹牙，炭烤和辣酱两种口味都好吃，炭烤后不腥不腻，在整个澳洲都难得。鸭肉配韭菜很入味。酱蟹拌饭和蒸蛋是很好的配角。非常推荐。", "dt": "2026-05-23", "ne": "Sydney Eels BBQ", "xy": [402.6, 557.7], "id": 415}, {"n": "Dubudang 두부당", "a": "Epping", "t": "韩国豆腐店", "r": "3", "p": 45, "d": "海鲜豆腐汤、泡菜炒猪肉配白豆腐、紫苏油煎豆腐", "i": "Eastwood和Epping一带近来很火的韩国豆腐店，饭点要排队，错峰就不用。豆腐是粗糙有料的口感，和常见的嫩豆腐不同，配上韩式重口酱料效果极好。推荐海鲜豆腐汤、泡菜炒猪肉配白豆腐和紫苏油煎豆腐。不特别爱豆腐的人不必专程，但能把普通食材做到极致很值得敬佩。人均约45刀。", "dt": "2026-05-23", "ne": "Dubudang", "xy": [400.0, 263.0], "id": 416}, {"n": "Bakery 101", "a": "Eastwood", "t": "烘焙", "r": "3", "p": 12, "d": "巧克力包、蝴蝶酥、火腿芝士牛角包", "i": "Eastwood韩国街新开的面包店，大红色店面大气洋气。店小但品类很多，巧克力包、蝴蝶酥和现烤火腿芝士牛角包都好吃，只是不算惊艳。可以坐下喝杯咖啡，Panini也值得一试。", "dt": "2026-05-21", "ne": "Bakery 101", "xy": [408.3, 316.0], "id": 413}, {"n": "妈妈小厨 Mama's Wok", "a": "Rhodes Waterside", "t": "家常小炒", "r": "3", "p": 40, "d": "盐焗鸡、茄子焖脆皖、炒花菜", "i": "评价褒贬不一的家常小炒馆，苍蝇馆子风格，上菜快。盐焗鸡、茄子焖脆肉鲩和炒花菜都很下饭，茄子做得尤其好。人均约40刀能吃很饱，饭后可以去隔壁Urban Jungle买杯咖啡。", "dt": "2026-05-21", "ne": "Mama's Wok", "xy": [420.9, 448.6], "id": 414}, {"n": "Cafe on Melrose", "a": "Melrose Park", "t": "韩式Cafe/Brunch", "r": "3", "p": 40, "d": "大虾意面、特调咖啡、自搭佛卡夏拼盘", "i": "Melrose Park住宅区楼下的韩国小Cafe，人气很旺，可能是附近最好的一家。特调饮品好喝，大虾意面好吃不腻。可以自由搭配的Brunch盘也很有意思，佛卡夏、牛油果、薯饼、韩式炸鸡和西班牙香肠配在一起出奇地好。人均约40刀。", "dt": "2026-05-19", "ne": "Cafe on Melrose", "xy": [376.8, 401.9], "id": 412}, {"n": "Hustlers. Syd", "a": "York St, CBD", "t": "亚洲融合", "r": "3", "p": 100, "d": "虾多士、三文鱼、牛排、叉烧鸡肉、菲律宾Ube Cake", "i": "有帽子评级的亚洲融合餐厅，周五晚上满座，很吵但气氛很好。虾多士、三文鱼、牛排和叉烧鸡肉颜值和味道都在线，鸡尾酒精致。甜品菲律宾Ube Cake很好吃。适合周五下班后来放松，人均约100刀。", "dt": "2026-05-17", "ne": "Hustlers. Syd", "xy": [734.5, 579.0], "id": 411}, {"n": "Porter House Grounds & Cellar Door", "a": "Castlereagh St, CBD", "t": "酒吧/咖啡", "r": "3", "p": 45, "d": "黑咖啡", "i": "白天兼卖咖啡的酒吧，亮黄色的空间很明媚，在酒吧里喝黑咖啡别有一番感觉。", "dt": "2026-05-16", "ne": "Porter House Grounds & Cellar Door", "xy": [733.0, 554.2], "id": 408}, {"n": "Lee Ho Fook 利口福", "a": "Castlereagh St, CBD", "t": "中餐", "r": "5", "p": 100, "d": "海胆虾多士、清蒸牙鱼配豆腐、鸭子", "i": "从墨尔本开到悉尼的澳式中餐，悉尼店获评两帽，是少数做得好的澳式中餐，有融合元素，但口味很中国。虾多士把虾胶塞进面包里，配蒜苗、咸蛋黄和牛油做的酱，咸香好吃，上面再放海胆。北京鸭经过10天熟成，皮下油脂去尽，皮脆肉嫩，几乎没有鸭骚味，配自制梅子酱，荷叶饼放凉也不会变硬。蟹肉带子XO酱福建炒饭比大多数粤菜馆做得好，虾干和瑶柱香味突出。清蒸牙鱼嫩得像豆腐。姜葱蒸鳕鱼偏西式，想吃中式蒸鱼不要点；甜品也不推荐。人均约100刀。", "dt": "2026-05-16", "ne": "Lee Ho Fook", "xy": [716.6, 574.3], "id": 409}, {"n": "Chinatown Country Club", "a": "Clarence St, CBD", "t": "咖啡/服装店", "r": "3", "p": 12, "d": "月亮河（Cold Brew加枫糖奶盖）", "i": "QVB附近的服装店加咖啡店，空间宽敞，适合悠闲地坐着喝咖啡，也有不少人在这里用电脑。招牌月亮河是Cold Brew加枫糖奶盖，清甜爽口。服装陈列很好看。", "dt": "2026-05-16", "ne": "Chinatown Country Club", "xy": [743.5, 570.4], "id": 410}, {"n": "Caness", "a": "Paddington", "t": "西班牙小馆", "r": "3", "p": 60, "d": "餐前面包、香肠、牛排、大虾、章鱼、烤鸡、南瓜、巧克力慕斯、巴斯克", "i": "氛围很好的西班牙小馆，每道菜都好吃，只是略咸，配酒正合适。餐前面包、香肠、牛排、大虾、章鱼、烤鸡和南瓜都可以点，甜品有巧克力慕斯和巴斯克蛋糕。适合约会或两对朋友聚餐。", "dt": "2026-05-13", "ne": "Caness", "xy": [786.8, 614.7], "id": 407}, {"n": "Cherry Beans Bakery Cafe", "a": "West Ryde", "t": "韩式烘焙", "r": "2", "p": 12, "d": "可颂、蛋糕", "i": "很韩式的烘焙Cafe，面包蛋糕精致可爱。晚上去货架所剩不多，味道中规中矩，不算惊艳。可颂切开夹煎蛋就是一顿简餐。", "dt": "2026-05-12", "ne": "Cherry Beans Bakery Cafe", "xy": [412.9, 369.0], "id": 406}, {"n": "Han Yakiniku", "a": "West Ryde", "t": "日式烤肉自助", "r": "3", "p": 59.5, "d": "Wagyu Blade Cube Cut", "i": "日式烤肉自助，每位59.5刀。两款Wagyu最值得狂点，尤其Wagyu Blade Cube Cut，很嫩很好吃。选择不算多，一轮就能点齐想吃的，但上菜快、服务好，儿童按半价收费。很适合运动后胃口大开的时候来。", "dt": "2026-05-10", "ne": "Han Yakiniku", "xy": [428.8, 372.5], "id": 405}, {"n": "Jihomakase", "a": "North Bridge", "t": "日式Omakase", "r": "5", "p": 225, "d": "18道套餐，含拉面、寿司、甜点", "i": "非常良心的日式Omakase，每位190刀，份量很足，很多菜式有巧思。食材不算顶级，但主厨手艺扎实。一共约18道，以为快结束时还会上拉面、四贯寿司和两道甜品，胃口小的人会吃不完。不难订位，加酒水人均约225刀，值得去。", "dt": "2026-05-09", "ne": "Jihomakase", "xy": [755.3, 377.1], "id": 404}, {"n": "Sashimi Shinsengumi 新鲜组", "a": "Crows Nest", "t": "刺身外带", "r": "3", "p": 120, "d": "10贯寿司拼盘、Salmon Belly、Kingfish Belly、Otoro", "i": "以新鲜著称的刺身外带柜台，小小一个柜台塞满各种刺身。10贯寿司拼盘、Salmon Belly、Kingfish Belly和Otoro都非常肥美新鲜。价格不便宜，约120刀大概只够一人份。", "dt": "2026-05-08", "ne": "Sashimi Shinsengumi", "xy": [728.8, 435.9], "id": 403}, {"n": "无名冒菜", "a": "Eastwood", "t": "冒菜/麻辣拌", "r": "3", "p": 22, "d": "冒菜、黏糊麻辣拌（加方便面）", "i": "附近的冒菜小店，可以反复回访。冒菜底料很香，盖在米饭上拌着吃停不下来。新推出麻辣拌，可以自己加芝麻酱做成黏糊麻辣拌，记得加方便面。价格很友好，拿一大碗也没负担。", "dt": "2026-05-07", "ne": "Nameless Maocai", "xy": [385.9, 315.3], "id": 402}, {"n": "Hashi Sushi", "a": "Macquarie Park", "t": "旋转寿司", "r": "5", "p": 35, "d": "炙烤鹅肝三文鱼腩手卷、海胆带子刺身手卷、甜虾带子三文鱼手卷", "i": "Macquarie Centre的旋转寿司，可以算目前悉尼旋转寿司的天花板，现在已经不太用排队。转带上的寿司已经很新鲜，手卷更惊艳，推荐炙烤鹅肝三文鱼腩、海胆带子刺身和甜虾带子三文鱼刺身手卷。柱子上贴着当天的新鲜鱼获，照着点准没错。", "dt": "2026-05-03", "ne": "Hashi Sushi", "xy": [507.8, 280.6], "id": 398}, {"n": "Bambini Trust Restaurant & Wine Room", "a": "Elizabeth St, CBD", "t": "意大利菜", "r": "3", "p": 110, "d": "奶油大虾意面、炸海鲜、烤鸡", "i": "海德公园对面老建筑里的老钱风意大利餐厅，桌子小、灯光暗、烛光点点，氛围极好。送面包和餐前奶酪小球。前菜奶油大虾意面和炸海鲜不错，主菜烤鸡好吃，牛排是纯瘦肉，口感稍差。份量足，可能吃不下提拉米苏和柠檬挞。人均约110刀，主要为氛围买单。", "dt": "2026-05-03", "ne": "Bambini Trust Restaurant & Wine Room", "xy": [736.4, 577.1], "id": 399}, {"n": "Bene & Co", "a": "McMahons Point", "t": "意大利菜", "r": "3", "p": 60, "d": "大虾意面（很辣）、杯装提拉米苏", "i": "北悉尼往海湾方向路上的意大利小店，Pizza和意面看起来都很香。大虾意面很好吃但非常辣。杯装提拉米苏很出色，绵软浓郁。两份约45刀。", "dt": "2026-05-03", "ne": "Bene & Co", "xy": [721.1, 494.3], "id": 400}, {"n": "Le Rooftop", "a": "McMahons Point", "t": "韩国女生开的小酒馆", "r": "2", "p": 50, "d": "炸菜花、牛排", "i": "北悉尼往海湾路上一位韩国女生开的小酒馆，很有情调，红木门旁的临街座位很惬意。食物中等偏上：炸菜花适合配酒，虾吐司太油，牛排很好吃，底下铺的米饭泡在酱汁里刚好。人均约50刀。", "dt": "2026-05-03", "ne": "Le Rooftop", "xy": [718.0, 491.5], "id": 401}, {"n": "卤匠麻辣鸭", "a": "Burwood", "t": "鸭货外带", "r": "3", "p": 20, "d": "鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭舌", "i": "麻辣鸭货外带店，鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭肠、鸭心和鸭舌都有。入口麻辣辛香带回甜，肉质紧实有嚼劲，非常适合追剧或配米酒。", "dt": "2026-05-01", "ne": "Lujiang Spicy Duck", "xy": [468.8, 588.5], "id": 397}, {"n": "Doyles on the Beach", "a": "Watsons Bay", "t": "海鲜/海景", "r": "3", "p": 90, "d": "海鲜、生蚝", "i": "Watsons Bay的海鲜餐厅，可以望见整个屈臣氏湾和远处CBD天际线，海面上帆船游艇点点，天气好的午后美不胜收。以海鲜为主，味道不错但偏贵，人均约90刀还不太饱，主要为景色买单。订位时记得要二楼露台。饭后可以在沙滩上玩沙晒太阳。", "dt": "2026-04-30", "ne": "Doyles on the Beach", "xy": [926.3, 488.0], "id": 396}, {"n": "Baker Bleu", "a": "Double Bay", "t": "烘焙", "r": "2", "p": 12, "d": "三明治、酸面包", "i": "富人区的人气烘焙店，克莱因蓝的店面很舒服，周末上午常排长队，要等十几分钟。整体都不错但不算惊艳。酸面包很硬，牙口不好的人慎选，三明治最值得推荐。", "dt": "2026-04-29", "ne": "Baker Bleu", "xy": [823.7, 592.5], "id": 395}, {"n": "Adhika Cafe", "a": "Rushcutters Bay", "t": "菲律宾Cafe", "r": "4", "p": 22, "d": "Ube拿铁、Ube抹茶、Ube Cake、Pandesal猪肉鸡蛋三明治", "i": "很特别的菲律宾Cafe。Ube拿铁和Ube抹茶好喝，Ube奶油绵密，杯壁晕染得像油画；Ube Cake是最佳单品。猪肉鸡蛋三明治用的Pandesal面包口感独特，是菲律宾有名的面包，店里墙上有它的介绍。", "dt": "2026-04-28", "ne": "Adhika Cafe", "xy": [784.2, 586.2], "id": 394}, {"n": "Million Chicken", "a": "Epping", "t": "韩式烤鸡", "r": "3", "p": 22, "d": "烤鸡（可选辣度，一级已很辣）、加芝士或粉耗子", "i": "Epping的韩式烤鸡店，烤鸡可选辣度，一级已经很辣。鸡肉算嫩，可以加芝士、面条和粉耗子等配菜。Rose麻辣烫偏奶。气泡饮料太甜，建议直接配啤酒。", "dt": "2026-04-26", "ne": "Million Chicken", "xy": [397.0, 260.2], "id": 392}, {"n": "Cafe Balibre", "a": "Macquarie Park", "t": "Cafe/Brunch", "r": "3", "p": 45, "d": "太阳蛋牛排、牛油果吐司、Mont Blanc Cold Brew", "i": "周末早上很火的社区Cafe，附近居民常来。牛油果吐司和太阳蛋牛排不错，牛排略柴，但三十多刀很满足。咖啡也好，Mont Blanc是Cold Brew加香草奶盖。人均约45刀。", "dt": "2026-04-26", "ne": "Cafe Balibre", "xy": [497.4, 265.9], "id": 393}, {"n": "Tailor Room", "a": "The Rocks", "t": "概念鸡尾酒吧", "r": "3", "p": 50, "d": "按布料选鸡尾酒（Cotton、皮革等）", "i": "很有意思的概念鸡尾酒吧，按不同布料对应不同风格的鸡尾酒，选皮革会得到一杯浓烈的酒，选Cotton则是一杯轻松的泡沫甜酒。空间很小，约5张小桌加6个吧台位，适合三五好友挤着聊天。", "dt": "2026-04-25", "ne": "Tailor Room", "xy": [728.5, 532.7], "id": 388}, {"n": "品粹轩", "a": "The Rocks", "t": "本帮菜", "r": "4", "p": 40, "d": "葱油鸡、响油鳝丝、咸蛋黄狮子头、黄鱼汤、炒猪肝、鱼皮饺子", "i": "The Rocks的本帮菜馆，菜式地道。葱油鸡、响油鳝丝、咸蛋黄狮子头、黄鱼汤、炒猪肝和鱼皮饺子都很好吃，有时略咸。人均约40刀，以The Rocks的位置来说很划算。", "dt": "2026-04-25", "ne": "Pin Cui Xuan", "xy": [732.1, 541.3], "id": 389}, {"n": "吾家有面 Wu's Noodle House", "a": "Chatswood（Chase斜对面）", "t": "手工面馆", "r": "3", "p": 30, "d": "肉沫茄子拌面、炒猪肝、香菜牛肉、农家一碗香", "i": "Chatswood Chase斜对面的手工面馆，面条纯手工，很适合做拌面，肉末茄子拌面尤其好吃。炒菜有好有普通，猪肝、香菜牛肉和农家一碗香不错，咸蛋黄鸡翅偏干不入味。人均约30刀。", "dt": "2026-04-25", "ne": "Wu's Noodle House", "xy": [671.5, 335.1], "id": 390}, {"n": "Mamuki", "a": "Glebe Point Rd, Glebe", "t": "日式Brunch/抹茶", "r": "2", "p": 32, "d": "刺身盖饭、三文鱼茶泡饭、饭团、创意抹茶", "i": "从Newtown开到Glebe的日式Brunch店，抹茶饮品有一整页菜单，创意很多。刺身盖饭和三文鱼茶泡饭只算及格。木质调的简约环境很舒服，饭团可以外带。", "dt": "2026-04-25", "ne": "Mamuki", "xy": [665.6, 600.3], "id": 391}, {"n": "BananaLa 香蕉小馆（已由蓝曦食堂接手）", "a": "Rhodes", "t": "湘式小炒", "r": "3", "p": 50, "d": "炒鸡、生炒肥肠、炒米粉", "i": "Rhodes居民区里的湘式小炒，现已由蓝曦食堂接手。炒鸡好吃够辣；生炒肥肠是白色的，很香；辣椒炒肉的瘦肉略柴；土匪猪肝一般。几道菜配炒米粉非常过瘾。人均约50刀。", "dt": "2026-04-24", "ne": "BananaLa (now Lanxi Kitchen)", "xy": [410.5, 433.9], "id": 387}, {"n": "春熙路北川菜馆", "a": "Ultimo", "t": "川菜（成都口味）", "r": "4", "p": 35, "d": "夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、老妈蹄花", "i": "UTS附近的成都口味川菜，辣而不过分。夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、风味百叶和老妈蹄花都好吃。鳝段量大鲜美；胸口油炒牛筋一脆一韧，口感交替，很有创意。人均约35刀，很受学生欢迎。", "dt": "2026-04-23", "ne": "Chunxi Road Sichuan", "xy": [709.6, 596.4], "id": 386}, {"n": "Little Cake Box", "a": "Broadway", "t": "蛋糕店", "r": "5", "p": 14, "d": "无花果蛋糕、双莓石榴布蕾", "i": "以季节水果蛋糕见长的蛋糕店，需要预订。季末的无花果蛋糕堆满新鲜无花果，成熟度刚好，清甜高级，非常出色。新季的双莓石榴布蕾是层叠做法，一层入口即化的法式布蕾，一层爆汁的石榴籽和酸甜树莓酱，很有趣。", "dt": "2026-04-22", "ne": "Little Cake Box", "xy": [694.7, 614.7], "id": 384}, {"n": "Pane e Prosciutto Artisan Deli & Panini Bar", "a": "Putney", "t": "意式Panini", "r": "3", "p": 18, "d": "Signature Panini（火腿腌肉加开心果酱）、辣油", "i": "最近走红的意式Panini小店，熟客很多，店员和客人寒暄热络。招牌Signature是多种火腿腌肉加开心果酱，外壳脆、内里韧，份量大，半个就很饱。店里卖的辣油拌面拌饭都好吃，值得回购。", "dt": "2026-04-22", "ne": "Pane e Prosciutto Artisan Deli & Panini Bar", "xy": [463.2, 430.9], "id": 385}, {"n": "Taste of Tuscany", "a": "Carlingford", "t": "传统西餐", "r": "3", "p": 40, "d": "大虾意面、炸Veal排配番茄酱", "i": "Eastwood和Epping一带少有人知的老式传统西餐厅，味道不错。大虾意面弹牙够味，扁平的炸小牛排配熬制番茄酱很解腻。人均约40刀。", "dt": "2026-04-21", "ne": "Taste of Tuscany", "xy": [311.0, 297.3], "id": 382}, {"n": "老细屋里", "a": "Eastwood", "t": "湘菜", "r": "5", "p": 40, "d": "辣椒炒肉、土匪猪肝、辣猪手、炒肥肠、肉饼蒸蛋、莲藕汤", "i": "Eastwood原一甲一嗦位置新开的湘菜馆，味道更好。辣椒炒肉、鸡汤、辣猪手、炒鸡胗、炒肥肠、土匪猪肝、莲藕汤和肉饼蒸蛋都值得闭眼点，人多来最好，可以多点几道。", "dt": "2026-04-21", "ne": "Lao Xi Wu Li", "xy": [402.9, 331.8], "id": 383}, {"n": "Akti", "a": "Woolloomooloo", "t": "希腊菜", "r": "3", "p": 100, "d": "Kingfish刺身、烤章鱼配Pita、半只鸡", "i": "Woolloomooloo码头新开的希腊餐厅，在老牌意大利餐厅Otto旁边，傍晚火烧云下的海湾景色非常美。前菜Kingfish刺身和烤章鱼配Pita面包很好吃。主菜半只烤鸡肉略柴，但已尽量做嫩。适合姐妹聚会和情侣约会，人均约100刀。", "dt": "2026-04-20", "ne": "Akti", "xy": [768.4, 567.2], "id": 381}, {"n": "OX LAN LanZhou Beef Noodle", "a": "Carlingford Court", "t": "兰州拉面", "r": "4", "p": 15, "d": "红烧牛肉面、炸酱面（可免费续面）", "i": "Carlingford Court的人气兰州拉面，开业初期要排长龙，现在不用排了。手工拉面一碗十几刀，还可以免费续面，续的面份量和一整碗差不多，吃不完可以打包。红烧牛肉面和炸酱面味道都好。人均约15刀，性价比极高。", "dt": "2026-04-18", "ne": "OX LAN LanZhou Beef Noodle", "xy": [314.9, 285.9], "id": 379}, {"n": "Hachioji", "a": "Crows Nest", "t": "日料Omakase", "r": "2", "p": 150, "d": "Lunch Set、午餐小Omakase", "i": "开到Crows Nest的日料Omakase，午市有Lunch Set和小份Omakase。Lunch Set份量一般，不太容易吃饱，想好好吃建议选Omakase。主厨颜值很高，在悉尼Omakase圈小有名气。", "dt": "2026-04-18", "ne": "Hachioji", "xy": [718.4, 421.2], "id": 380}, {"n": "88 Live Seafood House", "a": "Eastwood", "t": "韩式鱼生", "r": "3", "p": 55, "d": "三文鱼和虾刺身、炙烤三文鱼寿司、Pipis面汤", "i": "原大长今位置新开的韩式鱼生店。三文鱼和虾刺身非常新鲜，炙烤三文鱼寿司也不错。Pipi面汤海味浓郁，但清淡没负担。人均约55刀，值得一试。", "dt": "2026-04-11", "ne": "88 Live Seafood House", "xy": [401.5, 307.0], "id": 376}, {"n": "Lode Pies & Pastries", "a": "Rozelle（悉尼已有五家）", "t": "烘焙", "r": "3", "p": 12, "d": "牛角包", "i": "起家于Surry Hills的烘焙店，现在悉尼已有五家分店。陈列整齐有序，看着很舒服。牛角包水准稳定，非常好吃；面包以外的早餐一般。", "dt": "2026-04-11", "ne": "Lode Pies & Pastries", "xy": [634.2, 545.0], "id": 377}, {"n": "Osteria Luna", "a": "King St, CBD", "t": "意大利菜", "r": "4", "p": 100, "d": "Crudo、火腿配炸泡芙、蟹肉红酱意面", "i": "King St地下室里今年新开的意大利餐厅，是法国餐厅The Charles的姐妹店，口碑出色。食物讲究，Crudo新鲜，火腿配炸泡芙很妙，蟹肉红酱意面非常入味，酱汁会让人想把盘子舔干净。地下室有老派电影的氛围，很出片，适合约会和聚会。人均约100刀。", "dt": "2026-04-11", "ne": "Osteria Luna", "xy": [720.1, 554.6], "id": 378}, {"n": "Penny Fours", "a": "Balmain", "t": "烘焙", "r": "3", "p": 12, "d": "火腿牛角包（9.5刀）", "i": "不走网红路线但评价很高的烘焙店，多位资深吃家推荐。选择不多，风格偏西式，不刻意做亚洲Fusion口味。基础款火腿牛角包很优秀，9.5刀一个，在牛角包里不算贵。", "dt": "2026-04-10", "ne": "Penny Fours", "xy": [657.9, 532.3], "id": 375}, {"n": "Miryang Gukbap", "a": "Eastwood", "t": "韩国汤饭", "r": "3", "p": 40, "d": "猪肉汤饭加面条、生拌和牛", "i": "Eastwood韩国街的汤饭店，早上八点开门，上午十一点就可能要等半小时。猪肉汤饭加小虾米和辣酱很好吃，暖身，可以另加面条。生拌和牛份量很大，加一颗生鸡蛋拌起来更好。血肠可以不点。人均约40刀。", "dt": "2026-04-03", "ne": "Miryang Gukbap", "xy": [385.0, 327.2], "id": 374}, {"n": "三顾冒菜", "a": "Burwood", "t": "冒菜", "r": "3", "p": 30, "d": "香辣干拌、牛油冒菜（很辣）、番茄汤底、鞭炮笋", "i": "Burwood新开的冒菜馆，食材新鲜，选择很多。香辣干拌、牛油冒菜和番茄汤底都可选，牛油冒菜非常辣，不太能吃辣的人慎选。鞭炮笋一定要加。米饭和冰粉任吃，米饭香软，盖上冒菜很好吃。人均30刀以内。", "dt": "2026-04-02", "ne": "Sangu Maocai", "xy": [446.5, 587.8], "id": 372}, {"n": "Eleven Barrack", "a": "Barrack St, CBD", "t": "西餐", "r": "3", "p": 110, "d": "吞拿鱼刺身、炸小面团、虾挞、牛排、海鲜意面", "i": "Bentley集团旗下的西餐厅，天花板很高，三角钢琴和整面酒墙，富丽堂皇。前菜吞拿鱼刺身、炸小面团和虾挞都不错，主菜牛排和海鲜意面很出色。适合约会和姐妹聚餐，人均约110刀。", "dt": "2026-04-02", "ne": "Eleven Barrack", "xy": [726.9, 583.0], "id": 373}, {"n": "Frankie's Food Factory", "a": "Glenhaven", "t": "花园Cafe", "r": "3", "p": 40, "d": "Salmon Taco、炸鱿鱼圈、Pork Ribs", "i": "开在苗圃人工湖边的花园Cafe，进店要先经过花店，湖边可以喂鸭子。食物水准不低，Salmon Taco、炸鱿鱼圈和Pork Ribs都好吃，份量大。适合一家老小周末来，长辈可以逛苗圃。人均约40刀。", "dt": "2026-03-30", "ne": "Frankie's Food Factory", "xy": [184.2, 47.5], "id": 370}, {"n": "Luca Bakery", "a": "Castle Hill", "t": "烘焙", "r": "X", "p": 12, "d": "巧克力Hot Cross Bun", "i": "山区老旧社区Plaza里的烘焙店，品种很多。复活节季的巧克力Hot Cross Bun闻着很香，但面包口感奇怪，巧克力味也不足，整体不推荐。", "dt": "2026-03-30", "ne": "Luca Bakery", "xy": [173.5, 131.4], "id": 371}, {"n": "Flaminia", "a": "Circular Quay", "t": "意大利菜", "r": "4", "p": 110, "d": "Kingfish、带子刺身、撒丁岛炸海鲜、热那亚海鲜大管面、西西里烤大虾", "i": "新开的意大利餐厅，菜单按意大利城市分区，每个城市都有自己的特色前菜、Pasta、主菜和甜品，吃一餐像游历意大利。吧台有新鲜刺身，Kingfish和带子都好。撒丁岛卡利亚里的炸海鲜、北意热那亚的海鲜大管面和西西里巴勒莫的烤大虾都很有趣。傍晚还能看到晚霞。人均约110刀。", "dt": "2026-03-28", "ne": "Flaminia", "xy": [743.8, 536.2], "id": 369}, {"n": "Jōji", "a": "George St, CBD", "t": "天台酒吧餐厅", "r": "4", "p": 70, "d": "Beef Tartare、Bug & Prawn Sando、Wagyu Skewer、Spatchcock、Taco Icecream Mochi", "i": "景色很好的天台酒吧餐厅，露台位能看到城市从午后到入夜的变化。食物出乎意料地好吃，Beef Tartare、Bug & Prawn Sando、Wagyu Skewer、Spatchcock和Taco冰淇淋麻薯都值得点。很适合边喝酒边吹风聊天，也适合庆生。", "dt": "2026-03-24", "ne": "Jōji", "xy": [741.5, 556.6], "id": 367}, {"n": "百留记", "a": "Chatswood（Chase对面）", "t": "麻辣拌/香锅/炸串", "r": "3", "p": 30, "d": "麻辣拌（多麻酱加方便面）、麻辣香锅、炸串", "i": "麻辣拌、麻辣香锅和炸串都做得不错的小店。食材区干净整洁，选择多。麻辣拌麻酱给得多，方便面黏糊过瘾；麻辣香锅炒得很香，很下饭；炸串撒料也好。人均约30刀，很实惠，拌粉也值得一试。", "dt": "2026-03-24", "ne": "Bailiuji", "xy": [649.1, 334.3], "id": 368}, {"n": "Coffee DRS", "a": "Hornsby", "t": "咖啡", "r": "2", "p": 5, "d": "Cold Brew", "i": "Hornsby Westfield旁的咖啡店，有自家烘焙的咖啡豆品牌，店里摆着很多可爱的小清新杂货。Cold Brew非常苦，小杯份量很大，只要5刀，很实惠。", "dt": "2026-03-21", "ne": "Coffee DRS", "xy": [444.7, 41.2], "id": 364}, {"n": "Jenny's Dumpling", "a": "Westfield Hornsby（美食广场）", "t": "饺子馄饨早餐", "r": "3", "p": 20, "d": "鲜肉小馄饨、爆汁锅贴、卤肘子、凉拌土豆丝", "i": "Hornsby Westfield美食广场的早餐店，饺子、锅贴和馄饨都是现包的。鲜肉小馄饨热乎舒服，锅贴一咬就爆汁。凉菜卤肘子和凉拌土豆丝都出色，肘子皮滑肉嫩、胶质满满。人均约20刀。", "dt": "2026-03-21", "ne": "Jenny's Dumpling", "xy": [441.7, 38.4], "id": 365}, {"n": "Meisterstück", "a": "Clarence St, CBD（Machine Hall入口）", "t": "咖啡", "r": "2", "p": 10, "d": "特调咖啡", "i": "市中心新活动场地Machine Hall入口处的咖啡店，空间空旷简约。特调咖啡本身好喝，但奶盖很浓。店里角落藏着很多小狗玩偶，可以找一找。", "dt": "2026-03-21", "ne": "Meisterstück", "xy": [712.0, 566.5], "id": 366}, {"n": "Salumerie", "a": "King St, CBD", "t": "意式三明治", "r": "3", "p": 18, "d": "Lick Your Focaccia", "i": "Potts Point的意式三明治店，柜台现切佛卡夏、现片火腿、现涂酱料，常有人排队。可以试试名字有趣的Lick Your Focaccia。", "dt": "2026-03-20", "ne": "Salumerie", "xy": [741.3, 579.5], "id": 362}, {"n": "King Clarence", "a": "Clarence St, CBD", "t": "亚洲融合", "r": "3", "p": 60, "d": "炸鱼包、Dry Aged Duck、煲仔饭", "i": "King St和Clarence St交界处的亚洲融合餐厅，属于Bentley集团。口味浓油赤酱，喜欢重口的人会喜欢，有人可能会觉得偏咸偏油。炸鱼包很嫩，Dry Aged Duck很香，煲仔饭有锅巴。人均约60刀。", "dt": "2026-03-20", "ne": "King Clarence", "xy": [728.1, 549.3], "id": 363}, {"n": "Amibun", "a": "接龙配送（无门店位置）", "t": "烘焙工坊", "r": "4", "p": 12, "d": "黑森林酵吐、咸蛋黄芋泥肉松恰巴塔、烧椒鸡肉恰巴塔、番茄猪肉肉松吐司", "i": "近来很受追捧的烘焙工坊，靠社群接龙预订，名额常要抢。", "dt": "2026-03-19", "ne": "Amibun", "xy": null, "id": 361}, {"n": "Ray's Place", "a": "North Willoughby", "t": "老牌Cafe", "r": "3", "p": 22, "d": "自选组合Big Breakfast", "i": "开了近60年的老牌Cafe，深受附近居民喜爱。其他菜式普通，最值得点的是自选Big Breakfast，面包、酱料、肉类、蔬菜和配菜都可以自由搭配，例如土耳其面包一半配花生酱、一半配烟熏三文鱼。", "dt": "2026-03-18", "ne": "Ray's Place", "xy": [705.3, 345.4], "id": 358}, {"n": "巴适江湖菜", "a": "Burwood（亦有Zetland店）", "t": "自贡菜", "r": "3", "p": 40, "d": "火爆爽脆、呛锅鳝丝、渣渣牛肉、干煸肥肠", "i": "从Zetland开到Burwood的自贡菜，辣度极高。火爆爽脆、呛锅鳝丝、渣渣牛肉和干煸肥肠都很够味，渣渣牛肉辣得像直接嚼辣椒。爱吃辣的人一定要来挑战，不太能吃辣的人要有心理准备。", "dt": "2026-03-18", "ne": "Bashi Jianghu Cuisine", "xy": [463.4, 604.3], "id": 359}, {"n": "牛百岁 Mr Fu's Kitchen", "a": "Eastwood Plaza", "t": "红烧牛排骨/羊肉", "r": "4", "p": 40, "d": "红烧牛排骨、红烧带皮黑草羊（38.4刀大盆）、红烧牛排饭12.8刀", "i": "价格很良心的红烧菜馆。38.4刀的红烧牛排骨和红烧带皮黑草羊都是大大一盆；12.8刀的红烧牛排饭像十年前的物价，米饭泡在汤汁里非常好吃。外带用的是可以直接明火加热的容器，很贴心。", "dt": "2026-03-18", "ne": "Mr Fu's Kitchen", "xy": [411.9, 323.2], "id": 360}, {"n": "Caraway", "a": "Burwood", "t": "韩式Cafe", "r": "3", "p": 30, "d": "炸鸡华夫饼、枫糖浆Cold Brew", "i": "Burwood排屋里新开的韩式Cafe，装修简单。炸鸡华夫饼的辣酱很辣，配甜华夫饼刚好，炸鸡蘸溏心蛋液更香。枫糖浆Cold Brew清甜。人均约30刀。", "dt": "2026-03-16", "ne": "Caraway", "xy": [462.0, 579.5], "id": 357}, {"n": "Charcoal & Crisp Lechon", "a": "Crows Nest", "t": "菲律宾菜", "r": "2", "p": 25, "d": "蒜蓉烤排骨、脆皮猪五花", "i": "Crows Nest少有人知的菲律宾烤肉店，以烤和炸为主。蒜蓉烤排骨比招牌脆皮猪五花好吃，猪五花肥肉偏多，不如广式烧肉。店里也卖Ube紫山药蛋糕，店员很诚实，放久了的不会卖。", "dt": "2026-03-15", "ne": "Charcoal & Crisp Lechon", "xy": [716.0, 440.6], "id": 356}, {"n": "Bay Brew Cafe", "a": "Waverton", "t": "Cafe", "r": "4", "p": 22, "d": "炸鸡Pancake", "i": "下北区的海湾景观Cafe，门口就能看到港湾，多是附近居民光顾。炸鸡Pancake很有创意，炸鸡嫩到爆汁，和Pancake意外地搭。其他菜式也都不错，饭后可以沿港湾散步。", "dt": "2026-03-14", "ne": "Bay Brew Cafe", "xy": [705.3, 469.0], "id": 354}, {"n": "Chez Beckett's", "a": "Chippendale", "t": "法餐", "r": "4", "p": 100, "d": "草莓鹅肝、Kingfish刺身、烤大虾、鸭腿、牛排（39刀）、桌前火焰可丽饼", "i": "很有氛围的法餐厅。前菜草莓鹅肝、Kingfish刺身和Beef Tartare都好，草莓的酸甜正好化解鹅肝的腻。主菜烤大虾、鸭腿和牛排都很出色，牛排只要39刀，非常划算。甜品是桌边现场制作的火焰可丽饼，很有仪式感。适合约会和姐妹聚会，人均约100刀。", "dt": "2026-03-14", "ne": "Chez Beckett's", "xy": [708.4, 626.9], "id": 355}, {"n": "Berto's Espresso", "a": "Surry Hills", "t": "早餐Cafe", "r": "3", "p": 22, "d": "English Muffin（酸黄瓜滑蛋意大利香肠）、Cold Brew", "i": "评分4.8的街角早餐店，店里店外坐满了人。几乎每桌都点的English Muffin夹酸黄瓜、滑蛋和意大利香肠，很满足。Cold Brew也不错。", "dt": "2026-03-12", "ne": "Berto's Espresso", "xy": [734.5, 630.7], "id": 350}, {"n": "Pan Divino", "a": "Surry Hills", "t": "意大利菜", "r": "3", "p": 60, "d": "Beef Tartare、Snapper刺身、海鲜意面、柠檬里的阿尔玛菲Sorbet、提拉米苏", "i": "街角的意大利小馆，满墙画作，服务生热情，很有情调。前菜Beef Tartare和Snapper刺身、主菜海鲜意面和牛排都不错。甜品最惊喜，阿马尔菲柠檬Sorbet装在整颗柠檬里，提拉米苏绵软。人均约60刀。", "dt": "2026-03-12", "ne": "Pan Divino", "xy": [750.4, 617.1], "id": 351}, {"n": "New Star Kebab Family Restaurant", "a": "Auburn", "t": "土耳其菜", "r": "4", "p": 30, "d": "羊肉糜烤串、鸡肉烤串、Kiymali Pide", "i": "Auburn的土耳其快餐店，值得专程去。羊肉糜烤串和鸡肉烤串用大饼卷着辣椒、蘸蒜酱吃，非常满足。Kiymali Pide类似羊肉薄饼，焦香可口，也必点。", "dt": "2026-03-12", "ne": "New Star Kebab Family Restaurant", "xy": [271.1, 503.8], "id": 352}, {"n": "金兰大碗牛肉面 Golden Lan Beef Noodles", "a": "Auburn", "t": "牛肉面", "r": "3", "p": 18, "d": "酸菜牛肉面、炸酱面", "i": "手工牛肉面馆，面条粗细不太均匀，很有原生态感，份量大，一碗够分两顿。酸菜牛肉面和炸酱面都不错，吃完不口渴。", "dt": "2026-03-12", "ne": "Golden Lan Beef Noodles", "xy": [268.0, 501.0], "id": 353}, {"n": "Delisia Panino & Espresso", "a": "Forest Lodge", "t": "意式Panini", "r": "5", "p": 18, "d": "Melon Panini（蜜瓜火腿）、Crema", "i": "马路边的意式Panini店，非常好吃。招牌Melon用蜜瓜搭配火腿，蜜瓜的甜、火腿的咸香和面包的韧劲结合得清爽又夏天。份量大，半份就饱。店里的Crema像半融化的巧克力咖啡雪糕，大热天很适合。", "dt": "2026-03-10", "ne": "Delisia Panino & Espresso", "xy": [657.9, 602.0], "id": 349}, {"n": "Altitude", "a": "Shangri La Sydney（36楼）", "t": "景观Fine Dining", "r": "3", "p": 160, "d": "三道菜Set Menu", "i": "香格里拉酒店36楼的景观Fine Dining，景色无敌。天花板有一面镜子倒映窗外景色，背对窗户也能看到风景，很有巧思。三道菜Set Menu都好吃但不惊艳。人均约160刀，景色值这个价。适合约会和姐妹聚会。", "dt": "2026-03-09", "ne": "Altitude", "xy": [735.9, 529.8], "id": 347}, {"n": "Blu Bar on 36", "a": "Shangri La Sydney", "t": "景观酒吧", "r": "2", "p": 60, "d": "鸡尾酒", "i": "香格里拉酒店36楼的景观酒吧，很多人专门来看夜景。但酒吧灯光倒映在落地窗上，窗外景色几乎看不清，体验不如预期。", "dt": "2026-03-09", "ne": "Blu Bar on 36", "xy": [723.5, 536.9], "id": 348}, {"n": "The Winery", "a": "Surry Hills", "t": "花园Pub", "r": "2", "p": 45, "d": "蟹肉波浪面", "i": "Surry Hills的花园Pub，郁郁葱葱，夏日午后阳光柔和，很有意境。食物是一般的Pub Food，蟹肉波浪面好吃。两道菜午餐45刀，很划算。", "dt": "2026-03-06", "ne": "The Winery", "xy": [728.1, 616.3], "id": 343}, {"n": "San Java 2.0", "a": "Surry Hills", "t": "抹茶店", "r": "3", "p": 10, "d": "冰抹茶（菜单外）、提拉米苏", "i": "新晋的抹茶店，菜单外的冰抹茶是纯抹茶，甘苦浓烈，青草味很足。Mocha Latte偏奶。提拉米苏也值得一试。", "dt": "2026-03-06", "ne": "San Java 2.0", "xy": [745.0, 632.9], "id": 344}, {"n": "Paramount Coffee Project", "a": "Surry Hills", "t": "Cafe/Brunch", "r": "2", "p": 32, "d": "炸鸡华夫饼、牛油果吐司", "i": "仓库改造的人气Cafe，工作日和周末都满座，空间里有咖啡店、各种小店和露台，绿植很多。炸鸡华夫饼和牛油果吐司好吃，
