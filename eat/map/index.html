烤肉", "r": "2", "p": 65, "a": "West Ryde", "d": "和牛、下酒菜", "i": "以备长炭为名的日式烤肉店。其中一盘和牛的雪花纹理过于规整，疑似注脂肉，点和牛时可以留意。其余菜式不错，老板热情，会送下酒小菜。人均约65刀。", "ne": "Binchotan", "lon": 151.08565, "lat": -33.80453}, {"n": "不二烫捞", "t": "麻辣烫/肠粉", "r": "3", "p": 22, "a": "Wentworth Point", "d": "加蛋加猪肉肠粉", "i": "Wentworth Point的麻辣烫店，新增广式肠粉。加蛋加猪肉肠粉皮薄透亮，现蒸现做，猪肉馅嫩滑，蛋香足。酱汁只是普通酱油，层次不够，是小遗憾。", "ne": "Bu Er Malatang", "lon": 151.07383, "lat": -33.82713}, {"n": "上海小馄饨", "t": "上海点心", "r": "4", "p": 20, "a": "Ryde（Top Ryde对面）", "d": "小馄饨、小笼包、锅贴", "i": "Top Ryde商场对面低调的上海点心店，现包现煎现煮，开放式厨房干净透明。小馄饨皮薄馅嫩，汤底只放紫菜和虾皮就很鲜；小笼包皮薄汤多，先吸汤再吃，小心烫；锅贴底部金黄酥脆，配店里的辣酱很好吃。值得一去。", "ne": "Shanghai Wontons", "lon": 151.10621, "lat": -33.81583}, {"n": "Winghaus", "t": "鸡翅/体育酒吧", "r": "3", "p": 30, "a": "Entertainment Quarter", "d": "Mango Habanero鸡翅", "i": "鸡翅体育酒吧，几十台电视同步直播各种球赛，看球氛围很好。Mango Habanero口味果香清甜，几乎不辣，鸡翅外皮焦香，肉质嫩。适合球迷和鸡翅爱好者。", "ne": "Winghaus", "lon": 151.22598, "lat": -33.89299}, {"n": "朝阳 Chaoyang Delicious", "t": "北京菜", "r": "4", "p": 25, "a": "Wentworth Point（华超内）", "d": "卤煮火烧、千层肉饼、豌豆黄、糖火烧", "i": "藏在华人超市里的北京菜，很低调，店里满是京腔。卤煮火烧的肥肠、猪肉和豆腐泡炖得入味不腻，火烧吸满汤汁；千层肉饼外皮酥脆、层次分明、肉香十足。甜品豌豆黄细腻不齁甜，糖火烧外焦里软。人均约25刀。", "ne": "Chaoyang Delicious", "lon": 151.0752, "lat": -33.82984}, {"n": "Mary's", "t": "炸鸡", "r": "5", "p": 20, "a": "Entertainment Quarter（Newtown也有）", "d": "炸鸡", "i": "起家于Newtown地下酒吧的炸鸡名店，换了地点依然出色。外皮酥到掉渣，里面鸡汁爆开，连鸡胸肉都不柴，堪称灌汤炸鸡，外皮香料咸香美式。比KFC贵一些，但值得。", "ne": "Mary's", "lon": 151.22484, "lat": -33.89214}, {"n": "Oh Boo Chocolates", "t": "巧克力", "r": "3", "p": 15, "a": "Barangaroo", "d": "自选巧克力礼盒（每颗3至4刀）", "i": "高级海滨街道上低调的巧克力店，全店深蓝色，很好看。可以自选礼盒，一颗约3到4刀，精致得像艺术品，适合送礼。", "ne": "Oh Boo Chocolates", "lon": 151.19984, "lat": -33.86112}, {"n": "Epicurean", "t": "自助餐", "r": "4", "p": 105, "a": "Crown Sydney", "d": "生蚝、鸭腿、三文鱼腩、甜品", "i": "Crown酒店的自助餐，景色很好。生蚝、鸭腿、三文鱼腩和甜品都不错，选择多，小朋友也会很开心。午市成人105刀，周末145刀，12岁以下半价，午市来最划算。", "ne": "Epicurean", "lon": 151.20121, "lat": -33.86383}, {"n": "Frankie Cadillac", "t": "酒吧", "r": "3", "p": 45, "a": "Surry Hills", "d": "鸡尾酒", "i": "路边的小酒吧，墙上挂满油画，氛围高雅又带点阴森，往里走是灯光四射的吧台。菜单注解很可爱。鸡尾酒还行，蛋糕不好吃，来喝酒就好。", "ne": "Frankie Cadillac", "lon": 151.21067, "lat": -33.88034}, {"n": "Bessie's & Alma's", "t": "现代酒馆", "r": "4", "p": 105, "a": "Surry Hills", "d": "葱油饼、烤大虾、吞拿鱼薯饼、煎无骨鸡、煎鱼", "i": "Bar Copains的姐妹店，现代酒馆风格，灯光昏暗，吧台热闹，开放式厨房很忙碌。葱油饼、烤大虾、吞拿鱼薯饼、煎无骨鸡和煎鱼都好吃，鸡肉嫩得惊人，吞拿鱼刺身配薯饼很有趣。整体偏咸，适合配酒。适合约会和姐妹小聚，人均约105刀。", "ne": "Bessie's & Alma's", "lon": 151.20653, "lat": -33.89047}, {"n": "Kumadon 熊吞", "t": "日式盖饭", "r": "3", "p": 15, "a": "Westfield Chatswood美食广场", "d": "安格斯牛肉粒Don加饮料", "i": "Chatswood Westfield美食广场的日式盖饭，安格斯牛肉粒盖饭加一杯饮料只要14.8刀，牛肉烧得嫩，份量足，性价比很高。", "ne": "Kumadon", "lon": 151.1881, "lat": -33.7962}, {"n": "Fiore Sandwich", "t": "三明治", "r": "3", "p": 10, "a": "Barrack Place, CBD", "d": "Mortadella三明治", "i": "简单的西式三明治店，Mortadella三明治是汉堡造型，带籽硬面包夹火腿片和芝士，健康又好吃。一个10刀，适合工作日午餐。", "ne": "Fiore Sandwich", "lon": 151.21082, "lat": -33.86348}, {"n": "Firegrill", "t": "西餐", "r": "2", "p": 100, "a": "Barrack Place, CBD", "d": "赠送南瓜汤和面包", "i": "市中心Barrack Place的西餐厅，两层楼高的水晶吊灯像宫殿一样，略显浮夸。食物在平均线以上，每桌送南瓜汤和面包。人均约100刀，适合商务午餐。", "ne": "Firegrill", "lon": 151.19953, "lat": -33.87099}, {"n": "Tessuto", "t": "意式咖啡", "r": "2", "p": 10, "a": "York St, CBD", "d": "开心果Espresso", "i": "市中心写字楼下的意式咖啡馆，墙上插画和吧台上的柠檬都很有南意风情。开心果Espresso杯口沾满果仁碎，但非常苦。", "ne": "Tessuto", "lon": 151.21424, "lat": -33.87178}, {"n": "福恩手作中式糕点", "t": "中式糕点", "r": "4", "p": 10, "a": "Eastwood（乐购门口）", "d": "蛋黄酥、芋泥酥、松仁豆沙、鲜肉月饼", "i": "超市门口的小糕点柜台，产品不多，常常快卖完。蛋黄酥、芋泥酥、松仁豆沙和鲜肉月饼都很好吃，用空气炸锅加热5分钟，酥皮一碰就掉，馅料厚实，一颗能顶一顿早饭。", "ne": "Fu En Handmade Chinese Pastries", "lon": 151.07653, "lat": -33.79547}, {"n": "Mansun Pocha", "t": "韩式鱼生", "r": "3", "p": 50, "a": "Eastwood", "d": "65刀刺身拼盘、芝士玉米、烤三文鱼寿司", "i": "Eastwood的韩式鱼生店，配泡菜、紫苏叶、紫菜、辣蒜酱和麻油，可以自由组合。65刀刺身拼盘很新鲜，芝士玉米和烤三文鱼寿司也不错。人均约50刀，能吃很饱。", "ne": "Mansun Pocha", "lon": 151.08812, "lat": -33.7902}, {"n": "257私房菜", "t": "上海菜", "r": "3", "p": 40, "a": "Eastwood", "d": "咸蛋黄狮子头、小笼包、红油抄手、砂锅活鱼、黑芝麻圆子", "i": "人气稳定的上海菜馆，订位很严格，迟到超过5分钟就不留位，周末晚上非常满。咸蛋黄狮子头、小笼包、红油抄手、咕噜肉和砂锅活鱼都好吃，活鱼汤尤其值得点。甜品黑芝麻流心汤圆很好吃。食材新鲜，价格合适。", "ne": "257 Private Kitchen", "lon": 151.07497, "lat": -33.78752}, {"n": "Hungry Paulie 愛呷囝仔", "t": "台湾菜", "r": "3", "p": 30, "a": "Eastwood", "d": "麻辣鸭血臭豆腐、金衣苦瓜、卤肉饭、蛋饼、饭团", "i": "适合点外卖的台湾菜。麻辣鸭血臭豆腐非常够味；金衣苦瓜很好吃；卤肉饭、蛋饼、炒米粉和饭团都稳定，卤肉饭不如禚家和福利社。人均约30刀。", "ne": "Hungry Paulie", "lon": 151.08265, "lat": -33.79708}, {"n": "Gacha Cafe", "t": "日式甜品", "r": "3", "p": 14, "a": "George St, CBD", "d": "芒果绵绵冰、冰淇淋大福", "i": "悉尼较早做冰淇淋大福的日式甜品店，后来增加了绵绵冰、饭团和樱花系列。芒果绵绵冰入口即化，芒果味浓，甜而不腻。店内外各有一整面扭蛋机墙，小朋友会很喜欢。", "ne": "Gacha Cafe", "lon": 151.20387, "lat": -33.86276}, {"n": "金唐海鲜酒家", "t": "粤菜酒楼", "r": "5", "p": 55, "a": "Crown Sydney", "d": "龙虾三吃、清蒸星斑、雪蟹、鲍鱼、XOPP、奶黄月饼", "i": "老牌高档粤菜酒楼，适合宴请。龙虾三吃鲜甜弹牙，雪蟹肉细嫩，清蒸星斑火候极好、酱油讲究，白灼鲍鱼Q弹。乳鸽、XO酱炒Pipi和和牛也都出色。现烤奶黄流心月饼是压轴甜品，外皮酥香，内馅流心。", "ne": "Golden Century Seafood Restaurant", "lon": 151.20265, "lat": -33.8602}, {"n": "南洋茶室", "t": "南洋菜", "r": "3", "p": 17, "a": "Liverpool St, CBD", "d": "海南鸡、炒粿、Kaya Toast配半熟蛋", "i": "南洋风味小馆。海南鸡够嫩；炒粿过关，换成萝卜糕会更好；Kaya Toast和半熟蛋非常成功。人均约17刀，非常划算。", "ne": "Nanyang Tea Room", "lon": 151.20421, "lat": -33.87548}, {"n": "Order Lemon", "t": "手打柠檬茶", "r": "3", "p": 9, "a": "Eastwood", "d": "茯砖茶柠檬茶、鸭屎香柠檬茶、雨林茉莉柠檬茶", "i": "Eastwood的手打柠檬茶店，鲜切、手锤、冰摇，现场制作，看店员锤柠檬很解压，店里满是柠檬香。新品用了小众的茯砖茶。推荐鸭屎香柠檬茶、雨林茉莉柠檬茶和小红袍爆柠茶。", "ne": "Order Lemon", "lon": 151.08481, "lat": -33.78547}, {"n": "Ramen Goku", "t": "日式拉面", "r": "2", "p": 20, "a": "Glebe Point Rd, Glebe", "d": "Hakata Tonkotsu、煎饺", "i": "Glebe Point Rd上日本人经营的拉面店，食客也多是日本人。博多豚骨拉面和煎饺好吃但平平无奇。价格很实惠，人均20刀以内，有集点卡，消费满9刀累计20次可换一碗免费拉面。", "ne": "Ramen Goku", "lon": 151.18411, "lat": -33.88207}, {"n": "Gleebooks 书店咖啡厅", "t": "书店咖啡", "r": "3", "p": 15, "a": "Glebe", "d": "冰摩卡", "i": "Glebe很有氛围的独立书店，适合慢慢逛上一两个小时。", "ne": "Gleebooks", "lon": 151.19015, "lat": -33.87775}, {"n": "El Camino Cantina", "t": "墨西哥菜", "r": "3", "p": 35, "a": "Moore Park", "d": "Nachos、Pink Lemonade", "i": "墨西哥风情浓厚的餐厅，霓虹灯、骷髅元素、复古海报和热辣音乐，很热闹。Nachos超大一盘，玉米片酥脆，铺满融化芝士、豆泥和牛油果。Pink Lemonade酸甜清爽。", "ne": "El Camino Cantina", "lon": 151.22621, "lat": -33.89482}, {"n": "Sappho Books, Cafe & Bar", "t": "书店咖啡", "r": "3", "p": 15, "a": "Glebe", "d": "咖啡", "i": "Glebe街角的二手书店兼咖啡酒吧，像时光机一样充满旧时光的氛围。", "ne": "Sappho Books, Cafe & Bar", "lon": 151.18167, "lat": -33.87753}, {"n": "来一串（Eastwood夜市）", "t": "炸串/夜市", "r": "3", "p": 20, "a": "Eastwood台湾夜市", "d": "炸串；同夜市Sip&Snack普洱奶茶、甜辣鸭热卤鸭肠", "i": "连锁炸串品牌来一串在Eastwood夜市的摊位，好吃但不算惊艳，市中心电影院那家更好，也不如Chatswood的夸父炸串。", "ne": "Lai Yi Chuan (Eastwood night market)", "lon": 151.07353, "lat": -33.79298}, {"n": "The Lobo", "t": "地下朗姆酒吧", "r": "4", "p": 50, "a": "Clarence St, CBD", "d": "Old Grogram火焰朗姆鸡尾酒", "i": "市中心很有戏剧感的地下朗姆酒吧，以古巴糖业大亨Julio Lobo命名。走下螺旋楼梯，深色木家具、藤椅、红色皮沙发和烛光营造出加勒比风情。有300多款朗姆酒，推荐火焰点燃的Old Grogram鸡尾酒，视觉效果十足。", "ne": "The Lobo", "lon": 151.21447, "lat": -33.86576}, {"n": "Letra House", "t": "西班牙Tapas", "r": "3", "p": 60, "a": "Kent St, CBD（Palazzo Salato地下）", "d": "红虾Tostadas、咸鱼奶酪甜甜圈、煎火腿、牛排", "i": "藏在Palazzo Salato地下一层的人气西班牙酒馆，灯光昏黄，音乐轻柔。Tapas选择多：红虾Tostadas是生腌红虾配脆玉米饼，鲜甜爆汁；咸奶酪甜甜圈甜咸交织；煎火腿和牛排份量大，配酸辣泡椒。整体偏咸。", "ne": "Letra House", "lon": 151.1987, "lat": -33.86718}, {"n": "Black Star Pastry", "t": "烘焙", "r": "3", "p": 12, "a": "Rosebery", "d": "与金唐联名XO Pipi Pie", "i": "知名烘焙店Black Star和金唐海鲜酒家合作的限定Pie，灵感来自XO酱炒Pipi，由粤菜师傅炒制带子和大虾内馅，包在金黄酥脆的千层酥皮里，配炸面条、青葱和XO酱，是很成功的中西融合。", "ne": "Black Star Pastry", "lon": 151.20402, "lat": -33.91802}, {"n": "Mentmore and Morley", "t": "菲律宾Cafe", "r": "4", "p": 22, "a": "Rosebery", "d": "Beef Short Ribs、炭烤鸡", "i": "近来小火的菲律宾Cafe，一早就有烤肉。Beef Short Ribs好吃，烤鸡炭香浓郁、皮脆肉嫩，蘸辣酱更好。还有菲律宾猪手和脆皮五花肉等菜式。", "ne": "Mentmore and Morley", "lon": 151.20284, "lat": -33.91713}, {"n": "Sydney Tuna", "t": "韩式金枪鱼刺身", "r": "5", "p": 37, "a": "Lidcombe", "d": "九宫格蓝鳍金枪鱼刺身（110刀）", "i": "Lidcombe韩式鱼生街上的金枪鱼专门店，招牌是九宫格蓝鳍金枪鱼刺身，从赤身到中腹、大腹，每格一个部位，切得厚实新鲜，大腹入口即化，有时还会送稀有的金枪鱼背。一套110刀，附带泡菜、芝士玉米、鱼饼乌冬和手握寿司，够三人吃饱。人均约37刀，性价比极高。", "ne": "Sydney Tuna", "lon": 151.04601, "lat": -33.86093}, {"n": "Cardea", "t": "剧场式酒吧餐厅", "r": "3", "p": 100, "a": "Barangaroo", "d": "龙虾卷、牛排、西班牙小土豆、生蚝", "i": "怀旧奢华的剧场式酒吧餐厅，红色天鹅绒沙发、璀璨吊灯和复古家具，像三十年代的夜上海。每晚有不同主题的现场演出，例如爵士乐。食物融合多国风味，龙虾卷、牛排、西班牙小土豆和生蚝都不错。人均约100刀，吃喝加看演出，也很出片。", "ne": "Cardea", "lon": 151.1979, "lat": -33.86244}, {"n": "Bottega Coco", "t": "意大利甜品/Pizza", "r": "3", "p": 30, "a": "Barangaroo", "d": "歌剧院造型巧克力蛋糕、芒果慕斯、天鹅蛋糕", "i": "意大利甜品和Pizza店，晚上九点还满座，Pizza炉一直火力全开。招牌是悉尼歌剧院造型的蛋糕，外壳是硬巧克力，敲开里面是巧克力慕斯和椰丝。芒果慕斯和天鹅蛋糕也不错。甜品加茶人均约30刀。", "ne": "Bottega Coco", "lon": 151.20394, "lat": -33.86358}, {"n": "Besuto", "t": "Omakase", "r": "4", "p": 300, "a": "Circular Quay", "d": "和牛、牙鱼、茶碗蒸、木盒刺身", "i": "隐藏在地下酒吧后面的Omakase，入口很隐蔽。共5道菜、6贯寿司、一份汤和一份甜品，能吃饱。前面的和牛、牙鱼、茶碗蒸和木盒刺身尤其出色，食材不算顶级，但技术和摆盘过关。主厨现在态度友善。每人250刀，含酒水人均约300刀。", "ne": "Besuto", "lon": 151.21394, "lat": -33.86257}, {"n": "Ramen Shogun", "t": "日式拉面", "r": "4", "p": 30, "a": "Ultimo", "d": "炸鸡排盖饭、豚骨拉面、饺子、烧鸟串", "i": "低调但很好吃的日式拉面店。炸鸡排盖饭超脆超嫩；豚骨拉面浓郁不腻，吃完不口渴；饺子爆汁；烧鸟串大串嫩滑，大葱清甜。蔬菜天妇罗偏油。人均约30刀，份量大。", "ne": "Ramen Shogun", "lon": 151.19494, "lat": -33.88046}, {"n": "Pho Co", "t": "越南粉", "r": "3", "p": 30, "a": "Eastwood", "d": "和牛牛肉粉、甘蔗虾、香茅猪排", "i": "Eastwood开了多年的越南粉店，在竞争激烈的街上屹立不倒。和牛牛肉粉不错，还有儿童份量。甘蔗虾和香茅猪排值得点。人均约30刀。", "ne": "Pho Co", "lon": 151.08823, "lat": -33.79377}, {"n": "Soban by Joseon", "t": "韩国釜饭", "r": "3", "p": 30, "a": "Olympic Park（火车站旁）", "d": "安格斯牛肉釜饭、炸虾、提拉米苏", "i": "火车站旁新开的韩国釜饭，只在周日营业，常要排一小时，鱼饭和章鱼饭容易售罄。安格斯牛肉釜饭非常嫩且入味，配小菜包进紫菜吃很好。一份很大，两个女生可以分。炸虾硕大弹牙，饺子一般，提拉米苏很软很好吃。", "ne": "Soban by Joseon", "lon": 151.069, "lat": -33.84701}, {"n": "东街口鲜捞面馆", "t": "福建面馆", "r": "3", "p": 20, "a": "Hurstville", "d": "麻酱拌面、拌粉、炸鸡排、炸馄饨、炖汤", "i": "Hurstville的福建面馆，被不少人列为当地必吃，合南方人口味又便宜。麻酱拌面和拌粉很香；炸鸡排和炸馄饨酥脆；炖汤套餐养生。人均约20刀，份量足。", "ne": "Dongjiekou Noodle House", "lon": 151.10199, "lat": -33.967}, {"n": "Kafe Washoku", "t": "日料", "r": "4", "p": 40, "a": "Westfield Miranda", "d": "Deluxe刺身、和牛刺身、三文鱼Don、照烧鸡腿饭", "i": "南区新开的日料店，刺身非常新鲜，能看到厨师现场开鱼，Deluxe刺身拼盘很值得点。寿司、和牛刺身、玉米、三文鱼丼和照烧鸡腿饭都好吃。人均约40刀，非常实惠。", "ne": "Kafe Washoku", "lon": 151.10301, "lat": -34.03501}, {"n": "钓鱼郎私人厨房 Fishboy Private Kitchen", "t": "粤菜", "r": "3", "p": 30, "a": "Telopea", "d": "走地鸡、梅菜扣肉、椰汁栗子芋头煲、冻柠茶", "i": "粤菜小馆，走地鸡很嫩，梅菜扣肉香。最惊艳的是椰汁栗子芋头煲，芋头粉糯，椰汁香甜浓郁，很下饭。冻柠茶和苦瓜蜜瓜饮也好喝。每桌配核桃仁和XO酱小菜，店里也有独立包装出售。人均约30刀。", "ne": "Fishboy Private Kitchen", "lon": 151.04199, "lat": -33.79301}, {"n": "Johnny's Pizza & Pasta", "t": "Pizza", "r": "3", "p": 28, "a": "West Pennant Hills", "d": "Meat Pizza", "i": "号称有悉尼最大尺寸Pizza的Pizza店，生意很忙。Meat Pizza底部铺了一层咸牛肉末，每一口都很香。", "ne": "Johnny's Pizza & Pasta", "lon": 151.03883, "lat": -33.75312}, {"n": "富强面包店 King's Hot Bread", "t": "越南包", "r": "4", "p": 13.5, "a": "Hurstville", "d": "脆皮猪五花越南包", "i": "Hurstville的人气越南包，在悉尼排得上名次，常要排队。脆皮猪五花越南包13.5刀，略贵但好吃，现场吃很惊艳，隔天用空气炸锅复热依然好吃，可以算悉尼前三名。", "ne": "King's Hot Bread", "lon": 151.10085, "lat": -33.96611}, {"n": "乐乐酥 Lebakery", "t": "中式烘焙", "r": "3", "p": 10, "a": "Chatswood Place（Eastwood也有）", "d": "咸蛋黄贝果、黑芝麻碱水包、芋头酥", "i": "从Eastwood开到Chatswood Place的中式烘焙，店面更大。咸蛋黄贝果、黑芝麻碱水包和芋头酥都好吃，芋头酥最值得买。下午货架容易空。", "ne": "Lebakery", "lon": 151.17499, "lat": -33.79352}, {"n": "Yook Korean Restaurant", "t": "韩国菜", "r": "3", "p": 19, "a": "Chatswood Place", "d": "釜山猪肉汤饭、辣豆腐和牛汤饭、炸酱面", "i": "性价比很高的韩国餐厅，晚上有烤肉，午市套餐每份不超过19刀，有釜山猪肉汤饭、辣豆腐和牛汤饭、炸酱面等，味道不马虎，出餐快，适合上班族。", "ne": "Yook Korean Restaurant", "lon": 151.18266, "lat": -33.80308}, {"n": "大湘小串", "t": "湘西小串/湘菜", "r": "4", "p": 35, "a": "Burwood", "d": "塌豆腐、牛肉、鸡爪小串、锅巴小炒黄牛肉、生炒酸萝卜肥肠", "i": "好吃却不太出名的湘西小串店。塌豆腐、牛肉和鸡爪串特别好吃，撒料拌饭一绝。也能点湘菜，锅巴小炒黄牛肉、烟熏笋炒腊肉和生炒酸萝卜肥肠都很下饭。卤粉可以做不辣的给小朋友。服务热情。人均约35刀。", "ne": "Daxiang Skewers", "lon": 151.10951, "lat": -33.878}, {"n": "Sergio's Cake Shop", "t": "法式甜品", "r": "3", "p": 14, "a": "Top Ryde（Coles层）", "d": "泡芙、千层酥", "i": "Coles同层的法式甜品店，便宜大碗，很多款按斤卖，像批发工厂。蛋糕3个13刀，6个25刀。泡芙和千层酥都好吃，偏甜，但酥皮薄如蝉翼，和奶油融合得刚好。", "ne": "Sergio's Cake Shop", "lon": 151.10765, "lat": -33.81223}, {"n": "Zushi", "t": "现代日料", "r": "3", "p": 90, "a": "Surry Hills", "d": "刺身、和牛、烟熏鸭、味噌三文鱼", "i": "现代日料，干净简洁，菜单不复杂。刺身新鲜、种类多；和牛软嫩；鸭肉烟熏味香；味噌三文鱼特别好吃。适合姐妹聚会和约会，人均约90刀。", "ne": "Zushi", "lon": 151.21812, "lat": -33.8852}, {"n": "Play Coffee", "t": "咖啡", "r": "3", "p": 10, "a": "Eastwood（Lidcombe和Beecroft也有）", "d": "焙茶", "i": "在Lidcombe、Beecroft和Eastwood都有分店的咖啡店，咖啡豆得过奖。焙茶浓郁好喝，是Eastwood韩式Cafe的有力竞争者。", "ne": "Play Coffee", "lon": 151.07786, "lat": -33.78477}, {"n": "Snack Town", "t": "韩国街头小吃", "r": "3", "p": 20, "a": "Eastwood（火车站门口）", "d": "滑蛋Hash Brown三明治、韩式热狗", "i": "Eastwood火车站门口的韩国街头小吃店，卖热狗、炸鸡、三明治和年糕。滑蛋薯饼三明治内容丰富，鸡蛋很嫩；韩式热狗小朋友喜欢。人均约20刀。", "ne": "Snack Town", "lon": 151.0782, "lat": -33.79746}, {"n": "Auntie Anne's", "t": "蝴蝶饼", "r": "3", "p": 8, "a": "Westfield Parramatta", "d": "3-cheese蝴蝶饼", "i": "美国知名蝴蝶饼连锁店，开到悉尼后周末要排队约半小时。店内手工制作，有甜有咸，搭配多种蘸酱。3-cheese口味外脆内软，很好吃。", "ne": "Auntie Anne's", "lon": 151.003, "lat": -33.81501}, {"n": "Eat at Robs", "t": "汉堡", "r": "2", "p": 20, "a": "Rozelle（肉店内）", "d": "Oklahoma洋葱汉堡", "i": "开在肉店里的汉堡店，做悉尼少见的Oklahoma汉堡：大量洋葱丝直接压在生牛肉饼上一起煎，洋葱焦香，牛肉饼薄而边缘微焦。喜欢厚肉饼的人可能不太习惯。", "ne": "Eat at Robs", "lon": 151.16986, "lat": -33.86112}, {"n": "Kumiho", "t": "日料", "r": "3", "p": 25, "a": "Parramatta", "d": "炸猪排刺身饭、和牛乌冬小火锅", "i": "Parramatta实用的日料店。炸猪排刺身饭同时有酥脆猪排和新鲜刺身；和牛乌冬小火锅很治愈。上菜快，多数主食25刀以内，适合日常吃饭。", "ne": "Kumiho", "lon": 151.00186, "lat": -33.81412}, {"n": "老碗面村", "t": "西北面食", "r": "4", "p": 25, "a": "Waterloo", "d": "油泼面", "i": "西北面馆，开放式厨房可以看到师傅现场擀面、拉面。油泼面必点，手扯面筋道，油泼辣子香气扑鼻，微辣刚好。有集章卡，吃五碗送一碗。人均约25刀。", "ne": "Lao Wan Noodle Village", "lon": 151.20584, "lat": -33.89911}, {"n": "杨大姐砂锅米线", "t": "砂锅米线", "r": "4", "p": 33, "a": "Telopea", "d": "砂锅米线、无骨鸡柳", "i": "砂锅米线店，一人份就很大。米线嫩滑，汤底不算浓，加辣肉末酱刚好。必点无骨鸡柳，很像国内校门口小推车卖的味道，蘸辣椒面好吃。人均约33刀，吃不完可打包。", "ne": "Big Sister Yang Claypot Rice Noodles", "lon": 151.04085, "lat": -33.79213}, {"n": "Ampersand", "t": "韩式Cafe", "r": "3", "p": 22, "a": "Rhodes", "d": "提拉米苏拿铁", "i": "韩式咖啡店，布置像法式农庄的后花园，鲜花绿植很多，瓷盘错落摆放，很舒服。特调咖啡很韩式，提拉米苏拿铁份量大。Brunch也值得一试。", "ne": "Ampersand", "lon": 151.09116, "lat": -33.82874}, {"n": "The End of King", "t": "Cafe/Brunch", "r": "4", "p": 45, "a": "Newtown", "d": "大虾意面、鸭肉盖饭", "i": "Newtown的Cafe，没有什么装修，出品却很有调性。Brunch很好吃，大虾意面和鸭肉盖饭都出色，现在也开晚市。人均约45刀。", "ne": "The End of King", "lon": 151.17901, "lat": -33.897}, {"n": "Fabbrica Bread Shop", "t": "烘焙", "r": "3", "p": 12, "a": "Rozelle", "d": "太阳蛋牛角包", "i": "意面店Fabbrica开的烘焙店，设在一家社区超市里，临街有咖啡窗口，买面包要进超市选。太阳蛋牛角包的鸡蛋是溏心的，复烤5分钟后依然保持溏心。", "ne": "Fabbrica Bread Shop", "lon": 151.17119, "lat": -33.86383}, {"n": "Kumo Kumo", "t": "芝士蛋糕", "r": "3", "p": 12, "a": "World Square", "d": "巧克力芝士蛋糕", "i": "和Hokkaido、Uncle Tetsu同类的芝士蛋糕店，爱马仕橙包装很高级。巧克力芝士蛋糕湿润绵密扎实。", "ne": "Kumo Kumo", "lon": 151.20322, "lat": -33.884}, {"n": "Pina", "t": "Brunch", "r": "2", "p": 35, "a": "Potts Point", "d": "虾卷", "i": "名气很大的Brunch店，是Room Ten的姐妹店，很多游客来吃。虾卷食材好，虾仁硕大弹牙，黄油面包也香，但加了鱼露，味道太杂。人均约35刀，在知名Brunch店里算合理，但实际表现不如名气。", "ne": "Pina", "lon": 151.22499, "lat": -33.87099}, {"n": "古城秦味", "t": "陕西菜", "r": "5", "p": 25, "a": "Dixon One, Haymarket", "d": "肉夹馍、腊汁肉揪面片、泡馍小炒、自选浇头宽面、凉拌羊肚", "i": "让人一来再来的陕西小馆，味道很对。肉夹馍必点，酥皮馍一咬掉渣；腊汁肉揪面片手工感足，短片好入口；泡馍小炒在悉尼少见，特别管饱。人均约25刀。", "ne": "Gucheng Qinwei", "lon": 151.20881, "lat": -33.87566}, {"n": "Ada's Affair", "t": "印尼风Cafe", "r": "3", "p": 20, "a": "Glebe", "d": "Flat White、Ayam佛卡夏", "i": "关帝庙附近的高分咖啡店，印尼人经营，餐食和饮品带浓浓印尼风味，例如Ayam佛卡夏早餐。Flat White浓郁不水。浅蓝色系的店面很清新。", "ne": "Ada's Affair", "lon": 151.1881, "lat": -33.88273}, {"n": "Four Seasons Hand Made Noodle", "t": "韩国手工面", "r": "3", "p": 30, "a": "Lidcombe", "d": "辣海鲜汤面、泡菜饺子、鲜虾饺子", "i": "不开晚市的韩国手工面店，菜单只有鸡汤面、海鲜面和饺子。辣海鲜汤面很鲜，刀切面厚实弹牙；鸡汤面稍逊，带辣才好吃。泡菜饺子和鲜虾饺子不错。人均30刀以内，吃完很暖。", "ne": "Four Seasons Hand Made Noodle", "lon": 151.0451, "lat": -33.86705}, {"n": "Tajima Yakiniku", "t": "日式烤肉", "r": "4", "p": 110, "a": "Bathurst St, CBD", "d": "周一至三Wagyu Feast（159刀，原价195刀）", "i": "Town Hall走路一分钟的日式烤肉，交通方便。周一到周三晚上有Wagyu Feast套餐，159刀（原价195刀），含五种和牛、一份刺身、两份配菜和两碗米饭，适合2到3人，性价比很高。和牛油花均匀，入口即化，Oyster Blade和Short Rib都有，配秘制酱汁很好吃。", "ne": "Tajima Yakiniku", "lon": 151.21169, "lat": -33.8751}, {"n": "On Point Café & Seafood", "t": "Cafe", "r": "3", "p": 22, "a": "Chatswood Place", "d": "Smoky Salmon Melody、黑松露奶油意面", "i": "Chatswood闹市里清新的新Cafe，阳光透过落地窗，很舒服，店员友善。Smoky Salmon Melody是酸种面包配熏三文鱼、牛油果和柠檬汁，清爽适合轻午餐；黑松露奶油意面浓郁不腻，加溏心蛋更好。", "ne": "On Point Café & Seafood", "lon": 151.18483, "lat": -33.79146}, {"n": "小火锅先生 Mr Hotpoter", "t": "旋转小火锅", "r": "4", "p": 25, "a": "Mandarin Centre Chatswood", "d": "午市25刀套餐（和牛或羊肩加7个配菜）", "i": "非常实惠的旋转小火锅，午市25刀包括自选汤底、一份和牛或羊肩肉、7个旋转带配菜、自助料碟和自助小食，能吃得很饱。配菜里有不少肉类。", "ne": "Mr Hotpoter", "lon": 151.17354, "lat": -33.79898}, {"n": "Buttered Bakery & Cafe", "t": "韩式烘焙", "r": "3", "p": 12, "a": "Chippendale", "d": "爆浆Tissue Bread（抹茶、开心果）", "i": "韩式烘焙店，牛角包、蛋糕和吐司品种多，还有少见的爆浆方形牛角包Tissue Bread，层层薄如纸巾，切开即爆浆。抹茶和开心果口味都好看好吃，但偏甜。", "ne": "Buttered Bakery & Cafe", "lon": 151.19592, "lat": -33.88646}, {"n": "Dizzybird", "t": "烤鸡", "r": "2", "p": 22, "a": "Chippendale（喜来登内）", "d": "烤鸡腿配蒜酱、薯条", "i": "UTS对面喜来登酒店里的东南亚风味烤鸡快餐。鸡腿嫩，鸡皮焦香，但偏甜，配蒜酱更好；薯条不错。路过可以吃，不必专程。", "ne": "Dizzybird", "lon": 151.20197, "lat": -33.88756}, {"n": "s'Treats Coffee and Dessert", "t": "甜品饮品", "r": "3", "p": 8, "a": "Chippendale", "d": "棉花糖热巧、香蕉牛奶", "i": "饮品很可爱的甜品店。热巧杯上画着Labubu，杯沿挤棉花糖再用火炙烤，倒入热巧后挤奶油加配料，也可以选香蕉牛奶。一杯8刀，适合小朋友。", "ne": "s'Treats Coffee and Dessert", "lon": 151.19801, "lat": -33.88292}, {"n": "Uobei", "t": "旋转寿司", "r": "2", "p": 30, "a": "Central Park Mall, Chippendale", "d": "刺身寿司、龙虾拉面", "i": "不起眼的旋转寿司，用小火车送餐，很可爱。刺身类寿司蛮好吃，但米饭是机器压的，太紧实。菜单上还有龙虾拉面。", "ne": "Uobei", "lon": 151.1971, "lat": -33.88905}, {"n": "cafe ACRO+", "t": "韩式咖啡", "r": "3", "p": 10, "a": "Central Park Mall, Chippendale", "d": "黑芝麻咖啡", "i": "韩式咖啡店，招牌黑芝麻咖啡是咖啡上盖一层浓醇黑芝麻奶油，慢慢渗进咖啡里，甜度适中。人气草莓抹茶奶油咖啡也值得一试。", "ne": "cafe ACRO+", "lon": 151.20314, "lat": -33.88475}, {"n": "Wingstop", "t": "鸡翅", "r": "2", "p": 22, "a": "Kings Cross", "d": "Lemon Pepper、Louisiana Rub、Cajun", "i": "美国连锁鸡翅店，开业后天天排队。从不辣到大辣有12种口味，Lemon Pepper、Louisiana Rub和Cajun都好吃，大辣其实不太辣。鸡翅外表干香，值得一试，但不值得排长队。", "ne": "Wingstop", "lon": 151.22385, "lat": -33.87011}, {"n": "Jazushi", "t": "日料", "r": "4", "p": 40, "a": "Surry Hills", "d": "海鲜珍宝饭、拉面、炸鸡", "i": "Surry Hills开了十几年的日料店。海鲜珍宝饭不输专做刺身饭的店，鲜美爽滑，接近Omakase的满足感。拉面和炸鸡也不错。黑芝麻冰拿铁偏甜。", "ne": "Jazushi", "lon": 151.20497, "lat": -33.88251}, {"n": "Brooklyn Boy Bagels", "t": "贝果", "r": "3", "p": 14, "a": "Surry Hills", "d": "Everything配花生酱、培根鸡蛋贝果", "i": "贝果选择很多的贝果店。Everything贝果配热花生酱，花生酱爱好者必点；Plain贝果夹培根和溏心蛋也很出色。一个很大，半个就饱。", "ne": "Brooklyn Boy Bagels", "lon": 151.21264, "lat": -33.89208}, {"n": "Ennui", "t": "法餐", "r": "3", "p": 100, "a": "Pitt St, Haymarket", "d": "鸭油黄油面包、松露鸭、牛排配薯条", "i": "开在近两百年老石头房子里的法餐厅，雨夜氛围特别好。面包配的黄油融合了鸭油，特别香。前菜Beef Tartare、Kingfish Collar和蜗牛中规中矩；主菜松露鸭子好吃，牛排不错，配牛排的薯条最惊艳。甜品有巧克力慕斯和椰子Sorbet。氛围好，食物还行。不喝酒人均约100刀。", "ne": "Ennui", "lon": 151.19756, "lat": -33.87879}, {"n": "Enjoy Mie", "t": "印尼菜", "r": "3", "p": 20, "a": "Sussex St, CBD（Westfield Sydney也有）", "d": "烤鸡腿、斑斓花生慢煎饼Martabak", "i": "印尼菜，Sussex St和Westfield Sydney各有一家。Sussex St店内还有外卖Martabak慢煎饼，在悉尼很少见。脆皮猪五花捞面一般，烤鸡腿不错。斑斓花生慢煎饼厚实蓬松，花生馅颗粒感十足，软绵香，但要等20多分钟。", "ne": "Enjoy Mie", "lon": 151.20869, "lat": -33.88289}, {"n": "Innit Cafe and Bar", "t": "Cafe", "r": "3", "p": 22, "a": "Surry Hills", "d": "咖啡", "i": "泰迪熊主题浓度很高的Cafe，曾推出说出暗号就送迷你泰迪熊的活动，小熊可以粘在杯子上，很可爱。", "ne": "Innit Cafe and Bar", "lon": 151.21481, "lat": -33.88049}, {"n": "Minus Seven Frozen Yoghurt", "t": "酸奶冰淇淋", "r": "3", "p": 9, "a": "Westfield Chatswood（World Square也有）", "d": "开心果酸奶", "i": "酸奶冰淇淋店，World Square和Chatswood都有，Chatswood店在海底捞对面、Timezone旁。开心果爱好者会喜欢，有开心果味酸奶，可加开心果酱和开心果碎。", "ne": "Minus Seven Frozen Yoghurt", "lon": 151.18825, "lat": -33.7998}, {"n": "香满堂融合菜馆", "t": "东北家常菜", "r": "2", "p": 40, "a": "Burwood", "d": "喷汁茄盒、酸菜粉丝、虾仁炒蛋、蒜香鸡翅", "i": "在Kingsford和Chatswood都很受欢迎的东北家常菜，开到Burwood换了这个名字，菜单还是熟悉的家常菜。招牌喷汁茄盒又脆又烫，肉末和茄子多汁；酸菜粉丝、虾仁炒蛋和蒜香鸡翅中规中矩。", "ne": "Xiang Man Tang", "lon": 151.10062, "lat": -33.87301}, {"n": "Envoy Cafe", "t": "日式咖啡", "r": "3", "p": 6, "a": "Grosvenor St, CBD", "d": "焙茶、宇治抹茶、意式三明治", "i": "靠近The Rocks的路边小Cafe，主打日式咖啡和意式三明治，有宇治抹茶和焙茶。焙茶醇厚温和，烘焙香浓郁，不苦不涩。小杯6刀。", "ne": "Envoy Cafe", "lon": 151.20611, "lat": -33.86206}, {"n": "Cafe Portico", "t": "Brunch", "r": "4", "p": 25, "a": "Wynyard（教堂旁）", "d": "意式焗蛋、大虾意面、柠檬Pancake", "i": "嵌在教堂入口旁的小Cafe，适合游览歌剧院时顺道吃Brunch。意式焗蛋是满满意大利风味的一锅料理，番茄酱解芝士的腻，溏心蛋和Chorizo铺在酥韧的面包上；柠檬Pancake份量很大，轻盈松软，配蜂蜜、香草冰淇淋和蓝莓酱。大虾意面也不错。人均约25刀，很实惠。", "ne": "Cafe Portico", "lon": 151.2085, "lat": -33.86175}, {"n": "长白山下", "t": "东北菜", "r": "4", "p": 45, "a": "唐人街", "d": "大拉皮、口水鸡、炝三样、锅包肉、手撕包菜", "i": "唐人街新晋热门东北菜，傍晚常要排队半小时，但物美价廉，五个菜约130刀。大拉皮、口水鸡、炝三样、锅包肉和手撕包菜都很好吃，锅包肉尤其出色。", "ne": "Changbai Mountain", "lon": 151.20368, "lat": -33.87333}, {"n": "The Apollo", "t": "希腊菜", "r": "2", "p": 80, "a": "Potts Point", "d": "炸虾、烤羊肉、烤鱼", "i": "希腊菜餐厅，氛围不错，灯光昏暗、烛光浪漫，适合约会和姐妹聚餐。但食物没有记忆点：炸虾带壳且很咸，烤羊肉边缘柴，鱼的调料偏酸。人均约80刀，不太划算。", "ne": "The Apollo", "lon": 151.22518, "lat": -33.87282}, {"n": "Sug Patisserie", "t": "巴斯克蛋糕", "r": "3", "p": 19, "a": "Darling Square", "d": "抹茶提拉米苏巴斯克", "i": "专卖巴斯克蛋糕和手工陶瓷的小店，巴斯克口味很多，抹茶提拉米苏口味很好吃。一块19刀，偏贵。手工陶瓷上还能看到指纹，很可爱。", "ne": "Sug Patisserie", "lon": 151.20219, "lat": -33.87882}, {"n": "Brookelyn Donuts", "t": "甜甜圈", "r": "2", "p": 8, "a": "Westfield Chatswood", "d": "Strawberry Matcha甜甜圈", "i": "在悉尼有9家分店的甜甜圈店，开到Chatswood了，口味很多。Strawberry Matcha里草莓酱很多，非常甜。", "ne": "Brookelyn Donuts", "lon": 151.17787, "lat": -33.79077}, {"n": "Zappi's Pizzeria Cafe", "t": "Pizza/烤肉", "r": "3", "p": 28, "a": "Epping", "d": "Pizza、烤肉", "i": "Pizza和烤肉店，Pizza好吃，烤肉烤得很焦很黑，但意外地也好吃。", "ne": "Zappi's Pizzeria Cafe", "lon": 151.08219, "lat": -33.77483}, {"n": "曹氏鸭脖", "t": "鸭货", "r": "3", "p": 20, "a": "Waterloo", "d": "鸭掌、鸭胗（广东宝宝辣）", "i": "国内连锁鸭货品牌，悉尼也能买到。辣度很高，宝宝辣都相当辣，但很香。鸭货傍晚容易卖光，鸭掌和鸭胗都好吃，适合配啤酒。", "ne": "Cao's Duck Neck", "lon": 151.20721, "lat": -33.90183}, {"n": "Merry Pops", "t": "Gelato", "r": "3", "p": 9, "a": "Waterloo", "d": "Soursop口味、Gelato千层酥", "i": "需要排队的Gelato店，也卖冰棒，口味很特别，例如味道接近释迦的刺果番荔枝Soursop。店里有Live Gelato房间，点Gelato千层酥会现场制作。", "ne": "Merry Pops", "lon": 151.20865, "lat": -33.89823}, {"n": "Surly's American Tavern", "t": "美式熏肉", "r": "3", "p": 45, "a": "Surry Hills", "d": "汉堡、熏肉拼盘（牛胸肉、熏鸡翅、玉米面包）", "i": "Surry Hills的美式熏肉酒馆，美国南部风格浓厚。汉堡很大；熏肉拼盘的牛胸肉嫩，熏鸡翅香，玉米面包颗粒感足。楼上有台球和游戏机，小朋友也能玩。", "ne": "Surly's American Tavern", "lon": 151.20356, "lat": -33.88797}, {"n": "Miss Yue", "t": "粤菜/早茶", "r": "3", "p": 40, "a": "Epping Club", "d": "海蜇手撕鸡、金衣虾球、桂花酒酿黑芝麻汤圆", "i": "Epping Club里环境很好的粤菜餐厅，Club会员有5%折扣。早茶点心和大菜都能点，海蜇手撕鸡、金衣虾球和桂花酒酿黑芝麻汤圆都好吃。人均约40刀，附近请客聚餐不必跑Eastwood或Carlingford。", "ne": "Miss Yue", "lon": 151.08363, "lat": -33.7712}, {"n": "食得好 Great Food", "t": "茶餐厅", "r": "3", "p": 18, "a": "Carlingford Village", "d": "茶餐厅套餐", "i": "平靓正的港式茶餐厅，有肉有菜有甜品，份量不大但可口。人均约18刀，物价飞涨下很难得。", "ne": "Great Food", "lon": 151.05095, "lat": -33.78357}, {"n": "海底捞", "t": "火锅", "r": "3", "p": 55, "a": "Chatswood", "d": "生日服务", "i": "连锁火锅品牌，在海底捞过生日很有仪式感，桌面有气球布置，寿星有小礼物。Chatswood店假期还有DIY玩偶和糖画等活动，适合带小朋友庆生。", "ne": "Haidilao", "lon": 151.17818, "lat": -33.80349}, {"n": "Kisuke 㐂介", "t": "Omakase", "r": "3", "p": 220, "a": "Potts Point", "d": "18道含10贯寿司", "i": "Potts Point价格较亲民的Omakase，每位220刀，共18道，其中10贯寿司，在悉尼入门价位里难得像样。网上直接预约，不玩花招。食材略普通，但厨师手艺弥补了不足，味道可口，菜式多样，份量刚好。", "ne": "Kisuke", "lon": 151.22667, "lat": -33.86923}, {"n": "SONGDO GUKBAP", "t": "釜山汤饭", "r": "4", "p": 20, "a": "Lidcombe", "d": "猪肉汤饭、炸鸡、饭团、芝士年糕", "i": "Lidcombe的釜山汤饭店，白汤猪肉汤饭配桌上的小虾米和辣椒酱，猪肉有肥有瘦，鲜甜香浓。炸鸡、饭团和芝士年糕也好吃。", "ne": "SONGDO GUKBAP", "lon": 151.05114, "lat": -33.86276}, {"n": "寒舍汤铺", "t": "广东汤", "r": "3", "p": 20, "a": "Chatswood（原在Mascot）", "d": "鲍鱼青橄榄排骨汤", "i": "起家于Mascot的广东汤铺，菜单直接标注不同身体状况适合喝什么汤。鲍鱼青橄榄排骨汤一盅27刀，适合伤风感冒时喝。蒸肉饼饭和黄皮蒸饺较普通。整颗椰子炖的汤看起来很值得一试。", "ne": "Hanshe Soup House", "lon": 151.18848, "lat": -33.79374}, {"n": "Nichi Getsu Do 日月堂", "t": "日式拉面", "r": "3", "p": 22, "a": "Kent St, CBD", "d": "Miso拉面、担担面", "i": "少见的以味噌拉面和担担面为主的日式拉面店。汤料先在热锅里大火炒过，厨房火光四起，汤底是干香型，不像一般拉面那样浓稠。整体中等偏上。抹茶啤酒很苦，口味特别。", "ne": "Nichi Getsu Do", "lon": 151.19988, "lat": -33.87358}, {"n": "福临门 Fortune Palace", "t": "早茶", "r": "3", "p": 21, "a": "Carlingford Village", "d": "虾肉馄饨、排骨陈村粉", "i": "一整周早茶时段都非常繁忙的平价早茶店，几乎没有服务，想吃什么要自己跟着点心车走。点心不错，虾肉馄饨只要5刀，排骨陈村粉12刀。人均约21刀，非常便宜。", "ne": "Fortune Palace", "lon": 151.047, "lat": -33.77893}, {"n": "Omakase by Prefecture 48", "t": "Omakase", "r": "4", "p": 350, "a": "Prefecture 48, Sussex St, CBD", "d": "龙虾、鲍鱼、带子、金枪鱼腹、鱼子酱、9贯寿司", "i": "Prefecture 48集团的Omakase，虽然网红属性高，但出品确实很好，适合纪念日。", "ne": "Omakase by Prefecture 48", "lon": 151.1995, "lat": -33.88346}, {"n": "大碗鲜牛羊杂米线", "t": "米线", "r": "2", "p": 18, "a": "Chatswood（与天仁茗茶同铺）", "d": "牛杂米线", "i": "和天仁茗茶共用铺位的米线店。牛杂米线的牛杂只有牛肚，汤头鲜美，米线嫩滑，但不算特别出色，也不太管饱。可以顺便在天仁茗茶买一杯热蜂蜜菊花普洱。", "ne": "Big Bowl Beef and Lamb Offal Rice Noodles", "lon": 151.17271, "lat": -33.79519}, {"n": "Sutbul Chicken", "t": "韩式烤鸡", "r": "3", "p": 30, "a": "Lidcombe", "d": "原味和酱油味烤鸡、蒸蛋、饭团", "i": "Lidcombe的韩式烤鸡餐吧，下午四点就开门。菜单不大，主打各种口味烤鸡，原味和酱油味都很香但偏干。蒸蛋和饭朴素可口。适合配酒，人均约30刀。", "ne": "Sutbul Chicken", "lon": 151.04267, "lat": -33.8625}, {"n": "Bunker 64", "t": "韩式Cafe", "r": "3", "p": 22, "a": "Lidcombe", "d": "Butterscotch Cream Latte、蒜蓉芝士面包、姜汁蜂蜜茶", "i": "Lidcombe火车站对面外观平平的韩国Cafe，出品很惊喜。Butterscotch Cream Latte特调、蒜蓉芝士面包、可露丽和姜汁蜂蜜茶都好吃好喝。", "ne": "Bunker 64", "lon": 151.04909, "lat": -33.86771}, {"n": "Duo Duo", "t": "炸雪糕", "r": "3", "p": 15, "a": "Strathfield", "d": "炸雪糕", "i": "从南区路边餐车起家、现在Strathfield开店的炸雪糕店。镇店之宝炸雪糕外层是炸面包，里面是雪糕球，再加配料，小朋友会觉得很神奇。一颗15刀，偏贵。", "ne": "Duo Duo", "lon": 151.0942, "lat": -33.87484}, {"n": "悉尼小馄饨", "t": "冷冻馄饨店", "r": "3", "p": 15, "a": "Beverly Hills（King George Rd）", "d": "流沙咸蛋黄鲜肉馄饨", "i": "King George Rd上的冷冻薄皮馄饨门店，网上超市常见的品牌，门店口味最齐全。流沙咸蛋黄鲜肉馄饨最受欢迎，煮时戳破一颗，整碗汤都有咸蛋黄香。附带猪油、紫菜、蛋皮和盐的料包，按比例调好，非常方便。一盒十几刀。", "ne": "Sydney Little Wontons", "lon": 151.07999, "lat": -33.948}, {"n": "Shabuway", "t": "自助火锅", "r": "3", "p": 46, "a": "Dixon One, CBD", "d": "7+和牛、大虾、芝麻小球、雪糕", "i": "实惠的自助火锅，提供7+和牛，虽是冷冻但煮后仍嫩，虾个头大。熟食区中西日韩都有，奶黄流心芝麻球特别好吃。雪糕任吃，可以自己加配料。成人46刀，小孩29刀。", "ne": "Shabuway", "lon": 151.21112, "lat": -33.87822}, {"n": "Mrs Jones The Baker", "t": "烘焙Cafe", "r": "3", "p": 22, "a": "St Ives Village", "d": "牛角包、摩卡", "i": "St Ives Village里客人络绎不绝的烘焙Cafe，面包甜品琳琅满目。牛角包一般，小蛋糕可能是更好的选择。有咖啡和红茶。", "ne": "Mrs Jones The Baker", "lon": 151.16799, "lat": -33.72901}, {"n": "AMAZONA Premium Acai & Dessert", "t": "Acai", "r": "3", "p": 14, "a": "Gordon", "d": "Acai加巧克力酱奥利奥", "i": "Acai碗和甜品店，可以自选配料，加巧克力酱和奥利奥饼干后会好吃很多，适合小朋友。", "ne": "AMAZONA Premium Acai & Dessert", "lon": 151.14892, "lat": -33.75646}, {"n": "Happi Ramen", "t": "日式拉面", "r": "2", "p": 20, "a": "Gordon", "d": "豚骨拉面、横滨拉面、蘸面", "i": "周末中午要稍微排队的拉面店，表现一般。豚骨拉面和横滨拉面不太咸、浓稠度刚好；蘸面的蘸汤不够浓，面条冰冷。人均约20刀。", "ne": "Happi Ramen", "lon": 151.15496, "lat": -33.75757}, {"n": "喜相逢海鲜酒家", "t": "粤菜酒楼", "r": "2", "p": 50, "a": "Beverly Hills", "d": "走地鸡、乳鸽、XO Pipi", "i": "Beverly Hills的粤菜酒楼，客流明显减少。走地鸡有鸡冻，乳鸽皮脆，XO酱炒Pipi的酱汁可以蘸油条，送的马蹄露清新，但三杯鸭舌烧糊了。整体不难吃也不出彩，人均50刀以上。", "ne": "Hei Seung Fung Seafood Restaurant", "lon": 151.07885, "lat": -33.94712}, {"n": "Elf Cake & Co", "t": "蛋糕店", "r": "3", "p": 14, "a": "Epping（火车站出口）", "d": "迪拜巧克力蛋糕、罗马奶油包", "i": "Epping火车站出口的蛋糕店，价格牌手写，很朴实。迪拜巧克力蛋糕除了开心果脆，还夹一层浆果解腻；罗马奶油包造型像柯基屁股，很可爱。好吃但很贵，一小片迪拜巧克力蛋糕要11刀。", "ne": "Elf Cake & Co", "lon": 151.07892, "lat": -33.77344}, {"n": "K Style Food", "t": "韩国菜", "r": "3", "p": 30, "a": "Epping", "d": "辣猪骨锅、海鲜煎饼", "i": "火车站步行一分钟的街边小韩国菜馆，店面简陋但很实惠。辣猪骨锅堆成一座小山，十几块猪脊骨炖到一碰就脱骨，配生韭菜很过瘾；海鲜煎饼也不错。份量很大，人均30刀以内。", "ne": "K Style Food", "lon": 151.08496, "lat": -33.77455}, {"n": "ICHIRAKU CANTEEN", "t": "一人寿喜烧", "r": "3", "p": 30, "a": "唐人街", "d": "寿喜烧乌冬", "i": "居酒屋推出的一人一锅寿喜烧午餐，肉质不算高级，但吃得满足。寿喜烧越煮越甜越咸，建议十分钟内吃完。乌冬特别好吃。一锅30刀。", "ne": "ICHIRAKU CANTEEN", "lon": 151.19798, "lat": -33.87551}, {"n": "Oh My Yo", "t": "酸奶冰淇淋", "r": "3", "p": 9, "a": "唐人街德信大厦", "d": "茅台口味、椰子口味", "i": "德信大厦翻新后地面层的酸奶冰淇淋店，有很新奇的茅台口味，可以搭配椰子口味和旺仔小馒头。份量小，一小碗7刀。", "ne": "Oh My Yo", "lon": 151.20565, "lat": -33.8851}, {"n": "别不同", "t": "盐焗鸡饭", "r": "3", "p": 18, "a": "Eastwood", "d": "盐焗鸡饭", "i": "Eastwood的盐焗鸡饭，口味很像国内的明海盐焗鸡饭。", "ne": "Bie Bu Tong", "lon": 151.07273, "lat": -33.78919}, {"n": "Whisky Thief", "t": "威士忌酒吧", "r": "3", "p": 50, "a": "Prefecture 48, Sussex St, CBD", "d": "鸡尾酒", "i": "Prefecture 48的威士忌酒吧，两层楼高的酒墙非常壮观，适合在楼上餐厅用餐前先来喝一杯。鸡尾酒好喝。", "ne": "Whisky Thief", "lon": 151.20782, "lat": -33.87349}, {"n": "Katsu Haki", "t": "日式炸猪排", "r": "3", "p": 38, "a": "Event Cinema, George St, CBD", "d": "鹿儿岛黑豚炸猪排饭", "i": "日式炸猪排饭店。限量黑豚炸猪排饭38刀，鹿儿岛黑豚厚切依然很嫩，外皮酥脆，咬到肥肉部分会爆油，撒芝麻更香。份量足。店里调料选择不多。和大阪名店比有差距，但在悉尼算不错。", "ne": "Katsu Haki", "lon": 151.2161, "lat": -33.86964}, {"n": "Warabi Mochi Kamakura", "t": "蕨饼", "r": "3", "p": 12, "a": "Regent Place", "d": "黑芝麻和抹茶蕨饼", "i": "蕨饼专门店，也卖饮品和雪糕。蕨饼非常软，几乎像史莱姆一样会流动，口感糯软。黑芝麻粉比抹茶粉更好吃。包装漂亮，标明赏味期限。5颗十几刀，偏贵。", "ne": "Warabi Mochi Kamakura", "lon": 151.20071, "lat": -33.86336}, {"n": "10K NOODLES", "t": "韩国面", "r": "3", "p": 23, "a": "Eastwood（10000面包楼上）", "d": "辣汤面、花蛤汤面、和牛煎饼", "i": "10000面包楼上的韩国面馆，风格延续纯白简约，菜单只有6道。辣汤面和花蛤汤面面条劲道、汤好喝，适合冬天。饺子皮薄馅厚，但4颗9刀偏贵。和牛煎饼是把和牛锤薄后裹蛋液煎，肉脂香和蛋香兼具，很值得加点。人均约23刀。", "ne": "10K NOODLES", "lon": 151.08572, "lat": -33.79708}, {"n": "辣妹厨房 Pretty Chef", "t": "贵州菜", "r": "5", "p": 30, "a": "Petersham", "d": "辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、宫爆猪板筋", "i": "悉尼少有的贵州菜，辣度温柔浓郁、越吃越想吃。辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、臭豆豉回锅肉、双椒肉末茄子和宫爆猪板筋都很下饭，米豆腐和猪板筋口感新奇。酸汤火锅也值得一试。人均约30刀，非常实惠。", "ne": "Pretty Chef", "lon": 151.155, "lat": -33.894}, {"n": "台南人", "t": "台湾小吃", "r": "4", "p": 18, "a": "Eastwood台湾夜市", "d": "鸡卤饭、地瓜球、麻油鸡汤、芋泥饼、盐水鸡", "i": "台湾小吃店，鸡卤饭同时有鸡肉和卤肉，上面是猪油煎的荷包蛋，特别好吃。地瓜球和西门町的一模一样；手工芋泥饼很赞；麻油鸡汤在悉尼难得喝到；盐水鸡普通。值得反复去。", "ne": "Tainan Ren", "lon": 151.08249, "lat": -33.78376}, {"n": "Diana", "t": "韩国菜", "r": "3", "p": 50, "a": "Potts Point", "d": "拌鱼生、熏鸭片皮鸭、蒸五花生菜包", "i": "开在潮区的韩国餐厅，环境幽暗，菜名看起来难以下手，但味道不错。刺身由服务员桌边拌制，像辣味版的捞起鱼生；片皮鸭用的是熏鸭肉，烟熏味浓；蒸五花肉生菜包的卤肉很香。甜品大麻花普通。人均约50刀，以这个区和环境来说不算贵。", "ne": "Diana", "lon": 151.22192, "lat": -33.87147}, {"n": "Pennant Hills Seafood", "t": "海鲜店/炸鱼薯条", "r": "4", "p": 25, "a": "Pennant Hills Market Place", "d": "Flathead炸鱼配海鲜沙拉、三文鱼腹、金枪鱼Toro", "i": "Pennant Hills的海产店，用每天新鲜到货的鱼做Fish & Chips，配的还是海鲜沙拉。也卖刺身级三文鱼和金枪鱼，可以帮忙切片，三文鱼腹和金枪鱼Toro都很新鲜。", "ne": "Pennant Hills Seafood", "lon": 151.07083, "lat": -33.73712}, {"n": "Myeongdong", "t": "韩国菜", "r": "3", "p": 40, "a": "Chatswood（North Strathfield本店）", "d": "梨子拌生牛肉、辣豆腐汤、韩式炸猪排", "i": "North Strathfield评分很高的韩国餐厅，Chatswood也有分店。梨子拌生牛肉必点；辣豆腐汤冬天暖身；韩式炸猪排薄而嫩脆，蘸酱或空口都好吃。三道菜约75刀，够2到3人。", "ne": "Myeongdong", "lon": 151.1857, "lat": -33.80308}, {"n": "Leible Coffee", "t": "咖啡", "r": "3", "p": 10, "a": "North Sydney（Crows Nest也有）", "d": "Absolute", "i": "在悉尼有四家店的咖啡品牌，北悉尼火车站Blue St出口和Crows Nest都有。招牌咖啡豆Absolute强度四星，很提神。", "ne": "Leible Coffee", "lon": 151.20584, "lat": -33.83912}, {"n": "彩云南 Colorful Yunnan", "t": "云南菜", "r": "3", "p": 45, "a": "Chatswood（Eastwood也有）", "d": "过桥米线、土司饵块鸡、瓦片高原肉、蟹黄豆腐、牛肝菌黄焖鸡", "i": "云南菜馆，适合聚餐。不辣的蟹黄豆腐和糖醋里脊都好吃，但最出色的还是过桥米线，汤非常浓郁。人均约45刀。", "ne": "Colorful Yunnan", "lon": 151.18251, "lat": -33.78976}, {"n": "邓婆婆川式面馆", "t": "川式面馆", "r": "2", "p": 20, "a": "Eastwood Plaza", "d": "三选便当、砂锅红烧牛肉肥肠米线、重庆小面", "i": "Eastwood牛百岁隔壁的川式面馆，适合买菜时快吃快走。三选便当最好，青椒回锅肉尤其不错；砂锅红烧牛肉肥肠米线次之；重庆小面一般。人均20刀以内。", "ne": "Granny Deng Sichuan Noodles", "lon": 151.07391, "lat": -33.79557}, {"n": "Sushi Maru", "t": "寿司外卖", "r": "3", "p": 18, "a": "Gordon", "d": "寿司盒", "i": "在悉尼有近10家分店的寿司外卖店，新鲜食材加浓厚酱汁，是典型的澳式寿司，很合本地人口味。周末下午也常满座。", "ne": "Sushi Maru", "lon": 151.15101, "lat": -33.75293}, {"n": "Chois Kitchen", "t": "韩式中华料理", "r": "4", "p": 30, "a": "Castle Hill", "d": "大盘炸酱面（配整只炸鱿鱼）、米酒", "i": "口碑很好的韩式中华料理，必点大盘炸酱面，上面放一整只炸鱿鱼，剪碎拌面吃；炸酱不甜不油，顺滑爽口。可以配米酒，小朋友可以喝甜米露。人均约30刀。", "ne": "Chois Kitchen", "lon": 151.00197, "lat": -33.73257}, {"n": "Cha-no-wa 茶中环", "t": "抹茶饮品", "r": "2", "p": 10, "a": "Rhodes", "d": "抹茶软雪糕、蕨饼", "i": "常要排小队的抹茶饮品店，走快速多样的奶茶店路线。抹茶星冰乐里是半杯冰粒，不推荐；抹茶软雪糕配红豆麻薯和抹茶蕨饼中规中矩。", "ne": "Cha-no-wa", "lon": 151.08265, "lat": -33.82851}, {"n": "I Gladiatori Osteria Romana", "t": "意大利菜", "r": "3", "p": 45, "a": "North Strathfield", "d": "茄汁大通心宽粉、提拉米苏", "i": "罗马风味意大利餐厅，在North Strathfield和Freshwater各有一家。有罗马古老的长方形Pinsa薄饼，口感接近佛卡夏。茄汁大通心宽粉好吃；咖啡杯装的提拉米苏非常湿软，只是酒味不足。路边座位很舒服。人均约45刀。", "ne": "I Gladiatori Osteria Romana", "lon": 151.08686, "lat": -33.85613}, {"n": "Noodlee", "t": "韩越融合越南粉", "r": "5", "p": 28, "a": "North Strathfield", "d": "辣牛小肠越南牛肉粉", "i": "韩国人开的越南Pho店，是很成功的融合菜。辣牛小肠越南牛肉粉把韩式牛小肠辣汤和越南米粉结合得极好，小肠爽口，米粉嫩滑，汤底浓郁辛辣，冬天非常适合。一碗28刀，不便宜。", "ne": "Noodlee", "lon": 151.08819, "lat": -33.85884}, {"n": "Pure Brew & Co.", "t": "韩式咖啡", "r": "3", "p": 9, "a": "Gordon", "d": "冰芒果抹茶拿铁", "i": "布置很韩式的咖啡店，每个角落都简单自然，错落有致，店员热情。冰芒果抹茶拿铁很好喝，一杯9刀，适合坐下消磨时间。", "ne": "Pure Brew & Co.", "lon": 151.1501, "lat": -33.75905}, {"n": "Teddy Bear Hightea Buffet", "t": "下午茶自助", "r": "3", "p": 99, "a": "Sheraton Grand Sydney Hyde Park", "d": "小熊甜品、巧克力瀑布", "i": "海德公园喜来登酒店的泰迪熊下午茶自助，甜品都有小熊元素，有巧克力瀑布和任挖的冰淇淋，每两人送一只穿喜来登T恤的Build-A-Bear小熊，小朋友会非常开心。成人99刀，小孩55刀。", "ne": "Teddy Bear Hightea Buffet", "lon": 151.2112, "lat": -33.87484}, {"n": "Sushi Hotaru", "t": "旋转寿司", "r": "4", "p": 50, "a": "The Galeries", "d": "烤白鳗、三文鱼腹、生虾、手卷、Miso Cod", "i": "开了很多年的人气旋转寿司，价格不贵、食材新鲜、翻桌快。烤白鳗、三文鱼腹和生虾都很新鲜；手卷扎实，一个5刀；西餐厅要卖四五十刀的Miso Cod这里只要7.8刀。人均约50刀，物美价廉。", "ne": "Sushi Hotaru", "lon": 151.20721, "lat": -33.87383}, {"n": "Teddy Tea Break", "t": "奶茶", "r": "2", "p": 9, "a": "Newtown火车站", "d": "茉香奶茶", "i": "Newtown火车站出口的泰迪熊奶茶店，英伦风装潢有年代感，也有生椰拿铁等流行口味。茉香奶茶普通。", "ne": "Teddy Tea Break", "lon": 151.17784, "lat": -33.89612}, {"n": "Bar Julius", "t": "西餐", "r": "2", "p": 50, "a": "Redfern", "d": "Beef Tartare、柠檬烤鸡、美式热狗", "i": "Surry Hills新Plaza里的西餐厅，早上六点开始营业，有全天菜单。Beef Tartare、柠檬烤鸡和美式热狗都一般，但环境和服务很好。人均约50刀，适合商务谈事，不适合专门来吃饭。", "ne": "Bar Julius", "lon": 151.20565, "lat": -33.89021}, {"n": "Westfield Chatswood 美食广场合集", "t": "美食广场", "r": "2", "p": 18, "a": "Westfield Chatswood", "d": "Sou Ramen Lab鸡汤拉面、美林便当（有儿童份）、霑记、Don't Tell Mama炸串", "i": "Chatswood Westfield美食广场整体缺少惊艳的选择。美林便当一般，但有儿童份量；霑记不如Macquarie Centre的分店；Don't Tell Mama串串比不过夸父；Sou Ramen Lab的鸡汤底还可以。", "ne": "Westfield Chatswood food court roundup", "lon": 151.17388, "lat": -33.80156}, {"n": "Olympic Meats", "t": "希腊菜", "r": "5", "p": 30, "a": "Marrickville（Dulwich Hill站对面）", "d": "猪鸡牛卷饼、胖薯条", "i": "Dulwich Hill火车站对面的希腊烤肉店，人气极高，常要排一小时以上，但值得。前菜一般可以跳过；卷饼一定要多点，猪肉、鸡肉和牛肉都鲜嫩焦香。胖薯条超脆超香，可能是悉尼最好吃的薯条之一。", "ne": "Olympic Meats", "lon": 151.155, "lat": -33.91101}, {"n": "D'penyetz & D'cendol", "t": "印尼菜", "r": "3", "p": 20, "a": "Sussex St", "d": "炸鸡腿、烤鸡腿配辣酱", "i": "颜色亮眼的印尼菜，炸鸡腿和烤鸡腿都好吃，辣酱更出色，香且料足。辣度分五级以上，2级已经相当辣。", "ne": "D'penyetz & D'cendol", "lon": 151.19653, "lat": -33.88097}, {"n": "Bat + Bun", "t": "越南包", "r": "3", "p": 11, "a": "Darlinghurst", "d": "脆皮猪五花越南包（加青苹果丝）", "i": "街角的越南咖啡店，越南包、米粉、米卷和越南咖啡都有。脆皮猪五花越南包加了青苹果丝，清甜解腻；猪五花够脆，但沙拉酱放得偏多，略甜。一个11刀，不贵。", "ne": "Bat + Bun", "lon": 151.21492, "lat": -33.87844}, {"n": "Miss Sina", "t": "烘焙", "r": "3", "p": 12, "a": "Marrickville", "d": "斑斓叶子卷、Biscoff肉桂卷", "i": "Cabramatta一带很火的烘焙店，带东南亚风味。招牌斑斓卷是软糯面包涂斑斓奶油再撒椰片椰丝；Biscoff肉桂卷也好吃。很肥，适合偶尔吃。", "ne": "Miss Sina", "lon": 151.15386, "lat": -33.91013}, {"n": "Tita", "t": "菲律宾Cafe", "r": "3", "p": 22, "a": "Marrickville", "d": "紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁", "i": "Marrickville的菲律宾Cafe，甜品都用紫薯Ube制作，满桌紫色。紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁和紫薯冰面包都很有特色，紫薯味很像广东的五羊雪糕。", "ne": "Tita", "lon": 151.15519, "lat": -33.91284}, {"n": "Jagalchi", "t": "韩式鱼生", "r": "3", "p": 35, "a": "Lidcombe", "d": "无腌鱼生配蒜蓉麻油辣酱、鱼籽辣汤", "i": "Lidcombe韩式鱼生店，在Il Eok Jo隔壁。鱼生不腌制，配蒜蓉麻油辣酱另有风味；鱼籽辣汤冬天很舒服。人均约35刀。", "ne": "Jagalchi", "lon": 151.04856, "lat": -33.85989}, {"n": "Mochiric", "t": "麻薯甜甜圈", "r": "4", "p": 8, "a": "The Galeries（流动摊位）", "d": "斑斓椰子、柠檬奶油、香蕉牛奶甜甜圈", "i": "Cabramatta有名的麻薯甜甜圈，平时在几个地点流动摆摊，周末有时在The Galleries。口感又糯又韧，比普通甜甜圈好吃，口味有斑斓椰子、柠檬奶油、香蕉牛奶等少见款。", "ne": "Mochiric", "lon": 151.20865, "lat": -33.87021}, {"n": "Alice's Makan", "t": "马来菜", "r": "3", "p": 25, "a": "Chatswood Chase", "d": "炒萝卜糕、海南鸡、咸蛋黄虾球、Kaya Toast", "i": "Chatswood Chase新开的马来餐厅。招牌炒萝卜糕像炒年糕一样，萝卜糕软嫩入味，和鸡蛋豆芽很搭；海南鸡、咸蛋黄虾球和Kaya Toast水准可以。服务很不专业，常上错桌。", "ne": "Alice's Makan", "lon": 151.19011, "lat": -33.79762}, {"n": "Brother Katsu", "t": "韩国小吃", "r": "2", "p": 18, "a": "Marina Square, Wentworth Point", "d": "鱼饼汤、炸紫菜卷", "i": "购物中心里的韩国街头小吃店，卖炸物、鱼饼、方便面和饭团。炸紫菜卷太油，不推荐；鱼饼汤胡椒味浓，冷天喝很舒服。", "ne": "Brother Katsu", "lon": 151.07664, "lat": -33.82621}, {"n": "Bosphorus Turkish Street Food", "t": "土耳其菜", "r": "4", "p": 30, "a": "Wentworth Point", "d": "烤鸡翅薯条、鸡肉Snack Pack、鹰嘴豆泥", "i": "土耳其街头小吃，油香肉类配扎实碳水。烤鸡翅焦香，薯条撒鸡盐，底下铺土耳其面包，配酸蒜酱解腻；Snack Pack可选鸡肉、羊肉或牛肉，米饭用鸡油泡过，油润爽口。鹰嘴豆泥和土耳其汽水也值得点。", "ne": "Bosphorus Turkish Street Food", "lon": 151.07193, "lat": -33.82845}, {"n": "Pappa Flock", "t": "炸鸡", "r": "4", "p": 20, "a": "Macquarie Centre（Bondi也有）", "d": "原味和辣味Tender、炸鸡汉堡、Butter Toast", "i": "在Bondi和Macquarie Centre都有店的炸鸡品牌，以Tender出名。鸡胸肉Tender非常嫩且多汁，原味和辣味都好；Butter Toast烤得酥脆，和Tender很搭。炸鸡汉堡也不错。", "ne": "Pappa Flock", "lon": 151.12414, "lat": -33.77575}, {"n": "Ainoya", "t": "居酒屋", "r": "2", "p": 50, "a": "Kirribilli", "d": "刺身、寿司、天妇罗、清酒", "i": "有榻榻米座位的日式居酒屋，周六晚上满座。酒单详细，每款清酒都建议了饮用温度。刺身、寿司和天妇罗不错，不算正宗但可接受，适合喝几杯清酒。", "ne": "Ainoya", "lon": 151.21401, "lat": -33.84802}, {"n": "传记潮发潮汕牛肉火锅", "t": "潮汕牛肉火锅", "r": "4", "p": 60, "a": "唐人街", "d": "鲜打牛肉丸、湿炒牛肉粿条", "i": "潮汕牛肉火锅，牛肉丸现打，煮五分钟就熟，比冷冻丸子好吃很多。必点湿炒牛肉粿条，芥兰香脆甘甜，牛肉炒到半熟，勾沙茶芡汁，复原度很高。人均约60刀。", "ne": "Chuan Ji Teochew Beef Hotpot", "lon": 151.21124, "lat": -33.88179}, {"n": "Chill Restaurant", "t": "越南粉", "r": "3", "p": 25, "a": "Crows Nest（Eastwood也有）", "d": "咸蛋黄肉松炸虾、和牛Pho", "i": "Eastwood和Crows Nest都有的越南粉店，Google六百多条评价仍有4.7分。前菜咸蛋黄肉松炸虾，四只大虾非常弹牙。和牛Pho一碗28刀，牛肉嫩而肥，上桌时还红彤彤，很鲜。人均约25刀。", "ne": "Chill Restaurant", "lon": 151.19965, "lat": -33.82451}, {"n": "Eden Pasticceria", "t": "意大利甜品", "r": "3", "p": 14, "a": "Neutral Bay", "d": "Cream Coffee、提拉米苏、开心果泡芙、开心果Cannoli", "i": "意大利甜品店，也卖Gelato。招牌意式Cream Coffee苦甜冰凉，口感像更饱满流动的软雪糕。提拉米苏、开心果泡芙和开心果Cannoli都值得买。三样甜品加一杯Cream Coffee约28刀。", "ne": "Eden Pasticceria", "lon": 151.218, "lat": -33.83101}, {"n": "SML Cafe", "t": "Cafe", "r": "3", "p": 22, "a": "North Willoughby", "d": "豆乳咖啡、拉丝芝士三明治、薯饼", "i": "店名意为小中大咖啡的人气Cafe，下午两点半还坐满人。豆乳咖啡、拉丝芝士三明治和薯饼都好吃。", "ne": "SML Cafe", "lon": 151.19684, "lat": -33.79812}, {"n": "Sydney Daifuku Store", "t": "日式大福", "r": "3", "p": 10, "a": "Lane Cove North", "d": "红豆草莓、抹茶、巧克力大福", "i": "开在居民区绿荫中的日式大福店，环境很美。大福现包，上桌后自己用细绳切开，很有趣。红豆草莓、抹茶和巧克力口味的奶油都很好，不太甜。一颗约10刀，不便宜。", "ne": "Sydney Daifuku Store", "lon": 151.16997, "lat": -33.81655}, {"n": "The Squire's Landing", "t": "景观餐厅", "r": "3", "p": 120, "a": "Circular Quay", "d": "Vivid套餐", "i": "环形码头The Quay楼下的景观餐厅，以约一半的价格享受和The Quay同样的歌剧院和海港大桥美景。Vivid期间有99刀和120刀两种套餐，有溢价但食物不难吃，一线景观无遮挡，比坐游船舒服。", "ne": "The Squire's Landing", "lon": 151.21002, "lat": -33.85793}, {"n": "Esteban", "t": "墨西哥菜", "r": "2", "p": 70, "a": "Temperance Lane, CBD", "d": "Steak Tartare Taco、玉米片蘸黑豆泥", "i": "暗黑风格的墨西哥餐厅，酒单比菜单丰富得多，对各种龙舌兰介绍详细生动。Steak Tartare Taco和玉米片蘸黑豆泥好吃，其他菜既不够墨西哥也不够正统。建议点几个Taco配酒就好。人均约70刀。", "ne": "Esteban", "lon": 151.20706, "lat": -33.8768}, {"n": "Olympus Dining", "t": "希腊菜", "r": "2", "p": 60, "a": "Redfern", "d": "烤面包、烤鱿鱼、烤鱼、炸羊脑、烤鸡", "i": "Redfern新Plaza里的希腊餐厅，和Surry Hills一街之隔，因玻璃天窗下的一棵大树走红，入座送瓜子。烤面包、烤鱿鱼、烤全鱼、炸羊脑和烤鸡都焦香不错；米布丁和西瓜冰沙也还行。值得打卡，但味道不上不下。好停车，人均约60刀。", "ne": "Olympus Dining", "lon": 151.2009, "lat": -33.89245}, {"n": "Malika Bakehouse", "t": "土耳其烘焙", "r": "3", "p": 12, "a": "Surry Hills", "d": "番茄牛肉卷、牛肉肠卷、千层芝士饼", "i": "Surry Hills主街上的土耳其烘焙店，白墙配绿橙横纹很醒目。牛肉肠卷、千层芝士饼和番茄牛肉卷都可以试，番茄牛肉卷最好吃。店里可以帮忙加热。", "ne": "Malika Bakehouse", "lon": 151.21823, "lat": -33.88879}, {"n": "Jan cafe", "t": "拉花咖啡", "r": "3", "p": 10, "a": "Woolloomooloo", "d": "龙猫和Labubu拉花", "i": "以可爱拉花出名的咖啡店，咖啡师来自槟城，龙猫和Labubu拉花十几秒就完成，墙上还有更多作品照片。Labubu和龙猫迷值得专程来。", "ne": "Jan cafe", "lon": 151.22218, "lat": -33.87084}, {"n": "东厨 New Dumpling House", "t": "东北菜", "r": "3", "p": 30, "a": "唐人街", "d": "锅包肉、排骨焖豆角、小鸡炖蘑菇", "i": "唐人街正中心的东北菜小馆，客人多是外国人，菜单却很地道。锅包肉外衣轻盈、肉片薄而不柴；排骨焖豆角的酱汁非常下饭；小鸡炖蘑菇和酸菜炒粉条也不错。人均约30刀。", "ne": "New Dumpling House", "lon": 151.20086, "lat": -33.87276}, {"n": "Hinataya", "t": "日料", "r": "3", "p": 35, "a": "Mascot", "d": "鳗鱼盖饭、乌冬、Toro刺身", "i": "实在的日料店，以鳗鱼盖饭出名，菜单很大，也有乌冬。Toro刺身、烤三文鱼腩寿司和炸紫菜三文鱼刺身都不错，甜品威化巧克力冰淇淋也好。人均约35刀。", "ne": "Hinataya", "lon": 151.18798, "lat": -33.92701}, {"n": "芳芳闽味", "t": "泉州小吃", "r": "3", "p": 18, "a": "Eastwood Arcade", "d": "肉羹汤、花生酱拌面、炸沙茶鸡肉串、五香卷", "i": "Eastwood Arcade里的泉州小吃，上午10点半开门。肉羹汤、花生酱拌面、炸沙茶鸡肉串和五香卷都不错。拌面建议堂食，外带容易坨。四样约36刀，够两人午餐。", "ne": "Fang Fang Fujian Snacks", "lon": 151.09009, "lat": -33.79162}, {"n": "Island Radio", "t": "东南亚融合", "r": "3", "p": 65, "a": "Redfern", "d": "米面包、虾多士、炸鸡串、炒通菜", "i": "Redfern新Plaza里的东南亚融合餐吧，充满新派Surry Hills的氛围。前菜米面包、虾多士、炸鸡串和Kingfish刺身串，东南亚酱汁让人很有新鲜感。主菜牛排一般，炒通菜很好吃。菠萝船甜品普通。人均约65刀，好停车。", "ne": "Island Radio", "lon": 151.20694, "lat": -33.89356}, {"n": "蒋氏云南米线（老式炸鸡）", "t": "炸鸡/小吃", "r": "3", "p": 20, "a": "Burwood Chinatown", "d": "香辣和原味炸鸡；同场金陵名吃汤包、禾木凉拌贡菜和无骨鸡爪", "i": "云南米线店，柜台摆满老式炸鸡，香气十足，可以外带。", "ne": "Jiang's Yunnan Rice Noodles (old-style fried chicken)", "lon": 151.1032, "lat": -33.88201}, {"n": "The Local", "t": "Cafe", "r": "2", "p": 22, "a": "Enfield", "d": "Cold Brew（招牌Cold Brew Soft Serve当天机器坏）", "i": "开在住宅区街角的Cafe，招牌Cold Brew Soft Serve，但机器偶尔会坏。", "ne": "The Local", "lon": 151.09298, "lat": -33.88699}, {"n": "柴氏风味斋", "t": "北京菜", "r": "2", "p": 40, "a": "Chatswood", "d": "素丸子、麻酱黄瓜、香菜牛肚、芝麻羊肉、糖火烧", "i": "号称来自北京的米其林推荐店，口味不算正宗。牛肉面几乎没味道，烧饼很干；素丸子、麻酱黄瓜、香菜牛肚、芝麻羊肉和糖火烧都还行。人均约40刀。", "ne": "Chai's Flavour House", "lon": 151.17472, "lat": -33.79137}, {"n": "Beehive Cafe Restaurant", "t": "南美Cafe", "r": "3", "p": 40, "a": "Beecroft", "d": "脆皮猪五花、海鲜意面、煎盲槽鱼、牛肉汉堡", "i": "学校旁的南美小Cafe，食客多是退休长者，氛围悠闲。脆皮猪五花、海鲜意面、煎盲槽鱼和牛肉汉堡都有模有样。每月有拉丁舞之夜和西班牙海鲜饭之夜等活动。人均约40刀。", "ne": "Beehive Cafe Restaurant", "lon": 151.06501, "lat": -33.74902}, {"n": "Scala Lane", "t": "意大利菜", "r": "4", "p": 65, "a": "Wynyard Lane, CBD", "d": "佛卡夏配烤大虾、三款意面、桌前现挖提拉米苏", "i": "意大利餐厅，节日也不强制套餐。佛卡夏配烤大虾，酱汁很好；三款意面各有特色；主菜鱼和牛排稍普通。提拉米苏在桌边现挖，非常好吃，很多人会加点第二份。", "ne": "Scala Lane", "lon": 151.2134, "lat": -33.86314}, {"n": "Hi Pocha", "t": "韩国酒馆", "r": "3", "p": 40, "a": "Lidcombe", "d": "无骨辣鸡爪套餐、辣花蛤", "i": "Lidcombe很红的韩国酒馆，晚上常要排队，下午四点多可以外带。无骨辣鸡爪、蒸蛋汤和紫菜饭团的套餐搭配得极好；辣花蛤很入味，剩下的汤还能做火锅底。四个菜约77刀，很实惠。", "ne": "Hi Pocha", "lon": 151.04229, "lat": -33.86626}, {"n": "Prince Bakery & Cafe", "t": "韩式烘焙", "r": "3", "p": 12, "a": "Lidcombe", "d": "番薯紫薯蛋糕（57刀）", "i": "韩国区的烘焙Cafe。番薯紫薯蛋糕外表朴素，里面两层紫薯泥夹心还有紫薯块，很有嚼劲，57刀含巧克力字牌。还有香蕉造型蛋糕和炸三明治等韩式面包。", "ne": "Prince Bakery & Cafe", "lon": 151.05251, "lat": -33.865}, {"n": "1912 Dumpling Bar 小籠館", "t": "小笼包", "r": "2", "p": 22, "a": "Burwood", "d": "汤包、天王烤鸭包、钟水饺", "i": "新开的小笼包店，大圆窗能看到阿姨现场包小笼包。汤包、天王烤鸭包和钟水饺味道一般，汤汁不够多。价格很贵，四样约60刀。", "ne": "1912 Dumpling Bar", "lon": 151.10879, "lat": -33.87365}, {"n": "冒笑笑冒菜", "t": "冒菜", "r": "2", "p": 22, "a": "Burwood", "d": "香辣猪蹄、香辣鸡爪、冒烤鸭", "i": "网评较差的冒菜店，实际没那么难吃。香辣猪蹄和香辣鸡爪软烂入味；冒菜只有咸辣、少了香气；冒烤鸭用整根鸭腿配卤粉，很过瘾。店主是一位女生独力经营。", "ne": "Mao Xiaoxiao Maocai", "lon": 151.09754, "lat": -33.87677}, {"n": "Jiggle Cheesecake", "t": "芝士蛋糕", "r": "3", "p": 9, "a": "Carlingford Court", "d": "芝士蛋糕、蛋挞、嫩仙草豆浆", "i": "美食广场里开了很久的芝士蛋糕店，迷你尺寸9刀，有原味、草莓和抹茶。芝士蛋糕软嫩清淡，非常好吃；蛋挞口味多，斑斓和咖啡款不错，但不如芝士蛋糕出彩。嫩仙草豆浆可以调甜度。", "ne": "Jiggle Cheesecake", "lon": 151.04609, "lat": -33.78506}, {"n": "重庆小面面", "t": "重庆小面", "r": "2", "p": 18, "a": "Chatswood（夸父炸串旁）", "d": "重庆小面", "i": "Chatswood火车站出口小美食广场里的重庆小面，点套餐较划算，含面、凉菜和饮料。小面单点没有肉，偏寡淡，可以配隔壁夸父炸串一起拌着吃。", "ne": "Chongqing Xiaomian", "lon": 151.18103, "lat": -33.80481}, {"n": "夸父炸串", "t": "炸串", "r": "4", "p": 20, "a": "Chatswood（火车站旁小美食广场）", "d": "炸串", "i": "Chatswood火车站出口小美食广场里的炸串，是Chatswood最好吃的炸串之一，配重庆小面一起拌着吃很香。", "ne": "Kuafu Fried Skewers", "lon": 151.18741, "lat": -33.79115}, {"n": "LuYu 卤遇麻辣烫", "t": "麻辣烫", "r": "3", "p": 22, "a": "Eastwood（火车站韩国边对面）", "d": "麻辣烫、炸卤", "i": "Eastwood火车站韩国区出口对面的麻辣烫，炸卤很好吃。食材选择比开业时多，卤鸡爪还会剪好指甲。常有现金付款送饮品等优惠，份量大。", "ne": "LuYu Malatang", "lon": 151.0747, "lat": -33.78534}, {"n": "Lim's Hot Bread", "t": "越南包", "r": "3", "p": 11, "a": "Eastwood", "d": "脆皮猪五花越南包", "i": "Eastwood要排队的越南包店，傍晚常有十几人，但大约十分钟就能排到。脆皮猪五花越南包很香，但没有传说中那么神。一个11刀，够分两顿，很划算。", "ne": "Lim's Hot Bread", "lon": 151.08105, "lat": -33.79882}, {"n": "Uncle Wang", "t": "江浙点心", "r": "2", "p": 40, "a": "Zetland", "d": "小笼包、三色锅贴、凉拌牛杂", "i": "Zetland的江浙点心，比网评好，但价格略贵。盐水鸭非常咸；三色锅贴颜值高但皮偏厚；小笼包爆汁好吃，五个十几刀；凉拌牛杂辣中带甜。人均约40刀。", "ne": "Uncle Wang", "lon": 151.2082, "lat": -33.90782}, {"n": "Lune Croissanterie Rosebery", "t": "可颂", "r": "2", "p": 12, "a": "Rosebery", "d": "Four Cheese可颂", "i": "墨尔本名店Lune在Rosebery的店，宽敞透明，像面包工厂。Four Cheese可颂好吃但没有惊喜，可能要选招牌Jam & Cream款才对。", "ne": "Lune Croissanterie Rosebery", "lon": 151.20421, "lat": -33.91985}, {"n": "Avner's", "t": "贝果烘焙", "r": "3", "p": 14, "a": "Surry Hills", "d": "巧克力贝果", "i": "开放式厨房的贝果烘焙店，价格实惠，贝果占了大半货架。巧克力贝果配黄油好吃，店员很热情。", "ne": "Avner's", "lon": 151.2082, "lat": -33.89249}, {"n": "228 Hawker Malay Chinese Cuisine", "t": "马来菜", "r": "4", "p": 25, "a": "Burwood", "d": "海南鸡、炸鸡椰浆饭、滑蛋河粉", "i": "Burwood Rd新开的马来餐厅，开业期间排长队。价格实惠，味道好：海南鸡特别嫩；炸鸡椰浆饭的炸鸡一咬就出汁；滑蛋河粉芡汁浓郁，裹着河粉和海鲜，却不油腻。", "ne": "228 Hawker Malay Chinese Cuisine", "lon": 151.10871, "lat": -33.8809}, {"n": "888 GOGI KOREAN BBQ", "t": "韩烤", "r": "2", "p": 45, "a": "Eastwood", "d": "和牛、牛舌、蒸蛋", "i": "原Jonga Jip位置的韩式烤肉店。和牛和牛舌都不错但不算出众；蒸蛋小巧可爱；炸鸡普通。人均约45刀。", "ne": "888 GOGI KOREAN BBQ", "lon": 151.0874, "lat": -33.78515}, {"n": "金陵小吃 Nanjing Gourmet", "t": "南京小吃", "r": "3", "p": 18, "a": "Haymarket（唐人街牌坊下）", "d": "葱油鸡、汤包、牛肉锅贴", "i": "唐人街牌楼下的南京小吃店。葱油鸡很嫩，葱油可以拌饭拌面；牛肉锅贴普通；汤包非常好吃，咬一口汤汁像瀑布一样流出来。价格偏贵，三样约44刀。", "ne": "Nanjing Gourmet", "lon": 151.20121, "lat": -33.88548}, {"n": "禧街炸串", "t": "炸串", "r": "2", "p": 20, "a": "Haymarket", "d": "脆皮鸡柳、辣缸豆苕皮", "i": "路边香气四溢的炸串摊，选择不多，没有青椒。脆皮鸡柳和辣缸豆苕皮味道过得去但不出彩，苕皮偏软，带回家用空气炸锅复炸会更好吃。不如夸父和建德大厦门口那家。", "ne": "Xi Jie Fried Skewers", "lon": 151.21147, "lat": -33.87576}, {"n": "朱妈妈", "t": "饺子馆", "r": "3", "p": 20, "a": "唐人街", "d": "饺子外带", "i": "唐人街的老牌饺子馆，可以外带，味道和十几年前一样。", "ne": "Mother Chu's", "lon": 151.1957, "lat": -33.87718}, {"n": "Giuls", "t": "意大利菜", "r": "3", "p": 50, "a": "Surry Hills", "d": "佛卡夏、炸虾、烤鱿鱼、提拉米苏", "i": "还不太有名气的意大利小餐厅。佛卡夏配的橄榄油很香；炸虾嫩；蝴蝶面偏奶，里面的意大利香肠很好吃；烤鱿鱼又嫩又弹牙，最出色；Fish Crudo普通。提拉米苏蓬松甜蜜，非常好吃。人均约50刀。", "ne": "Giuls", "lon": 151.21846, "lat": -33.88273}, {"n": "Jenny's Bun 珍妮家的面食", "t": "包子", "r": "3", "p": 3, "a": "Chatswood", "d": "猪肉大葱包、猪肉酸豆角包、三鲜包", "i": "Chatswood的包子店，一个3刀，6个有优惠。肉包个头偏小但包子皮松软，猪肉大葱、猪肉酸豆角和三鲜都好吃，适合买回家当早餐。", "ne": "Jenny's Bun", "lon": 151.17138, "lat": -33.79774}, {"n": "Kajiken 歌志轩", "t": "拌面", "r": "4", "p": 20, "a": "Chatswood", "d": "和牛拌面加温泉蛋", "i": "日本拌面连锁店，城市和其他区都有分店。和牛半生熟很嫩，温泉蛋和酸奶酱拌面很好吃。一整碗吃到后面会腻，一大一小合吃一碗面加一份小食刚好。", "ne": "Kajiken", "lon": 151.18878, "lat": -33.80191}, {"n": "Chubby Bun", "t": "汉堡", "r": "3", "p": 13, "a": "Gordon", "d": "Kids Cheese Burger", "i": "Gordon迷你高尔夫旁的汉堡店，像餐车一样可爱。芝士汉堡烤肉香气浓郁，牛肉饼嫩香，用撒满芝麻的面包。儿童汉堡也要13刀，偏贵。", "ne": "Chubby Bun", "lon": 151.15618, "lat": -33.75473}, {"n": "Slowbreads", "t": "烘焙", "r": "3", "p": 12, "a": "Roseville", "d": "巧克力牛角包、巧克力蛋糕", "i": "橱窗挂着悉尼Royal Fine Food冠军旗帜的烘焙店，酸种面包和法棍很受欢迎。巧克力牛角包和巧克力蛋糕都很法式，香气十足。路过值得试，不必专程。", "ne": "Slowbreads", "lon": 151.17799, "lat": -33.78301}, {"n": "Hi Kitchen", "t": "韩国菜", "r": "4", "p": 25, "a": "Epping", "d": "猪杂血肠汤、炸鸡、芝士玉米", "i": "Epping少有人知的韩国餐厅，店里干净宽敞。桌上的迷你小虾米和紫苏粉可以自由加；猪杂血肠汤加虾米很好吃，血肠里的粉条有嚼劲。炸鸡嫩脆，可以配芝士玉米吃。人均约25刀。", "ne": "Hi Kitchen", "lon": 151.08101, "lat": -33.76994}, {"n": "Habibi Juice", "t": "果汁冰沙", "r": "2", "p": 10, "a": "Pennant Hills", "d": "Strawberry Mango冰沙", "i": "Pennant Hills火车站对面的果汁冰沙店，像是为放学学生开的。草莓芒果冰沙鲜榨，一小杯10刀偏贵。也有Acai。", "ne": "Habibi Juice", "lon": 151.0722, "lat": -33.73983}, {"n": "Butcherant", "t": "韩烤", "r": "4", "p": 30, "a": "Epping（Homebush也有）", "d": "和牛、牛舌", "i": "从Homebush开到Epping的韩式烤肉，进店先像在肉店一样选肉。鹿儿岛和牛选择多但很腻，普通和牛和牛舌就很好。小菜免费，可加点一盆生菜包肉。人均约30刀。", "ne": "Butcherant", "lon": 151.0801, "lat": -33.77606}, {"n": "Aster", "t": "景观酒吧", "r": "4", "p": 60, "a": "InterContinental Sydney", "d": "鸡尾酒", "i": "悉尼港景色最好的酒吧之一，海港大桥和歌剧院一览无遗。鸡尾酒造型漂亮，有吹泡泡和棉花糖装饰，很有仙气。", "ne": "Aster", "lon": 151.20911, "lat": -33.86405}, {"n": "Tonight", "t": "韩国融合小酒馆", "r": "3", "p": 40, "a": "Lidcombe", "d": "虾多士、Pipis汤、养乐多沙冰", "i": "Lidcombe很放松的韩国融合小酒馆，菜式不太传统。虾多士弹牙；Rose麻辣烫很辣很奶；Pipi汤看似平凡却让人停不下来。每桌配炸馄饨皮，很好吃。招牌养乐多沙冰收尾。人均约40刀。", "ne": "Tonight", "lon": 151.04362, "lat": -33.86001}, {"n": "Sailor Boy", "t": "泰国小吃", "r": "3", "p": 25, "a": "Darling Harbour（Playground旁）", "d": "九层塔煎盲槽鱼盖饭、咸蛋黄虾球面", "i": "Darling Harbour儿童游乐场旁的泰国小吃店，适合遛娃后解决晚饭。九层塔煎盲槽鱼盖饭的鱼很大片，煎得鲜嫩，九层塔香浓；咸蛋黄虾球面也香。人均约25刀。", "ne": "Sailor Boy", "lon": 151.199, "lat": -33.87301}, {"n": "巴适小厨", "t": "自贡菜", "r": "5", "p": 30, "a": "Zetland", "d": "火爆腰丝、干煸肥肠、渣渣牛肉、鲜椒爽脆、尖椒兔肉、泡椒仔鸡", "i": "Zetland的自贡菜，悉尼自贡菜热潮的起点，现在周末中午排队不久。火爆腰丝、干煸肥肠、渣渣牛肉、肉末茄子、鲜椒爽脆、尖椒兔肉、泡椒仔鸡和冒菜都好吃，而且每道辣味都不同：泡椒咸酸、鲜椒清香、干煸带甜，冒菜有五香味。人均约30刀，便宜好吃。", "ne": "Bashi Kitchen", "lon": 151.20964, "lat": -33.90423}, {"n": "Ting Hao A 挺好啊", "t": "韩式中华料理", "r": "4", "p": 40, "a": "Chatswood", "d": "奶油虾、糖醋肉、炸酱面、肉沫茄子", "i": "绿底红字大招牌的韩式中华料理。奶油虾个大，面衣轻盈；糖醋肉用厚切里脊但很嫩，果酱汁里还有西柚；炸酱面韧性十足；肉末茄子到位。适合同事聚餐和家庭聚会，也有一人套餐。人均约40刀。", "ne": "Ting Hao A", "lon": 151.17924, "lat": -33.78891}, {"n": "Happi Burger", "t": "汉堡", "r": "2", "p": 20, "a": "Lindfield", "d": "炸鸡汉堡", "i": "黄色调的可爱小汉堡店，菜单丰富。炸鸡汉堡肉排脆嫩，不错。", "ne": "Happi Burger", "lon": 151.16784, "lat": -33.77512}, {"n": "Bakerie@", "t": "烘焙", "r": "3", "p": 12, "a": "Gordon", "d": "葡挞、开心果Cannoli、白糖面包", "i": "北区有名的烘焙店，下午仍有不少面包和肉派。开心果牛角包和杏仁牛角包最受欢迎，葡挞、开心果Cannoli和白糖大面包也不错。三件十几刀，价格不贵。", "ne": "Bakerie@", "lon": 151.14766, "lat": -33.75451}, {"n": "Gusta", "t": "Pizza/意面", "r": "3", "p": 20, "a": "Pennant Hills", "d": "Pizza、辣意面", "i": "Pizza和意面店，机烤但好吃，每道工序都有专人负责，很忙碌。可以要求少放芝士。意面很辣很过瘾。人均约20刀。", "ne": "Gusta", "lon": 151.07364, "lat": -33.7362}, {"n": "Afterglow Eatery", "t": "Cafe", "r": "4", "p": 30, "a": "Epping Park", "d": "Fish Tacos、虾汉堡、鸡蛋培根卷", "i": "Epping量大价优的Cafe，门口阳光很好。Fish Tacos份量大；虾汉堡的虾饼里有好几只完整的虾，只是略焦；鸡蛋培根卷里还有薯饼，适合外带当早餐。人均约30刀。", "ne": "Afterglow Eatery", "lon": 151.08614, "lat": -33.77174}, {"n": "Meet Bun", "t": "粤菜/每周配送", "r": "4", "p": 30, "a": "Cherrybrook Shopping Village（每周配送）", "d": "每周配送三菜套餐", "i": "粤菜大厨掌勺的家庭每周配送服务，每天有四道菜，可选两菜、三菜或四菜，菜式不重复，下午4到6点送到家，微波炉加热即可。2大2小一周三菜套餐约210刀，适合忙碌的双职工家庭，主要配送西北区。", "ne": "Meet Bun", "lon": 151.04499, "lat": -33.722}, {"n": "Morena", "t": "南美菜", "r": "2", "p": 130, "a": "Martin Place", "d": "烤牛舌、牛排、秘鲁鱼生", "i": "热情洋溢又有格调的南美餐厅，服务员很会推销。餐包不推荐；两道秘鲁风Raw鱼生不错；烤牛舌和牛排很好吃；Beef Tartare加了大量洋葱和酱料，盖过牛肉香，可以不点。人均约130刀，偏贵，适合约会。", "ne": "Morena", "lon": 151.21166, "lat": -33.86522}, {"n": "一呷一嗦（已关）", "t": "长沙米粉", "r": "4", "p": 18, "a": "Eastwood", "d": "长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花、卤牛肉", "i": "已关门的Eastwood长沙米粉店，原址现为老细屋里。曾以长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花和卤牛肉闻名。", "ne": "Yi Jia Yi Suo (closed)", "lon": 151.0714, "lat": -33.79175}, {"n": "Khanom House", "t": "泰式烘焙", "r": "3", "p": 10, "a": "Chippendale", "d": "抹茶芝士蛋糕、Pandan炸面包", "i": "蓝色小房子里新开的泰式烘焙店，以前在各市集流动摆摊。很多甜品是斑斓口味，抹茶芝士蛋糕和斑斓炸面包都好吃。两件约20刀，略贵。", "ne": "Khanom House", "lon": 151.19467, "lat": -33.8845}, {"n": "小龙坎老火锅", "t": "火锅", "r": "4", "p": 70, "a": "Dixon One, Haymarket", "d": "霸王牛肉、椒麻大刀牛舌", "i": "连锁川味火锅，近年明显变好吃了。霸王牛肉辣到飙泪，非常刺激；椒麻大刀牛舌也是必点。人均约70刀。", "ne": "Xiaolongkan Hotpot", "lon": 151.20873, "lat": -33.8851}, {"n": "My Zakaya", "t": "居酒屋", "r": "3", "p": 80, "a": "Surry Hills", "d": "炖蛋、和牛排、三文鱼腩寿司、烤鳕鱼、生腌天堂虾、炸鸡", "i": "Surry Hills的日式居酒屋，菜式小份，可以多点几样。炖蛋、和牛排、三文鱼腩寿司、烤鳕鱼、生腌天堂虾和炸鸡都好吃。氛围轻松，适合下班后来。人均约80刀，略贵。", "ne": "My Zakaya", "lon": 151.20273, "lat": -33.88419}, {"n": "Mokomoko Patisserie", "t": "甜品", "r": "3", "p": 14, "a": "Quay St, Haymarket", "d": "现挤泡芙、小蛋糕", "i": "市中心粉嫩的甜品店，波浪纹装修像集装箱。泡芙现挤，比小蛋糕稍好吃；小蛋糕个个可爱，两人分一个刚好。隆重的草莓蛋糕和圆圆的提拉米苏也值得试。", "ne": "Mokomoko Patisserie", "lon": 151.2055, "lat": -33.87175}, {"n": "Pasticceria Tamborrino", "t": "意大利甜品", "r": "3", "p": 14, "a": "Five Dock", "d": "迷你提拉米苏、开心果挞、开心果泡芙", "i": "Five Dock意大利街上常排队的传统意式糕饼店，品类有几十种。悉尼独有的Tetta Della Monaca很抢手，容易售罄。迷你提拉米苏、巧克力炸面包、开心果挞和开心果泡芙都很好吃。", "ne": "Pasticceria Tamborrino", "lon": 151.12901, "lat": -33.86601}, {"n": "Dino's", "t": "意式三明治", "r": "4", "p": 18, "a": "Five Dock", "d": "Ultimate Deli佛卡夏三明治", "i": "Five Dock主街远近闻名的意式三明治和Pizza店。Ultimate Deli厚三明治用蓬松有韧劲的佛卡夏，夹奶酪、火腿、红椒和绿叶菜，搭配丰富，非常好吃。", "ne": "Dino's", "lon": 151.12783, "lat": -33.86512}, {"n": "Late Night Table", "t": "韩国小酒馆", "r": "3", "p": 70, "a": "North Strathfield", "d": "蜂巢米酒、刺身拼盘、海胆意面", "i": "人气韩国小酒馆，以前晚上要排长龙。招牌蜂巢米酒很好喝；刺身拼盘新鲜好吃；海胆意面很咸很油。人均约70刀，不算便宜。", "ne": "Late Night Table", "lon": 151.08964, "lat": -33.85521}, {"n": "Metatai", "t": "铁板汉堡排", "r": "3", "p": 28, "a": "Macquarie Shopping Centre", "d": "铁板汉堡排", "i": "新开的铁板汉堡排店，厨师把肉排煎到半熟后放在桌前小铁板上，由客人自己掌握熟度。可以加芝士片和大量芝士丝，很浓郁。桌上有七种调味料，一块肉能吃出七种味道。牛味略重，但很好玩，值得去一次。", "ne": "Metatai", "lon": 151.11567, "lat": -33.77553}, {"n": "Zilver 同乐轩", "t": "早茶", "r": "3", "p": 40, "a": "Westfield Chatswood", "d": "烧卖、虾饺", "i": "曾是悉尼饮茶界的龙头，墙上挂满来访香港明星的合影，现在Chatswood也有分店。出品依然稳定，烧卖和虾饺扎实，皮不会一夹就散。人均约40刀，价格偏高。", "ne": "Zilver", "lon": 151.17567, "lat": -33.80406}, {"n": "Cafe Elation", "t": "Cafe", "r": "3", "p": 22, "a": "Gladesville", "d": "抹茶拿铁", "i": "躲在路边树荫下的小Cafe，林荫道上摆着一排桌子，春天会飘落小黄花，环境很美。抹茶拿铁不错。", "ne": "Cafe Elation", "lon": 151.12802, "lat": -33.833}, {"n": "Nikan Persian Restaurant", "t": "波斯菜", "r": "2", "p": 35, "a": "Ryde", "d": "鸡肉串、烤鸡腿配酸奶锅巴", "i": "网上有人称为悉尼第一的伊朗餐厅。长粒咸米饭用调味肉汤煮成，松软入味；鸡肉串稳妥；烤鸡腿配酸奶锅巴很有异域风情。整体和其他伊朗餐厅差别不大。", "ne": "Nikan Persian Restaurant", "lon": 151.10894, "lat": -33.81558}, {"n": "Du Plessy Pralin & Otello Chocolates", "t": "巧克力蛋糕", "r": "3", "p": 15, "a": "West Pymble", "d": "榛果巧克力蛋糕", "i": "因华人社交媒体意外走红的西人巧克力店，招牌榛果巧克力蛋糕每人限购一个，建议开门前就去排队。巧克力慕斯浓郁醇厚，味道像金沙巧克力，对亚洲人来说偏甜，配茶刚好。老板大叔很友善。", "ne": "Du Plessy Pralin & Otello Chocolates", "lon": 151.13801, "lat": -33.76401}, {"n": "Princess J 焦功煮", "t": "麻辣烫/香锅", "r": "3", "p": 22, "a": "Burwood", "d": "麻辣香锅配剁椒", "i": "Burwood宽敞整洁的麻辣烫和香锅店，食材选择多，腌制鲜肉有十来种。剁椒和XO酱免费添加，剁椒配麻辣香锅非常好吃。炸串也值得一试。", "ne": "Princess J", "lon": 151.1037, "lat": -33.87134}, {"n": "麵屋猪一 Inoichi Ramen", "t": "日式拉面", "r": "2", "p": 22, "a": "Burwood", "d": "自定义拉面", "i": "华人区新开的连锁日式拉面店，下单时可以调整辣度、面条软硬、配菜和油量。汤头浓郁，面条软硬适中，作为普通拉面可以，不必专程。", "ne": "Inoichi Ramen", "lon": 151.09952, "lat": -33.88147}, {"n": "BrewTopia", "t": "咖啡/酸奶冰淇淋", "r": "3", "p": 9, "a": "Burwood", "d": "咖啡、酸奶冰淇淋", "i": "Burwood的咖啡和酸奶冰淇淋店，粉色装潢像芭比玩具世界，少女心十足，分店有蓝色和绿色主题。", "ne": "BrewTopia", "lon": 151.11111, "lat": -33.8762}, {"n": "Sir Manong", "t": "菲律宾菜", "r": "3", "p": 19, "a": "Chatswood Chase", "d": "烤猪手", "i": "Chatswood Chase的菲律宾菜，烤猪手19刀，猪皮咬下去嘎嘣脆，嚼起来又是韧韧的胶质，猪肉也嫩。适合外带配啤酒。", "ne": "Sir Manong", "lon": 151.19079, "lat": -33.79478}, {"n": "Fabbrica Pasta Bar", "t": "意大利面", "r": "4", "p": 37, "a": "Chatswood Chase", "d": "蝴蝶面、自组三明治、提拉米苏", "i": "Chatswood Chase美食广场里的Fabbrica意面，不用再跑市中心。蝴蝶面带辣，冲淡了腻感；可以用面包、Salami和酱料自己组三明治。提拉米苏撒少许盐，湿软绵密，非常好吃。人均约37刀。", "ne": "Fabbrica Pasta Bar", "lon": 151.17187, "lat": -33.79311}, {"n": "Getbawi", "t": "韩式鱼生", "r": "4", "p": 47, "a": "Eastwood", "d": "鱼生配海胆、炸大虾、辣蟹汤（38刀三只蟹）", "i": "Eastwood的韩式鱼生店，纯鱼生不腌制，有三种鱼和海胆，蘸辣蒜蓉豆瓣酱，有点潮州鱼生的风味。炸大虾比手掌还大，香脆必点。最推荐辣蟹汤，38刀有3只螃蟹，用料十足，汤拌饭非常好吃。人均约47刀。", "ne": "Getbawi", "lon": 151.0888, "lat": -33.79591}, {"n": "牛魔王潮汕牛肉火锅", "t": "潮汕牛肉火锅", "r": "2", "p": 50, "a": "Eastwood", "d": "吊龙伴、腐乳鸡翅、湿炒牛肉粿条", "i": "新开的潮汕牛肉火锅，玻璃窗前有师傅现场切牛肉。吊龙伴最香，五花趾和雪花一般。生腌三文鱼马马虎虎，湿炒牛肉粿条还行，腐乳鸡翅好吃。整体中等偏上，潮味不算浓。", "ne": "Niu Mo Wang Teochew Beef Hotpot", "lon": 151.07923, "lat": -33.78291}, {"n": "It's Recess", "t": "三明治", "r": "3", "p": 13, "a": "Surry Hills", "d": "牛油果鸡肉三明治", "i": "克莱因蓝的清新三明治店。牛油果鸡肉三明治吐司松软，酱料好吃，牛油果和鸡肉新鲜，营养均衡，适合当午餐便当。每个约12到15刀。", "ne": "It's Recess", "lon": 151.21572, "lat": -33.89211}, {"n": "La Pizza Bella", "t": "Pizza", "r": "3", "p": 8.9, "a": "Darlinghurst", "d": "Pepperoni大片Pizza", "i": "超大尺寸Pizza店，一个是普通Pizza的三倍大，一片比手掌还大。经典Pepperoni一片8.9刀，店员会帮忙加热，软乎乎油滋滋，一片就饱。", "ne": "La Pizza Bella", "lon": 151.22097, "lat": -33.87958}, {"n": "ellu cafe", "t": "韩式Cafe", "r": "3", "p": 40, "a": "Surry Hills", "d": "蟹肉Pasta、抹茶拿铁", "i": "评分4.8的韩式小Cafe，粉色砖砌小房子，内部是古朴的两层小民居，桌子不多但精致。二楼窗边座位最抢手，可以看街景。蟹肉Pasta不错。人均约40刀。", "ne": "ellu cafe", "lon": 151.21249, "lat": -33.87876}, {"n": "OMMI DON", "t": "台式丼饭", "r": "3", "p": 18, "a": "Chatswood Lemon Grove", "d": "极致三拼丼、冷冻盐酥鸡和卤肉燥", "i": "台式丼饭店，也是冷冻盐酥鸡和卤肉燥等台湾小吃的品牌，门店可以买冷冻品。极致三拼丼有排骨、虾卷和香肠，下面铺酸菜和卤肉燥，很满足。", "ne": "OMMI DON", "lon": 151.1846, "lat": -33.8051}, {"n": "Chew Babe Pet Grooming Cafe", "t": "宠物Cafe/佛卡夏", "r": "3", "p": 15, "a": "Macquarie Park", "d": "Pistachio Head、Not So Boring、Croques", "i": "宠物美容店兼Cafe，可以买猫狗零食，吃饭时还能看到狗狗洗澡。佛卡夏三明治份量很大，两个女生分一份就够。Pistachio Head的开心果碎配意大利香肠很搭；Not So Boring的辣鸡肉拌得香；裹满火烤芝士的Croques很香。", "ne": "Chew Babe Pet Grooming Cafe", "lon": 151.12209, "lat": -33.78073}, {"n": "Simply Sandwiches", "t": "越南包", "r": "2", "p": 13, "a": "Crows Nest", "d": "脆皮猪五花越南包", "i": "North Sydney上班族会专程来买的越南包店。猪五花依然香脆油润，但近来味道不太稳定，有的地方很甜，有的地方很咸。一个13刀，切半能吃两顿。", "ne": "Simply Sandwiches", "lon": 151.20611, "lat": -33.82971}, {"n": "Ken-Chan Curry", "t": "日式咖喱/二郎系拉面", "r": "4", "p": 20, "a": "Neutral Bay", "d": "炸鸡滑蛋咖喱饭、二郎系拉面、金奖炸鸡", "i": "很有特色的日式咖喱屋，还有澳洲少见的二郎系拉面。炸鸡滑蛋咖喱饭很受小朋友欢迎。二郎系拉面加了猪肥肉，汤底油脂香扑鼻，像日式版卤肉饭，怕腻可以把肥肉撇掉。店里的炸鸡得过金奖。人均约20刀。", "ne": "Ken-Chan Curry", "lon": 151.21686, "lat": -33.83012}, {"n": "Il Eok Jo", "t": "韩式腌鱼生", "r": "3", "p": 40, "a": "Lidcombe", "d": "芝麻油紫苏叶腌鱼生", "i": "Lidcombe知名度较高的韩式鱼生店，鱼生先用芝麻油和紫苏叶腌过，配多种重口小菜和酱料，用紫菜包着吃，每卷都能换口味。人均约40刀。", "ne": "Il Eok Jo", "lon": 151.0462, "lat": -33.86901}, {"n": "The Brook Eatery", "t": "Cafe", "r": "3", "p": 22, "a": "Cherrybrook Village", "d": "提拉米苏、奥利奥蛋糕", "i": "菜单很大的社区Cafe，从早餐、午餐、下午茶到晚餐都有。提拉米苏和奥利奥蛋糕份量大得惊人，质朴实惠。", "ne": "The Brook Eatery", "lon": 151.04385, "lat": -33.72112}, {"n": "Miji Bar & Grill", "t": "日式餐吧", "r": "2", "p": 45, "a": "North Sydney", "d": "刺身、烤虾、温泉蛋炸鸡、鳕鱼定食", "i": "霓虹灯闪烁的日式餐吧，营造涩谷银座的氛围。午市菜单选择很少；刺身和烤虾不错，温泉蛋炸鸡满足；鳕鱼定食的味噌裹得太厚，很甜，盖过鱼味。晚市口碑更好。", "ne": "Miji Bar & Grill", "lon": 151.20721, "lat": -33.84183}, {"n": "Bar Lume Deli", "t": "意式Deli", "r": "3", "p": 20, "a": "North Sydney", "d": "Salami配茄子红椒番茄沙拉", "i": "North Sydney Metro站附近的意式Deli，Salami配茄子、红椒和番茄沙拉，看似朴素，味道浓郁，肉质鲜美。", "ne": "Bar Lume Deli", "lon": 151.20865, "lat": -33.8382}, {"n": "Yume Sushi", "t": "日料", "r": "3", "p": 35, "a": "North Strathfield", "d": "刺身、炸鸡排饭、炙烤寿司", "i": "韩国厨师经营的小日料店，外表普通但味道不错。刺身新鲜，炸鸡排饭香脆，三款炙烤寿司有模有样。人均约35刀。", "ne": "Yume Sushi", "lon": 151.08493, "lat": -33.85746}, {"n": "禚家 Cho Express", "t": "台式便当", "r": "5", "p": 10, "a": "Chatswood", "d": "卤肉饭、便当", "i": "掀起悉尼台式便当风潮的禚家，众多模仿者都比不上。柜台里的饭菜色泽明亮、干净诱人，卤肉饭在悉尼无人能及。一盒近10刀，百吃不腻。", "ne": "Cho Express", "lon": 151.18494, "lat": -33.78894}, {"n": "Smoque Brasserie", "t": "法餐", "r": "3", "p": 35, "a": "Chatswood", "d": "青口锅、牛排、鸭腿", "i": "Chatswood价格亲民的法式小馆，适合工作日午餐。青口锅、牛排和鸭腿味道都不错，除了薯条都很健康。人均约35刀。", "ne": "Smoque Brasserie", "lon": 151.17141, "lat": -33.80077}, {"n": "Ooshman", "t": "黎巴嫩卷饼", "r": "3", "p": 15, "a": "North Strathfield", "d": "卷饼、Cheese球", "i": "在悉尼有二十多家分店的黎巴嫩卷饼，饼皮是中东烤饼，非常香，配料有肉有菜有酱。个头很大，切成两半，半份加几颗芝士球就是一顿饭。", "ne": "Ooshman", "lon": 151.09097, "lat": -33.85856}, {"n": "The Place Poke & Pasta", "t": "韩式波奇碗", "r": "3", "p": 25, "a": "Eastwood", "d": "三文鱼波奇碗配荞麦面加煎五花", "i": "Eastwood火车站韩国区出口的韩式波奇碗和意面店。三文鱼刺身波奇配荞麦面，加特制芝麻酱油蛋黄酱非常好吃，还可以加3刀煎五花肉。一碗约25刀，偏贵。", "ne": "The Place Poke & Pasta", "lon": 151.07565, "lat": -33.79806}, {"n": "Kyue Japanese Restaurant", "t": "日式炸猪排", "r": "3", "p": 43, "a": "Willoughby", "d": "炸安格斯牛排、滑蛋炸猪排", "i": "新开的日式炸猪排店，桌上调味料特别多，每一口都能换味道。炸安格斯牛排和滑蛋炸猪排都好吃，炸衣酥脆，肉质新鲜。人均约43刀，偏贵。", "ne": "Kyue Japanese Restaurant", "lon": 151.199, "lat": -33.802}, {"n": "Butter Boy", "t": "饼干", "r": "3", "p": 8.2, "a": "Chatswood Chase", "d": "Milk Choc饼干", "i": "Chatswood Chase的饼干店，现场烘焙很新鲜。Milk Choc饼干很好吃，很甜。一块8.2刀，偏贵。", "ne": "Butter Boy", "lon": 151.19125, "lat": -33.79964}, {"n": "Shahan Persian Restaurant", "t": "波斯菜", "r": "3", "p": 35, "a": "West Pennant Hills", "d": "薄脆蘸酸奶、鸡羊肉串、番茄焖鸡腿、石榴籽咸饭", "i": "网上评分4.8的本地波斯餐厅。薄脆蘸酸奶是很好的开胃菜；鸡肉和羊肉串稳妥；番茄焖鸡腿也不错。咸米饭撒满石榴籽，寓意多福。", "ne": "Shahan Persian Restaurant", "lon": 151.0402, "lat": -33.75583}, {"n": "潮汕真味美食", "t": "潮汕卤味", "r": "4", "p": 20, "a": "Eastwood夜市", "d": "猪脚尖、圆蹄、猪耳、肥肠", "i": "Eastwood夜市新开的潮汕卤味摊，汕头阿姨很热情，可以先试吃。猪脚尖、圆蹄、猪耳和肥肠配蒜泥白醋和辣椒油都很好吃，潮汕人值得一试。", "ne": "Chaoshan Zhenwei", "lon": 151.09078, "lat": -33.78878}, {"n": "Praus Frozen Yogurt", "t": "酸奶冰淇淋", "r": "3", "p": 8, "a": "Gordon", "d": "自选酸奶冰淇淋", "i": "Gordon的自助酸奶冰淇淋店，可以自己装酸奶、加配料，小朋友很喜欢。人均约8刀。", "ne": "Praus Frozen Yogurt", "lon": 151.15409, "lat": -33.75972}, {"n": "倔爷火锅", "t": "四川火锅", "r": "4", "p": 50, "a": "Burwood（原大龙火锅）", "d": "嫩牛肉、肥肠、毛肚、鸭肠、虾滑", "i": "原大龙火锅位置新开的四川火锅，80年代复古风，像悉尼版文和友，很有氛围。嫩牛肉、肥肠、毛肚、鸭肠和虾滑都很好吃。酱料台有店家秘制酱料。", "ne": "Jue Ye Hotpot", "lon": 151.09796, "lat": -33.87352}, {"n": "The Honest Chicken", "t": "葡式烤鸡", "r": "3", "p": 22, "a": "Cherrybrook Village", "d": "烤鸡腿、土豆沙拉", "i": "葡式烤鸡店，烤鸡好吃又不太油腻，一只鸡腿就能吃饱。土豆沙拉奶香浓郁。", "ne": "The Honest Chicken", "lon": 151.04518, "lat": -33.72383}, {"n": "Kamado Japanese Kitchen", "t": "日料", "r": "3", "p": 35, "a": "Cherrybrook Village", "d": "Salmon Taco、炙烤三文鱼寿司、Carpaccio、唐扬炸鸡", "i": "Cherrybrook Village购物中心的日料店，周五晚上不订位通常没座位。三文鱼菜式都好吃，Salmon Taco、炙烤三文鱼寿司和三文鱼薄切都值得点；唐扬炸鸡水嫩多汁。人均约35刀。", "ne": "Kamado Japanese Kitchen", "lon": 151.04666, "lat": -33.7202}, {"n": "Pantai Pan Asian Restaurant", "t": "泰国菜", "r": "3", "p": 25, "a": "Eastwood", "d": "生菜包猪颈肉", "i": "Eastwood韩国区新开的泰国菜，由韩国人经营，满眼绿色装潢，味道不错。生菜包猪颈肉最好吃，桌上的辣酱是老干妈，可以自己配青辣椒。人均约25刀。", "ne": "Pantai Pan Asian Restaurant", "lon": 151.07185, "lat": -33.78711}, {"n": "Thuan Thien Bakery", "t": "越南包", "r": "3", "p": 7, "a": "North Strathfield", "d": "脆皮猪五花越南卷", "i": "古朴的老式越南面包店，还卖七八十年代流行的奶油蛋糕。脆皮猪五花越南包只要7刀，个头小一些，配料和酱料稍逊，但能吃饱，非常实惠。", "ne": "Thuan Thien Bakery", "lon": 151.08702, "lat": -33.85392}, {"n": "Savoury Dining", "t": "越南粉", "r": "3", "p": 40, "a": "North Strathfield", "d": "40刀豪华牛肉粉（牛骨髓、牛排骨）", "i": "豪华版越南牛肉粉，一碗40刀，除了和牛片和牛肉丸，还有一根大牛骨髓和一大块牛排骨。牛骨髓化进汤里让汤更浓郁鲜美，牛排骨一抿就脱骨。贵但不算过分，服务员还会送小朋友气球。", "ne": "Savoury Dining", "lon": 151.0861, "lat": -33.86004}, {"n": "Shalom Indonesian Restaurant", "t": "印尼菜", "r": "4", "p": 12, "a": "Sussex St, CBD", "d": "印尼烤鸡腿配Balinese Sauce", "i": "Sussex St上默默经营多年的印尼餐厅。印尼烤鸡腿非常香，配秘制Balinese Sauce很好吃。一份12刀，不贵。", "ne": "Shalom Indonesian Restaurant", "lon": 151.19687, "lat": -33.88359}, {"n": "Banksia Bakehouse", "t": "蛋糕", "r": "3", "p": 14, "a": "Grosvenor Place, George St, CBD", "d": "心形蛋糕", "i": "小巧可爱的心形蛋糕，适合节日送礼，颜色偏鲜艳。", "ne": "Banksia Bakehouse", "lon": 151.21215, "lat": -33.85774}, {"n": "Thirty 7even Dining", "t": "台湾融合", "r": "3", "p": 40, "a": "Macquarie Park", "d": "紫菜Cracker、黑松露萝卜糕、盐酥鸡、虾多士", "i": "Macquarie Park新楼盘下的台湾融合菜。紫菜脆片、黑松露萝卜糕、盐酥鸡和虾多士都好吃，虾多士又脆又香，虾个头大。人均约40刀，不便宜，附近可以来尝鲜，不必专程。", "ne": "Thirty 7even Dining", "lon": 151.12156, "lat": -33.77288}, {"n": "ParkBongSook 朴奉淑餐馆", "t": "韩式烤排骨/脊骨", "r": "3", "p": 30, "a": "Eastwood", "d": "盐烤排骨（60刀）、辣酱烤脊骨配餐包", "i": "韩式烤排骨和脊骨店。辣酱烤脊骨配餐包，脊骨炖得很嫩，需要双手慢慢啃，骨缝的筋肉和外层瘦肉口感各不相同；餐包蘸辣酱很香。人均约30刀。", "ne": "ParkBongSook", "lon": 151.08462, "lat": -33.7991}, {"n": "Le Salle Dining by Bar Chaplin", "t": "小型Fine Dining", "r": "4", "p": 118, "a": "Surry Hills", "d": "每周更新五道菜", "i": "每晚只接待10位客人的小型Fine Dining，主厨夫妇在开放式厨房里忙碌，灯光昏暗，温馨浪漫。菜单每周更换，五道菜118刀，每位需点一杯酒配餐，越到后面越好吃。缺点是开放式厨房油烟重，吃完身上会有味道。很适合约会。", "ne": "Le Salle Dining by Bar Chaplin", "lon": 151.2039, "lat": -33.89056}, {"n": "Glass Brasserie", "t": "西餐", "r": "3", "p": 90, "a": "Hilton Sydney", "d": "Sashimi、蟹饼、鱿鱼、烤大虾", "i": "希尔顿酒店里的西餐厅，大片落地窗正对QVB和George St，景观典雅。前菜刺身和蟹饼，主菜鱿鱼和烤大虾，都以海鲜为主。不含酒和甜品人均约90刀，偏贵，但氛围很好，适合约会和姐妹聚会。", "ne": "Glass Brasserie", "lon": 151.2039, "lat": -33.87245}, {"n": "Mr Perfect Skewer BBQ 百铺乐烤串", "t": "延边烤串", "r": "4", "p": 55, "a": "Lidcombe", "d": "乳酸菌牛肉串、牛排大串", "i": "据说是国内延边有名的烤串店。牛羊鸡肉质都很好，嫩到油脂噼啪作响。乳酸菌牛肉串用养乐多和奇异果腌制，酸酸甜甜很出彩；大串牛排烤好直接上桌，裹满芝麻非常香。肉新鲜不肥腻，人均约55刀。", "ne": "Mr Perfect Skewer BBQ", "lon": 151.05179, "lat": -33.86064}, {"n": "Portico Chicken", "t": "葡式烤鸡", "r": "4", "p": 14, "a": "Pennant Hills", "d": "葡鸡、海鲜沙拉、鸡盐", "i": "Pennant Hills火车站新开的葡式烤鸡店，干香型葡鸡，一只可以配两种酱。海鲜沙拉新鲜，也卖鸡盐。老板非常友善。两人约28刀，很实惠。", "ne": "Portico Chicken", "lon": 151.06893, "lat": -33.73844}, {"n": "No.1 Skewers 福興炸串", "t": "炸串", "r": "3", "p": 25, "a": "Eastwood", "d": "青椒、掌中宝、小郡肝、乌骨鸡柳", "i": "Eastwood新开的炸串店，选择不算多。青椒、掌中宝和小郡肝都不错；乌骨鸡柳、香肠、玉米、薯塔和年糕适合小朋友。免费提供冰淇淋和苹果汁。人均约25刀。", "ne": "No.1 Skewers", "lon": 151.08496, "lat": -33.78291}, {"n": "Hello Auntie", "t": "越南融合", "r": "2", "p": 85, "a": "Darling Square", "d": "龙虾馄饨、牛排、烤虾配米粉", "i": "偏西式的越南融合餐厅。龙虾馄饨奶味很重；牛排很嫩，做得成功；烤虾配米粉微辣好吃。人均约85刀，不便宜。", "ne": "Hello Auntie", "lon": 151.20364, "lat": -33.87522}, {"n": "胖姨儿手工拉面馆 My Aunt's Handmade Noodles", "t": "西北拉面", "r": "5", "p": 10, "a": "Eastwood（Burwood也有）", "d": "肥肠米线、爆肚宽面、羊排", "i": "从Burwood开到Eastwood的西北手工拉面馆，好吃又实惠。一碗面约20刀出头，可以免费无限续面，付现金95折，还有集章卡，十碗送一碗。肥肠米线、爆肚宽面和羊排都好吃。人均约10刀。", "ne": "My Aunt's Handmade Noodles", "lon": 151.0714, "lat": -33.79478}, {"n": "档口仔", "t": "粤菜小炒", "r": "5", "p": 35, "a": "Hurstville", "d": "五柳炸蛋、芋头扣肉煲、菜心炒肥叉、干炒牛河、酸菜炒大肠、蒜香骨", "i": "Hurstville的粤菜小馆，开业初期厨房和外场应接不暇，出品不稳，两个多月后已经走上正轨，服务跟得上，菜品质量也回来了。五柳炸蛋最出色，五柳汁调得极好，蛋白边缘炸得酥脆，蛋黄溏心，如今在广东也少见。芋头扣肉煲调味出众；菜心炒肥叉猛火快炒，焦香可口。干炒牛河可能是目前悉尼数一数二，只差在本地河粉原料。酸菜炒大肠干净无异味，炒得干爽有锅气，非常下饭；蒜香骨用半肥瘦的肉，蒜香浓。", "ne": "Dang Kou Zai", "lon": 151.10218, "lat": -33.96883}, {"n": "金唐 Golden Century（Crown新店）", "t": "粤菜酒楼", "r": "5", "p": 75, "a": "Barangaroo（Crown酒店）", "d": "乳鸽、XO酱炒Pipi", "i": "老牌粤菜酒楼金唐在Crown酒店开的新店，出品中规中矩。乳鸽做得最好，XO酱炒Pipi也不错，金唐自家的XO酱水准很高；Pipi底下的煎米粉底偶尔发挥不稳，好的煎米粉要中间软、两面脆，带一点金黄焦边。", "ne": "Golden Century (Crown)", "lon": 151.19999, "lat": -33.85894}, {"n": "渝人码头", "t": "川菜", "r": "5", "p": 40, "a": "Burwood", "d": "酸菜鲈鱼、青椒肉丝", "i": "Burwood少数炒菜能吃的川菜馆。酸菜鲈鱼很好吃，小炒也不错，例如青椒肉丝；口水鸡不推荐。", "ne": "Yu Ren Ma Tou", "lon": 151.10564, "lat": -33.88308}, {"n": "Mr Wong", "t": "粤菜/点心", "r": "5", "p": 80, "a": "Bridge Lane, CBD", "d": "点心、紫菜炒饭", "i": "市中心Bridge Lane的知名粤菜餐厅，点心一直是悉尼最出色的之一。单点菜偏向西人口味，XO粉丝海鲜煲的XO酱偏甜、粉丝偏油；紫菜炒饭倒是很好吃。建议以点心为主。", "ne": "Mr Wong", "lon": 151.19741, "lat": -33.86973}, {"n": "Rockpool Bar & Grill", "t": "牛排馆", "r": "5", "p": 150, "a": "Hunter St, CBD", "d": "Rib Eye", "i": "市中心老牌牛排馆，Rib Eye一如既往地出色。意面这些年换过不少，其余菜式中规中矩，来这里就是为了吃牛排。", "ne": "Rockpool Bar & Grill", "lon": 151.21477, "lat": -33.8739}, {"n": "南国", "t": "粤菜小馆", "r": "5", "p": 40, "a": "Revesby", "d": "走地鸡、蒜香骨", "i": "Revesby的粤菜小馆，悉尼南区性价比最高的粤菜之一，价格便宜又好吃，晚晚满座。走地鸡上桌前淋上鸡汁，鸡味更浓，做法简单有效，只是姜葱碟给得少。招牌蒜香骨蒜味浓郁，是一盘合格的蒜香骨。", "ne": "Nan Guo", "lon": 151.0158, "lat": -33.95049}, {"n": "燉品皇·燕鲍翅", "t": "粤菜", "r": "5", "p": 80, "a": "Thomas St, Haymarket", "d": "酸菜炒牛肉、荷香当归红枣蒸走地鸡、鸳鸯炒米、金瓜海鲜炒饭", "i": "唐人街Thomas St的粤菜馆，地道广东味。酸菜炒牛肉是惊喜，牛肉嫩滑，广式甜口酸菜比牛肉还好吃。荷香当归红枣蒸走地鸡，当归红枣香气浓郁，底下垫着荷叶，很入味，可以按口味加酱油。鸳鸯炒米像干炒牛河，经典好吃，份量很大。金瓜海鲜炒饭是招牌。", "ne": "Dun Pin Wong", "lon": 151.2131, "lat": -33.87964}, {"n": "Tobikiri Japanese Kitchen", "t": "Omakase/日料", "r": "5", "p": 200, "a": "Neutral Bay", "d": "Omakase（27道）、豆乳茶碗蒸、昆布盐腌鰤鱼、Toro油脂海葡萄手卷、烟熏寿司、安康鱼肝小猫饭、番茄酿鹅肝、木鱼花玉米浓汤", "i": "Neutral Bay的家庭式日料小厨房，没有一般Omakase的商业感，多的是老板对料理的热爱和巧思，老板会和客人聊天介绍菜式，熟客很多。Omakase约200刀27道，以贵价食材为主，海胆出现三次，非常超值。豆乳茶碗蒸铺三文鱼籽；鰤鱼用昆布和盐腌过再脱水，鲜味更集中。寿司多达17贯，用紫菜裹着Toro刮下的油脂和海葡萄的手卷一秒入魂；有一贯在玻璃罩里烟熏5分钟，打开满是檀香；Mackerel配腌昆布毫无腥味；星鳗焦脆，墨鱼配海胆和紫苏。安康鱼肝捣碎后和寿司饭、芝士碎拌成小猫饭，完全不腥。番茄酿鹅肝配甜高汤，木鱼花玉米浓汤也很有巧思。也可以单点。", "ne": "Tobikiri Japanese Kitchen", "lon": 151.2185, "lat": -33.8335}];

D.forEach((x,i)=>{x.i_=i;x.g=gi(x.t)});
const S={cat:null,q:'',sel:null,fan:null};
const ok=x=>(S.cat==null||x.g===S.cat)&&(!S.q||(x.n+' '+x.t+' '+x.a+' '+(x.d||'')+' '+(x.ne||'')).toLowerCase().includes(S.q));
$('#cats').innerHTML=CATS.map(([g,l])=>`<button data-g="${g??''}" class="${g==null?'on':''}">${l}</button>`).join('');
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[151.1,-33.86],zoom:11,attributionControl:{compact:true},dragRotate:false,pitchWithRotate:false});
map.touchZoomRotate.disableRotation();
map.on('error',()=>{if(!map.loaded())$('#err').style.display='grid'});
map.on('load',()=>{const P=(id,k,v)=>{try{map.setPaintProperty(id,k,v)}catch(e){}},V=id=>{try{map.setLayoutProperty(id,'visibility','none')}catch(e){}};
 P('background','background-color','#f2f0ec');P('water','fill-color','#d9e2e5');P('park','fill-color','#e8ebe2');P('landuse_residential','fill-color','#f2f0ec');P('building','fill-color','#e9e6e0');
 ['highway-name-path','highway-name-minor','highway-shield-non-us','highway-shield-us-interstate','road_shield_us','airport','label_other','waterway_line_label','water_name_line_label'].forEach(V);
 ['label_village','label_town','label_city','highway-name-major'].forEach(id=>P(id,'text-color','#a39e96'));
 map.fitBounds(bounds(D),{padding:pad(),duration:0});draw();list()});
function pad(){return innerWidth>760?{top:40,bottom:40,left:400,right:70}:{top:170,bottom:60,left:24,right:24}}
function bounds(a){const b=new maplibregl.LngLatBounds();a.forEach(x=>b.extend([x.lon,x.lat]));return b}
let raf=0;map.on('move',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})});map.on('moveend',list);
map.on('movestart',e=>{if(S.fan)unfan()});
function draw(){const W=innerWidth,H=innerHeight,R=26,pts=[];
 D.forEach(x=>{if(!ok(x)&&x.i_!==S.sel)return;const p=map.project([x.lon,x.lat]);if(p.x<-30||p.y<-30||p.x>W+30||p.y>H+30)return;pts.push({x,px:p.x,py:p.y})});
 const used=new Set(),G=[];pts.sort((a,b)=>a.px-b.px);
 for(let i=0;i<pts.length;i++){if(used.has(i))continue;used.add(i);const g=[pts[i]];if(pts[i].x.i_!==S.sel)for(let j=i+1;j<pts.length&&pts[j].px-pts[i].px<R;j++){if(used.has(j)||pts[j].x.i_===S.sel)continue;if(Math.abs(pts[j].py-pts[i].py)<R){g.push(pts[j]);used.add(j)}}G.push(g)}
 $('#mk').innerHTML=G.map(g=>{if(g.length===1){const a=g[0];return `<div class="p r${a.x.r}${S.sel===a.x.i_?' on':''}" data-i="${a.x.i_}" style="transform:translate(${a.px}px,${a.py}px)"><i></i><span class="lb">${esc(a.x.n)}</span></div>`}
  const cx=g.reduce((s,p)=>s+p.px,0)/g.length,cy=g.reduce((s,p)=>s+p.py,0)/g.length;return `<div class="c" data-ids="${g.map(p=>p.x.i_).join(',')}" style="transform:translate(${cx}px,${cy}px)"><span>${g.length}</span></div>`}).join('');
 place()}
function list(){const b=map.getBounds(),v=D.filter(x=>ok(x)&&b.contains([x.lon,x.lat])).sort((a,b)=>(+b.r)-(+a.r)||a.n.localeCompare(b.n));
 $('#cnt').textContent=v.length+' 家店';
 $('#list').innerHTML=v.slice(0,100).map(x=>{const [bg,fg]=PAL[x.g];return `<div class="it${S.sel===x.i_?' on':''}" data-i="${x.i_}"><div class="th" style="background:${bg};color:${fg}">${esc(dish(x))}</div><div class="tx"><b>${esc(x.n)}</b><div class="m">${esc(area(x))} · $${x.p} · <span style="color:var(--red)">${'★'.repeat(+x.r)}</span></div></div><span class="tg">${esc(x.t.split(/[\/、]/)[0])}</span></div>`}).join('')}
/* fan out a small group */
function fan(ids,cx,cy){const F=$('#fan'),xs=ids.map(i=>D[i]),n=xs.length,r=72,span=Math.min(150,34*(n-1));
 F.innerHTML=xs.map((x,k)=>{const [bg,fg]=PAL[x.g];return `<div class="ft" data-i="${x.i_}" style="left:${cx}px;top:${cy}px;background:${bg};color:${fg}">${esc(dish(x))}<span class="nm">${esc(x.n)}</span></div>`}).join('');
 F.classList.add('on');S.fan=ids;
 requestAnimationFrame(()=>requestAnimationFrame(()=>F.querySelectorAll('.ft').forEach((el,k)=>{const a=(n>1?-span/2+span*k/(n-1):0)*Math.PI/180;el.style.transitionDelay=k*.03+'s';el.style.opacity=1;el.style.transform=`translate(${Math.sin(a)*r}px,${-Math.cos(a)*r}px) rotate(${(n>1?(k/(n-1)-.5):0)*16}deg)`})))}
function unfan(){const F=$('#fan');F.classList.remove('on');F.querySelectorAll('.ft').forEach(el=>{el.style.transitionDelay='0s';el.style.opacity=0;el.style.transform='scale(.4)'});S.fan=null;setTimeout(()=>{if(!S.fan)F.innerHTML=''},300)}
/* popover */
function sel(i,fly){S.sel=i;unfan();const x=D[i],[bg,fg]=PAL[x.g];
 const g='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.n.replace(/（.*?）/g,'')+' '+x.a.replace(/（.*?）/g,'')+' Sydney');
 const P=$('#pop');P.classList.remove('more');
 P.innerHTML=`<div class="tp" style="background:${bg};color:${fg}"><span class="tag">${esc(x.t.split(/[\/、]/)[0])}</span><button class="x" aria-label="关闭">×</button>${esc(dish(x))}</div><div class="bd"><h3>${esc(x.n)}</h3><div class="m">${esc(x.a)} · 人均 $${x.p}</div><div class="st">${stars(+x.r)}</div><div class="ds">${esc(x.i||'')}${x.d?`<br><br>招牌：${esc(x.d)}`:''}</div><div class="ac"><a href="${g}" target="_blank" rel="noopener">导航 ↗</a><button data-more>看介绍</button></div></div>`;
 if(fly!==false){const z=Math.max(map.getZoom(),14),m=innerWidth<=760;map.easeTo({center:[x.lon,x.lat],zoom:z,offset:m?[0,-120]:[180,110],duration:650})}
 draw();P.classList.add('on');document.querySelectorAll('.it').forEach(e=>e.classList.toggle('on',+e.dataset.i===i))}
function place(){const P=$('#pop');if(S.sel==null||innerWidth<=760)return;const x=D[S.sel],p=map.project([x.lon,x.lat]);P.style.left=(p.x-132)+'px';P.style.top=(p.y-P.offsetHeight-18)+'px'}
function unsel(){S.sel=null;$('#pop').classList.remove('on');draw();document.querySelectorAll('.it.on').forEach(e=>e.classList.remove('on'))}
/* events */
$('#mk').addEventListener('click',e=>{const p=e.target.closest('.p');if(p)return sel(+p.dataset.i);const c=e.target.closest('.c');if(!c)return;const ids=c.dataset.ids.split(',').map(Number);
 const m=c.style.transform.match(/translate\(([-\d.]+)px, ?([-\d.]+)px\)/);
 if(ids.length<=6&&map.getZoom()>=13.5)return fan(ids,+m[1],+m[2]);map.fitBounds(bounds(ids.map(i=>D[i])),{padding:innerWidth>760?{top:80,bottom:80,left:420,right:100}:{top:200,bottom:80,left:40,right:40},maxZoom:17,duration:700})});
$('#fan').addEventListener('click',e=>{const f=e.target.closest('.ft');if(f)sel(+f.dataset.i);else unfan()});
$('#pop').addEventListener('click',e=>{if(e.target.closest('.x'))return unsel();if(e.target.closest('[data-more]')){const P=$('#pop');P.classList.toggle('more');e.target.textContent=P.classList.contains('more')?'收起':'看介绍';place()}});
map.on('click',e=>{if(S.sel!=null&&!e.originalEvent.target.closest('#pop'))unsel()});
$('#list').addEventListener('click',e=>{const r=e.target.closest('.it');if(r){if(innerWidth<=760)$('#panel').classList.remove('open'),$('#lt').textContent='查看列表';sel(+r.dataset.i)}});
$('#lt').onclick=()=>{const o=$('#panel').classList.toggle('open');$('#lt').textContent=o?'收起列表':'查看列表'};
$('#cats').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.cat=b.dataset.g===''?null:+b.dataset.g;document.querySelectorAll('#cats button').forEach(x=>x.classList.toggle('on',x===b));unsel();list()});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();draw();list();clearTimeout(window._qt);window._qt=setTimeout(()=>{const v=D.filter(ok);if(S.q&&v.length&&v.length<60)map.fitBounds(bounds(v),{padding:pad(),maxZoom:15,duration:700})},500)});
$('#zi').onclick=()=>map.zoomIn();$('#zo').onclick=()=>map.zoomOut();
addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.fan)unfan();else unsel()}});
addEventListener('resize',()=>{draw()});
</script>
</body>
</html>
