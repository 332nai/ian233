<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>悉尼吃喝 · 地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--ink:#141414;--sub:#8a857e;--g1:#f4f3f1;--g2:#eceae6;--line:#ebe8e3;--red:#d6342a;--zh:"Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,-apple-system,sans-serif}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important;font-style:normal!important}
html,body{margin:0;height:100%;overflow:hidden;font:14px/1.5 var(--sans);color:var(--ink);background:#f2f0ec;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font:400 10px var(--sans)!important;background:rgba(255,255,255,.6)!important}
/* panel */
#panel{position:fixed;z-index:30;left:20px;top:20px;bottom:20px;width:340px;background:#fff;box-shadow:0 24px 60px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column}
.hd{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 14px}
.hd a{font:900 20px var(--zh)}.hd a b{color:var(--red)}
.hd span{font:500 11px var(--sans);letter-spacing:.08em;color:var(--sub)}
.sq{margin:0 20px;display:flex;align-items:center;gap:8px;height:38px;background:var(--g1);padding:0 12px}
.sq svg{flex:none;color:var(--sub)}.sq input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 14px var(--sans)}
.cats{display:flex;gap:4px;padding:12px 20px 14px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:28px;padding:0 10px;font:500 12px var(--sans);color:var(--ink)}
.cats button.on{background:var(--ink);color:#fff}
#list{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
.it{position:relative;display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer}
.it:hover{background:var(--g1)}
.it.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--red)}
.th{flex:none;width:44px;height:44px;display:flex;align-items:flex-end;padding:4px;font:900 10.5px/1.1 var(--zh);overflow:hidden}
.it .tx{flex:1;min-width:0}
.it b{display:block;font:700 14px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .m{font:400 12px var(--sans);color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tg{flex:none;font:500 10.5px var(--sans);letter-spacing:.06em;color:var(--sub);max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* markers */
#mk{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.p,.c{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer}
.p i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:var(--ink);box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.25);transition:transform .2s}
.p.r5 i{background:var(--red)}
.p:hover i{transform:scale(1.4)}
.p .lb{position:absolute;left:12px;top:-11px;white-space:nowrap;background:#fff;font:500 12px var(--sans);padding:2px 7px;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0;transition:opacity .15s;pointer-events:none}
.p:hover .lb{opacity:1}
.p.on i{width:16px;height:16px;margin:-8px 0 0 -8px;background:var(--red);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--ink)}
.c span{position:absolute;min-width:26px;height:26px;margin:-13px 0 0 -13px;padding:0 6px;background:#fff;color:var(--ink);font:700 12px/26px var(--sans);text-align:center;box-shadow:0 0 0 1.5px var(--ink),0 4px 10px rgba(0,0,0,.2);transition:background .15s,color .15s}
.c:hover span{background:var(--ink);color:#fff}
/* fan */
#fan{position:fixed;inset:0;z-index:20;pointer-events:none}
#fan.on{pointer-events:auto}
.ft{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border:3px solid #fff;box-shadow:0 10px 20px -8px rgba(0,0,0,.45);display:flex;align-items:flex-end;padding:4px;font:900 10.5px/1.1 var(--zh);overflow:hidden;cursor:pointer;opacity:0;transform:translate(0,0) scale(.4);transition:transform .45s cubic-bezier(.2,.9,.25,1.15),opacity .25s}
.ft:hover{z-index:3;border-color:var(--ink)}
.ft .nm{position:absolute;left:50%;top:62px;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font:500 11px var(--sans);padding:2px 6px;opacity:0;transition:opacity .15s}
.ft:hover .nm{opacity:1}
/* popover */
#pop{position:fixed;z-index:25;width:264px;background:#fff;box-shadow:0 24px 50px -20px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.05);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .25s}
#pop.on{opacity:1;pointer-events:auto;transform:none}
#pop::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;margin-left:-6px;background:#fff;transform:rotate(45deg)}
#pop .tp{position:relative;height:118px;padding:12px;display:flex;align-items:flex-end;font:900 22px/1.15 var(--zh)}
#pop .tag{position:absolute;left:10px;top:10px;background:#fff;color:var(--ink);font:500 10.5px var(--sans);letter-spacing:.06em;padding:3px 7px}
#pop .x{position:absolute;right:8px;top:8px;width:24px;height:24px;background:#fff;font:400 16px/24px var(--sans);text-align:center}
#pop .bd{padding:12px 14px 14px}
#pop h3{margin:0;font:700 16px/1.3 var(--sans)}
#pop .m{font:400 12px var(--sans);color:var(--sub);margin-top:2px}
#pop .st{color:var(--red);font-size:12px;letter-spacing:1px;margin-top:2px}.st s{text-decoration:none;opacity:.22}
#pop .ds{display:none;font:400 13px/1.7 var(--sans);color:#4a4741;margin-top:10px;max-height:160px;overflow:auto}
#pop.more .ds{display:block}
#pop .ac{display:flex;gap:6px;margin-top:12px}
#pop .ac a,#pop .ac button{flex:1;height:34px;display:grid;place-items:center;font:500 12.5px var(--sans);background:var(--g1)}
#pop .ac a{background:var(--ink);color:#fff}#pop .ac a:hover{background:var(--red)}#pop .ac button:hover{background:var(--g2)}
/* zoom */
#zc{position:fixed;z-index:30;right:20px;top:20px;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 16px -8px rgba(0,0,0,.3)}
#zc button{width:34px;height:34px;font-size:16px}#zc button+button{border-top:1px solid var(--line)}#zc button:hover{background:var(--g1)}
#lt{display:none}
/* mobile */
@media(max-width:760px){
 #panel{left:12px;right:12px;top:12px;bottom:auto;width:auto}
 .hd{padding:14px 14px 10px}.sq{margin:0 14px}.cats{padding:10px 14px 12px}
 #list{display:none;max-height:58vh}#panel.open #list{display:block}
 #lt{display:block;border-top:1px solid var(--line);height:40px;font:500 12.5px var(--sans);color:var(--ink)}
 #zc{display:none}
 #pop{left:12px!important;right:12px;top:auto!important;bottom:16px;width:auto}#pop::after{display:none}
 #pop .tp{height:96px}
}
#err{position:fixed;inset:0;display:none;place-items:center;font:500 14px var(--sans);color:var(--sub);z-index:5}
</style>
</head>

</aside>

<script>
const D=[{"n": "Homeway", "t": "山东菜", "r": "3", "p": 40, "a": "Burwood", "d": "山东炒鸡（需提前一天预订）、老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子、山东大馒头", "i": "Burwood的山东菜馆，招牌山东炒鸡需要提前一天预订，辣度极高，在悉尼的川湘菜里也少见，但辣得很香很下饭。其余菜式基本不辣，老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子和个头饱满的山东大馒头都做得很好。人均约40刀。", "ne": "Homeway", "lon": 151.104, "lat": -33.87699}, {"n": "YUNJOY 山喜云南小馆", "t": "云南菜", "r": "2", "p": 37, "a": "Zetland", "d": "傣味油呛双脆、红三剁、番茄酥皮牛腩", "i": "开在Zetland居民楼下的云南小馆，装修朴实。傣味油呛双脆味道在线，不过只有黄喉够脆，毛肚偏软烂。鹿茸菇山野走地鸡是雷，鸡肉没有嚼劲，汤汁多而不香。红三剁很下饭，番茄酥皮牛腩带一点辣味，是意外的惊喜。整体中规中矩，人均约37刀。", "ne": "YUNJOY Yunnan Kitchen", "lon": 151.20801, "lat": -33.90599}, {"n": "Molly Tea 茉莉奶白", "t": "奶茶/蛋挞", "r": "3", "p": 9, "a": "Burwood", "d": "蛋挞（原味、抹茶、巧克力、大溪地香草）", "i": "茉莉奶白新推出的蛋挞，有原味、大溪地香草、抹茶和巧克力四种口味，香草味常常早早售罄。酥皮很脆，蛋挞心软嫩，抹茶和巧克力的表层味道浓郁。个头大，一个就很饱，价格不便宜。队伍看着短，实际也要等半小时左右，排队时可以看到现场制作过程。", "ne": "Molly Tea", "lon": 151.10286, "lat": -33.87614}, {"n": "Yakiniku Yokocho 烧肉横丁", "t": "日式烤肉", "r": "3", "p": 40, "a": "Burwood", "d": "29.8刀 Express Lunch BBQ Set（两款和牛加牛舌）、刺身", "i": "日式炭火烤肉店，午市有29.8刀的Express Lunch BBQ Set，可选三种肉，和牛和牛舌都很值，每款大约五块，女生吃刚好。炭火烤得很香。豚骨拉面一般，刺身不是强项但够新鲜。只吃午餐套餐最省钱，加点刺身和饮料人均也不超过50刀。", "ne": "Yakiniku Yokocho 烧肉横丁", "lon": 151.10419, "lat": -33.87882}, {"n": "Maria's Bakery Inn 超羣饼屋", "t": "港式西饼屋", "r": "3", "p": 8, "a": "Burwood", "d": "菠萝包（原味、咖啡、椰丝、奶黄、菠萝粒）", "i": "开了很多年的老式港式西饼屋，产品和陈列都很有九十年代的味道，以菠萝包出名，有人称它是悉尼最好吃的菠萝包。口味很多，原味、咖啡、椰丝、奶黄，还有夹真菠萝粒的版本。买回家夹上煎蛋和午餐肉，就是酥脆满足的港式早餐。", "ne": "Maria's Bakery Inn", "lon": 151.10564, "lat": -33.87522}, {"n": "宗师麻辣烫", "t": "麻辣干锅/麻辣烫/炸串", "r": "3", "p": 40, "a": "Melrose Park（Melrose Central）", "d": "麻辣干锅、麻辣烫、特价炸串", "i": "Melrose Park的Melrose Central商场里的麻辣烫店，同时做麻辣干锅和炸串，食材选择丰富，炸串常有特价，可以把干锅、麻辣烫和炸串一次吃齐。商场环境舒服。人均约40刀。", "ne": "Zongshi Malatang", "lon": 151.07299, "lat": -33.81501}, {"n": "小妹弄堂 Show Mei Alley", "t": "台式锅贴", "r": "2", "p": 18, "a": "Rhodes Central", "d": "高丽菜铁板猪肉锅贴、三鲜冰花大虾、梅渍山药、红茶豆乳", "i": "据说源自台北西门町的锅贴店，开业初期每天排队，周末等餐约15到20分钟。招牌是高丽菜铁板猪肉锅贴和三鲜冰花大虾锅贴，煎得很香，只是略咸。梅渍山药酸甜开胃，红茶豆乳也好喝。一人吃快50刀，不算便宜，路过可以试，不必专程。", "ne": "Show Mei Alley", "lon": 151.08702, "lat": -33.83}, {"n": "HoonSikDang", "t": "韩国汤面/饺子", "r": "3", "p": 40, "a": "Rhodes", "d": "辣汤面、韩式饺子（猪肉、泡菜）、冷面", "i": "Rhodes火车站附近的韩国面馆，专做汤面和饺子。辣汤面比不辣拉面和冷面更出色，面不是手工的，但汤头味道很足。韩式饺子个大扎实，有猪肉和泡菜两种馅，吃两个就半饱。人均约40刀就能吃得很饱。", "ne": "HoonSikDang", "lon": 151.08584, "lat": -33.82911}, {"n": "九爷火锅鸡", "t": "沧州火锅鸡", "r": "3", "p": 34, "a": "Central Park（Chippendale）", "d": "88刀排骨火锅鸡（够三人）", "i": "沧州火锅鸡，份量很大，88刀的排骨火锅鸡够三个人吃。先吃排骨和鸡肉，再加水涮火锅，店里有免费自助的蔬菜和蘸料台，豆腐、面条随便拿，非常实惠。鸡肉和排骨都很嫩很下饭，服务员态度特别好。人均约34刀，吃不完还可以打包。", "ne": "Jiuye Hotpot Chicken", "lon": 151.199, "lat": -33.88602}, {"n": "Sumibi Yakiniku（原 Kashiwa 柏）", "t": "日式炭火烤肉", "r": "5", "p": 50, "a": "Crows Nest", "d": "辣味Rib、姜葱牛舌", "i": "原来的Kashiwa柏，搬到马路对面后改名Sumibi。炭火烤得香，和牛肉质出色。推荐专攻Rib和牛舌两个部位，各点不同口味，辣味Rib和姜葱牛舌最好吃，又香又嫩。人均约50刀，以亲民的价格吃到好肉。", "ne": "Sumibi Yakiniku (formerly Kashiwa)", "lon": 151.20402, "lat": -33.82599}, {"n": "老张好运现烤牛肉干", "t": "牛肉干外带", "r": "3", "p": 20, "a": "Ryde（Top Ryde图书馆对面）", "d": "胸口油、半肥半瘦（拌薯片、辣油、孜然）", "i": "Top Ryde图书馆对面的现烤牛肉干店，与其说是牛肉干，不如说是多汁的烤牛肉，一点都不干。推荐胸口油和半肥半瘦两个部位，拌上薯片、辣油和孜然，瘦肉有嚼劲，肥肉够香。老板试吃给得很大方。价格偏高，300克约67刀，可冷藏保存约5天。", "ne": "Lao Zhang Fresh Roasted Beef Jerky", "lon": 151.10602, "lat": -33.814}, {"n": "KatsuiE", "t": "日式炸猪排", "r": "5", "p": 35, "a": "Eastwood", "d": "Tenderloin、Loin、芝士猪排", "i": "现点现炸的日式猪排饭，做法很接近大阪的猪排店。Tenderloin里肉微微粉嫩，咬下去肉汁四溢；Loin油脂香更浓；芝士猪排拉丝，非常罪恶。配粗盐、现磨山葵和芥末酱，一块猪排能吃出几种味道，从头到尾不腻。人均约35刀，值得反复回访。", "ne": "KatsuiE", "lon": 151.08101, "lat": -33.79099}, {"n": "老回民", "t": "新疆菜", "r": "5", "p": 50, "a": "Burwood", "d": "烤羊排、大盘土鸡加皮带面、韭菜拌面", "i": "Burwood的新疆菜老店，重新装修后水准依旧。烤羊排可以说是悉尼数一数二，不肥不腻，有嚼劲又嫩到冒汁，没有膻味，蘸辣椒面和孜然吃。大盘鸡也是硬菜，记得加一份皮带面泡在汤汁里。韭菜拌面油润有韧性。人均约50刀，份量大，很容易吃撑还要打包。", "ne": "Lao Hui Min Hand Made Ramen", "lon": 151.10092, "lat": -33.87746}, {"n": "Minimal Coffee", "t": "咖啡", "r": "3", "p": 10, "a": "Crows Nest", "d": "Cold Brew、巴斯克", "i": "街边的小咖啡店，适合天气好的时候坐在路边喝一杯。Cold Brew甘苦清爽，巴斯克蛋糕是惊喜，很香又不太奶，和Cold Brew搭配刚好。", "ne": "Minimal Coffee", "lon": 151.20284, "lat": -33.82514}, {"n": "Manpuku", "t": "日式拉面", "r": "5", "p": 33, "a": "Chatswood", "d": "Long Name Signature（细面）、蘸面（粗面）", "i": "悉尼人气很高的日式拉面店，多年来价格涨得不多，很有良心。汤底是鸡骨和猪骨混合的高汤，浓郁不腻。面条筋道爽滑，会按拉面款式搭配粗细：Long Name Signature配细面，蘸面配粗面。在悉尼的日式拉面里稳居前列，人均约33刀。", "ne": "Manpuku", "lon": 151.18099, "lat": -33.79699}, {"n": "Jin Guk", "t": "韩国汤饭", "r": "3", "p": 33, "a": "Macquarie Park（MQ Centre外）", "d": "猪肉汤饭、辣牛肉汤饭、牛肉饼烤菇、虾Pancake", "i": "Macquarie Centre外面的韩国汤饭店，最近小有名气，傍晚五点多到不用排，很快就坐满。菜单简单，四款汤饭、四款小菜和四款饮料。猪肉汤饭里还有面条，辣牛肉汤饭汤底也不错，米饭稍软。小菜里牛肉饼烤菇和虾饼好吃，饺子一般。饭后送肉桂冰淇淋。人均约33刀，以这个环境来说很合理。", "ne": "Jin Guk", "lon": 151.12, "lat": -33.77701}, {"n": "PST Pizza Studio Tamaki", "t": "日式Pizza", "r": "3", "p": 40, "a": "George St, CBD", "d": "Five cheese pizza with honey、提拉米苏", "i": "东京六本木名厨玉置翼开的日式Pizza店。饼底用发酵30小时的面团和冲绳矿物盐，柴火炉高温烘烤，外皮微焦有香气，口感轻盈软糯。口味独特，有咸甜口的五种芝士配蜂蜜Pizza。甜品提拉米苏非常出色，一定要点。人均约40刀能吃得很饱，适合人多一起来，多点几款分着吃。", "ne": "PST Pizza Studio Tamaki", "lon": 151.20584, "lat": -33.86812}, {"n": "宗师炸串", "t": "炸串", "r": "4", "p": 20, "a": "Macquarie Centre", "d": "金丝鸡排、牛肉串、包浆豆腐、豆皮金针菇", "i": "Macquarie Centre美食区里最值得吃的炸串摊。金丝鸡排必点，金黄酥脆的外皮裹着鲜嫩鸡肉，撒满孜然和辣椒面。牛肉串、鸡肉串、青椒、豆皮金针菇、包浆豆腐、年糕都可以自选，连蔬菜都炸得好吃。", "ne": "Zongshi Fried Skewers", "lon": 151.11886, "lat": -33.77613}, {"n": "香港冰室", "t": "茶餐厅", "r": "3", "p": 22, "a": "Eastwood", "d": "茄汁炒通心粉配猪扒、滑蛋炸鸡排饭、咖央西多士", "i": "港式茶餐厅，现炒锅气足。茄汁炒通心粉配开心猪扒很受小朋友欢迎，滑蛋炸鸡排饭的鸡排鲜嫩多汁。甜品推荐咖央西多士，咖央酱和西多士结合得很好。如今悉尼做得好的茶餐厅不多，值得珍惜。", "ne": "Hong Kong Café", "lon": 151.07983, "lat": -33.79014}, {"n": "Sho Kaisendon", "t": "海鲜丼/日料", "r": "5", "p": 70, "a": "Crows Nest", "d": "炸生蚝、烤牛舌、Saiko Don、鹅肝和牛鳗鱼釜饭、Yuzu Sorbet", "i": "Lane Cove人气寿司店Sho Sushi在Crows Nest开的海鲜丼店。前菜炸生蚝和烤牛舌都很出色。Saiko Don有海胆、Tuna、大虾、Kingfish、三文鱼、Otoro、鱼籽、带子和鲷鱼，非常新鲜丰盛。更惊喜的是釜饭，鹅肝、和牛、鳗鱼和鱼籽一起焖，口感浓郁。饭后Yuzu Sorbet清新解腻。人均约70刀。", "ne": "Sho Kaisendon", "lon": 151.20421, "lat": -33.82782}, {"n": "Lanxi Kitchen 蓝曦食堂", "t": "砂锅米线", "r": "3", "p": 28, "a": "Rhodes（原香蕉小馆位置）", "d": "砂锅米线、卤肥肠、奥尔良烤鸡腿", "i": "Rhodes新开的砂锅米线店，原香蕉小馆的位置。砂锅上桌时还在冒泡，红油和白骨汤翻滚，米线吸饱汤汁，爽滑软糯，配料给得足，砂锅保温，从头吃到尾都是热的。卤肥肠和奥尔良烤鸡腿也很入味。人均约28刀，很划算。", "ne": "Lanxi Kitchen", "lon": 151.08721, "lat": -33.83183}, {"n": "Soho Korean Chinese Restaurant", "t": "韩式中华料理", "r": "3", "p": 40, "a": "Lidcombe", "d": "炸酱面、辣汤面、糖醋肉、糖渍小番茄", "i": "韩式中华料理，网上上千条评价、评分4.9。炸酱面和辣汤面都很入味，嗦起来很过瘾。糖醋肉炸得出色，里面的猪肉非常嫩。前菜的糖渍小番茄比蟹脚好吃。人均约40刀，吃得开心又饱。", "ne": "Soho Korean Chinese Restaurant", "lon": 151.047, "lat": -33.86399}, {"n": "鼎氏牛大 Lanzhou Beef Hand Pulled Noodles", "t": "兰州牛肉面/新疆菜", "r": "5", "p": 18, "a": "Rhodes（火车站对面）", "d": "炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子", "i": "Rhodes火车站对面的兰州牛肉面馆，新疆老板加了一整套新疆菜单，常有新疆老乡来吃，味道可以信赖。炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子都很好吃。份量很大，按人数点菜就够了。", "ne": "Lanzhou Beef Hand Pulled Noodles", "lon": 151.08865, "lat": -33.82823}, {"n": "Bakery Cafe Cael", "t": "甜品", "r": "2", "p": 14, "a": "Lidcombe", "d": "地瓜蛋糕", "i": "Lidcombe的韩式烘焙甜品店，招牌地瓜蛋糕表现一般。", "ne": "Bakery Cafe Cael", "lon": 151.04586, "lat": -33.86314}, {"n": "Meg Meg", "t": "甜品", "r": "3", "p": 14, "a": "Glebe", "d": "提拉米苏", "i": "Glebe的甜品店，提拉米苏非常好吃，值得专程去买。", "ne": "Meg Meg", "lon": 151.18601, "lat": -33.87901}, {"n": "Smoked By Million Chicken", "t": "韩式熏鸡", "r": "3", "p": 35, "a": "West Ryde", "d": "Galbi口味熏鸡（每日限量）、紫菜饭团、芝士玉米", "i": "West Ryde新开的韩式熏鸡店。每天限量的Galbi口味熏鸡，鸡肉腌制24小时，辣椒粉由14种香料调成，肉质很嫩，带焦香和烟熏味，比炸鸡更耐吃。紫菜饭团和芝士玉米混在一起吃很香。吃腻了炸鸡可以来试试。人均约35刀。", "ne": "Smoked By Million Chicken", "lon": 151.09002, "lat": -33.80601}, {"n": "Cucina Porto", "t": "意大利菜", "r": "5", "p": 100, "a": "The Star（Pyrmont）", "d": "馕配辣酱和Salami、烤虾、海鲜Pasta、提拉米苏", "i": "The Star里出乎意料地出色的意大利餐厅。烤得圆鼓鼓的面包配辣酱和Salami很好吃；烤虾嫩到一碰就脱壳；海鲜Pasta用料很有诚意；提拉米苏浓郁湿润，大力推荐。人均约100刀，份量足，很适合看演出前后来吃。", "ne": "Cucina Porto", "lon": 151.19501, "lat": -33.868}, {"n": "Ormeggio at the Spit", "t": "意大利菜/海景", "r": "2", "p": 165, "a": "Mosman", "d": "小kingfish挞、炖牛排、生蚝、烤章鱼taco", "i": "The Spit海边的意大利餐厅，正对海湾游艇和对岸豪宅，景色是最大卖点。冬季有四道菜半价的Winter Special。前菜小Kingfish挞和主菜炖牛排都不错，但不算惊艳。整体溢价明显，就算半价也不太值，分数主要来自环境。人均约165刀。", "ne": "Ormeggio at the Spit", "lon": 151.24601, "lat": -33.80399}, {"n": "The Gidley", "t": "牛排馆", "r": "5", "p": 120, "a": "King St, CBD", "d": "小面包、烤牛舌、招牌双层汉堡、牛排", "i": "出了名神秘的牛排馆，入口是隐蔽的木门，先经过昏暗的Bar区，用餐区会亮堂一些。店家礼貌地请客人上交手机，好好吃饭聊天，收手机前服务员会帮忙拍合照。小面包松软，两款蘸酱浓郁；烤牛舌毫无腥味；招牌汉堡是双层牛肉饼加太阳蛋；牛排更是极为出色。性价比很高，两人食物约160刀，含酒约240刀。姐妹店BISTECCA同样收手机。", "ne": "The Gidley", "lon": 151.20721, "lat": -33.87084}, {"n": "The Grill at The International", "t": "扒房/西餐", "r": "3", "p": 110, "a": "Martin Place（MLC大楼）", "d": "烤鸡翅、虾多士、巧克力舒芙蕾配伯爵冰淇淋", "i": "MLC大楼里的扒房，菜品摆盘精致，环境偏简洁，不是传统Fine Dining那种华丽。前菜烤鸡翅和虾多士好吃又漂亮，鸭肝酱偏奶偏腥。主菜牛排和意面略咸。甜品巧克力舒芙蕾值得点，流心巧克力和伯爵冰淇淋融在一起很好吃。人均约110刀。", "ne": "The Grill at The International", "lon": 151.20998, "lat": -33.86702}, {"n": "Yo-chi", "t": "酸奶冰淇淋", "r": "3", "p": 9, "a": "Macquarie Centre", "d": "自选酸奶冰淇淋", "i": "Macquarie Centre的酸奶冰淇淋店，自选配料，店里送贴纸，还有投乒乓球赢优惠券的小游戏，适合带小朋友。", "ne": "Yo-chi", "lon": 151.12019, "lat": -33.77884}, {"n": "海滋味海鲜茶楼 Oceanic Tastes", "t": "粤式海鲜酒楼", "r": "3", "p": 50, "a": "Rhodes", "d": "沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、咸鱼蒸肉饼", "i": "Rhodes的粤式海鲜酒楼，适合家庭聚会。沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、金衣豆腐、咸鱼蒸肉饼都不错，份量很大。服务员热情靠谱，带蛋糕来过生日还会送寿桃。门口有小区游乐场，小朋友可以去玩。人均不到50刀。", "ne": "Oceanic Tastes", "lon": 151.0839, "lat": -33.83044}, {"n": "Kura Ichi", "t": "海鲜丼", "r": "3", "p": 50, "a": "Haymarket（Market City对面）", "d": "Take档海鲜丼加温泉蛋", "i": "Market City对面街角开了几十年的日料店，近年转型专做海鲜丼，很成功。Take这一档基本涵盖各种鱼，一碗就很满足，额外的Otoro容易腻。建议加一颗温泉蛋，味道更好；茶泡饭的茶汤一般，可以不点。份量大，丰俭由人，人均约50刀。", "ne": "Kura Ichi", "lon": 151.20402, "lat": -33.87901}, {"n": "Kiddo Coffee", "t": "咖啡/菠萝包", "r": "3", "p": 10, "a": "Surry Hills", "d": "菠萝包、Yuzu Cold Brew", "i": "最近小火的港风菠萝包咖啡店，在悉尼满街卷牛角包的时候另辟蹊径。热门组合是菠萝包配一杯特调，Yuzu Cold Brew酸甜，能平衡菠萝包的甜腻，但咖啡味偏淡。菠萝包本身和西饼屋的差不多，胜在现场加热，面包松软，甜酥皮很脆。", "ne": "Kiddo Coffee", "lon": 151.21101, "lat": -33.88602}, {"n": "Carlingford Village 新开台湾菜（未具名）", "t": "台湾菜", "r": "2", "p": 40, "a": "Carlingford", "d": "", "i": "Carlingford Village新开的台湾菜，味道一般，有些失望。", "ne": "New Taiwanese restaurant, Carlingford Village (unnamed)", "lon": 151.04799, "lat": -33.782}, {"n": "Catalina", "t": "海景Fine Dining", "r": "4", "p": 160, "a": "Rose Bay", "d": "三文鱼刺身、牛肉饺子、乳猪、Snapper、牙鱼蒸饺", "i": "Rose Bay海边的Fine Dining，景色无敌：对岸矮房、帆船游艇、水上飞机和往来的轮渡尽收眼底，菜品也比几年前进步很多。两道菜Set Menu里，三文鱼刺身、牛肉饺子、乳猪和Snapper都好吃，单点的牙鱼蒸饺和小包菜也出色。适合天气好的日子来庆祝。", "ne": "Catalina", "lon": 151.26698, "lat": -33.87002}, {"n": "潮公馆", "t": "潮州菜", "r": "3", "p": 72, "a": "Chatswood", "d": "卤味拼盘、果肉、芋泥、墨鱼丸、炒米粉", "i": "正宗度很高的潮州菜馆。卤味拼盘非常出色，味道很对，把鸭换成鹅就和潮州本地一样。少见的潮州小吃粿肉也有，地道。芋泥复刻度很高，只差一勺葱珠油。双丸汤里墨鱼丸远胜牛肉丸，墨鱼丸也可以买冷冻装回家煮面。炒米粉锅气十足。酸菜肚尖和沙茶牛肉较普通。人均约72刀，潮汕和广东人吃会很亲切，重口味的人可以再观望。", "ne": "Teochew House", "lon": 151.17985, "lat": -33.79613}, {"n": "重庆小面（Sho Sushi对面，未正式开业）", "t": "重庆小面", "r": "3", "p": 18, "a": "Lane Cove", "d": "干馏豌杂面", "i": "Lane Cove Sho Sushi对面一家尚未正式开业的重庆小面，试营业期间已经可以吃到。", "ne": "Chongqing Noodles (opposite Sho Sushi, soft opening)", "lon": 151.16701, "lat": -33.81501}, {"n": "张妈妈特色川味馆", "t": "川菜", "r": "4", "p": 40, "a": "Gordon", "d": "火锅鱼、烤鱼（每年约20条活鱼需预订）、毛血旺、泡椒黄喉、回锅肉、双椒牛舌", "i": "Gordon的川菜馆，以火锅鱼和烤鱼出名。活鱼每年数量有限，需要提前预订。烤鱼又辣又香，鱼肉紧实入味，配菜豆腐、土豆和腐竹都很吸汁。辣得受不了可以加一份不辣的宫保鸡丁。", "ne": "Mama Zhang Sichuan", "lon": 151.15086, "lat": -33.75511}, {"n": "FIVE TWO.", "t": "咖啡（自家烘豆）", "r": "3", "p": 10, "a": "Artarmon", "d": "Cold Brew", "i": "藏在一排修车行后面的仓库式咖啡店，自家烘豆，店里能看到大型烘豆机。老板一个人不慌不忙地做咖啡，很友善。Cold Brew好喝，门口晒太阳的位置很舒服。", "ne": "FIVE TWO.", "lon": 151.18502, "lat": -33.80901}, {"n": "Get Sushi Omakase", "t": "入门Omakase", "r": "5", "p": 160, "a": "Sydney Fish Market", "d": "Engawa、Storm Shell、海胆对比（塔州对北海道）", "i": "Fish Market里的入门级Omakase，在Sushi Oe旁边，鱼每天直接从鱼市拿，非常新鲜。每人160刀，包括一份生蚝、20贯寿司和一碗味噌汤。Engawa油脂甘甜丰腴，Storm Shell蚌肉爽滑Q弹，令人印象深刻。还有海胆盲品环节，对比塔州和北海道海胆，前者甘甜，后者Creamy。适合只想简单享受寿司、不追求漂亮饭的人，过生日还会插祝福牌。", "ne": "Get Sushi Omakase", "lon": 151.19, "lat": -33.87301}, {"n": "Suddenly.", "t": "咖啡", "r": "3", "p": 10, "a": "Surry Hills", "d": "Cold Brew", "i": "充满童趣的咖啡店，店里摆满各式小玩意，像一家色彩缤纷的精品店，还收藏有1960年代华语歌后姚苏蓉的黑胶唱片。Cold Brew不错，适合坐在窗边看街景。", "ne": "Suddenly.", "lon": 151.20983, "lat": -33.88513}, {"n": "Manmaruya BBQ", "t": "日式烤肉", "r": "4", "p": 50, "a": "Concord", "d": "和牛拼盘（约150刀6种）、姜葱牛舌、和牛刺身、牛肉饼", "i": "Concord的日式烤肉店，是区里的宝藏。和牛相当新鲜，约150刀的拼盘有六种肉，每种都又嫩又香；牛舌配姜葱很好吃。小菜同样出色，牛肉饼、和牛刺身、炸鸡、饺子和芝士玉米都值得点，和牛刺身和牛肉饼尤其推荐加单。人均约50刀。", "ne": "Manmaruya BBQ", "lon": 151.104, "lat": -33.85799}, {"n": "Braza Churrascaria", "t": "巴西烤肉", "r": "3", "p": 79, "a": "Darling Square", "d": "Beef Rib、脆皮猪五花、烤鱼、鸡心、烤菠萝", "i": "巴西烤肉自助，气氛热烈。明火炭烤的肉串由服务员拿到桌边现切，Beef Rib、脆皮猪五花、烤鱼、鸡心和烤菠萝最好吃。周六晚上有桑巴舞表演，把气氛推向高潮。成人79刀，小孩34刀，适合一家老小聚餐。", "ne": "Braza Churrascaria", "lon": 151.202, "lat": -33.87699}, {"n": "阿叔潮汕纸皮蒸饺", "t": "潮汕蒸饺外卖", "r": "5", "p": 20, "a": "Redfern", "d": "海参黑松露蒸饺、虾滑时蔬、紫菜鲜肉、韭菜鲜肉、羊肉蒸饺", "i": "Redfern的潮汕薄皮蒸饺，没有招牌，有点难找，只做外卖，现包现蒸，需要稍等。和潮州本地一样皮薄如纸，鲜香多汁，灵魂是正宗的蒜头油。口味有整条海参黑松露、虾滑时蔬、紫菜鲜肉、韭菜鲜肉和特色羊肉。潮汕人会很感动，其他地方的人也值得一试。", "ne": "Uncle's Teochew Paper-Skin Dumplings", "lon": 151.20402, "lat": -33.89201}, {"n": "Kim's Bop Korean Eatery", "t": "韩国面馆", "r": "3", "p": 30, "a": "Glebe", "d": "牛肉辣拌乌冬、猪肉大酱拌乌冬、海苔凉拌北豆腐、Korean Tea", "i": "人气很旺的韩国面馆，建议开门前就到。牛肉辣拌乌冬和猪肉大酱拌乌冬入味浓郁，却有一丝清爽感；海苔凉拌豆腐也好吃。Korean Tea值得一试。人均约30刀，适合周末午餐。", "ne": "Kim's Bop Korean Eatery", "lon": 151.18483, "lat": -33.87813}, {"n": "Orii", "t": "咖啡/蛋糕", "r": "3", "p": 10, "a": "Ryde（Meadowbank）", "d": "Iced Long Black、巧克力蛋糕", "i": "Meadowbank路边的奶黄色咖啡店，外观可爱清新。Iced Long Black出色，巧克力蛋糕普通。适合天气好的午后来喝杯下午茶。", "ne": "Orii", "lon": 151.09002, "lat": -33.81602}, {"n": "Neptune's Grotto", "t": "意大利地下小酒馆", "r": "3", "p": 100, "a": "Circular Quay", "d": "番茄面包、火腿泡芙、烤虾、番茄意面、隐藏菜单牛排", "i": "环形码头附近小路上的地下意式小酒馆，入口是低调的木门，里面烛光昏暗，很有氛围。前菜番茄面包、火腿泡芙和烤虾都好吃。主菜番茄意面出色；牛排不在菜单上，需要主动问，偏肥，后段略腻。榛果巧克力慕斯像加大版费列罗，可点可不点。服务很好，人均约100刀。", "ne": "Neptune's Grotto", "lon": 151.21101, "lat": -33.86099}, {"n": "Bonjuk", "t": "韩国粥", "r": "3", "p": 20, "a": "Haymarket（太子中心）", "d": "人参鸡汤粥加红雪蟹肉", "i": "韩国知名连锁粥品牌，在UTS附近开店。人参鸡汤粥加红雪蟹肉要37刀，不便宜，但味道好，份量足，两个人吃也够。冬末初春来一碗暖胃养生很合适。", "ne": "Bonjuk", "lon": 151.20284, "lat": -33.87813}, {"n": "虎助拉面", "t": "日式拉面", "r": "3", "p": 22, "a": "Melrose Park（Melrose Central）", "d": "拉面", "i": "日式拉面店，避开饭点就不用排队，汤头很香。", "ne": "Torasuke Ramen", "lon": 151.07185, "lat": -33.81412}, {"n": "Surena Persian Restaurant", "t": "波斯菜", "r": "4", "p": 27, "a": "Carlingford", "d": "茄子酸奶酱配脆片、烤鸡翅、炖羊腿、波斯茶", "i": "网上两千多条评价、评分4.8的波斯餐厅，异域风情浓厚。茄子酸奶酱配脆饼很好吃；主菜烤鸡翅和炖羊腿香料浓郁，肉质好。餐后的波斯茶配一根糖棒，糖融化一半就拿出来，不然太甜。人均约27刀，很划算。", "ne": "Surena Persian Restaurant", "lon": 151.04685, "lat": -33.78111}, {"n": "Infinity", "t": "旋转景观餐厅", "r": "2", "p": 200, "a": "Sydney Tower", "d": "", "i": "悉尼塔上的旋转景观餐厅，可以俯瞰全城。菜品过得去但不惊艳，来这里主要为了景色和氛围。冬天建议傍晚五点左右到，能看到午后、日落和华灯初上三段景色。适合庆祝生日或带游客来，人均约200刀。", "ne": "Infinity", "lon": 151.209, "lat": -33.87002}, {"n": "Four Seasons Hotel 蛋糕取货", "t": "酒店蛋糕", "r": "3", "p": 20, "a": "The Rocks（四季酒店）", "d": "圣多诺黑", "i": "四季酒店的蛋糕，到店取货时有香槟和小蛋糕品尝，仪式感很强。酥皮做得出色，焦糖泡芙的外壳偏硬。", "ne": "Four Seasons Hotel cake pickup", "lon": 151.20801, "lat": -33.859}, {"n": "Park St. Diner", "t": "美式餐厅", "r": "3", "p": 50, "a": "Pitt St, CBD", "d": "汉堡、牛排", "i": "The Grounds集团开的美式复古餐厅，装潢饱和温暖，很有美式小馆的感觉。汉堡很好吃，炸鸡偏干但可以接受，牛排不是高档部位，但煎得很嫩。大人小孩都适合，人均约50刀。", "ne": "Park St. Diner", "lon": 151.20865, "lat": -33.86721}, {"n": "EEF Coffee", "t": "咖啡", "r": "3", "p": 10, "a": "Darlinghurst", "d": "咖啡、香肠卷", "i": "最近很火的咖啡店，层高很高，空间漂亮，不像一般的咖啡店。咖啡和香肠卷都不错，适合坐在窗边放空。附近的Theeca也可以顺便去吃Brunch。", "ne": "EEF Coffee", "lon": 151.218, "lat": -33.878}, {"n": "Mapo", "t": "意式冰淇淋", "r": "3", "p": 9, "a": "Darlinghurst（亦有Newtown店）", "d": "黑巧加开心果、香蕉柠檬", "i": "起家于Newtown的意式冰淇淋店，现在开了好几家分店，Darlinghurst也有。口味一直很有创意，黑巧和开心果混着吃是经典组合，香蕉柠檬口味酸甜有趣。", "ne": "Mapo", "lon": 151.21686, "lat": -33.87712}, {"n": "Bones", "t": "居酒屋", "r": "2", "p": 30, "a": "Darlinghurst", "d": "面包炸虾、炸鸡", "i": "小小的居酒屋，有午市营业。招牌面包炸虾偏油但非常香，炸鸡也炸得好。东京拉面偏咸不够浓，猪五花干拌面过甜，面类一般。胜在价格亲民，人均约30刀就能吃饱。", "ne": "Bones", "lon": 151.21819, "lat": -33.87983}, {"n": "Chilli Basil Thai Noodle Bar", "t": "泰国菜", "r": "4", "p": 40, "a": "Burwood", "d": "炸鸡翅、海鲜米粉沙拉、绿咖喱鸡、烤猪颈肉、海鲜炒粿条、腌三文鱼", "i": "Burwood主街上的高分泰国菜老店，装潢像曼谷的火车车厢。炸鸡翅、海鲜米粉沙拉拼盘、豆腐炒通菜、鸡肉绿咖喱、猪五花炒芥蓝、烤猪颈肉、海鲜炒粿条和腌三文鱼都好吃又下饭。人均约40刀，是Burwood中餐以外的好选择。", "ne": "Chilli Basil Thai Noodle Bar", "lon": 151.10697, "lat": -33.87857}, {"n": "Unlimited Korean BBQ", "t": "韩式烤肉自助", "r": "4", "p": 29, "a": "Castle Tower（Castle Hill）", "d": "肥牛、猪脸肉、7.99刀单点芝士玉米和辣花蛤汤", "i": "Castle Towers的韩式烤肉自助，成人29刀、小孩19刀，性价比极高。肉类选择多，肥牛和猪脸肉最好吃，用生菜包肉配泡菜和辣椒一起吃。熟食区有辣年糕、炸鸡翅、土豆饼和紫菜粉丝卷。另有7.99刀的单点菜，芝士玉米和辣花蛤汤都好吃。很适合一大家子聚餐。", "ne": "Unlimited Korean BBQ", "lon": 150.99901, "lat": -33.731}, {"n": "MANSEOK", "t": "韩式大排档", "r": "3", "p": 30, "a": "Lidcombe", "d": "辣鸡锅（中间乌冬周围芝士玉米）、牛肠锅配泡菜炒饭", "i": "Lidcombe的韩式大排档，适合朋友聚餐。辣鸡锅中间是乌冬面，外圈一圈芝士玉米；牛肠锅可以加泡菜炒饭一起炒着吃。人均约30刀，非常划算。", "ne": "MANSEOK", "lon": 151.04719, "lat": -33.86585}, {"n": "Sluurp 樂樂鍋", "t": "一人一锅小火锅", "r": "3", "p": 38, "a": "Macquarie Centre", "d": "牛舌、和牛、鞭炮笋", "i": "Macquarie Centre电影院旁边的一人一锅小火锅，锅嵌在桌面里，小朋友吃也安全。配菜从旋转带上自选，和牛等食材下单后由小火车送到座位，很有趣。牛舌和和牛都很嫩，鞭炮笋值得点。人均约38刀，很划算。", "ne": "Sluurp", "lon": 151.12163, "lat": -33.77521}, {"n": "Basak & Jogumja", "t": "韩式菜包肉", "r": "3", "p": 35, "a": "Lidcombe", "d": "生菜包卤猪五花、冷面、牛骨汤", "i": "Lidcombe专做韩式菜包肉的店。卤猪五花不咸，用小火保温，肥而不腻，用生菜包上猪肉，配泡菜、酱料、蒜粒和辣椒，口感丰富。两人份套餐配一份酸甜辣口的冷面，和猪肉很搭。牛骨汤也暖胃。人均约35刀。", "ne": "Basak & Jogumja", "lon": 151.04864, "lat": -33.86222}, {"n": "Cafe Nemo", "t": "咖啡", "r": "3", "p": 10, "a": "Lidcombe（火车站对面）", "d": "冰美式", "i": "Lidcombe火车站对面的小咖啡店，简朴不起眼，周末人少。冰美式出色，是韩国人聚居区小咖啡店的稳妥之选。", "ne": "Cafe Nemo", "lon": 151.04392, "lat": -33.86446}, {"n": "Golden Tree Bistro 云深不知处·金小馆", "t": "贵州羊肉粉", "r": "4", "p": 30, "a": "Ultimo（UTS旁）", "d": "羊肉粉、牛肉包子、炸肥肠", "i": "UTS旁边的贵州羊肉粉店。汤底浓郁，米粉嫩滑，配菜用心。肉包子透着油，渣渣牛肉馅非常好吃。全场最佳是炸肥肠，松软酥脆，一口一个停不下来。人均约30刀就能吃饱。", "ne": "Golden Tree Bistro", "lon": 151.19801, "lat": -33.87999}, {"n": "幸福屯家常菜 Happy Village Dumplings", "t": "东北菜", "r": "3", "p": 35, "a": "Chatswood", "d": "排骨豆角铁锅炖（两人可点）、手工饺子、虎皮尖椒", "i": "火车站出来两分钟的东北菜馆，两个人也能点铁锅炖。排骨豆角铁锅炖里有土豆和粉条，炖十五分钟后服务员在锅边贴上玉米饼，再焖十分钟即可，软烂入味。饺子是阿姨现场手工包的，虎皮尖椒很下饭。人均约35刀，适合人少又想吃铁锅炖的时候。", "ne": "Happy Village Dumplings", "lon": 151.18118, "lat": -33.79885}, {"n": "Tre Viet", "t": "越南菜", "r": "3", "p": 22, "a": "Chatswood", "d": "会安鸡饭", "i": "Chatswood的越南餐厅，会安鸡饭很好吃，每块鸡肉都带着鸡冻，懂行的广东人会很欣赏。", "ne": "Tre Viet", "lon": 151.18266, "lat": -33.79522}, {"n": "福芋喜堂 Sweet Town", "t": "糖水铺", "r": "3", "p": 15, "a": "Eastwood", "d": "自选糖水：椰奶底、鸭母捻、芋圆、芋泥、米麻薯、仙草冻", "i": "可以全部自选的糖水铺，从底汤到小料都自己搭配。少见地有潮州甜品鸭母捻，虽然口感偏硬，和潮州本地的不太一样。米麻薯清甜，能吃到米粒口感，最推荐。椰奶底配包心菜芋圆、芋泥和仙草冻也不错。甜度很低，适合晚上吃，但嗜甜的人会觉得太淡。人均约15刀。", "ne": "Sweet Town", "lon": 151.0812, "lat": -33.79282}, {"n": "Gildas", "t": "巴斯克Tapas", "r": "5", "p": 80, "a": "Surry Hills", "d": "面包配伊比利亚火腿、焗蟹吐司、卷卷Chorizo", "i": "巴斯克风格的Tapas餐厅，每一道都很精彩，口味很合中国胃。面包配伊比利亚火腿开场就很好；焗蟹吐司是蟹肉拌浓稠奶油铺在酥脆吐司上，撒红椒粉，绵密浓郁；卷卷Chorizo弹牙多汁，造型可爱。八爪鱼和牛排等大份菜反而不如Tapas出色。人均约80刀，非常推荐。", "ne": "Gildas", "lon": 151.2112, "lat": -33.88785}, {"n": "Artificer Coffee", "t": "咖啡", "r": "2", "p": 10, "a": "Surry Hills", "d": "Cold Brew", "i": "几乎没有装修的街角咖啡店，简单几张板凳，冬天阳光透过树枝洒在街上，很有氛围。Cold Brew偏酸。", "ne": "Artificer Coffee", "lon": 151.21264, "lat": -33.88422}, {"n": "Maison de Butter", "t": "甜品（预约自取）", "r": "3", "p": 14, "a": "Gordon", "d": "蛋糕罐子、小饼干、爆脆巧", "i": "预约自取的甜品工作室，平时不对外营业，约好时间店主会在店里等候。店内布置像南法乡村，摆满厨具和小物件。招牌是蛋糕罐子，不甜，通常搭配一种酸味食材，清爽开胃；小饼干和爆脆巧也可以买来送人。也提供配送，但很推荐亲自去取。", "ne": "Maison de Butter", "lon": 151.15219, "lat": -33.75782}, {"n": "Lulu Dessert House 露记糖水铺", "t": "糖水铺", "r": "3", "p": 14, "a": "Eastwood", "d": "椰汁芋头西米露加麻薯", "i": "和面包店本宫的茶共用一个铺面的糖水铺。椰汁芋头西米露里有芋头块、芋圆和芋泥，芋头控会很满足。份量偏小，可以加一份麻薯。甜汤可选冷热，店员也愿意按要求做成温的，很贴心。", "ne": "Lulu Dessert House", "lon": 151.08265, "lat": -33.78922}, {"n": "Cafe Sydney", "t": "景观西餐", "r": "3", "p": 120, "a": "Circular Quay", "d": "章鱼、Beef Tartare、牛排、鸭胸、儿童炸鱼薯条", "i": "Customs House楼顶的景观西餐厅，正对Harbour Bridge，好天气来吃非常享受。两道菜120刀，三道菜145刀。前菜推荐章鱼和Beef Tartare，主菜推荐牛排和鸭胸；Raw Snapper调味过酸，不要点。儿童餐的Fish & Chips也很专业，外皮蓬松，鱼肉扎实。很适合招待来悉尼的亲友。", "ne": "Cafe Sydney", "lon": 151.20983, "lat": -33.86014}, {"n": "Pastry Club by Frenchs Fair", "t": "烘焙", "r": "3", "p": 12, "a": "Waterloo", "d": "牛角包", "i": "开在住宅小区水池边的烘焙店，棕榈树、仙人掌和碧绿的池水，很有地中海的感觉。牛角包在寒风里依然酥脆。巧克力巴斯克奶味较重。夏天来坐在水池边会更舒服。", "ne": "Pastry Club by Frenchs Fair", "lon": 151.20698, "lat": -33.9}, {"n": "Sydney Common", "t": "现代澳菜", "r": "5", "p": 120, "a": "Sheraton Grand Sydney Hyde Park", "d": "烤鸭、烤虾", "i": "喜来登酒店里的现代澳菜餐厅，招牌烤鸭非常出色，皮酥肉嫩，香料和蜂蜜相得益彰，可能是目前悉尼最好吃的鸭子。前菜烤虾也很好，酱汁好到值得加点面包来蘸。人均约120刀，值得专程来。", "ne": "Sydney Common", "lon": 151.21101, "lat": -33.87301}, {"n": "Martha's", "t": "烘焙", "r": "3", "p": 12, "a": "Wareemba", "d": "牛角包、Prawn Roll、巴斯克", "i": "人气很旺的烘焙店，周末人很多。牛角包款式丰富，透过玻璃橱窗能看到制作过程。也有少量Brunch，Prawn Roll份量很大。巴斯克蛋糕也值得一试。", "ne": "Martha's", "lon": 151.13098, "lat": -33.85701}, {"n": "Matkim", "t": "韩式Omakase", "r": "3", "p": 300, "a": "George St, CBD", "d": "龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷、南瓜籽挞", "i": "韩式Omakase，Matkim在韩语里就是Omakase的意思。主厨把韩国传统食物与创新做法结合，菜单随季节更换，秋季菜单共16道，用了很多韩国秋季食材。主菜牛肉和猪肉肠失手，其余小菜大多不错，龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷和南瓜籽挞印象最深。人均约300刀。", "ne": "Matkim", "lon": 151.2039, "lat": -33.86945}, {"n": "Bar Bruno", "t": "意大利菜", "r": "3", "p": 60, "a": "York St, CBD", "d": "炸虾、烤鸡、提拉米苏", "i": "新开不久的意大利餐厅，菜单不大，氛围小而精致，服务员带着浓浓的意大利口音。前菜炸虾好吃，主菜烤鸡很嫩，提拉米苏酒味稍淡但整体不错。值得回访把菜单吃一遍。", "ne": "Bar Bruno", "lon": 151.20995, "lat": -33.87055}, {"n": "Social Butterfly Tea & Dessert", "t": "中式茶馆", "r": "2", "p": 22, "a": "George St, CBD（Apple店隔壁二楼）", "d": "抹茶、提拉米苏、抹茶卷", "i": "市中心Apple Store隔壁二楼的中式茶馆，有茶、小蛋糕和中式点心，还有舒服的地台座位。落地飘窗可以俯瞰George St的车水马龙，很适合发呆。抹茶、提拉米苏和抹茶卷等餐点一般，主要为了环境而来。", "ne": "Social Butterfly Tea & Dessert", "lon": 151.20599, "lat": -33.86591}, {"n": "Hayashi Teppanyaki", "t": "铁板烧", "r": "2", "p": 60, "a": "Castle Hill", "d": "带子、大虾、鱿鱼", "i": "铁板烧餐厅，带子、大虾和鱿鱼不错，牛肉、鸡肉和炒饭一般。表演互动很热闹，接鸡蛋、接炒饭能让全桌开怀大笑，适合带长辈和小朋友来玩。人均约60刀，更贵的套餐不建议点。", "ne": "Hayashi Teppanyaki", "lon": 150.99783, "lat": -33.73011}, {"n": "Wonder Sushi", "t": "旋转寿司", "r": "2", "p": 45, "a": "Norwest", "d": "Otoro、海胆、鹅肝、和牛寿司", "i": "Norwest湖边的旋转寿司，餐后可以在水边散步。食材相对高级，有Otoro、海胆、鹅肝和和牛，但味道普通，有点中看不中吃。人均约四五十刀。", "ne": "Wonder Sushi", "lon": 150.962, "lat": -33.73201}, {"n": "蜀香坊", "t": "川菜老店", "r": "5", "p": 40, "a": "Chatswood Interchange", "d": "火爆双脆、二荆条炒猪脸肉、烧椒茄子、麻婆豆腐牛筋煲、炒笋干", "i": "Chatswood开了二十多年的川菜老店，出品稳定，还持续推出新菜。新菜火爆双脆和二荆条炒猪脸肉都很好吃，烧椒茄子、麻婆豆腐牛筋煲和炒笋干同样浓郁入味，是猛火爆炒的真功夫。", "ne": "Shu Xiang Fang", "lon": 151.17791, "lat": -33.79746}, {"n": "一鸣蒸汽石锅鱼", "t": "蒸汽石锅鱼", "r": "3", "p": 45, "a": "Eastwood", "d": "石锅鱼，配鱼糕、冻豆腐、虾滑、响铃", "i": "Eastwood的蒸汽石锅鱼，煮好后是一锅奶白鱼汤，看着清淡，喝起来非常鲜，暖胃。先喝汤再吃鱼，鱼肉很嫩，之后把鱼糕、冻豆腐、虾滑和响铃放进去煮，冻豆腐和响铃最吸汤。调味台的虾片炸得很好，小朋友很爱。午市套餐78刀，晚市88刀，很划算。", "ne": "Yiming Steam Stone Pot Fish", "lon": 151.07793, "lat": -33.79146}, {"n": "雄起", "t": "川菜现炒", "r": "3", "p": 50, "a": "Concord", "d": "豆花肥肠鱼、双椒牛肉、火爆腰花", "i": "现点现炒的川菜馆，不用预制菜，上菜较慢但值得等。豆花肥肠鱼一道菜四种食材，豆花嫩、肥肠香、鱼片弹、粉丝滑，各有滋味；双椒牛肉和火爆腰花也好吃。人均约50刀，份量大到能吃得很撑。", "ne": "Xiongqi", "lon": 151.10286, "lat": -33.85714}, {"n": "味道云南 Impression of Yunnan Table", "t": "云南菜", "r": "3", "p": 36, "a": "Ultimo", "d": "糟辣子炒脊肉筋、油淋干巴、百香果鱼片、薄荷炸排骨", "i": "开在蓝色小排屋里的云南菜，在悉尼比较少见。菜单选择多，百香果鱼片、橙皮辣子鸡、油淋干巴、菌菇焖饭、糟辣子炒脊肉筋、尖椒鹿茸菇和薄荷炸排骨都可以试，炒脊肉筋和油淋干巴最好吃。整体口味偏咸。人多建议早点到。人均约36刀。", "ne": "Impression of Yunnan Table", "lon": 151.19684, "lat": -33.87914}, {"n": "TRICO", "t": "饭团", "r": "2", "p": 12, "a": "Surry Hills", "d": "拉面溏心蛋饭团", "i": "小小的饭团店，口味不多，造型可爱，有三角形明太子饭团、长方形午餐肉鸡蛋饭团和圆形拉面溏心蛋饭团。拉面溏心蛋比明太子好吃，午餐肉鸡蛋饭团少了紫苏叶，层次欠一点。午市套餐价格实惠。", "ne": "TRICO", "lon": 151.20793, "lat": -33.88646}, {"n": "Single O", "t": "Cafe/Brunch", "r": "5", "p": 25, "a": "Surry Hills", "d": "Cold Brew、香蕉面包配Matcha Butter、牛油果太阳蛋吐司", "i": "人气极高的Cafe，周末不接受预订，常要排队近一小时，但值得等。门口标志性的水龙头供应Cold Brew。香蕉面包配抹茶黄油，抹茶的甘苦正好中和香蕉面包的甜腻；牛油果太阳蛋吐司的两颗蛋做得极好。人均约25刀，非常划算。", "ne": "Single O", "lon": 151.21394, "lat": -33.88756}, {"n": "Quoi Dining", "t": "法国Fine Dining", "r": "3", "p": 130, "a": "Baulkham Hills（Norwest水边）", "d": "Beef Tartare、鱼籽刺身挞、Pork Belly、安格斯牛排", "i": "Norwest湖边的法国Fine Dining，菜品有模有样。小食Beef Tartare和鱼籽刺身挞、前菜Pork Belly和意面、主菜安格斯牛排都不错，甜品一般可以不点。原价人均约130刀偏贵，用First Table优惠来吃非常划算。", "ne": "Quoi Dining", "lon": 150.96086, "lat": -33.73112}, {"n": "Hue coffee roasters", "t": "咖啡", "r": "3", "p": 10, "a": "Crows Nest", "d": "Cold Brew、巴斯克", "i": "下北区新开的咖啡店，连招牌都没有，很低调。咖啡和巴斯克蛋糕最近很火，Cold Brew好喝；巴斯克外圈焦香，中间流心，奶味较浓。", "ne": "Hue coffee roasters", "lon": 151.20565, "lat": -33.82422}, {"n": "Osteria di Russo & Russo", "t": "意大利小酒馆", "r": "3", "p": 80, "a": "Enmore", "d": "前菜、意面、鸭胸、提拉米苏", "i": "Enmore的小众意大利酒馆，菜单简单但每道都很细致。前菜小巧有风味，意面在线，主菜鸭胸很嫩，甜品选提拉米苏。整体奶油用得多，奶味重，不喜欢奶制品的人要仔细挑菜。", "ne": "Osteria di Russo & Russo", "lon": 151.17301, "lat": -33.9}, {"n": "囍记大排档", "t": "粤式大排档", "r": "3", "p": 60, "a": "Burwood", "d": "蒜蓉粉丝蒸生蚝、黑松露虾多士、手撕鸡、啫啫鲍鱼鸡煲、猪油渣炒芥蓝", "i": "粤式大排档，锅气足，食材新鲜，适合人多点一桌。特别推荐蒜蓉粉丝蒸生蚝、黑松露虾多士、招牌手撕鸡、啫啫鲍鱼鸡煲和猪油渣炒芥蓝。XO酱炒菜、蒸青衣和咕噜肉中等偏上，烤乳鸽火候过了。人均约60刀。", "ne": "Hei Kee Dai Pai Dong", "lon": 151.10301, "lat": -33.87393}, {"n": "冒丫冒菜 Dackie Maolatang", "t": "麻辣烫/麻辣拌", "r": "3", "p": 25, "a": "Macquarie Park", "d": "番茄汤底麻辣烫、黏糊麻辣拌、炸肉丸子", "i": "麻辣烫和麻辣拌小店。番茄汤底的麻辣烫很受小朋友欢迎；黏糊麻辣拌名副其实，多加鞭炮笋，口感咯吱咯吱很解压。食材选择不多，但炸肉丸子很好吃，可以多拿几颗。人均约25刀。", "ne": "Dackie Maolatang", "lon": 151.11692, "lat": -33.77745}, {"n": "Gina Pasta Bar", "t": "意大利菜", "r": "5", "p": 100, "a": "Barangaroo", "d": "炸墨鱼、火腿配哈密瓜、提拉米苏（夹巧克力碎）", "i": "Barangaroo临水的意大利餐厅，格调很好。前菜炸墨鱼和火腿配哈密瓜都好吃。提拉米苏是一绝，绵软浓郁，中间还夹着巧克力碎，赶时间的话可以跳过主菜直接吃甜品。人均约100刀。", "ne": "Gina Pasta Bar", "lon": 151.20102, "lat": -33.862}, {"n": "Itadakimasu Onigiri & Bar", "t": "饭团/居酒屋", "r": "2", "p": 40, "a": "Darlinghurst", "d": "Kimchi Salmon Tartare、带子刺身、牛排", "i": "Sandoichi隔壁的姐妹店，主打饭团，店很小，只有约10个座位，吧台位可以看到饭团制作过程。和牛、鳗鱼、炸虾和烤带子饭团都很普通，反而配菜出色，Kimchi Salmon Tartare、带子刺身和牛排比不少居酒屋还好吃。人均约40刀。", "ne": "Itadakimasu Onigiri & Bar", "lon": 151.21964, "lat": -33.8762}, {"n": "MLK Deli", "t": "意式三明治", "r": "3", "p": 20, "a": "Surry Hills", "d": "The MLK（开心果酱、火腿、橄榄）", "i": "蓝色小房子里的意式三明治店，外观可爱。同名招牌The MLK是开心果酱、火腿和橄榄，面包松软，非常香。一份二十多刀看着不便宜，但份量够分两顿吃。", "ne": "MLK Deli", "lon": 151.21002, "lat": -33.88292}, {"n": "明叔 Uncle Ming's", "t": "地下酒吧", "r": "3", "p": 45, "a": "York St, CBD", "d": "鸡尾酒", "i": "开了很多年的地下酒吧，红色灯光配中式摆件，风格诡异阴森，但人声鼎沸，气氛热闹。鸡尾酒好喝。胆小的人慎入，喜欢及时行乐的可以来。", "ne": "Uncle Ming's", "lon": 151.20508, "lat": -33.87207}, {"n": "Bar Conte", "t": "意大利菜", "r": "4", "p": 130, "a": "Clarence St, CBD", "d": "小章鱼配佛卡夏、牛排、鸭肉、可颂味鸡尾酒", "i": "起家于Surry Hills的意大利餐厅在市中心开的分店，像旧时代的歌舞厅，掀开红丝绒门帘，满屋暧昧灯光和戏剧感的墙画。前菜小章鱼的酱汁拿来蘸佛卡夏非常好吃；主菜牛排和鸭肉都出色；有一款喝起来带可颂味的鸡尾酒很特别。人均约130刀，周末有附加费。", "ne": "Bar Conte", "lon": 151.21116, "lat": -33.86774}, {"n": "Daruma Dumplings Beer House 不倒翁台式熱炒", "t": "台式热炒", "r": "5", "p": 40, "a": "Strathfield", "d": "沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉、盐酥鸡、老式芋泥蛋糕", "i": "很有台湾味的台式热炒店，锅气扑面，九层塔香气满屋，服务员用台湾腔喊单，非常适合下班放松。沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉和盐酥鸡都好吃，甜品老式芋泥蛋糕更是一绝。台湾大厨手法利落，服务员热情爱聊天，整家店很有温度。", "ne": "Daruma Dumplings Beer House", "lon": 151.09401, "lat": -33.87301}, {"n": "Eastwood Table", "t": "韩式猪排", "r": "3", "p": 30, "a": "Eastwood", "d": "猪排拼盘、芝士猪排、辣豆腐面条汤", "i": "Eastwood火车站出来、韩国街口不到20米的新开猪排店，近来人气很旺。入座先送一碗奶油汤。猪排拼盘份量很大，韩式猪排薄而嫩，芝士猪排可以拉丝，小朋友会喜欢；偏爱厚切日式猪排的人可能不太习惯。辣豆腐面条汤更出色，豆腐嫩滑入味，牛肉给得大方。店小常满座，人均约30刀。", "ne": "Eastwood Table", "lon": 151.08394, "lat": -33.79257}, {"n": "ESQ Bar + Dining", "t": "西餐", "r": "4", "p": 70, "a": "QVB（Tea Room正下方）", "d": "刺身、烤大虾、鸭胸、牛排、烤童子鸡", "i": "QVB Tea Room正下方的西餐厅，圆拱落地窗非常漂亮，冬日阳光洒进来很有氛围。前菜刺身和烤大虾不错，主菜鸭胸、牛排和烤童子鸡都很出色，肉质嫩，入味浓郁，做肉很拿手。商务、聚会和约会都合适，不喝酒人均约70刀。", "ne": "ESQ Bar + Dining", "lon": 151.20698, "lat": -33.872}, {"n": "Sofé Bakery", "t": "韩式烘焙", "r": "3", "p": 12, "a": "Wahroonga", "d": "抹茶巧克力可颂、蛋挞、Cold Brew Latte", "i": "Wahroonga火车站出来一分钟的韩式烘焙店。人气抹茶巧克力可颂酥到掉渣，略甜，配Cold Brew Latte刚好；蛋挞也不错。据熟客说，店里的咸口面包更好吃。", "ne": "Sofé Bakery", "lon": 151.117, "lat": -33.71799}, {"n": "小湖南 Little Hunan", "t": "湘菜", "r": "3", "p": 40, "a": "Chatswood Interchange", "d": "小炒黄牛肉、农家一碗香、腰肝合炒、长沙炒粉", "i": "开在Chatswood火车站楼上Interchange的湘菜馆，可以选小辣，辣度友好。菜式重口下饭、偏咸。小炒黄牛肉、农家一碗香、腰肝合炒和长沙炒粉都好吃；酸豆角炒鸡胗太咸，腌笋腊肉的腊肉一般。", "ne": "Little Hunan", "lon": 151.18395, "lat": -33.79856}, {"n": "Wooden Bowl Hamjibak", "t": "韩式中华料理", "r": "3", "p": 20, "a": "West Ryde", "d": "60刀套餐：糖醋肉、炸酱面、海鲜汤面", "i": "韩式中华料理，以糖醋肉加炸酱面的组合为特色。60刀套餐有糖醋猪肉、炸酱面和海鲜汤面，够三个人吃饱。糖醋肉用纯瘦肉，炸得酥嫩；两款面都很好吃。人均约20刀，非常划算。", "ne": "Wooden Bowl Hamjibak", "lon": 151.08884, "lat": -33.80513}, {"n": "山嘢贵州家菜 Ye Mama's Kitchen", "t": "贵州菜", "r": "3", "p": 50, "a": "Chatswood", "d": "凉拌米皮、辣子鸡、爆炒猪背筋、酸菜炒黑芝麻汤圆", "i": "贵州家常菜，辣度很高，凉拌米皮和辣子鸡尤其辣。炝锅鱼不太辣，外皮酥脆但内里不够入味。爆炒猪背筋又韧又弹牙，很精彩；鹿茸菇同样做法，两道都香但偏油。酸菜炒黑芝麻汤圆是一道奇特菜，又酸又辣又咸甜，意外地不违和。人均约50刀。", "ne": "Ye Mama's Kitchen", "lon": 151.18, "lat": -33.79393}, {"n": "江西味道 Jiangxi Flavour", "t": "江西菜", "r": "4", "p": 40, "a": "Burwood", "d": "江西炒粉、辣炒鳝鱼、笋干炒肉、瓦罐汤", "i": "锅气很足的江西菜，全店只有老板一个人做饭、上菜、收银和清洁，出品却很稳定。江西炒粉Q弹微辣，酱香和蛋香融合得好；辣炒鳝鱼很嫩，但辣度很高，不太能吃辣的人慎点；笋干炒肉脆而有嚼劲，吸满油香；瓦罐汤清甜不油，是慢慢煨出来的味道。", "ne": "Jiangxi Flavour", "lon": 151.1021, "lat": -33.88005}, {"n": "潮运莱", "t": "潮州菜", "r": "2", "p": 40, "a": "Chinatown", "d": "普宁豆腐、砂锅粥（需等40分钟）", "i": "潮州菜馆，整体刚过及格线。普宁炸豆腐好吃；炒粿条味道不错但粿条本身一般；鱼饭清爽；砂锅粥要等约40分钟，味道可以。卤水略带苦味，蚝烙不够正宗，生腌三文鱼蒜味太重盖过鱼味。相比之下福记更稳。", "ne": "Chao Yun Lai", "lon": 151.20421, "lat": -33.88084}, {"n": "KIKI Dessert", "t": "Cafe/蛋糕", "r": "3", "p": 22, "a": "Ultimo（Central去UTS路上小巷）", "d": "巧克力蛋糕配Cold Brew", "i": "藏在Central去UTS路上麦当劳旁小巷里的小Cafe，很有情调。后厨开放，蛋糕应该是店里现做的。巧克力蛋糕配Cold Brew很搭，店里还有一些可爱的书可以翻看。位置难找，但值得来。", "ne": "KIKI Dessert", "lon": 151.1982, "lat": -33.88185}, {"n": "Modo Mio", "t": "意大利菜", "r": "3", "p": 75, "a": "Castle Hill", "d": "Puff Bread、炸海鲜、Beef Tartare、蛤蜊珍珠面、提拉米苏", "i": "山区有点小Fine Dining感觉的意大利餐厅。前菜Puff Bread、炸海鲜和Beef Tartare都很好吃。主菜稍普通，牛排不够香嫩，蛤蜊珍珠面浓郁好吃，蟹肉意面一般。提拉米苏非常出色，软绵湿润。人均约75刀。", "ne": "Modo Mio", "lon": 150.9992, "lat": -33.73283}, {"n": "Costi's Fresh Seafood", "t": "海鲜零售", "r": "4", "p": 30, "a": "Castle Tower（Castle Hill）", "d": "Premium Yamba Cooked Tiger虾（约45刀每公斤）、生蚝、Otoro、Salmon Belly", "i": "Castle Hill一带有名的海鲜店，极其新鲜。推荐Premium Yamba Cooked Tiger熟虾，约45刀一公斤，虾肉弹牙、海味浓郁。刺身同样出色，生蚝、Otoro和Salmon Belly都值得买回家配意面或下酒。", "ne": "Costi's Fresh Seafood", "lon": 151.00064, "lat": -33.72923}, {"n": "Freo", "t": "酸奶冰淇淋/烘焙", "r": "5", "p": 9, "a": "St Leonards", "d": "抹茶、奶茶、巧克力、海盐开心果四味mix；海盐面包、巧克力曲奇", "i": "悉尼二帽餐厅Lumi Dining主厨在St Leonards开的酸奶冰淇淋旗舰店，店面很大，除酸奶冰淇淋外还有每日现烤的Pastry。酸奶口味有十几种，包括门店限定款，抹茶、奶茶、巧克力和海盐开心果混在一起最好吃。配料台选择多得惊人，有新鲜水果、麻薯、饼干、花生酱、开心果酱，还有巧克力酱和抹茶酱的水龙头。海盐面包、巧克力曲奇、斑斓椰子水和草莓苏打也都不错，还有Brunch。", "ne": "Freo", "lon": 151.19501, "lat": -33.82299}, {"n": "喜凤台 East Phoenix", "t": "粤式早茶", "r": "3", "p": 35, "a": "Zetland（East Village）", "d": "推车点心、XO Pipi、避风塘炒蟹", "i": "出品稳定的粤式早茶酒楼，周末中午点心推车一圈圈来，选择很多。点心车上甚至有XO酱炒Pipi和避风塘炒蟹，XO Pipi很好吃，剩下的XO酱可以拌炒面。人均约35刀就能吃得很饱。", "ne": "East Phoenix", "lon": 151.20683, "lat": -33.90514}, {"n": "Oshu Japanese Restaurant", "t": "日料", "r": "2", "p": 60, "a": "West Ryde", "d": "寿司刺身拼盘、拉面", "i": "韩国人开的日料店，味道不错。寿司刺身拼盘用木制阶梯摆盘，很有特色。拉面汤底不是熬出来的，但吃完冷寿司后来一碗热汤面很舒服。价格偏高，人均约60刀。", "ne": "Oshu Japanese Restaurant", "lon": 151.09021, "lat": -33.80784}, {"n": "Fresh Delight Bakery & Cafe", "t": "越南包", "r": "2", "p": 11, "a": "West Ryde", "d": "烧肉越南包", "i": "开在Woolworths停车场旁的越南包店，11刀一个，烧肉和蔬菜给得满满的，一个就够一顿。缺点是烧肉的皮不脆。适合想快速解决一餐时买，越南包爱好者不必专程。", "ne": "Fresh Delight Bakery & Cafe", "lon": 151.09165, "lat": -33.80421}, {"n": "The Chairman 湖南人湘菜馆", "t": "湘菜", "r": "2", "p": 35, "a": "Botany", "d": "烟笋腊肉、粉蒸肉、青椒茄子、湖南牛肉粉", "i": "开了很多年的湘菜馆，锅气足，很下饭。可惜肉质一般，野山椒牛肉和湖南小炒肉都偏柴；烟笋腊肉、粉蒸肉和青椒茄子不错。湖南牛肉粉是宽条，和一甲一嗦的细粉不同。人均约35刀很划算，住得近可以来，远的话可去可不去。", "ne": "The Chairman", "lon": 151.196, "lat": -33.94601}, {"n": "Norimono", "t": "日式手卷", "r": "2", "p": 90, "a": "Crows Nest", "d": "和牛鹅肝卷、XO带子卷、长腿蟹卷、茶碗蒸", "i": "板前现做手卷的日料店，形式像Omakase但不是Omakase。手卷有传统、创新和Premium几十种口味，和牛鹅肝卷、XO带子卷、长腿蟹卷和茶碗蒸都好吃。人均约90刀还吃不饱，想吃饱大概每人还要多花约50刀。", "ne": "Norimono", "lon": 151.2009, "lat": -33.82646}, {"n": "Manon The Room", "t": "英式茶室", "r": "3", "p": 30, "a": "Chatswood Chase", "d": "早餐", "i": "Chatswood Chase里的英式茶室，和QVB Tea Room是同一家族的姐妹店。低调的木质装潢配闪亮银器茶具，很有复古感。早餐菜单简单美味，是Chatswood少有的有档次的Cafe。人均约30刀。", "ne": "Manon The Room", "lon": 151.17909, "lat": -33.80005}, {"n": "Jamaican Patty Bakehouse", "t": "牙买加肉饼", "r": "3", "p": 12, "a": "Glebe", "d": "牙买加BBQ鸡肉馅肉饼", "i": "Glebe Point Rd上卖牙买加肉饼的小店。金黄外皮是一碰就掉渣的酥皮，内馅有鸡肉、牛肉和蔬菜等口味，牙买加特色BBQ鸡肉馅味道特别浓郁，小朋友也爱吃。", "ne": "Jamaican Patty Bakehouse", "lon": 151.1862, "lat": -33.88084}, {"n": "The Wedge", "t": "咖啡", "r": "3", "p": 20, "a": "Glebe", "d": "巧克力蛋糕配Long Black", "i": "简单的街角咖啡店，临窗位置可以看街景，适合一个人安静地喝下午茶。巧克力蛋糕是沙沙的口感，很甜，配很苦的Long Black反而出奇地好吃。约20刀。", "ne": "The Wedge", "lon": 151.18764, "lat": -33.87721}, {"n": "JEONG DAM 情谈", "t": "韩国菜", "r": "3", "p": 30, "a": "Eastwood", "d": "牛肉饼、海鲜煎饼、豆腐海鲜汤", "i": "新开的韩国菜，中文名叫情谈，可外带。薄牛肉饼好吃，海鲜饼香脆，豆腐海鲜汤暖身；炸鸡一般，面衣偏厚。人均约30刀。", "ne": "JEONG DAM", "lon": 151.07999, "lat": -33.78793}, {"n": "咕嘟砂锅", "t": "砂锅菜", "r": "4", "p": 45, "a": "Eastwood", "d": "鲜椒鳝鱼（底铺米线）、鲜椒双脆、豆花牛肉、肥肠鱼、手撕羊排", "i": "冬天很适合来的砂锅菜馆，砂锅上桌时咕嘟冒泡，热气腾腾。新推出的鲜椒系列很好吃，鲜椒鳝鱼底下铺着米线，吸足双椒香和鳝鱼的鲜，鲜椒双脆也出色。豆花牛肉、肥肠鱼和手撕羊排都很下饭。人均约45刀能吃撑。", "ne": "Gudu Claypot", "lon": 151.07907, "lat": -33.79405}, {"n": "Te Japanese Dining", "t": "日料", "r": "3", "p": 50, "a": "Wentworth Point", "d": "Salmon Tartare、牛排", "i": "Wentworth Point居民楼下的日料店，水准比位置给人的期待高。Salmon Tartare和牛排很出色；拉面汤底不是熬的，天妇罗略油，但都不影响整体。人均约50刀吃得饱。", "ne": "Te Japanese Dining", "lon": 151.07501, "lat": -33.82801}, {"n": "MANI Restaurant", "t": "海鲜/中式融合", "r": "3", "p": 70, "a": "Sydney Fish Market", "d": "三文鱼生腌、XO Pipi配苔条粢饭糕、香辣昆士兰小龙虾", "i": "新鱼市里的海鲜餐厅，口碑是又贵又好吃。菜式融合了上海菜的精致、广东菜的手法和一点川味。三文鱼生腌清爽开胃；XO Pipi底下铺着苔条粢饭糕，非常搭。重头戏是昆士兰小龙虾，下锅前先拿活虾给客人看，个头可能是悉尼最大，肉质紧实，香辣口味相当辣，拌饭吃很满足。很适合带长辈来鱼市时吃一顿好的。", "ne": "MANI Restaurant", "lon": 151.18886, "lat": -33.87213}, {"n": "iisho", "t": "抹茶软雪糕", "r": "3", "p": 9, "a": "CBD", "d": "抹茶软雪糕", "i": "市中心的抹茶软雪糕店，抹茶味浓郁，很好吃。", "ne": "iisho", "lon": 151.20265, "lat": -33.86752}, {"n": "诚 Makoto Sushi Bar", "t": "寿司", "r": "2", "p": 120, "a": "World Square", "d": "寿司、手卷", "i": "悉尼的老牌寿司店，食材新鲜但口味普通，已不如当年出众。曾在三文鱼手卷里吃到长鱼刺，店家诚恳道歉并免了该单。如今悉尼好吃的寿司店太多，不太值得专程来。", "ne": "Makoto Sushi Bar", "lon": 151.20565, "lat": -33.87721}, {"n": "Radio Taco", "t": "墨西哥菜", "r": "4", "p": 20, "a": "Chippendale", "d": "牛肉Burrito（含薯条）", "i": "Chippendale的墨西哥Taco店，原来是韩国炸鸡店，开业不到一年就拿到4.7高分。装修色彩明亮热情。牛肉Burrito塞满嫩牛肉碎和脆薯条，非常好吃，20刀一个，够分两顿。附近有白兔画廊，可以顺路。", "ne": "Radio Taco", "lon": 151.19786, "lat": -33.88513}, {"n": "Lana", "t": "意大利菜", "r": "3", "p": 160, "a": "Circular Quay（Grana楼上）", "d": "琵琶虾海鲜意面、牛排、烤鸡（当日最佳）", "i": "Grana楼上的意大利餐厅，装修和氛围与楼下很接近。前菜Kingfish刺身和虾多士中规中矩。主菜是精华，琵琶虾海鲜意面和牛排都好，烤鸡最出色，蘑菇香浓，连鸡胸都很嫩。提拉米苏做成巧克力慕斯的非传统版本，略怪但好吃。氛围好，适合约会和姐妹聚会，人均约160刀。", "ne": "Lana", "lon": 151.2112, "lat": -33.86282}, {"n": "Sydney Eels BBQ", "t": "韩式烤鳗鱼/鸭肉", "r": "5", "p": 60, "a": "Homebush", "d": "炭烤和辣酱澳洲野生鳗鱼、韭菜鸭肉、酱蟹、蒸蛋", "i": "少见的以鳗鱼和鸭肉为主角的韩式烤肉店。澳洲野生鳗鱼肉质紧实弹牙，炭烤和辣酱两种口味都好吃，炭烤后不腥不腻，在整个澳洲都难得。鸭肉配韭菜很入味。酱蟹拌饭和蒸蛋是很好的配角。非常推荐。", "ne": "Sydney Eels BBQ", "lon": 151.08299, "lat": -33.86601}, {"n": "Dubudang 두부당", "t": "韩国豆腐店", "r": "3", "p": 45, "a": "Epping", "d": "海鲜豆腐汤、泡菜炒猪肉配白豆腐、紫苏油煎豆腐", "i": "Eastwood和Epping一带近来很火的韩国豆腐店，饭点要排队，错峰就不用。豆腐是粗糙有料的口感，和常见的嫩豆腐不同，配上韩式重口酱料效果极好。推荐海鲜豆腐汤、泡菜炒猪肉配白豆腐和紫苏油煎豆腐。不特别爱豆腐的人不必专程，但能把普通食材做到极致很值得敬佩。人均约45刀。", "ne": "Dubudang", "lon": 151.082, "lat": -33.773}, {"n": "Bakery 101", "t": "烘焙", "r": "3", "p": 12, "a": "Eastwood", "d": "巧克力包、蝴蝶酥、火腿芝士牛角包", "i": "Eastwood韩国街新开的面包店，大红色店面大气洋气。店小但品类很多，巧克力包、蝴蝶酥和现烤火腿芝士牛角包都好吃，只是不算惊艳。可以坐下喝杯咖啡，Panini也值得一试。", "ne": "Bakery 101", "lon": 151.08515, "lat": -33.78973}, {"n": "妈妈小厨 Mama's Wok", "t": "家常小炒", "r": "3", "p": 40, "a": "Rhodes Waterside", "d": "盐焗鸡、茄子焖脆皖、炒花菜", "i": "评价褒贬不一的家常小炒馆，苍蝇馆子风格，上菜快。盐焗鸡、茄子焖脆肉鲩和炒花菜都很下饭，茄子做得尤其好。人均约40刀能吃很饱，饭后可以去隔壁Urban Jungle买杯咖啡。", "ne": "Mama's Wok", "lon": 151.08994, "lat": -33.83158}, {"n": "Cafe on Melrose", "t": "韩式Cafe/Brunch", "r": "3", "p": 40, "a": "Melrose Park", "d": "大虾意面、特调咖啡、自搭佛卡夏拼盘", "i": "Melrose Park住宅区楼下的韩国小Cafe，人气很旺，可能是附近最好的一家。特调饮品好喝，大虾意面好吃不腻。可以自由搭配的Brunch盘也很有意思，佛卡夏、牛油果、薯饼、韩式炸鸡和西班牙香肠配在一起出奇地好。人均约40刀。", "ne": "Cafe on Melrose", "lon": 151.07318, "lat": -33.81684}, {"n": "Hustlers. Syd", "t": "亚洲融合", "r": "3", "p": 100, "a": "York St, CBD", "d": "虾多士、三文鱼、牛排、叉烧鸡肉、菲律宾Ube Cake", "i": "有帽子评级的亚洲融合餐厅，周五晚上满座，很吵但气氛很好。虾多士、三文鱼、牛排和叉烧鸡肉颜值和味道都在线，鸡尾酒精致。甜品菲律宾Ube Cake很好吃。适合周五下班后来放松，人均约100刀。", "ne": "Hustlers. Syd", "lon": 151.20911, "lat": -33.87273}, {"n": "Porter House Grounds & Cellar Door", "t": "酒吧/咖啡", "r": "3", "p": 45, "a": "Castlereagh St, CBD", "d": "黑咖啡", "i": "白天兼卖咖啡的酒吧，亮黄色的空间很明媚，在酒吧里喝黑咖啡别有一番感觉。", "ne": "Porter House Grounds & Cellar Door", "lon": 151.20854, "lat": -33.8649}, {"n": "Lee Ho Fook 利口福", "t": "中餐", "r": "5", "p": 100, "a": "Castlereagh St, CBD", "d": "海胆虾多士、清蒸牙鱼配豆腐、鸭子", "i": "从墨尔本开到悉尼的澳式中餐，悉尼店获评两帽，是少数做得好的澳式中餐，有融合元素，但口味很中国。虾多士把虾胶塞进面包里，配蒜苗、咸蛋黄和牛油做的酱，咸香好吃，上面再放海胆。北京鸭经过10天熟成，皮下油脂去尽，皮脆肉嫩，几乎没有鸭骚味，配自制梅子酱，荷叶饼放凉也不会变硬。蟹肉带子XO酱福建炒饭比大多数粤菜馆做得好，虾干和瑶柱香味突出。清蒸牙鱼嫩得像豆腐。姜葱蒸鳕鱼偏西式，想吃中式蒸鱼不要点；甜品也不推荐。人均约100刀。", "ne": "Lee Ho Fook", "lon": 151.20231, "lat": -33.87125}, {"n": "Chinatown Country Club", "t": "咖啡/服装店", "r": "3", "p": 12, "a": "Clarence St, CBD", "d": "月亮河（Cold Brew加枫糖奶盖）", "i": "QVB附近的服装店加咖啡店，空间宽敞，适合悠闲地坐着喝咖啡，也有不少人在这里用电脑。招牌月亮河是Cold Brew加枫糖奶盖，清甜爽口。服装陈列很好看。", "ne": "Chinatown Country Club", "lon": 151.21253, "lat": -33.87002}, {"n": "Caness", "t": "西班牙小馆", "r": "3", "p": 60, "a": "Paddington", "d": "餐前面包、香肠、牛排、大虾、章鱼、烤鸡、南瓜、巧克力慕斯、巴斯克", "i": "氛围很好的西班牙小馆，每道菜都好吃，只是略咸，配酒正合适。餐前面包、香肠、牛排、大虾、章鱼、烤鸡和南瓜都可以点，甜品有巧克力慕斯和巴斯克蛋糕。适合约会或两对朋友聚餐。", "ne": "Caness", "lon": 151.22898, "lat": -33.884}, {"n": "Cherry Beans Bakery Cafe", "t": "韩式烘焙", "r": "2", "p": 12, "a": "West Ryde", "d": "可颂、蛋糕", "i": "很韩式的烘焙Cafe，面包蛋糕精致可爱。晚上去货架所剩不多，味道中规中矩，不算惊艳。可颂切开夹煎蛋就是一顿简餐。", "ne": "Cherry Beans Bakery Cafe", "lon": 151.0869, "lat": -33.80645}, {"n": "Han Yakiniku", "t": "日式烤肉自助", "r": "3", "p": 59.5, "a": "West Ryde", "d": "Wagyu Blade Cube Cut", "i": "日式烤肉自助，每位59.5刀。两款Wagyu最值得狂点，尤其Wagyu Blade Cube Cut，很嫩很好吃。选择不算多，一轮就能点齐想吃的，但上菜快、服务好，儿童按半价收费。很适合运动后胃口大开的时候来。", "ne": "Han Yakiniku", "lon": 151.09294, "lat": -33.80756}, {"n": "Jihomakase", "t": "日式Omakase", "r": "5", "p": 225, "a": "North Bridge", "d": "18道套餐，含拉面、寿司、甜点", "i": "非常良心的日式Omakase，每位190刀，份量很足，很多菜式有巧思。食材不算顶级，但主厨手艺扎实。一共约18道，以为快结束时还会上拉面、四贯寿司和两道甜品，胃口小的人会吃不完。不难订位，加酒水人均约225刀，值得去。", "ne": "Jihomakase", "lon": 151.21701, "lat": -33.80901}, {"n": "Sashimi Shinsengumi 新鲜组", "t": "刺身外带", "r": "3", "p": 120, "a": "Crows Nest", "d": "10贯寿司拼盘、Salmon Belly、Kingfish Belly、Otoro", "i": "以新鲜著称的刺身外带柜台，小小一个柜台塞满各种刺身。10贯寿司拼盘、Salmon Belly、Kingfish Belly和Otoro都非常肥美新鲜。价格不便宜，约120刀大概只够一人份。", "ne": "Sashimi Shinsengumi", "lon": 151.20694, "lat": -33.82757}, {"n": "无名冒菜", "t": "冒菜/麻辣拌", "r": "3", "p": 22, "a": "Eastwood", "d": "冒菜、黏糊麻辣拌（加方便面）", "i": "附近的冒菜小店，可以反复回访。冒菜底料很香，盖在米饭上拌着吃停不下来。新推出麻辣拌，可以自己加芝麻酱做成黏糊麻辣拌，记得加方便面。价格很友好，拿一大碗也没负担。", "ne": "Nameless Maocai", "lon": 151.07664, "lat": -33.78951}, {"n": "Hashi Sushi", "t": "旋转寿司", "r": "5", "p": 35, "a": "Macquarie Park", "d": "炙烤鹅肝三文鱼腩手卷、海胆带子刺身手卷、甜虾带子三文鱼手卷", "i": "Macquarie Centre的旋转寿司，可以算目前悉尼旋转寿司的天花板，现在已经不太用排队。转带上的寿司已经很新鲜，手卷更惊艳，推荐炙烤鹅肝三文鱼腩、海胆带子刺身和甜虾带子三文鱼刺身手卷。柱子上贴着当天的新鲜鱼获，照着点准没错。", "ne": "Hashi Sushi", "lon": 151.12296, "lat": -33.77856}, {"n": "Bambini Trust Restaurant & Wine Room", "t": "意大利菜", "r": "3", "p": 110, "a": "Elizabeth St, CBD", "d": "奶油大虾意面、炸海鲜、烤鸡", "i": "海德公园对面老建筑里的老钱风意大利餐厅，桌子小、灯光暗、烛光点点，氛围极好。送面包和餐前奶酪小球。前菜奶油大虾意面和炸海鲜不错，主菜烤鸡好吃，牛排是纯瘦肉，口感稍差。份量足，可能吃不下提拉米苏和柠檬挞。人均约110刀，主要为氛围买单。", "ne": "Bambini Trust Restaurant & Wine Room", "lon": 151.20983, "lat": -33.87213}, {"n": "Bene & Co", "t": "意大利菜", "r": "3", "p": 60, "a": "McMahons Point", "d": "大虾意面（很辣）、杯装提拉米苏", "i": "北悉尼往海湾方向路上的意大利小店，Pizza和意面看起来都很香。大虾意面很好吃但非常辣。杯装提拉米苏很出色，绵软浓郁。两份约45刀。", "ne": "Bene & Co", "lon": 151.20402, "lat": -33.846}, {"n": "Le Rooftop", "t": "韩国女生开的小酒馆", "r": "2", "p": 50, "a": "McMahons Point", "d": "炸菜花、牛排", "i": "北悉尼往海湾路上一位韩国女生开的小酒馆，很有情调，红木门旁的临街座位很惬意。食物中等偏上：炸菜花适合配酒，虾吐司太油，牛排很好吃，底下铺的米饭泡在酱汁里刚好。人均约50刀。", "ne": "Le Rooftop", "lon": 151.20284, "lat": -33.84512}, {"n": "卤匠麻辣鸭", "t": "鸭货外带", "r": "3", "p": 20, "a": "Burwood", "d": "鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭舌", "i": "麻辣鸭货外带店，鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭肠、鸭心和鸭舌都有。入口麻辣辛香带回甜，肉质紧实有嚼劲，非常适合追剧或配米酒。", "ne": "Lujiang Spicy Duck", "lon": 151.10814, "lat": -33.87573}, {"n": "Doyles on the Beach", "t": "海鲜/海景", "r": "3", "p": 90, "a": "Watsons Bay", "d": "海鲜、生蚝", "i": "Watsons Bay的海鲜餐厅，可以望见整个屈臣氏湾和远处CBD天际线，海面上帆船游艇点点，天气好的午后美不胜收。以海鲜为主，味道不错但偏贵，人均约90刀还不太饱，主要为景色买单。订位时记得要二楼露台。饭后可以在沙滩上玩沙晒太阳。", "ne": "Doyles on the Beach", "lon": 151.28199, "lat": -33.84401}, {"n": "Baker Bleu", "t": "烘焙", "r": "2", "p": 12, "a": "Double Bay", "d": "三明治、酸面包", "i": "富人区的人气烘焙店，克莱因蓝的店面很舒服，周末上午常排长队，要等十几分钟。整体都不错但不算惊艳。酸面包很硬，牙口不好的人慎选，三明治最值得推荐。", "ne": "Baker Bleu", "lon": 151.24301, "lat": -33.87699}, {"n": "Adhika Cafe", "t": "菲律宾Cafe", "r": "4", "p": 22, "a": "Rushcutters Bay", "d": "Ube拿铁、Ube抹茶、Ube Cake、Pandesal猪肉鸡蛋三明治", "i": "很特别的菲律宾Cafe。Ube拿铁和Ube抹茶好喝，Ube奶油绵密，杯壁晕染得像油画；Ube Cake是最佳单品。猪肉鸡蛋三明治用的Pandesal面包口感独特，是菲律宾有名的面包，店里墙上有它的介绍。", "ne": "Adhika Cafe", "lon": 151.228, "lat": -33.875}, {"n": "Million Chicken", "t": "韩式烤鸡", "r": "3", "p": 22, "a": "Epping", "d": "烤鸡（可选辣度，一级已很辣）、加芝士或粉耗子", "i": "Epping的韩式烤鸡店，烤鸡可选辣度，一级已经很辣。鸡肉算嫩，可以加芝士、面条和粉耗子等配菜。Rose麻辣烫偏奶。气泡饮料太甜，建议直接配啤酒。", "ne": "Million Chicken", "lon": 151.08086, "lat": -33.77212}, {"n": "Cafe Balibre", "t": "Cafe/Brunch", "r": "3", "p": 45, "a": "Macquarie Park", "d": "太阳蛋牛排、牛油果吐司、Mont Blanc Cold Brew", "i": "周末早上很火的社区Cafe，附近居民常来。牛油果吐司和太阳蛋牛排不错，牛排略柴，但三十多刀很满足。咖啡也好，Mont Blanc是Cold Brew加香草奶盖。人均约45刀。", "ne": "Cafe Balibre", "lon": 151.11901, "lat": -33.77392}, {"n": "Tailor Room", "t": "概念鸡尾酒吧", "r": "3", "p": 50, "a": "The Rocks", "d": "按布料选鸡尾酒（Cotton、皮革等）", "i": "很有意思的概念鸡尾酒吧，按不同布料对应不同风格的鸡尾酒，选皮革会得到一杯浓烈的酒，选Cotton则是一杯轻松的泡沫甜酒。空间很小，约5张小桌加6个吧台位，适合三五好友挤着聊天。", "ne": "Tailor Room", "lon": 151.20683, "lat": -33.85812}, {"n": "品粹轩", "t": "本帮菜", "r": "4", "p": 40, "a": "The Rocks", "d": "葱油鸡、响油鳝丝、咸蛋黄狮子头、黄鱼汤、炒猪肝、鱼皮饺子", "i": "The Rocks的本帮菜馆，菜式地道。葱油鸡、响油鳝丝、咸蛋黄狮子头、黄鱼汤、炒猪肝和鱼皮饺子都很好吃，有时略咸。人均约40刀，以The Rocks的位置来说很划算。", "ne": "Pin Cui Xuan", "lon": 151.2082, "lat": -33.86083}, {"n": "吾家有面 Wu's Noodle House", "t": "手工面馆", "r": "3", "p": 30, "a": "Chatswood（Chase斜对面）", "d": "肉沫茄子拌面、炒猪肝、香菜牛肉、农家一碗香", "i": "Chatswood Chase斜对面的手工面馆，面条纯手工，很适合做拌面，肉末茄子拌面尤其好吃。炒菜有好有普通，猪肝、香菜牛肉和农家一碗香不错，咸蛋黄鸡翅偏干不入味。人均约30刀。", "ne": "Wu's Noodle House", "lon": 151.18517, "lat": -33.79576}, {"n": "Mamuki", "t": "日式Brunch/抹茶", "r": "2", "p": 32, "a": "Glebe Point Rd, Glebe", "d": "刺身盖饭、三文鱼茶泡饭、饭团、创意抹茶", "i": "从Newtown开到Glebe的日式Brunch店，抹茶饮品有一整页菜单，创意很多。刺身盖饭和三文鱼茶泡饭只算及格。木质调的简约环境很舒服，饭团可以外带。", "ne": "Mamuki", "lon": 151.18293, "lat": -33.87945}, {"n": "BananaLa 香蕉小馆（已由蓝曦食堂接手）", "t": "湘式小炒", "r": "3", "p": 50, "a": "Rhodes", "d": "炒鸡、生炒肥肠、炒米粉", "i": "Rhodes居民区里的湘式小炒，现已由蓝曦食堂接手。炒鸡好吃够辣；生炒肥肠是白色的，很香；辣椒炒肉的瘦肉略柴；土匪猪肝一般。几道菜配炒米粉非常过瘾。人均约50刀。", "ne": "BananaLa (now Lanxi Kitchen)", "lon": 151.08599, "lat": -33.82694}, {"n": "春熙路北川菜馆", "t": "川菜（成都口味）", "r": "4", "p": 35, "a": "Ultimo", "d": "夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、老妈蹄花", "i": "UTS附近的成都口味川菜，辣而不过分。夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、风味百叶和老妈蹄花都好吃。鳝段量大鲜美；胸口油炒牛筋一脆一韧，口感交替，很有创意。人均约35刀，很受学生欢迎。", "ne": "Chunxi Road Sichuan", "lon": 151.19965, "lat": -33.87822}, {"n": "Little Cake Box", "t": "蛋糕店", "r": "5", "p": 14, "a": "Broadway", "d": "无花果蛋糕、双莓石榴布蕾", "i": "以季节水果蛋糕见长的蛋糕店，需要预订。季末的无花果蛋糕堆满新鲜无花果，成熟度刚好，清甜高级，非常出色。新季的双莓石榴布蕾是层叠做法，一层入口即化的法式布蕾，一层爆汁的石榴籽和酸甜树莓酱，很有趣。", "ne": "Little Cake Box", "lon": 151.19399, "lat": -33.884}, {"n": "Pane e Prosciutto Artisan Deli & Panini Bar", "t": "意式Panini", "r": "3", "p": 18, "a": "Putney", "d": "Signature Panini（火腿腌肉加开心果酱）、辣油", "i": "最近走红的意式Panini小店，熟客很多，店员和客人寒暄热络。招牌Signature是多种火腿腌肉加开心果酱，外壳脆、内里韧，份量大，半个就很饱。店里卖的辣油拌面拌饭都好吃，值得回购。", "ne": "Pane e Prosciutto Artisan Deli & Panini Bar", "lon": 151.10602, "lat": -33.82599}, {"n": "Taste of Tuscany", "t": "传统西餐", "r": "3", "p": 40, "a": "Carlingford", "d": "大虾意面、炸Veal排配番茄酱", "i": "Eastwood和Epping一带少有人知的老式传统西餐厅，味道不错。大虾意面弹牙够味，扁平的炸小牛排配熬制番茄酱很解腻。人均约40刀。", "ne": "Taste of Tuscany", "lon": 151.04818, "lat": -33.78383}, {"n": "老细屋里", "t": "湘菜", "r": "5", "p": 40, "a": "Eastwood", "d": "辣椒炒肉、土匪猪肝、辣猪手、炒肥肠、肉饼蒸蛋、莲藕汤", "i": "Eastwood原一甲一嗦位置新开的湘菜馆，味道更好。辣椒炒肉、鸡汤、辣猪手、炒鸡胗、炒肥肠、土匪猪肝、莲藕汤和肉饼蒸蛋都值得闭眼点，人多来最好，可以多点几道。", "ne": "Lao Xi Wu Li", "lon": 151.0831, "lat": -33.79471}, {"n": "Akti", "t": "希腊菜", "r": "3", "p": 100, "a": "Woolloomooloo", "d": "Kingfish刺身、烤章鱼配Pita、半只鸡", "i": "Woolloomooloo码头新开的希腊餐厅，在老牌意大利餐厅Otto旁边，傍晚火烧云下的海湾景色非常美。前菜Kingfish刺身和烤章鱼配Pita面包很好吃。主菜半只烤鸡肉略柴，但已尽量做嫩。适合姐妹聚会和情侣约会，人均约100刀。", "ne": "Akti", "lon": 151.22199, "lat": -33.86901}, {"n": "OX LAN LanZhou Beef Noodle", "t": "兰州拉面", "r": "4", "p": 15, "a": "Carlingford Court", "d": "红烧牛肉面、炸酱面（可免费续面）", "i": "Carlingford Court的人气兰州拉面，开业初期要排长龙，现在不用排了。手工拉面一碗十几刀，还可以免费续面，续的面份量和一整碗差不多，吃不完可以打包。红烧牛肉面和炸酱面味道都好。人均约15刀，性价比极高。", "ne": "OX LAN LanZhou Beef Noodle", "lon": 151.04966, "lat": -33.78023}, {"n": "Hachioji", "t": "日料Omakase", "r": "2", "p": 150, "a": "Crows Nest", "d": "Lunch Set、午餐小Omakase", "i": "开到Crows Nest的日料Omakase，午市有Lunch Set和小份Omakase。Lunch Set份量一般，不太容易吃饱，想好好吃建议选Omakase。主厨颜值很高，在悉尼Omakase圈小有名气。", "ne": "Hachioji", "lon": 151.20299, "lat": -33.82293}, {"n": "88 Live Seafood House", "t": "韩式鱼生", "r": "3", "p": 55, "a": "Eastwood", "d": "三文鱼和虾刺身、炙烤三文鱼寿司、Pipis面汤", "i": "原大长今位置新开的韩式鱼生店。三文鱼和虾刺身非常新鲜，炙烤三文鱼寿司也不错。Pipi面汤海味浓郁，但清淡没负担。人均约55刀，值得一试。", "ne": "88 Live Seafood House", "lon": 151.08257, "lat": -33.78689}, {"n": "Lode Pies & Pastries", "t": "烘焙", "r": "3", "p": 12, "a": "Rozelle（悉尼已有五家）", "d": "牛角包", "i": "起家于Surry Hills的烘焙店，现在悉尼已有五家分店。陈列整齐有序，看着很舒服。牛角包水准稳定，非常好吃；面包以外的早餐一般。", "ne": "Lode Pies & Pastries", "lon": 151.171, "lat": -33.862}, {"n": "Osteria Luna", "t": "意大利菜", "r": "4", "p": 100, "a": "King St, CBD", "d": "Crudo、火腿配炸泡芙、蟹肉红酱意面", "i": "King St地下室里今年新开的意大利餐厅，是法国餐厅The Charles的姐妹店，口碑出色。食物讲究，Crudo新鲜，火腿配炸泡芙很妙，蟹肉红酱意面非常入味，酱汁会让人想把盘子舔干净。地下室有老派电影的氛围，很出片，适合约会和聚会。人均约100刀。", "ne": "Osteria Luna", "lon": 151.20364, "lat": -33.86503}, {"n": "Penny Fours", "t": "烘焙", "r": "3", "p": 12, "a": "Balmain", "d": "火腿牛角包（9.5刀）", "i": "不走网红路线但评价很高的烘焙店，多位资深吃家推荐。选择不多，风格偏西式，不刻意做亚洲Fusion口味。基础款火腿牛角包很优秀，9.5刀一个，在牛角包里不算贵。", "ne": "Penny Fours", "lon": 151.18, "lat": -33.85799}, {"n": "Miryang Gukbap", "t": "韩国汤饭", "r": "3", "p": 40, "a": "Eastwood", "d": "猪肉汤饭加面条、生拌和牛", "i": "Eastwood韩国街的汤饭店，早上八点开门，上午十一点就可能要等半小时。猪肉汤饭加小虾米和辣酱很好吃，暖身，可以另加面条。生拌和牛份量很大，加一颗生鸡蛋拌起来更好。血肠可以不点。人均约40刀。", "ne": "Miryang Gukbap", "lon": 151.0763, "lat": -33.79326}, {"n": "三顾冒菜", "t": "冒菜", "r": "3", "p": 30, "a": "Burwood", "d": "香辣干拌、牛油冒菜（很辣）、番茄汤底、鞭炮笋", "i": "Burwood新开的冒菜馆，食材新鲜，选择很多。香辣干拌、牛油冒菜和番茄汤底都可选，牛油冒菜非常辣，不太能吃辣的人慎选。鞭炮笋一定要加。米饭和冰粉任吃，米饭香软，盖上冒菜很好吃。人均30刀以内。", "ne": "Sangu Maocai", "lon": 151.09967, "lat": -33.87551}, {"n": "Eleven Barrack", "t": "西餐", "r": "3", "p": 110, "a": "Barrack St, CBD", "d": "吞拿鱼刺身、炸小面团、虾挞、牛排、海鲜意面", "i": "Bentley集团旗下的西餐厅，天花板很高，三角钢琴和整面酒墙，富丽堂皇。前菜吞拿鱼刺身、炸小面团和虾挞都不错，主菜牛排和海鲜意面很出色。适合约会和姐妹聚餐，人均约110刀。", "ne": "Eleven Barrack", "lon": 151.20622, "lat": -33.87399}, {"n": "Frankie's Food Factory", "t": "花园Cafe", "r": "3", "p": 40, "a": "Glenhaven", "d": "Salmon Taco、炸鱿鱼圈、Pork Ribs", "i": "开在苗圃人工湖边的花园Cafe，进店要先经过花店，湖边可以喂鸭子。食物水准不低，Salmon Taco、炸鱿鱼圈和Pork Ribs都好吃，份量大。适合一家老小周末来，长辈可以逛苗圃。人均约40刀。", "ne": "Frankie's Food Factory", "lon": 151.0, "lat": -33.70499}, {"n": "Flaminia", "t": "意大利菜", "r": "4", "p": 110, "a": "Circular Quay", "d": "Kingfish、带子刺身、撒丁岛炸海鲜、热那亚海鲜大管面、西西里烤大虾", "i": "新开的意大利餐厅，菜单按意大利城市分区，每个城市都有自己的特色前菜、Pasta、主菜和甜品，吃一餐像游历意大利。吧台有新鲜刺身，Kingfish和带子都好。撒丁岛卡利亚里的炸海鲜、北意热那亚的海鲜大管面和西西里巴勒莫的烤大虾都很有趣。傍晚还能看到晚霞。人均约110刀。", "ne": "Flaminia", "lon": 151.21264, "lat": -33.85922}, {"n": "Jōji", "t": "天台酒吧餐厅", "r": "4", "p": 70, "a": "George St, CBD", "d": "Beef Tartare、Bug & Prawn Sando、Wagyu Skewer、Spatchcock、Taco Icecream Mochi", "i": "景色很好的天台酒吧餐厅，露台位能看到城市从午后到入夜的变化。食物出乎意料地好吃，Beef Tartare、Bug & Prawn Sando、Wagyu Skewer、Spatchcock和Taco冰淇淋麻薯都值得点。很适合边喝酒边吹风聊天，也适合庆生。", "ne": "Jōji", "lon": 151.21177, "lat": -33.86566}, {"n": "百留记", "t": "麻辣拌/香锅/炸串", "r": "3", "p": 30, "a": "Chatswood（Chase对面）", "d": "麻辣拌（多麻酱加方便面）、麻辣香锅、炸串", "i": "麻辣拌、麻辣香锅和炸串都做得不错的小店。食材区干净整洁，选择多。麻辣拌麻酱给得多，方便面黏糊过瘾；麻辣香锅炒得很香，很下饭；炸串撒料也好。人均约30刀，很实惠，拌粉也值得一试。", "ne": "Bailiuji", "lon": 151.17666, "lat": -33.7955}, {"n": "Coffee DRS", "t": "咖啡", "r": "2", "p": 5, "a": "Hornsby", "d": "Cold Brew", "i": "Hornsby Westfield旁的咖啡店，有自家烘焙的咖啡豆品牌，店里摆着很多可爱的小清新杂货。Cold Brew非常苦，小杯份量很大，只要5刀，很实惠。", "ne": "Coffee DRS", "lon": 151.09899, "lat": -33.703}, {"n": "Jenny's Dumpling", "t": "饺子馄饨早餐", "r": "3", "p": 20, "a": "Westfield Hornsby（美食广场）", "d": "鲜肉小馄饨、爆汁锅贴、卤肘子、凉拌土豆丝", "i": "Hornsby Westfield美食广场的早餐店，饺子、锅贴和馄饨都是现包的。鲜肉小馄饨热乎舒服，锅贴一咬就爆汁。凉菜卤肘子和凉拌土豆丝都出色，肘子皮滑肉嫩、胶质满满。人均约20刀。", "ne": "Jenny's Dumpling", "lon": 151.09785, "lat": -33.70212}, {"n": "Meisterstück", "t": "咖啡", "r": "2", "p": 10, "a": "Clarence St, CBD（Machine Hall入口）", "d": "特调咖啡", "i": "市中心新活动场地Machine Hall入口处的咖啡店，空间空旷简约。特调咖啡本身好喝，但奶盖很浓。店里角落藏着很多小狗玩偶，可以找一找。", "ne": "Meisterstück", "lon": 151.20056, "lat": -33.86878}, {"n": "Salumerie", "t": "意式三明治", "r": "3", "p": 18, "a": "King St, CBD", "d": "Lick Your Focaccia", "i": "Potts Point的意式三明治店，柜台现切佛卡夏、现片火腿、现涂酱料，常有人排队。可以试试名字有趣的Lick Your Focaccia。", "ne": "Salumerie", "lon": 151.21169, "lat": -33.87289}, {"n": "King Clarence", "t": "亚洲融合", "r": "3", "p": 60, "a": "Clarence St, CBD", "d": "炸鱼包、Dry Aged Duck、煲仔饭", "i": "King St和Clarence St交界处的亚洲融合餐厅，属于Bentley集团。口味浓油赤酱，喜欢重口的人会喜欢，有人可能会觉得偏咸偏油。炸鱼包很嫩，Dry Aged Duck很香，煲仔饭有锅巴。人均约60刀。", "ne": "King Clarence", "lon": 151.20668, "lat": -33.86336}, {"n": "Ray's Place", "t": "老牌Cafe", "r": "3", "p": 22, "a": "North Willoughby", "d": "自选组合Big Breakfast", "i": "开了近60年的老牌Cafe，深受附近居民喜爱。其他菜式普通，最值得点的是自选Big Breakfast，面包、酱料、肉类、蔬菜和配菜都可以自由搭配，例如土耳其面包一半配花生酱、一半配烟熏三文鱼。", "ne": "Ray's Place", "lon": 151.19801, "lat": -33.79901}, {"n": "巴适江湖菜", "t": "自贡菜", "r": "3", "p": 40, "a": "Burwood（亦有Zetland店）", "d": "火爆爽脆、呛锅鳝丝、渣渣牛肉、干煸肥肠", "i": "从Zetland开到Burwood的自贡菜，辣度极高。火爆爽脆、呛锅鳝丝、渣渣牛肉和干煸肥肠都很够味，渣渣牛肉辣得像直接嚼辣椒。爱吃辣的人一定要来挑战，不太能吃辣的人要有心理准备。", "ne": "Bashi Jianghu Cuisine", "lon": 151.10609, "lat": -33.88071}, {"n": "牛百岁 Mr Fu's Kitchen", "t": "红烧牛排骨/羊肉", "r": "4", "p": 40, "a": "Eastwood Plaza", "d": "红烧牛排骨、红烧带皮黑草羊（38.4刀大盆）、红烧牛排饭12.8刀", "i": "价格很良心的红烧菜馆。38.4刀的红烧牛排骨和红烧带皮黑草羊都是大大一盆；12.8刀的红烧牛排饭像十年前的物价，米饭泡在汤汁里非常好吃。外带用的是可以直接明火加热的容器，很贴心。", "ne": "Mr Fu's Kitchen", "lon": 151.08652, "lat": -33.792}, {"n": "Caraway", "t": "韩式Cafe", "r": "3", "p": 30, "a": "Burwood", "d": "炸鸡华夫饼、枫糖浆Cold Brew", "i": "Burwood排屋里新开的韩式Cafe，装修简单。炸鸡华夫饼的辣酱很辣，配甜华夫饼刚好，炸鸡蘸溏心蛋液更香。枫糖浆Cold Brew清甜。人均约30刀。", "ne": "Caraway", "lon": 151.10556, "lat": -33.87289}, {"n": "Charcoal & Crisp Lechon", "t": "菲律宾菜", "r": "2", "p": 25, "a": "Crows Nest", "d": "蒜蓉烤排骨、脆皮猪五花", "i": "Crows Nest少有人知的菲律宾烤肉店，以烤和炸为主。蒜蓉烤排骨比招牌脆皮猪五花好吃，猪五花肥肉偏多，不如广式烧肉。店里也卖Ube紫山药蛋糕，店员很诚实，放久了的不会卖。", "ne": "Charcoal & Crisp Lechon", "lon": 151.20208, "lat": -33.82905}, {"n": "Bay Brew Cafe", "t": "Cafe", "r": "4", "p": 22, "a": "Waverton", "d": "炸鸡Pancake", "i": "下北区的海湾景观Cafe，门口就能看到港湾，多是附近居民光顾。炸鸡Pancake很有创意，炸鸡嫩到爆汁，和Pancake意外地搭。其他菜式也都不错，饭后可以沿港湾散步。", "ne": "Bay Brew Cafe", "lon": 151.19801, "lat": -33.83801}, {"n": "Chez Beckett's", "t": "法餐", "r": "4", "p": 100, "a": "Chippendale", "d": "草莓鹅肝、Kingfish刺身、烤大虾、鸭腿、牛排（39刀）、桌前火焰可丽饼", "i": "很有氛围的法餐厅。前菜草莓鹅肝、Kingfish刺身和Beef Tartare都好，草莓的酸甜正好化解鹅肝的腻。主菜烤大虾、鸭腿和牛排都很出色，牛排只要39刀，非常划算。甜品是桌边现场制作的火焰可丽饼，很有仪式感。适合约会和姐妹聚会，人均约100刀。", "ne": "Chez Beckett's", "lon": 151.19919, "lat": -33.88785}, {"n": "Berto's Espresso", "t": "早餐Cafe", "r": "3", "p": 22, "a": "Surry Hills", "d": "English Muffin（酸黄瓜滑蛋意大利香肠）、Cold Brew", "i": "评分4.8的街角早餐店，店里店外坐满了人。几乎每桌都点的English Muffin夹酸黄瓜、滑蛋和意大利香肠，很满足。Cold Brew也不错。", "ne": "Berto's Espresso", "lon": 151.20911, "lat": -33.88905}, {"n": "Pan Divino", "t": "意大利菜", "r": "3", "p": 60, "a": "Surry Hills", "d": "Beef Tartare、Snapper刺身、海鲜意面、柠檬里的阿尔玛菲Sorbet、提拉米苏", "i": "街角的意大利小馆，满墙画作，服务生热情，很有情调。前菜Beef Tartare和Snapper刺身、主菜海鲜意面和牛排都不错。甜品最惊喜，阿马尔菲柠檬Sorbet装在整颗柠檬里，提拉米苏绵软。人均约60刀。", "ne": "Pan Divino", "lon": 151.21515, "lat": -33.88475}, {"n": "New Star Kebab Family Restaurant", "t": "土耳其菜", "r": "4", "p": 30, "a": "Auburn", "d": "羊肉糜烤串、鸡肉烤串、Kiymali Pide", "i": "Auburn的土耳其快餐店，值得专程去。羊肉糜烤串和鸡肉烤串用大饼卷着辣椒、蘸蒜酱吃，非常满足。Kiymali Pide类似羊肉薄饼，焦香可口，也必点。", "ne": "New Star Kebab Family Restaurant", "lon": 151.03302, "lat": -33.849}, {"n": "金兰大碗牛肉面 Golden Lan Beef Noodles", "t": "牛肉面", "r": "3", "p": 18, "a": "Auburn", "d": "酸菜牛肉面、炸酱面", "i": "手工牛肉面馆，面条粗细不太均匀，很有原生态感，份量大，一碗够分两顿。酸菜牛肉面和炸酱面都不错，吃完不口渴。", "ne": "Golden Lan Beef Noodles", "lon": 151.03184, "lat": -33.84811}, {"n": "Delisia Panino & Espresso", "t": "意式Panini", "r": "5", "p": 18, "a": "Forest Lodge", "d": "Melon Panini（蜜瓜火腿）、Crema", "i": "马路边的意式Panini店，非常好吃。招牌Melon用蜜瓜搭配火腿，蜜瓜的甜、火腿的咸香和面包的韧劲结合得清爽又夏天。份量大，半份就饱。店里的Crema像半融化的巧克力咖啡雪糕，大热天很适合。", "ne": "Delisia Panino & Espresso", "lon": 151.18, "lat": -33.87999}, {"n": "Altitude", "t": "景观Fine Dining", "r": "3", "p": 160, "a": "Shangri La Sydney（36楼）", "d": "三道菜Set Menu", "i": "香格里拉酒店36楼的景观Fine Dining，景色无敌。天花板有一面镜子倒映窗外景色，背对窗户也能看到风景，很有巧思。三道菜Set Menu都好吃但不惊艳。人均约160刀，景色值这个价。适合约会和姐妹聚会。", "ne": "Altitude", "lon": 151.20964, "lat": -33.8572}, {"n": "Blu Bar on 36", "t": "景观酒吧", "r": "2", "p": 60, "a": "Shangri La Sydney", "d": "鸡尾酒", "i": "香格里拉酒店36楼的景观酒吧，很多人专门来看夜景。但酒吧灯光倒映在落地窗上，窗外景色几乎看不清，体验不如预期。", "ne": "Blu Bar on 36", "lon": 151.20493, "lat": -33.85944}, {"n": "The Winery", "t": "花园Pub", "r": "2", "p": 45, "a": "Surry Hills", "d": "蟹肉波浪面", "i": "Surry Hills的花园Pub，郁郁葱葱，夏日午后阳光柔和，很有意境。食物是一般的Pub Food，蟹肉波浪面好吃。两道菜午餐45刀，很划算。", "ne": "The Winery", "lon": 151.20668, "lat": -33.8845}, {"n": "San Java 2.0", "t": "抹茶店", "r": "3", "p": 10, "a": "Surry Hills", "d": "冰抹茶（菜单外）、提拉米苏", "i": "新晋的抹茶店，菜单外的冰抹茶是纯抹茶，甘苦浓烈，青草味很足。Mocha Latte偏奶。提拉米苏也值得一试。", "ne": "San Java 2.0", "lon": 151.2131, "lat": -33.88974}, {"n": "Paramount Coffee Project", "t": "Cafe/Brunch", "r": "2", "p": 32, "a": "Surry Hills", "d": "炸鸡华夫饼、牛油果吐司", "i": "仓库改造的人气Cafe，工作日和周末都满座，空间里有咖啡店、各种小店和露台，绿植很多。炸鸡华夫饼和牛油果吐司好吃，咸味Pancake很奇怪。整体不错但没有传说中那么神。", "ne": "Paramount Coffee Project", "lon": 151.21257, "lat": -33.88188}, {"n": "Double Cross Dining Room", "t": "Cafe/餐厅", "r": "3", "p": 45, "a": "Crows Nest", "d": "炸鸡、红薯条、Kingfish、烤玉米、明太子意面、虾三明治", "i": "早午餐和午市都受欢迎的Cafe餐厅。Share小菜最出色，炸鸡、红薯条、Kingfish刺身和烤玉米都很好吃；主菜明太子意面、牛排和招牌虾三明治也不错。人均约45刀。", "ne": "Double Cross Dining Room", "lon": 151.20816, "lat": -33.82473}, {"n": "名成海鲜酒楼", "t": "粤菜酒楼", "r": "3", "p": 55, "a": "Eastwood", "d": "鱼香茄子陈村粉、咸蛋黄鸭舌、鲍鱼捞竹升面、雪山叉烧包", "i": "Eastwood的粤菜酒楼，网上差评不少，但实际挺好吃，还有几道特别的菜。鱼香茄子陈村粉很搭；咸蛋黄鸭舌非常好吃；鲍鱼捞竹升面的面最出彩。反沙芋头糖衣太厚。茶点雪山叉烧包也不错。", "ne": "Ming Sing Seafood Restaurant", "lon": 151.07763, "lat": -33.78701}, {"n": "Johnny Gio's Pizza", "t": "Pizza", "r": "3", "p": 27, "a": "Chatswood", "d": "意大利香肠Pizza", "i": "去年新开的薄底Pizza店，火炉现烤，特别香脆，还能看到厨师进出炉的过程。意大利香肠Pizza只有肉碎没有别的配料，味道纯粹。一个27刀，偏贵但确实好吃。", "ne": "Johnny Gio's Pizza", "lon": 151.18308, "lat": -33.80071}, {"n": "Auvers Dining", "t": "Brunch", "r": "3", "p": 32, "a": "Darling Square", "d": "和牛盖饭", "i": "老牌网红Brunch店，不知道吃什么时的稳妥选择。虾三明治一般，馅料松散，不好拿着吃。和牛盖饭很出色，和牛很嫩，拌上蛋黄和米饭非常搭。Cold Brew过得去。", "ne": "Auvers Dining", "lon": 151.20086, "lat": -33.87614}, {"n": "安娜手工水饺", "t": "手工水饺", "r": "3", "p": 23, "a": "Carlingford", "d": "馄饨、馅饼、生煎包、锅贴、速冻酸菜猪肉饺", "i": "住宅区里朴实的手工饺子小店，全手工制作，很多人一次买上百刀的速冻饺子。馄饨、馅饼、生煎包和锅贴都好吃，酸菜猪肉速冻饺子值得带回家。价格很便宜，人均约23刀。", "ne": "Anna's Handmade Dumplings", "lon": 151.04491, "lat": -33.78247}, {"n": "Amah by Ho Jiak", "t": "马来西亚融合", "r": "3", "p": 55, "a": "Chatswood Interchange", "d": "肉骨茶小笼包、新加坡辣椒蟹虾饺、烧鸭肠粉", "i": "Ho Jiak旗下的马来西亚融合菜，菜单很有创意，有肉骨茶小笼包、新加坡辣椒蟹虾饺、肉松小贝炸鸡和人气烧鸭肠粉。烧鸭肠粉的烧鸭约五成熟，肉还是粉色的，非常嫩。不必专程，但是很好的工作日午餐选择。", "ne": "Amah by Ho Jiak", "lon": 151.18255, "lat": -33.79288}, {"n": "The Annex Coffee House", "t": "咖啡", "r": "3", "p": 6, "a": "Chatswood", "d": "Cold Brew", "i": "上班路上的温暖小咖啡店，门口和旁边铺面有几个座位，厨房全开放。Cold Brew酸度足，很提神，小杯6刀。", "ne": "The Annex Coffee House", "lon": 151.17632, "lat": -33.79926}, {"n": "Italian Street Kitchen", "t": "意大利菜", "r": "3", "p": 45, "a": "Bella Vista", "d": "炸墨鱼圈、海鲜烩饭、窑烤Pizza、提拉米苏", "i": "Bella Vista人工湖边的意大利餐厅。炸墨鱼圈稳妥；海鲜烩饭略咸但很入味；窑烤Pizza拉丝十足；提拉米苏软绵。湖边还有不少餐厅可选。", "ne": "Italian Street Kitchen", "lon": 150.955, "lat": -33.73699}, {"n": "Lune Croissanterie", "t": "可颂", "r": "3", "p": 10, "a": "Martin Place Metro", "d": "每日口味可颂", "i": "墨尔本名店Lune在悉尼的分店，除了Rosebery，CBD也有一家。可颂每天有不同口味，每个约10刀，排队有理由，扁平车轮造型的可颂很好吃。", "ne": "Lune Croissanterie", "lon": 151.20884, "lat": -33.86613}, {"n": "Sneaker Laundry", "t": "咖啡/洗鞋店", "r": "3", "p": 12, "a": "Martin Place Metro", "d": "Mont Blanc Cold Brew", "i": "地铁站里的洗鞋店，同时卖饭团、牛角包和咖啡，组合很神奇。Cold Brew特调Mont Blanc清甜浓郁，很好喝。", "ne": "Sneaker Laundry", "lon": 151.21021, "lat": -33.86885}, {"n": "Dear Florence", "t": "法式甜品", "r": "3", "p": 14, "a": "Prefecture 48, Sussex St, CBD", "d": "巧克力蛋糕、新年限定蜜柑蛋糕", "i": "法式甜品店，蛋糕精致漂亮，有巧克力口味和农历新年限定蜜柑口味等。价格高，小小一块二十多刀，大约四口吃完，但确实好吃。", "ne": "Dear Florence", "lon": 151.2009, "lat": -33.87945}, {"n": "ibushi", "t": "日料（两帽）", "r": "2", "p": 130, "a": "Prefecture 48, Sussex St, CBD", "d": "烤虾滑、Tuna Tartare、Beef Tartare", "i": "Prefecture 48集团旗下刚拿到两帽的日本餐厅。每道菜都不错但不惊艳，烤虾滑、Tuna Tartare和Beef Tartare较出色。现场炭烤的猪五花很香，入口却一般。人均约130刀，对两帽来说不算贵。", "ne": "ibushi", "lon": 151.20694, "lat": -33.88056}, {"n": "Doughkyo", "t": "烘焙", "r": "3", "p": 12, "a": "World Square", "d": "吐司", "i": "从Parramatta开到市中心的烘焙店。面包偏有韧性，吐司最好，接近日式生吐司的口感，涂牛油果加一颗煎蛋就很好吃。", "ne": "Doughkyo", "lon": 151.20299, "lat": -33.87592}, {"n": "Golden Brown Pancake & Bakery Cafe", "t": "Cafe/烘焙", "r": "2", "p": 22, "a": "Pitt St, CBD", "d": "日式大虾意面、Pancake", "i": "市中心木质调小店，面包蛋糕陈列很漂亮。日式大虾意面很香；Pancake蓬松但偏油，奶味重。店里不卖咖啡。", "ne": "Golden Brown Pancake & Bakery Cafe", "lon": 151.21413, "lat": -33.86822}, {"n": "SweetDay Dessert", "t": "蛋糕店", "r": "4", "p": 14, "a": "Silverwater", "d": "花束蛋糕、梦龙卷、瑞士卷、马卡龙", "i": "藏在工业区里的蛋糕店，用动物奶油，裱花细致。可以定制花束蛋糕并送货上门。平时卖瑞士卷和马卡龙，梦龙卷脆皮香、蛋糕松软、巧克力酱绵密，非常好吃。不是网红店，没有花哨装饰，胜在扎实的好味道。", "ne": "SweetDay Dessert", "lon": 151.047, "lat": -33.83401}, {"n": "Mogu Mogu Onigiri Community", "t": "饭团", "r": "4", "p": 12, "a": "Surry Hills", "d": "现制饭团", "i": "以喷枪炙烤出名的饭团店，现做现捏，制作过程很治愈，小朋友特别喜欢。老板夫妇很亲切，熟客很多。", "ne": "Mogu Mogu Onigiri Community", "lon": 151.2063, "lat": -33.88826}, {"n": "Slim's Quality Burger", "t": "汉堡", "r": "3", "p": 20, "a": "Westfield Sydney", "d": "安格斯牛肉汉堡、手切薯条、3刀冰淇淋", "i": "Westfield Sydney里的美式汉堡店，靠窗座位可以看街景。用100%澳洲安格斯牛肉，薯条新鲜手切，冰淇淋每天店内现做，一大球只要3刀，很良心。汉堡用锡纸包着保温，很用心。", "ne": "Slim's Quality Burger", "lon": 151.20786, "lat": -33.86913}, {"n": "Daily Spoon", "t": "韩国小菜外带", "r": "3", "p": 20, "a": "Eastwood", "d": "酱蟹、鹌鹑蛋、辣鱿鱼刺身、泡菜老豆腐", "i": "新开的韩国小菜专门店，店面宽敞明亮，小菜摆得整整齐齐。酱蟹新鲜不辣；鹌鹑蛋、辣鱿鱼刺身和泡菜老豆腐都很下饭，也很适合配酒。四样约50刀，适合在家聚餐时买。", "ne": "Daily Spoon", "lon": 151.08021, "lat": -33.79601}, {"n": "Luigi Panini", "t": "意式Panini", "r": "3", "p": 18, "a": "Surry Hills", "d": "佛罗伦萨Panini（牛肉干配胡桃果酱）", "i": "近期很红的意式Panini店，各款以意大利城市命名，制作过程现削肉片、层层铺上面包再挤酱，很好看。佛罗伦萨款夹牛肉干和胡桃果酱，调味很香，面包略硬。份量大，一个人吃不完。", "ne": "Luigi Panini", "lon": 151.20763, "lat": -33.88204}, {"n": "Bondi Boulangerie", "t": "可颂", "r": "3", "p": 9, "a": "Surry Hills", "d": "Mardi Gras彩虹可颂", "i": "源自法国西南部、有50年家族历史的可颂店，会推出主题限定款，例如Mardi Gras彩虹可颂，里面夹巧克力酱。一个9刀。", "ne": "Bondi Boulangerie", "lon": 151.21021, "lat": -33.891}, {"n": "Bills", "t": "Brunch", "r": "3", "p": 35, "a": "Surry Hills", "d": "Hotcake、滑蛋吐司", "i": "十几年的老牌顶流Brunch，至今仍要排长队。Hotcake是招牌，绵密松软，淋上枫糖浆非常经典；滑蛋吐司偏奶。", "ne": "Bills", "lon": 151.2158, "lat": -33.88264}, {"n": "小兔砂锅麻辣烫", "t": "东北黏糊麻辣烫", "r": "3", "p": 20, "a": "Chatswood", "d": "砂锅麻辣烫（麻酱配米线）、炸串", "i": "Chatswood的东北黏糊麻辣烫。砂锅麻辣烫都是素菜，可以加钱加肉，一锅很大，两人分刚好；麻酱配米线最搭。炸串蓬松好吃。人均不到20刀，适合当工作日食堂。", "ne": "Little Rabbit Claypot Malatang", "lon": 151.1865, "lat": -33.798}, {"n": "OTTO Ristorante", "t": "意大利菜", "r": "3", "p": 100, "a": "Woolloomooloo", "d": "龙虾刺身小冰淇淋、Beef Tartare、牛排、泥蟹意面", "i": "Woolloomooloo码头边的老牌意大利餐厅，阳光好时坐在码头边看游艇很惬意。赶时间可以提前告诉服务员，上菜会很快。龙虾刺身小冰淇淋、Beef Tartare、牛排和泥蟹意面都好吃。人均约100刀。", "ne": "OTTO Ristorante", "lon": 151.22085, "lat": -33.86812}, {"n": "Fired Up Roast Chicken", "t": "烤鸡", "r": "2", "p": 22, "a": "Pennant Hills", "d": "水煎包", "i": "Pennant Hills的烤鸡店，换了老板后烤鸡偏干，炸鸡粉偏厚，但水煎包好吃。外带用保温冰袋，很用心。适合匆忙时解决一顿。", "ne": "Fired Up Roast Chicken", "lon": 151.07201, "lat": -33.738}, {"n": "Luna Lu", "t": "中西融合", "r": "5", "p": 120, "a": "The Rocks", "d": "牡丹玫瑰饺、M4牛排、鸭肉、宫保菜花", "i": "The Rocks景观最好的中西融合餐厅之一，露天座位可以看到海港大桥和歌剧院全景。菜品把西式摆盘和中式味道结合得精致又顺口。新年限定牡丹玫瑰饺很喜庆；M4牛排火候极好；鸭肉份量足，皮脆肉嫩；宫保菜花保留川菜灵魂，香辣脆嫩又不油。人均约120刀能吃得非常饱，以景色、氛围和水准来说合理。", "ne": "Luna Lu", "lon": 151.21097, "lat": -33.86055}, {"n": "JOMARU Korean Hot Pot", "t": "韩式猪骨锅", "r": "3", "p": 35, "a": "Eastwood（亦有Strathfield店）", "d": "辣泡菜猪骨锅三重奏：猪骨、拉面、炒饭", "i": "起家于Strathfield的韩式猪骨锅，现在Eastwood也有。辣泡菜猪骨锅三步吃：先啃猪骨，肉嫩到脱骨；再下拉面吸饱汤汁；最后用剩汤炒紫菜饭。份量很大，吃不完可以打包回家煮辛拉面。", "ne": "JOMARU Korean Hot Pot", "lon": 151.0858, "lat": -33.78765}, {"n": "Yeodongsik", "t": "韩国菜（一帽）", "r": "2", "p": 30, "a": "Eastwood（Lidcombe也有店）", "d": "紫苏油荞麦面、虾韭菜煎饼", "i": "从Lidcombe开到Eastwood的一帽韩国餐厅，晚市开门前就会排队，建议提前到。招牌紫苏油荞麦面青草味很重，见仁见智。虾韭菜煎饼薄而脆，很好吃。菜单很简单，选择不多。", "ne": "Yeodongsik", "lon": 151.07455, "lat": -33.79077}, {"n": "Loin King Cafe", "t": "韩式三明治", "r": "3", "p": 20, "a": "Homebush West", "d": "炸虾碎蛋厚吐司Sando、拉丝芝士条", "i": "韩式三明治店，炸虾、碎鸡蛋和厚吐司的Sando搭配得刚好。拉丝芝士条可以拉很长，小朋友很爱。人均约20刀，很划算。", "ne": "Loin King Cafe", "lon": 151.06802, "lat": -33.86601}, {"n": "Kenangan Coffee", "t": "咖啡", "r": "2", "p": 10, "a": "Druitt St, CBD", "d": "Cranberry Cold Brew、海盐芝士小面包", "i": "印尼连锁咖啡品牌，Cranberry Cold Brew中规中矩。海盐芝士小面包可以当早餐。", "ne": "Kenangan Coffee", "lon": 151.20098, "lat": -33.86553}, {"n": "CHAR CHAR BANH MI", "t": "越南包", "r": "3", "p": 16, "a": "The Galeries（美食广场）", "d": "脆皮猪五花越南包", "i": "Galeries楼下美食广场的越南包店。脆皮猪五花口味很好吃，鹅肝酱给得足，可惜只涂下层面包，上层略干。一个16刀不便宜，在市中心可以接受。", "ne": "CHAR CHAR BANH MI", "lon": 151.20584, "lat": -33.87112}, {"n": "Gyukatsu Kyoto Katsugyu", "t": "日式炸牛排", "r": "3", "p": 58, "a": "Pitt St, CBD", "d": "55刀澳洲牛排炸牛排饭、温泉蛋蘸料", "i": "日本连锁的京都炸牛排饭，开业初期要排大队，现在基本不用。A5牛排偏腻，55刀的澳洲牛排已经够嫩够好吃。撒料和酱汁选择多，每口都能换不同味道，蘸温泉蛋最好吃。每人配一个小炉子，可以把牛排再煎熟一些。人均约58刀。", "ne": "Gyukatsu Kyoto Katsugyu", "lon": 151.20865, "lat": -33.8751}, {"n": "Nomad", "t": "木火现代澳菜", "r": "4", "p": 100, "a": "Surry Hills", "d": "带子、鱼糜、Flatbread、牛排、烤鸡、烤鱼", "i": "以木火烹饪出名的现代澳菜，水准一贯稳定，菜单变化不大。前菜带子和鱼糜、主菜牛排、烤鸡和烤鱼都很嫩很好吃。甜品有创意但偏甜。不喝酒人均约100刀。", "ne": "Nomad", "lon": 151.20455, "lat": -33.8858}, {"n": "Don Don", "t": "韩国猪手", "r": "3", "p": 40, "a": "Strathfield", "d": "韩国猪手、炸鸡、海苔饭团、海鲜饼、冷面、芝士年糕", "i": "老牌韩国餐厅，以韩国猪手出名。炸鸡、海苔饭团、海鲜饼、冷面和芝士年糕也都好吃，可以配榛果米酒，适合朋友聚餐。", "ne": "Don Don", "lon": 151.09283, "lat": -33.87213}, {"n": "Attenzione", "t": "意大利菜", "r": "3", "p": 100, "a": "Redfern", "d": "薯片夹熏鳟鱼糜、鲍鱼三明治、牛排、鸭胸", "i": "Redfern小有名气的意大利餐厅，氛围很好，整体好吃但偏咸。前菜薯片夹熏鳟鱼糜和鲍鱼三明治很有创意；意面很Creamy；主菜牛排和鸭胸肉质好但咸。人均约100刀。", "ne": "Attenzione", "lon": 151.20284, "lat": -33.89113}, {"n": "Huxtaburger", "t": "汉堡", "r": "2", "p": 20, "a": "Redfern", "d": "Sandra炸鸡汉堡", "i": "墨尔本起家的美式汉堡店，汉堡都用人名命名，例如Sandra、Kevin、Rachel和Ruby，很有趣。炸鸡汉堡Sandra很美式，但味道平平无奇。", "ne": "Huxtaburger", "lon": 151.20421, "lat": -33.89384}, {"n": "Crystal Jade 翡翠宫", "t": "粤菜酒楼", "r": "3", "p": 55, "a": "Ryde Eastwood Leagues Club", "d": "大颗Pipis、干炒牛河、咸蛋黄虾球、鱼香茄子煲", "i": "Eastwood附近Club里的粤菜小酒楼，比预期好吃。Pipi个头特别大；干炒牛河火候刚好，非常好吃；咸蛋黄虾球和鱼香茄子煲也不错。会员可享折扣。", "ne": "Crystal Jade", "lon": 151.08899, "lat": -33.80292}, {"n": "Doodee King", "t": "泰国菜", "r": "3", "p": 40, "a": "Westfield Chatswood（天桥下）", "d": "脆皮猪五花炒粿条、小油条蘸斑斓酱、泰奶、炸猪皮", "i": "Westfield天桥下小木屋里的泰国菜。脆皮猪五花炒粿条里猪五花比粿条还多；烤虾泡饭是酸甜辣口，可能吃不惯；小油条蘸斑斓酱必点；泰奶配炸猪皮很过瘾。人均约40刀。", "ne": "Doodee King", "lon": 151.17765, "lat": -33.79301}, {"n": "早点见面", "t": "上海生煎/点心", "r": "4", "p": 25, "a": "Gordon Village", "d": "生煎包（原味、墨汁虾仁）、鲜肉馄饨加荷包蛋、小笼包", "i": "Gordon的上海生煎点心店。生煎有原味、墨汁虾仁和泡菜三种口味，可点单拼、双拼或三拼，咬开大爆汁，汤汁满满。鲜肉馄饨加荷包蛋和小笼包也好吃。人均约25刀。", "ne": "Zao Dian Jian Mian", "lon": 151.15367, "lat": -33.75422}, {"n": "濠 Gou Sushi", "t": "午市Omakase", "r": "3", "p": 60, "a": "Glebe", "d": "20贯寿司加三文鱼味噌汤", "i": "午市Omakase每人60刀，包括20贯寿司和一碗三文鱼味噌汤，平均每贯不到3刀，和旋转寿司差不多价。午市人少，节奏舒服。食材普通，份量不算很饱，但以价格来说无可挑剔。", "ne": "Gou Sushi", "lon": 151.18897, "lat": -33.88056}, {"n": "Poetica Bar & Grill", "t": "西餐", "r": "4", "p": 70, "a": "North Sydney（Metro站对面）", "d": "Yumba Prawn、Beef Tartare、牛排、当日鱼、薯条", "i": "North Sydney Metro站出口对面的西餐厅，环境好，交通方便。Yamba Prawn鲜甜，酱汁有层次；生牛肉塔塔细腻，荧光绿调味汁很惊喜；牛排火候刚好；当日鱼Snapper皮脆肉嫩。薯条香脆到停不下来，值得点。适合聚餐和约会。", "ne": "Poetica Bar & Grill", "lon": 151.20698, "lat": -33.84}, {"n": "Barrel One Coffee Roasters", "t": "贝果/咖啡", "r": "3", "p": 14, "a": "Lane Cove", "d": "芝士鸡蛋贝果", "i": "Lane Cove的贝果咖啡店，红色调很美式。芝士鸡蛋贝果现煎鸡蛋很香，隔天用空气炸锅烤五分钟依然外脆里嫩，芝士流心。", "ne": "Barrel One Coffee Roasters", "lon": 151.16583, "lat": -33.81412}, {"n": "Komo Katsu（白天为Lof Cafe）", "t": "日式炸猪排", "r": "3", "p": 28, "a": "Rhodes", "d": "干扁香脆型猪排", "i": "Rhodes河边的店铺，白天是Lof Cafe，傍晚五点后变成日式炸猪排店Komo Katsu。猪排是薄而香脆的类型，份量很大，吃几块就会腻，建议分享。傍晚河边夕阳很美。", "ne": "Komo Katsu (Lof Cafe by day)", "lon": 151.08508, "lat": -33.83306}, {"n": "Chubby Cubby Cafe", "t": "Cafe", "r": "2", "p": 22, "a": "Haymarket（UTS附近）", "d": "椰子水抹茶奶盖、提拉米苏", "i": "UTS附近的可爱咖啡店，常坐满写作业的大学生。有不少创意饮品，例如椰子水抹茶奶盖，新鲜感强但不算好喝。提拉米苏偏硬挺，一般。适合坐下来放空。", "ne": "Chubby Cubby Cafe", "lon": 151.20816, "lat": -33.87775}, {"n": "渔膳煌 Spice Palace", "t": "木桶鱼/中餐", "r": "3", "p": 45, "a": "Chatswood", "d": "木桶鱼汤、荔蓉香酥鸭", "i": "以木桶鱼为招牌的中餐馆。木桶内衬不锈钢，倒入滚烫鱼汤后再放生鱼片焖熟，汤鲜美，鱼肉嫩滑。荔蓉香酥鸭芋泥和鸭肉结合得好，外壳酥脆。其他菜式中规中矩。", "ne": "Spice Palace", "lon": 151.18023, "lat": -33.802}, {"n": "胡家客栈 Hu's Inn", "t": "台湾菜", "r": "4", "p": 40, "a": "Chatswood", "d": "卤肉饭、盐酥鸡", "i": "小众但好吃的台湾菜小店，店面很小，服务员说话温柔，带台湾腔。卤肉饭和盐酥鸡非常好吃；阿萨姆奶茶偏奶。值得反复去。", "ne": "Hu's Inn", "lon": 151.18578, "lat": -33.79364}, {"n": "Marrickville Pork Roll", "t": "越南包", "r": "2", "p": 13, "a": "Chatswood Interchange", "d": "越南包", "i": "起家于Marrickville的人气越南包，现在Chatswood也有分店。好吃但没有传说中那么神，在众多越南包里略显普通。一个13刀，价格正常。", "ne": "Marrickville Pork Roll", "lon": 151.17457, "lat": -33.79677}, {"n": "一香自助火锅", "t": "自助火锅", "r": "2", "p": 25, "a": "Chatswood（原大东北位置）", "d": "肉、鱼、丸子、蔬菜、熟食", "i": "Chatswood原大东北位置的自助火锅，每人二十多刀，非常便宜。肉、鱼、丸子、蔬菜和熟食一应俱全，能吃饱，但味道一般。", "ne": "Yixiang Hotpot Buffet", "lon": 151.1857, "lat": -33.8009}, {"n": "二孃", "t": "火锅", "r": "3", "p": 50, "a": "Top Ryde Shopping Centre（Rhodes也有）", "d": "鲜鸭血、卤味", "i": "Top Ryde商场里的火锅店，Rhodes也有分店。装修有点奇怪，但味道不错，鲜鸭血好吃，卤味也好。人不多，没有一般火锅店的嘈杂。人均约50刀。", "ne": "Er Niang Hotpot", "lon": 151.10484, "lat": -33.81311}, {"n": "Le Foote", "t": "法餐", "r": "4", "p": 100, "a": "The Rocks", "d": "烤大虾、牛排", "i": "The Rocks的法餐厅，满墙法式艺术画，很有氛围。烤大虾好吃，牛排地道，酒也好喝。适合姐妹聚会和约会，人均约100刀。", "ne": "Le Foote", "lon": 151.20702, "lat": -33.85594}, {"n": "Ocean King Fish Market", "t": "海鲜店（可代烹饪）", "r": "4", "p": 40, "a": "Burwood", "d": "咸蛋黄皇帝虾（八只33刀）", "i": "Burwood主街上的海鲜店，可以挑选生海鲜请店家现场烹饪。例如八只皇帝虾做成咸蛋黄口味，广东师傅现场颠勺，五分钟出锅，香气扑鼻，约33刀。适合想吃新鲜海鲜又不想自己下厨的时候。", "ne": "Ocean King Fish Market", "lon": 151.09929, "lat": -33.87926}, {"n": "Yurica Japanese Kitchen", "t": "日料", "r": "2", "p": 60, "a": "Macquarie Park", "d": "炸Snapper、寿司、和牛", "i": "街边的日料店，味道不错但价格偏高，人均约60刀份量不多。炸Snapper好吃，寿司新鲜，和牛够嫩，其他一般。", "ne": "Yurica Japanese Kitchen", "lon": 151.1181, "lat": -33.78004}, {"n": "Mister Gee", "t": "汉堡", "r": "2", "p": 16, "a": "North Strathfield", "d": "汉堡、鸡柳", "i": "汉堡店，牛肉饼够厚够嫩，一个16刀，不便宜。鸡柳很一般。", "ne": "Mister Gee", "lon": 151.088, "lat": -33.85701}, {"n": "乐乐炸串 Happy Skewers", "t": "炸串", "r": "2", "p": 15, "a": "Chinatown", "d": "脆皮鸡柳、苕皮、爆浆豆腐、淀粉肠", "i": "新开的炸串店，选择不多，有脆皮鸡柳、苕皮、爆浆豆腐、土豆片和淀粉肠。整体还行，但不如来一串和夸父炸串。价格很便宜，人均约15刀。", "ne": "Happy Skewers", "lon": 151.19965, "lat": -33.87753}, {"n": "Abb Air Thai", "t": "泰国菜", "r": "5", "p": 35, "a": "World Square", "d": "沙爹鸡肉串配吐司、虾饼、烤鸡腿", "i": "小小一家却坐满人的泰国菜，非常惊艳。沙爹鸡肉串配烤得焦香的吐司，可以做成开放三明治；虾饼蓬松，外皮酥脆、内里弹牙多汁；烤鸡腿嫩得不可思议。人均约35刀，强烈推荐。", "ne": "Abb Air Thai", "lon": 151.20611, "lat": -33.88273}, {"n": "Daniel's", "t": "甜甜圈", "r": "2", "p": 8, "a": "World Square", "d": "万圣节甜甜圈", "i": "普通的甜甜圈店，节日会推出主题款，例如万圣节甜甜圈，味道和一般甜甜圈没有区别。", "ne": "Daniel's", "lon": 151.20554, "lat": -33.87488}, {"n": "A3 Coffee", "t": "咖啡", "r": "3", "p": 10, "a": "World Square（W Cosmetic旁）", "d": "Peach Long Black", "i": "W Cosmetic旁边新开的Cafe，创意口味很多。Peach Long Black把桃子的清甜和黑咖啡的苦涩融合得刚好。Double Rose Latte也值得一试。", "ne": "A3 Coffee", "lon": 151.19931, "lat": -33.88125}, {"n": "海鲜大排档", "t": "港式海鲜大排档", "r": "3", "p": 40, "a": "West Ryde", "d": "蒸生蚝、XO Pipi、咸蛋黄虾仁、清汤牛腩煲、手撕走地鸡、干炒牛河", "i": "港式海鲜大排档，食客很多是香港人，网上分享可以拿到一瓶XO酱。蒸生蚝、XO酱炒Pipi、咸蛋黄虾仁、清汤牛腩煲、手撕走地鸡和干炒牛河都很好吃。可惜Pipi有沙，冻柠茶里没有柠檬片。份量大，人均约40刀，吃不完可以打包。", "ne": "Seafood Dai Pai Dong", "lon": 151.08808, "lat": -33.80904}, {"n": "S'Bread House", "t": "越南包", "r": "2", "p": 16.5, "a": "Lane Cove（Canopy外）", "d": "脆皮猪五花越南包", "i": "Canopy外一座独立小房子里的越南包店。脆皮猪五花越南包整体不错，但调味偏保守，少了越南包那种放肆的香气，算不上第一梯队。一个16.5刀，偏贵，附近可以一试，狂热爱好者不必专程。", "ne": "S'Bread House", "lon": 151.1672, "lat": -33.81684}, {"n": "The Hill Thai Restaurant", "t": "泰国菜", "r": "3", "p": 35, "a": "West Pennant Hills", "d": "沙爹虾串、芋头春卷、芒果糯米饭", "i": "被鲜花簇拥的泰国菜小店。沙爹虾串弹牙，芋头春卷的芋泥很好吃；蛋网泰式炒米粉造型新颖，但配的脆皮鸡太柴。芒果糯米饭好吃。人均约35刀。", "ne": "The Hill Thai Restaurant", "lon": 151.04001, "lat": -33.754}, {"n": "The Ugly Bakery", "t": "肉桂卷", "r": "3", "p": 7.3, "a": "West Ryde", "d": "糖霜肉桂卷", "i": "专做肉桂卷的烘焙店，据说连不爱肉桂的人都会喜欢。糖霜肉桂卷很好吃，一个7.3刀，不便宜。傍晚去选择较少。", "ne": "The Ugly Bakery", "lon": 151.09416, "lat": -33.80475}, {"n": "Bonjour Vietnam", "t": "越南菜", "r": "2", "p": 30, "a": "Lindfield（Pacific Hwy）", "d": "椰子咖啡、和牛粉", "i": "Pacific Hwy上越南风情浓厚的越南餐厅。椰子咖啡很好喝，椰子沙冰和越南咖啡融合得好。和牛粉不是真和牛，但粿条本身不错。鸡肉沙拉又干又柴，不要点。菜单不大，已不卖越南包。人均约30刀。", "ne": "Bonjour Vietnam", "lon": 151.16898, "lat": -33.776}, {"n": "Green Shiso Omakase", "t": "Omakase", "r": "5", "p": 300, "a": "Circular Quay", "d": "春季Omakase", "i": "藏在市中心小巷里的Omakase，氛围很好，每位约268刀，团队是中国人，可以用普通话讲解，主厨Simon谦逊可爱，气氛轻松。套餐融入怀石元素，食材丰富，搭配有新意，份量非常足。酒肴八寸里Toro配海胆酱最出色；金目鲷釜饭用高汤炊饭，配时令蔬菜和炭烤金目鲷，热乎治愈，可以续饭；北海道和牛油脂丰富，配山葵酱解腻。寿司十贯，喉黑、海胆、赤身和大腹最好。甜品是静冈蜜瓜和焦糖布丁。厨师很用心，柴鱼片都是现刨的。菜单随季节更换，含酒水人均约300刀。", "ne": "Green Shiso Omakase", "lon": 151.20793, "lat": -33.86146}, {"n": "ester", "t": "现代澳菜", "r": "4", "p": 105, "a": "Chippendale", "d": "烤虾配面包蘸虾油、砂锅鸭肉饺子、血肠吐司", "i": "开了十多年的现代澳菜名店，品质和氛围一如既往。烤虾特别好，面包蘸虾油很好吃；砂锅鸭肉饺子有东方特色；味噌鳕鱼一般；外表不起眼的血肠吐司是全场最佳。人均约105刀，能吃很饱。", "ne": "ester", "lon": 151.20064, "lat": -33.88422}, {"n": "福记潮汕肠粉铺", "t": "潮汕肠粉", "r": "5", "p": 26, "a": "唐人街建德大厦", "d": "猪肉鸡蛋肠粉、卤味粿汁、沙姜鸡、猪骨生蚝粥、南乳鸡翅、甘草水果", "i": "建德大厦里在潮汕人圈子很火的肠粉铺，是悉尼少有的潮汕肠粉。猪肉鸡蛋肠粉复刻度很高；卤味粿汁皮、沙姜鸡、南乳鸡翅都好吃；猪骨生蚝粥浓郁但份量小；还有悉尼少见的甘草水果。不是百分百正宗，但已经很难得。人均约26刀。", "ne": "Fook Kee Teochew Rice Rolls", "lon": 151.20953, "lat": -33.88002}, {"n": "Edomae Sushi 江户前寿司", "t": "旋转寿司", "r": "3", "p": 35, "a": "Haymarket（唐人街到Market City转角）", "d": "海胆鹅肝手卷", "i": "唐人街往Market City转角的旋转寿司，江户前把悉尼旋转寿司的水准带到了新高度。鱼种多，非常新鲜，海胆鹅肝手卷很好吃。人均约35刀。", "ne": "Edomae Sushi", "lon": 151.20064, "lat": -33.87503}, {"n": "Ohmami", "t": "Cafe", "r": "2", "p": 22, "a": "Glebe（悉尼大学对面）", "d": "肉松卷、草莓抹茶、甜甜圈", "i": "悉尼大学公园对面的Cafe，招牌肉松卷很抢手，一早就会卖完，想吃要早点去。草莓抹茶和甜甜圈都普通。", "ne": "Ohmami", "lon": 151.18502, "lat": -33.87592}, {"n": "燊记", "t": "港式云吞面/小吃", "r": "4", "p": 18, "a": "Chatswood（Mandarin Centre美食广场）", "d": "墨鱼饼、腐皮虾卷、细蓉竹昇面", "i": "Mandarin Centre美食广场里不起眼的港式小吃店，味道很正宗。墨鱼饼外皮煎得焦脆，内里是弹牙墨鱼肉；腐皮虾卷酥脆不油；细蓉汤底清甜，用的是传统竹升面。", "ne": "Sun Kee", "lon": 151.18069, "lat": -33.79134}, {"n": "Smelly Cheesecake", "t": "韩式Cafe/芝士蛋糕", "r": "3", "p": 12, "a": "Chatswood火车站（Eastwood等地也有）", "d": "卡通芝士蛋糕、紫薯芝士蛋糕、黑芝麻蛋糕、大虾意面", "i": "开了很多年的韩式芝士蛋糕Cafe，Eastwood等地都有分店，Chatswood火车站也开了。卡通芝士蛋糕完全复刻Emoji造型，像从猫和老鼠动画里跑出来一样，非常可爱；紫薯芝士蛋糕也受好评。", "ne": "Smelly Cheesecake", "lon": 151.17651, "lat": -33.80147}, {"n": "Jeon & Kalguksu Jip", "t": "韩国刀切面/煎饼", "r": "4", "p": 45, "a": "Lidcombe", "d": "手工刀切面（海鲜、牛骨汤）、牛肉煎饼、辣猪排骨火锅", "i": "地道的韩式刀切面和煎饼店。手工刀切面筋道，海鲜和牛骨汤底都有层次；牛肉煎饼蛋液外皮酥脆，牛肉薄嫩，配葱丝很好吃，值得加点。辣猪排骨火锅暖胃，但不如面和煎饼出色。店小，只有约六张桌子。人均约45刀。", "ne": "Jeon & Kalguksu Jip", "lon": 151.04997, "lat": -33.86557}, {"n": "11:11 Sweet", "t": "甜品", "r": "3", "p": 14, "a": "Lane Cove", "d": "草莓抹茶、提拉米苏", "i": "Lane Cove Plaza旁的小甜品店。草莓抹茶抹茶味浓不苦，草莓酸甜中和厚重感，很适合春夏。提拉米苏很软但酒味不足。适合一个人静静坐着发呆。", "ne": "11:11 Sweet", "lon": 151.16864, "lat": -33.81321}, {"n": "Sushi Train", "t": "旋转寿司", "r": "3", "p": 37, "a": "Lane Cove", "d": "寿司", "i": "几十年的老牌旋转寿司，近年焕新，环境更干净明亮现代。食材新鲜、鱼种丰富，寿司米煮得刚好，粒粒分明又有黏性。人均约37刀，不算便宜。", "ne": "Sushi Train", "lon": 151.16393, "lat": -33.81545}, {"n": "一顿小烧烤", "t": "烧烤", "r": "4", "p": 50, "a": "Eastwood", "d": "羊肉串、烤鸭肠、宫后夹肉、烤羊排", "i": "可以自己动手烤，也可以让后厨代烤的烧烤店，小朋友很爱参与。串类多又入味，烤鸭肠、羊肉串、青椒、宫后夹肉、鸡爪和年糕都好吃。必点烤羊排，外焦里嫩，一撕就脱骨，蘸辣椒面吃。人均约50刀。", "ne": "Yidun BBQ", "lon": 151.08572, "lat": -33.7949}, {"n": "Nour", "t": "中东菜", "r": "5", "p": 80, "a": "Surry Hills", "d": "泡菜鸡肉卷、蒜酱脆皮土豆、烤章鱼、烤菜花", "i": "Surry Hills的中东菜，开了多年依然好吃，网上三千多条评价仍保持4.8高分。前菜很惊艳，泡菜鸡肉卷、蒜酱脆皮土豆和烤章鱼都好，酱料好到值得加点Pita来蘸。烤菜花必点，牛排好吃但无特色。甜品非常甜，要慎点。", "ne": "Nour", "lon": 151.21572, "lat": -33.8899}, {"n": "Jun's Malaysian Kitchen", "t": "马来菜", "r": "3", "p": 25, "a": "Eastwood", "d": "滑蛋鸳鸯、虾酱鸡翅、咖喱炒Pipi", "i": "Eastwood新开的马来菜，开业优惠期饭点要排队，建议早到。主食选择多，适合小朋友。大人可以试马来风光、咖喱炒Pipi和虾酱鸡翅，风味很足，滑蛋鸳鸯和虾酱鸡翅最好吃。", "ne": "Jun's Malaysian Kitchen", "lon": 151.08067, "lat": -33.78534}, {"n": "Binchotan", "t": "日式
