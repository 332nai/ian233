分会爆油，撒芝麻更香。份量足。店里调料选择不多。和大阪名店比有差距，但在悉尼算不错。", "dt": "2025-06-26", "c": "jp", "xy": [752.9, 569.2], "ne": "Katsu Haki", "te": "Japanese tonkatsu", "de": "Kagoshima kurobuta tonkatsu rice", "ie": "Tonkatsu shop. The limited kurobuta set is $38: thick Kagoshima black pork that stays tender, with a crisp crust and fat that bursts as you bite; sprinkle sesame. Generous portion, few condiments. Not Osaka level, but good for Sydney.", "ae": "Event Cinema, George St, CBD"}, {"n": "Warabi Mochi Kamakura", "a": "Regent Place", "t": "蕨饼", "r": "3", "p": 12, "pe": 1, "d": "黑芝麻和抹茶蕨饼", "i": "蕨饼专门店，也卖饮品和雪糕。蕨饼非常软，几乎像史莱姆一样会流动，口感糯软。黑芝麻粉比抹茶粉更好吃。包装漂亮，标明赏味期限。5颗十几刀，偏贵。", "dt": "2025-06-26", "c": "bake", "xy": [712.4, 549.3], "ne": "Warabi Mochi Kamakura", "te": "Warabi mochi", "de": "Black sesame and matcha warabi mochi", "ie": "Warabi mochi shop that also sells drinks and ice cream. The mochi is so soft it almost flows like slime. Black sesame beats matcha coating. Pretty packaging with best-before labels. About $15 for five, pricey.", "ae": "Regent Place"}, {"n": "10K NOODLES", "a": "Eastwood（10000面包楼上）", "t": "韩国面", "r": "3", "p": 23, "pe": 0, "d": "辣汤面、花蛤汤面、和牛煎饼", "i": "10000面包楼上的韩国面馆，风格延续纯白简约，菜单只有6道。辣汤面和花蛤汤面面条劲道、汤好喝，适合冬天。饺子皮薄馅厚，但4颗9刀偏贵。和牛煎饼是把和牛锤薄后裹蛋液煎，肉脂香和蛋香兼具，很值得加点。人均约23刀。", "dt": "2025-06-22", "c": "kr", "xy": [409.8, 339.3], "ne": "10K NOODLES", "te": "Korean noodles", "de": "Spicy noodle soup, clam noodle soup, wagyu jeon", "ie": "Korean noodle shop above 10000 Bread with the same white minimal style and a six-item menu. Spicy and clam noodle soups have chewy noodles and great broth, ideal in winter. Dumplings are good but $9 for four. The wagyu jeon, beef pounded thin and pan-fried in egg, is rich and eggy, worth reordering. About $23 per person.", "ae": "Eastwood (above 10000 Bread)"}, {"n": "辣妹厨房 Pretty Chef", "a": "Petersham", "t": "贵州菜", "r": "5", "p": 30, "pe": 0, "d": "辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、宫爆猪板筋", "i": "悉尼少有的贵州菜，辣度温柔浓郁、越吃越想吃。辣子鸡、脆哨米豆腐、腊味糯米饭、糟辣土豆丝、臭豆豉回锅肉、双椒肉末茄子和宫爆猪板筋都很下饭，米豆腐和猪板筋口感新奇。酸汤火锅也值得一试。人均约30刀，非常实惠。", "dt": "2025-06-22", "c": "zh", "xy": [592.1, 646.4], "ne": "Pretty Chef", "te": "Guizhou", "de": "Chilli chicken, rice tofu with crispy pork, cured meat sticky rice, fermented chilli potato, kung pao pork tendon", "ie": "One of Sydney's rare Guizhou restaurants, with a gentle, deep, lingering heat that keeps you eating. Chilli chicken, rice tofu with crispy pork, cured meat sticky rice, fermented chilli potato, twice-cooked pork with fermented beans, chilli eggplant and kung pao pork tendon are all great; the rice tofu and tendon have novel textures. Sour soup hotpot is worth trying. About $30 per person, great value.", "ae": "Petersham"}, {"n": "台南人", "a": "Eastwood台湾夜市", "t": "台湾小吃", "r": "4", "p": 18, "pe": 1, "d": "鸡卤饭、地瓜球、麻油鸡汤、芋泥饼、盐水鸡", "i": "台湾小吃店，鸡卤饭同时有鸡肉和卤肉，上面是猪油煎的荷包蛋，特别好吃。地瓜球和西门町的一模一样；手工芋泥饼很赞；麻油鸡汤在悉尼难得喝到；盐水鸡普通。值得反复去。", "dt": "2025-06-22", "c": "zh", "xy": [401.3, 297.1], "ne": "Tainan Ren", "te": "Taiwanese snacks", "de": "Chicken and braised pork rice, sweet potato balls, sesame oil chicken soup, taro cake, salted chicken", "ie": "Taiwanese snack shop. The rice comes with both chicken and braised pork, topped with an egg fried in lard, superb. Sweet potato balls taste exactly like Ximending's; handmade taro cakes are great; sesame oil chicken soup is rare in Sydney; salted chicken is ordinary. Worth repeat visits.", "ae": "Eastwood Taiwanese night market"}, {"n": "Diana", "a": "Potts Point", "t": "韩国菜", "r": "3", "p": 50, "pe": 0, "d": "拌鱼生、熏鸭片皮鸭、蒸五花生菜包", "i": "开在潮区的韩国餐厅，环境幽暗，菜名看起来难以下手，但味道不错。刺身由服务员桌边拌制，像辣味版的捞起鱼生；片皮鸭用的是熏鸭肉，烟熏味浓；蒸五花肉生菜包的卤肉很香。甜品大麻花普通。人均约50刀，以这个区和环境来说不算贵。", "dt": "2025-06-21", "c": "kr", "xy": [768.2, 575.0], "ne": "Diana", "te": "Korean", "de": "Mixed raw fish, smoked duck, steamed pork belly lettuce wraps", "ie": "Korean restaurant in a hip area, dark and moody, with an intimidating menu that turns out good. Raw fish is tossed tableside like a spicy yusheng; the duck is smoked and very smoky; the steamed pork belly wraps have fragrant braised pork. The giant twisted doughnut dessert is ordinary. About $50 per person, fair for the area and setting.", "ae": "Potts Point"}, {"n": "Pennant Hills Seafood", "a": "Pennant Hills Market Place", "t": "海鲜店/炸鱼薯条", "r": "4", "p": 25, "pe": 1, "d": "Flathead炸鱼配海鲜沙拉、三文鱼腹、金枪鱼Toro", "i": "Pennant Hills的海产店，用每天新鲜到货的鱼做Fish & Chips，配的还是海鲜沙拉。也卖刺身级三文鱼和金枪鱼，可以帮忙切片，三文鱼腹和金枪鱼Toro都很新鲜。", "dt": "2025-06-21", "c": "west", "xy": [370.6, 149.3], "ne": "Pennant Hills Seafood", "te": "Seafood shop / fish and chips", "de": "Flathead with seafood salad, salmon belly, tuna toro", "ie": "Pennant Hills fish shop making fish and chips with fish delivered daily, served with a seafood salad. Also sashimi-grade salmon and tuna sliced to order; salmon belly and toro are very fresh.", "ae": "Pennant Hills Market Place"}, {"n": "Myeongdong", "a": "Chatswood（North Strathfield本店）", "t": "韩国菜", "r": "3", "p": 40, "pe": 1, "d": "梨子拌生牛肉、辣豆腐汤、韩式炸猪排", "i": "North Strathfield评分很高的韩国餐厅，Chatswood也有分店。梨子拌生牛肉必点；辣豆腐汤冬天暖身；韩式炸猪排薄而嫩脆，蘸酱或空口都好吃。三道菜约75刀，够2到3人。", "dt": "2025-06-21", "c": "kr", "xy": [672.9, 358.3], "ne": "Myeongdong", "te": "Korean", "de": "Pear beef yukhoe, spicy tofu stew, Korean pork cutlet", "ie": "Highly rated Korean from North Strathfield, now in Chatswood too. Pear beef yukhoe is a must; spicy tofu stew warms you up; the thin Korean pork cutlet is tender and crisp, great with or without sauce. Three dishes for about $75 feed two to three.", "ae": "Chatswood (original in North Strathfield)"}, {"n": "Leible Coffee", "a": "North Sydney（Crows Nest也有）", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "Absolute", "i": "在悉尼有四家店的咖啡品牌，北悉尼火车站Blue St出口和Crows Nest都有。招牌咖啡豆Absolute强度四星，很提神。", "dt": "2025-06-18", "c": "cafe", "xy": [725.9, 472.5], "ne": "Leible Coffee", "te": "Coffee", "de": "Absolute blend", "ie": "Coffee brand with four Sydney stores, including the North Sydney station Blue St exit and Crows Nest. The signature Absolute beans are rated four for strength, a real wake-up.", "ae": "North Sydney (also Crows Nest)"}, {"n": "彩云南 Colorful Yunnan", "a": "Chatswood（Eastwood也有）", "t": "云南菜", "r": "3", "p": 45, "pe": 0, "d": "过桥米线、土司饵块鸡、瓦片高原肉、蟹黄豆腐、牛肝菌黄焖鸡", "i": "云南菜馆，适合聚餐。不辣的蟹黄豆腐和糖醋里脊都好吃，但最出色的还是过桥米线，汤非常浓郁。人均约45刀。", "dt": "2025-06-17", "c": "zh", "xy": [664.5, 316.1], "ne": "Colorful Yunnan", "te": "Yunnan", "de": "Crossing-the-bridge noodles, Yunnan chicken, tile-grilled pork, crab roe tofu, porcini braised chicken", "ie": "Yunnan restaurant good for group meals. Mild crab roe tofu and sweet and sour pork are good, but the crossing-the-bridge noodles are the star, with a very rich broth. About $45 per person.", "ae": "Chatswood (also Eastwood)"}, {"n": "邓婆婆川式面馆", "a": "Eastwood Plaza", "t": "川式面馆", "r": "2", "p": 20, "pe": 0, "d": "三选便当、砂锅红烧牛肉肥肠米线、重庆小面", "i": "Eastwood牛百岁隔壁的川式面馆，适合买菜时快吃快走。三选便当最好，青椒回锅肉尤其不错；砂锅红烧牛肉肥肠米线次之；重庆小面一般。人均20刀以内。", "dt": "2025-06-16", "c": "zh", "xy": [378.7, 334.5], "ne": "Granny Deng Sichuan Noodles", "te": "Sichuan noodles", "de": "Three-dish bento, claypot beef and intestine rice noodles, Chongqing noodles", "ie": "Sichuan noodle shop next to Mr Fu's in Eastwood, quick for shoppers. The three-dish bento is best, especially twice-cooked pork with green peppers; claypot beef and intestine noodles next; Chongqing noodles average. Under $20 per person.", "ae": "Eastwood Plaza"}, {"n": "Sushi Maru", "a": "Gordon", "t": "寿司外卖", "r": "3", "p": 18, "pe": 1, "d": "寿司盒", "i": "在悉尼有近10家分店的寿司外卖店，新鲜食材加浓厚酱汁，是典型的澳式寿司，很合本地人口味。周末下午也常满座。", "dt": "2025-06-16", "c": "jp", "xy": [581.6, 199.4], "ne": "Sushi Maru", "te": "Sushi takeaway", "de": "Sushi boxes", "ie": "Sushi takeaway chain with nearly ten Sydney stores, fresh ingredients and rich sauces, classic Aussie-style sushi that suits local tastes. Often full even mid-afternoon on weekends.", "ae": "Gordon"}, {"n": "Chois Kitchen", "a": "Castle Hill", "t": "韩式中华料理", "r": "4", "p": 30, "pe": 0, "d": "大盘炸酱面（配整只炸鱿鱼）、米酒", "i": "口碑很好的韩式中华料理，必点大盘炸酱面，上面放一整只炸鱿鱼，剪碎拌面吃；炸酱不甜不油，顺滑爽口。可以配米酒，小朋友可以喝甜米露。人均约30刀。", "dt": "2025-06-16", "c": "kr", "xy": [189.4, 134.9], "ne": "Chois Kitchen", "te": "Korean-Chinese", "de": "Jjajangmyeon platter with whole fried squid, makgeolli", "ie": "Well-loved Korean-Chinese. The must-order jjajangmyeon platter comes topped with a whole fried squid to snip into the noodles; the black bean sauce is not sweet or greasy, smooth and moreish. Pair with makgeolli, and kids get sweet rice drink. About $30 per person.", "ae": "Castle Hill"}, {"n": "Cha-no-wa 茶中环", "a": "Rhodes", "t": "抹茶饮品", "r": "2", "p": 10, "pe": 1, "d": "抹茶软雪糕、蕨饼", "i": "常要排小队的抹茶饮品店，走快速多样的奶茶店路线。抹茶星冰乐里是半杯冰粒，不推荐；抹茶软雪糕配红豆麻薯和抹茶蕨饼中规中矩。", "dt": "2025-06-16", "c": "cafe", "xy": [401.7, 438.9], "ne": "Cha-no-wa", "te": "Matcha drinks", "de": "Matcha soft serve, warabi mochi", "ie": "Matcha drink shop with small queues, run like a fast bubble tea shop. The matcha frappé is half ice chips, not recommended; matcha soft serve with red bean mochi and matcha warabi mochi are fine.", "ae": "Rhodes"}, {"n": "I Gladiatori Osteria Romana", "a": "North Strathfield", "t": "意大利菜", "r": "3", "p": 45, "pe": 0, "d": "茄汁大通心宽粉、提拉米苏", "i": "罗马风味意大利餐厅，在North Strathfield和Freshwater各有一家。有罗马古老的长方形Pinsa薄饼，口感接近佛卡夏。茄汁大通心宽粉好吃；咖啡杯装的提拉米苏非常湿软，只是酒味不足。路边座位很舒服。人均约45刀。", "dt": "2025-06-16", "c": "west", "xy": [412.8, 526.4], "ne": "I Gladiatori Osteria Romana", "te": "Italian", "de": "Tomato paccheri, tiramisu", "ie": "Roman osteria with stores in North Strathfield and Freshwater. They serve ancient Roman rectangular pinsa, closer to focaccia than pizza. Tomato paccheri is good; tiramisu in a coffee cup is very moist, though light on liquor. Lovely street seating. About $45 per person.", "ae": "North Strathfield"}, {"n": "Noodlee", "a": "North Strathfield", "t": "韩越融合越南粉", "r": "5", "p": 28, "pe": 0, "d": "辣牛小肠越南牛肉粉", "i": "韩国人开的越南Pho店，是很成功的融合菜。辣牛小肠越南牛肉粉把韩式牛小肠辣汤和越南米粉结合得极好，小肠爽口，米粉嫩滑，汤底浓郁辛辣，冬天非常适合。一碗28刀，不便宜。", "dt": "2025-06-16", "c": "asia", "xy": [416.3, 535.0], "ne": "Noodlee", "te": "Korean-Vietnamese pho", "de": "Spicy beef intestine pho", "ie": "Korean-run pho shop and a truly successful fusion. Spicy beef small intestine pho marries Korean intestine stew with Vietnamese rice noodles: bouncy intestine, silky noodles, rich spicy broth, perfect in winter. $28 a bowl, not cheap.", "ae": "North Strathfield"}, {"n": "Pure Brew & Co.", "a": "Gordon", "t": "韩式咖啡", "r": "3", "p": 9, "pe": 0, "d": "冰芒果抹茶拿铁", "i": "布置很韩式的咖啡店，每个角落都简单自然，错落有致，店员热情。冰芒果抹茶拿铁很好喝，一杯9刀，适合坐下消磨时间。", "dt": "2025-06-15", "c": "cafe", "xy": [579.2, 218.8], "ne": "Pure Brew & Co.", "te": "Korean coffee", "de": "Iced mango matcha latte", "ie": "Café with very Korean styling, every corner simple and well arranged, and warm staff. The iced mango matcha latte is delicious, $9, nice for passing time.", "ae": "Gordon"}, {"n": "Teddy Bear Hightea Buffet", "a": "Sheraton Grand Sydney Hyde Park", "t": "下午茶自助", "r": "3", "p": 99, "pe": 0, "d": "小熊甜品、巧克力瀑布", "i": "海德公园喜来登酒店的泰迪熊下午茶自助，甜品都有小熊元素，有巧克力瀑布和任挖的冰淇淋，每两人送一只穿喜来登T恤的Build-A-Bear小熊，小朋友会非常开心。成人99刀，小孩55刀。", "dt": "2025-06-15", "c": "bake", "xy": [740.0, 585.7], "ne": "Teddy Bear Hightea Buffet", "te": "High tea buffet", "de": "Teddy bear desserts, chocolate fountain", "ie": "Teddy bear high tea buffet at the Sheraton Grand Hyde Park: teddy-themed desserts, a chocolate fountain, unlimited ice cream, and a Build-A-Bear in a Sheraton T-shirt for every two guests. Kids go wild. $99 adults, $55 kids.", "ae": "Sheraton Grand Sydney Hyde Park"}, {"n": "Sushi Hotaru", "a": "The Galeries", "t": "旋转寿司", "r": "4", "p": 50, "pe": 0, "d": "烤白鳗、三文鱼腹、生虾、手卷、Miso Cod", "i": "开了很多年的人气旋转寿司，价格不贵、食材新鲜、翻桌快。烤白鳗、三文鱼腹和生虾都很新鲜；手卷扎实，一个5刀；西餐厅要卖四五十刀的Miso Cod这里只要7.8刀。人均约50刀，物美价廉。", "dt": "2025-06-15", "c": "jp", "xy": [729.5, 582.5], "ne": "Sushi Hotaru", "te": "Sushi train", "de": "Grilled white eel, salmon belly, raw prawn, hand rolls, miso cod", "ie": "Long-running, popular sushi train: cheap, fresh, fast turnover. Grilled white eel, salmon belly and raw prawn are very fresh; hand rolls are hefty at $5; miso cod that costs $40 to $50 in restaurants is $7.80 here. About $50 per person, great value.", "ae": "The Galeries"}, {"n": "Teddy Tea Break", "a": "Newtown火车站", "t": "奶茶", "r": "2", "p": 9, "pe": 1, "d": "茉香奶茶", "i": "Newtown火车站出口的泰迪熊奶茶店，英伦风装潢有年代感，也有生椰拿铁等流行口味。茉香奶茶普通。", "dt": "2025-06-14", "c": "cafe", "xy": [652.2, 653.1], "ne": "Teddy Tea Break", "te": "Milk tea", "de": "Jasmine milk tea", "ie": "Teddy bear milk tea shop at the Newtown station exit with dated British décor and trendy flavours like fresh coconut latte. The jasmine milk tea is ordinary.", "ae": "Newtown station"}, {"n": "Bar Julius", "a": "Redfern", "t": "西餐", "r": "2", "p": 50, "pe": 0, "d": "Beef Tartare、柠檬烤鸡、美式热狗", "i": "Surry Hills新Plaza里的西餐厅，早上六点开始营业，有全天菜单。Beef Tartare、柠檬烤鸡和美式热狗都一般，但环境和服务很好。人均约50刀，适合商务谈事，不适合专门来吃饭。", "dt": "2025-06-14", "c": "west", "xy": [725.4, 634.4], "ne": "Bar Julius", "te": "Western", "de": "Beef tartare, lemon roast chicken, American hot dog", "ie": "Restaurant in the new Surry Hills plaza, open from 6 am with an all-day menu. Beef tartare, lemon chicken and hot dog are all average, but the setting and service are great. About $50 per person, better for business chats than a dinner out.", "ae": "Redfern"}, {"n": "Westfield Chatswood 美食广场合集", "a": "Westfield Chatswood", "t": "美食广场", "r": "2", "p": 18, "pe": 1, "d": "Sou Ramen Lab鸡汤拉面、美林便当（有儿童份）、霑记、Don't Tell Mama炸串", "i": "Chatswood Westfield美食广场整体缺少惊艳的选择。美林便当一般，但有儿童份量；霑记不如Macquarie Centre的分店；Don't Tell Mama串串比不过夸父；Sou Ramen Lab的鸡汤底还可以。", "dt": "2025-06-14", "c": "zh", "xy": [641.8, 353.5], "ne": "Westfield Chatswood food court roundup", "te": "Food court", "de": "Sou Ramen Lab chicken ramen, Mei Lin bento (kids' sizes), Chanciao, Don't Tell Mama skewers", "ie": "The Westfield Chatswood food court lacks standout options. Mei Lin bento is average but offers kids' sizes; Chanciao is not as good as its Macquarie Centre branch; Don't Tell Mama skewers lose to Kuafu; Sou Ramen Lab's chicken broth is decent.", "ae": "Westfield Chatswood"}, {"n": "Olympic Meats", "a": "Marrickville（Dulwich Hill站对面）", "t": "希腊菜", "r": "5", "p": 30, "pe": 1, "d": "猪鸡牛卷饼、胖薯条", "i": "Dulwich Hill火车站对面的希腊烤肉店，人气极高，常要排一小时以上，但值得。前菜一般可以跳过；卷饼一定要多点，猪肉、鸡肉和牛肉都鲜嫩焦香。胖薯条超脆超香，可能是悉尼最好吃的薯条之一。", "dt": "2025-06-12", "c": "west", "xy": [592.1, 700.3], "ne": "Olympic Meats", "te": "Greek", "de": "Pork, chicken and beef wraps, fat chips", "ie": "Greek grill opposite Dulwich Hill station, hugely popular with waits of over an hour, but worth it. Skip the starters; order plenty of wraps, with pork, chicken and beef all juicy and charred. The fat chips are incredibly crisp, maybe Sydney's best.", "ae": "Marrickville (opposite Dulwich Hill station)"}, {"n": "D'penyetz & D'cendol", "a": "Sussex St", "t": "印尼菜", "r": "3", "p": 20, "pe": 1, "d": "炸鸡腿、烤鸡腿配辣酱", "i": "颜色亮眼的印尼菜，炸鸡腿和烤鸡腿都好吃，辣酱更出色，香且料足。辣度分五级以上，2级已经相当辣。", "dt": "2025-06-12", "c": "asia", "xy": [701.4, 605.1], "ne": "D'penyetz & D'cendol", "te": "Indonesian", "de": "Fried and grilled chicken leg with sambal", "ie": "Brightly coloured Indonesian. Fried and grilled chicken legs are good, and the sambal is even better, fragrant and generous. Spice runs from level one up; level two is already hot.", "ae": "Sussex St"}, {"n": "Bat + Bun", "a": "Darlinghurst", "t": "越南包", "r": "3", "p": 11, "pe": 0, "d": "脆皮猪五花越南包（加青苹果丝）", "i": "街角的越南咖啡店，越南包、米粉、米卷和越南咖啡都有。脆皮猪五花越南包加了青苹果丝，清甜解腻；猪五花够脆，但沙拉酱放得偏多，略甜。一个11刀，不贵。", "dt": "2025-06-12", "c": "asia", "xy": [749.8, 597.1], "ne": "Bat + Bun", "te": "Banh mi", "de": "Crispy pork belly banh mi with green apple", "ie": "Corner Vietnamese café selling banh mi, pho, rice paper rolls and Vietnamese coffee. The crispy pork banh mi adds shredded green apple, refreshing; crisp pork but a little too much sweet mayo. $11, not expensive.", "ae": "Darlinghurst"}, {"n": "Miss Sina", "a": "Marrickville", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "斑斓叶子卷、Biscoff肉桂卷", "i": "Cabramatta一带很火的烘焙店，带东南亚风味。招牌斑斓卷是软糯面包涂斑斓奶油再撒椰片椰丝；Biscoff肉桂卷也好吃。很肥，适合偶尔吃。", "dt": "2025-06-10", "c": "bake", "xy": [589.1, 697.5], "ne": "Miss Sina", "te": "Bakery", "de": "Pandan roll, Biscoff cinnamon roll", "ie": "Popular Cabramatta-area bakery with Southeast Asian flavours. The signature pandan roll is soft bread with pandan cream, coconut flakes and shredded coconut; the Biscoff cinnamon roll is good too. Very rich, an occasional treat.", "ae": "Marrickville"}, {"n": "Tita", "a": "Marrickville", "t": "菲律宾Cafe", "r": "3", "p": 22, "pe": 1, "d": "紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁", "i": "Marrickville的菲律宾Cafe，甜品都用紫薯Ube制作，满桌紫色。紫薯软雪糕、紫薯Biscoff圣代、紫薯抹茶拿铁和紫薯冰面包都很有特色，紫薯味很像广东的五羊雪糕。", "dt": "2025-06-09", "c": "cafe", "xy": [592.6, 706.1], "ne": "Tita", "te": "Filipino café", "de": "Ube soft serve, ube Biscoff sundae, ube matcha latte", "ie": "Filipino café in Marrickville where every sweet is made with ube, so every table is purple. Ube soft serve, ube Biscoff sundae, ube matcha latte and ube ice bun are all distinctive; ube tastes like Guangdong's Wuyang ice cream.", "ae": "Marrickville"}, {"n": "Jagalchi", "a": "Lidcombe", "t": "韩式鱼生", "r": "3", "p": 35, "pe": 0, "d": "无腌鱼生配蒜蓉麻油辣酱、鱼籽辣汤", "i": "Lidcombe韩式鱼生店，在Il Eok Jo隔壁。鱼生不腌制，配蒜蓉麻油辣酱另有风味；鱼籽辣汤冬天很舒服。人均约35刀。", "dt": "2025-06-09", "c": "kr", "xy": [312.0, 538.3], "ne": "Jagalchi", "te": "Korean raw fish", "de": "Unmarinated raw fish with garlic sesame chilli sauce, roe spicy stew", "ie": "Korean raw fish next to Il Eok Jo in Lidcombe. The fish is not marinated, and the garlic sesame chilli sauce gives a different flavour; the spicy fish roe stew is comforting in winter. About $35 per person.", "ae": "Lidcombe"}, {"n": "Mochiric", "a": "The Galeries（流动摊位）", "t": "麻薯甜甜圈", "r": "4", "p": 8, "pe": 1, "d": "斑斓椰子、柠檬奶油、香蕉牛奶甜甜圈", "i": "Cabramatta有名的麻薯甜甜圈，平时在几个地点流动摆摊，周末有时在The Galleries。口感又糯又韧，比普通甜甜圈好吃，口味有斑斓椰子、柠檬奶油、香蕉牛奶等少见款。", "dt": "2025-06-08", "c": "bake", "xy": [733.3, 571.0], "ne": "Mochiric", "te": "Mochi doughnuts", "de": "Pandan coconut, lemon cream, banana milk doughnuts", "ie": "Famous Cabramatta mochi doughnuts that pop up at various spots, sometimes The Galeries on weekends. Chewy and bouncy, much better than regular doughnuts, with unusual flavours like pandan coconut, lemon cream and banana milk.", "ae": "The Galeries (pop-up stall)"}, {"n": "Alice's Makan", "a": "Chatswood Chase", "t": "马来菜", "r": "3", "p": 25, "pe": 1, "d": "炒萝卜糕、海南鸡、咸蛋黄虾球、Kaya Toast", "i": "Chatswood Chase新开的马来餐厅。招牌炒萝卜糕像炒年糕一样，萝卜糕软嫩入味，和鸡蛋豆芽很搭；海南鸡、咸蛋黄虾球和Kaya Toast水准可以。服务很不专业，常上错桌。", "dt": "2025-06-08", "c": "asia", "xy": [684.5, 341.0], "ne": "Alice's Makan", "te": "Malaysian", "de": "Fried radish cake, Hainanese chicken, salted egg prawns, kaya toast", "ie": "New Malaysian in Chatswood Chase. The signature fried radish cake is stir-fried like rice cake, soft and well seasoned with egg and bean sprouts; Hainanese chicken, salted egg prawns and kaya toast are decent. Service is very unprofessional, with dishes often going to the wrong table.", "ae": "Chatswood Chase"}, {"n": "Brother Katsu", "a": "Marina Square, Wentworth Point", "t": "韩国小吃", "r": "2", "p": 18, "pe": 1, "d": "鱼饼汤、炸紫菜卷", "i": "购物中心里的韩国街头小吃店，卖炸物、鱼饼、方便面和饭团。炸紫菜卷太油，不推荐；鱼饼汤胡椒味浓，冷天喝很舒服。", "dt": "2025-06-07", "c": "kr", "xy": [385.9, 431.6], "ne": "Brother Katsu", "te": "Korean snacks", "de": "Fish cake soup, fried gimmari", "ie": "Korean street snack stall in a shopping centre selling fried snacks, fish cakes, ramyun and rice balls. The fried seaweed rolls are far too oily; the peppery fish cake soup is lovely on a cold day.", "ae": "Marina Square, Wentworth Point"}, {"n": "Bosphorus Turkish Street Food", "a": "Wentworth Point", "t": "土耳其菜", "r": "4", "p": 30, "pe": 1, "d": "烤鸡翅薯条、鸡肉Snack Pack、鹰嘴豆泥", "i": "土耳其街头小吃，油香肉类配扎实碳水。烤鸡翅焦香，薯条撒鸡盐，底下铺土耳其面包，配酸蒜酱解腻；Snack Pack可选鸡肉、羊肉或牛肉，米饭用鸡油泡过，油润爽口。鹰嘴豆泥和土耳其汽水也值得点。", "dt": "2025-06-07", "c": "asia", "xy": [373.5, 438.7], "ne": "Bosphorus Turkish Street Food", "te": "Turkish", "de": "Grilled wings with chips, chicken snack pack, hummus", "ie": "Turkish street food: juicy meats and hearty carbs. Charred aithful. About $60 per person.", "ae": "Chinatown"}, {"n": "Chill Restaurant", "a": "Crows Nest（Eastwood也有）", "t": "越南粉", "r": "3", "p": 25, "pe": 0, "d": "咸蛋黄肉松炸虾、和牛Pho", "i": "Eastwood和Crows Nest都有的越南粉店，Google六百多条评价仍有4.7分。前菜咸蛋黄肉松炸虾，四只大虾非常弹牙。和牛Pho一碗28刀，牛肉嫩而肥，上桌时还红彤彤，很鲜。人均约25刀。", "dt": "2025-05-31", "c": "asia", "xy": [709.6, 426.2], "ne": "Chill Restaurant", "te": "Vietnamese pho", "de": "Salted egg pork floss prawns, wagyu pho", "ie": "Pho shop in Eastwood and Crows Nest, still rated 4.7 from over 600 Google reviews. The salted egg floss prawns are four big, bouncy prawns. Wagyu pho is $28, with tender, marbled beef still red when served, very fresh. About $25 per person.", "ae": "Crows Nest (also Eastwood)"}, {"n": "Eden Pasticceria", "a": "Neutral Bay", "t": "意大利甜品", "r": "3", "p": 14, "pe": 1, "d": "Cream Coffee、提拉米苏、开心果泡芙、开心果Cannoli", "i": "意大利甜品店，也卖Gelato。招牌意式Cream Coffee苦甜冰凉，口感像更饱满流动的软雪糕。提拉米苏、开心果泡芙和开心果Cannoli都值得买。三样甜品加一杯Cream Coffee约28刀。", "dt": "2025-05-31", "c": "bake", "xy": [757.9, 446.8], "ne": "Eden Pasticceria", "te": "Italian pastries", "de": "Cream coffee, tiramisu, pistachio choux, pistachio cannoli", "ie": "Italian pastry shop that also sells gelato. The signature Italian cream coffee is bittersweet and icy, like a fuller, flowing soft serve. Tiramisu, pistachio choux and pistachio cannoli are all worth buying. About $28 for three pastries and a cream coffee.", "ae": "Neutral Bay"}, {"n": "SML Cafe", "a": "North Willoughby", "t": "Cafe", "r": "3", "p": 22, "pe": 1, "d": "豆乳咖啡、拉丝芝士三明治、薯饼", "i": "店名意为小中大咖啡的人气Cafe，下午两点半还坐满人。豆乳咖啡、拉丝芝士三明治和薯饼都好吃。", "dt": "2025-05-30", "c": "cafe", "xy": [702.2, 342.6], "ne": "SML Cafe", "te": "Café", "de": "Soy latte, melty cheese sandwich, hash brown", "ie": "Popular café whose name means small, medium, large, still full at 2:30 pm. The soy latte, stretchy cheese toastie and hash brown are all good.", "ae": "North Willoughby"}, {"n": "Sydney Daifuku Store", "a": "Lane Cove North", "t": "日式大福", "r": "3", "p": 10, "pe": ning queues; takeaway from about 4 pm. The boneless spicy chicken feet, steamed egg soup and seaweed rice balls set is a perfect combo; spicy clams are well seasoned and the leftover broth makes a hotpot base. About $77 for four dishes, great value.", "ae": "Lidcombe"}, {"n": "Prince Bakery & Cafe", "a": "Lidcombe", "t": "韩式烘焙", "r": "3", "p": 12, "pe": 1, "d": "番薯紫薯蛋糕（57刀）", "i": "韩国区的烘焙Cafe。番薯紫薯蛋糕外表朴素，里面两层紫薯泥夹心还有紫薯块，很有嚼劲，57刀含巧克力字牌。还有香蕉造型蛋糕和炸三明治等韩式面包。", "dt": "2025-05-11", "c": "bake", "xy": [322.4, 554.5], "ne": "Prince Bakery & Cafe", "te": "Korean bakery", "de": "Sweet potato and purple yam cake ($57)", "ie": "Bakery café in the Korean area. The sweet potato and purple yam cake looks plain but has two layers of purple yam mousse with chunks inside, $57 including a chocolate name plaque. Also banana-shaped cakes, fried sandwiches and other Korean breads.", "ae": "Lidcombe"}, {"n": "1912 Dumpling Bar 小籠館", "a": "Burwood", "t": "小笼包", "r": "2", "p": 22, "pe": 1, "d": "汤包、天王烤鸭包、钟水饺", "i": "新开的小笼包店，大圆窗能看到阿姨现场包小笼包。汤包、天王烤鸭包和钟水饺味道一般，汤汁不够多。价格很贵，四样约60刀。", "dt": "2025-05-10", "c": "zh", "xy": [470.5, 581.9], "ne": "1912 Dumpling Bar", "te": "Xiaolongbao", "de": "Soup dumplings, roast duck buns, Zhong dumplings", "ie": "New xiaolongbao shop with a big round window onto the dumpling makers. Soup dumplings, roast duck buns and Zhong dumplings are average, not very soupy. Very expensive, about $60 for four items.", "ae": "Burwood"}, {"n": "冒笑笑冒菜", "a": "Burwood", "t": "冒菜", "r": "2", "p": 22, "pe": 1, "d": "香辣猪蹄、香辣鸡爪、冒烤鸭", "i": "网评较差的冒菜店，实际没那么难吃。香辣猪蹄和香辣鸡爪软烂入味；冒菜只有咸辣、少了香气；冒烤鸭用整根鸭腿配卤粉，很过瘾。店主是一位女生独力经营。", "dt": "2025-05-10", "c": "zh", "xy": [440.9, 591.8], "ne": "Mao Xiaoxiao Maocai", "te": "Maocai", "de": "Spicy pig trotters, spicy chicken feet, maocai roast duck", "ie": "Maocai with poor online reviews, but not that bad. Spicy trotters and chicken feet are soft and well seasoned; the maocai is salty and hot without much aroma; a whole roast duck leg with braised noodles is sati 16", "c": "kr", "xy": [414.2, 301.5], "ne": "888 GOGI KOREAN BBQ", "te": "Korean BBQ", "de": "Wagyu, ox tongue, steamed egg", "ie": "Korean BBQ in the old Jonga Jip spot. Wagyu and tongue are good but not exceptional; the steamed egg is small and cute; fried chicken ordinary. About $45 per person.", "ae": "Eastwood"}, {"n": "金陵小吃 Nanjing Gourmet", "a": "Haymarket（唐人街牌坊下）", "t": "南京小吃", "r": "3", "p": 18, "pe": 1, "d": "葱油鸡、汤包、牛肉锅贴", "i": "唐人街牌楼下的南京小吃店。葱油鸡很嫩，葱油可以拌饭拌面；牛肉锅贴普通；汤包非常好吃，咬一口汤汁像瀑布一样流出来。价格偏贵，三样约44刀。", "dt": "2025-04-15", "c": "zh", "xy": [713.7, 619.4], "ne": "Nanjing Gourmet", "te": "Nanjing snacks", "de": "Scallion oil chicken, soup dumplings, beef potstickers", "ie": "Nanjing snack shop under the Chinatown archway. Scallion oil chicken is tender and the oil is great on rice or noodles; beef potstickers ordinary; the soup dumplings excellent, releasing a waterfall of soup. Pricey, about $44 for three dishes.", "ae": "Haymarket (under the Chinatown arch)"}, {"n": "禧街炸串", "a": "Haymarket", "t": "炸串", "r": "2", "p": 20, "pe": 1, "d": "脆皮鸡柳、辣缸豆苕皮", "i": "路边香气四溢的炸串摊，选择不多，没有青椒。脆皮鸡柳和辣缸豆苕皮味道过得去但不出彩，苕皮偏软，带回家用空气炸锅复炸会更好吃。不如夸父和建德大厦门口那家。", "dt": "2025-04-15", "c": "zh", "xy": [740.7, 588.6], "ne": "Xi Jie Fried Skewers", "te": "Fried skewers", "de": "Crispy chicken strips, spicy long bean sweet potato sheets", "ie": "Street skewer stall with a tempting smell but limited choice and no green peppers. Chicken strips and spicy bean sweet potato sheets are passable but plain, and the sheets go soggy; re-fry at home in an air fryer. Not as good as Kuafu or the one outside Kin Tak Building.", "ae": "Haymarket"}, {"n": "朱妈妈", "a": "唐人街", "t": "饺子馆", "r": "3", "p": 20, "pe": 1, "d": "饺子外带", "i": "唐人街的老牌饺子馆，可以外带，味道和十几年前一样。", "dt": "2025-04-15", "c": "zh", "xy": [699.2, 593.1], "ne": "Mother Chu's", "te": "Dumpling house", "de": "Dumpling takeaway", "ie": "Long-standing Chinatown dumpling house, takeaway available, tasting just as it did a decade ago.", "ae": "Chinatown"}, {"n": "Giuls", "a": "Surry Hills", "t": "意大利菜", "r": "3", "p": 50, "pe": 0, "d": "佛卡夏、炸虾、烤鱿鱼、提拉米苏", "i": "还不太有名气的意大利小餐厅。佛卡夏配的橄榄油很香；炸虾嫩；蝴蝶面偏奶，里面的意大利香肠很好吃；烤鱿鱼又嫩又弹牙，最出色；Fish Crudo普通。提拉米苏蓬松甜蜜，非常好吃。人均约50刀。", "dt": "2025-04-15", "c": "west", "xy": [759.1, 610.7], "ne": "Giuls", "te": "Italian", "de": "Focaccia, fried prawns, grilled squid, tiramisu", "ie": "Under-the-radar Italian. Fragrant olive oil with the focaccia; tender fried prawns; creamy farfalle with excellent Italian sausage; grilled squid tender and bouncy, the best dish; fish crudo ordinary. The tiramisu is light, sweet and wonderful. About $50 per person.", "ae": "Surry Hills"}, {"n": "Jenny's Bun 珍妮家的面食", "a": "Chatswood", "t": "包子", "r": "3", "p": 3, "pe": 0, "d": "猪肉大葱包、猪肉酸豆角包、三鲜包", "i": "Chatswood的包子店，一个3刀，6个有优惠。肉包个头偏小但包子皮松软，猪肉大葱、猪肉酸豆角和三鲜都好吃，适合买回家当早餐。", "dt": "2025-04-14", "c": "zh", "xy": [635.2, 341.4], "ne": "Jenny's Bun", "te": "Steamed buns", "de": "Pork and scallion, pork and pickled beans, three-delicacy buns", "ie": "Bun shop in Chatswood at $3 each with a discount for six. Small but fluffy; pork and scallion, pork and pickled beans and three-delicacy buns are all tasty, great for breakfast at home.", "ae": "Chatswood"}, {"n": "Kajiken 歌志轩", "a": "Chatswood", "t": "拌面", "r": "4", "p": 20, "pe": 1, "d": "和牛拌面加温泉蛋", "i": "日本拌面连锁店，城市和其他区都有分店。和牛半生熟很嫩，温泉蛋和酸奶酱拌面很好吃。一整碗吃到后面会腻，一大一小合吃一碗面加一份小食刚好。", "dt": "2025-04-14", "c": "jp", "xy": [681.0, 354.6], "ne": "Kajiken", "te": "Mazesoba", "de": "Wagyu mazesoba with onsen egg", "ie": "Japanese mazesoba chain with CBD and suburban stores. Tender seared wagyu, with onsen egg and yoghurt sauce mixed through the noodles. A full bowl gets heavy; one bowl plus a side suits an adult and a child.", "ae": "Chatswood"}, {"n": "Chubby Bun", "a": "Gordon", "t": "汉堡", "r": "3", "p": 13, "pe": 0, "d": "Kids Cheese Burger", "i": "Gordon迷你高尔夫旁的汉堡店，像餐车一样可爱。芝士汉堡烤肉香气浓郁，牛肉饼嫩香，用撒满芝麻的面包。儿童汉堡也要13刀，偏贵。", "dt": "2025-04-12", "c": "west", "xy": [595.2, 205.1], "ne": "Chubby Bun", "te": "Burgers", "de": "Kids' cheeseburger", "ie": "Burger stand by the Gordon mini golf, cute like a food truck. Smoky, flavourful cheeseburger with a tender patty on a sesame bun. Even the kids' burger is $13, pricey.", "ae": "Gordon"}, {"n": "Slowbreads", "a": "Roseville", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "巧克力牛角包、巧克力蛋糕", "i": "橱窗挂着悉尼Royal Fine Food冠军旗帜的烘焙店，酸种面包和法棍很受欢迎。巧克力牛角包和巧克力蛋糕都很法式，香气十足。路过值得试，不必专程。", "dt": "2025-04-12", "c": "bake", "xy": [652.6, 294.7], "ne": "Slowbreads", "te": "Bakery", "de": "Chocolate croissant, chocolate cake", "ie": "Bakery with Sydney Royal Fine Food champion banners in the window; sourdough and baguettes sell well. The chocolate croissant and chocolate cake are very French and fragrant. Worth a stop, not a trip.", "ae": "Roseville"}, {"n": "Hi Kitchen", "a": "Epping", "t": "韩国菜", "r": "4", "p": 25, "pe": 0, "d": "猪杂血肠汤、炸鸡、芝士玉米", "i": "Epping少有人知的韩国餐厅，店里干净宽敞。桌上的迷你小虾米和紫苏粉可以自由加；猪杂血肠汤加虾米很好吃，血肠里的粉条有嚼劲。炸鸡嫩脆，可以配芝士玉米吃。人均约25刀。", "dt": "2025-04-12", "c": "kr", "xy": [397.4, 253.3], "ne": "Hi Kitchen", "te": "Korean", "de": "Pork offal and blood sausage soup, fried chicken, corn cheese", "ie": "Little-known Korean in Epping, clean and spacious. Add tiny shrimp and perilla powder from the table; the pork offal blood sausage soup is great with shrimp, and the glass noodles in the sausage are chewy. Fried chicken is tender and crisp; top it with corn cheese. About $25 per person.", "ae": "Epping"}, {"n": "Habibi Juice", "a": "Pennant Hills", "t": "果汁冰沙", "r": "2", "p": 10, "pe": 0, "d": "Strawberry Mango冰沙", "i": "Pennant Hills火车站对面的果汁冰沙店，像是为放学学生开的。草莓芒果冰沙鲜榨，一小杯10刀偏贵。也有Acai。", "dt": "2025-04-12", "c": "cafe", "xy": [374.2, 157.9], "ne": "Habibi Juice", "te": "Juice and smoothies", "de": "Strawberry mango smoothie", "ie": "Juice bar opposite Pennant Hills station that seems made for after-school students. The fresh strawberry mango smoothie is $10 for a small, a bit pricey. Acai too.", "ae": "Pennant Hills"}, {"n": "Butcherant", "a": "Epping（Homebush也有 s", "ie": "Thai eatery by the Darling Harbour playground, handy for dinner after a play. The basil barramundi rice has a big, perfectly fried fillet with intense basil; salted egg prawn noodles are fragrant. About $25 per person.", "ae": "Darling Harbour (by the playground)"}, {"n": "巴适小厨", "a": "Zetland", "t": "自贡菜", "r": "5", "p": 30, "pe": 0, "d": "火爆腰丝、干煸肥肠、渣渣牛肉、鲜椒爽脆、尖椒兔肉、泡椒仔鸡", "i": "Zetland的自贡菜，悉尼自贡菜热潮的起点，现在周末中午排队不久。火爆腰丝、干煸肥肠、渣渣牛肉、肉末茄子、鲜椒爽脆、尖椒兔肉、泡椒仔鸡和冒菜都好吃，而且每道辣味都不同：泡椒咸酸、鲜椒清香、干煸带甜，冒菜有五香味。人均约30刀，便宜好吃。", "dt": "2025-04-09", "c": "zh", "xy": [735.9, 678.8], "ne": "Bashi Kitchen", "te": "Zigong", "de": "Sizzling kidney strips, dry-fried intestine, minced beef, fresh chilli crunch, chilli rabbit, pickled chilli chicken", "ie": "Zetland Zigong restaurant that started Sydney's Zigong craze; weekend lunch waits are short now. Sizzling kidney, dry-fried intestine, minced beef, eggplant, fresh chilli crunch, chilli rabbit, pickled chilli chicken and maocai are all great, each with its own heat: salty-sour pickled chilli, fresh chilli fragrance, sweet dry-fried notes, five-spice maocai. About $30 per person, cheap and delicious.", "ae": "Zetland"}, {"n": "Ting Hao A 挺好啊", "a": "Chatswood", "t": "韩式中华料理", "r": "4", "p": 40, "pe": 0, "d": "奶油虾、糖醋肉、炸酱面、肉沫茄子", "i": "绿底红字大招牌的韩式中华料理。奶油虾个大，面衣轻盈；糖醋肉用厚切里脊但很嫩，果酱汁里还有西柚；炸酱面韧性十足；肉末茄子到位。适合同事聚餐和家庭聚会，也有一人套餐。人均约40刀。", "dt": "2025-04-08", "c": "kr", "xy": [655.9, 313.4], "ne": "Ting Hao A", "te": "Korean-Chinese", "de": "Cream prawns, sweet and sour pork, jjajangmyeon, minced pork eggplant", "ie": "Korean-Chinese with a big green and red sign. Cream prawns are big with a light batter; thick-cut sweet and sour pork stays tender with a fruity sauce that even has grapefruit; jjajangmyeon is chewy; minced pork eggplant spot on. Good for team or family dinners, with solo sets too. About $40 per person.", "ae": "Chatswood"}, {"n": "Happi Burger", "a": "Lindfield", "t": "汉堡", "r": "2", "p": 20, "pe": 1, "d": "炸鸡汉堡", "i": "黄色调的可爱小汉堡店，菜单丰富。炸鸡汉堡肉排脆 t Bun", "a": "Cherrybrook Shopping Village（每周配送）", "t": "粤菜/每周配送", "r": "4", "p": 30, "pe": 1, "d": "每周配送三菜套餐", "i": "粤菜大厨掌勺的家庭每周配送服务，每天有四道菜，可选两菜、三菜或四菜，菜式不重复，下午4到6点送到家，微波炉加热即可。2大2小一周三菜套餐约210刀，适合忙碌的双职工家庭，主要配送西北区。", "dt": "2025-04-02", "c": "zh", "xy": [302.6, 101.4], "ne": "Meet Bun", "te": "Cantonese / weekly delivery", "de": "Weekly three-dish delivery plan", "ie": "Weekly home meal delivery cooked by a Cantonese chef: four dishes daily, choose two, three or four, never repeating, delivered 4 to 6 pm and reheated in the microwave. About $210 a week for a three-dish plan for two adults and two kids. Great for busy working families; mainly delivers to the north-west.", "ae": "Cherrybrook Shopping Village (weekly delivery)"}, {"n": "Morena", "a": "Martin Place", "t": "南美菜", "r": "2", "p": 130, "pe": 0, "d": "烤牛舌、牛排、秘鲁鱼生", "i": "热情洋溢又有格调的南美餐厅，服务员很会推销。餐包不推荐；两道秘鲁风Raw鱼生不错；烤牛舌和牛排很好吃；Beef Tartare加了大量洋葱和酱料，盖过牛肉香，可以不点。人均约130刀，偏贵，适合约会。", "dt": "2025-04-01", "c": "asia", "xy": [741.2, 555.2], "ne": "Morena", "te": "South American", "de": "Grilled ox tongue, steak, Peruvian ceviche", "ie": "Lively yet stylish South American restaurant with very persuasive staff. Skip the bread rolls; the two Peruvian raw dishes are good; grilled ox tongue and steak are excellent; the beef tartare is drowned in onion and sauce, skip it. About $130 per person, pricey, best for dates.", "ae": "Martin Place"}, {"n": "一呷一嗦（已关）", "a": "Eastwood", "t": "长沙米粉", "r": "4", "p": 18, "pe": 1, "d": "长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花、卤牛肉", "i": "已关门的Eastwood长沙米粉店，原址现为老细屋里。曾以长沙酸菜猪肉盖粉、辣椒炒腊牛肉盖粉、爆炒腰花和卤牛肉闻名。", "dt": "2025-04-01", "c": "zh", "xy": [372.1, 322.4], "ne": "Yi Jia Yi Suo (closed)", "te": "Changsha rice noodles", "de": "Changsha pickled pork rice noodles, chilli cured beef rice noodles, sizzling kidney, braised beef", "ie": "Closed Changsha rice noodle shop in Eastwood, now Lao Xi Wu Li. It was known for pickled pork noodles, chilli cured beef noodles, sizzling kidney and braised beef.", "ae": "Eastwood"}, {"n": " 大牛骨髓和一大块牛排骨。牛骨髓化进汤里让汤更浓郁鲜美，牛排骨一抿就脱骨。贵但不算过分，服务员还会送小朋友气球。", "dt": "2025-02-14", "c": "asia", "xy": [410.8, 538.8], "ne": "Savoury Dining", "te": "Vietnamese pho", "de": "$40 deluxe beef pho (bone marrow, beef rib)", "ie": "Deluxe pho at $40 a bowl: wagyu slices and beef balls plus a giant marrow bone and a big beef rib. The marrow melts into the broth making it richer, and the rib falls off the bone. Pricey but fair, and staff give kids balloons.", "ae": "North Strathfield"}, {"n": "Shalom Indonesian Restaurant", "a": "Sussex St, CBD", "t": "印尼菜", "r": "4", "p": 12, "pe": 0, "d": "印尼烤鸡腿配Balinese Sauce", "i": "Sussex St上默默经营多年的印尼餐厅。印尼烤鸡腿非常香，配秘制Balinese Sauce很好吃。一份12刀，不贵。", "dt": "2025-02-14", "c": "asia", "xy": [702.3, 613.4], "ne": "Shalom Indonesian Restaurant", "te": "Indonesian", "de": "Indonesian grilled chicken with Balinese sauce", "ie": "Indonesian restaurant quietly running for years on Sussex St. The grilled chicken leg is wonderfully fragrant with the house Balinese sauce. $12, cheap.", "ae": "Sussex St, CBD"}, {"n": "Banksia Bakehouse", "a": "Grosvenor Place, George St, CBD", "t": "蛋糕", "r": "3", "p": 14, "pe": 1, "d": "心形蛋糕", "i": "小巧可爱的心形蛋糕，适合节日送礼，颜色偏鲜艳。", "dt": "2025-02-13", "c": "bake", "xy": [742.5, 531.5], "ne": "Banksia Bakehouse", "te": "Cake", "de": "Heart-shaped cake", "ie": "Small, cute heart-shaped cakes, good for occasions, though brightly coloured.", "ae": "Grosvenor Place, George St, CBD"}, {"n": "Thirty 7even Dining", "a": "Macquarie Park", "t": "台湾融合", "r": "3", "p": 40, "pe": 0, "d": "紫菜Cracker、黑松露萝卜糕、盐酥鸡、虾多士", "i": "Macquarie Park新楼盘下的台湾融合菜。紫菜脆片、黑松露萝卜糕、盐酥鸡和虾多士都好吃，虾多士又脆又香，虾个头大。人均约40刀，不便宜，附近可以来尝鲜，不必专程。", "dt": "2025-02-13", "c": "zh", "xy": [504.1, 262.6], "ne": "Thirty 7even Dining", "te": "Taiwanese fusion", "de": "Seaweed crackers, black truffle radish cake, popcorn chicken, prawn toast", "ie": "Taiwanese fusion under new apartments in Macquarie Park. Seaweed crackers, truffle radish cake, popcorn chicken and prawn toast are all good; th prawns, all seafood. About $90 per person before wine and dessert, pricey, but lovely for dates and friends.", "ae": "Hilton Sydney"}, {"n": "Mr Perfect Skewer BBQ 百铺乐烤串", "a": "Lidcombe", "t": "延边烤串", "r": "4", "p": 55, "pe": 0, "d": "乳酸菌牛肉串、牛排大串", "i": "据说是国内延边有名的烤串店。牛羊鸡肉质都很好，嫩到油脂噼啪作响。乳酸菌牛肉串用养乐多和奇异果腌制，酸酸甜甜很出彩；大串牛排烤好直接上桌，裹满芝麻非常香。肉新鲜不肥腻，人均约55刀。", "dt": "2025-02-09", "c": "zh", "xy": [320.5, 540.7], "ne": "Mr Perfect Skewer BBQ", "te": "Yanbian skewers", "de": "Yoghurt drink marinated beef skewers, big steak skewer", "ie": "Reportedly a famous skewer house from Yanbian. Excellent beef, lamb and chicken, sizzling with fat. Beef skewers marinated in Yakult and kiwifruit are sweet, tangy and outstanding; the big steak skewer arrives cooked and coated in sesame. Fresh and not greasy. About $55 per person.", "ae": "Lidcombe"}, {"n": "Portico Chicken", "a": "Pennant Hills", "t": "葡式烤鸡", "r": "4", "p": 14, "pe": 0, "d": "葡鸡、海鲜沙拉、鸡盐", "i": "Pennant Hills火车站新开的葡式烤鸡店，干香型葡鸡，一只可以配两种酱。海鲜沙拉新鲜，也卖鸡盐。老板非常友善。两人约28刀，很实惠。", "dt": "2025-02-07", "c": "west", "xy": [365.6, 153.5], "ne": "Portico Chicken", "te": "Portuguese chicken", "de": "Portuguese chicken, seafood salad, chicken salt", "ie": "New Portuguese chicken shop at Pennant Hills station, dry and flavourful, with two sauces per chicken. Fresh seafood salad, and they sell chicken salt. Very kind owner. About $28 for two, great value.", "ae": "Pennant Hills"}, {"n": "No.1 Skewers 福興炸串", "a": "Eastwood", "t": "炸串", "r": "3", "p": 25, "pe": 0, "d": "青椒、掌中宝、小郡肝、乌骨鸡柳", "i": "Eastwood新开的炸串店，选择不算多。青椒、掌中宝和小郡肝都不错；乌骨鸡柳、香肠、玉米、薯塔和年糕适合小朋友。免费提供冰淇淋和苹果汁。人均约25刀。", "dt": "2025-02-07", "c": "zh", "xy": [407.8, 294.4], "ne": "No.1 Skewers", "te": "Fried skewers", "de": "Green pepper, chicken cartilage, gizzards, black chicken strips", "ie": "New fried skewer shop in Eastwood with a modest range. Green pepper, chicken cartilage and gizzards are good; black chicken strips, sausages, corn, potato towers and rice cakes suit kids. Free ice cream and apple juice. About $25 per person.", "ae": "Eastwood"}, {"n": "Hello Auntie", "a": "Darling Square", "t": "越南融合", "r": "2", "p": 85, "pe": 0, "d": "龙虾馄饨、牛排、烤虾配米粉", "i": "偏西式的越南融合餐厅。龙虾馄饨奶味很重；牛排很嫩，做得成功；烤虾配米粉微辣好吃。人均约85刀，不便宜。", "dt": "2025-02-06", "c": "asia", "xy": [720.1, 586.9], "ne": "Hello Auntie", "te": "Vietnamese fusion", "de": "Lobster wontons, steak, grilled prawns with vermicelli", "ie": "Western-leaning Vietnamese fusion. Lobster wontons are very creamy; the steak is tender and well done; grilled prawns with vermicelli are mildly spicy and tasty. About $85 per person, not cheap.", "ae": "Darling Square"}, {"n": "胖姨儿手工拉面馆 My Aunt's Handmade Noodles", "a": "Eastwood（Burwood也有）", "t": "西北拉面", "r": "5", "p": 10, "pe": 0, "d": "肥肠米线、爆肚宽面、羊排", "i": "从Burwood开到Eastwood的西北手工拉面馆，好吃又实惠。一碗面约20刀出头，可以免费无限续面，付现金95折，还有集章卡，十碗送一碗。肥肠米线、爆肚宽面和羊排都好吃。人均约10刀。", "dt": "2025-02-02", "c": "zh", "xy": [372.1, 332.0], "ne": "My Aunt's Handmade Noodles", "te": "Northwestern hand-pulled noodles", "de": "Intestine rice noodles, tripe wide noodles, lamb ribs", "ie": "Northwestern hand-pulled noodle shop from Burwood, now in Eastwood, delicious and great value. Bowls are just over $20 with unlimited free noodle refills, 5% off for cash, and a stamp card with every tenth bowl free. Intestine rice noodles, tripe wide noodles and lamb ribs are all great. About $10 per person.", "ae": "Eastwood (also Burwood)"}, {"n": "档口仔", "a": "Hurstville", "t": "粤菜小炒", "r": "5", "p": 35, "pe": 1, "d": "五柳炸蛋、芋头扣肉煲、菜心炒肥叉、干炒牛河、酸菜炒大肠、蒜香骨", "i": "Hurstville的粤菜小馆，开业初期厨房和外场应接不暇，出品不稳，两个多月后已经走上正轨，服务跟得上，菜品质量也回来了。五柳炸蛋最出色，五柳汁调得极好，蛋白边缘炸得酥脆，蛋黄溏心，如今在广东也少见。芋头扣肉煲调味出众；菜心炒肥叉猛火快炒，焦香可口。干炒牛河可能是目前悉尼数一数二，只差在本地河粉原料。酸菜炒大肠干净无异味，炒得干爽有锅气，非常下饭；蒜香骨用半肥瘦的肉，蒜香浓。", "dt": "2026-11-21", "c": "zh", "xy": [453.1, 883.5], "ne": "Dang Kou Zai", "te": "Cantonese stir-fry", "de": "Wuliu fried egg, taro pork belly pot, choy sum with fatty char siu, dry-fried beef hor fun, pickled greens with intestine, garlic pork ribs", "ie": "Cantonese eatery in Hurstville that struggled in its first weeks but is now running smoothly with quality back on track. The wuliu fried egg is the star: perfectly balanced sweet-sour sauce, crisp edges and a runny yolk, rare even in Guangdong now. The taro pork belly pot is superbly seasoned; fatty char siu with choy sum is revived by fierce wok heat. The beef hor fun may be Sydney's best, held back only by local rice noodles. Clean, dry, smoky intestine with pickled greens is great with rice, and the garlic ribs use well-marbled pork.", "ae": "Hurstville"}, {"n": "金唐 Golden Century（Crown新店）", "a": "Barangaroo（Crown酒店）", "t": "粤菜酒楼", "r": "5", "p": 75, "pe": 1, "d": "乳鸽、XO酱炒Pipi", "i": "老牌粤菜酒楼金唐在Crown酒店开的新店，出品中规中矩。乳鸽做得最好，XO酱炒Pipi也不错，金唐自家的XO酱水准很高；Pipi底下的煎米粉底偶尔发挥不稳，好的煎米粉要中间软、两面脆，带一点金黄焦边。", "dt": "2026-11-21", "c": "zh", "xy": [710.5, 535.3], "ne": "Golden Century (Crown)", "te": "Cantonese restaurant", "de": "Roast pigeon, XO pipis", "ie": "Golden Century's new branch at Crown, solid overall. The roast pigeon is the best dish and the XO pipis are good, thanks to Golden Century's excellent XO sauce; the fried vermicelli base can be inconsistent, ideally soft inside, crisp and lightly golden outside.", "ae": "Barangaroo (Crown Sydney)"}, {"n": "渝人码头", "a": "Burwood", "t": "川菜", "r": "5", "p": 40, "pe": 1, "d": "酸菜鲈鱼、青椒肉丝", "i": "Burwood少数炒菜能吃的川菜馆。酸菜鲈鱼很好吃，小炒也不错，例如青椒肉丝；口水鸡不推荐。", "dt": "2026-11-21", "c": "zh", "xy": [462.2, 611.8], "ne": "Yu Ren Ma Tou", "te": "Sichuan", "de": "Pickled cabbage fish, shredded pork with green peppers", "ie": "One of Burwood's few reliable Sichuan stir-fry spots. The pickled cabbage fish is excellent and stir-fries like shredded pork with green peppers are good; skip the saliva chicken.", "ae": "Burwood"}, {"n": "Mr Wong", "a": "Bridge Lane, CBD", "t": "粤菜/点心", "r": "5", "p": 80, "pe": 1, "d": "点心、紫菜炒饭", "i": "市中心Bridge Lane的知名粤菜餐厅，点心一直是悉尼最出色的之一。单点菜偏向西人口味，XO粉丝海鲜煲的XO酱偏甜、粉丝偏油；紫菜炒饭倒是很好吃。建议以点心为主。", "dt": "2026-11-21", "c": "zh", "xy": [703.7, 569.5], "ne": "Mr Wong", "te": "Cantonese / dim sum", "de": "Dim sum, seaweed fried rice", "ie": "Famous Cantonese restaurant on Bridge Lane in the CBD whose dim sum remains among Sydney's best. The à la carte menu leans to Western tastes: the XO vermicelli seafood pot is sweet and oily, though the seaweed fried rice is very good. Focus on dim sum.", "ae": "Bridge Lane, CBD"}, {"n": "Rockpool Bar & Grill", "a": "Hunter St, CBD", "t": "牛排馆", "r": "5", "p": 150, "pe": 1, "d": "Rib Eye", "i": "市中心老牌牛排馆，Rib Eye一如既往地出色。意面这些年换过不少，其余菜式中规中矩，来这里就是为了吃牛排。", "dt": "2026-11-21", "c": "west", "xy": [749.4, 582.7], "ne": "Rockpool Bar & Grill", "te": "Steakhouse", "de": "Rib eye", "ie": "Long-standing CBD steakhouse where the rib eye is as excellent as ever. The pasta has changed many times over the years; other dishes are fine. Come for the steak.", "ae": "Hunter St, CBD"}, {"n": "南国", "a": "Revesby", "t": "粤菜小馆", "r": "5", "p": 40, "pe": 1, "d": "走地鸡、蒜香骨", "i": "Revesby的粤菜小馆，悉尼南区性价比最高的粤菜之一，价格便宜又好吃，晚晚满座。走地鸡上桌前淋上鸡汁，鸡味更浓，做法简单有效，只是姜葱碟给得少。招牌蒜香骨蒜味浓郁，是一盘合格的蒜香骨。", "dt": "2026-11-21", "c": "zh", "xy": [225.8, 825.4], "ne": "Nan Guo", "te": "Cantonese eatery", "de": "Free-range chicken, garlic pork ribs", "ie": "Cantonese eatery in Revesby, one of the best-value Cantonese spots in southern Sydney, cheap, tasty and full every night. The free-range chicken is dressed with chicken jus before serving for a deeper flavour, simple and effective, though the ginger scallion dip is stingy. The signature garlic ribs are richly garlicky and solid.", "ae": "Revesby"}, {"n": "燉品皇·燕鲍翅", "a": "Thomas St, Haymarket", "t": "粤菜", "r": "5", "p": 80, "pe": 1, "d": "酸菜炒牛肉、荷香当归红枣蒸走地鸡、鸳鸯炒米、金瓜海鲜炒饭", "i": "唐人街Thomas St的粤菜馆，地道广东味。酸菜炒牛肉是惊喜，牛肉嫩滑，广式甜口酸菜比牛肉还好吃。荷香当归红枣蒸走地鸡，当归红枣香气浓郁，底下垫着荷叶，很入味，可以按口味加酱油。鸳鸯炒米像干炒牛河，经典好吃，份量很大。金瓜海鲜炒饭是招牌。", "dt": "2026-11-21", "c": "zh", "xy": [745.0, 600.9], "ne": "Dun Pin Wong", "te": "Cantonese", "de": "Beef with pickled mustard greens, lotus leaf steamed chicken with angelica and dates, yuan yang fried rice noodles, pumpkin seafood fried rice", "ie": "Cantonese restaurant on Thomas St in Haymarket with authentic Guangdong flavour. Beef with pickled mustard greens is a surprise: silky beef with sweet Cantonese pickles even better than the meat. Free-range chicken steamed on lotus leaf with angelica and red dates is fragrant and deeply flavoured; add soy to taste. Yuan yang fried noodles taste like beef hor fun, classic and huge. The pumpkin seafood fried rice is the signature.", "ae": "Thomas St, Haymarket"}, {"n": "Tobikiri Japanese Kitchen", "a": "Neutral Bay", "t": "Omakase/日料", "r": "5", "p": 200, "pe": 0, "d": "Omakase（27道）、豆乳茶碗蒸、昆布盐腌鰤鱼、Toro油脂海葡萄手卷、烟熏寿司、安康鱼肝小猫饭、番茄酿鹅肝、木鱼花玉米浓汤", "i": "Neutral Bay的家庭式日料小厨房，没有一般Omakase的商业感，多的是老板对料理的热爱和巧思，老板会和客人聊天介绍菜式，熟客很多。Omakase约200刀27道，以贵价食材为主，海胆出现三次，非常超值。豆乳茶碗蒸铺三文鱼籽；鰤鱼用昆布和盐腌过再脱水，鲜味更集中。寿司多达17贯，用紫菜裹着Toro刮下的油脂和海葡萄的手卷一秒入魂；有一贯在玻璃罩里烟熏5分钟，打开满是檀香；Mackerel配腌昆布毫无腥味；星鳗焦脆，墨鱼配海胆和紫苏。安康鱼肝捣碎后和寿司饭、芝士碎拌成小猫饭，完全不腥。番茄酿鹅肝配甜高汤，木鱼花玉米浓汤也很有巧思。也可以单点。", "dt": "2026-11-21", "c": "jp", "xy": [759.2, 454.7], "ne": "Tobikiri Japanese Kitchen", "te": "Omakase / Japanese", "de": "Omakase (27 courses), soy milk chawanmushi, kombu-cured yellowtail, toro fat and sea grape hand roll, smoked nigiri, monkfish liver rice, foie gras stuffed tomato, bonito corn soup", "ie": "Homely little Japanese kitchen in Neutral Bay; instead of polished omakase theatre you get the owner's passion and creativity, and he chats with guests about each dish. Lots of regulars. About $200 for 27 courses built around premium ingredients, with uni appearing three times, outstanding value. Soy milk chawanmushi topped with salmon roe; yellowtail cured with kombu and salt to concentrate its flavour. Up to 17 nigiri: a hand roll of toro fat scraped from the belly with sea grapes is unforgettable, one piece is smoked under glass for five minutes with sandalwood aroma, mackerel with pickled kombu has no fishiness, conger eel is crisp, squid comes with uni and shiso. Monkfish liver is mashed into sushi rice with cheese, with zero fishiness. Foie gras stuffed tomato in sweet broth and bonito corn soup are clever. À la carte is available too.", "ae": "Neutral Bay"}], LAB=[{"t": "Hornsby", "xy": [444.7, 41.2]}, {"t": "Castle Hill", "xy": [181.6, 129.9]}, {"t": "Epping", "xy": [400.0, 263.0]}, {"t": "Eastwood", "xy": [397.4, 320.0]}, {"t": "Macquarie Park", "xy": [500.0, 275.7]}, {"t": "Chatswood", "xy": [660.5, 339.0]}, {"t": "Crows Nest", "xy": [721.1, 430.9]}, {"t": "Ryde", "xy": [463.2, 392.9]}, {"t": "Rhodes", "xy": [413.2, 443.6]}, {"t": "Carlingford", "xy": [310.5, 291.5]}, {"t": "Lidcombe", "xy": [307.9, 551.3]}, {"t": "Auburn", "xy": [271.1, 503.8]}, {"t": "Burwood", "xy": [457.9, 592.5]}, {"t": "Strathfield", "xy": [431.6, 579.9]}, {"t": "Concord", "xy": [457.9, 532.3]}, {"t": "CBD", "xy": [728.9, 567.2]}, {"t": "Surry Hills", "xy": [739.5, 621.1]}, {"t": "Glebe", "xy": [673.7, 598.9]}, {"t": "Zetland", "xy": [731.6, 684.4]}, {"t": "Botany", "xy": [700.0, 811.2]}, {"t": "Bondi", "xy": [894.7, 636.9]}, {"t": "Manly", "xy": [931.6, 339.0]}, {"t": "Mosman", "xy": [826.3, 440.4]}, {"t": "Gordon", "xy": [584.2, 209.1]}, {"t": "Wahroonga", "xy": [492.1, 88.7]}, {"t": "Hurstville", "xy": [452.6, 877.7]}, {"t": "Miranda", "xy": [455.3, 1093.2]}, {"t": "Parramatta", "xy": [192.1, 396.1]}, {"t": "Marrickville", "xy": [592.1, 700.3]}, {"t": "North Sydney", "xy": [728.9, 475.3]}, {"t": "Circular Quay", "xy": [739.5, 541.8], "m": 1}, {"t": "The Rocks", "xy": [728.9, 529.2], "m": 1}, {"t": "Darlinghurst", "xy": [757.9, 595.7], "m": 1}, {"t": "Haymarket", "xy": [721.1, 598.9], "m": 1}, {"t": "Chippendale", "xy": [707.9, 621.1], "m": 1}, {"t": "Ultimo", "xy": [702.6, 602.0], "m": 1}, {"t": "Pyrmont", "xy": [697.4, 564.0], "m": 1}, {"t": "Barangaroo", "xy": [713.2, 545.0], "m": 1}, {"t": "Woolloomooloo", "xy": [768.4, 567.2], "m": 1}, {"t": "Paddington", "xy": [786.8, 614.7], "m": 1}, {"t": "Rose Bay", "xy": [886.8, 570.4], "m": 1}, {"t": "Redfern", "xy": [721.1, 640.1], "m": 1}, {"t":  if(v==='spin')xsInit();if(v==='brawl'&&!$('#xbrawl').innerHTML)xbRender();document.querySelectorAll('#dr .dr-n a').forEach(a=>a.classList.toggle('on',a.dataset.v===v))}

addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('=')[0];if(['map','list','spin','brawl','party','swipe'].includes(h)&&h!==view)setView(h)});
{const o=applyLang;applyLang=function(){o.apply(this,arguments);const en=LANG==='en';document.querySelectorAll('#dr .dr-n a').forEach(a=>{const [b,s]=a.dataset[en?'en':'zh'].split('|');a.querySelector('b').textContent=b;a.querySelector('span').textContent=s});
 document.querySelector('#dr .dr-x').textContent=XX().close;const r=$('#rand');if(r)r.textContent=en?'Surprise me':'随便来一家';if(XS.init)xsRender();if($('#xbrawl').innerHTML)xbRender()}}
