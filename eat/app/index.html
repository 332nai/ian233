, "d": "章鱼、Beef Tartare、牛排、鸭胸、儿童炸鱼薯条", "i": "Customs House楼顶的景观西餐厅，正对Harbour Bridge，好天气来吃非常享受。两道菜120刀，三道菜145刀。前菜推荐章鱼和Beef Tartare，主菜推荐牛排和鸭胸；Raw Snapper调味过酸，不要点。儿童餐的Fish & Chips也很专业，外皮蓬松，鱼肉扎实。很适合招待来悉尼的亲友。", "dt": "2026-08-03", "c": "west", "xy": [736.4, 539.1], "ne": "Cafe Sydney", "te": "Waterfront dining", "de": "Octopus, beef tartare, steak, duck breast, kids' fish and chips", "ie": "Rooftop restaurant on Customs House facing the Harbour Bridge, wonderful on a fine day. Two courses $120, three $145. Choose octopus and beef tartare to start, steak and duck to follow; skip the raw snapper, far too acidic. The kids' fish and chips is done properly. Great for hosting visitors.", "ae": "Circular Quay"}, {"n": "Pastry Club by Frenchs Fair", "a": "Waterloo", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "牛角包", "i": "开在住宅小区水池边的烘焙店，棕榈树、仙人掌和碧绿的池水，很有地中海的感觉。牛角包在寒风里依然酥脆。巧克力巴斯克奶味较重。夏天来坐在水池边会更舒服。", "dt": "2026-08-03", "c": "bake", "xy": [728.9, 665.4], "ne": "Pastry Club by Frenchs Fair", "te": "Bakery", "de": "Croissants", "ie": "Bakery by a pool in a residential complex, with palms, cacti and green water for a Mediterranean feel. Croissants stay crisp even in a cold wind; the chocolate Basque cake is quite milky. Even nicer poolside in summer.", "ae": "Waterloo"}, {"n": "Sydney Common", "a": "Sheraton Grand Sydney Hyde Park", "t": "现代澳菜", "r": "5", "p": 120, "pe": 0, "d": "烤鸭、烤虾", "i": "喜来登酒店里的现代澳菜餐厅，招牌烤鸭非常出色，皮酥肉嫩，香料和蜂蜜相得益彰，可能是目前悉尼最好吃的鸭子。前菜烤虾也很好，酱汁好到值得加点面包来蘸。人均约120刀，值得专程来。", "dt": "2026-08-02", "c": "west", "xy": [739.5, 579.9], "ne": "Sydney Common", "te": "Modern Australian", "de": "Roast duck, grilled prawns", "ie": "Modern Australian restaurant in the Sheraton. The signature roast duck is outstanding, crisp skin and tender meat with spice and honey, possibly Sydney's best duck right now. Grilled prawns are great too; order bread for the sauce. About $120 per person, worth a special trip.", "ae": "Sheraton Grand Sydney Hyde Park"}, {"n": "Martha's", "a": "Wareemba", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "牛角包、Prawn Roll、巴斯克", "i": "人气很旺的烘焙店，周末人很多。牛角包款式丰富，透过玻璃橱窗能看到制作过程。也有少量Brunch，Prawn Roll份量很大。巴斯克蛋糕也值得一试。", "dt": "2026-08-01", "c": "bake", "xy": [528.9, 529.2], "ne": "Martha's", "te": "Bakery", "de": "Croissants, prawn roll, Basque cheesecake", "ie": "Busy bakery, crowded on weekends. Many croissant varieties, made behind a glass window. A small brunch menu includes a big prawn roll, and the Basque cheesecake is worth trying.", "ae": "Wareemba"}, {"n": "Matkim", "a": "George St, CBD", "t": "韩式Omakase", "r": "3", "p": 300, "pe": 0, "d": "龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷、南瓜籽挞", "i": "韩式Omakase，Matkim在韩语里就是Omakase的意思。主厨把韩国传统食物与创新做法结合，菜单随季节更换，秋季菜单共16道，用了很多韩国秋季食材。主菜牛肉和猪肉肠失手，其余小菜大多不错，龙虾疙瘩汤、海胆苔菜意面、紫菜虾刺身卷和南瓜籽挞印象最深。人均约300刀。", "dt": "2026-07-31", "c": "kr", "xy": [720.8, 568.6], "ne": "Matkim", "te": "Korean omakase", "de": "Lobster sujebi, uni seaweed pasta, prawn seaweed roll, pumpkin seed tart", "ie": "Korean omakase (matkim means omakase in Korean). The chef reinvents traditional Korean food with seasonal menus; the 16-course autumn menu uses Korean autumn produce. The beef and pork sausage mains missed, but most smaller dishes were good: lobster sujebi, uni seaweed pasta, prawn seaweed roll and pumpkin seed tart stood out. About $300 per person.", "ae": "George St, CBD"}, {"n": "Bar Bruno", "a": "York St, CBD", "t": "意大利菜", "r": "3", "p": 60, "pe": 1, "d": "炸虾、烤鸡、提拉米苏", "i": "新开不久的意大利餐厅，菜单不大，氛围小而精致，服务员带着浓浓的意大利口音。前菜炸虾好吃，主菜烤鸡很嫩，提拉米苏酒味稍淡但整体不错。值得回访把菜单吃一遍。", "dt": "2026-07-28", "c": "west", "xy": [736.7, 572.1], "ne": "Bar Bruno", "te": "Italian", "de": "Fried prawns, roast chicken, tiramisu", "ie": "New Italian with a short menu, intimate atmosphere and staff with strong Italian accents. Fried prawns are tasty, the roast chicken tender, and the tiramisu light on liquor but good. Worth returning to work through the menu.", "ae": "York St, CBD"}, {"n": "Social Butterfly Tea & Dessert", "a": "George St, CBD（Apple店隔壁二楼）", "t": "中式茶馆", "r": "2", "p": 22, "pe": 1, "d": "抹茶、提拉米苏、抹茶卷", "i": "市中心Apple Store隔壁二楼的中式茶馆，有茶、小蛋糕和中式点心，还有舒服的地台座位。落地飘窗可以俯瞰George St的车水马龙，很适合发呆。抹茶、提拉米苏和抹茶卷等餐点一般，主要为了环境而来。", "dt": "2026-07-28", "c": "cafe", "xy": [726.3, 557.4], "ne": "Social Butterfly Tea & Dessert", "te": "Chinese tea house", "de": "Matcha, tiramisu, matcha roll", "ie": "Chinese tea house upstairs next to the George St Apple Store, with tea, small cakes, Chinese snacks and comfy floor seating. Bay windows overlook George St traffic, perfect for daydreaming. The food is ordinary; come for the space.", "ae": "George St, CBD (upstairs next to Apple)"}, {"n": "Hayashi Teppanyaki", "a": "Castle Hill", "t": "铁板烧", "r": "2", "p": 60, "pe": 0, "d": "带子、大虾、鱿鱼", "i": "铁板烧餐厅，带子、大虾和鱿鱼不错，牛肉、鸡肉和炒饭一般。表演互动很热闹，接鸡蛋、接炒饭能让全桌开怀大笑，适合带长辈和小朋友来玩。人均约60刀，更贵的套餐不建议点。", "dt": "2026-07-28", "c": "jp", "xy": [178.5, 127.1], "ne": "Hayashi Teppanyaki", "te": "Teppanyaki", "de": "Scallops, prawns, squid", "ie": "Teppanyaki with good scallops, prawns and squid; the beef, chicken and fried rice are average. The show is fun, with egg and rice catching tricks that get the table laughing, good with grandparents and kids. About $60 per person; skip the pricier sets.", "ae": "Castle Hill"}, {"n": "Wonder Sushi", "a": "Norwest", "t": "旋转寿司", "r": "2", "p": 45, "pe": 0, "d": "Otoro、海胆、鹅肝、和牛寿司", "i": "Norwest湖边的旋转寿司，餐后可以在水边散步。食材相对高级，有Otoro、海胆、鹅肝和和牛，但味道普通，有点中看不中吃。人均约四五十刀。", "dt": "2026-07-27", "c": "jp", "xy": [84.2, 133.1], "ne": "Wonder Sushi", "te": "Sushi train", "de": "Otoro, uni, foie gras, wagyu sushi", "ie": "Sushi train by the Norwest lake, nice for a waterside walk after. Upmarket toppings like otoro, uni, foie gras and wagyu, but the flavour is ordinary, more looks than taste. About $40 to $50 per person.", "ae": "Norwest"}, {"n": "蜀香坊", "a": "Chatswood Interchange", "t": "川菜老店", "r": "5", "p": 40, "pe": 1, "d": "火爆双脆、二荆条炒猪脸肉、烧椒茄子、麻婆豆腐牛筋煲、炒笋干", "i": "Chatswood开了二十多年的川菜老店，出品稳定，还持续推出新菜。新菜火爆双脆和二荆条炒猪脸肉都很好吃，烧椒茄子、麻婆豆腐牛筋煲和炒笋干同样浓郁入味，是猛火爆炒的真功夫。", "dt": "2026-07-25", "c": "zh", "xy": [652.4, 340.5], "ne": "Shu Xiang Fang", "te": "Sichuan (established)", "de": "Sizzling double crunch, pork cheek with Erjingtiao chillies, roasted chilli eggplant, mapo tofu with beef tendon, bamboo shoots", "ie": "Chatswood Sichuan stalwart of over twenty years, consistent and still adding new dishes. The new sizzling double crunch and pork cheek with Erjingtiao chillies are excellent, and the roasted chilli eggplant, mapo tofu with beef tendon and stir-fried bamboo shoots are deep and bold, real high-heat wok cooking.", "ae": "Chatswood Interchange"}, {"n": "一鸣蒸汽石锅鱼", "a": "Eastwood", "t": "蒸汽石锅鱼", "r": "3", "p": 45, "pe": 1, "d": "石锅鱼，配鱼糕、冻豆腐、虾滑、响铃", "i": "Eastwood的蒸汽石锅鱼，煮好后是一锅奶白鱼汤，看着清淡，喝起来非常鲜，暖胃。先喝汤再吃鱼，鱼肉很嫩，之后把鱼糕、冻豆腐、虾滑和响铃放进去煮，冻豆腐和响铃最吸汤。调味台的虾片炸得很好，小朋友很爱。午市套餐78刀，晚市88刀，很划算。", "dt": "2026-07-23", "c": "zh", "xy": [389.3, 321.5], "ne": "Yiming Steam Stone Pot Fish", "te": "Steam stone pot fish", "de": "Stone pot fish with fish cake, frozen tofu, prawn paste, tofu skin rolls", "ie": "Steam stone pot fish in Eastwood: the fish cooks into a milky white broth that looks light but tastes very fresh and warming. Drink the soup, eat the tender fish, then cook fish cake, frozen tofu, prawn paste and tofu skin rolls in it; the tofu and rolls soak up the most. Kids love the prawn crackers at the sauce bar. Lunch set $78, dinner $88, great value.", "ae": "Eastwood"}, {"n": "雄起", "a": "Concord", "t": "川菜现炒", "r": "3", "p": 50, "pe": 0, "d": "豆花肥肠鱼、双椒牛肉、火爆腰花", "i": "现点现炒的川菜馆，不用预制菜，上菜较慢但值得等。豆花肥肠鱼一道菜四种食材，豆花嫩、肥肠香、鱼片弹、粉丝滑，各有滋味；双椒牛肉和火爆腰花也好吃。人均约50刀，份量大到能吃得很撑。", "dt": "2026-07-22", "c": "zh", "xy": [454.9, 529.6], "ne": "Xiongqi", "te": "Sichuan (wok-fried to order)", "de": "Tofu pudding with intestine and fish, double chilli beef, sizzling kidney", "ie": "Sichuan cooked to order with no pre-made dishes; slower service but worth the wait. The tofu pudding with intestine and fish combines silky tofu, rich intestine, bouncy fish and slippery glass noodles; double chilli beef and sizzling kidney are good too. About $50 per person, enough to leave very full.", "ae": "Concord"}, {"n": "味道云南 Impression of Yunnan Table", "a": "Ultimo", "t": "云南菜", "r": "3", "p": 36, "pe": 0, "d": "糟辣子炒脊肉筋、油淋干巴、百香果鱼片、薄荷炸排骨", "i": "开在蓝色小排屋里的云南菜，在悉尼比较少见。菜单选择多，百香果鱼片、橙皮辣子鸡、油淋干巴、菌菇焖饭、糟辣子炒脊肉筋、尖椒鹿茸菇和薄荷炸排骨都可以试，炒脊肉筋和油淋干巴最好吃。整体口味偏咸。人多建议早点到。人均约36刀。", "dt": "2026-07-20", "c": "zh", "xy": [702.2, 599.3], "ne": "Impression of Yunnan Table", "te": "Yunnan", "de": "Pork tendon with fermented chilli, crispy dried beef, passion fruit fish, mint fried ribs", "ie": "Yunnan restaurant in a little blue terrace, a rare cuisine in Sydney. Plenty to try: passion fruit fish, orange peel chilli chicken, crispy dried beef, mushroom rice, pork tendon with fermented chilli, deer antler mushrooms and mint fried ribs; the tendon and dried beef are best. Salty overall. Arrive early with a group. About $36 per person.", "ae": "Ultimo"}, {"n": "TRICO", "a": "Surry Hills", "t": "饭团", "r": "2", "p": 12, "pe": 1, "d": "拉面溏心蛋饭团", "i": "小小的饭团店，口味不多，造型可爱，有三角形明太子饭团、长方形午餐肉鸡蛋饭团和圆形拉面溏心蛋饭团。拉面溏心蛋比明太子好吃，午餐肉鸡蛋饭团少了紫苏叶，层次欠一点。午市套餐价格实惠。", "dt": "2026-07-18", "c": "jp", "xy": [731.4, 622.5], "ne": "TRICO", "te": "Onigiri", "de": "Ramen egg onigiri", "ie": "Tiny onigiri shop with few but cute options: triangle mentaiko, rectangular Spam and egg, and round ramen egg. The ramen egg beats the mentaiko; the Spam one lacks shiso. Lunch sets are cheap.", "ae": "Surry Hills"}, {"n": "Single O", "a": "Surry Hills", "t": "Cafe/Brunch", "r": "5", "p": 25, "pe": 0, "d": "Cold Brew、香蕉面包配Matcha Butter、牛油果太阳蛋吐司", "i": "人气极高的Cafe，周末不接受预订，常要排队近一小时，但值得等。门口标志性的水龙头供应Cold Brew。香蕉面包配抹茶黄油，抹茶的甘苦正好中和香蕉面包的甜腻；牛油果太阳蛋吐司的两颗蛋做得极好。人均约25刀，非常划算。", "dt": "2026-07-18", "c": "cafe", "xy": [747.2, 626.0], "ne": "Single O", "te": "Café / brunch", "de": "Cold brew, banana bread with matcha butter, avocado eggs on toast", "ie": "Hugely popular café with no weekend bookings; the wait can be nearly an hour but is worth it. Cold brew pours from the famous tap out front. Banana bread with matcha butter balances sweet and bitter perfectly, and the two fried eggs on avocado toast are superb. About $25 per person, excellent value.", "ae": "Surry Hills"}, {"n": "Quoi Dining", "a": "Baulkham Hills（Norwest水边）", "t": "法国Fine Dining", "r": "3", "p": 130, "pe": 0, "d": "Beef Tartare、鱼籽刺身挞、Pork Belly、安格斯牛排", "i": "Norwest湖边的法国Fine Dining，菜品有模有样。小食Beef Tartare和鱼籽刺身挞、前菜Pork Belly和意面、主菜安格斯牛排都不错，甜品一般可以不点。原价人均约130刀偏贵，用First Table优惠来吃非常划算。", "dt": "2026-07-18", "c": "west", "xy": [81.2, 130.3], "ne": "Quoi Dining", "te": "French fine dining", "de": "Beef tartare, roe tartlet, pork belly, Angus steak", "ie": "French fine dining by the Norwest lake with solid cooking: beef tartare and roe tartlet snacks, pork belly and pasta entrées, Angus steak main; skip dessert. About $130 per person at full price, so book with a First Table deal for great value.", "ae": "Baulkham Hills (Norwest lakeside)"}, {"n": "Hue coffee roasters", "a": "Crows Nest", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "Cold Brew、巴斯克", "i": "下北区新开的咖啡店，连招牌都没有，很低调。咖啡和巴斯克蛋糕最近很火，Cold Brew好喝；巴斯克外圈焦香，中间流心，奶味较浓。", "dt": "2026-07-18", "c": "cafe", "xy": [725.4, 425.3], "ne": "Hue coffee roasters", "te": "Coffee", "de": "Cold brew, Basque cheesecake", "ie": "New café on the lower North Shore with no sign at all. Its coffee and Basque cheesecake are trending: good cold brew, and a cheesecake with a caramelised edge and gooey, quite milky centre.", "ae": "Crows Nest"}, {"n": "Osteria di Russo & Russo", "a": "Enmore", "t": "意大利小酒馆", "r": "3", "p": 80, "pe": 1, "d": "前菜、意面、鸭胸、提拉米苏", "i": "Enmore的小众意大利酒馆，菜单简单但每道都很细致。前菜小巧有风味，意面在线，主菜鸭胸很嫩，甜品选提拉米苏。整体奶油用得多，奶味重，不喜欢奶制品的人要仔细挑菜。", "dt": "2026-07-18", "c": "west", "xy": [639.5, 665.4], "ne": "Osteria di Russo & Russo", "te": "Italian osteria", "de": "Small plates, pasta, duck breast, tiramisu", "ie": "Low-key Italian osteria in Enmore with a short but careful menu. Flavourful small plates, solid pasta, tender duck breast; choose tiramisu for dessert. Lots of cream overall, so dairy-averse diners should choose carefully.", "ae": "Enmore"}, {"n": "囍记大排档", "a": "Burwood", "t": "粤式大排档", "r": "3", "p": 60, "pe": 0, "d": "蒜蓉粉丝蒸生蚝、黑松露虾多士、手撕鸡、啫啫鲍鱼鸡煲、猪油渣炒芥蓝", "i": "粤式大排档，锅气足，食材新鲜，适合人多点一桌。特别推荐蒜蓉粉丝蒸生蚝、黑松露虾多士、招牌手撕鸡、啫啫鲍鱼鸡煲和猪油渣炒芥蓝。XO酱炒菜、蒸青衣和咕噜肉中等偏上，烤乳鸽火候过了。人均约60刀。", "dt": "2026-07-04", "c": "zh", "xy": [455.3, 582.8], "ne": "Hei Kee Dai Pai Dong", "te": "Cantonese dai pai dong", "de": "Garlic vermicelli steamed oysters, black truffle prawn toast, shredded chicken, sizzling abalone chicken pot, gai lan with pork crackling", "ie": "Cantonese dai pai dong with real wok heat and fresh ingredients, best with a group. Highlights: garlic vermicelli oysters, truffle prawn toast, signature shredded chicken, sizzling abalone chicken pot and gai lan with pork crackling. XO dishes, steamed parrotfish and sweet and sour pork are above average; the roast pigeon was overcooked. About $60 per person.", "ae": "Burwood"}, {"n": "冒丫冒菜 Dackie Maolatang", "a": "Macquarie Park", "t": "麻辣烫/麻辣拌", "r": "3", "p": 25, "pe": 0, "d": "番茄汤底麻辣烫、黏糊麻辣拌、炸肉丸子", "i": "麻辣烫和麻辣拌小店。番茄汤底的麻辣烫很受小朋友欢迎；黏糊麻辣拌名副其实，多加鞭炮笋，口感咯吱咯吱很解压。食材选择不多，但炸肉丸子很好吃，可以多拿几颗。人均约25刀。", "dt": "2026-07-04", "c": "zh", "xy": [491.9, 277.1], "ne": "Dackie Maolatang", "te": "Malatang / mala mixed", "de": "Tomato broth malatang, sticky mala mixed bowl, fried meatballs", "ie": "Small malatang and mala mixed bowl shop. Kids love the tomato broth malatang; the sticky mala mixed bowl lives up to its name, especially with crunchy bamboo shoots. Limited ingredients, but the fried meatballs are great, take extra. About $25 per person.", "ae": "Macquarie Park"}, {"n": "Gina Pasta Bar", "a": "Barangaroo", "t": "意大利菜", "r": "5", "p": 100, "pe": 0, "d": "炸墨鱼、火腿配哈密瓜、提拉米苏（夹巧克力碎）", "i": "Barangaroo临水的意大利餐厅，格调很好。前菜炸墨鱼和火腿配哈密瓜都好吃。提拉米苏是一绝，绵软浓郁，中间还夹着巧克力碎，赶时间的话可以跳过主菜直接吃甜品。人均约100刀。", "dt": "2026-07-01", "c": "west", "xy": [713.2, 545.0], "ne": "Gina Pasta Bar", "te": "Italian", "de": "Fried calamari, prosciutto with melon, tiramisu with chocolate shards", "ie": "Stylish waterfront Italian at Barangaroo. Fried calamari and prosciutto with melon are both great. The tiramisu is exceptional, soft and rich with chocolate shards inside; short on time, skip the main and go straight to dessert. About $100 per person.", "ae": "Barangaroo"}, {"n": "Itadakimasu Onigiri & Bar", "a": "Darlinghurst", "t": "饭团/居酒屋", "r": "2", "p": 40, "pe": 0, "d": "Kimchi Salmon Tartare、带子刺身、牛排", "i": "Sandoichi隔壁的姐妹店，主打饭团，店很小，只有约10个座位，吧台位可以看到饭团制作过程。和牛、鳗鱼、炸虾和烤带子饭团都很普通，反而配菜出色，Kimchi Salmon Tartare、带子刺身和牛排比不少居酒屋还好吃。人均约40刀。", "dt": "2026-06-30", "c": "jp", "xy": [762.2, 590.0], "ne": "Itadakimasu Onigiri & Bar", "te": "Onigiri / izakaya", "de": "Kimchi salmon tartare, scallop sashimi, steak", "ie": "Onigiri sister shop next to Sandoichi, tiny with about 10 seats; the counter lets you watch the onigiri being made. The wagyu, eel, prawn and scallop onigiri are ordinary, but the sides shine: kimchi salmon tartare, scallop sashimi and steak beat many izakayas. About $40 per person.", "ae": "Darlinghurst"}, {"n": "MLK Deli", "a": "Surry Hills", "t": "意式三明治", "r": "3", "p": 20, "pe": 0, "d": "The MLK（开心果酱、火腿、橄榄）", "i": "蓝色小房子里的意式三明治店，外观可爱。同名招牌The MLK是开心果酱、火腿和橄榄，面包松软，非常香。一份二十多刀看着不便宜，但份量够分两顿吃。", "dt": "2026-06-29", "c": "west", "xy": [736.9, 611.3], "ne": "MLK Deli", "te": "Italian sandwiches", "de": "The MLK (pistachio cream, ham, olives)", "ie": "Italian sandwich shop in a cute blue house. The namesake MLK with pistachio cream, ham and olives on soft bread is very tasty. Twenty-something dollars seems steep, but it is big enough for two meals.", "ae": "Surry Hills"}, {"n": "明叔 Uncle Ming's", "a": "York St, CBD", "t": "地下酒吧", "r": "3", "p": 45, "pe": 1, "d": "鸡尾酒", "i": "开了很多年的地下酒吧，红色灯光配中式摆件，风格诡异阴森，但人声鼎沸，气氛热闹。鸡尾酒好喝。胆小的人慎入，喜欢及时行乐的可以来。", "dt": "2026-06-29", "c": "bar", "xy": [723.9, 576.9], "ne": "Uncle Ming's", "te": "Basement bar", "de": "Cocktails", "ie": "Long-running basement bar with red lighting and Chinese décor, spooky in style but buzzing with people. Good cocktails. Not for the faint-hearted, great for those who like to party.", "ae": "York St, CBD"}, {"n": "Bar Conte", "a": "Clarence St, CBD", "t": "意大利菜", "r": "4", "p": 130, "pe": 0, "d": "小章鱼配佛卡夏、牛排、鸭肉、可颂味鸡尾酒", "i": "起家于Surry Hills的意大利餐厅在市中心开的分店，像旧时代的歌舞厅，掀开红丝绒门帘，满屋暧昧灯光和戏剧感的墙画。前菜小章鱼的酱汁拿来蘸佛卡夏非常好吃；主菜牛排和鸭肉都出色；有一款喝起来带可颂味的鸡尾酒很特别。人均约130刀，周末有附加费。", "dt": "2026-06-29", "c": "west", "xy": [739.9, 563.2], "ne": "Bar Conte", "te": "Italian", "de": "Baby octopus with focaccia, steak, duck, croissant-flavoured cocktail", "ie": "CBD outpost of the Surry Hills Italian, like an old-time cabaret: behind red velvet curtains are moody lights and dramatic murals. The baby octopus sauce is perfect for dipping focaccia; steak and duck mains are excellent; one cocktail tastes like croissant. About $130 per person, weekend surcharge.", "ae": "Clarence St, CBD"}, {"n": "Daruma Dumplings Beer House 不倒翁台式熱炒", "a": "Strathfield", "t": "台式热炒", "r": "5", "p": 40, "pe": 1, "d": "沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉、盐酥鸡、老式芋泥蛋糕", "i": "很有台湾味的台式热炒店，锅气扑面，九层塔香气满屋，服务员用台湾腔喊单，非常适合下班放松。沙茶鱼头锅、卤肉饭、樱花虾炒空心菜、月亮虾饼、豆干小炒咸猪肉和盐酥鸡都好吃，甜品老式芋泥蛋糕更是一绝。台湾大厨手法利落，服务员热情爱聊天，整家店很有温度。", "dt": "2026-06-27", "c": "zh", "xy": [431.6, 579.9], "ne": "Daruma Dumplings Beer House", "te": "Taiwanese stir-fry", "de": "Satay fish head pot, braised pork rice, sakura shrimp morning glory, moon prawn cake, tofu with salted pork, popcorn chicken, old-style taro cake", "ie": "Truly Taiwanese stir-fry house with roaring woks, Thai basil in the air and orders called in a Taiwanese accent, perfect for after-work unwinding. Satay fish head pot, braised pork rice, sakura shrimp morning glory, moon prawn cake, dried tofu with salted pork and popcorn chicken are all great, and the old-style taro cake is outstanding. Deft Taiwanese chefs and chatty, warm staff.", "ae": "Strathfield"}, {"n": "Eastwood Table", "a": "Eastwood", "t": "韩式猪排", "r": "3", "p": 30, "pe": 0, "d": "猪排拼盘、芝士猪排、辣豆腐面条汤", "i": "Eastwood火车站出来、韩国街口不到20米的新开猪排店，近来人气很旺。入座先送一碗奶油汤。猪排拼盘份量很大，韩式猪排薄而嫩，芝士猪排可以拉丝，小朋友会喜欢；偏爱厚切日式猪排的人可能不太习惯。辣豆腐面条汤更出色，豆腐嫩滑入味，牛肉给得大方。店小常满座，人均约30刀。", "dt": "2026-06-27", "c": "kr", "xy": [405.1, 325.0], "ne": "Eastwood Table", "te": "Korean pork cutlet", "de": "Pork cutlet platter, cheese cutlet, spicy tofu noodle soup", "ie": "New pork cutlet shop less than 20 m from Eastwood station into Korean Street, recently very popular. A complimentary cream soup to start. The cutlet platter is huge; thin Korean cutlets are tender and the cheese one stretches, great for kids, though thick Japanese katsu fans may miss that style. The spicy tofu noodle soup is even better, silky tofu and generous beef. Small and often full, about $30 per person.", "ae": "Eastwood"}, {"n": "ESQ Bar + Dining", "a": "QVB（Tea Room正下方）", "t": "西餐", "r": "4", "p": 70, "pe": 0, "d": "刺身、烤大虾、鸭胸、牛排、烤童子鸡", "i": "QVB Tea Room正下方的西餐厅，圆拱落地窗非常漂亮，冬日阳光洒进来很有氛围。前菜刺身和烤大虾不错，主菜鸭胸、牛排和烤童子鸡都很出色，肉质嫩，入味浓郁，做肉很拿手。商务、聚会和约会都合适，不喝酒人均约70刀。", "dt": "2026-06-26", "c": "west", "xy": [728.9, 576.7], "ne": "ESQ Bar + Dining", "te": "Western", "de": "Sashimi, grilled king prawns, duck breast, steak, spatchcock", "ie": "Restaurant directly beneath the QVB Tea Room with gorgeous arched windows and lovely winter light. Sashimi and grilled prawns are good; the duck breast, steak and spatchcock mains are excellent, tender and well seasoned. Good for business, friends or dates; about $70 per person without drinks.", "ae": "QVB (below the Tea Room)"}, {"n": "Sofé Bakery", "a": "Wahroonga", "t": "韩式烘焙", "r": "3", "p": 12, "pe": 1, "d": "抹茶巧克力可颂、蛋挞、Cold Brew Latte", "i": "Wahroonga火车站出来一分钟的韩式烘焙店。人气抹茶巧克力可颂酥到掉渣，略甜，配Cold Brew Latte刚好；蛋挞也不错。据熟客说，店里的咸口面包更好吃。", "dt": "2026-06-26", "c": "bake", "xy": [492.1, 88.7], "ne": "Sofé Bakery", "te": "Korean bakery", "de": "Matcha chocolate croissant, egg tart, cold brew latte", "ie": "Korean bakery one minute from Wahroonga station. The popular matcha chocolate croissant shatters as you bite, a bit sweet but perfect with a cold brew latte; good egg tarts too. Regulars say the savoury breads are even better.", "ae": "Wahroonga"}, {"n": "小湖南 Little Hunan", "a": "Chatswood Interchange", "t": "湘菜", "r": "3", "p": 40, "pe": 1, "d": "小炒黄牛肉、农家一碗香、腰肝合炒、长沙炒粉", "i": "开在Chatswood火车站楼上Interchange的湘菜馆，可以选小辣，辣度友好。菜式重口下饭、偏咸。小炒黄牛肉、农家一碗香、腰肝合炒和长沙炒粉都好吃；酸豆角炒鸡胗太咸，腌笋腊肉的腊肉一般。", "dt": "2026-06-24", "c": "zh", "xy": [668.3, 344.0], "ne": "Little Hunan", "te": "Hunanese", "de": "Stir-fried yellow beef, farmhouse bowl, kidney and liver stir-fry, Changsha fried noodles", "ie": "Hunanese restaurant in the Chatswood Interchange above the station, with a mild option that is easy on spice novices. Bold, salty, rice-friendly food. Yellow beef, farmhouse bowl, kidney and liver and Changsha fried noodles are good; the pickled bean gizzards are too salty and the cured pork is average.", "ae": "Chatswood Interchange"}, {"n": "Wooden Bowl Hamjibak", "a": "West Ryde", "t": "韩式中华料理", "r": "3", "p": 20, "pe": 0, "d": "60刀套餐：糖醋肉、炸酱面、海鲜汤面", "i": "韩式中华料理，以糖醋肉加炸酱面的组合为特色。60刀套餐有糖醋猪肉、炸酱面和海鲜汤面，够三个人吃饱。糖醋肉用纯瘦肉，炸得酥嫩；两款面都很好吃。人均约20刀，非常划算。", "dt": "2026-06-21", "c": "kr", "xy": [418.0, 364.8], "ne": "Wooden Bowl Hamjibak", "te": "Korean-Chinese", "de": "$60 set: sweet and sour pork, jjajangmyeon, seafood noodle soup", "ie": "Korean-Chinese spot known for the sweet and sour pork plus black bean noodle combo. The $60 set of sweet and sour pork, jjajangmyeon and seafood noodle soup feeds three. Lean pork fried crisp and tender; both noodles are great. About $20 per person, excellent value.", "ae": "West Ryde"}, {"n": "山嘢贵州家菜 Ye Mama's Kitchen", "a": "Chatswood", "t": "贵州菜", "r": "3", "p": 50, "pe": 0, "d": "凉拌米皮、辣子鸡、爆炒猪背筋、酸菜炒黑芝麻汤圆", "i": "贵州家常菜，辣度很高，凉拌米皮和辣子鸡尤其辣。炝锅鱼不太辣，外皮酥脆但内里不够入味。爆炒猪背筋又韧又弹牙，很精彩；鹿茸菇同样做法，两道都香但偏油。酸菜炒黑芝麻汤圆是一道奇特菜，又酸又辣又咸甜，意外地不违和。人均约50刀。", "dt": "2026-06-20", "c": "zh", "xy": [657.9, 329.3], "ne": "Ye Mama's Kitchen", "te": "Guizhou", "de": "Cold rice sheet salad, chilli chicken, stir-fried pork back tendon, glutinous rice balls with pickled greens", "ie": "Guizhou home cooking, very spicy, especially the rice sheet salad and chilli chicken. The fish is mild with crisp skin but under-seasoned inside. Pork back tendon is chewy and bouncy, superb; the mushrooms done the same way are fragrant but oily. Black sesame rice balls stir-fried with pickled greens are a strange but surprisingly good sweet, sour, salty and spicy dish. About $50 per person.", "ae": "Chatswood"}, {"n": "江西味道 Jiangxi Flavour", "a": "Burwood", "t": "江西菜", "r": "4", "p": 40, "pe": 1, "d": "江西炒粉、辣炒鳝鱼、笋干炒肉、瓦罐汤", "i": "锅气很足的江西菜，全店只有老板一个人做饭、上菜、收银和清洁，出品却很稳定。江西炒粉Q弹微辣，酱香和蛋香融合得好；辣炒鳝鱼很嫩，但辣度很高，不太能吃辣的人慎点；笋干炒肉脆而有嚼劲，吸满油香；瓦罐汤清甜不油，是慢慢煨出来的味道。", "dt": "2026-06-19", "c": "zh", "xy": [452.9, 602.2], "ne": "Jiangxi Flavour", "te": "Jiangxi", "de": "Jiangxi fried rice noodles, spicy stir-fried eel, pork with dried bamboo shoots, clay jar soup", "ie": "Jiangxi food with serious wok heat, run entirely by the owner who cooks, serves, takes payment and cleans, yet output is consistent. Jiangxi fried noodles are bouncy and mildly spicy; spicy eel is tender but very hot; pork with dried bamboo shoots is crunchy and savoury; the slow-simmered clay jar soup is clear and sweet.", "ae": "Burwood"}, {"n": "潮运莱", "a": "Chinatown", "t": "潮州菜", "r": "2", "p": 40, "pe": 1, "d": "普宁豆腐、砂锅粥（需等40分钟）", "i": "潮州菜馆，整体刚过及格线。普宁炸豆腐好吃；炒粿条味道不错但粿条本身一般；鱼饭清爽；砂锅粥要等约40分钟，味道可以。卤水略带苦味，蚝烙不够正宗，生腌三文鱼蒜味太重盖过鱼味。相比之下福记更稳。", "dt": "2026-06-18", "c": "zh", "xy": [721.6, 604.7], "ne": "Chao Yun Lai", "te": "Teochew", "de": "Puning fried tofu, claypot congee (40 minute wait)", "ie": "Teochew restaurant that only just passes. Puning fried tofu is good; the fried kway teow is tasty but the noodles themselves are ordinary; fish rice is clean; claypot congee takes about 40 minutes and is decent. The braise is slightly bitter, the oyster omelette not authentic, and the raw marinated salmon drowned in garlic. Fook Kee is more reliable.", "ae": "Chinatown"}, {"n": "KIKI Dessert", "a": "Ultimo（Central去UTS路上小巷）", "t": "Cafe/蛋糕", "r": "3", "p": 22, "pe": 1, "d": "巧克力蛋糕配Cold Brew", "i": "藏在Central去UTS路上麦当劳旁小巷里的小Cafe，很有情调。后厨开放，蛋糕应该是店里现做的。巧克力蛋糕配Cold Brew很搭，店里还有一些可爱的书可以翻看。位置难找，但值得来。", "dt": "2026-06-18", "c": "cafe", "xy": [705.8, 607.9], "ne": "KIKI Dessert", "te": "Café / cakes", "de": "Chocolate cake with cold brew", "ie": "Charming little café hidden in a lane beside McDonald's on the way from Central to UTS. Open kitchen, cakes seemingly made in house. Chocolate cake with cold brew is a great pair, and there are lovely books to browse. Hard to find but worth it.", "ae": "Ultimo (laneway from Central to UTS)"}, {"n": "Modo Mio", "a": "Castle Hill", "t": "意大利菜", "r": "3", "p": 75, "pe": 0, "d": "Puff Bread、炸海鲜、Beef Tartare、蛤蜊珍珠面、提拉米苏", "i": "山区有点小Fine Dining感觉的意大利餐厅。前菜Puff Bread、炸海鲜和Beef Tartare都很好吃。主菜稍普通，牛排不够香嫩，蛤蜊珍珠面浓郁好吃，蟹肉意面一般。提拉米苏非常出色，软绵湿润。人均约75刀。", "dt": "2026-06-15", "c": "west", "xy": [182.1, 135.7], "ne": "Modo Mio", "te": "Italian", "de": "Puff bread, fried seafood, beef tartare, clam fregola, tiramisu", "ie": "Italian in the Hills with a touch of fine dining. Puff bread, fried seafood and beef tartare are great starters. Mains are weaker: the steak lacks flavour, the clam fregola is rich and good, the crab pasta average. The tiramisu is excellent, soft and moist. About $75 per person.", "ae": "Castle Hill"}, {"n": "Costi's Fresh Seafood", "a": "Castle Tower（Castle Hill）", "t": "海鲜零售", "r": "4", "p": 30, "pe": 1, "d": "Premium Yamba Cooked Tiger虾（约45刀每公斤）、生蚝、Otoro、Salmon Belly", "i": "Castle Hill一带有名的海鲜店，极其新鲜。推荐Premium Yamba Cooked Tiger熟虾，约45刀一公斤，虾肉弹牙、海味浓郁。刺身同样出色，生蚝、Otoro和Salmon Belly都值得买回家配意面或下酒。", "dt": "2026-06-14", "c": "west", "xy": [185.9, 124.3], "ne": "Costi's Fresh Seafood", "te": "Seafood retail", "de": "Premium Yamba cooked tiger prawns (about $45/kg), oysters, otoro, salmon belly", "ie": "Well-known Hills seafood shop with superb freshness. The Premium Yamba cooked tiger prawns, about $45 a kilo, are bouncy and full of ocean flavour. Sashimi is excellent too: oysters, otoro and salmon belly are perfect to take home with pasta or drinks.", "ae": "Castle Tower（Castle Hill）"}, {"n": "Freo", "a": "St Leonards", "t": "酸奶冰淇淋/烘焙", "r": "5", "p": 9, "pe": 1, "d": "抹茶、奶茶、巧克力、海盐开心果四味mix；海盐面包、巧克力曲奇", "i": "悉尼二帽餐厅Lumi Dining主厨在St Leonards开的酸奶冰淇淋旗舰店，店面很大，除酸奶冰淇淋外还有每日现烤的Pastry。酸奶口味有十几种，包括门店限定款，抹茶、奶茶、巧克力和海盐开心果混在一起最好吃。配料台选择多得惊人，有新鲜水果、麻薯、饼干、花生酱、开心果酱，还有巧克力酱和抹茶酱的水龙头。海盐面包、巧克力曲奇、斑斓椰子水和草莓苏打也都不错，还有Brunch。", "dt": "2026-06-14", "c": "bake", "xy": [697.4, 421.4], "ne": "Freo", "te": "Frozen yoghurt / bakery", "de": "Matcha, milk tea, chocolate and sea salt pistachio mix; sea salt bread, chocolate cookie", "ie": "St Leonards flagship froyo shop from the chef of two-hatted Lumi Dining, huge and with daily baked pastries. A dozen-plus yoghurt flavours including store exclusives; matcha, milk tea, chocolate and sea salt pistachio mixed together is best. The topping bar is astonishing: fresh fruit, mochi, biscuits, peanut and pistachio sauces, even chocolate and matcha sauce taps. Sea salt bread, cookies, pandan coconut water and strawberry soda are good, and there is brunch too.", "ae": "St Leonards"}, {"n": "喜凤台 East Phoenix", "a": "Zetland（East Village）", "t": "粤式早茶", "r": "3", "p": 35, "pe": 0, "d": "推车点心、XO Pipi、避风塘炒蟹", "i": "出品稳定的粤式早茶酒楼，周末中午点心推车一圈圈来，选择很多。点心车上甚至有XO酱炒Pipi和避风塘炒蟹，XO Pipi很好吃，剩下的XO酱可以拌炒面。人均约35刀就能吃得很饱。", "dt": "2026-06-13", "c": "zh", "xy": [728.5, 681.7], "ne": "East Phoenix", "te": "Cantonese yum cha", "de": "Trolley dim sum, XO pipis, typhoon shelter crab", "ie": "Consistent Cantonese yum cha with trolleys constantly circling at weekend lunch. The carts even carry XO pipis and typhoon shelter crab; the XO pipis are great and the leftover sauce is perfect on fried noodles. About $35 per person for a full meal.", "ae": "Zetland（East Village）"}, {"n": "Oshu Japanese Restaurant", "a": "West Ryde", "t": "日料", "r": "2", "p": 60, "pe": 0, "d": "寿司刺身拼盘、拉面", "i": "韩国人开的日料店，味道不错。寿司刺身拼盘用木制阶梯摆盘，很有特色。拉面汤底不是熬出来的，但吃完冷寿司后来一碗热汤面很舒服。价格偏高，人均约60刀。", "dt": "2026-06-09", "c": "jp", "xy": [421.6, 373.4], "ne": "Oshu Japanese Restaurant", "te": "Japanese", "de": "Sushi and sashimi platter, ramen", "ie": "Korean-run Japanese restaurant with good food. The sushi and sashimi platter is served on a wooden staircase. The ramen broth is not house-made, but a hot bowl after cold sushi is comforting. Pricey, about $60 per person.", "ae": "West Ryde"}, {"n": "Fresh Delight Bakery & Cafe", "a": "West Ryde", "t": "越南包", "r": "2", "p": 11, "pe": 0, "d": "烧肉越南包", "i": "开在Woolworths停车场旁的越南包店，11刀一个，烧肉和蔬菜给得满满的，一个就够一顿。缺点是烧肉的皮不脆。适合想快速解决一餐时买，越南包爱好者不必专程。", "dt": "2026-06-09", "c": "asia", "xy": [425.4, 361.9], "ne": "Fresh Delight Bakery & Cafe", "te": "Banh mi", "de": "Roast pork banh mi", "ie": "Banh mi shop by a Woolworths car park, $11 each and stuffed with roast pork and salad, a meal in itself. Downside: the pork crackling is not crisp. Fine for a quick meal, not a destination for banh mi fans.", "ae": "West Ryde"}, {"n": "The Chairman 湖南人湘菜馆", "a": "Botany", "t": "湘菜", "r": "2", "p": 35, "pe": 0, "d": "烟笋腊肉、粉蒸肉、青椒茄子、湖南牛肉粉", "i": "开了很多年的湘菜馆，锅气足，很下饭。可惜肉质一般，野山椒牛肉和湖南小炒肉都偏柴；烟笋腊肉、粉蒸肉和青椒茄子不错。湖南牛肉粉是宽条，和一甲一嗦的细粉不同。人均约35刀很划算，住得近可以来，远的话可去可不去。", "dt": "2026-06-08", "c": "zh", "xy": [700.0, 811.2], "ne": "The Chairman", "te": "Hunanese", "de": "Smoked bamboo shoots with cured pork, steamed rice-coated pork, green chilli eggplant, Hunan beef rice noodles", "ie": "Long-standing Hunanese restaurant with good wok heat and rice-friendly food. The meat is a weak point: wild chilli beef and Hunan stir-fried pork are dry, while smoked bamboo with cured pork, steamed rice-coated pork and chilli eggplant are good. The beef rice noodles are wide, unlike the thin Changsha style. About $35 per person; worth it if nearby.", "ae": "Botany"}, {"n": "Norimono", "a": "Crows Nest", "t": "日式手卷", "r": "2", "p": 90, "pe": 0, "d": "和牛鹅肝卷、XO带子卷、长腿蟹卷、茶碗蒸", "i": "板前现做手卷的日料店，形式像Omakase但不是Omakase。手卷有传统、创新和Premium几十种口味，和牛鹅肝卷、XO带子卷、长腿蟹卷和茶碗蒸都好吃。人均约90刀还吃不饱，想吃饱大概每人还要多花约50刀。", "dt": "2026-06-08", "c": "jp", "xy": [712.9, 432.4], "ne": "Norimono", "te": "Japanese hand rolls", "de": "Wagyu foie gras roll, XO scallop roll, king crab roll, chawanmushi", "ie": "Hand roll bar made at the counter, omakase in style but not format. Dozens of traditional, creative and premium rolls; wagyu foie gras, XO scallop, king crab and the chawanmushi are good. About $90 per person still leaves you hungry; expect roughly $50 more each to be full.", "ae": "Crows Nest"}, {"n": "Manon The Room", "a": "Chatswood Chase", "t": "英式茶室", "r": "3", "p": 30, "pe": 0, "d": "早餐", "i": "Chatswood Chase里的英式茶室，和QVB Tea Room是同一家族的姐妹店。低调的木质装潢配闪亮银器茶具，很有复古感。早餐菜单简单美味，是Chatswood少有的有档次的Cafe。人均约30刀。", "dt": "2026-06-04", "c": "cafe", "xy": [655.5, 348.7], "ne": "Manon The Room", "te": "English tea room", "de": "Breakfast", "ie": "English-style tea room in Chatswood Chase, a sister of the QVB Tea Room. Understated timber and gleaming silver tea sets give a vintage feel. A simple, tasty breakfast menu; one of Chatswood's few upmarket cafés. About $30 per person.", "ae": "Chatswood Chase"}, {"n": "Jamaican Patty Bakehouse", "a": "Glebe", "t": "牙买加肉饼", "r": "3", "p": 12, "pe": 1, "d": "牙买加BBQ鸡肉馅肉饼", "i": "Glebe Point Rd上卖牙买加肉饼的小店。金黄外皮是一碰就掉渣的酥皮，内馅有鸡肉、牛肉和蔬菜等口味，牙买加特色BBQ鸡肉馅味道特别浓郁，小朋友也爱吃。", "dt": "2026-06-04", "c": "asia", "xy": [674.2, 604.7], "ne": "Jamaican Patty Bakehouse", "te": "Jamaican patties", "de": "Jamaican BBQ chicken patty", "ie": "Little Jamaican patty shop on Glebe Point Rd. Golden, flaky pastry that shatters at a touch, with chicken, beef or vegetable fillings; the Jamaican BBQ chicken is especially rich and kids love it.", "ae": "Glebe"}, {"n": "The Wedge", "a": "Glebe", "t": "咖啡", "r": "3", "p": 20, "pe": 0, "d": "巧克力蛋糕配Long Black", "i": "简单的街角咖啡店，临窗位置可以看街景，适合一个人安静地喝下午茶。巧克力蛋糕是沙沙的口感，很甜，配很苦的Long Black反而出奇地好吃。约20刀。", "dt": "2026-06-04", "c": "cafe", "xy": [678.0, 593.2], "ne": "The Wedge", "te": "Coffee", "de": "Chocolate cake with long black", "ie": "Simple corn almon tartare and steak are excellent; the ramen broth is not house-made and tempura slightly oily, but no big deal. About $50 per person.", "ae": "Wentworth Point"}, {"n": "MANI Restaurant", "a": "Sydney Fish Market", "t": "海鲜/中式融合", "r": "3", "p": 70, "pe": 1, "d": "三文鱼生腌、XO Pipi配苔条粢饭糕、香辣昆士兰小龙虾", "i": "新鱼市里的海鲜餐厅，口碑是又贵又好吃。菜式融合了上海菜的精致、广东菜的手法和一点川味。三文鱼生腌清爽开胃；XO Pipi底下铺着苔条粢饭糕，非常搭。重头戏是昆士兰小龙虾，下锅前先拿活虾给客人看，个头可能是悉尼最大，肉质紧实，香辣口味相当辣，拌饭吃很满足。很适合带长辈来鱼市时吃一顿好的。", "dt": "2026-05-31", "c": "zh", "xy": [681.2, 577.1], "ne": "MANI Restaurant", "te": "Seafood / Chinese fusion", "de": "Marinated raw salmon, XO pipis on seaweed rice cake, spicy Queensland crayfish", "ie": "Seafood restaurant in the new Fish Market, known as pricey but delicious, blending Shanghainese finesse, Cantonese technique and a hint of Sichuan. Marinated raw salmon is fresh; XO pipis sit on seaweed rice cake, a great match. The star is Queensland crayfish, shown live before cooking, possibly Sydney's largest, firm and fiery in the spicy style, great over rice. Ideal for a good meal with older relatives on a market trip.", "ae": "Sydney Fish Market"}, {"n": "iisho", "a": "CBD", "t": "抹茶软雪糕", "r": "3", "p": 9, "pe": 1, "d": "抹茶软雪糕", "i": "市中心的抹茶软雪糕店，抹茶味浓郁，很好吃。", "dt": "2026-05-28", "c": "bake", "xy": [717.5, 562.5], "ne": "iisho", "te": "Matcha soft serve", "de": "Matcha soft serve", "ie": "CBD matcha soft serve shop with intense, delicious matcha.", "ae": "CBD"}, {"n": "诚 Makoto Sushi Bar", "a": "World Square", "t": "寿司", "r": "2", "p": 120, "pe": 1, "d": "寿司、手卷", "i": "悉尼的老牌寿司店，食材新鲜但口味普通，已不如当年出众。曾在三文鱼手卷里吃到长鱼刺，店家诚恳道歉并免了该单。如今悉尼好吃的寿司店太多，不太值得专程来。", "dt": "2026-05-26", "c": "jp", "xy": [725.4, 593.2], "ne": "Makoto Sushi Bar", "te": "Sushi", "de": "Sushi, hand rolls", "ie": "Old-school Sydney sushi bar, fresh but now ordinary. A long fish bone once turned up in a salmon hand roll; staff apologised sincerely and waived it. With so many good sushi places now, not worth a special trip.", "ae": "World Square"}, {"n": "Radio greasy, hard to find anywhere in Australia. The duck with chives is well seasoned, and soy crab with rice and steamed egg make great sides. Highly recommended.", "ae": "Homebush"}, {"n": "Dubudang 두부당", "a": "Epping", "t": "韩国豆腐店", "r": "3", "p": 45, "pe": 0, "d": "海鲜豆腐汤、泡菜炒猪肉配白豆腐、紫苏油煎豆腐", "i": "Eastwood和Epping一带近来很火的韩国豆腐店，饭点要排队，错峰就不用。豆腐是粗糙有料的口感，和常见的嫩豆腐不同，配上韩式重口酱料效果极好。推荐海鲜豆腐汤、泡菜炒猪肉配白豆腐和紫苏油煎豆腐。不特别爱豆腐的人不必专程，但能把普通食材做到极致很值得敬佩。人均约45刀。", "dt": "2026-05-23", "c": "kr", "xy": [400.0, 263.0], "ne": "Dubudang", "te": "Korean tofu house", "de": "Seafood tofu stew, kimchi pork with tofu, perilla oil pan-fried tofu", "ie": "Korean tofu house trending around Eastwood and Epping; queues at peak times, none off-peak. The tofu is coarse and hearty rather than silky and pairs brilliantly with bold Korean sauces. Try the seafood tofu stew, kimchi pork with tofu and perilla oil tofu. Not a must for non-tofu fans, but admirable craft. About $45 per person.", "ae": "Epping"}, {"n": "Bakery 101", "a": "Eastwood", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "巧克力包、蝴蝶酥、火腿芝士牛角包", "i": "Eastwood韩国街新开的面包店，大红色店面大气洋气。店小但品类很多，巧克力包、蝴蝶酥和现烤火腿芝士牛角包都好吃，只是不算惊艳。可以坐下喝杯咖啡，Panini也值得一试。", "dt": "2026-05-21", "c": "bake", "xy": [408.3, 316.0], "ne": "Bakery 101", "te": "Bakery", "de": "Chocolate bun, palmier, ham and cheese croissant", "ie": "New bakery on Eastwood's Korean street with a bold red shopfront. Small but with lots of choice; chocolate buns, palmiers and freshly baked ham cheese croissants are good if not amazing. Sit down for a coffee; the panini are worth a try.", "ae": "Eastwood"}, {"n": "妈妈小厨 Mama's Wok", "a": "Rhodes Waterside", "t": "家常小炒", "r": "3", "p": 40, "pe": 0, "d": "盐焗鸡、茄子焖脆皖、炒花菜", "i": "评价褒贬不一的家常小炒馆，苍蝇馆子风格，上菜快。盐焗鸡、茄子焖脆肉鲩和炒花菜都很下饭，茄子做得尤其好。人均约40刀能吃很饱，饭后可以去隔壁Urban Jungle买杯咖啡。", "dt": "2026-05-21", "c": "zh", "xy": [420.9, 448.6], "ne": "Mama's Wok", "te": "Home-style stir-fry", "de": "Salt-baked chicken, eggplant with crisp grass carp, stir-fried cauliflower", "ie": "Divisive home-style e": "Bar / coffee", "de": "Black coffee", "ie": "Bar that also serves coffee by day, a bright yellow space; black coffee in a bar has its own charm.", "ae": "Castlereagh St, CBD"}, {"n": "Lee Ho Fook 利口福", "a": "Castlereagh St, CBD", "t": "中餐", "r": "5", "p": 100, "pe": 0, "d": "海胆虾多士、清蒸牙鱼配豆腐、鸭子", "i": "从墨尔本开到悉尼的澳式中餐，悉尼店获评两帽，是少数做得好的澳式中餐，有融合元素，但口味很中国。虾多士把虾胶塞进面包里，配蒜苗、咸蛋黄和牛油做的酱，咸香好吃，上面再放海胆。北京鸭经过10天熟成，皮下油脂去尽，皮脆肉嫩，几乎没有鸭骚味，配自制梅子酱，荷叶饼放凉也不会变硬。蟹肉带子XO酱福建炒饭比大多数粤菜馆做得好，虾干和瑶柱香味突出。清蒸牙鱼嫩得像豆腐。姜葱蒸鳕鱼偏西式，想吃中式蒸鱼不要点；甜品也不推荐。人均约100刀。", "dt": "2026-05-16", "c": "zh", "xy": [716.6, 574.3], "ne": "Lee Ho Fook", "te": "Chinese", "de": "Prawn toast with uni, 10-day aged Peking duck, crab and scallop XO Fujian fried rice, steamed toothfish", "ie": "Australian-Chinese from Melbourne, its Sydney store now two-hatted, a rare Aussie-Chinese place that works, with fusion touches but Chinese flavour. Prawn mousse is stuffed inside the toast and topped with uni, with a garlic shoot, salted egg and butter cream. Peking duck is aged 10 days: fat rendered, crisp skin, tender meat, no gaminess, with house plum sauce and pancakes that stay soft when cool. Crab and scallop XO fried rice beats most Cantonese restaurants. Steamed toothfish is tofu-soft. The ginger scallion cod is Western in style, and desserts are best skipped. About $100 per person.", "ae": "Castlereagh St, CBD"}, {"n": "Chinatown Country Club", "a": "Clarence St, CBD", "t": "咖啡/服装店", "r": "3", "p": 12, "pe": 1, "d": "月亮河（Cold Brew加枫糖奶盖）", "i": "QVB附近的服装店加咖啡店，空间宽敞，适合悠闲地坐着喝咖啡，也有不少人在这里用电脑。招牌月亮河是Cold Brew加枫糖奶盖，清甜爽口。服装陈列很好看。", "dt": "2026-05-16", "c": "cafe", "xy": [743.5, 570.4], "ne": "Chinatown Country Club", "te": "Coffee / fashion store", "de": "Moon River (cold brew with maple cream)", "ie": "Clothing store plus café near the QVB, spacious and relaxed, with many people on laptops. The signature Moon River is cold brew with maple cream, light and refreshing. The clothing displays are lovely.", "ae": "Clarence St, CBD"}, {"n": "Caness", "a": t and rich. About $45 for two dishes.", "ae": "McMahons Point"}, {"n": "Le Rooftop", "a": "McMahons Point", "t": "韩国女生开的小酒馆", "r": "2", "p": 50, "pe": 0, "d": "炸菜花、牛排", "i": "北悉尼往海湾路上一位韩国女生开的小酒馆，很有情调，红木门旁的临街座位很惬意。食物中等偏上：炸菜花适合配酒，虾吐司太油，牛排很好吃，底下铺的米饭泡在酱汁里刚好。人均约50刀。", "dt": "2026-05-03", "c": "bar", "xy": [718.0, 491.5], "ne": "Le Rooftop", "te": "Small bar run by a Korean woman", "de": "Fried cauliflower, steak", "ie": "Charming small bar run by a Korean woman on the North Sydney harbour road; the street-side seats by the red door are lovely. Food is above average: fried cauliflower suits drinks, prawn toast is too oily, the steak is great with rice beneath soaking up the sauce. About $50 per person.", "ae": "McMahons Point"}, {"n": "卤匠麻辣鸭", "a": "Burwood", "t": "鸭货外带", "r": "3", "p": 20, "pe": 1, "d": "鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭舌", "i": "麻辣鸭货外带店，鸭头、鸭脖、鸭掌、鸭翅、鸭胗、鸭肠、鸭心和鸭舌都有。入口麻辣辛香带回甜，肉质紧实有嚼劲，非常适合追剧或配米酒。", "dt": "2026-05-01", "c": "zh", "xy": [468.8, 588.5], "ne": "Lujiang Spicy Duck", "te": "Braised duck takeaway", "de": "Duck heads, necks, feet, wings, gizzards, tongues", "ie": "Spicy braised duck takeaway: heads, necks, feet, wings, gizzards, intestines, hearts and tongues. Numbing, spicy and fragrant with a sweet finish and firm, chewy texture. Perfect with TV or rice wine.", "ae": "Burwood"}, {"n": "Doyles on the Beach", "a": "Watsons Bay", "t": "海鲜/海景", "r": "3", "p": 90, "pe": 0, "d": "海鲜、生蚝", "i": "Watsons Bay的海鲜餐厅，可以望见整个屈臣氏湾和远处CBD天际线，海面上帆船游艇点点，天气好的午后美不胜收。以海鲜为主，味道不错但偏贵，人均约90刀还不太饱，主要为景色买单。订位时记得要二楼露台。饭后可以在沙滩上玩沙晒太阳。", "dt": "2026-04-30", "c": "west", "xy": [926.3, 488.0], "ne": "Doyles on the Beach", "te": "Seafood / waterfront", "de": "Seafood, oysters", "ie": "Watsons Bay seafood restaurant overlooking the bay and the distant CBD skyline, dotted with yachts, gorgeous on a sunny afternoon. Seafood-focused, good but pricey; about $90 per person and not very filling, mostly paying for the view. Ask for the upstairs balcony when booking, then enjoy the beach after.", "ae": "Watso d": "夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、老妈蹄花", "i": "UTS附近的成都口味川菜，辣而不过分。夫妻肺片、双椒鳝段、胸口油炒牛筋、火爆双脆、风味百叶和老妈蹄花都好吃。鳝段量大鲜美；胸口油炒牛筋一脆一韧，口感交替，很有创意。人均约35刀，很受学生欢迎。", "dt": "2026-04-23", "c": "zh", "xy": [709.6, 596.4], "ne": "Chunxi Road Sichuan", "te": "Sichuan (Chengdu style)", "de": "Fuqi feipian, double chilli eel, brisket fat with beef tendon, sizzling double crunch, mum's pig trotters", "ie": "Chengdu-style Sichuan near UTS, spicy but not extreme. Fuqi feipian, double chilli eel, brisket fat with tendon, double crunch, tripe and pig trotters are all great. Generous, fresh eel; the brisket fat and tendon alternate crunchy and chewy, very creative. About $35 per person, popular with students.", "ae": "Ultimo"}, {"n": "Little Cake Box", "a": "Broadway", "t": "蛋糕店", "r": "5", "p": 14, "pe": 1, "d": "无花果蛋糕、双莓石榴布蕾", "i": "以季节水果蛋糕见长的蛋糕店，需要预订。季末的无花果蛋糕堆满新鲜无花果，成熟度刚好，清甜高级，非常出色。新季的双莓石榴布蕾是层叠做法，一层入口即化的法式布蕾，一层爆汁的石榴籽和酸甜树莓酱，很有趣。", "dt": "2026-04-22", "c": "bake", "xy": [694.7, 614.7], "ne": "Little Cake Box", "te": "Cake shop", "de": "Fig cake, berry pomegranate brûlée", "ie": "Cake shop known for seasonal fruit cakes, pre-order only. The end-of-season fig cake is piled with perfectly ripe figs, delicately sweet and outstanding. The new berry pomegranate brûlée layers melting crème brûlée with bursting pomegranate seeds and tart raspberry jam, great fun.", "ae": "Broadway"}, {"n": "Pane e Prosciutto Artisan Deli & Panini Bar", "a": "Putney", "t": "意式Panini", "r": "3", "p": 18, "pe": 1, "d": "Signature Panini（火腿腌肉加开心果酱）、辣油", "i": "最近走红的意式Panini小店，熟客很多，店员和客人寒暄热络。招牌Signature是多种火腿腌肉加开心果酱，外壳脆、内里韧，份量大，半个就很饱。店里卖的辣油拌面拌饭都好吃，值得回购。", "dt": "2026-04-22", "c": "west", "xy": [463.2, 430.9], "ne": "Pane e Prosciutto Artisan Deli & Panini Bar", "te": "Italian panini", "de": "Signature panini (cured meats with pistachio cream), chilli oil", "ie": "Newly trending panini deli with lots of regulars chatting with staff. The Signature layers cured meats with pistachio cream: crisp outside, chewy inside, so big half is enough on.", "ae": "Woolloomooloo"}, {"n": "OX LAN LanZhou Beef Noodle", "a": "Carlingford Court", "t": "兰州拉面", "r": "4", "p": 15, "pe": 0, "d": "红烧牛肉面、炸酱面（可免费续面）", "i": "Carlingford Court的人气兰州拉面，开业初期要排长龙，现在不用排了。手工拉面一碗十几刀，还可以免费续面，续的面份量和一整碗差不多，吃不完可以打包。红烧牛肉面和炸酱面味道都好。人均约15刀，性价比极高。", "dt": "2026-04-18", "c": "zh", "xy": [314.9, 285.9], "ne": "OX LAN LanZhou Beef Noodle", "te": "Lanzhou noodles", "de": "Braised beef noodles, zhajiang noodles (free noodle refills)", "ie": "Popular Lanzhou noodle shop at Carlingford Court; the long opening queues have gone. Hand-pulled noodles for teen dollars with free refills almost the size of a full bowl; leftovers can be packed. Braised beef and zhajiang noodles are both good. About $15 per person, incredible value.", "ae": "Carlingford Court"}, {"n": "Hachioji", "a": "Crows Nest", "t": "日料Omakase", "r": "2", "p": 150, "pe": 1, "d": "Lunch Set、午餐小Omakase", "i": "开到Crows Nest的日料Omakase，午市有Lunch Set和小份Omakase。Lunch Set份量一般，不太容易吃饱，想好好吃建议选Omakase。主厨颜值很高，在悉尼Omakase圈小有名气。", "dt": "2026-04-18", "c": "jp", "xy": [718.4, 421.2], "ne": "Hachioji", "te": "Japanese omakase", "de": "Lunch set, mini lunch omakase", "ie": "Omakase now in Crows Nest with a lunch set and a smaller lunch omakase. The lunch set is not very filling; go for the omakase to eat well. The chef is known in Sydney omakase circles for his good looks.", "ae": "Crows Nest"}, {"n": "88 Live Seafood House", "a": "Eastwood", "t": "韩式鱼生", "r": "3", "p": 55, "pe": 0, "d": "三文鱼和虾刺身、炙烤三文鱼寿司、Pipis面汤", "i": "原大长今位置新开的韩式鱼生店。三文鱼和虾刺身非常新鲜，炙烤三文鱼寿司也不错。Pipi面汤海味浓郁，但清淡没负担。人均约55刀，值得一试。", "dt": "2026-04-11", "c": "kr", "xy": [401.5, 307.0], "ne": "88 Live Seafood House", "te": "Korean raw fish", "de": "Salmon and prawn sashimi, seared salmon sushi, pipi noodle soup", "ie": "Korean raw fish restaurant in the old Dae Jang Geum spot. Salmon and prawn sashimi are very fresh, seared salmon sushi good, and the pipi noodle soup full of sea flavour yet light. About $55 per person, worth a try.", "ae": "Eastwood"}, ": "2026-03-20", "c": "west", "xy": [728.1, 549.3], "ne": "King Clarence", "te": "Asian fusion", "de": "Fried fish bun, dry aged duck, claypot rice", "ie": "Asian fusion at the corner of King and Clarence St, part of the Bentley group. Rich, saucy flavours that some may find salty or oily but bold-food fans will love. Tender fried fish bun, fragrant dry aged duck, claypot rice with crust. About $60 per person.", "ae": "Clarence St, CBD"}, {"n": "Amibun", "a": "接龙配送（无门店位置）", "t": "烘焙工坊", "r": "4", "p": 12, "pe": 1, "d": "黑森林酵吐、咸蛋黄芋泥肉松恰巴塔、烧椒鸡肉恰巴塔、番茄猪肉肉松吐司", "i": "近来很受追捧的烘焙工坊，靠社群接龙预订，名额常要抢。", "dt": "2026-03-19", "c": "bake", "xy": null, "ne": "Amibun", "te": "Artisan bakery", "de": "Black Forest sourdough loaf, salted egg taro floss ciabatta, roasted pepper chicken ciabatta, tomato pork floss toast", "ie": "Highly sought-after bakery taking pre-orders through community group chats; spots go fast.", "ae": "Group-order delivery (no shopfront)"}, {"n": "Ray's Place", "a": "North Willoughby", "t": "老牌Cafe", "r": "3", "p": 22, "pe": 1, "d": "自选组合Big Breakfast", "i": "开了近60年的老牌Cafe，深受附近居民喜爱。其他菜式普通，最值得点的是自选Big Breakfast，面包、酱料、肉类、蔬菜和配菜都可以自由搭配，例如土耳其面包一半配花生酱、一半配烟熏三文鱼。", "dt": "2026-03-18", "c": "cafe", "xy": [705.3, 345.4], "ne": "Ray's Place", "te": "Classic café", "de": "Build-your-own big breakfast", "ie": "Café open for nearly 60 years and loved by locals. The rest of the menu is ordinary, but the build-your-own big breakfast lets you mix bread, spreads, meat, vegetables and sides, for example Turkish bread with peanut butter on one half and smoked salmon on the other.", "ae": "North Willoughby"}, {"n": "巴适江湖菜", "a": "Burwood（亦有Zetland店）", "t": "自贡菜", "r": "3", "p": 40, "pe": 1, "d": "火爆爽脆、呛锅鳝丝、渣渣牛肉、干煸肥肠", "i": "从Zetland开到Burwood的自贡菜，辣度极高。火爆爽脆、呛锅鳝丝、渣渣牛肉和干煸肥肠都很够味，渣渣牛肉辣得像直接嚼辣椒。爱吃辣的人一定要来挑战，不太能吃辣的人要有心理准备。", "dt": "2026-03-18", "c": "zh", "xy": [463.4, 604.3], "ne": "Bashi Jianghu Cuisine", "te": "Zigong", "de": "Sizzling crunchy offal, flash-fried eel strips, minced beef, dry-fried intestine", "ie": "Zigong cuisine from Zetland, now also in Burwood, extremely spicy. Sizzling crunchy offal, flash-fried eel, minced beef and dry-fried intestine are all intense; the minced beef is like chewing raw chillies. A must for chilli lovers; others be warned.", "ae": "Burwood (also Zetland)"}, {"n": "牛百岁 Mr Fu's Kitchen", "a": "Eastwood Plaza", "t": "红烧牛排骨/羊肉", "r": "4", "p": 40, "pe": 1, "d": "红烧牛排骨、红烧带皮黑草羊（38.4刀大盆）、红烧牛排饭12.8刀", "i": "价格很良心的红烧菜馆。38.4刀的红烧牛排骨和红烧带皮黑草羊都是大大一盆；12.8刀的红烧牛排饭像十年前的物价，米饭泡在汤汁里非常好吃。外带用的是可以直接明火加热的容器，很贴心。", "dt": "2026-03-18", "c": "zh", "xy": [411.9, 323.2], "ne": "Mr Fu's Kitchen", "te": "Braised beef ribs / lamb", "de": "Braised beef ribs, braised skin-on lamb ($38.40 big bowl), $12.80 braised beef rice", "ie": "Braised dishes at very honest prices. The $38.40 braised beef ribs and braised skin-on lamb come in huge bowls; the $12.80 braised beef rice feels like prices from ten years ago, with rice soaking up the sauce. Takeaway containers can go straight on a flame, a thoughtful touch.", "ae": "Eastwood Plaza"}, {"n": "Caraway", "a": "Burwood", "t": "韩式Cafe", "r": "3", "p": 30, "pe": 0, "d": "炸鸡华夫饼、枫糖浆Cold Brew", "i": "Burwood排屋里新开的韩式Cafe，装修简单。炸鸡华夫饼的辣酱很辣，配甜华夫饼刚好，炸鸡蘸溏心蛋液更香。枫糖浆Cold Brew清甜。人均约30刀。", "dt": "2026-03-16", "c": "cafe", "xy": [462.0, 579.5], "ne": "Caraway", "te": "Korean café", "de": "Fried chicken waffle, maple cold brew", "ie": "New Korean café in a Burwood terrace with simple décor. The fried chicken's spicy sauce is hot, balanced by the sweet waffle, and dipping chicken in the soft egg yolk is even better. Light, sweet maple cold brew. About $30 per person.", "ae": "Burwood"}, {"n": "Charcoal & Crisp Lechon", "a": "Crows Nest", "t": "菲律宾菜", "r": "2", "p": 25, "pe": 1, "d": "蒜蓉烤排骨、脆皮猪五花", "i": "Crows Nest少有人知的菲律宾烤肉店，以烤和炸为主。蒜蓉烤排骨比招牌脆皮猪五花好吃，猪五花肥肉偏多，不如广式烧肉。店里也卖Ube紫山药蛋糕，店员很诚实，放久了的不会卖。", "dt": "2026-03-15", "c": "asia", "xy": [716.0, 440.6], "ne": "Charcoal & Crisp Lechon", "te": "Filipino", "de": "Garlic grilled pork ribs 0 per person.", "ae": "West Ryde"}, {"n": "S'Bread House", "a": "Lane Cove（Canopy外）", "t": "越南包", "r": "2", "p": 16.5, "pe": 0, "d": "脆皮猪五花越南包", "i": "Canopy外一座独立小房子里的越南包店。脆皮猪五花越南包整体不错，但调味偏保守，少了越南包那种放肆的香气，算不上第一梯队。一个16.5刀，偏贵，附近可以一试，狂热爱好者不必专程。", "dt": "2025-10-23", "c": "asia", "xy": [624.2, 401.9], "ne": "S'Bread House", "te": "Banh mi", "de": "Crispy pork belly banh mi", "ie": "Banh mi in a standalone little house outside Canopy, Lane Cove. Decent overall but conservatively seasoned, missing the bold aromas of great banh mi; not top tier. $16.50, pricey; try if nearby.", "ae": "Lane Cove (outside The Canopy)"}, {"n": "The Hill Thai Restaurant", "a": "West Pennant Hills", "t": "泰国菜", "r": "3", "p": 35, "pe": 0, "d": "沙爹虾串、芋头春卷、芒果糯米饭", "i": "被鲜花簇拥的泰国菜小店。沙爹虾串弹牙，芋头春卷的芋泥很好吃；蛋网泰式炒米粉造型新颖，但配的脆皮鸡太柴。芒果糯米饭好吃。人均约35刀。", "dt": "2025-10-22", "c": "asia", "xy": [289.5, 202.8], "ne": "The Hill Thai Restaurant", "te": "Thai", "de": "Satay prawn skewers, taro spring rolls, mango sticky rice", "ie": "Thai restaurant surrounded by flowers. Bouncy satay prawns and spring rolls with delicious taro paste; the pad Thai in an egg net looks great but comes with very dry chicken. Good mango sticky rice. About $35 per person.", "ae": "West Pennant Hills"}, {"n": "The Ugly Bakery", "a": "West Ryde", "t": "肉桂卷", "r": "3", "p": 7.3, "pe": 0, "d": "糖霜肉桂卷", "i": "专做肉桂卷的烘焙店，据说连不爱肉桂的人都会喜欢。糖霜肉桂卷很好吃，一个7.3刀，不便宜。傍晚去选择较少。", "dt": "2025-10-21", "c": "bake", "xy": [432.0, 363.6], "ne": "The Ugly Bakery", "te": "Cinnamon rolls", "de": "Iced cinnamon roll", "ie": "Bakery devoted to cinnamon rolls, said to win over even cinnamon haters. The iced cinnamon roll is delicious, $7.30, not cheap. Limited choice late in the day.", "ae": "West Ryde"}, {"n": "Bonjour Vietnam", "a": "Lindfield（Pacific Hwy）", "t": "越南菜", "r": "2", "p": 30, "pe": 0, "d": "椰子咖啡、和牛粉", "i": "Pacific Hwy上越南风情浓厚的越南餐厅。椰子咖啡很好喝，椰子沙冰和越南咖啡融合得好。和牛粉不是真和牛，但粿条本身不错。鸡肉沙拉又干又柴，不要点。菜单不大，已不卖越南包。人均约30刀。", "dt": "2025-10-21", "c": "asia", "xy": [628.9, 272.5], "ne": "Bonjour Vietnam", "te": "Vietnamese", "de": "Coconut coffee, wagyu pho", "ie": "Very Vietnamese-feeling restaurant on the Pacific Hwy. The coconut coffee blends coconut slush and Vietnamese coffee beautifully. The wagyu pho is not really wagyu but the noodles are good. The chicken salad is dry, skip it. Small menu, no more banh mi. About $30 per person.", "ae": "Lindfield（Pacific Hwy）"}, {"n": "Green Shiso Omakase", "a": "Circular Quay", "t": "Omakase", "r": "5", "p": 300, "pe": 0, "d": "春季Omakase", "i": "藏在市中心小巷里的Omakase，氛围很好，每位约268刀，团队是中国人，可以用普通话讲解，主厨Simon谦逊可爱，气氛轻松。套餐融入怀石元素，食材丰富，搭配有新意，份量非常足。酒肴八寸里Toro配海胆酱最出色；金目鲷釜饭用高汤炊饭，配时令蔬菜和炭烤金目鲷，热乎治愈，可以续饭；北海道和牛油脂丰富，配山葵酱解腻。寿司十贯，喉黑、海胆、赤身和大腹最好。甜品是静冈蜜瓜和焦糖布丁。厨师很用心，柴鱼片都是现刨的。菜单随季节更换，含酒水人均约300刀。", "dt": "2025-10-20", "c": "jp", "xy": [731.4, 543.3], "ne": "Green Shiso Omakase", "te": "Omakase", "de": "Hassun with toro and uni sauce, kinmedai kamameshi, Hokkaido wagyu, nodoguro, uni, akami and otoro nigiri, Shizuoka melon, caramel pudding", "ie": "Omakase hidden down a CBD laneway with a lovely atmosphere, about $268 per person, run by a Chinese team who can explain in Mandarin; chef Simon is humble and charming and the mood relaxed. The set weaves in kaiseki elements with rich ingredients and creative pairings, and is very generous. In the hassun, toro with uni sauce stands out; kinmedai kamameshi cooked in dashi with seasonal vegetables and charcoal-grilled golden eye snapper is comforting, with refills; Hokkaido wagyu is rich, cut by wasabi. Ten nigiri, with nodoguro, uni, akami and otoro the best. Dessert is Shizuoka melon and caramel pudding. Careful work, even freshly shaved bonito. Seasonal menu, about $300 per person with drinks.", "ae": "Circular Quay"}, {"n": "ester", "a": "Chippendale", "t": "现代澳菜", "r": "4", "p": 105, "pe": 0, "d": "烤虾配面包蘸虾油、砂锅鸭肉饺子、血肠吐司", "i": "开了十多年的现代澳菜名店，品质和氛围一如既往。烤虾特别好，面包蘸虾油很好吃；砂锅鸭肉饺子有东方特色；味噌鳕鱼一般；外表不起眼的血肠吐司是全场最佳。人均约105刀，能吃很饱。", "dt": "2025-10-19", "c": "west", "xy": [712.2, 615.4], "ne": "ester", "te": "Modern Australian", "de": "Grilled prawns with bread for the prawn oil, claypot duck dumplings, blood sausage toast", "ie": "Acclaimed modern Australian of over a decade, quality and vibe unchanged. Superb grilled prawns, with bread to mop up the prawn oil; claypot duck dumplings have an Asian touch; miso cod is average; the unassuming blood sausage toast is the best dish. About $105 per person, very filling.", "ae": "Chippendale"}, {"n": "福记潮汕肠粉铺", "a": "唐人街建德大厦", "t": "潮汕肠粉", "r": "5", "p": 26, "pe": 0, "d": "猪肉鸡蛋肠粉、卤味粿汁、沙姜鸡、猪骨生蚝粥、南乳鸡翅、甘草水果", "i": "建德大厦里在潮汕人圈子很火的肠粉铺，是悉尼少有的潮汕肠粉。猪肉鸡蛋肠粉复刻度很高；卤味粿汁皮、沙姜鸡、南乳鸡翅都好吃；猪骨生蚝粥浓郁但份量小；还有悉尼少见的甘草水果。不是百分百正宗，但已经很难得。人均约26刀。", "dt": "2025-10-09", "c": "zh", "xy": [735.6, 602.1], "ne": "Fook Kee Teochew Rice Rolls", "te": "Teochew rice rolls", "de": "Pork and egg rice rolls, braised kway chap, sand ginger chicken, pork bone oyster congee, fermented tofu wings, licorice fruit", "ie": "Rice roll shop in Kin Tak Building, a hit among Teochew locals and one of Sydney's only Teochew-style rice roll shops. The pork and egg rolls are very faithful; braised kway chap, sand ginger chicken and fermented tofu wings are good; the pork bone oyster congee is rich but small; they even have rare licorice fruit. Not 100% authentic, but rare enough. About $26 per person.", "ae": "Chinatown (Kin Tak Building)"}, {"n": "Edomae Sushi 江户前寿司", "a": "Haymarket（唐人街到Market City转角）", "t": "旋转寿司", "r": "3", "p": 35, "pe": 0, "d": "海胆鹅肝手卷", "i": "唐人街往Market City转角的旋转寿司，江户前把悉尼旋转寿司的水准带到了新高度。鱼种多，非常新鲜，海胆鹅肝手卷很好吃。人均约35刀。", "dt": "2025-10-09", "c": "jp", "xy": [712.2, 586.3], "ne": "Edomae Sushi", "te": "Sushi train", "de": "Uni foie gras hand roll", "ie": "Sushi train on the corner from Chinatown to Market City; Edomae lifted Sydney's sushi train standard and sparked the wave that followed. Lots of fish, very fresh, and a great uni foie gras hand roll. About $35 per person.", "ae": "Haymarket (Chinatown corner to Market City)"}, {"n": "Ohmami", "a": "Glebe（悉尼大学对面）", "t": "Cafe", "r": "2", "p": 22, "pe": 1, "d": "肉松卷、草莓抹茶、甜甜圈", "i": "悉尼大学公园对面的Cafe，招牌肉松卷很抢手，一早就会卖完，想吃要早点去。草莓抹茶和甜甜圈都普通。", "dt": "2025-10-09", "c": "cafe", "xy": [671.1, 589.1], "ne": "Ohmami", "te": "Café", "de": "Pork floss roll, strawberry matcha, doughnut", "ie": "Café opposite the University of Sydney park. The signature pork floss roll sells out early, so go early. Strawberry matcha and doughnuts are ordinary.", "ae": "Glebe (opposite Sydney Uni)"}, {"n": "燊记", "a": "Chatswood（Mandarin Centre美食广场）", "t": "港式云吞面/小吃", "r": "4", "p": 18, "pe": 1, "d": "墨鱼饼、腐皮虾卷、细蓉竹昇面", "i": "Mandarin Centre美食广场里不起眼的港式小吃店，味道很正宗。墨鱼饼外皮煎得焦脆，内里是弹牙墨鱼肉；腐皮虾卷酥脆不油；细蓉汤底清甜，用的是传统竹升面。", "dt": "2025-10-08", "c": "zh", "xy": [659.7, 321.1], "ne": "Sun Kee", "te": "Hong Kong wonton noodles / snacks", "de": "Cuttlefish cake, beancurd prawn rolls, wonton noodles with bamboo-pressed noodles", "ie": "Unassuming Hong Kong snack stall in the Mandarin Centre food court, very authentic. The cuttlefish cake is crisp outside and bouncy inside; beancurd prawn rolls are crisp, not oily; the wonton noodle broth is clear and sweet with traditional bamboo-pressed noodles.", "ae": "Chatswood (Mandarin Centre food court)"}, {"n": "Smelly Cheesecake", "a": "Chatswood火车站（Eastwood等地也有）", "t": "韩式Cafe/芝士蛋糕", "r": "3", "p": 12, "pe": 1, "d": "卡通芝士蛋糕、紫薯芝士蛋糕、黑芝麻蛋糕、大虾意面", "i": "开了很多年的韩式芝士蛋糕Cafe，Eastwood等地都有分店，Chatswood火车站也开了。卡通芝士蛋糕完全复刻Emoji造型，像从猫和老鼠动画里跑出来一样，非常可爱；紫薯芝士蛋糕也受好评。", "dt": "2025-10-08", "c": "cafe", "xy": [648.7, 353.2], "ne": "Smelly Cheesecake", "te": "Korean café / cheesecake", "de": "Cartoon cheesecake, purple sweet potato cheesecake, black sesame cake, prawn pasta", "ie": "Long-running Korean cheesecake café with branches in Eastwood and elsewhere, now at Chatswood station too. The cartoon cheesecake looks exactly like the emoji, straight out of Tom and Jerry, adorable; the purple sweet potato cheesecake is well liked.", "ae": "Chatswood station (also Eastwood)"}, {"n": "Jeon & Kalguksu Jip", "a": "Lidcombe", "t": "韩国刀切面/煎饼", "r": "4", "p": 45, "pe": 0, "d": "手工刀切面（海鲜、牛骨汤）、牛肉煎饼、辣猪排骨火锅", "i": "地道的韩式刀切面和煎饼店。手工刀切面筋道，海鲜和牛骨汤底都有层次；牛肉煎饼蛋液外皮酥脆，牛肉薄嫩，配葱丝很好吃，值得加点。辣猪排骨火锅暖胃，但不如面和煎饼出色。店小，只有约六张桌子。人均约45刀。", "dt": "2025-10-06", "c": "kr", "xy": [315.7, 556.3], "ne": "Jeon & Kalguksu Jip", "te": "Korean knife-cut noodles / pancakes", "de": "Handmade kalguksu (seafood, beef bone broth), beef jeon, spicy pork rib hotpot", "ie": "Authentic kalguksu and jeon house. Handmade knife-cut noodles are chewy, with layered seafood and beef bone broths; the beef jeon has a crisp egg coating and thin tender beef, great with shredded scallion, worth reordering. The spicy pork rib hotpot is warming but not as good as the noodles and pancakes. Tiny, about six tables. About $45 per person.", "ae": "Lidcombe"}, {"n": "11:11 Sweet", "a": "Lane Cove", "t": "甜品", "r": "3", "p": 14, "pe": 1, "d": "草莓抹茶、提拉米苏", "i": "Lane Cove Plaza旁的小甜品店。草莓抹茶抹茶味浓不苦，草莓酸甜中和厚重感，很适合春夏。提拉米苏很软但酒味不足。适合一个人静静坐着发呆。", "dt": "2025-10-06", "c": "bake", "xy": [628.0, 390.4], "ne": "11:11 Sweet", "te": "Desserts", "de": "Strawberry matcha, tiramisu", "ie": "Little dessert shop beside Lane Cove Plaza. Strawberry matcha has strong, non-bitter matcha lifted by tangy strawberry, perfect for spring and summer. The tiramisu is soft but light on liquor. Good for quiet solo time.", "ae": "Lane Cove"}, {"n": "Sushi Train", "a": "Lane Cove", "t": "旋转寿司", "r": "3", "p": 37, "pe": 0, "d": "寿司", "i": "几十年的老牌旋转寿司，近年焕新，环境更干净明亮现代。食材新鲜、鱼种丰富，寿司米煮得刚好，粒粒分明又有黏性。人均约37刀，不算便宜。", "dt": "2025-10-06", "c": "jp", "xy": [615.6, 397.5], "ne": "Sushi Train", "te": "Sushi train", "de": "Sushi", "ie": "Decades-old sushi train chain, recently refreshed: cleaner, brighter and more modern. Fresh fish with plenty of variety, and well-cooked rice that is distinct yet sticky. About $37 per person, not cheap.", "ae": "Lane Cove"}, {"n": "一顿小烧烤", "a": "Eastwood", "t": "烧烤", "r": "4", "p": 50, "pe": 0, "d": "羊肉串、烤鸭肠、宫后夹肉、烤羊排", "i": "可以自己动手烤，也可以让后厨代烤的烧烤店，小朋友很爱参与。串类多又入味，烤鸭肠、羊肉串、青椒、宫后夹肉、鸡爪和年糕都好吃。必点烤羊排，外焦里嫩，一撕就脱骨，蘸辣椒面吃。人均约50刀。", "dt": "2025-10-05", "c": "zh", "xy": [409.8, 332.4], "ne": "Yidun BBQ", "te": "Chinese BBQ skewers", "de": "Lamb skewers, grilled duck intestine, pork with fat skewers, grilled lamb ribs", "ie": "BBQ skewer house where you grill yourself or let the kitchen do it; kids love joining in. Lots of well-seasoned skewers: duck intestine, lamb, green pepper, fatty pork, chicken feet and rice cake. Must-order grilled lamb ribs, crisp outside, tender, falling off the bone, dipped in chilli powder. About $50 per person.", "ae": "Eastwood"}, {"n": "Nour", "a": "Surry Hills", "t": "中东菜", "r": "5", "p": 80, "pe": 1, "d": "泡菜鸡肉卷、蒜酱脆皮土豆、烤章鱼、烤菜花", "i": "Surry Hills的中东菜，开了多年依然好吃，网上三千多条评价仍保持4.8高分。前菜很惊艳，泡菜鸡肉卷、蒜酱脆皮土豆和烤章鱼都好，酱料好到值得加点Pita来蘸。烤菜花必点，牛排好吃但无特色。甜品非常甜，要慎点。", "dt": "2025-10-03", "c": "asia", "xy": [751.9, 633.4], "ne": "Nour", "te": "Middle Eastern", "de": "Pickled chicken wrap, crispy potatoes with toum, grilled octopus, roast cauliflower", "ie": "Surry Hills Middle Eastern, still excellent after many years, holding 4.8 from over 3,000 reviews. Stunning starters: pickled chicken wrap, crispy potatoes with garlic toum and grilled octopus, with sauces worth extra pita. Roast cauliflower is a must; the steak is good but plain. Desserts are very sweet, order carefully.", "ae": "Surry Hills"}, {"n": "Jun's Malaysian Kitchen", "a": "Eastwood", "t": "马来菜", "r": "3", "p": 25, "pe": 1, "d": "滑蛋鸳鸯、虾酱鸡翅、咖喱炒Pipi", "i": "Eastwood新开的马来菜，开业优惠期饭点要排队，建议早到。主食选择多，适合小朋友。大人可以试马来风光、咖喱炒Pipi和虾酱鸡翅，风味很足，滑蛋鸳鸯和虾酱鸡翅最好吃。", "dt": "2025-10-03", "c": "asia", "xy": [396.5, 302.1], "ne": "Jun's Malaysian Kitchen", "te": "Malaysian", "de": "Silky egg yuan yang noodles, shrimp paste chicken wings, curry pipis", "ie": "New Malaysian in Eastwood; queues at peak during the opening discount, so come early. Plenty of mains suitable for kids. Adults should try kangkung belacan, curry pipis and shrimp paste wings; the silky egg yuan yang noodles and wings are best.", "ae": "Eastwood"}, {"n": "Binchotan", "a": "West Ryde", "t": "日式烤肉", "r": "2", "p": 65, "pe": 0, "d": "和牛、下酒菜", "i": "以备长炭为名的日式烤肉店。其中一盘和牛的雪花纹理过于规整，疑似注脂肉，点和牛时可以留意。其余菜式不错，老板热情，会送下酒小菜。人均约65刀。", "dt": "2025-10-03", "c": "jp", "xy": [409.6, 362.9], "ne": "Binchotan", "te": "Japanese BBQ", "de": "Wagyu, drinking snacks", "ie": "Yakiniku named after binchotan charcoal. One wagyu plate had suspiciously uniform marbling, possibly injected fat, so look carefully when ordering wagyu. Other dishes are good, and the friendly owner sends free snacks. About $65 per person.", "ae": "West Ryde"}, {"n": "不二烫捞", "a": "Wentworth Point", "t": "麻辣烫/肠粉", "r": "3", "p": 22, "pe": 1, "d": "加蛋加猪肉肠粉", "i": "Wentworth Point的麻辣烫店，新增广式肠粉。加蛋加猪肉肠粉皮薄透亮，现蒸现做，猪肉馅嫩滑，蛋香足。酱汁只是普通酱油，层次不够，是小遗憾。", "dt": "2025-10-03", "c": "zh", "xy": [378.5, 434.5], "ne": "Bu Er Malatang", "te": "Malatang / rice rolls", "de": "Egg and pork rice rolls", "ie": "Malatang shop in Wentworth Point that now also makes Cantonese rice rolls. Egg and pork rolls are thin and translucent, steamed to order, with tender pork and good egg flavour. The sauce is plain soy, lacking depth.", "ae": "Wentworth Point"}, {"n": "上海小馄饨", "a": "Ryde（Top Ryde对面）", "t": "上海点心", "r": "4", "p": 20, "pe": 1, "d": "小馄饨、小笼包、锅贴", "i": "Top Ryde商场对面低调的上海点心店，现包现煎现煮，开放式厨房干净透明。小馄饨皮薄馅嫩，汤底只放紫菜和虾皮就很鲜；小笼包皮薄汤多，先吸汤再吃，小心烫；锅贴底部金黄酥脆，配店里的辣酱很好吃。值得一去。", "dt": "2025-10-02", "c": "zh", "xy": [463.7, 398.7], "ne": "Shanghai Wontons", "te": "Shanghai dim sum", "de": "Small wontons, xiaolongbao, potstickers", "ie": "Low-key Shanghai dim sum shop opposite Top Ryde shopping centre, made to order in a clean open kitchen. Small wontons with thin skins in a broth of just seaweed and dried shrimp, already very fresh; xiaolongbao with thin skins and lots of soup, sip first and beware the heat; potstickers with golden crisp bottoms, great with their chilli sauce. Worth a visit.", "ae": "Ryde (opposite Top Ryde)"}, {"n": "Winghaus", "a": "Entertainment Quarter", "t": "鸡翅/体育酒吧", "r": "3", "p": 30, "pe": 1, "d": "Mango Habanero鸡翅", "i": "鸡翅体育酒吧，几十台电视同步直播各种球赛，看球氛围很好。Mango Habanero口味果香清甜，几乎不辣，鸡翅外皮焦香，肉质嫩。适合球迷和鸡翅爱好者。", "dt": "2025-10-01", "c": "bar", "xy": [778.9, 643.2], "ne": "Winghaus", "te": "Wings / sports bar", "de": "Mango habanero wings", "ie": "Wing bar with dozens of screens showing live sport, great match-day atmosphere. Mango habanero wings are fruity and barely spicy, with charred skin and tender meat. For sports fans and wing lovers.", "ae": "Entertainment Quarter"}, {"n": "朝阳 Chaoyang Delicious", "a": "Wentworth Point（华超内）", "t": "北京菜", "r": "4", "p": 25, "pe": 0, "d": "卤煮火烧、千层肉饼、豌豆黄、糖火烧", "i": "藏在华人超市里的北京菜，很低调，店里满是京腔。卤煮火烧的肥肠、猪肉和豆腐泡炖得入味不腻，火烧吸满汤汁；千层肉饼外皮酥脆、层次分明、肉香十足。甜品豌豆黄细腻不齁甜，糖火烧外焦里软。人均约25刀。", "dt": "2025-09-29", "c": "zh", "xy": [382.1, 443.1], "ne": "Chaoyang Delicious", "te": "Beijing", "de": "Luzhu huoshao (offal stew with bread), layered meat pie, pea cake, sugar huoshao", "ie": "Beijing food hidden in a Chinese supermarket, full of Beijing accents. The luzhu huoshao has intestine, pork and tofu puffs stewed rich but not greasy, with bread soaking up the broth; the layered meat pie is crisp and flaky with juicy pork. Pea cake is smooth and not too sweet; sugar huoshao crisp outside, soft inside. About $25 per person.", "ae": "Wentworth Point (inside an Asian supermarket)"}, {"n": "Mary's", "a": "Entertainment Quarter（Newtown也有）", "t": "炸鸡", "r": "5", "p": 20, "pe": 1, "d": "炸鸡", "i": "起家于Newtown地下酒吧的炸鸡名店，换了地点依然出色。外皮酥到掉渣，里面鸡汁爆开，连鸡胸肉都不柴，堪称灌汤炸鸡，外皮香料咸香美式。比KFC贵一些，但值得。", "dt": "2025-09-29", "c": "west", "xy": [775.9, 640.5], "ne": "Mary's", "te": "Fried chicken", "de": "Fried chicken", "ie": "Fried chicken legend born in a Newtown basement bar, still excellent in its new location. Shattering crust, juice bursting inside, even the breast is moist, soup-dumpling fried chicken with salty American spice. Costs more than KFC but worth it.", "ae": "Entertainment Quarter (also Newtown)"}, {"n": "Oh Boo Chocolates", "a": "Barangaroo", "t": "巧克力", "r": "3", "p": all.", "ae": "Kent St, CBD (basement of Palazzo Salato)"}, {"n": "Black Star Pastry", "a": "Rosebery", "t": "烘焙", "r": "3", "p": 12, "pe": 1, "d": "与金唐联名XO Pipi Pie", "i": "知名烘焙店Black Star和金唐海鲜酒家合作的限定Pie，灵感来自XO酱炒Pipi，由粤菜师傅炒制带子和大虾内馅，包在金黄酥脆的千层酥皮里，配炸面条、青葱和XO酱，是很成功的中西融合。", "dt": "2025-09-16", "c": "bake", "xy": [721.1, 722.5], "ne": "Black Star Pastry", "te": "Bakery", "de": "XO pipi pie with Golden Century", "ie": "Limited pie from Black Star Pastry and Golden Century, inspired by XO pipis: scallops and prawns stir-fried by Cantonese chefs inside golden flaky pastry, served with fried noodles, scallions and XO sauce. A genuinely successful fusion.", "ae": "Rosebery"}, {"n": "Mentmore and Morley", "a": "Rosebery", "t": "菲律宾Cafe", "r": "4", "p": 22, "pe": 1, "d": "Beef Short Ribs、炭烤鸡", "i": "近来小火的菲律宾Cafe，一早就有烤肉。Beef Short Ribs好吃，烤鸡炭香浓郁、皮脆肉嫩，蘸辣酱更好。还有菲律宾猪手和脆皮五花肉等菜式。", "dt": "2025-09-16", "c": "cafe", "xy": [718.0, 719.7], "ne": "Mentmore and Morley", "te": "Filipino café", "de": "Beef short ribs, charcoal chicken", "ie": "Trending Filipino café serving grilled meats from early morning. Beef short ribs are great, and the charcoal chicken is smoky with crisp skin, even better with chilli sauce. Also Filipino pork knuckle and crispy pork belly.", "ae": "Rosebery"}, {"n": "Sydney Tuna", "a": "Lidcombe", "t": "韩式金枪鱼刺身", "r": "5", "p": 37, "pe": 0, "d": "九宫格蓝鳍金枪鱼刺身（110刀）", "i": "Lidcombe韩式鱼生街上的金枪鱼专门店，招牌是九宫格蓝鳍金枪鱼刺身，从赤身到中腹、大腹，每格一个部位，切得厚实新鲜，大腹入口即化，有时还会送稀有的金枪鱼背。一套110刀，附带泡菜、芝士玉米、鱼饼乌冬和手握寿司，够三人吃饱。人均约37刀，性价比极高。", "dt": "2025-09-10", "c": "kr", "xy": [305.3, 541.6], "ne": "Sydney Tuna", "te": "Korean tuna sashimi", "de": "Nine-grid bluefin tuna sashimi ($110)", "ie": "Tuna specialist on Lidcombe's Korean raw fish strip. The signature nine-grid bluefin platter goes from akami to chutoro and otoro, one cut per square, thick and fresh, with melting otoro; sometimes they add rare tuna back. $110 per set with kimchi, corn cheese, fish cake udon and nigiri, enough for three. About $37 per person, outstanding value.", "ae": "Lidcombe"}, {"n": "Cardea", "a": "Barangaroo", "t": "剧场式酒吧餐厅", "r": "3", "p": 100, "pe": 0, "d": "龙虾卷、牛排、西班牙小土豆、生蚝", "i": "怀旧奢华的剧场式酒吧餐厅，红色天鹅绒沙发、璀璨吊灯和复古家具，像三十年代的夜上海。每晚有不同主题的现场演出，例如爵士乐。食物融合多国风味，龙虾卷、牛排、西班牙小土豆和生蚝都不错。人均约100刀，吃喝加看演出，也很出片。", "dt": "2025-09-09", "c": "bar", "xy": [705.0, 546.4], "ne": "Cardea", "te": "Theatrical bar and restaurant", "de": "Lobster roll, steak, Spanish potatoes, oysters", "ie": "Nostalgic, opulent supper club with red velvet sofas, chandeliers and vintage furniture, like 1930s Shanghai. Live shows change nightly, such as jazz. Food blends several cuisines; lobster roll, steak, Spanish potatoes and oysters all work. About $100 per person for dinner, drinks and a show, very photogenic.", "ae": "Barangaroo"}, {"n": "Bottega Coco", "a": "Barangaroo", "t": "意大利甜品/Pizza", "r": "3", "p": 30, "pe": 0, "d": "歌剧院造型巧克力蛋糕、芒果慕斯、天鹅蛋糕", "i": "意大利甜品和Pizza店，晚上九点还满座，Pizza炉一直火力全开。招牌是悉尼歌剧院造型的蛋糕，外壳是硬巧克力，敲开里面是巧克力慕斯和椰丝。芒果慕斯和天鹅蛋糕也不错。甜品加茶人均约30刀。", "dt": "2025-09-07", "c": "bake", "xy": [720.9, 550.0], "ne": "Bottega Coco", "te": "Italian desserts / pizza", "de": "Opera House chocolate cake, mango mousse, swan cake", "ie": "Italian dessert and pizza shop still full at 9 pm, with the pizza oven blazing. The signature is an Opera House shaped cake with a hard chocolate shell over chocolate mousse and coconut. Mango mousse and swan cake are good too. About $30 per person for dessert and tea.", "ae": "Barangaroo"}, {"n": "Besuto", "a": "Circular Quay", "t": "Omakase", "r": "4", "p": 300, "pe": 0, "d": "和牛、牙鱼、茶碗蒸、木盒刺身", "i": "隐藏在地下酒吧后面的Omakase，入口很隐蔽。共5道菜、6贯寿司、一份汤和一份甜品，能吃饱。前面的和牛、牙鱼、茶碗蒸和木盒刺身尤其出色，食材不算顶级，但技术和摆盘过关。主厨现在态度友善。每人250刀，含酒水人均约300刀。", "dt": "2025-09-05", "c": "jp", "xy": [747.2, 546.8], "ne": "Besuto", "te": "Omakase", "de": "Wagyu, toothfish, chawanmushi, sashimi box", "ie": "Omakase hidden behind a basement bar, with a secret entrance. Five dishes, six nigiri, soup and dessert, enough to fill you. The early wagyu, toothfish, chawanmushi and sashimi box are excellent; ingredients are not top tier but technique and presentation are solid. The chef is friendly now. $250 each, about $300 with drinks.", "ae": "Circular Quay"}, {"n": "Ramen Shogun", "a": "Ultimo", "t": "日式拉面", "r": "4", "p": 30, "pe": 0, "d": "炸鸡排盖饭、豚骨拉面、饺子、烧鸟串", "i": "低调但很好吃的日式拉面店。炸鸡排盖饭超脆超嫩；豚骨拉面浓郁不腻，吃完不口渴；饺子爆汁；烧鸟串大串嫩滑，大葱清甜。蔬菜天妇罗偏油。人均约30刀，份量大。", "dt": "2025-09-04", "c": "jp", "xy": [697.2, 603.5], "ne": "Ramen Shogun", "te": "Japanese ramen", "de": "Chicken katsu don, tonkotsu ramen, gyoza, yakitori", "ie": "Low-key but excellent ramen shop. The chicken katsu don is crisp and tender; the tonkotsu ramen is rich but not cloying and leaves you not thirsty; gyoza burst with juice; yakitori skewers are big and juicy with sweet leek. Vegetable tempura is oily. About $30 per person, big portions.", "ae": "Ultimo"}, {"n": "Pho Co", "a": "Eastwood", "t": "越南粉", "r": "3", "p": 30, "pe": 0, "d": "和牛牛肉粉、甘蔗虾、香茅猪排", "i": "Eastwood开了多年的越南粉店，在竞争激烈的街上屹立不倒。和牛牛肉粉不错，还有儿童份量。甘蔗虾和香茅猪排值得点。人均约30刀。", "dt": "2025-09-03", "c": "asia", "xy": [416.4, 328.8], "ne": "Pho Co", "te": "Vietnamese pho", "de": "Wagyu pho, sugarcane prawns, lemongrass pork chop", "ie": "Long-surviving pho shop on competitive Eastwood. The wagyu pho is good and there are kids' sizes. Sugarcane prawns and lemongrass pork chop are worth ordering. About $30 per person.", "ae": "Eastwood"}, {"n": "Soban by Joseon", "a": "Olympic Park（火车站旁）", "t": "韩国釜饭", "r": "3", "p": 30, "pe": 1, "d": "安格斯牛肉釜饭、炸虾、提拉米苏", "i": "火车站旁新开的韩国釜饭，只在周日营业，常要排一小时，鱼饭和章鱼饭容易售罄。安格斯牛肉釜饭非常嫩且入味，配小菜包进紫菜吃很好。一份很大，两个女生可以分。炸虾硕大弹牙，饺子一般，提拉米苏很软很好吃。", "dt": "2025-09-03", "c": "kr", "xy": [365.8, 497.5], "ne": "Soban by Joseon", "te": "Korean pot rice", "de": "Angus beef pot rice, fried prawns, tiramisu", "ie": "New Korean pot rice shop by the station, open Sundays only, often with an hour's wait; fish and octopus versions sell out fast. The Angus beef pot rice is tender and well seasoned, wrapped in seaweed with banchan. One serve is big enough for two. Giant bouncy fried prawns, average dumplings, and a soft, lovely tiramisu.", "ae": "Olympic Park (by the station)"}, {"n": "东街口鲜捞面馆", "a": "Hurstville", "t": "福建面馆", "r": "3", "p": 20, "pe": 0, "d": "麻酱拌面、拌粉、炸鸡排、炸馄饨、炖汤", "i": "Hurstville的福建面馆，被不少人列为当地必吃，合南方人口味又便宜。麻酱拌面和拌粉很香；炸鸡排和炸馄饨酥脆；炖汤套餐养生。人均约20刀，份量足。", "dt": "2025-09-02", "c": "zh", "xy": [452.6, 877.7], "ne": "Dongjiekou Noodle House", "te": "Fujianese noodles", "de": "Sesame sauce noodles, mixed rice noodles, fried chicken cutlet, fried wontons, double-boiled soup", "ie": "Fujianese noodle house in Hurstville that many call a local must-eat, suited to southern Chinese palates and cheap. Sesame noodles and mixed rice noodles are fragrant; fried chicken cutlet and wontons are crunchy; the soup sets are nourishing. About $20 per person, generous.", "ae": "Hurstville"}, {"n": "Kafe Washoku", "a": "Westfield Miranda", "t": "日料", "r": "4", "p": 40, "pe": 0, "d": "Deluxe刺身、和牛刺身、三文鱼Don、照烧鸡腿饭", "i": "南区新开的日料店，刺身非常新鲜，能看到厨师现场开鱼，Deluxe刺身拼盘很值得点。寿司、和牛刺身、玉米、三文鱼丼和照烧鸡腿饭都好吃。人均约40刀，非常实惠。", "dt": "2025-09-02", "c": "jp", "xy": [455.3, 1093.2], "ne": "Kafe Washoku", "te": "Japanese", "de": "Deluxe sashimi, wagyu sashimi, salmon don, teriyaki chicken rice", "ie": "New Japanese in the south with very fresh sashimi; you can watch fish being broken down. The Deluxe sashimi platter is worth it, and sushi, wagyu sashimi, corn, salmon don and teriyaki chicken are all good. About $40 per person, great value.", "ae": "Westfield Miranda"}, {"n": "钓鱼郎私人厨房 Fishboy Private Kitchen", "a": "Telopea", "t": "粤菜", "r": "3", "p": 30, "pe": 0, "d": "走地鸡、梅菜扣肉、椰汁栗子芋头煲、冻柠茶", "i": "粤菜小馆，走地鸡很嫩，梅菜扣肉香。最惊艳的是椰汁栗子芋头煲，芋头粉糯，椰汁香甜浓郁，很下饭。冻柠茶和苦瓜蜜瓜饮也好喝。每桌配核桃仁和XO酱小菜，店里也有独立包装出售。人均约30刀。", "dt": "2025-08-31", "c": "zh", "xy": [294.7, 326.4], "ne": "Fishboy Private Kitchen", "te": "Cantonese", "de": "Free-range chicken, preserved mustard pork belly, coconut chestnut taro pot, iced lemon tea", "ie": "Cantonese eatery with tender free-range chicken and fragrant pork belly with preserved mustard greens. The standout is the coconut chestnut taro pot: floury taro in rich sweet coconut milk, great with rice. Iced lemon tea and bitter melon honeydew drink are good. Walnuts and XO sauce come with every table and are sold packaged. About $30 per person.", "ae": "Telopea"}, {"n": "Johnny's Pizza & Pasta", "a": "West Pennant Hills", "t": "Pizza", "r": "3", "p": 28, "pe": 1, "d": "Meat Pizza", "i": "号称有悉尼最大尺寸Pizza的Pizza店，生意很忙。Meat Pizza底部铺了一层咸牛肉末，每一口都很香。", "dt": "2025-08-31", "c": "west", "xy": [286.4, 200.0], "ne": "Johnny's Pizza & Pasta", "te": "Pizza", "de": "Meat pizza", "ie": "Pizza shop claiming Sydney's biggest pizzas, always busy. The meat pizza has a layer of savoury minced beef on the base, flavourful in every bite.", "ae": "West Pennant Hills"}, {"n": "富强面包店 King's Hot Bread", "a": "Hurstville", "t": "越南包", "r": "4", "p": 13.5, "pe": 0, "d": "脆皮猪五花越南包", "i": "Hurstville的人气越南包，在悉尼排得上名次，常要排队。脆皮猪五花越南包13.5刀，略贵但好吃，现场吃很惊艳，隔天用空气炸锅复热依然好吃，可以算悉尼前三名。", "dt": "2025-08-31", "c": "asia", "xy": [449.6, 874.9], "ne": "King's Hot Bread", "te": "Banh mi", "de": "Crispy pork belly banh mi", "ie": "Popular Hurstville banh mi, ranked among Sydney's best and often with a queue. The crispy pork roll is $13.50, a bit pricier but delicious; amazing fresh and still good reheated in an air fryer the next day. Easily top three in Sydney.", "ae": "Hurstville"}, {"n": "乐乐酥 Lebakery", "a": "Chatswood Place（Eastwood也有）", "t": "中式烘焙", "r": "3", "p": 10, "pe": 1, "d": "咸蛋黄贝果、黑芝麻碱水包、芋头酥", "i": "从Eastwood开到Chatswood Place的中式烘焙，店面更大。咸蛋黄贝果、黑芝麻碱水包和芋头酥都好吃，芋头酥最值得买。下午货架容易空。", "dt": "2025-08-30", "c": "bake", "xy": [644.7, 328.0], "ne": "Lebakery", "te": "Chinese bakery", "de": "Salted egg bagel, black sesame pretzel bun, taro pastry", "ie": "Chinese bakery from Eastwood, now in a bigger shop at Chatswood Place. Salted egg bagels, black sesame pretzel buns and taro pastry are all good, the taro pastry especially. Shelves empty by afternoon.", "ae": "Chatswood icious. $19 a slice, pricey. The ceramics even show fingerprints, very charming.", "ae": "Darling Square"}, {"n": "Brookelyn Donuts", "a": "Westfield Chatswood", "t": "甜甜圈", "r": "2", "p": 8, "pe": 1, "d": "Strawberry Matcha甜甜圈", "i": "在悉尼有9家分店的甜甜圈店，开到Chatswood了，口味很多。Strawberry Matcha里草莓酱很多，非常甜。", "dt": "2025-07-25", "c": "bake", "xy": [652.3, 319.3], "ne": "Brookelyn Donuts", "te": "Doughnuts", "de": "Strawberry matcha doughnut", "ie": "Doughnut chain with nine Sydney stores, now in Chatswood, with many flavours. The strawberry matcha is loaded with strawberry jam, very sweet.", "ae": "Westfield Chatswood"}, {"n": "Zappi's Pizzeria Cafe", "a": "Epping", "t": "Pizza/烤肉", "r": "3", "p": 28, "pe": 1, "d": "Pizza、烤肉", "i": "Pizza和烤肉店，Pizza好吃，烤肉烤得很焦很黑，但意外地也好吃。", "dt": "2025-07-22", "c": "west", "xy": [400.5, 268.8], "ne": "Zappi's Pizzeria Cafe", "te": "Pizza / grill", "de": "Pizza, grilled meats", "ie": "Pizza and grill shop. Good pizza, and grilled meats charred very dark yet surprisingly tasty.", "ae": "Epping"}, {"n": "曹氏鸭脖", "a": "Waterloo", "t": "鸭货", "r": "3", "p": 20, "pe": 1, "d": "鸭掌、鸭胗（广东宝宝辣）", "i": "国内连锁鸭货品牌，悉尼也能买到。辣度很高，宝宝辣都相当辣，但很香。鸭货傍晚容易卖光，鸭掌和鸭胗都好吃，适合配啤酒。", "dt": "2025-07-20", "c": "zh", "xy": [729.5, 671.2], "ne": "Cao's Duck Neck", "te": "Braised duck", "de": "Duck feet, gizzards (Cantonese baby spicy)", "ie": "Chinese chain of spicy braised duck now in Sydney. Very hot; even the mildest level is fiery, but very fragrant. Stock sells out by evening; duck feet and gizzards are great with beer.", "ae": "Waterloo"}, {"n": "Merry Pops", "a": "Waterloo", "t": "Gelato", "r": "3", "p": 9, "pe": 1, "d": "Soursop口味、Gelato千层酥", "i": "需要排队的Gelato店，也卖冰棒，口味很特别，例如味道接近释迦的刺果番荔枝Soursop。店里有Live Gelato房间，点Gelato千层酥会现场制作。", "dt": "2025-07-21", "c": "bake", "xy": [733.3, 659.8], "ne": "Merry Pops", "te": "Gelato", "de": "Soursop gelato, gelato mille-feuille", "ie": "Gelato shop with queues, also selling ice pops with unusual flavours like soursop, close to custard apple. A li
