<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>悉尼吃喝地图</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700;6..72,800&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--sub:#6b6b6b;--line:#141414;--hair:#dcdcdc;--red:#b42a1f;
--S:#b42a1f;--R:#141414;--N:#9b9b9b;--X:#ffffff;--serif:"Newsreader","Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.6 var(--sans)}
header{text-align:center;padding:18px 14px 6px}
header .top{display:flex;justify-content:space-between;font:500 10px var(--sans);letter-spacing:.18em;color:var(--sub);margin-bottom:10px}
header h1{font:900 34px/1.05 var(--serif);margin:0;letter-spacing:.04em}
header{position:relative}.lang{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:1px solid var(--ink);font:500 12px var(--sans);letter-spacing:.08em;padding:5px 9px;color:var(--ink);cursor:pointer}
header h1 i{font-style:normal;color:var(--red)}
header .dek{font:400 13px var(--serif);color:var(--sub);margin-top:6px}
.tabs{display:flex;justify-content:center;gap:28px;margin:10px 0 0;border-top:1px solid var(--line);padding-top:8px}
.tabs button{border:0;background:none;padding:2px 0 6px;font:500 12px var(--sans);letter-spacing:.2em;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.filters{border-bottom:1px solid var(--line);padding:2px 0 6px}
.row{display:flex;overflow-x:auto;padding:4px 10px;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
#cats{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 4px;margin-top:4px}
.chip{flex:none;border:0;background:none;padding:9px 12px;font:500 12px var(--sans);letter-spacing:.12em;color:var(--ink);display:flex;align-items:center;gap:5px}
#cats .chip+.chip{border-left:1px solid var(--hair)}
.chip .n{display:none}
.chip.cat.on{color:var(--red);box-shadow:inset 0 -2px 0 var(--red)}
#rates .chip,#years .chip{padding:5px 9px;font-size:11.5px;color:var(--sub)}
#rates .chip{color:var(--ink)}
#prices{padding:0 8px}#prices .chip{padding:6px 10px;font-size:12px}
.chip .stars{font-size:11px;letter-spacing:0;margin-right:2px}.chip .stars.x{font-size:13px;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--ink)}
.chip.off{opacity:.3}
#years .chip.cat.on{box-shadow:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:4px}
#years{border-top:1px solid var(--hair)}
#search{margin:6px 14px 2px;width:calc(100% - 28px);border:0;border-bottom:1px solid var(--line);padding:8px 2px;font:15px var(--serif);background:none;border-radius:0}
#mapWrap{position:relative;height:calc(100dvh - 178px);min-height:380px;overflow:hidden;background:#e9eef0;touch-action:none}
#map{width:100%;height:100%;display:block;user-select:none}
.ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column}
.ctrl button{width:36px;height:36px;border:1px solid var(--ink);background:#fff;font-size:18px;color:var(--ink);margin-top:-1px}
.note{position:absolute;left:10px;bottom:52px;right:60px;transition:opacity .6s;font:400 12px var(--serif);color:var(--ink);background:#fff;padding:5px 9px;border-left:3px solid var(--red)}
.jump{position:absolute;left:0;right:0;bottom:10px;display:flex;overflow-x:auto;padding:0 10px;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--ink);background:#fff;padding:6px 11px;font:500 11.5px var(--sans);letter-spacing:.1em;color:var(--ink);margin-left:-1px}
.legend{position:absolute;left:10px;top:10px;background:#fff;border:1px solid var(--ink);padding:6px 9px;font:500 11px var(--sans);letter-spacing:.1em;line-height:1.9}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);margin-right:6px;vertical-align:-1px}
#list{padding:0 16px 48px;display:none}
.sec h2{font:500 11px var(--sans);letter-spacing:.22em;margin:26px 0 0;padding:8px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.sec h2 .dot{display:none}
.sec h2 span{color:var(--sub);letter-spacing:.1em}
.lead-story{padding:18px 0 16px;border-bottom:1px solid var(--ink)}
.lead-story .k{font:500 11px var(--sans);letter-spacing:.18em;color:var(--red)}
.lead-story b{display:block;font:900 30px/1.15 var(--serif);margin:6px 0 8px}
.lead-story .q{font:400 17px/1.6 var(--serif);color:#333}
.lead-story .m{font:500 11px var(--sans);letter-spacing:.12em;color:var(--sub);margin-top:10px}
.card{padding:14px 0;border-bottom:1px solid var(--hair)}
.card .k{font:500 10.5px var(--sans);letter-spacing:.18em;color:var(--red)}
.card b{display:block;font:600 19px/1.3 var(--serif);margin:3px 0 4px}
.card .intro{font:400 14px/1.65 var(--serif);color:#444;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font:500 10.5px var(--sans);letter-spacing:.12em;color:var(--sub);margin-top:6px}
.empty{color:var(--sub);text-align:center;padding:40px 0;font-family:var(--serif)}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.2s}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);padding:16px 20px calc(24px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
#sheet.on{transform:none}
#sheet .grab{display:none}
#sheet .x{position:absolute;right:14px;top:12px;border:0;background:none;font:500 11px var(--sans);letter-spacing:.18em;color:var(--sub)}
#sheet h3{font:700 24px/1.3 var(--serif);margin:4px 50px 6px 0}
#sheet .rate{font:400 18px/1 var(--serif);letter-spacing:2px;color:var(--red);margin:2px 0 8px}#sheet .rate .st0{color:#ddd}#sheet .rate.r4{color:#e0703a}#sheet .rate.r3{color:#141414}#sheet .rate.r2{color:#4f7fb0}#sheet .rate.rX{color:#a8a8a8}
#sheet .m{font:400 13px/1.6 var(--serif);color:var(--sub);padding-bottom:12px;border-bottom:1px solid var(--line)}
#sheet .body{font:400 16px/1.85 var(--serif);margin:14px 0 0;color:var(--ink)}
#sheet .must{margin-top:14px;font:400 16px/1.85 var(--serif);color:var(--ink)}
.go{display:block;text-align:center;margin-top:20px;padding:12px;background:var(--red);color:#fff;text-decoration:none;font:400 15px var(--serif)}

.search2{display:none}
.vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 0 4px}
.vhead b{display:block;font:700 17px/1.4 var(--serif);color:var(--ink)}
.vhead span{display:block;font:400 12.5px/1.5 var(--serif);color:var(--sub);margin-top:2px}
.vhead button{flex:none;background:none;border:1px solid var(--ink);padding:6px 12px;font:500 12px var(--sans);letter-spacing:.06em;cursor:pointer;color:var(--ink)}
.vhead button:hover{background:var(--ink);color:#fff}
.empty{padding:28px 0;font:400 14px/1.7 var(--serif);color:var(--sub)}
#pins g{cursor:pointer}
@media (min-width:1000px){.card{cursor:pointer}.card:hover b{color:var(--red)}}
@media (min-width:1000px){
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  .tabs{display:none}
  #main{flex:1;min-height:0;display:flex}
  #mapWrap{flex:1;height:auto;min-height:0}
  #side{width:420px;flex:none;border-left:2px solid var(--ink);overflow-y:auto;background:#fff}
  #list{display:block!important;padding:0 20px 48px}
  .search2{display:block;width:calc(100% - 40px);margin:14px 20px 0;padding:9px 12px;border:1px solid var(--ink);font:400 14px var(--serif);background:#fff;box-sizing:border-box}
  #search{display:none!important}
  #sheet{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-top:none;border-left:3px solid var(--ink);transform:translateX(105%)}
  #sheet.on{transform:none}
  #mask{background:rgba(0,0,0,.12)}
  .note{right:auto;max-width:460px}
}

#spin{display:none;position:relative;overflow:hidden;min-height:calc(100vh - 120px);padding:26px 10px 150px;--neon:#ff3b2f;--neon2:#ffcf4a;--gold:#d8b25a;
  background:radial-gradient(ellipse 90% 55% at 50% 0%,rgba(255,59,47,.30),transparent 70%),radial-gradient(ellipse 70% 40% at 50% 100%,rgba(255,207,74,.14),transparent 70%),#080606;color:#f4efe6}
.rays{position:absolute;left:50%;top:300px;width:1800px;height:1800px;margin:-900px 0 0 -900px;pointer-events:none;opacity:.10;
  background:repeating-conic-gradient(from 0deg,var(--neon2) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:rot 60s linear infinite;transition:opacity .5s}
#spin.run .rays{animation-duration:5s;opacity:.2}#spin.won5 .rays{opacity:.55;animation-duration:8s}
@keyframes rot{to{transform:rotate(360deg)}}
.floor{position:absolute;left:0;right:0;bottom:0;height:220px;pointer-events:none;background:linear-gradient(transparent,rgba(0,0,0,.7)),repeating-linear-gradient(90deg,rgba(255,207,74,.05) 0 2px,transparent 2px 60px)}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.sp-in{position:relative;max-width:560px;margin:0 auto}
.stage{display:flex;align-items:flex-start}
/* cabinet */
.cab{position:relative;flex:1;min-width:0;border-radius:120px 120px 18px 18px/56px 56px 18px 18px;padding:10px;
  background:linear-gradient(90deg,#8a8f96,#f2f4f6 8%,#9aa0a7 16%,#e9ecef 50%,#9aa0a7 84%,#f2f4f6 92%,#8a8f96);
  box-shadow:0 0 0 1px #2a2c30,0 0 60px -6px var(--neon),0 40px 70px rgba(0,0,0,.75)}
.cab-in{position:relative;border-radius:112px 112px 12px 12px/50px 50px 12px 12px;padding:12px 12px 14px;
  background:radial-gradient(ellipse at 50% 0%,#7a1a12 0%,transparent 60%),linear-gradient(90deg,#3d0a06,#8e1a10 20%,#b02315 50%,#8e1a10 80%,#3d0a06);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 14px rgba(0,0,0,.5)}
.cab.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}.cab.bump{animation:bump .16s ease}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px) rotate(-.6deg)}40%,60%{transform:translate(7px,-1px) rotate(.6deg)}}
@keyframes bump{50%{transform:translateY(3px)}}
/* topper sign */
.sign{position:relative;border-radius:96px 96px 10px 10px/42px 42px 10px 10px;padding:16px 14px 12px;background:#0b0503;
  box-shadow:inset 0 0 0 3px #c9a24a,inset 0 0 0 5px #3a2508,inset 0 10px 30px rgba(255,59,47,.18)}
.bulbs{display:flex;justify-content:space-between;padding:0 10px}
.bulbs i{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#7a5a28,#3a2810);animation:bulb 1.4s linear infinite}
@keyframes bulb{0%,30%{background:radial-gradient(circle at 35% 35%,#fff,#ffd24a 45%,#c98a10);box-shadow:0 0 8px 2px var(--neon2),0 0 20px var(--neon2)}31%,100%{background:radial-gradient(circle at 35% 35%,#7a5a28,#3a2810);box-shadow:none}}
.run .bulbs i{animation-duration:.42s}
.won .bulbs i{animation:bulbw .3s steps(1) infinite!important}
@keyframes bulbw{0%{background:#ff5a44;box-shadow:0 0 10px 3px var(--neon)}50%{background:#ffe27a;box-shadow:0 0 10px 3px var(--neon2)}}
#spT{font:900 38px/1.1 var(--serif);margin:12px 0 12px;text-align:center;color:#fff6ea;letter-spacing:.1em;white-space:nowrap;
  text-shadow:0 0 3px #fff,0 0 10px var(--neon),0 0 22px var(--neon),0 0 46px var(--neon),0 0 90px var(--neon);animation:flick 7s infinite}
#spT.en{font-size:23px;letter-spacing:.03em}.lev.front .arm{z-index:4}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.4;text-shadow:0 0 4px var(--neon)}}
/* reel bay */
.bay{position:relative;margin-top:14px;border-radius:12px;padding:8px;background:linear-gradient(#c7ccd2,#7d838a 45%,#e3e6ea);box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 1px 0 #fff}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px 8px 6px;border-radius:7px;background:#050302;box-shadow:inset 0 8px 18px #000,inset 0 0 0 1px #000}
.rl{font:700 10px var(--sans);letter-spacing:.22em;color:var(--neon2);text-align:center;margin:0 0 5px;text-shadow:0 0 8px var(--neon2)}
.win{height:174px;overflow:hidden;position:relative;border-radius:4px;background:linear-gradient(90deg,#9e978a,#f3ecdd 22%,#fffaf0 50%,#f3ecdd 78%,#9e978a)}
.win::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.4) 24%,transparent 38%,transparent 62%,rgba(0,0,0,.4) 76%,rgba(0,0,0,.88) 100%)}
.win::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;z-index:3;background:var(--neon);box-shadow:0 0 6px var(--neon),0 0 14px var(--neon);opacity:.6}
.glass{position:absolute;inset:0;border-radius:7px;pointer-events:none;z-index:4;background:linear-gradient(112deg,rgba(255,255,255,.22) 0,rgba(255,255,255,.06) 22%,transparent 23%,transparent 60%,rgba(255,255,255,.07) 61%,transparent 72%)}
.arw{position:absolute;top:calc(50% + 8px);z-index:5;width:0;height:0;border:9px solid transparent;margin-top:-9px;filter:drop-shadow(0 0 6px var(--neon))}
.arw.l{left:-2px;border-left:11px solid var(--neon)}.arw.r{right:-2px;border-right:11px solid var(--neon)}
.win{perspective:420px;perspective-origin:50% 50%}
.drum{position:absolute;left:0;right:0;top:50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px;font:800 15px/1.15 var(--serif);color:#1a1210;overflow-wrap:break-word;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(90deg,#b5ad9c,#f6efdf 20%,#fffaf0 50%,#f6efdf 80%,#b5ad9c);box-shadow:inset 0 1px 0 rgba(60,40,20,.18),inset 0 -1px 0 rgba(255,255,255,.6)}
.face.sm{font-size:12.5px;line-height:1.2}.face.st{font-size:13px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.reel.blur .face{filter:blur(1.8px)}
.tube{position:absolute;top:118px;bottom:64px;width:5px;border-radius:3px;z-index:2;background:repeating-linear-gradient(180deg,#fff3c4 0 6px,var(--neon2) 6px 12px,var(--neon) 12px 18px,transparent 18px 26px);background-size:100% 52px;
  animation:tube 1.2s linear infinite;box-shadow:0 0 10px var(--neon2),0 0 22px var(--neon)}
.tube.l{left:3px}.tube.r{right:3px}@keyframes tube{to{background-position:0 52px}}.run .tube{animation-duration:.22s}.won .tube{animation:tubew .25s steps(1) infinite}
@keyframes tubew{50%{opacity:.2}}
.stage{-webkit-box-reflect:below 4px linear-gradient(transparent 80%,rgba(255,255,255,.16))}
#flash{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle,#fff,#ffe9a6 40%,rgba(255,207,74,0) 75%);opacity:0}
#flash.on{animation:flash .9s ease-out}@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#spm{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;padding:28px 16px}
#spm.on{display:flex}
.spm-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(90,14,8,.72),rgba(0,0,0,.9));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fin .35s ease}
@keyframes fin{from{opacity:0}}
.spm-wrap{position:relative;width:100%;max-width:440px;perspective:1100px}
.spm-rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,207,74,.55) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 8%,transparent 60%);mask:radial-gradient(circle,#000 8%,transparent 60%);animation:rot 14s linear infinite}
#spm.r5 .spm-rays{opacity:.9}#spm.r4 .spm-rays{opacity:.45}
#spmC{position:relative;max-height:calc(100vh - 70px);overflow:visible}
.spm-x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(216,178,90,.6);background:rgba(0,0,0,.4);color:#f4efe6;font-size:16px;line-height:1;cursor:pointer;z-index:2}
.strip{will-change:transform,filter}
.strip div{height:58px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px;font:800 15px/1.15 var(--serif);color:#1a1210;overflow-wrap:break-word;border-bottom:1px solid rgba(60,40,20,.12)}
.strip div.sm{font-size:12.5px;line-height:1.2}
.strip div.st{font-size:13px;letter-spacing:-1px;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.reel.blur .strip{filter:blur(2.4px)}
.reel.hit .win{animation:hit .5s ease}
@keyframes hit{0%{box-shadow:0 0 0 3px var(--neon2),0 0 26px var(--neon2)}100%{box-shadow:0 0 0 0 transparent}}
.won .win{box-shadow:0 0 0 2px var(--neon2),0 0 18px var(--neon2)}
.reel.locked .win{box-shadow:0 0 0 3px #ffb020,0 0 18px #ffb020}
/* hold buttons */
.lock{display:block;width:100%;margin-top:8px;border-radius:5px;padding:7px 0 6px;cursor:pointer;font:800 11px var(--sans);letter-spacing:.12em;color:#5a3a10;
  background:linear-gradient(#fff3c8,#e9b94a 55%,#b9831f);border:0;box-shadow:0 3px 0 #6b4a12,0 4px 6px rgba(0,0,0,.6),inset 0 1px 0 #fff;transition:transform .08s}
.lock:active{transform:translateY(2px);box-shadow:0 1px 0 #6b4a12}
.reel.locked .lock{background:linear-gradient(#fff,#ffd35a 40%,#ff9d0a);color:#3a1a00;box-shadow:0 1px 0 #6b4a12,0 0 16px #ffb020,inset 0 1px 0 #fff;transform:translateY(2px)}
.lock:disabled{filter:grayscale(.8) brightness(.55);cursor:default}
/* LED */
.led{position:relative;margin:12px 0 0;height:44px;border-radius:6px;background:#0a0000;overflow:hidden;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 2px #2b0c06,inset 0 3px 10px #000,0 1px 0 rgba(255,255,255,.2)}
#ledT{font:900 19px/1 "Courier New",var(--sans);letter-spacing:.18em;color:#ffb020;text-shadow:0 0 6px #ff8a00,0 0 14px #ff5a00;white-space:nowrap}
.led::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 1.1px,rgba(10,0,0,.55) 1.6px);background-size:3px 3px}
.led.blink #ledT{animation:ledb .35s steps(1) infinite}@keyframes ledb{50%{opacity:.15}}
.led.scroll #ledT{animation:ledsc 1.1s linear infinite}@keyframes ledsc{from{transform:translateX(30%)}to{transform:translateX(-30%)}}
.snd{position:absolute;right:6px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;border:0;background:#1d0804;color:#ffb020;font-size:12px;cursor:pointer;z-index:3}
/* spin button */
.pb{margin:14px 0 0;padding:6px;border-radius:16px;background:linear-gradient(#f2f4f6,#8a8f96 50%,#d9dde1);box-shadow:0 4px 10px rgba(0,0,0,.6)}
#pull{position:relative;overflow:hidden;display:block;width:100%;padding:15px;border-radius:11px;border:0;cursor:pointer;
  background:radial-gradient(ellipse at 50% 0%,#ffb3a3,transparent 55%),linear-gradient(180deg,#ff5d45,#e0200f 50%,#8f1208);color:#fff;font:900 22px var(--serif);letter-spacing:.4em;text-shadow:0 2px 0 rgba(0,0,0,.4);
  box-shadow:0 6px 0 #4e0703,inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(255,59,47,.55);transition:transform .08s}
#pull::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
#pull:active{transform:translateY(5px);box-shadow:0 1px 0 #4e0703}
#pull:disabled{filter:saturate(.5) brightness(.75)}

/* ===== unified with /eat/ homepage: no rounded shapes, no italics ===== */
:root{--ink:#141414;--sub:#7a7772;--g1:#f4f3f1;--g2:#eceae6;--line:#e4e2de;--hair:#e4e2de;--red:#d6342a;--coral:#ef5b3f;--serif:"Noto Serif SC","Songti SC",serif;--zh:"Noto Serif SC","Songti SC",serif;--sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif}
*,*::before,*::after{border-radius:0!important;font-style:normal!important}
html body{font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:var(--sans)}
/* header */
html body header{position:relative!important;top:auto;left:auto;right:auto;display:block;padding:0;text-align:left;background:#fff;border-bottom:1px solid var(--line);z-index:60;pointer-events:auto;flex:none}
html body header>*{pointer-events:auto}
header .hd{max-width:none;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:10px}
header .logo{display:flex;align-items:center;gap:9px;font:900 19px var(--zh);color:var(--ink);text-decoration:none;white-space:nowrap}
header .logo>i{width:18px;height:18px;background:var(--red);display:block}
header #h1 i{color:var(--red)}
header #h1 span{display:inline}
html body header .nav.dnav{display:none!important}
header .hr{display:flex;align-items:center;gap:14px;margin-left:auto}
header .bk{border:0;background:var(--ink);color:#fff;font:500 14px var(--sans);padding:10px 16px;margin:0;overflow:visible;display:block;gap:0;text-align:center;cursor:pointer;white-space:nowrap;transition:background .2s}
header .bk:hover{background:var(--red)}
#menu,#nav,#navMask{display:none!important}
@media(max-width:999px){header .hd{padding:0 16px;height:56px}header .logo{font-size:18px}}

/* map */
html body[data-v=map] #mapWrap{height:calc(100dvh - 56px)}
@media(min-width:1000px){html body #main{flex:1;min-height:0}html body[data-v=map] #mapWrap{height:auto}}
html body #fbar{top:0;padding:12px 14px 16px}
@media(min-width:1000px){html body #fbar{top:0;left:6px}}
.fb{height:38px;border:1px solid var(--line)!important;background:#fff!important;color:var(--ink)!important;box-shadow:0 1px 2px rgba(0,0,0,.04)!important;font:500 13px var(--sans)!important;letter-spacing:0!important}
.fb.main{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.fb .bd{background:var(--red)!important}
html body .ctrl{top:64px;border:1px solid var(--line);box-shadow:none;background:#fff}
@media(min-width:1000px){html body .ctrl{top:14px;right:480px}}
.ctrl button{color:var(--ink);background:#fff}
.ctrl button:hover{background:var(--g1)}
.jump button{border:1px solid var(--line)!important;background:#fff;color:var(--ink);font:500 12px var(--sans)!important;letter-spacing:0!important;margin-left:-1px}
.jump button:hover{background:var(--g1)}
.note{font:400 12px var(--sans)!important;border:1px solid var(--line)!important;background:#fff!important;color:var(--sub)!important}
#toast{border:1px solid var(--line)!important;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)!important}

/* side list (desktop) + list view */
@media(min-width:1000px){
 html body #side{top:0;right:0;bottom:0;width:460px;border:0;border-left:1px solid var(--line);box-shadow:none}
}
.search2,.fs-q,#search{background:var(--g1)!important;border:1px solid transparent!important;font:400 15px var(--sans)!important;height:46px;padding:0 16px!important}
.search2:focus,.fs-q:focus,#search:focus{outline:none;border-color:var(--ink)!important;background:#fff!important}
.sec h2{font:700 13px var(--sans)!important;letter-spacing:.04em!important;border-top:2px solid var(--ink)!important;border-bottom:1px solid var(--line)!important;padding:12px 0 10px!important}
.sec h2 span{letter-spacing:0!important}
#list h3,#list .li h3,#list b{font-family:var(--zh)}
#peek{border-top:1px solid var(--line)!important;box-shadow:0 -10px 30px -18px rgba(0,0,0,.25)!important}
#peek .grab,#fsheet .grab,#sheet .grab{width:36px;height:3px;background:var(--g2)}
#peek .ph b{font:700 16px var(--zh)!important}
#peek .ph span{letter-spacing:0!important;color:var(--red)!important}
#toMap{height:46px;padding:0 20px;border:0!important;background:var(--ink)!important;color:#fff!important;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)!important;font:500 14px var(--sans)}

/* filter sheet */
#fsheet{border:0!important;border-top:1px solid var(--line)!important;box-shadow:0 -20px 50px -20px rgba(0,0,0,.3)}
@media(min-width:1000px){#fsheet{top:64px!important;left:20px!important;border:1px solid var(--line)!important;box-shadow:0 30px 60px -30px rgba(0,0,0,.35)}}
.fs-h b{font:900 24px var(--zh)!important}
.fs-h button{color:var(--sub)!important;letter-spacing:0!important}
.fs-l{font:700 12px var(--sans)!important;letter-spacing:.04em!important;color:var(--ink)!important}
.fs-l:first-of-type{border-top:1px solid var(--line)!important}
.fs-c{gap:6px!important}
.fs-c button{height:38px;padding:0 14px;border:0!important;background:var(--g1)!important;color:var(--ink)!important;font:500 13px var(--sans)!important;letter-spacing:0!important}
.fs-c button:hover{background:var(--g2)!important}
.fs-c button.on{background:var(--ink)!important;color:#fff!important}
.fs-go{height:52px;border:0!important;background:var(--ink)!important;font:500 15px var(--sans)!important;letter-spacing:.02em!important}
.fs-go:hover{background:var(--red)!important}

/* detail sheet */
#sheet{border-top:1px solid var(--line)!important;box-shadow:0 -20px 50px -20px rgba(0,0,0,.3)}
@media(min-width:1000px){#sheet{border:0!important;border-left:1px solid var(--line)!important;box-shadow:-30px 0 60px -30px rgba(0,0,0,.3)}}
#sheet h3{font:900 26px/1.3 var(--zh)!important}
#sheet .rate{color:var(--red)}
#sheet .m{font:400 13px/1.6 var(--sans)!important;border-bottom:1px solid var(--line)!important}
#sheet .body,#sheet .must{font:400 16px/1.85 var(--zh)!important}
#sheet .x{font:500 13px var(--sans)!important;letter-spacing:0!important}
#sheet a{border-radius:0}

/* party */
#party{padding:8px 16px 48px}
.pt-w{max-width:560px}
.pt-h{font:900 clamp(34px,7vw,48px)/1.1 var(--zh)!important;margin:28px 0 10px!important}
.pt-sub{font:400 15px/1.7 var(--sans)!important}
#party input,#party textarea{background:var(--g1)!important;border:1px solid transparent!important;height:46px;font:400 15px var(--sans)!important}
#party input:focus{outline:none;border-color:var(--ink)!important;background:#fff!important}
#party label,#party .pt-l,#party h4{letter-spacing:.02em!important}
#party button:not(.sw-i):not(.pt-share){border-color:transparent}
#party .fs-c button,#party .pt-c button{background:var(--g1)!important;border:0!important}
#party .fs-c button.on,#party .pt-c button.on{background:var(--ink)!important;color:#fff!important}
.pt-share{height:44px;border:1px solid var(--line)!important;background:#fff;font:500 14px var(--sans)!important;letter-spacing:0!important}
.pt-share.p{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff}
.pt-mem span{background:var(--g1)!important}
.pt-mem span.me{background:var(--ink)!important}
.pt-big{border:1px solid var(--line)!important;background:var(--g1)}
.pt-big b{font-family:var(--zh)!important}
.pt-r .t b{font-family:var(--zh)!important}
.pt-res h3{letter-spacing:.04em!important;color:var(--ink)!important;font-weight:700!important;border-top:2px solid var(--ink)!important}
.pt-qr{border:1px solid var(--line)!important}
.pt-err{border-color:var(--red)!important}

/* party cards, same as homepage cards */
.sw-card.nc{background:#fff!important;box-shadow:0 22px 50px -26px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06)!important;display:flex;flex-direction:column}
.sw-card.nc .sw-bars,.sw-card.nc .sw-emo,.sw-card.nc .sw-info{display:none!important}
.nc-top{flex:0 0 46%;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.nc-top .ty{align-self:flex-start;font:500 13px var(--sans);opacity:.8}
.nc-top .dish{font:900 clamp(26px,7vw,36px)/1.15 var(--zh)}
.nc-bt{flex:1;padding:18px 20px 20px;display:flex;flex-direction:column;min-height:0}
.nc-bt .nm{font:900 22px/1.3 var(--zh);color:var(--ink)}
.nc-bt .mt{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font:400 13px var(--sans);color:var(--sub)}
.nc-bt .st{color:var(--red);letter-spacing:1px}.nc-bt .st .o{opacity:.22}
.nc-bt .ds{margin:12px 0 0;font:400 14px/1.7 var(--sans);color:#55524d;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sw-card.nc .sw-i{position:absolute;right:14px;bottom:14px;top:auto;left:auto;width:auto;height:auto;padding:7px 12px;background:var(--g1)!important;color:var(--ink)!important;border:0!important;font:500 12px var(--sans)!important;box-shadow:none!important}
.sw-card.nc .stamp{top:24px;font-family:var(--sans)!important;background:#fff}
.sw-card.nc.n1{filter:none!important}.sw-card.nc.n2{filter:none!important}
.sw-btns button{box-shadow:none!important;border:1px solid var(--line)!important;background:#fff!important}
.sw-btns .b-no{color:var(--ink)!important}.sw-btns .b-lk{color:var(--red)!important}.sw-btns .b-su{color:var(--coral)!important}.sw-btns .b-rw{color:var(--sub)!important}

/* removed views stay unreachable */
#home,#spin,#swipe,#brawl,#spm,#swMatch{display:none!important}
.pt-share{white-space:nowrap;padding:0 14px}
.pt-code{letter-spacing:.04em!important;font:500 13px var(--sans)!important}

/* ===== header menu button + drawer (shared) ===== */
.mb{width:40px;height:40px;margin-left:-8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:0;background:none;cursor:pointer;flex:none}

.mb:hover i:first-child{transform:translateX(-3px)}.mb:hover i:last-child{transform:translateX(3px)}
#dr{position:fixed;inset:0;z-index:200;pointer-events:none}

#dr .dr-p{position:absolute;left:0;top:0;bottom:0;width:min(460px,100%);background:#fff;transform:translateX(-102%);transition:transform .6s cubic-bezier(.2,.85,.15,1);display:flex;flex-direction:column;overflow-y:auto}
#dr.on{pointer-events:auto}#dr.on .dr-bg{opacity:1}#dr.on .dr-p{transform:none}

.dr-h .logo b{color:var(--red);margin-left:-9px}
.dr-x{border:0;background:none;font:500 14px var(--sans);color:var(--sub);cursor:pointer;padding:8px 0}.dr-x:hover{color:var(--ink)}
.dr-n{flex:1;padding:14px 24px 24px;display:flex;flex-direction:column}
.dr-n a{position:relative;display:grid;grid-template-columns:44px 1fr auto;align-items:baseline;padding:20px 0 18px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .6s cubic-bezier(.2,.85,.15,1)}
#dr.on .dr-n a{opacity:1;transform:none}
#dr.on .dr-n a:nth-child(1){transition-delay:.08s}#dr.on .dr-n a:nth-child(2){transition-delay:.12s}#dr.on .dr-n a:nth-child(3){transition-delay:.16s}#dr.on .dr-n a:nth-child(4){transition-delay:.2s}#dr.on .dr-n a:nth-child(5){transition-delay:.24s}#dr.on .dr-n a:nth-child(6){transition-delay:.28s}
.dr-n em{font:500 12px var(--sans);color:var(--sub);font-style:normal;letter-spacing:.04em}
.dr-n b{font:900 clamp(30px,8vw,40px)/1.05 var(--zh);letter-spacing:-.01em;transition:color .25s,transform .4s cubic-bezier(.2,.85,.15,1);display:inline-block}
.dr-n span{grid-column:2/4;font:400 13px var(--sans);color:var(--sub);margin-top:6px}

.dr-n a:hover b{color:var(--red);transform:translateX(6px)}.dr-n a:hover::after{opacity:1;transform:none}

.dr-f .lk{border:1px solid var(--line);background:#fff;padding:7px 12px;font:500 13px var(--sans);color:var(--ink);cursor:pointer}.dr-f .lk:hover{border-color:var(--ink)}
/* ===== spin + brawl ===== */
.xv{display:none;padding:0 20px 90px}

.xw{max-width:720px;margin:0 auto}

.xc-bt{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}

.xres-a{display:flex;gap:10px;margin-top:14px}

.xb:hover{border-color:var(--ink)}
.xb.k{background:var(--ink);color:#fff;border-color:var(--ink)}.xb.k:hover{background:var(--red);border-color:var(--red)}

.xs-sec{border-top:1px solid var(--line);padding:18px 0 20px}

.xch{display:flex;flex-wrap:wrap;gap:6px}

<script>
const D=[{"n": "Homeway", "a": "Burwood", "t": "山东菜", "r": "3", "p": 40, "pe": 0, "d": "山东炒鸡（需提前一天预订）、老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子、山东大馒头", "i": "Burwood的山东菜馆，招牌山东炒鸡需要提前一天预订，辣度极高，在悉尼的川湘菜里也少见，但辣得很香很下饭。其余菜式基本不辣，老济南溜三样、干煸肥肠、拔丝地瓜、风味茄子、猪肉大葱饺子和个头饱满的山东大馒头都做得很好。人均约40刀。", "dt": "2026-11-17", "c": "zh", "xy": [457.9, 592.5], "ne": "Homeway", "te": "Shandong", "de": "Shandong stir-fried chicken (order a day ahead), Jinan triple stir-fry, dry-fried pork intestine, candied sweet potato, eggplant, pork and leek dumplings, Shandong steamed buns", "ie": "Shandong restaurant in Burwood. The signature stir-fried chicken must be ordered a day ahead and is fiercely hot, hotter than most Sichuan or Hunan places in Sydney, but fragrant and great with rice. Everything else is mild: the Jinan triple stir-fry, dry-fried intestine, candied sweet potato, eggplant, pork and leek dumplings and the big fluffy Shandong buns are all excellent. About $40 per person.", "ae": "Burwood"}, {"n": "YUNJOY 山喜云南小馆", "a": "Zetland", "t": "云南菜", "r": "2", "p": 37, "pe": 0, "d": "傣味油呛双脆、红三剁、番茄酥皮牛腩", "i": "开在Zetland居民楼下的云南小馆，装修朴实。傣味油呛双脆味道在线，不过只有黄喉够脆，毛肚偏软烂。鹿茸菇山野走地鸡是雷，鸡肉没有嚼劲，汤汁多而不香。红三剁很下饭，番茄酥皮牛腩带一点辣味，是意外的惊喜。整体中规中矩，人均约37刀。", "dt": "2026-11-16", "c": "zh", "xy": [731.6, 684.4], "ne": "YUNJOY Yunnan Kitchen", "te": "Yunnan", "de": "Dai-style crispy tripe duo, chopped pork with chilli, tomato beef brisket under puff pastry", "ie": "Simple Yunnan eatery under an apartment block in Zetland. The Dai-style tripe duo is well seasoned, though only the aorta is crunchy and the tripe is soft. The free-range chicken with mushrooms misses: chewy-less meat in a bland broth. The chopped pork with chilli is great with rice, and the tomato beef brisket with a touch of heat is a pleasant surprise. Middling overall, about $37 per person.", "ae": "Zetland"}, {"n": "Molly Tea 茉莉奶白", "a": "Burwood", "t": "奶茶/蛋挞", "r": "3", "p": 9, "pe": 1, "d": "蛋挞（原味、抹茶、巧克力、大溪地香草）", "i": "茉莉奶白新推出的蛋挞，有原味、大溪地香草、抹茶和巧克力四种口味，香草味常常早早售罄。酥皮很脆，蛋挞心软嫩，抹茶和巧克力的表层味道浓郁。个头大，一个就很饱，价格不便宜。队伍看着短，实际也要等半小时左右，排队时可以看到现场制作过程。", "dt": "2026-11-14", "c": "bake", "xy": [454.9, 589.8], "ne": "Molly Tea", "te": "Milk tea / egg tarts", "de": "Egg tarts (original, matcha, chocolate, Tahitian vanilla)", "ie": "Molly Tea's new egg tarts come in original, Tahitian vanilla, matcha and chocolate; vanilla often sells out early. Crisp pastry, silky custard, rich matcha and chocolate tops. Large enough that one fills you up, but not cheap. The line looks short yet takes about half an hour; you can watch them being made while you wait.", "ae": "Burwood"}, {"n": "Yakiniku Yokocho 烧肉横丁", "a": "Burwood", "t": "日式烤肉", "r": "3", "p": 40, "pe": 0, "d": "29.8刀 Express Lunch BBQ Set（两款和牛加牛舌）、刺身", "i": "日式炭火烤肉店，午市有29.8刀的Express Lunch BBQ Set，可选三种肉，和牛和牛舌都很值，每款大约五块，女生吃刚好。炭火烤得很香。豚骨拉面一般，刺身不是强项但够新鲜。只吃午餐套餐最省钱，加点刺身和饮料人均也不超过50刀。", "dt": "2026-11-13", "c": "jp", "xy": [458.4, 598.3], "ne": "Yakiniku Yokocho 烧肉横丁", "te": "Japanese BBQ", "de": "$29.80 Express Lunch BBQ Set (two wagyu cuts plus tongue), sashimi", "ie": "Charcoal yakiniku with a $29.80 Express Lunch BBQ Set: pick three meats, about five pieces each. Wagyu and ox tongue are great value and the charcoal makes everything fragrant. The tonkotsu ramen is average; sashimi is not their speciality but fresh. The lunch set alone is the best deal; even with sashimi and drinks it stays under $50 per person.", "ae": "Burwood"}, {"n": "Maria's Bakery Inn 超羣饼屋", "a": "Burwood", "t": "港式西饼屋", "r": "3", "p": 8, "pe": 1, "d": "菠萝包（原味、咖啡、椰丝、奶黄、菠萝粒）", "i": "开了很多年的老式港式西饼屋，产品和陈列都很有九十年代的味道，以菠萝包出名，有人称它是悉尼最好吃的菠萝包。口味很多，原味、咖啡、椰丝、奶黄，还有夹真菠萝粒的版本。买回家夹上煎蛋和午餐肉，就是酥脆满足的港式早餐。", "dt": "2026-11-13", "c": "bake", "xy": [462.2, 586.9], "ne": "Maria's Bakery Inn", "te": "Hong Kong bakery", "de": "Pineapple buns (original, coffee, coconut, custard, real pineapple)", "ie": "Old-school Hong Kong bakery with a very nineties feel, famous for what some call Sydney's best pineapple bun. Flavours include original, coffee, coconut, custard and one with real pineapple pieces. Take a few home and fill them with fried egg and Spam for a crisp, satisfying Hong Kong breakfast.", "ae": "Burwood"}, {"n": "宗师麻辣烫", "a": "Melrose Park（Melrose Central）", "t": "麻辣干锅/麻辣烫/炸串", "r": "3", "p": 40, "pe": 0, "d": "麻辣干锅、麻辣烫、特价炸串", "i": "Melrose Park的Melrose Central商场里的麻辣烫店，同时做麻辣干锅和炸串，食材选择丰富，炸串常有特价，可以把干锅、麻辣烫和炸串一次吃齐。商场环境舒服。人均约40刀。", "dt": "2026-11-11", "c": "zh", "xy": [376.3, 396.1], "ne": "Zongshi Malatang", "te": "Mala dry pot / malatang / skewers", "de": "Mala dry pot, malatang, discounted fried skewers", "ie": "Malatang shop in Melrose Central, Melrose Park, also doing mala dry pot and fried skewers, with a wide choice of ingredients. Skewers are often discounted, so you can have all three in one meal. Pleasant shopping centre setting. About $40 per person.", "ae": "Melrose Park（Melrose Central）"}, {"n": "小妹弄堂 Show Mei Alley", "a": "Rhodes Central", "t": "台式锅贴", "r": "2", "p": 18, "pe": 1, "d": "高丽菜铁板猪肉锅贴、三鲜冰花大虾、梅渍山药、红茶豆乳", "i": "据说源自台北西门町的锅贴店，开业初期每天排队，周末等餐约15到20分钟。招牌是高丽菜铁板猪肉锅贴和三鲜冰花大虾锅贴，煎得很香，只是略咸。梅渍山药酸甜开胃，红茶豆乳也好喝。一人吃快50刀，不算便宜，路过可以试，不必专程。", "dt": "2026-11-09", "c": "zh", "xy": [413.2, 443.6], "ne": "Show Mei Alley", "te": "Taiwanese potstickers", "de": "Cabbage and pork potstickers, prawn potstickers with lace crust, plum-pickled yam, black tea soy milk", "ie": "Potsticker shop said to originate from Ximending, Taipei; it had daily queues at opening, with a 15 to 20 minute wait on weekends. The cabbage pork and prawn potstickers are fragrant though a bit salty. Plum-pickled yam is a tangy starter and the black tea soy milk is nice. Nearly $50 per person, so worth a try if passing but not a special trip.", "ae": "Rhodes Central"}, {"n": "HoonSikDang", "a": "Rhodes", "t": "韩国汤面/饺子", "r": "3", "p": 40, "pe": 0, "d": "辣汤面、韩式饺子（猪肉、泡菜）、冷面", "i": "Rhodes火车站附近的韩国面馆，专做汤面和饺子。辣汤面比不辣拉面和冷面更出色，面不是手工的，但汤头味道很足。韩式饺子个大扎实，有猪肉和泡菜两种馅，吃两个就半饱。人均约40刀就能吃得很饱。", "dt": "2026-11-09", "c": "kr", "xy": [410.1, 440.8], "ne": "HoonSikDang", "te": "Korean noodle soup / dumplings", "de": "Spicy noodle soup, Korean dumplings (pork, kimchi), cold noodles", "ie": "Korean noodle shop near Rhodes station specialising in noodle soups and dumplings. The spicy noodle soup beats the mild ramen and cold noodles; not hand-made noodles but a flavourful broth. The dumplings are big and solid, pork or kimchi, and two make you half full. About $40 per person for a very full meal.", "ae": "Rhodes"}, {"n": "九爷火锅鸡", "a": "Central Park（Chippendale）", "t": "沧州火锅鸡", "r": "3", "p": 34, "pe": 0, "d": "88刀排骨火锅鸡（够三人）", "i": "沧州火锅鸡，份量很大，88刀的排骨火锅鸡够三个人吃。先吃排骨和鸡肉，再加水涮火锅，店里有免费自助的蔬菜和蘸料台，豆腐、面条随便拿，非常实惠。鸡肉和排骨都很嫩很下饭，服务员态度特别好。人均约34刀，吃不完还可以打包。", "dt": "2026-11-04", "c": "zh", "xy": [707.9, 621.1], "ne": "Jiuye Hotpot Chicken", "te": "Cangzhou hotpot chicken", "de": "$88 pork rib hotpot chicken (feeds three)", "ie": "Cangzhou-style hotpot chicken in huge portions; the $88 pork rib and chicken pot feeds three. Eat the ribs and chicken first, then add water and cook hotpot with the free self-serve vegetables, tofu, noodles and dipping sauces. Tender, rice-friendly meat and very friendly staff. About $34 per person, and leftovers can be packed.", "ae": "Central Park（Chippendale）"}, {"n": "Sumibi Yakiniku（原 Kashiwa 柏）", "a": "Crows Nest", "t": "日式炭火烤肉", "r": "5", "p": 50, "pe": 0, "d": "辣味Rib、姜葱牛舌", "i": "原来的Kashiwa柏，搬到马路对面后改名Sumibi。炭火烤得香，和牛肉质出色。推荐专攻Rib和牛舌两个部位，各点不同口味，辣味Rib和姜葱牛舌最好吃，又香又嫩。人均约50刀，以亲民的价格吃到好肉。", "dt": "2026-11-03", "c": "jp", "xy": [721.1, 430.9], "ne": "Sumibi Yakiniku (formerly Kashiwa)", "te": "Japanese charcoal BBQ", "de": "Spicy rib, ox tongue with spring onion and ginger", "ie": "Formerly Kashiwa, renamed Sumibi after moving across the road. Charcoal grilling and excellent wagyu. Focus on rib and tongue in different marinades: the spicy rib and the ginger spring onion tongue are the best, fragrant and tender. About $50 per person for top quality meat at a friendly price.", "ae": "Crows Nest"}, {"n": "老张好运现烤牛肉干", "a": "Ryde（Top Ryde图书馆对面）", "t": "牛肉干外带", "r": "3", "p": 20, "pe": 1, "d": "胸口油、半肥半瘦（拌薯片、辣油、孜然）", "i": "Top Ryde图书馆对面的现烤牛肉干店，与其说是牛肉干，不如说是多汁的烤牛肉，一点都不干。推荐胸口油和半肥半瘦两个部位，拌上薯片、辣油和孜然，瘦肉有嚼劲，肥肉够香。老板试吃给得很大方。价格偏高，300克约67刀，可冷藏保存约5天。", "dt": "2026-10-31", "c": "zh", "xy": [463.2, 392.9], "ne": "Lao Zhang Fresh Roasted Beef Jerky", "te": "Beef jerky takeaway", "de": "Brisket fat cut, half lean half fat (tossed with chips, chilli oil and cumin)", "ie": "Freshly roasted beef jerky opposite Top Ryde library; really juicy roast beef rather than dry jerky. Try the brisket fat and the half lean, half fat cuts tossed with potato chips, chilli oil and cumin: chewy lean meat, rich fat. Generous tastings. Pricey at about $67 for 300 g; keeps around five days in the fridge.", "ae": "Ryde (opposite Top Ryde library)"}, {"n": "KatsuiE", "a": "Eastwood", "t": "日式炸猪排", "r": "5", "p": 35, "pe": 0, "d": "Tenderloin、Loin、芝士猪排", "i": "现点现炸的日式猪排饭，做法很接近大阪的猪排店。Tenderloin里肉微微粉嫩，咬下去肉汁四溢；Loin油脂香更浓；芝士猪排拉丝，非常罪恶。配粗盐、现磨山葵和芥末酱，一块猪排能吃出几种味道，从头到尾不腻。人均约35刀，值得反复回访。", "dt": "2026-10-27", "c": "jp", "xy": [397.4, 320.0], "ne": "KatsuiE", "te": "Japanese tonkatsu", "de": "Tenderloin, loin, cheese katsu", "ie": "Tonkatsu fried to order, very close to the style of Osaka katsu shops. The tenderloin is slightly pink inside and bursts with juice; the loin has more fat and flavour; the cheese katsu oozes. Season with coarse salt, freshly grated wasabi and mustard so every piece tastes different. About $35 per person and worth repeat visits.", "ae": "Eastwood"}, {"n": "老回民", "a": "Burwood", "t": "新疆菜", "r": "5", "p": 50, "pe": 0, "d": "烤羊排、大盘土鸡加皮带面、韭菜拌面", "i": "Burwood的新疆菜老店，重新装修后水准依旧。烤羊排可以说是悉尼数一数二，不肥不腻，有嚼劲又嫩到冒汁，没有膻味，蘸辣椒面和孜然吃。大盘鸡也是硬菜，记得加一份皮带面泡在汤汁里。韭菜拌面油润有韧性。人均约50刀，份量大，很容易吃撑还要打包。", "dt": "2026-10-25", "c": "zh", "xy": [449.8, 594.0], "ne": "Lao Hui Min Hand Made Ramen", "te": "Xinjiang", "de": "Grilled lamb ribs, big plate chicken with belt noodles, chive mixed noodles", "ie": "Long-running Xinjiang restaurant in Burwood, as good as ever after renovation. The grilled lamb ribs are among Sydney's best: not greasy, chewy yet juicy, no gaminess, dipped in chilli and cumin. Big plate chicken is a must; add belt noodles to soak the sauce. Chive mixed noodles are glossy and springy. About $50 per person, huge portions, expect leftovers.", "ae": "Burwood"}, {"n": "Minimal Coffee", "a": "Crows Nest", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "Cold Brew、巴斯克", "i": "街边的小咖啡店，适合天气好的时候坐在路边喝一杯。Cold Brew甘苦清爽，巴斯克蛋糕是惊喜，很香又不太奶，和Cold Brew搭配刚好。", "dt": "2026-10-24", "c": "cafe", "xy": [718.0, 428.2], "ne": "Minimal Coffee", "te": "Coffee", "de": "Cold brew, Basque cheesecake", "ie": "Small street-side coffee shop, nice for sitting outside on a sunny day. The cold brew is bittersweet and clean, and the Basque cheesecake is a surprise: fragrant without being too milky, a perfect match for the cold brew.", "ae": "Crows Nest"}, {"n": "Manpuku", "a": "Chatswood", "t": "日式拉面", "r": "5", "p": 33, "pe": 0, "d": "Long Name Signature（细面）、蘸面（粗面）", "i": "悉尼人气很高的日式拉面店，多年来价格涨得不多，很有良心。汤底是鸡骨和猪骨混合的高汤，浓郁不腻。面条筋道爽滑，会按拉面款式搭配粗细：Long Name Signature配细面，蘸面配粗面。在悉尼的日式拉面里稳居前列，人均约33刀。", "dt": "2026-10-24", "c": "jp", "xy": [660.5, 339.0], "ne": "Manpuku", "te": "Japanese ramen", "de": "Long Name Signature (thin noodles), tsukemen (thick noodles)", "ie": "Very popular ramen shop that has barely raised prices over the years. The broth blends chicken and pork bone: rich but not heavy. Noodles are springy and matched to each bowl: thin for the Long Name Signature, thick for the tsukemen. One of Sydney's top ramen shops, about $33 per person.", "ae": "Chatswood"}, {"n": "Jin Guk", "a": "Macquarie Park（MQ Centre外）", "t": "韩国汤饭", "r": "3", "p": 33, "pe": 0, "d": "猪肉汤饭、辣牛肉汤饭、牛肉饼烤菇、虾Pancake", "i": "Macquarie Centre外面的韩国汤饭店，最近小有名气，傍晚五点多到不用排，很快就坐满。菜单简单，四款汤饭、四款小菜和四款饮料。猪肉汤饭里还有面条，辣牛肉汤饭汤底也不错，米饭稍软。小菜里牛肉饼烤菇和虾饼好吃，饺子一般。饭后送肉桂冰淇淋。人均约33刀，以这个环境来说很合理。", "dt": "2026-10-22", "c": "kr", "xy": [500.0, 275.7], "ne": "Jin Guk", "te": "Korean soup and rice", "de": "Pork soup rice, spicy beef soup rice, beef patty with mushrooms, prawn pancake", "ie": "Korean gukbap shop outside Macquarie Centre, recently popular; arrive just after 5 pm to avoid a wait. Simple menu of four soups, four sides and four drinks. The pork soup also has noodles, the spicy beef broth is good, rice slightly soft. Beef patty with mushrooms and prawn pancake are good; dumplings average. Cinnamon ice cream after the meal. About $33 per person, fair for the setting.", "ae": "Macquarie Park (outside Macquarie Centre)"}, {"n": "Margot Osteria", "a": "Barrack St, CBD", "t": "意大利菜", "r": "X", "p": 80, "pe": 0, "d": "提拉米苏", "i": "市中心的意大利餐厅，正餐表现一般：烤鸡偏干，牛排配的薯条炸过头，烤虾也柴。全场最佳是提拉米苏，绵软浓郁，可以专门来外带提拉米苏，正餐可以跳过。人均约80刀。", "dt": "2026-10-22", "c": "west", "xy": [728.9, 567.2], "ne": "Margot Osteria", "te": "Italian", "de": "Tiramisu", "ie": "CBD Italian with a disappointing main menu: dry roast chicken, overcooked fries with the steak and tough prawns. The highlight is the tiramisu, soft and rich; come for tiramisu takeaway and skip the meal. About $80 per person.", "ae": "Barrack St, CBD"}, {"n": "PST Pizza Studio Tamaki", "a": "George St, CBD", "t": "日式Pizza", "r": "3", "p": 40, "pe": 0, "d": "Five cheese pizza with honey、提拉米苏", "i": "东京六本木名厨玉置翼开的日式Pizza店。饼底用发酵30小时的面团和冲绳矿物盐，柴火炉高温烘烤，外皮微焦有香气，口感轻盈软糯。口味独特，有咸甜口的五种芝士配蜂蜜Pizza。甜品提拉米苏非常出色，一定要点。人均约40刀能吃得很饱，适合人多一起来，多点几款分着吃。", "dt": "2026-10-20", "c": "west", "xy": [725.9, 564.4], "ne": "PST Pizza Studio Tamaki", "te": "Japanese-style pizza", "de": "Five cheese pizza with honey, tiramisu", "ie": "Japanese-style pizza from Roppongi chef Tsubasa Tamaki. The dough is fermented 30 hours, uses Okinawan mineral salt and is baked in a wood-fired oven: lightly charred, light and soft. Unique toppings such as five cheese with honey. The tiramisu is outstanding, do not skip it. About $40 per person; best with a group to share several pizzas.", "ae": "George St, CBD"}, {"n": "宗师炸串", "a": "Macquarie Centre", "t": "炸串", "r": "4", "p": 20, "pe": 1, "d": "金丝鸡排、牛肉串、包浆豆腐、豆皮金针菇", "i": "Macquarie Centre美食区里最值得吃的炸串摊。金丝鸡排必点，金黄酥脆的外皮裹着鲜嫩鸡肉，撒满孜然和辣椒面。牛肉串、鸡肉串、青椒、豆皮金针菇、包浆豆腐、年糕都可以自选，连蔬菜都炸得好吃。", "dt": "2026-10-19", "c": "zh", "xy": [497.0, 272.9], "ne": "Zongshi Fried Skewers", "te": "Fried skewers", "de": "Golden shredded chicken cutlet, beef skewers, molten tofu, tofu skin with enoki", "ie": "The best fried skewer stall in the Macquarie Centre food court. The golden chicken cutlet is a must: crunchy coating, juicy chicken, loads of cumin and chilli. Pick from beef, chicken, green pepper, tofu skin with enoki, molten tofu and rice cake; even the vegetables are great fried.", "ae": "Macquarie Centre"}, {"n": "香港冰室", "a": "Eastwood", "t": "茶餐厅", "r": "3", "p": 22, "pe": 1, "d": "茄汁炒通心粉配猪扒、滑蛋炸鸡排饭、咖央西多士", "i": "港式茶餐厅，现炒锅气足。茄汁炒通心粉配开心猪扒很受小朋友欢迎，滑蛋炸鸡排饭的鸡排鲜嫩多汁。甜品推荐咖央西多士，咖央酱和西多士结合得很好。如今悉尼做得好的茶餐厅不多，值得珍惜。", "dt": "2026-10-19", "c": "zh", "xy": [394.3, 317.3], "ne": "Hong Kong Café", "te": "Cha chaan teng", "de": "Tomato macaroni with pork chop, scrambled egg fried chicken rice, kaya French toast", "ie": "Hong Kong café with real wok heat. Tomato macaroni with pork chop is a kids' favourite, and the fried chicken cutlet on scrambled egg rice is juicy. For dessert, the kaya French toast is a great combination. Good cha chaan tengs are rare in Sydney now, so this one is worth cherishing.", "ae": "Eastwood"}, {"n": "Sho Kaisendon", "a": "Crows Nest", "t": "海鲜丼/日料", "r": "5", "p": 70, "pe": 0, "d": "炸生蚝、烤牛舌、Saiko Don、鹅肝和牛鳗鱼釜饭、Yuzu Sorbet", "i": "Lane Cove人气寿司店Sho Sushi在Crows Nest开的海鲜丼店。前菜炸生蚝和烤牛舌都很出色。Saiko Don有海胆、Tuna、大虾、Kingfish、三文鱼、Otoro、鱼籽、带子和鲷鱼，非常新鲜丰盛。更惊喜的是釜饭，鹅肝、和牛、鳗鱼和鱼籽一起焖，口感浓郁。饭后Yuzu Sorbet清新解腻。人均约70刀。", "dt": "2026-10-08", "c": "jp", "xy": [721.6, 436.7], "ne": "Sho Kaisendon", "te": "Kaisendon / Japanese", "de": "Fried oysters, grilled ox tongue, Saiko Don, foie gras wagyu eel kamameshi, yuzu sorbet", "ie": "Kaisendon shop in Crows Nest from the popular Lane Cove sushi bar Sho Sushi. Fried oysters and grilled tongue are excellent starters. The Saiko Don has uni, tuna, prawn, kingfish, salmon, otoro, roe, scallop and snapper: very fresh and abundant. The surprise is the kamameshi with foie gras, wagyu, eel and roe, very rich. Yuzu sorbet to finish. About $70 per person.", "ae": "Crows Nest"}, {"n": "Lanxi Kitchen 蓝曦食堂", "a": "Rhodes（原香蕉小馆位置）", "t": "砂锅米线", "r": "3", "p": 28, "pe": 0, "d": "砂锅米线、卤肥肠、奥尔良烤鸡腿", "i": "Rhodes新开的砂锅米线店，原香蕉小馆的位置。砂锅上桌时还在冒泡，红油和白骨汤翻滚，米线吸饱汤汁，爽滑软糯，配料给得足，砂锅保温，从头吃到尾都是热的。卤肥肠和奥尔良烤鸡腿也很入味。人均约28刀，很划算。", "dt": "2026-10-08", "c": "zh", "xy": [413.7, 449.4], "ne": "Lanxi Kitchen", "te": "Claypot rice noodles", "de": "Claypot rice noodles, braised intestine, Orleans grilled chicken leg", "ie": "New claypot rice noodle shop in Rhodes, in the old BananaLa space. The pot arrives bubbling with chilli oil and white bone broth; the noodles soak up the soup, smooth and soft, with generous toppings, and the claypot keeps it hot to the end. Braised intestine and Orleans chicken leg are well seasoned. About $28 per person, great value.", "ae": "Rhodes (former BananaLa site)"}, {"n": "Soho Korean Chinese Restaurant", "a": "Lidcombe", "t": "韩式中华料理", "r": "3", "p": 40, "pe": 0, "d": "炸酱面、辣汤面、糖醋肉、糖渍小番茄", "i": "韩式中华料理，网上上千条评价、评分4.9。炸酱面和辣汤面都很入味，嗦起来很过瘾。糖醋肉炸得出色，里面的猪肉非常嫩。前菜的糖渍小番茄比蟹脚好吃。人均约40刀，吃得开心又饱。", "dt": "2026-10-08", "c": "kr", "xy": [307.9, 551.3], "ne": "Soho Korean Chinese Restaurant", "te": "Korean-Chinese", "de": "Jjajangmyeon, spicy noodle soup, sweet and sour pork, candied cherry tomatoes", "ie": "Korean-Chinese restaurant with over a thousand reviews at 4.9. The black bean noodles and spicy noodle soup are very flavourful and satisfying. The sweet and sour pork is expertly fried with very tender meat. The candied tomato starter beats the crab claws. About $40 per person, happy and full.", "ae": "Lidcombe"}, {"n": "鼎氏牛大 Lanzhou Beef Hand Pulled Noodles", "a": "Rhodes（火车站对面）", "t": "兰州牛肉面/新疆菜", "r": "5", "p": 18, "pe": 1, "d": "炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子", "i": "Rhodes火车站对面的兰州牛肉面馆，新疆老板加了一整套新疆菜单，常有新疆老乡来吃，味道可以信赖。炒烤肉、羊排抓饭、羊肉炒面、新疆炒米粉、羊蹄、虎皮青椒茄子都很好吃。份量很大，按人数点菜就够了。", "dt": "2026-10-07", "c": "zh", "xy": [417.5, 438.0], "ne": "Lanzhou Beef Hand Pulled Noodles", "te": "Lanzhou beef noodles / Xinjiang", "de": "Stir-fried kebab meat, lamb rib pilaf, lamb fried noodles, Xinjiang fried rice noodles, lamb trotters, blistered peppers with eggplant", "ie": "Lanzhou beef noodle shop opposite Rhodes station whose Xinjiang owner added a full Xinjiang menu; Xinjiang diners eat here often, a good sign. Stir-fried kebab meat, lamb rib pilaf, lamb fried noodles, Xinjiang fried rice noodles, lamb trotters and blistered peppers with eggplant are all great. Portions are big; one dish per person is plenty.", "ae": "Rhodes (opposite the station)"}, {"n": "Bakery Cafe Cael", "a": "Lidcombe", "t": "甜品", "r": "2", "p": 14, "pe": 1, "d": "地瓜蛋糕", "i": "Lidcombe的韩式烘焙甜品店，招牌地瓜蛋糕表现一般。", "dt": "2026-10-08", "c": "bake", "xy": [304.9, 548.6], "ne": "Bakery Cafe Cael", "te": "Desserts", "de": "Sweet potato cake", "ie": "Korean bakery café in Lidcombe; the signature sweet potato cake is only average.", "ae": "Lidcombe"}, {"n": "Meg Meg", "a": "Glebe", "t": "甜品", "r": "3", "p": 14, "pe": 1, "d": "提拉米苏", "i": "Glebe的甜品店，提拉米苏非常好吃，值得专程去买。", "dt": "2026-10-08", "c": "bake", "xy": [673.7, 598.9], "ne": "Meg Meg", "te": "Desserts", "de": "Tiramisu", "ie": "Glebe dessert shop with a superb tiramisu, worth a special trip.", "ae": "Glebe"}, {"n": "Smoked By Million Chicken", "a": "West Ryde", "t": "韩式熏鸡", "r": "3", "p": 35, "pe": 0, "d": "Galbi口味熏鸡（每日限量）、紫菜饭团、芝士玉米", "i": "West Ryde新开的韩式熏鸡店。每天限量的Galbi口味熏鸡，鸡肉腌制24小时，辣椒粉由14种香料调成，肉质很嫩，带焦香和烟熏味，比炸鸡更耐吃。紫菜饭团和芝士玉米混在一起吃很香。吃腻了炸鸡可以来试试。人均约35刀。", "dt": "2026-10-05", "c": "kr", "xy": [421.1, 367.6], "ne": "Smoked By Million Chicken", "te": "Korean smoked chicken", "de": "Galbi smoked chicken (limited daily), seaweed rice balls, corn cheese", "ie": "New Korean smoked chicken shop in West Ryde. The daily-limited galbi chicken is marinated 24 hours in a 14-spice chilli blend: tender, charred and smoky, easier to eat than fried chicken. Mix the seaweed rice balls with corn cheese. A good change if you are tired of fried chicken. About $35 per person.", "ae": "West Ryde"}, {"n": "Cucina Porto", "a": "The Star（Pyrmont）", "t": "意大利菜", "r": "5", "p": 100, "pe": 0, "d": "馕配辣酱和Salami、烤虾、海鲜Pasta、提拉米苏", "i": "The Star里出乎意料地出色的意大利餐厅。烤得圆鼓鼓的面包配辣酱和Salami很好吃；烤虾嫩到一碰就脱壳；海鲜Pasta用料很有诚意；提拉米苏浓郁湿润，大力推荐。人均约100刀，份量足，很适合看演出前后来吃。", "dt": "2026-10-03", "c": "west", "xy": [697.4, 564.0], "ne": "Cucina Porto", "te": "Italian", "de": "Puffy flatbread with chilli and salami, grilled prawns, seafood pasta, tiramisu", "ie": "Surprisingly excellent Italian inside The Star. Puffy bread with chilli sauce and salami is delicious; the grilled prawns slip from the shell; the seafood pasta is generous; the tiramisu is rich and moist, highly recommended. About $100 per person, generous portions, ideal before or after a show.", "ae": "The Star（Pyrmont）"}, {"n": "Ormeggio at the Spit", "a": "Mosman", "t": "意大利菜/海景", "r": "2", "p": 165, "pe": 0, "d": "小kingfish挞、炖牛排、生蚝、烤章鱼taco", "i": "The Spit海边的意大利餐厅，正对海湾游艇和对岸豪宅，景色是最大卖点。冬季有四道菜半价的Winter Special。前菜小Kingfish挞和主菜炖牛排都不错，但不算惊艳。整体溢价明显，就算半价也不太值，分数主要来自环境。人均约165刀。", "dt": "2026-10-03", "c": "west", "xy": [831.6, 361.2], "ne": "Ormeggio at the Spit", "te": "Italian / waterfront", "de": "Kingfish tartlet, braised beef, oysters, grilled octopus taco", "ie": "Waterfront Italian at the Spit facing yachts and harbourside mansions; the view is the main draw. A winter special offers four courses at half price. The kingfish tartlet and braised beef are good but not memorable. Clearly overpriced even at half price; the setting earns most of the score. About $165 per person.", "ae": "Mosman"}, {"n": "The Gidley", "a": "King St, CBD", "t": "牛排馆", "r": "5", "p": 120, "pe": 0, "d": "小面包、烤牛舌、招牌双层汉堡、牛排", "i": "出了名神秘的牛排馆，入口是隐蔽的木门，先经过昏暗的Bar区，用餐区会亮堂一些。店家礼貌地请客人上交手机，好好吃饭聊天，收手机前服务员会帮忙拍合照。小面包松软，两款蘸酱浓郁；烤牛舌毫无腥味；招牌汉堡是双层牛肉饼加太阳蛋；牛排更是极为出色。性价比很高，两人食物约160刀，含酒约240刀。姐妹店BISTECCA同样收手机。", "dt": "2026-09-25", "c": "west", "xy": [729.5, 573.0], "ne": "The Gidley", "te": "Steakhouse", "de": "Bread rolls, grilled ox tongue, signature double burger, steak", "ie": "Famously secretive steakhouse: enter through a hidden wooden door and a dim bar to a brighter dining room. Guests are politely asked to hand in their phones to focus on the meal, and staff take a group photo first. Soft rolls with two rich dips, tongue with no gaminess, a signature double patty burger with fried egg, and outstanding steak. Great value: about $160 food for two, $240 with wine. Sister venue Bistecca also collects phones.", "ae": "King St, CBD"}, {"n": "The Grill at The International", "a": "Martin Place（MLC大楼）", "t": "扒房/西餐", "r": "3", "p": 110, "pe": 0, "d": "烤鸡翅、虾多士、巧克力舒芙蕾配伯爵冰淇淋", "i": "MLC大楼里的扒房，菜品摆盘精致，环境偏简洁，不是传统Fine Dining那种华丽。前菜烤鸡翅和虾多士好吃又漂亮，鸭肝酱偏奶偏腥。主菜牛排和意面略咸。甜品巧克力舒芙蕾值得点，流心巧克力和伯爵冰淇淋融在一起很好吃。人均约110刀。", "dt": "2026-09-25", "c": "west", "xy": [736.8, 560.9], "ne": "The Grill at The International", "te": "Grill / Western", "de": "Grilled chicken wings, prawn toast, chocolate soufflé with Earl Grey ice cream", "ie": "Grill in the MLC Centre with refined plating and a simple room rather than lavish fine dining. Chicken wings and prawn toast are tasty and pretty; the duck liver pâté is milky and gamey. Steak and pasta mains are a bit salty. Order the chocolate soufflé with Earl Grey ice cream. About $110 per person.", "ae": "Martin Place (MLC Centre)"}, {"n": "Yo-chi", "a": "Macquarie Centre", "t": "酸奶冰淇淋", "r": "3", "p": 9, "pe": 1, "d": "自选酸奶冰淇淋", "i": "Macquarie Centre的酸奶冰淇淋店，自选配料，店里送贴纸，还有投乒乓球赢优惠券的小游戏，适合带小朋友。", "dt": "2026-09-24", "c": "bake", "xy": [500.5, 281.5], "ne": "Yo-chi", "te": "Frozen yoghurt", "de": "Self-serve frozen yoghurt", "ie": "Frozen yoghurt at Macquarie Centre with self-serve toppings, free stickers and a ping-pong toss game for discount vouchers. Great with kids.", "ae": "Macquarie Centre"}, {"n": "海滋味海鲜茶楼 Oceanic Tastes", "a": "Rhodes", "t": "粤式海鲜酒楼", "r": "3", "p": 50, "pe": 0, "d": "沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、咸鱼蒸肉饼", "i": "Rhodes的粤式海鲜酒楼，适合家庭聚会。沙姜鸡、清蒸带子、新加坡辣椒蟹、猪肚鸡汤、荔蓉香酥鸭、金衣豆腐、咸鱼蒸肉饼都不错，份量很大。服务员热情靠谱，带蛋糕来过生日还会送寿桃。门口有小区游乐场，小朋友可以去玩。人均不到50刀。", "dt": "2026-09-19", "c": "zh", "xy": [405.0, 445.0], "ne": "Oceanic Tastes", "te": "Cantonese seafood", "de": "Sand ginger chicken, steamed scallops, Singapore chilli crab, pork tripe chicken soup, taro crispy duck, salted fish pork patty", "ie": "Cantonese seafood restaurant in Rhodes, good for family gatherings. Sand ginger chicken, steamed scallops, chilli crab, pork tripe chicken soup, taro duck, golden tofu and salted fish pork patty are all good, in big portions. Warm, reliable service; they even give longevity buns for birthdays. A playground outside keeps kids busy. Under $50 per person.", "ae": "Rhodes"}, {"n": "Kura Ichi", "a": "Haymarket（Market City对面）", "t": "海鲜丼", "r": "3", "p": 50, "pe": 0, "d": "Take档海鲜丼加温泉蛋", "i": "Market City对面街角开了几十年的日料店，近年转型专做海鲜丼，很成功。Take这一档基本涵盖各种鱼，一碗就很满足，额外的Otoro容易腻。建议加一颗温泉蛋，味道更好；茶泡饭的茶汤一般，可以不点。份量大，丰俭由人，人均约50刀。", "dt": "2026-09-19", "c": "jp", "xy": [721.1, 598.9], "ne": "Kura Ichi", "te": "Kaisendon", "de": "Take grade kaisendon with onsen egg", "ie": "Decades-old Japanese spot on the corner opposite Market City, now successfully focused on seafood rice bowls. The Take grade covers most fish and is very satisfying; extra otoro gets too rich. Add an onsen egg; skip the ochazuke broth. Big portions, from modest to lavish, about $50 per person.", "ae": "Haymarket (opposite Market City)"}, {"n": "Kiddo Coffee", "a": "Surry Hills", "t": "咖啡/菠萝包", "r": "3", "p": 10, "pe": 1, "d": "菠萝包、Yuzu Cold Brew", "i": "最近小火的港风菠萝包咖啡店，在悉尼满街卷牛角包的时候另辟蹊径。热门组合是菠萝包配一杯特调，Yuzu Cold Brew酸甜，能平衡菠萝包的甜腻，但咖啡味偏淡。菠萝包本身和西饼屋的差不多，胜在现场加热，面包松软，甜酥皮很脆。", "dt": "2026-09-19", "c": "cafe", "xy": [739.5, 621.1], "ne": "Kiddo Coffee", "te": "Coffee / pineapple buns", "de": "Pineapple bun, Yuzu cold brew", "ie": "Trending café pairing Hong Kong pineapple buns with specialty drinks, a niche amid Sydney's croissant craze. The Yuzu cold brew is sweet and tangy and cuts the bun's sweetness, though the coffee is weak. The bun itself is like any bakery's but heated to order: soft bread, crisp sugar crust.", "ae": "Surry Hills"}, {"n": "Carlingford Village 新开台湾菜（未具名）", "a": "Carlingford", "t": "台湾菜", "r": "2", "p": 40, "pe": 1, "d": "", "i": "Carlingford Village新开的台湾菜，味道一般，有些失望。", "dt": "2026-09-17", "c": "zh", "xy": [310.5, 291.5], "ne": "New Taiwanese restaurant, Carlingford Village (unnamed)", "te": "Taiwanese", "de": "", "ie": "A new Taiwanese restaurant in Carlingford Village; average and a bit disappointing.", "ae": "Carlingford"}, {"n": "Catalina", "a": "Rose Bay", "t": "海景Fine Dining", "r": "4", "p": 160, "pe": 1, "d": "三文鱼刺身、牛肉饺子、乳猪、Snapper、牙鱼蒸饺", "i": "Rose Bay海边的Fine Dining，景色无敌：对岸矮房、帆船游艇、水上飞机和往来的轮渡尽收眼底，菜品也比几年前进步很多。两道菜Set Menu里，三文鱼刺身、牛肉饺子、乳猪和Snapper都好吃，单点的牙鱼蒸饺和小包菜也出色。适合天气好的日子来庆祝。", "dt": "2026-09-17", "c": "west", "xy": [886.8, 570.4], "ne": "Catalina", "te": "Waterfront fine dining", "de": "Salmon sashimi, beef dumplings, suckling pig, snapper, toothfish dumplings", "ie": "Rose Bay fine dining with an unbeatable view of yachts, seaplanes and ferries, and food that has improved a lot in recent years. In the two-course set, the salmon sashimi, beef dumplings, suckling pig and snapper are all good, and the toothfish dumplings and baby cabbage extras shine. Ideal for a celebration on a fine day.", "ae": "Rose Bay"}, {"n": "潮公馆", "a": "Chatswood", "t": "潮州菜", "r": "3", "p": 72, "pe": 0, "d": "卤味拼盘、果肉、芋泥、墨鱼丸、炒米粉", "i": "正宗度很高的潮州菜馆。卤味拼盘非常出色，味道很对，把鸭换成鹅就和潮州本地一样。少见的潮州小吃粿肉也有，地道。芋泥复刻度很高，只差一勺葱珠油。双丸汤里墨鱼丸远胜牛肉丸，墨鱼丸也可以买冷冻装回家煮面。炒米粉锅气十足。酸菜肚尖和沙茶牛肉较普通。人均约72刀，潮汕和广东人吃会很亲切，重口味的人可以再观望。", "dt": "2026-09-17", "c": "zh", "xy": [657.5, 336.3], "ne": "Teochew House", "te": "Teochew", "de": "Braised meat platter, guo rou (pork roll), taro paste, cuttlefish balls, fried rice vermicelli", "ie": "Highly authentic Teochew restaurant. The braised platter is excellent; swap duck for goose and it would match Chaozhou itself. The rare Teochew pork roll is authentic, and the taro paste is close, missing only a spoon of shallot oil. Cuttlefish balls far beat the beef balls and are sold frozen too. Fried rice vermicelli has great wok heat. Pickled tripe and satay beef are ordinary. About $72 per person; Teochew and Cantonese diners will feel at home.", "ae": "Chatswood"}, {"n": "重庆小面（Sho Sushi对面，未正式开业）", "a": "Lane Cove", "t": "重庆小面", "r": "3", "p": 18, "pe": 1, "d": "干馏豌杂面", "i": "Lane Cove Sho Sushi对面一家尚未正式开业的重庆小面，试营业期间已经可以吃到。", "dt": "2026-09-14", "c": "zh", "xy": [623.7, 396.1], "ne": "Chongqing Noodles (opposite Sho Sushi, soft opening)", "te": "Chongqing noodles", "de": "Dry noodles with peas and pork mince", "ie": "Chongqing noodle shop opposite Sho Sushi in Lane Cove, serving during its soft opening before the official launch.", "ae": "Lane Cove"}, {"n": "Missing Spoon（已关门）", "a": "Gordon", "t": "韩国Cafe", "r": "X", "p": 22, "pe": 1, "d": "抹茶草莓、抹茶咖啡", "i": "已于9月底关门的韩国Cafe。日式早餐的寿司明显是外面买来的现成寿司，水准不如Sushi Hub。饮品较出色，抹茶草莓和抹茶咖啡都好喝。和Wahroonga的Sofé烘焙店同一个老板，Sofé要好很多。", "dt": "2026-09-13", "c": "cafe", "xy": [584.2, 209.1], "ne": "Missing Spoon (closed)", "te": "Korean café", "de": "Matcha strawberry, matcha coffee", "ie": "Korean café that closed at the end of September. The Japanese breakfast sushi was clearly pre-made and below Sushi Hub standard. Drinks were better: matcha strawberry and matcha coffee. Same owner as Sofé bakery in Wahroonga, which is much better.", "ae": "Gordon"}, {"n": "张妈妈特色川味馆", "a": "Gordon", "t": "川菜", "r": "4", "p": 40, "pe": 1, "d": "火锅鱼、烤鱼（每年约20条活鱼需预订）、毛血旺、泡椒黄喉、回锅肉、双椒牛舌", "i": "Gordon的川菜馆，以火锅鱼和烤鱼出名。活鱼每年数量有限，需要提前预订。烤鱼又辣又香，鱼肉紧实入味，配菜豆腐、土豆和腐竹都很吸汁。辣得受不了可以加一份不辣的宫保鸡丁。", "dt": "2026-08-11", "c": "zh", "xy": [581.2, 206.3], "ne": "Mama Zhang Sichuan", "te": "Sichuan", "de": "Hotpot fish, grilled fish (limited live fish, book ahead), maoxuewang, pickled chilli aorta, twice-cooked pork, double chilli ox tongue", "ie": "Sichuan restaurant in Gordon known for hotpot fish and grilled fish. Live fish are limited, so book ahead. The grilled fish is hot and fragrant with firm, well-seasoned flesh, plus tofu, potato and bean curd sticks soaking up the sauce. Add a mild kung pao chicken if the heat gets too much.", "ae": "Gordon"}, {"n": "FIVE TWO.", "a": "Artarmon", "t": "咖啡（自家烘豆）", "r": "3", "p": 10, "pe": 1, "d": "Cold Brew", "i": "藏在一排修车行后面的仓库式咖啡店，自家烘豆，店里能看到大型烘豆机。老板一个人不慌不忙地做咖啡，很友善。Cold Brew好喝，门口晒太阳的位置很舒服。", "dt": "2026-09-12", "c": "cafe", "xy": [671.1, 377.1], "ne": "FIVE TWO.", "te": "Coffee (own roastery)", "de": "Cold brew", "ie": "Warehouse coffee shop hidden behind a row of car workshops, roasting its own beans on a big roaster. The owner makes coffee calmly and kindly. Good cold brew, and the sunny seats out front are lovely.", "ae": "Artarmon"}, {"n": "Get Sushi Omakase", "a": "Sydney Fish Market", "t": "入门Omakase", "r": "5", "p": 160, "pe": 0, "d": "Engawa、Storm Shell、海胆对比（塔州对北海道）", "i": "Fish Market里的入门级Omakase，在Sushi Oe旁边，鱼每天直接从鱼市拿，非常新鲜。每人160刀，包括一份生蚝、20贯寿司和一碗味噌汤。Engawa油脂甘甜丰腴，Storm Shell蚌肉爽滑Q弹，令人印象深刻。还有海胆盲品环节，对比塔州和北海道海胆，前者甘甜，后者Creamy。适合只想简单享受寿司、不追求漂亮饭的人，过生日还会插祝福牌。", "dt": "2026-09-10", "c": "jp", "xy": [684.2, 579.9], "ne": "Get Sushi Omakase", "te": "Entry-level omakase", "de": "Engawa, storm shell, uni comparison (Tasmania vs Hokkaido)", "ie": "Entry-level omakase inside the Sydney Fish Market next to Sushi Oe, with fish taken straight from the market each day. $160 per person for an oyster, 20 nigiri and miso soup. The engawa is sweet and rich, the storm shell smooth and bouncy. A blind uni tasting compares Tasmanian (sweet) and Hokkaido (creamy). Great for simply enjoying sushi without fuss; they even add a birthday sign.", "ae": "Sydney Fish Market"}, {"n": "Suddenly.", "a": "Surry Hills", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "Cold Brew", "i": "充满童趣的咖啡店，店里摆满各式小玩意，像一家色彩缤纷的精品店，还收藏有1960年代华语歌后姚苏蓉的黑胶唱片。Cold Brew不错，适合坐在窗边看街景。", "dt": "2026-09-10", "c": "cafe", "xy": [736.4, 618.3], "ne": "Suddenly.", "te": "Coffee", "de": "Cold brew", "ie": "Playful coffee shop packed with knick-knacks like a colourful boutique, including vinyl by 1960s Mandopop diva Yao Su-jung. Good cold brew and nice window seats for people watching.", "ae": "Surry Hills"}, {"n": "Manmaruya BBQ", "a": "Concord", "t": "日式烤肉", "r": "4", "p": 50, "pe": 0, "d": "和牛拼盘（约150刀6种）、姜葱牛舌、和牛刺身、牛肉饼", "i": "Concord的日式烤肉店，是区里的宝藏。和牛相当新鲜，约150刀的拼盘有六种肉，每种都又嫩又香；牛舌配姜葱很好吃。小菜同样出色，牛肉饼、和牛刺身、炸鸡、饺子和芝士玉米都值得点，和牛刺身和牛肉饼尤其推荐加单。人均约50刀。", "dt": "2026-09-10", "c": "jp", "xy": [457.9, 532.3], "ne": "Manmaruya BBQ", "te": "Japanese BBQ", "de": "Wagyu platter (about $150, six cuts), tongue with spring onion and ginger, wagyu sashimi, beef patty", "ie": "Hidden gem yakiniku in Concord. Very fresh wagyu: the roughly $150 platter has six cuts, all tender and flavourful, and the tongue with ginger spring onion is great. Sides shine too: beef patty, wagyu sashimi, karaage, dumplings and corn cheese; reorder the wagyu sashimi and patty. About $50 per person.", "ae": "Concord"}, {"n": "Braza Churrascaria", "a": "Darling Square", "t": "巴西烤肉", "r": "3", "p": 79, "pe": 0, "d": "Beef Rib、脆皮猪五花、烤鱼、鸡心、烤菠萝", "i": "巴西烤肉自助，气氛热烈。明火炭烤的肉串由服务员拿到桌边现切，Beef Rib、脆皮猪五花、烤鱼、鸡心和烤菠萝最好吃。周六晚上有桑巴舞表演，把气氛推向高潮。成人79刀，小孩34刀，适合一家老小聚餐。", "dt": "2026-09-06", "c": "asia", "xy": [715.8, 592.5], "ne": "Braza Churrascaria", "te": "Brazilian BBQ", "de": "Beef rib, crispy pork belly, grilled fish, chicken hearts, grilled pineapple", "ie": "Lively Brazilian churrascaria where staff carve flame-grilled skewers at your table. Beef rib, crispy pork belly, fish, chicken hearts and grilled pineapple are the best. Samba dancers perform on Saturday nights. $79 adults, $34 kids; great for a multi-generation family meal.", "ae": "Darling Square"}, {"n": "阿叔潮汕纸皮蒸饺", "a": "Redfern", "t": "潮汕蒸饺外卖", "r": "5", "p": 20, "pe": 1, "d": "海参黑松露蒸饺、虾滑时蔬、紫菜鲜肉、韭菜鲜肉、羊肉蒸饺", "i": "Redfern的潮汕薄皮蒸饺，没有招牌，有点难找，只做外卖，现包现蒸，需要稍等。和潮州本地一样皮薄如纸，鲜香多汁，灵魂是正宗的蒜头油。口味有整条海参黑松露、虾滑时蔬、紫菜鲜肉、韭菜鲜肉和特色羊肉。潮汕人会很感动，其他地方的人也值得一试。", "dt": "2026-09-05", "c": "zh", "xy": [721.1, 640.1], "ne": "Uncle's Teochew Paper-Skin Dumplings", "te": "Teochew dumplings (takeaway)", "de": "Sea cucumber black truffle, prawn and greens, seaweed pork, chive pork, lamb dumplings", "ie": "Teochew thin-skin steamed dumplings in Redfern, unsigned and a little hard to find, takeaway only and made to order. Paper-thin skins and juicy fillings just like Chaozhou, with authentic garlic oil as the soul. Fillings include whole sea cucumber with black truffle, prawn with greens, seaweed pork, chive pork and lamb. Teochew people will be moved; everyone else should try them too.", "ae": "Redfern"}, {"n": "Kim's Bop Korean Eatery", "a": "Glebe", "t": "韩国面馆", "r": "3", "p": 30, "pe": 0, "d": "牛肉辣拌乌冬、猪肉大酱拌乌冬、海苔凉拌北豆腐、Korean Tea", "i": "人气很旺的韩国面馆，建议开门前就到。牛肉辣拌乌冬和猪肉大酱拌乌冬入味浓郁，却有一丝清爽感；海苔凉拌豆腐也好吃。Korean Tea值得一试。人均约30刀，适合周末午餐。", "dt": "2026-09-05", "c": "kr", "xy": [670.6, 596.1], "ne": "Kim's Bop Korean Eatery", "te": "Korean noodles", "de": "Spicy beef udon, pork soybean paste udon, seaweed tofu salad, Korean tea", "ie": "Very popular Korean noodle bar; arrive before opening. The spicy beef and soybean pork mixed udon are rich yet somehow fresh, and the seaweed tofu salad is good. Try the Korean tea. About $30 per person, a great weekend lunch.", "ae": "Glebe"}, {"n": "Orii", "a": "Ryde（Meadowbank）", "t": "咖啡/蛋糕", "r": "3", "p": 10, "pe": 1, "d": "Iced Long Black、巧克力蛋糕", "i": "Meadowbank路边的奶黄色咖啡店，外观可爱清新。Iced Long Black出色，巧克力蛋糕普通。适合天气好的午后来喝杯下午茶。", "dt": "2026-09-04", "c": "cafe", "xy": [421.1, 399.3], "ne": "Orii", "te": "Coffee / cake", "de": "Iced long black, chocolate cake", "ie": "Cute butter-yellow café on the corner in Meadowbank. Excellent iced long black; the chocolate cake is ordinary. Nice for an afternoon coffee on a sunny day.", "ae": "Ryde（Meadowbank）"}, {"n": "Neptune's Grotto", "a": "Circular Quay", "t": "意大利地下小酒馆", "r": "3", "p": 100, "pe": 0, "d": "番茄面包、火腿泡芙、烤虾、番茄意面、隐藏菜单牛排", "i": "环形码头附近小路上的地下意式小酒馆，入口是低调的木门，里面烛光昏暗，很有氛围。前菜番茄面 lled chicken wings, braised lamb shank, Persian tea", "ie": "Persian restaurant rated 4.8 from over 2,000 reviews, full of exotic charm. The eggplant yoghurt dip with crisp bread is delicious; the chicken wings and lamb shank are richly spiced. Persian tea comes with a rock candy stick; pull it out halfway or it gets too sweet. About $27 per person, great value.", "ae": "Carlingford"}, {"n": "Infinity", "a": "Sydney Tower", "t": "旋转景观餐厅", "r": "2", "p": 200, "pe": 0, "d": "", "i": "悉尼塔上的旋转景观餐厅，可以俯瞰全城。菜品过得去但不惊艳，来这里主要为了景色和氛围。冬天建议傍晚五点左右到，能看到午后、日落和华灯初上三段景色。适合庆祝生日或带游客来，人均约200刀。", "dt": "2026-08-30", "c": "west", "xy": [734.2, 570.4], "ne": "Infinity", "te": "Revolving view restaurant", "de": "", "ie": "Revolving restaurant atop Sydney Tower with views over the whole city. The food is passable; the view and atmosphere are the point. In winter arrive around 5 pm to see afternoon, sunset and city lights. Good for birthdays or visiting friends, about $200 per person.", "ae": "Sydney Tower"}, {"n": "Four Seasons Hotel 蛋糕取货", "a": "The Rocks（四季酒店）", "t": "酒店蛋糕", "r": "3", "p": 20, "pe": 1, "d": "圣多诺黑", "i": "四季酒店的蛋糕，到店取货时有香槟和小蛋糕品尝，仪式感很强。酥皮做得出色，焦糖泡芙的外壳偏硬。", "dt": "2026-08-29", "c": "bake", "xy": [731.6, 535.5], "ne": "Four Seasons Hotel cake pickup", "te": "Hotel cake", "de": "Saint-Honoré", "ie": "Cake from the Four Seasons Hotel; pickup comes with champagne and petits gâteaux, a lovely sense of occasion. Excellent pastry, though the caramel choux shells are a little hard.", "ae": "The Rocks (Four Seasons)"}, {"n": "Park St. Diner", "a": "Pitt St, CBD", "t": "美式餐厅", "r": "3", "p": 50, "pe": 0, "d": "汉堡、牛排", "i": "The Grounds集团开的美式复古餐厅，装潢饱和温暖，很有美式小馆的感觉。汉堡很好吃，炸鸡偏干但可以接受，牛排不是高档部位，但煎得很嫩。大人小孩都适合，人均约50刀。", "dt": "2026-08-23", "c": "west", "xy": [733.3, 561.5], "ne": "Park St. Diner", "te": "American diner", "de": "Burgers, steak", "ie": "Retro American diner from The Grounds group, with warm saturated décor. The burgers are great, the fried chicken a little dry but fine, and the steak, though not a premium cut, is cooked tender. Good for adults and kids, about $50 per person.", "ae": "Pitt St, CBD"}, {"n": "EEF Coffee", "a": "Darlinghurst", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "咖啡、香肠卷", "i": "最近很火的咖啡店，层高很高，空间漂亮，不像一般的咖啡店。咖啡和香肠卷都不错，适合坐在窗边放空。附近的Theeca也可以顺便去吃Brunch。", "dt": "2026-08-23", "c": "cafe", "xy": [757.9, 595.7], "ne": "EEF Coffee", "te": "Coffee", "de": "Coffee, sausage roll", "ie": "Hot new coffee spot with soaring ceilings and a beautiful space that feels more than a café. Good coffee and sausage rolls; nice for zoning out by the window. Theeca next door is handy for brunch.", "ae": "Darlinghurst"}, {"n": "Mapo", "a": "Darlinghurst（亦有Newtown店）", "t": "意式冰淇淋", "r": "3", "p": 9, "pe": 1, "d": "黑巧加开心果、香蕉柠檬", "i": "起家于Newtown的意式冰淇淋店，现在开了好几家分店，Darlinghurst也有。口味一直很有创意，黑巧和开心果混着吃是经典组合，香蕉柠檬口味酸甜有趣。", "dt": "2026-08-23", "c": "bake", "xy": [754.9, 592.9], "ne": "Mapo", "te": "Gelato", "de": "Dark chocolate with pistachio, banana lemon", "ie": "Gelato shop that started in Newtown and now has several stores including Darlinghurst. Consistently creative flavours: dark chocolate with pistachio is the classic combo, and banana lemon is tangy and fun.", "ae": "Darlinghurst (also Newtown)"}, {"n": "Bones", "a": "Darlinghurst", "t": "居酒屋", "r": "2", "p": 30, "pe": 0, "d": "面包炸虾、炸鸡", "i": "小小的居酒屋，有午市营业。招牌面包炸虾偏油但非常香，炸鸡也炸得好。东京拉面偏咸不够浓，猪五花干拌面过甜，面类一般。胜在价格亲民，人均约30刀就能吃饱。", "dt": "2026-08-23", "c": "jp", "xy": [758.4, 601.5], "ne": "Bones", "te": "Izakaya", "de": "Bread-crumbed fried prawns, karaage", "ie": "Small izakaya open for lunch. The signature bread-crumbed prawns are oily but very tasty, and the karaage is well fried. The Tokyo ramen is salty without depth and the pork belly mazemen too sweet. Friendly prices: about $30 per person to fill up.", "ae": "Darlinghurst"}, {"n": "Chilli Basil Thai Noodle Bar", "a": "Burwood", "t": "泰国菜", "r": "4", "p": 40, "pe": 0, "d": "炸鸡翅、海鲜米粉沙拉、绿咖喱鸡、烤猪颈肉、海鲜炒粿条、腌三文鱼", "i": "Burwood主街上的高分泰国菜老店，装潢像曼谷的火车车厢。炸鸡翅、海鲜米粉沙拉拼盘、豆  the middle and a ring of corn cheese; the beef intestine pot can be finished with kimchi fried rice. About $30 per person, great value.", "ae": "Lidcombe"}, {"n": "Sluurp 樂樂鍋", "a": "Macquarie Centre", "t": "一人一锅小火锅", "r": "3", "p": 38, "pe": 0, "d": "牛舌、和牛、鞭炮笋", "i": "Macquarie Centre电影院旁边的一人一锅小火锅，锅嵌在桌面里，小朋友吃也安全。配菜从旋转带上自选，和牛等食材下单后由小火车送到座位，很有趣。牛舌和和牛都很嫩，鞭炮笋值得点。人均约38刀，很划算。", "dt": "2026-08-16", "c": "zh", "xy": [504.3, 270.0], "ne": "Sluurp", "te": "Individual hotpot", "de": "Ox tongue, wagyu, crunchy bamboo shoots", "ie": "Individual hotpot beside the Macquarie Centre cinema, with pots set into the table so it is safe for kids. Pick ingredients off a conveyor; wagyu and other orders arrive by little train. The tongue and wagyu are very tender and the crunchy bamboo shoots are worth ordering. About $38 per person, good value.", "ae": "Macquarie Centre"}, {"n": "Basak & Jogumja", "a": "Lidcombe", "t": "韩式菜包肉", "r": "3", "p": 35, "pe": 0, "d": "生菜包卤猪五花、冷面、牛骨汤", "i": "Lidcombe专做韩式菜包肉的店。卤猪五花不咸，用小火保温，肥而不腻，用生菜包上猪肉，配泡菜、酱料、蒜粒和辣椒，口感丰富。两人份套餐配一份酸甜辣口的冷面，和猪肉很搭。牛骨汤也暖胃。人均约35刀。", "dt": "2026-08-15", "c": "kr", "xy": [312.2, 545.7], "ne": "Basak & Jogumja", "te": "Korean bossam", "de": "Lettuce-wrapped braised pork belly, cold noodles, beef bone soup", "ie": "Lidcombe spot specialising in bossam. The braised pork belly is not salty and kept warm over a small flame: rich but not greasy. Wrap it in lettuce with kimchi, sauces, garlic and chilli. The set for two includes tangy spicy cold noodles that suit the pork, and the beef bone soup is warming. About $35 per person.", "ae": "Lidcombe"}, {"n": "Cafe Nemo", "a": "Lidcombe（火车站对面）", "t": "咖啡", "r": "3", "p": 10, "pe": 1, "d": "冰美式", "i": "Lidcombe火车站对面的小咖啡店，简朴不起眼，周末人少。冰美式出色，是韩国人聚居区小咖啡店的稳妥之选。", "dt": "2026-08-15", "c": "cafe", "xy": [299.8, 552.8], "ne": "Cafe Nemo", "te": "Coffee", "de": "Iced americano", "ie": "Plain little café opposite Lidcombe station, quiet on weekends. Excellent iced americano, a safe bet in this Korean neighbourhood.", "ae": "Lidcombe (opposite the station)"}, {"n": "Golden Tree Bistro 云深不知处·金小馆", "a": "Ultimo（UTS旁）", "t": "贵州羊肉粉", "r": "4", "p": 30, "pe": 0, "d": "羊肉粉、牛肉包子、炸肥肠", "i": "UTS旁边的贵州羊肉粉店。汤底浓郁，米粉嫩滑，配菜用心。肉包子透着油，渣渣牛肉馅非常好吃。全场最佳是炸肥肠，松软酥脆，一口一个停不下来。人均约30刀就能吃饱。", "dt": "2026-08-13", "c": "zh", "xy": [705.3, 602.0], "ne": "Golden Tree Bistro", "te": "Guizhou lamb noodles", "de": "Lamb rice noodles, beef buns, fried pork intestine", "ie": "Guizhou lamb noodle shop next to UTS. Rich broth, silky rice noodles and thoughtful toppings. The buns ooze with minced beef. The star is the fried intestine: soft and crisp, impossible to stop eating. About $30 per person.", "ae": "Ultimo (next to UTS)"}, {"n": "幸福屯家常菜 Happy Village Dumplings", "a": "Chatswood", "t": "东北菜", "r": "3", "p": 35, "pe": 0, "d": "排骨豆角铁锅炖（两人可点）、手工饺子、虎皮尖椒", "i": "火车站出来两分钟的东北菜馆，两个人也能点铁锅炖。排骨豆角铁锅炖里有土豆和粉条，炖十五分钟后服务员在锅边贴上玉米饼，再焖十分钟即可，软烂入味。饺子是阿姨现场手工包的，虎皮尖椒很下饭。人均约35刀，适合人少又想吃铁锅炖的时候。", "dt": "2026-08-11", "c": "zh", "xy": [661.0, 344.9], "ne": "Happy Village Dumplings", "te": "Dongbei (Northeastern)", "de": "Iron pot pork rib and bean stew (available for two), handmade dumplings, blistered chillies", "ie": "Northeastern Chinese restaurant two minutes from the station where even two people can order the iron pot stew. Pork ribs with beans, potato and glass noodles stew for 15 minutes, then corn cakes are stuck to the pot rim for 10 more: soft and deeply flavoured. Dumplings are hand-made on site and blistered chillies are great with rice. About $35 per person.", "ae": "Chatswood"}, {"n": "子路私房菜", "a": "配送外卖（无门店位置）", "t": "家常菜外卖", "r": "4", "p": 20, "pe": 1, "d": "葱烧大排、手撕鸡、猪肚鸡汤、虫草花鸡汤、麻辣香锅、红烧狮子头、咸肉菜饭", "i": "可外送的家常私房菜。", "dt": "2026-08-08", "c": "zh", "xy": null, "ne": "Zilu Private Kitchen", "te": "Home-style delivery", "de": "Braised pork chop with scallion, shredded chicken, pork tripe chicken soup, mala xiangguo, lion's head meatballs, salted pork rice", "ie": "Home-style private kitchen that delivers.", "ae": "Delivery only (no shopfront)"}, {"n": "Tre Viet", "a": "Chatswood", "t": "越南菜", "r": "3", "p": 22, "pe": 1, "d": "会安鸡饭", "i": "Chatswood的越南餐厅，会安鸡饭很好吃，每块鸡肉都带着鸡冻，懂行的广东人会很欣赏。", "dt": "2026-08-08", "c": "asia", "xy": [664.9, 333.4], "ne": "Tre Viet", "te": "Vietnamese", "de": "Hoi An chicken rice", "ie": "Vietnamese restaurant in Chatswood. The Hoi An chicken rice is excellent, each piece with chicken jelly under the skin, something Cantonese diners will appreciate.", "ae": "Chatswood"}, {"n": "福芋喜堂 Sweet Town", "a": "Eastwood", "t": "糖水铺", "r": "3", "p": 15, "pe": 0, "d": "自选糖水：椰奶底、鸭母捻、芋圆、芋泥、米麻薯、仙草冻", "i": "可以全部自选的糖水铺，从底汤到小料都自己搭配。少见地有潮州甜品鸭母捻，虽然口感偏硬，和潮州本地的不太一样。米麻薯清甜，能吃到米粒口感，最推荐。椰奶底配包心菜芋圆、芋泥和仙草冻也不错。甜度很低，适合晚上吃，但嗜甜的人会觉得太淡。人均约15刀。", "dt": "2026-08-08", "c": "bake", "xy": [397.9, 325.8], "ne": "Sweet Town", "te": "Chinese dessert soups", "de": "Build your own: coconut milk base, duck-mother dumplings, taro balls, taro paste, rice mochi, grass jelly", "ie": "Dessert soup shop where you build every bowl yourself. It even has the rare Teochew duck-mother glutinous dumplings, though firmer than in Chaozhou. The rice mochi with real rice grains is the top pick; coconut base with taro balls, taro paste and grass jelly is also good. Very low sugar, nice at night, but too plain for sweet tooths. About $15 per person.", "ae": "Eastwood"}, {"n": "Gildas", "a": "Surry Hills", "t": "巴斯克Tapas", "r": "5", "p": 80, "pe": 0, "d": "面包配伊比利亚火腿、焗蟹吐司、卷卷Chorizo", "i": "巴斯克风格的Tapas餐厅，每一道都很精彩，口味很合中国胃。面包配伊比利亚火腿开场就很好；焗蟹吐司是蟹肉拌浓稠奶油铺在酥脆吐司上，撒红椒粉，绵密浓郁；卷卷Chorizo弹牙多汁，造型可爱。八爪鱼和牛排等大份菜反而不如Tapas出色。人均约80刀，非常推荐。", "dt": "2026-08-08", "c": "west", "xy": [740.0, 626.9], "ne": "Gildas", "te": "Basque tapas", "de": "Bread with Ibérico ham, baked crab toast, coiled chorizo", "ie": "Basque tapas restaurant where every dish is excellent and very friendly to Chinese palates. Bread with Ibérico ham starts strong; the crab toast with thick cream and paprika is rich and silky; the coiled chorizo is juicy and adorable. Larger plates
