<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>评论审核 · 悉尼吃喝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141414;--red:#d6342a;--g1:#f4f3f1;--line:#e3e1dc;--sub:#77736c;--zh:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#f7f4ef;color:var(--ink);font:400 15px/1.6 var(--sans)}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(247,244,239,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;font:900 17px var(--zh)}
header a i{display:inline-block;width:12px;height:12px;background:var(--red);margin-right:8px}
header .who{margin-left:auto;font-size:12.5px;color:var(--sub);display:flex;gap:10px;align-items:center}
header .who button{border:1px solid var(--line);background:#fff;padding:4px 10px;font-size:12.5px;border-radius:8px}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font:900 24px/1.3 var(--zh);margin:6px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{border:0;background:#fff;border-radius:999px;padding:6px 14px;font-size:13.5px;color:var(--sub)}
.tabs button.on{background:var(--ink);color:#fff}
.it{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 6px 20px -16px rgba(60,40,20,.4)}
.it .sh{font:700 15px var(--zh)}
.it .t{font-size:13px;color:var(--sub);margin-top:2px}.it .t s{text-decoration:none;color:var(--red);letter-spacing:1px}
.it p{margin:8px 0 0;font:400 15px/1.75 var(--zh);white-space:pre-wrap}
.it .bt{display:flex;gap:8px;margin-top:12px}
.it .bt button{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px}
.it .bt .ok{background:#1f7a4d;color:#fff;border:0}.it .bt .del{color:var(--red)}
.empty{color:var(--sub);padding:30px 0;text-align:center}
form.card{background:#fff;border-radius:16px;padding:18px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
input{width:100%;border:0;background:var(--g1);border-radius:10px;padding:11px 12px;font:16px var(--sans)}
form button{margin-top:16px;width:100%;height:44px;border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:600}
.err{color:var(--red);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<header><a href="/eat/admin/"><i></i>照片管理</a><a href="/eat/admin/reviews/" style="font-size:15px">评论审核</a><div class="who" id="who"></div></header>
<main id="app"><div class="empty">加载中…</div></main>
<script>
const SB_URL='https://hmipkgllqnyvabcntipb.supabase.co',SB_KEY='sb_publishable_9tEEaEglzcirAP7ZRu3DCQ_Weczqod8';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={sb:null,tab:'pending',names:new Map()};
function loadSB(){return new Promise((res,rej)=>{if(window.supabase)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function init(){
  try{await loadSB()}catch(e){$('#app').innerHTML='<div class="empty">连不上服务器，检查一下网络。</div>';return}
  /* same session as the photo admin page */
  S.sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'eat-admin-auth',persistSession:true}});
  fetch('/eat/data.json').then(r=>r.json()).then(a=>{a.forEach(x=>S.names.set(x.id,x.n));if(S.rows)draw()}).catch(()=>{});
  const {data}=await S.sb.auth.getSession();setUser(data.session&&data.session.user);
}
async function setUser(u){
  $('#who').innerHTML=u?`<span>${esc(u.email||'')}</span><button id="out">退出</button>`:'';
  if(u)$('#out').onclick=async()=>{await S.sb.auth.signOut();setUser(null)};
  if(!u)return login();
  const r=await S.sb.from('admins').select('uid').eq('uid',u.id).maybeSingle();
  if(!r.data){$('#app').innerHTML='<h1>没有权限</h1><p>这个账号还不是管理员。</p>';return}
  load();
}
function login(err){
  $('#app').innerHTML=`<h1>登录</h1><form class="card" id="lf"><label>邮箱</label><input type="email" id="em" autocomplete="username" required>
  <label>密码</label><input type="password" id="pw" autocomplete="current-password" required><button>登录</button>${err?`<div class="err">${esc(err)}</div>`:''}</form>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();const {data,error}=await S.sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(error)return login('邮箱或密码不对');setUser(data.user)}
}
async function load(){
  const {data,error}=await S.sb.from('reviews').select('id,rid,name,stars,body,status,created_at').order('created_at',{ascending:false}).limit(500);
  if(error){$('#app').innerHTML=`<div class="empty">读不到评论表：${esc(error.message)}<br>先在 Supabase 运行 reviews_setup.sql。</div>`;return}
  S.rows=data;draw();
}
function draw(){
  const n=k=>S.rows.filter(r=>r.status===k).length;
  const rows=S.rows.filter(r=>r.status===S.tab);
  $('#app').innerHTML=`<h1>评论审核</h1><div class="tabs">${[['pending','待审核'],['ok','已通过'],['hidden','已隐藏']].map(([k,t])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${t} ${n(k)}</button>`).join('')}</div>
  ${rows.length?rows.map(r=>`<div class="it" data-id="${r.id}"><div class="sh">${esc(S.names.get(r.rid)||('店 #'+r.rid))}</div>
   <div class="t">${esc(r.name)} · <s>${'★'.repeat(r.stars)}</s> · ${new Date(r.created_at).toLocaleString('zh-CN',{timeZone:'Australia/Sydney'})}</div><p>${esc(r.body)}</p>
   <div class="bt">${r.status!=='ok'?'<button class="ok" data-a="ok">通过</button>':''}${r.status!=='hidden'?'<button data-a="hidden">隐藏</button>':''}<button class="del" data-a="del">删除</button></div></div>`).join(''):'<div class="empty">没有</div>'}`;
  $('#app').onclick=async e=>{
    const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;return draw()}
    const b=e.target.closest('[data-a]');if(!b)return;
    const id=+b.closest('.it').dataset.id,a=b.dataset.a;b.disabled=true;
    const q=a==='del'?S.sb.from('reviews').delete().eq('id',id):S.sb.from('reviews').update({status:a}).eq('id',id);
    const {error}=await q;if(error){alert(error.message);b.disabled=false;return}
    S.rows=a==='del'?S.rows.filter(r=>r.id!==id):S.rows.map(r=>r.id===id?{...r,status:a}:r);draw();
  };
}
init();
</script>
</body>
</html>
