:root{--ink:#141414;--red:#d6342a;--g1:#f4f3f1;--g2:#eceae6;--line:#e3e1dc;--sub:#77736c;--zh:'Noto Serif SC',serif;--sans:'Noto Sans SC',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px}
header a{color:var(--ink);text-decoration:none;font:900 18px var(--zh)}
header a i{display:inline-block;width:14px;height:14px;background:var(--red);margin-right:8px;vertical-align:-1px}
header .who{margin-left:auto;font-size:12.5px;color:var(--sub);display:flex;gap:10px;align-items:center}
header .who button{border:1px solid var(--line);background:#fff;padding:4px 10px;font-size:12.5px}
main{max-width:720px;margin:0 auto;padding:18px 16px 80px}
h1{font:900 26px/1.3 var(--zh);margin:8px 0 16px}
.card{background:var(--g1);padding:18px}
label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 4px}
input[type=email],input[type=password],input[type=search],input.cap{width:100%;height:46px;border:1px solid var(--line);background:#fff;padding:0 12px;outline:none}
input:focus{border-color:var(--ink)}
.btn{height:46px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500}
.btn.w{background:#fff;color:var(--ink)}
.btn.full{width:100%;margin-top:16px}
.btn:disabled{opacity:.45}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:1em}
.tabs{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;padding:5px 12px;font-size:13px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:12px 2px}
.row:hover{background:var(--g1)}
.row b{display:block;font:600 16px/1.35 var(--zh)}
.row span{display:block;font-size:12.5px;color:var(--sub)}
.row .n{margin-left:auto;flex:none;min-width:28px;height:24px;padding:0 8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--g2)}
.row .n.has{background:var(--ink);color:#fff}
.more{display:block;margin:14px auto 0;border:1px solid var(--line);background:#fff;padding:8px 16px;font-size:13px}
.back{border:0;background:none;padding:0;color:var(--sub);font-size:13.5px;margin-bottom:6px}
.shop h1{margin-bottom:2px}
.shop .m{color:var(--sub);font-size:13px;margin-bottom:16px}
.up{display:flex;align-items:center;justify-content:center;gap:10px;height:64px;border:1.5px dashed var(--ink);background:#fff;font-weight:500;width:100%}
.up input{display:none}
.q{margin-top:10px}
.q div{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);padding:3px 0}
.q div.e{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}
.ph{background:var(--g1);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--g2)}
.ph .cap{height:38px;border:0;border-top:1px solid var(--line);font-size:13px}
.ph .ac{display:flex;border-top:1px solid var(--line)}
.ph .ac button{flex:1;height:36px;border:0;border-left:1px solid var(--line);background:#fff;font-size:13px}
.ph .ac button:first-child{border-left:0}
.ph .ac button.del.arm{background:var(--red);color:#fff}
.ph .ac button:disabled{color:#c9c5be}
.ph .tag{font-size:11px;padding:3px 8px;background:var(--ink);color:#fff;align-self:flex-start;position:absolute}
.ph{position:relative}
.empty{color:var(--sub);font-size:14px;padding:24px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.hint{font-size:12.5px;color:var(--sub);margin-top:8px}
</style>
</head>

}
async function upload(files){
  if(!files.length)return;const rid=S.rid;
  const items=files.map(f=>({f,name:f.name||'照片',st:'等待',err:false}));S.queue.push(...items);drawQueue();
  let sort=S.photos.reduce((m,p)=>Math.max(m,p.sort),-1)+1;
  for(const x of items){
    try{
      x.st='压缩中';drawQueue();
      const big=await shrink(x.f,1600,.82),sm=await shrink(x.f,480,.74);
      const id=crypto.randomUUID(),path=`${rid}/${id}.${big.ext}`,thumb=`${rid}/${id}_t.${sm.ext}`;
      x.st=`上传中 ${Math.round((big.b.size+sm.b.size)/1024)} KB`;drawQueue();
      const o={contentType:big.b.type,cacheControl:'31536000',upsert:false};
      let r=await S.sb.storage.from('photos').upload(path,big.b,o);if(r.error)throw r.error;
      r=await S.sb.storage.from('photos').upload(thumb,sm.b,{...o,contentType:sm.b.type});if(r.error)throw r.error;
      r=await S.sb.from('photos').insert({rid,path,thumb,w:big.w,h:big.h,sort:sort++});if(r.error)throw r.error;
      x.st='好了';
    }catch(e){x.err=true;x.st=(e&&e.message)||'失败'}
    drawQueue();
    if(S.rid===rid){await loadPhotos();drawGrid()}
  }
  setTimeout(()=>{S.queue=S.queue.filter(x=>x.err);drawQueue()},2500);
}
addEventListener('hashchange',()=>{const r=+location.hash.slice(1);if(S.admin&&byId.has(r)&&r!==S.rid)openShop(r)});
init().then(()=>{const r=+location.hash.slice(1);if(S.admin&&byId.has(r))openShop(r)});
