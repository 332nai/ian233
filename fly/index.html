<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>飞行</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,800&family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16213a;--sub:#6e6a66;--hair:#e3d6c6;--acc:#e8590c;--paper:#f3e9dc;--coral:#f26b5f;--sky:#a8dcee;--lav:#d4ccf7;--cream2:#faf4ec;--disp:"Instrument Serif","Noto Serif SC",serif;--serif:"Newsreader","Noto Serif SC",serif;--sans:"Noto Sans SC",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px 60px}
header{position:sticky;top:0;z-index:20;background:rgba(243,233,220,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:0}
.hd{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font:900 26px/1 "Noto Serif SC",serif;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px}
.logo small{font:600 10.5px var(--mono);letter-spacing:.24em;color:var(--acc)}
nav{margin-left:auto;display:flex;gap:4px;border:0;background:#fff;border-radius:999px;padding:4px;box-shadow:0 6px 20px -12px rgba(22,33,58,.35)}
nav button{border:0;background:none;padding:7px 16px;border-radius:999px;font:500 13px var(--sans);letter-spacing:.12em}
nav button.on{background:var(--ink);color:#fff}
@media (max-width:560px){nav{margin-left:0;width:100%;justify-content:space-between}nav button{padding:7px 10px;flex:1}}
section{display:none;animation:fu .45s ease both}section.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{font:600 11px var(--mono);letter-spacing:.24em;color:var(--acc);margin:34px 0 6px}
h2{font:900 34px/1.2 "Noto Serif SC",serif;margin:0 0 6px;letter-spacing:.02em}
.lead{font:400 15px/1.8 var(--serif);color:var(--sub);max-width:640px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:22px}
.st{padding:16px 14px;border-right:1px solid var(--hair)}.st:last-child{border-right:0}
.st b{display:block;font:800 clamp(20px,2.2vw,28px)/1.1 var(--mono);white-space:nowrap;letter-spacing:-.02em}.st b i{font-style:normal;font-size:16px;color:var(--sub);margin-left:3px}
.st span{font:500 11px var(--sans);letter-spacing:.16em;color:var(--sub)}
.map{position:relative;margin-top:18px;border:1px solid var(--ink);border-radius:18px;overflow:hidden;background:#f4f6f9}
.map svg{display:block;width:100%;height:auto}
.map .land{fill:#dde3ea;stroke:#fff;stroke-width:.6}
.map .sph{fill:#f4f6f9}
.map .rt{fill:none;stroke:var(--acc);stroke-linecap:round;opacity:.55;transition:opacity .2s,stroke .2s}
.map .rt.dim{opacity:.08}.map .rt.hi{opacity:1;stroke:var(--ink)}
.map .ap circle{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.map .ap.hub circle{fill:var(--ink)}
.map .ap text{font:600 9px var(--mono);fill:var(--ink);paint-order:stroke;stroke:#f4f6f9;stroke-width:3px}
.map .ap.dim{opacity:.25}
.map .lg{position:absolute;left:12px;bottom:10px;font:500 11px var(--sans);color:var(--sub);background:rgba(255,255,255,.85);padding:4px 10px;border-radius:999px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;margin-top:30px}@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.h3{font:600 11px var(--mono);letter-spacing:.24em;color:var(--sub);border-top:2px solid var(--ink);padding-top:10px;margin:0 0 12px;display:flex;justify-content:space-between}
.yr{display:flex;align-items:flex-end;gap:10px;height:170px;padding-bottom:4px;border-bottom:1px solid var(--ink)}
.yr div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.yr i{display:block;width:100%;max-width:56px;background:var(--ink);border-radius:6px 6px 0 0;transform-origin:bottom;animation:gr .8s cubic-bezier(.2,.8,.2,1) both}
.yr div:nth-child(odd) i{background:var(--acc)}
@keyframes gr{from{transform:scaleY(0)}}
.yr b{font:700 13px var(--mono)}.yrl{display:flex;gap:10px}.yrl span{flex:1;text-align:center;font:500 12px var(--mono);color:var(--sub);padding-top:6px}
.rec{display:grid;gap:10px}
.rc{display:flex;align-items:center;gap:14px;border:1px solid var(--hair);border-radius:14px;padding:12px 14px}
.rc .k{font:500 11px var(--sans);letter-spacing:.14em;color:var(--sub);width:84px;flex:none}
.rc .v{font:700 15px var(--serif)}.rc .v small{display:block;font:400 12.5px var(--sans);color:var(--sub)}
/* boarding pass */
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.fil button{border:1px solid var(--ink);background:#fff;border-radius:999px;padding:5px 13px;font:600 12px var(--mono)}
.fil button.on{background:var(--ink);color:#fff}
.bp{display:grid;grid-template-columns:86px 1fr auto;align-items:center;gap:14px;border:1px solid var(--hair);border-radius:14px;padding:12px 16px;margin-bottom:8px;position:relative;background:#fff}
.bp::after{content:"";position:absolute;right:120px;top:8px;bottom:8px;border-left:1.5px dashed var(--hair)}
.bp .dt{font:600 12px var(--mono);color:var(--sub);line-height:1.4}.bp .dt b{display:block;font:800 14px var(--mono);color:var(--ink)}
.bp .rt2{display:flex;align-items:center;gap:12px;min-width:0}
.bp .c{min-width:0}.bp .c b{display:block;font:800 24px/1 var(--mono);letter-spacing:.02em}.bp .c span{font:400 12px var(--sans);color:var(--sub);white-space:nowrap}
.bp .c.r{text-align:right}
.bp .ln{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:40px;font:500 10.5px var(--mono);color:var(--sub)}
.bp .ln i{display:block;width:100%;height:1px;background:var(--ink);position:relative}.bp .ln i::after{content:"✈";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;padding:0 4px;font-size:12px;line-height:18px;font-style:normal;color:var(--acc)}
.bp .fl{width:104px;text-align:right;padding-left:14px}.bp .fl b{display:block;font:800 15px var(--mono)}.bp .fl span{font:400 11.5px var(--sans);color:var(--sub)}
@media (max-width:560px){.bp{grid-template-columns:1fr auto;gap:8px 10px}.bp .dt{grid-column:1/3;display:flex;gap:8px;align-items:baseline}.bp .dt b{display:inline}.bp::after{display:none}.bp .fl{width:auto}.bp .c b{font-size:20px}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:22px}
.card{border:1px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:fu .45s ease both}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,35,63,.12)}
.card .tp{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
.card .cd{flex:none;width:52px;height:52px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font:800 18px var(--mono)}
.card .nm b{display:block;font:700 19px/1.25 var(--serif)}.card .nm span{font:400 12px var(--sans);color:var(--sub)}
.card .ct{margin-left:auto;text-align:right}.card .ct b{display:block;font:800 26px/1 var(--mono)}.card .ct span{font:500 10px var(--sans);letter-spacing:.16em;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.tags span{font:500 11.5px var(--sans);padding:3px 9px;border-radius:999px;border:1px solid var(--hair);color:var(--ink)}
.tags span.a{border-color:var(--acc);color:var(--acc)}
.card .ft{border-top:1px dashed var(--hair);padding:10px 16px 12px;font:500 12px var(--mono);color:var(--sub);display:flex;justify-content:space-between;gap:10px}
.card .more{display:none;border-top:1px solid var(--hair);padding:8px 16px 12px}.card.open .more{display:block}
.mi{display:flex;justify-content:space-between;gap:10px;font:500 12.5px var(--mono);padding:5px 0;border-bottom:1px dotted var(--hair)}.mi span{color:var(--sub)}
.note{margin-top:18px;border-left:3px solid var(--acc);padding:8px 14px;background:#fff6f0;font:400 13.5px/1.7 var(--serif);color:var(--ink);border-radius:0 10px 10px 0}
.fam{font:900 22px "Noto Serif SC",serif;margin:30px 0 0;display:flex;align-items:baseline;gap:10px}.fam small{font:600 11px var(--mono);letter-spacing:.2em;color:var(--sub)}
.plane{padding:10px 8px 2px;background:linear-gradient(180deg,#f3f6fa 0,#fff 78%)}.plane svg{width:100%;height:auto;display:block}.khero{margin:0 -30px;padding:18px 22px 6px;background:linear-gradient(180deg,#e9eff7 0,#f7f9fc 70%,#fff)}.khero svg{width:100%;height:auto;display:block}.kfl .tot{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}.kfl .tot b{font:700 40px/1 var(--mono);color:var(--ink);letter-spacing:-.03em}.kfl .tot span{font:13px var(--sans);color:var(--sub)}.kfl .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:0 0 14px;background:#eef1f5}.kfl .bar i{display:block;height:100%}.kfl .row{display:grid;grid-template-columns:minmax(0,1.4fr) 44px minmax(0,1.6fr) 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);font:13.5px var(--sans);color:var(--ink)}.kfl .row .n{font:700 15px var(--mono);text-align:right}.kfl .row .g{height:8px;border-radius:4px;background:#eef1f5;overflow:hidden}.kfl .row .g i{display:block;height:100%;border-radius:4px}.kfl .row .o{font:12px var(--mono);color:var(--sub);text-align:right}.kfl .row em{font-style:normal;font:10px var(--mono);color:#fff;background:#6b7280;border-radius:3px;padding:1px 4px;margin-left:6px}.kfl .lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font:12px var(--sans);color:var(--sub)}.kfl .lgd i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}.kfl .src{margin-top:10px;font:11px var(--sans);color:var(--sub)}
.spec{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px dashed var(--hair);margin:0}
.spec div{padding:8px 16px;font:500 10px var(--sans);letter-spacing:.14em;color:var(--sub)}.spec div b{display:block;font:800 15px var(--mono);color:var(--ink);letter-spacing:0}
.one{padding:10px 16px 0;font:400 13.5px/1.7 var(--serif);color:#333}
.apc .cd{background:var(--ink);font-size:16px;width:60px}.cd.lgo{background:#fff;border:1px solid var(--hair);width:104px;padding:6px 8px}.cd.lgo img{max-width:100%;max-height:38px;display:block}.klogo{position:absolute;right:76px;top:24px;max-width:120px;max-height:44px}@media(max-width:560px){.klogo{display:none}}
footer{border-top:1px solid var(--ink);margin-top:50px;padding-top:12px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--sub);display:flex;justify-content:space-between}

.kbb{all:unset;cursor:pointer;font:600 11px var(--mono);letter-spacing:.12em;color:var(--acc);border:1px solid var(--acc);border-radius:99px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.kbb:hover{background:var(--acc);color:#fff}
.kbrow{display:flex;justify-content:flex-end;padding:0 18px 14px}
#kbx{position:fixed;inset:0;z-index:90;pointer-events:none}
#kbx .bg{position:absolute;inset:0;background:rgba(19,35,63,.38);opacity:0;transition:opacity .3s;backdrop-filter:blur(2px)}
#kbx .pn{position:absolute;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;border-left:1px solid var(--ink);box-shadow:-20px 0 60px rgba(19,35,63,.18)}
#kbx .pn{visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}#kbx.on .pn{visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}#kbx.on{pointer-events:auto}#kbx.on .bg{opacity:1}#kbx.on .pn{transform:none}
.kh{position:sticky;top:0;background:#fff;padding:26px 30px 20px;border-bottom:1px solid var(--ink);z-index:2}
.kh .kick{margin:0 0 8px}.kh h3{font:600 34px/1.1 var(--serif);margin:0;color:var(--ink)}.kh p{margin:6px 0 0;color:var(--sub);font:13px var(--sans)}
.kh .x{all:unset;cursor:pointer;position:absolute;top:22px;right:24px;width:36px;height:36px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:18px var(--sans)}
.kh .x:hover{background:var(--ink);color:#fff}
.kh .big{position:absolute;right:76px;top:16px;font:800 64px/1 var(--mono);color:var(--acc);opacity:.12;letter-spacing:-.04em;pointer-events:none}
.kb{padding:8px 30px 60px}
.kb h4{font:600 11px var(--mono);letter-spacing:.18em;color:var(--acc);margin:30px 0 12px;text-transform:uppercase}
.kn{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--ink);border-radius:14px;overflow:hidden;margin:4px 0 6px}
.kn div{padding:16px 12px 14px;border-right:1px solid var(--hair);font:12px var(--sans);color:var(--sub)}.kn div:last-child{border-right:0}
.kn b{display:block;font:700 clamp(18px,3vw,26px)/1.1 var(--mono);color:var(--acc);letter-spacing:-.02em;margin-bottom:6px;word-break:break-word}
.kx{margin:22px 0 0;padding:18px 20px;border-left:3px solid var(--acc);background:linear-gradient(90deg,#f3f6fb,#fff)}
.kx h5{margin:0 0 8px;font:600 18px/1.3 var(--serif);color:var(--ink)}.kx p{margin:0;font:14.5px/1.75 var(--sans);color:var(--ink)}
@media(max-width:560px){.kn{grid-template-columns:1fr 1fr}.kn div:nth-child(2){border-right:0}.kn div:nth-child(-n+2){border-bottom:1px solid var(--hair)}}
.plan{margin:18px 0 6px;background:#f7f9fb;border:1px solid var(--hair);border-radius:14px;overflow:hidden}.plan img{display:block;width:100%;height:auto;max-height:640px;object-fit:contain}.plan figcaption{padding:6px 12px;text-align:right;font:11px var(--sans)}.plan figcaption a{color:var(--sub);text-decoration:none}
.kt{display:flex;gap:4px;margin:16px -6px 0;overflow-x:auto;scrollbar-width:none}.kt::-webkit-scrollbar{display:none}
.kt button{all:unset;cursor:pointer;padding:7px 14px;border-radius:999px;font:500 13px var(--sans);color:var(--sub);white-space:nowrap}
.kt button.on{background:var(--ink);color:#fff}.kt button:not(.on):hover{color:var(--ink);background:#f1f3f6}
.kp{animation:fi .25s ease}.kp[hidden]{display:none}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kp>*:first-child{margin-top:18px}
.sheet{display:grid;gap:22px;margin-top:20px}
.sg h6{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.16em;color:var(--acc)}
.sr{display:grid;grid-template-columns:minmax(92px,34%) 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.sr span{font:13px var(--sans);color:var(--sub)}.sr b{font:500 14px/1.5 var(--sans);color:var(--ink)}
.rwr{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--hair)}
.rn{font:700 13px var(--mono);color:var(--ink)}.rb{height:6px;background:#eef1f5;border-radius:3px;overflow:hidden}.rb i{display:block;height:100%;background:var(--ink);border-radius:3px}
.rl{font:12px var(--mono);color:var(--sub);white-space:nowrap}
.yb{display:flex;align-items:flex-end;gap:4px;height:120px;padding:18px 0 0}
.yb div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.yb i{display:block;width:100%;max-width:26px;background:var(--acc);border-radius:4px 4px 0 0;position:relative}
.yb em{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font:600 10px var(--mono);color:var(--ink);font-style:normal}
.yb span{font:10px var(--mono);color:var(--sub);margin-top:5px}
.fl div{display:grid;grid-template-columns:86px 66px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font:12.5px var(--mono);color:var(--sub)}
.fl b{color:var(--ink);font-weight:700}
.note2{font:12px/1.7 var(--sans);color:var(--sub);margin-top:16px}.emp{color:var(--sub)}
.km{grid-template-columns:repeat(3,1fr)!important}
@media(max-width:560px){.fl div{grid-template-columns:78px 58px 1fr}.fl div span:last-child{display:none}.km{grid-template-columns:1fr 1fr!important}.sr{grid-template-columns:96px 1fr}}
.kf{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-left:1px solid var(--hair)}
.kf div{padding:12px 14px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);font:12px var(--sans);color:var(--sub)}
.kf b{display:block;font:600 15px/1.35 var(--sans);color:var(--ink);margin-top:4px}
.ktl{position:relative;margin:0;padding:0 0 0 22px;list-style:none}
.ktl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--ink)}
.ktl li{position:relative;padding:0 0 16px;font:14px/1.6 var(--sans);color:var(--ink)}
.ktl li:before{content:"";position:absolute;left:-21px;top:7px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.ktl b{display:block;font:700 13px var(--mono);color:var(--acc)}
.kk{display:grid;gap:10px}
.kk div{padding:14px 16px 14px 44px;position:relative;background:#f6f7f9;border-radius:12px;font:14px/1.65 var(--sans);color:var(--ink)}
.kk div:before{content:attr(data-n);position:absolute;left:14px;top:13px;font:700 12px var(--mono);color:var(--acc)}
.km{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.km div{border:1px solid var(--ink);border-radius:12px;padding:12px 14px;font:11px var(--sans);color:var(--sub)}
.km b{display:block;font:800 22px var(--mono);color:var(--ink);margin-bottom:2px}
.kl{margin-top:12px;font:13px/1.9 var(--mono);color:var(--sub)}
.ks a{display:block;color:var(--ink);font:13px/1.8 var(--sans);text-decoration:none;border-bottom:1px solid var(--hair);padding:6px 0}
.ks a:hover{color:var(--acc)}
@media(max-width:560px){.kh h3{font-size:28px}.kb,.kh{padding-left:20px;padding-right:20px}.km{grid-template-columns:1fr 1fr}.kh .big{display:none}}

/* ===== atlas theme ===== */
html{scroll-behavior:smooth}
.card{background:var(--cream2);border:0;box-shadow:0 1px 0 rgba(22,33,58,.06),0 18px 40px -28px rgba(22,33,58,.45)}
.chip{display:inline-block;font:600 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--lav);color:var(--ink)}
.chip.sky{background:var(--sky)}.chip.co{background:var(--coral);color:#fff}
.pb{display:inline-flex;align-items:center;gap:6px}
.pill{all:unset;cursor:pointer;background:#fff;color:var(--ink);font:500 13.5px var(--sans);padding:11px 20px;border-radius:999px;box-shadow:0 6px 18px -10px rgba(22,33,58,.4);transition:transform .2s}
.arw{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:600 16px var(--sans);transition:transform .25s}
.pb:hover .arw{transform:rotate(45deg)}.pb:hover .pill{transform:translateX(-2px)}
.tg{display:inline-block;border:1px solid var(--ink);border-radius:999px;padding:3px 10px;font:500 12px var(--mono);letter-spacing:.04em;margin:0 6px 6px 0;white-space:nowrap}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.01em}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
/* hero */
.hero{position:relative;margin-top:16px;border-radius:28px;overflow:hidden;background:#16213a;color:#fff;height:min(82vh,760px);min-height:520px;isolation:isolate}
.hero .hm{position:absolute;inset:-6% -4%;animation:drift 40s ease-in-out infinite alternate;z-index:-1}
.hero .hm svg{width:100%;height:100%;display:block}
.hero .hm .sph{fill:none}.hero .hm .land{fill:rgba(255,255,255,.07);stroke:none}
.hero .hm .ap circle{fill:var(--coral);stroke:none;transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
.hero .hm .ap text{display:none}
.hero .hm .ring{fill:none;stroke:var(--coral);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite;opacity:0}
@keyframes drift{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.18) translate(-3%,2%)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,33,58,0) 35%,rgba(22,33,58,.85));z-index:-1}
.hero .top{position:absolute;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center}
.hero .top .brand{font:400 26px var(--disp);letter-spacing:.06em}
.hero .bot{position:absolute;left:28px;right:28px;bottom:30px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end}
.hero h1{margin:0;font:400 clamp(46px,7.6vw,112px)/.92 var(--disp);letter-spacing:-.02em}
.hero h1 .zh{font:900 .46em/1.2 "Noto Serif SC",serif;letter-spacing:.02em;display:block;margin-top:.25em}
.hero p{margin:0 0 16px;font:400 18px/1.6 var(--serif);color:rgba(255,255,255,.86)}
/* intro */
.intro{text-align:center;padding:90px 10px 40px}
.intro h3{margin:16px auto 22px;font:400 clamp(42px,6vw,76px)/1 var(--disp);max-width:760px;letter-spacing:-.015em}
.intro h3 .zh{display:block;font:900 .5em/1.4 "Noto Serif SC",serif;letter-spacing:.06em;margin-top:.3em}
.spark{position:absolute;font:400 34px/1 var(--sans);color:var(--ink);pointer-events:none}
/* ribbons */
.ribs{position:relative;height:330px;margin:30px 0 10px calc(50% - 50vw);width:100vw;overflow:hidden}
.rib{position:absolute;left:-10%;width:120%;white-space:nowrap;display:flex;align-items:center;padding:6px 0}
.rib .tr{display:flex;align-items:center;gap:26px;animation:mq 46s linear infinite;padding-right:26px}
.rib.r2 .tr{animation-direction:reverse;animation-duration:52s}.rib.r3 .tr{animation-duration:58s}
.rib span.w{font:400 clamp(54px,8vw,92px)/1 var(--disp);letter-spacing:-.01em;color:var(--ink)}
.rib .stk{flex:none;width:clamp(58px,7vw,78px);height:clamp(58px,7vw,78px);border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(22,33,58,.5);border:3px solid rgba(255,255,255,.9)}
.rib .stk img{max-width:72%;max-height:46%}
.rib.r1{top:28px;background:var(--sky);transform:rotate(-4deg)}.rib.r2{top:132px;background:var(--lav);transform:rotate(3deg)}.rib.r3{top:228px;background:var(--coral);transform:rotate(-2deg)}
.rib.r3 span.w{color:#fff}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* entry collage */
.ent{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:60px 0 20px;position:relative}
.en{position:relative;border-radius:26px;overflow:hidden;background:var(--cream2);min-height:440px;display:flex;flex-direction:column;box-shadow:0 22px 50px -32px rgba(22,33,58,.55);cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.en:nth-child(1){transform:rotate(-1.2deg)}.en:nth-child(2){transform:translateY(34px) rotate(.8deg)}.en:nth-child(3){transform:rotate(-.6deg)}
.en:hover{transform:translateY(-6px) rotate(0)}
.en .vis{flex:1;display:grid;place-items:center;padding:22px;min-height:250px}
.en .vis.dk{background:#16213a}.en .vis.sk{background:var(--sky)}.en .vis.lv{background:var(--lav)}
.en .lgg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.en .lgg div{background:#fff;border-radius:12px;height:48px;display:grid;place-items:center;padding:6px}.en .lgg img{max-width:100%;max-height:30px}
.en .vis svg{width:100%;height:auto;max-height:240px}
.en .tx{padding:20px 22px 22px}
.en .tx h4{margin:0 0 14px;font:400 44px/1 var(--disp)}.en .tx h4 small{font:900 22px "Noto Serif SC",serif;margin-left:10px}
.en .tx p{margin:0 0 14px;color:var(--sub);font:14px/1.7 var(--sans)}
/* big numbers */
.bign{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:90px 0 10px}
.bign div{border-top:1px solid var(--ink);padding-top:12px}
.bign b{display:block;font:400 clamp(48px,6vw,76px)/1 var(--disp);letter-spacing:-.02em}
.bign span{font:500 12px var(--sans);letter-spacing:.14em;color:var(--sub)}
/* page heads */
.phead{padding:40px 0 10px}
.phead h2{font:400 clamp(56px,9vw,120px)/.95 var(--disp);letter-spacing:-.02em;margin:14px 0 10px}
.phead h2 .zh{font:900 .42em "Noto Serif SC",serif;letter-spacing:.04em;margin-left:.3em}
.phead p{margin:0;max-width:620px;color:var(--sub);font:16px/1.8 var(--serif)}
.flt{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 6px}
.flt button{all:unset;cursor:pointer;border:1px solid var(--ink);border-radius:999px;padding:7px 15px;font:500 13px var(--sans);transition:.2s}
.flt button.on{background:var(--ink);color:#fff}
/* airline cards */
.alg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:22px}
.alc{border-radius:24px;overflow:hidden;background:var(--cream2);box-shadow:0 18px 44px -30px rgba(22,33,58,.55);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.alc:hover{transform:translateY(-6px) rotate(-.4deg)}
.alc .lgv{height:150px;display:grid;place-items:center;position:relative;padding:20px 34px}
.alc .lgv img{max-width:78%;max-height:70px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4))}
.alc .lgv .iata{position:absolute;right:16px;bottom:10px;font:400 44px/1 var(--disp);color:rgba(22,33,58,.16)}
.alc .lgv .code{font:400 64px/1 var(--disp);color:#fff}
.alc .bd{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
.alc h4{margin:0 0 2px;font:900 24px/1.3 "Noto Serif SC",serif}.alc .en2{font:400 italic 18px var(--disp);color:var(--sub);margin-bottom:12px}
.alc .ft2{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px}
.alc .ft2 .fn{font:400 40px/1 var(--disp)}.alc .ft2 .fn small{font:500 11px var(--sans);letter-spacing:.12em;color:var(--sub);margin-left:6px}
@media(max-width:820px){.ent{grid-template-columns:1fr}.en:nth-child(2){transform:rotate(.8deg)}.hero .bot{grid-template-columns:1fr;gap:6px}.hero p{font-size:15.5px}.ribs{height:280px}.rib.r2{top:112px}.rib.r3{top:196px}}
@media(prefers-reduced-motion:reduce){.rib .tr,.hero .hm,.hero .hm *{animation:none!important}}
/* ===== dashboard redesign: light grey, black, lime; square everything ===== */
:root{--ink:#111;--sub:#77756f;--hair:#e2e1dc;--acc:#111;--paper:#ebebe7;--coral:#111;--sky:#d4ff3a;--lav:#f4f4f1;--cream2:#fff;--lime:#d4ff3a;--card:#fff;
 --disp:"Geist","Noto Sans SC",system-ui,sans-serif;--serif:"Geist","Noto Sans SC",system-ui,sans-serif;--sans:"Geist","Noto Sans SC",system-ui,sans-serif;--mono:"Geist Mono","JetBrains Mono",ui-monospace,monospace}
*,*::before,*::after{border-radius:0!important;font-style:normal!important}
html,body{background:var(--paper);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
/* shell: black sidebar on desktop, black top bar on phones */

.hd{max-width:none;padding:12px 16px}
.logo{font:700 20px/1 var(--sans)!important;letter-spacing:0!important;align-items:center!important;gap:10px!important}

nav{background:transparent!important;box-shadow:none!important;padding:0!important;gap:2px!important}
nav button{color:#a8a6a0!important;letter-spacing:0!important;font:500 14px var(--sans)!important;padding:8px 12px!important;position:relative}

nav button.on{background:var(--lime)!important;color:#111!important}
@media(min-width:1000px){
 header{position:fixed!important;left:0;top:0;bottom:0;width:224px;border:0!important}

 .logo{flex-wrap:wrap}.logo small{width:100%;margin-top:6px}
 nav{flex-direction:column;margin:0!important;width:100%}

 footer{margin-left:0}
}

footer{border-top:1px solid #d6d5cf!important;font:500 11px var(--mono)!important;letter-spacing:.08em!important}

.pb:hover .pill{background:#2a2a2a!important}

.tg{border:0!important;background:#f1f0ec!important;font:500 11.5px var(--mono)!important;padding:3px 8px!important}
.alc,.card{background:#fff!important;border:0!important;box-shadow:none!important}
.alc:hover,.card:hover{transform:translateY(-3px);box-shadow:0 0 0 2px #111!important}
.lgv{background:#f4f4f1!important}
.alc h4{font:700 20px var(--sans)!important}
.fn{font:600 30px var(--mono)!important}
.fam{font:700 22px var(--sans)!important}
.map{border:0!important;background:#111!important}

/* ===== overview dashboard ===== */

@media(max-width:700px){.dx-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.dx-kpi .dx-c:first-child{grid-column:span 2}.dx-g>*{grid-column:span 12!important}}
.dx-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}

.dx-go{border:0;background:#111;color:#fff;font:500 12px var(--sans);padding:6px 10px;cursor:pointer;white-space:nowrap}.dx-go:hover{background:var(--lime);color:#111}
.dx-c.blk .dx-go{background:var(--lime);color:#111}.dx-c.lim .dx-go{background:#111;color:var(--lime)}

 const fsS=[...fs].sort((a,b)=>a.d<b.d?-1:1),lng=fs.length?fs.reduce((a,b)=>b.km>a.km?b:a):null,sht=fs.length?fs.reduce((a,b)=>b.km<a.km?b:a):null;
