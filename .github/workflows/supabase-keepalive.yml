# Supabase free projects pause after a week with no requests. This pings the
# database every 3 days so photos and the group games keep working.
name: supabase keepalive
on:
  schedule:
    - cron: '23 4 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'apikey: sb_publishable_9tEEaEglzcirAP7ZRu3DCQ_Weczqod8' \
            'https://hmipkgllqnyvabcntipb.supabase.co/rest/v1/photos?select=id&limit=1')
          echo "status $code"
          test "$code" -lt 500
