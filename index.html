<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ian233</title>
<script>if(/^#(party|map|list|spin|swipe|brawl)/.test(location.hash))location.replace('/eat/app/'+location.hash)</script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;background:#f6f4ef;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
main{display:flex;gap:clamp(14px,4vw,28px);padding:24px}
a{display:flex;align-items:center;justify-content:center;width:clamp(132px,34vw,200px);aspect-ratio:1;border-radius:28px;text-decoration:none;font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:.06em;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
a:hover{transform:translateY(-4px)}
a:active{transform:scale(.97)}
.eat{background:#e8590c;color:#fff;box-shadow:0 14px 34px -14px rgba(232,89,12,.7)}
.fly{background:#13233f;color:#fff;box-shadow:0 14px 34px -14px rgba(19,35,63,.7)}
@media(prefers-color-scheme:dark){body{background:#111317}}
</style>
</head>
<body>
<main><a class="eat" href="/eat/">eat</a><a class="fly" href="/fly/">fly</a></main>
</body>
</html>
